spring.application.name=file-management
server.port=8080

# File storage configuration
file.storage.location=uploads

# Firewall configuration
firewall.enabled=true
firewall.allow-localhost=true
firewall.max-requests-per-minute=100
# firewall.whitelist[0]=192.168.1.0/24
# firewall.blacklist[0]=10.0.0.1

# Logging
logging.level.com.costdata.filemanagement=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
