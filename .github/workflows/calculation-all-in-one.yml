name: 🧮 Infinity Calculation — ETL & Mass Loading

on:
  schedule:
    - cron: '0 */4 * * *' # 4시간마다 자동 실행
  workflow_dispatch:
    inputs:
      row_count:
        description: 'Target Rows per Job (Default: 100,000 for safety, Max: 10M)'
        required: true
        default: '100000'
        type: string
      simulate_latency:
        description: 'Simulate Network Latency? (true/false)'
        required: true
        default: 'false'
        type: boolean

permissions:
  contents: read

env:
  TZ: Asia/Seoul
  LOG_DIR: calc_logs
  # 사용자가 입력한 값 또는 기본값 사용
  TARGET_ROWS: ${{ inputs.row_count || '100000' }}
  SIMULATE_LATENCY: ${{ inputs.simulate_latency || 'false' }}

jobs:
  # -----------------------------------------------------------------------------
  # Job: Massive Calculation & ETL (Extract, Transform, Load)
  # -----------------------------------------------------------------------------
  infinite-calculation:
    name: 🔥 Mass Calc & Load (Shard ${{ matrix.shard_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 최대 6시간(360분)에 근접하게 설정

    # 3개의 병렬 샤드(Shard)로 나누어 동시에 엄청난 양의 데이터를 처리
    strategy:
      fail-fast: false
      matrix:
        shard_id: [1, 2, 3]

    steps:
      # 0) 초기화
      - name: 🔧 Initialize Environment
        shell: bash
        run: |
          mkdir -p "${LOG_DIR}"
          echo "START: $(date)" > "${LOG_DIR}/status_${{ matrix.shard_id }}.log"

      # 1) 파이썬 스크립트 실행 (대용량 생성 및 적재)
      - name: 🚀 Run Infinite Generator & Multi-Service Loader
        run: |
          echo "=================================================="
          echo " Target Rows: $TARGET_ROWS"
          echo " Shard ID: ${{ matrix.shard_id }}"
          echo " Network Simulation: $SIMULATE_LATENCY"
          echo "=================================================="

          # 환경 변수 전달
          export TARGET_ROWS="${{ env.TARGET_ROWS }}"
          export SHARD_ID="${{ matrix.shard_id }}"
          export SIMULATE_LATENCY="${{ env.SIMULATE_LATENCY }}"

          python3 - <<'EOF'
          import random
          import math
          import time
          import os
          import uuid
          import json
          import sys

          # --- CONFIGURATION ---
          try:
              TOTAL_COUNT = int(os.environ.get('TARGET_ROWS', 100000))
          except:
              TOTAL_COUNT = 100000
              
          SHARD_ID = os.environ.get('SHARD_ID', '1')
          SIM_LATENCY = os.environ.get('SIMULATE_LATENCY', 'false') == 'true'
          BATCH_SIZE = 5000  # 한 번에 적재할 데이터 묶음 크기

          print(f"[*] Starting Process for {TOTAL_COUNT} rows... (Batch Size: {BATCH_SIZE})")

          # --- SERVICE MOCK CLASSES (가상 적재기) ---
          class ServiceLoader:
              def __init__(self, name):
                  self.name = name
                  self.total_loaded = 0

              def load_batch(self, batch_data):
                  # 네트워크 지연 시뮬레이션 (옵션)
                  if SIM_LATENCY:
                      time.sleep(0.05) 
                  
                  # 실제로는 여기서 DB Insert 쿼리가 실행됨
                  self.total_loaded += len(batch_data)
                  # 로그가 너무 많으면 CI가 느려지므로 5만 건마다 한 번씩만 출력
                  if self.total_loaded % 50000 == 0:
                      print(f"   Wait... [{self.name}] Committing batch... Total: {self.total_loaded}")

          # 가상의 서비스 연결
          services = {
              "PostgreSQL (RDB)": ServiceLoader("SQL-DB"),
              "MongoDB (NoSQL)": ServiceLoader("Doc-DB"),
              "Kafka (Stream)": ServiceLoader("Msg-Queue"),
              "S3 DataLake": ServiceLoader("Obj-Storage")
          }

          # --- DATA GENERATOR (메모리 절약을 위한 스트리밍) ---
          def generate_infinite_stream():
              """끝없이 계산 데이터를 생성하여 yield하는 제너레이터"""
              counter = 0
              while counter < TOTAL_COUNT:
                  counter += 1
                  
                  # 1. 고비용 수학 연산 (CPU 부하 생성)
                  val_a = random.uniform(1, 1000)
                  val_b = random.uniform(1, 1000)
                  
                  # 복잡한 계산: 로그, 삼각함수, 제곱근 혼합
                  complex_result = math.sqrt(val_a) * math.sin(val_b) + math.log(val_a + 1)
                  
                  # 2. 데이터 레코드 생성
                  record = {
                      "id": str(uuid.uuid4()),
                      "shard": SHARD_ID,
                      "timestamp": time.time(),
                      "inputs": {"a": val_a, "b": val_b},
                      "calc_result": complex_result,
                      "metadata": {
                          "type": "scientific",
                          "precision": "high",
                          "tags": ["simulation", "mass-data"]
                      }
                  }
                  yield record

          # --- MAIN PIPELINE ---
          start_time = time.time()
          batch_buffer = []
          processed_count = 0

          # 스트림에서 데이터를 하나씩 꺼내서 배치 처리
          for data_row in generate_infinite_stream():
              batch_buffer.append(data_row)

              # 배치가 꽉 차면 적재(Flush) 실행
              if len(batch_buffer) >= BATCH_SIZE:
                  for svc_name, loader in services.items():
                      loader.load_batch(batch_buffer)
                  
                  processed_count += len(batch_buffer)
                  batch_buffer = [] # 버퍼 비우기
                  
                  # 진행률 표시 (Progress Bar 효과)
                  if processed_count % 10000 == 0:
                      elapsed = time.time() - start_time
                      speed = processed_count / elapsed
                      print(f"🚀 [Shard {SHARD_ID}] Progress: {processed_count}/{TOTAL_COUNT} ({speed:.2f} rows/sec)")

          # 남은 데이터 처리
          if batch_buffer:
              for svc_name, loader in services.items():
                  loader.load_batch(batch_buffer)
              processed_count += len(batch_buffer)

          # --- FINAL SUMMARY ---
          end_time = time.time()
          duration = end_time - start_time
          
          print("\n" + "="*50)
          print(f"✅ FINAL REPORT (Shard {SHARD_ID})")
          print("="*50)
          print(f"⏱  Duration      : {duration:.2f} seconds")
          print(f"📊 Total Rows    : {processed_count}")
          print(f"⚡ Throughput    : {processed_count / duration:.2f} rows/sec")
          print("-" * 30)
          print("💾 [Storage Report]")
          for svc_name, loader in services.items():
              print(f"   -> {svc_name.ljust(20)} : {loader.total_loaded} records stored.")
          print("="*50)
          
          EOF

      # 2) 결과 확인 (간단한 로그)
      - name: 📝 Verification
        run: |
          echo "Process Completed for Shard ${{ matrix.shard_id }}"
