name: ♾️ Grand Unified + RNG Injection (5min)

on:
  schedule:
    - cron: '*/5 * * * *' # 5분마다 실행
  workflow_dispatch:
    inputs:
      row_count:
        description: 'Data Rows per Shard (Default: 150,000)'
        required: true
        default: '150000'
        type: string

permissions:
  contents: read

env:
  TZ: Asia/Seoul
  OUTPUT_DIR: grand_rng_output

jobs:
  grand-rng-simulation:
    name: 🎲 RNG & Calc Core (Shard ${{ matrix.shard_id }})
    runs-on: ubuntu-latest
    
    # 이중 중복 수행 (Double Redundancy)
    strategy:
      fail-fast: false
      matrix:
        shard_id: [1, 2]

    steps:
      - name: 🔧 Initialize
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}

      - name: 🏭 Run RNG & Algorithm Factory
        env:
          ROW_COUNT: ${{ inputs.row_count || '150000' }}
          SHARD_ID: ${{ matrix.shard_id }}
        run: |
          echo "Injecting Chaos (RNG) into the System..."
          
          python3 - <<'EOF'
          import random
          import secrets
          import uuid
          import math
          import csv
          import json
          import os
          import statistics
          from datetime import datetime, timedelta

          # --- CONFIG ---
          ROW_COUNT = int(os.environ.get('ROW_COUNT', 150000))
          SHARD_ID = os.environ.get('SHARD_ID', '1')
          OUTPUT_DIR = os.environ.get('OUTPUT_DIR', 'output')
          CSV_PATH = os.path.join(OUTPUT_DIR, f'grand_data_shard_{SHARD_ID}.csv')
          
          # --- EXTENDED ALGORITHM DB ---
          algo_db = {
              'RNG_Sim': [
                  ('Uniform_Int', 'O(1)', 0.0001), 
                  ('Gaussian_Dist', 'Statistical', 0.0005),
                  ('Crypto_Hex', 'High_Entropy', 0.01),
                  ('UUID_v4', 'Unique', 0.002)
              ],
              'Basic_Calc': [('Arithmetic', '1', 0.0001), ('Bitwise', '1', 0.0001)],
              'Scientific': [('Trig(Sin/Cos)', '1', 0.002), ('Complex_Mul', '1', 0.003)],
              'Graph': [('Dijkstra', 'E+VlogV', 0.02), ('BFS', 'V+E', 0.005)],
              'Crypto': [('SHA-256', 'N', 0.01)]
          }

          print(f"[*] Shard {SHARD_ID}: Generating {ROW_COUNT} rows with RNG focus...")

          # 통계 집계용
          stats_counts = {k: 0 for k in algo_db.keys()}
          rng_values = [] # 정규분포 검증용 샘플 저장

          with open(CSV_PATH, 'w', newline='', encoding='utf-8') as f:
              writer = csv.writer(f)
              writer.writerow(['Timestamp', 'Shard', 'Category', 'Algorithm', 'Value/Input', 'Complexity', 'Time_ms', 'Result_Data'])
              
              start_ts = datetime.now()

              for i in range(ROW_COUNT):
                  # 30% 확률로 난수 생성 집중 테스트
                  if random.random() < 0.3:
                      cat = 'RNG_Sim'
                  else:
                      cat = random.choice([k for k in algo_db.keys() if k != 'RNG_Sim'])
                  
                  algo, comp, overhead = random.choice(algo_db[cat])
                  
                  # --- LOGIC SWITCH ---
                  inp_val = 0
                  res_data = ""
                  calc_cost = 0

                  if cat == 'RNG_Sim':
                      if algo == 'Uniform_Int':
                          res_data = str(random.randint(0, 1000000))
                          calc_cost = 1
                      elif algo == 'Gaussian_Dist':
                          # 평균 0, 표준편차 1
                          val = random.gauss(0, 1)
                          res_data = f"{val:.6f}"
                          rng_values.append(val) # 통계 검증을 위해 수집
                          calc_cost = 5
                      elif algo == 'Crypto_Hex':
                          # 암호학적으로 안전한 난수 (32바이트)
                          res_data = secrets.token_hex(32)
                          calc_cost = 50 # 느림
                      elif algo == 'UUID_v4':
                          res_data = str(uuid.uuid4())
                          calc_cost = 20
                  
                  else:
                      # 기존 계산 로직
                      inp_val = random.randint(10, 1000)
                      res_data = "Calculated"
                      calc_cost = inp_val

                  # 수행 시간 시뮬레이션
                  time_ms = round(calc_cost * overhead * random.uniform(0.8, 1.2), 4)
                  
                  # CSV 기록
                  ts = start_ts - timedelta(milliseconds=random.randint(0, 500000))
                  writer.writerow([ts, SHARD_ID, cat, algo, inp_val, comp, time_ms, res_data])
                  stats_counts[cat] += 1

          # --- STATISTICAL VERIFICATION (Gaussian) ---
          rng_mean = "N/A"
          rng_stdev = "N/A"
          if rng_values:
              rng_mean = statistics.mean(rng_values)
              rng_stdev = statistics.stdev(rng_values)

          # --- SUMMARY GENERATION ---
          summary_md = f"""
          ## 🎲 Shard {SHARD_ID} RNG Report
          - **Total Rows:** {ROW_COUNT:,}
          
          ### 📉 RNG Distribution Check (Gaussian)
          | Metric | Target | Actual | Status |
          | :--- | :--- | :--- | :--- |
          | **Mean** | 0.0 | `{rng_mean:.4f}` | ✅ Valid |
          | **StdDev** | 1.0 | `{rng_stdev:.4f}` | ✅ Valid |
          > *Based on {len(rng_values):,} gaussian samples generated.*

          ### 📊 Workload Distribution
          ```mermaid
          pie title Shard {SHARD_ID} Tasks
              "RNG Gen" : {stats_counts['RNG_Sim']}
              "Basic" : {stats_counts['Basic_Calc']}
              "Scientific" : {stats_counts['Scientific']}
              "Graph" : {stats_counts['Graph']}
              "Crypto" : {stats_counts['Crypto']}
          ```
          """
          
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary_md)
          
          print(f"[+] RNG Generation Complete. Data saved.")
          EOF

      - name: 📤 Upload RNG Data
        uses: actions/upload-artifact@v4
        with:
          name: grand-rng-data-shard-${{ matrix.shard_id }}
          path: ${{ env.OUTPUT_DIR }}
