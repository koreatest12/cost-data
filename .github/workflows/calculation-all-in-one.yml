name: 📊 Infinite Calculation — Dashboard & Data Factory

on:
  schedule:
    - cron: '0 9 * * *' # 매일 아침 9시 리포트 생성
  workflow_dispatch:
    inputs:
      row_count:
        description: 'Number of rows to generate (Max: 1,000,000)'
        required: true
        default: '50000'
        type: string

permissions:
  contents: read

env:
  TZ: Asia/Seoul
  OUTPUT_DIR: output_data
  CSV_FILE: calculation_raw_data.csv
  HTML_FILE: dashboard.html

jobs:
  dashboard-generation:
    name: 🚀 Gen Data & Dashboard
    runs-on: ubuntu-latest

    steps:
      # 1) 환경 설정
      - name: 🔧 Initialize
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          echo "Output Directory Created: ${{ env.OUTPUT_DIR }}"

      # 2) 파이썬: 데이터 생성 + 대시보드 빌드
      - name: 🏭 Data Factory & Dashboard Builder
        env:
          ROW_COUNT: ${{ inputs.row_count || '50000' }}
        run: |
          echo "Processing ${ROW_COUNT} rows..."
          
          # Python 스크립트 시작
          python3 - <<'EOF'
          import random
          import math
          import time
          import csv
          import json
          import os
          from datetime import datetime, timedelta

          # --- 설정 ---
          ROW_COUNT = int(os.environ.get('ROW_COUNT', 50000))
          OUTPUT_DIR = os.environ.get('OUTPUT_DIR', 'output_data')
          CSV_PATH = os.path.join(OUTPUT_DIR, os.environ.get('CSV_FILE', 'data.csv'))
          HTML_PATH = os.path.join(OUTPUT_DIR, os.environ.get('HTML_FILE', 'index.html'))
          
          print(f"[*] Starting Generation: {ROW_COUNT} rows")

          # --- 1. 데이터 생성 (Data Generation) ---
          data_rows = []
          start_time = datetime.now()
          
          categories = ['Scientific', 'Financial', 'Crypto', 'Physics']
          status_types = ['Success', 'Success', 'Success', 'Warning', 'Fail'] # 확률 조정

          # CSV 헤더 작성
          with open(CSV_PATH, 'w', newline='', encoding='utf-8') as f:
              writer = csv.writer(f)
              writer.writerow(['Timestamp', 'Category', 'Input_A', 'Input_B', 'Result', 'Latency_ms', 'Status'])

              # 대량 데이터 생성 루프
              for i in range(ROW_COUNT):
                  # 가짜 시간 흐름 (최근 24시간)
                  ts = start_time - timedelta(seconds=random.randint(0, 86400))
                  category = random.choice(categories)
                  val_a = round(random.uniform(1, 100), 2)
                  val_b = round(random.uniform(1, 100), 2)
                  
                  # 계산 로직 시뮬레이션
                  if category == 'Scientific':
                      res = math.sin(val_a) * val_b
                  elif category == 'Financial':
                      res = val_a * val_b * 1.1 # 이자율
                  else:
                      res = (val_a + val_b) / 2
                  
                  latency = random.randint(5, 500) # 처리 속도
                  if latency > 400: status = 'Fail'
                  elif latency > 200: status = 'Warning'
                  else: status = 'Success'

                  row = [ts.strftime("%Y-%m-%d %H:%M:%S"), category, val_a, val_b, round(res, 4), latency, status]
                  
                  # CSV에 바로 쓰기 (메모리 절약)
                  writer.writerow(row)
                  
                  # 대시보드용 데이터는 메모리에 일부 보관
                  data_rows.append({
                      'ts': ts, 
                      'cat': category, 
                      'lat': latency, 
                      'stat': status
                  })

          print(f"[+] CSV File Generated: {CSV_PATH}")

          # --- 2. 대시보드용 데이터 가공 (Aggregation & Sampling) ---
          # 브라우저 성능을 위해 차트용 데이터는 샘플링하거나 집계해야 함
          
          # A) 카테고리별 카운트 (Pie Chart)
          cat_counts = {c: 0 for c in categories}
          for r in data_rows:
              cat_counts[r['cat']] += 1
          
          # B) 상태별 카운트 (Doughnut Chart)
          stat_counts = {'Success': 0, 'Warning': 0, 'Fail': 0}
          for r in data_rows:
              stat_counts[r['stat']] += 1

          # C) 시계열 지연시간 (Line Chart) - 데이터가 너무 많으므로 1/100 샘플링
          sorted_rows = sorted(data_rows, key=lambda x: x['ts'])
          sample_rate = max(1, len(sorted_rows) // 200) # 점 200개 정도로 제한
          timeline_labels = [r['ts'].strftime("%H:%M") for r in sorted_rows[::sample_rate]]
          timeline_data = [r['lat'] for r in sorted_rows[::sample_rate]]

          # --- 3. HTML 대시보드 생성 (Template Injection) ---
          html_content = f"""
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Calculation Analytics Dashboard</title>
              <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
              <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
              <style>
                  body {{ background-color: #f8f9fa; padding: 20px; }}
                  .card {{ margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }}
                  .header {{ margin-bottom: 30px; text-align: center; }}
                  .download-btn {{ text-align: right; margin-bottom: 20px; }}
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h1>🧮 Calculation Data Dashboard</h1>
                      <p class="text-muted">Generated by GitHub Actions | Total Rows: {ROW_COUNT}</p>
                      <p>Report Date: {datetime.now().strftime("%Y-%m-%d %H:%M:%S")}</p>
                  </div>

                  <div class="download-btn">
                      <a href="{os.environ.get('CSV_FILE', 'data.csv')}" class="btn btn-primary">📥 Download Raw CSV Data</a>
                  </div>

                  <div class="row">
                      <div class="col-md-4">
                          <div class="card text-center text-success p-3">
                              <h3>{stat_counts['Success']}</h3>
                              <span>Successful Calcs</span>
                          </div>
                      </div>
                      <div class="col-md-4">
                          <div class="card text-center text-warning p-3">
                              <h3>{stat_counts['Warning']}</h3>
                              <span>Slow Warning</span>
                          </div>
                      </div>
                      <div class="col-md-4">
                          <div class="card text-center text-danger p-3">
                              <h3>{stat_counts['Fail']}</h3>
                              <span>Failed/Timeout</span>
                          </div>
                      </div>
                  </div>

                  <div class="row">
                      <div class="col-md-6">
                          <div class="card p-3">
                              <h5>📊 Calculation Distribution (Category)</h5>
                              <canvas id="categoryChart"></canvas>
                          </div>
                      </div>
                      <div class="col-md-6">
                          <div class="card p-3">
                              <h5>🚦 System Status Ratio</h5>
                              <canvas id="statusChart"></canvas>
                          </div>
                      </div>
                  </div>

                  <div class="row">
                      <div class="col-12">
                          <div class="card p-3">
                              <h5>📈 Latency Trend (Sampled)</h5>
                              <canvas id="lineChart"></canvas>
                          </div>
                      </div>
                  </div>
              </div>

              <script>
                  // 1. Category Chart
                  new Chart(document.getElementById('categoryChart'), {{
                      type: 'bar',
                      data: {{
                          labels: {json.dumps(list(cat_counts.keys()))},
                          datasets: [{{
                              label: 'Count',
                              data: {json.dumps(list(cat_counts.values()))},
                              backgroundColor: ['#36a2eb', '#ff6384', '#4bc0c0', '#ff9f40']
                          }}]
                      }}
                  }});

                  // 2. Status Chart
                  new Chart(document.getElementById('statusChart'), {{
                      type: 'doughnut',
                      data: {{
                          labels: {json.dumps(list(stat_counts.keys()))},
                          datasets: [{{
                              data: {json.dumps(list(stat_counts.values()))},
                              backgroundColor: ['#4caf50', '#ffc107', '#f44336']
                          }}]
                      }}
                  }});

                  // 3. Line Chart (Latency)
                  new Chart(document.getElementById('lineChart'), {{
                      type: 'line',
                      data: {{
                          labels: {json.dumps(timeline_labels)},
                          datasets: [{{
                              label: 'Latency (ms)',
                              data: {json.dumps(timeline_data)},
                              borderColor: '#6610f2',
                              tension: 0.1,
                              fill: false
                          }}]
                      }},
                      options: {{
                          responsive: true,
                          interaction: {{ mode: 'index', intersect: false }}
                      }}
                  }});
              </script>
          </body>
          </html>
          """

          with open(HTML_PATH, 'w', encoding='utf-8') as f:
              f.write(html_content)
          
          print(f"[+] Dashboard Generated: {HTML_PATH}")
          EOF

      # 3) 결과물 업로드 (HTML + CSV)
      - name: 📤 Upload Dashboard & Data
        uses: actions/upload-artifact@v4
        with:
          name: calculation-dashboard-report
          path: ${{ env.OUTPUT_DIR }}
