name: "⚡ Universal Reactor: Analyze, Merge & Cleanup"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  # -------------------------------------------------------------
  # JOB 1: 데이터 분할 분석 및 자동 병합 (Parallel Processing)
  # -------------------------------------------------------------
  analyze-and-process:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' # 봇이 만든 PR만 처리
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 🔍 데이터 분할 분석 및 리포트 작성
        uses: actions/github-script@v7
        with:
          script: |
            // 변경된 파일 목록 가져오기 (API 호출)
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const filenames = files.map(f => f.filename);
            
            // 카테고리 분류 로직
            const categories = {
              'Infra & Cloud': filenames.filter(f => f.match(/(Dockerfile|\.tf|workflow)/)),
              'Backend (Java/Py/Go)': filenames.filter(f => f.match(/(pom\.xml|gradle|requirements|go\.mod)/)),
              'Frontend (JS)': filenames.filter(f => f.match(/(package\.json|yarn\.lock)/))
            };

            let body = '### ⚡ Auto-Analysis Report\n\n';
            for (const [cat, items] of Object.entries(categories)) {
              if (items.length > 0) {
                body += `**📂 ${cat}**\n`;
                items.forEach(i => body += `- \`${i}\`\n`);
              }
            }
            body += '\n> 이 PR은 시스템에 의해 **자동 분석** 및 **처리 대기 중**입니다.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: 🤖 자동 병합 (Auto-Merge)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}

  # -------------------------------------------------------------
  # JOB 2: 실행 흔적 즉시 삭제 (Self-Destruct)
  # -------------------------------------------------------------
  cleanup-traces:
    needs: analyze-and-process
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 🧹 워크플로우 로그 삭제
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
