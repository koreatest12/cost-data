name: 🕸️ Graph & Algorithm Visualization (Summary)

on:
  workflow_dispatch:
    inputs:
      row_count:
        description: 'Total Log Count (Default: 300,000)'
        required: true
        default: '300000'
        type: string

permissions:
  contents: read

env:
  TZ: Asia/Seoul
  OUTPUT_DIR: graph_algo_output

jobs:
  graph-simulation-summary:
    name: 🚀 Gen Data & Visualize
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔧 Initialize
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}

      - name: 🏭 Run Simulation & Write Summary
        env:
          ROW_COUNT: ${{ inputs.row_count || '300000' }}
        run: |
          echo "Generating Data & Summary..."
          
          python3 - <<'EOF'
          import random
          import math
          import csv
          import json
          import os
          from datetime import datetime, timedelta

          # --- CONFIG ---
          ROW_COUNT = int(os.environ.get('ROW_COUNT', 300000))
          OUTPUT_DIR = os.environ.get('OUTPUT_DIR', 'output')
          CSV_PATH = os.path.join(OUTPUT_DIR, 'graph_data.csv')
          
          # --- ALGO DB ---
          algo_db = {
              'Graph': [('BFS', 'V+E', 0.005), ('DFS', 'V+E', 0.005), ('Dijkstra', 'E+VlogV', 0.02), ('Bellman-Ford', 'VE', 0.001)],
              'Sorting': [('Quick Sort', 'NlogN', 0.002), ('Merge Sort', 'NlogN', 0.003)],
              'Search': [('Binary Search', 'logN', 0.001)]
          }

          # --- DATA GENERATION & STATS ---
          stats_cat = {'Graph': 0, 'Sorting': 0, 'Search': 0}
          stats_algo_time = {} # {algo_name: [times...]}
          
          print(f"[*] Simulating {ROW_COUNT} rows...")

          with open(CSV_PATH, 'w', newline='', encoding='utf-8') as f:
              writer = csv.writer(f)
              writer.writerow(['Category', 'Algorithm', 'V', 'E', 'Time_ms'])
              
              for _ in range(ROW_COUNT):
                  # Logic (Simplified for brevity)
                  if random.random() < 0.7:
                      cat = 'Graph'
                      algo, form, overhead = random.choice(algo_db['Graph'])
                      V = random.randint(10, 500)
                      E = V * random.randint(1, 5)
                      calc = (V+E) * overhead * random.uniform(0.8, 1.2)
                  else:
                      cat = random.choice(['Sorting', 'Search'])
                      algo, form, overhead = random.choice(algo_db[cat])
                      V = random.randint(100, 1000)
                      E = 0
                      calc = V * overhead * random.uniform(0.8, 1.2)

                  time_ms = round(calc, 4)
                  writer.writerow([cat, algo, V, E, time_ms])
                  
                  # Stats Aggregation
                  stats_cat[cat] += 1
                  if algo not in stats_algo_time: stats_algo_time[algo] = []
                  stats_algo_time[algo].append(time_ms)

          # --- GENERATE GITHUB JOB SUMMARY (MARKDOWN) ---
          # 1. Calculate Averages
          avg_times = {k: sum(v)/len(v) for k, v in stats_algo_time.items()}
          sorted_algos = sorted(avg_times.items(), key=lambda item: item[1], reverse=True)

          # 2. Construct Markdown
          summary_md = f"""
          # 📊 Algorithm Performance Summary
          
          **Simulation Report**
          - **Total Records:** {ROW_COUNT:,}
          - **Generated At:** {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}
          
          ---
          
          ### 1️⃣ Category Distribution (Pie Chart)
          
          ```mermaid
          pie title Task Distribution
              "Graph Algo" : {stats_cat['Graph']}
              "Sorting" : {stats_cat['Sorting']}
              "Search" : {stats_cat['Search']}
          ```
          
          ### 2️⃣ Performance Rankings (Avg Time)
          
          | Rank | Algorithm | Avg Time (ms) | Complexity |
          | :---: | :--- | :---: | :--- |
          """
          
          for idx, (name, t) in enumerate(sorted_algos):
              icon = "🥇" if idx==0 else "🥈" if idx==1 else "🥉" if idx==2 else str(idx+1)
              # Guess complexity for display
              comp = "Unknown"
              for cat in algo_db:
                  for a in algo_db[cat]:
                      if a[0] == name: comp = a[1]
              
              summary_md += f"| {icon} | **{name}** | `{t:.4f} ms` | *O({comp})* |\n"
          
          summary_md += """
          ---
          
          ### 3️⃣ Graph Topology Insights
          > Note: Graph algorithms (BFS, Dijkstra) show higher variance due to Edge(E) density.
          
          <details>
          <summary>🔍 Click to see RAW JSON sample</summary>
          
          ```json
          {
            "sample_node": {"id": 1, "label": "Node_Start"},
            "sample_edge": {"source": 1, "target": 5, "weight": 10},
            "meta": {"total_nodes": "Variable", "density": "Random"}
          }
          ```
          </details>
          """

          # 3. Write to GitHub Environment File
          # This puts the content directly onto the Summary page
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary_md)
              
          print("[+] Summary Generated to GITHUB_STEP_SUMMARY")
          EOF

      - name: 📤 Upload Full Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graph-algorithm-report
          path: ${{ env.OUTPUT_DIR }}
