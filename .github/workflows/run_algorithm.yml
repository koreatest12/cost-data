name: 🏢 세금 마스터 시스템 (대량 시뮬레이션 & 스트레스 테스트)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  master-processing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 메인 시스템 체크아웃
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # [Step 1] 리얼 데이터 스캔 준비
      # ----------------------------------------------------------------------
      - name: 📥 실데이터 마이그레이션 (koreatest12/cost-data)
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: app_root/cost_data
          fetch-depth: 0 

      - name: 🔧 파일 권한 및 환경 설정
        run: chmod -R 755 app_root/cost_data
          
      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # ----------------------------------------------------------------------
      # [Step 2] 프로젝트 생성 (시뮬레이터 탑재)
      # ----------------------------------------------------------------------
      - name: 🛠️ generate_full_project.py 생성
        run: |
          cat <<EOF > generate_full_project.py
          import os

          # ==============================================================================
          # [1] 설정 및 라이브러리
          # ==============================================================================
          REQ_TXT = """
          flask
          pandas
          openpyxl
          pdfplumber
          tabulate
          faker
          numpy
          """

          DOCKERFILE = """
          FROM python:3.9-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY . .
          RUN chmod -R 755 cost_data
          EXPOSE 8080
          CMD ["python", "app.py"]
          """

          # ==============================================================================
          # [2] 하이브리드 엔진 (Real Data + Massive Simulation)
          # ==============================================================================
          ENGINE_PY = r'''
          import os, glob, json, re, random, time
          import pandas as pd
          import pdfplumber
          from collections import defaultdict
          from tabulate import tabulate

          DATA_DIR = 'cost_data'
          RECEIPT_DIR = 'receipts'

          # 데이터베이스 구조
          db = defaultdict(lambda: {
              'salary': 0, 'pension': 0, 'insurance': 0,
              'medical': 0, 'card': 0, 'donation': 0,
              'pre_paid': 0, 'files': set(), 'dependents': 1,
              'source': 'REAL' # REAL or SIMULATION
          })

          # -------------------------------------------------------
          # [Module 1] 파일 파싱 (Real Data)
          # -------------------------------------------------------
          def extract_number(text, keywords, min_value=0):
              best_val = 0
              for key in keywords:
                  matches = re.finditer(key + r'[^0-9\n]*([0-9,]+)', text)
                  for match in matches:
                      try:
                          val = int(match.group(1).replace(',', ''))
                          if val >= min_value: best_val = max(best_val, val)
                      except: pass
              return best_val

          def migrate_real_data():
              search_path = os.path.join(DATA_DIR, '**', '*')
              all_files = [f for f in glob.glob(search_path, recursive=True) if os.path.isfile(f)]
              print(f">>> [Real Data] Scanning {len(all_files)} files...")

              for filepath in all_files:
                  try:
                      fname = os.path.basename(filepath)
                      _, ext = os.path.splitext(filepath)
                      ext = ext.lower()
                      name = None
                      
                      if ext == '.json':
                          with open(filepath, 'r', encoding='utf-8') as f:
                              js = json.load(f)
                              name = js.get('name')
                              if name:
                                  db[name]['salary'] = max(db[name]['salary'], int(js.get('total_salary', 0)))
                                  db[name]['card'] += int(js.get('credit', 0))
                      elif ext in ['.xlsx', '.xls']:
                          df = pd.read_excel(filepath)
                          row = df.iloc[0]
                          for col in ['name', '성명', '이름']:
                              if col in df.columns: name = row[col]; break
                          if name:
                              if 'total_salary' in row: db[name]['salary'] = max(db[name]['salary'], int(row['total_salary']))
                              if 'credit' in row: db[name]['card'] += int(row['credit'])
                      elif ext == '.pdf':
                          with pdfplumber.open(filepath) as pdf:
                              text = "".join([p.extract_text() or "" for p in pdf.pages])
                              nm_match = re.search(r'성\s*명\s*[:]?\s*([가-힣]{2,4})', text)
                              if nm_match: name = nm_match.group(1)
                              else:
                                  nm_file = re.match(r'([가-힣]{2,4})', fname)
                                  if nm_file: name = nm_file.group(1)
                              if name:
                                  salary = extract_number(text, ['총급여'], 1000000)
                                  if salary > 0: db[name]['salary'] = max(db[name]['salary'], salary)
                                  db[name]['card'] += extract_number(text, ['신용카드'])
                                  db[name]['insurance'] += extract_number(text, ['보장성', '보험료'])
                      if name: db[name]['files'].add(fname)
                  except: pass

          # -------------------------------------------------------
          # [Module 2] 대량 시뮬레이션 생성기 (Massive Simulation)
          # -------------------------------------------------------
          class SimulationGenerator:
              @staticmethod
              def run(count=1000):
                  print(f">>> [Simulation] Generating {count} virtual scenarios...")
                  
                  # 시나리오 분포 정의
                  scenarios = [
                      ('Junior', 30000000, 45000000, 1),    # 사회초년생
                      ('Manager', 50000000, 80000000, 3),   # 과장급 (가족포함)
                      ('Senior', 90000000, 150000000, 4),   # 부장/임원
                      ('Rich', 200000000, 1000000000, 2)    # 고소득자
                  ]
                  
                  for i in range(count):
                      # 랜덤 시나리오 선택 (가중치 부여)
                      stype, min_s, max_s, base_fam = random.choices(scenarios, weights=[40, 40, 15, 5])[0]
                      
                      sim_name = f"Sim_{stype}_{i:04d}"
                      salary = random.randint(min_s, max_s)
                      dependents = base_fam + random.randint(0, 2)
                      
                      # 소비 패턴 시뮬레이션
                      card_usage = int(salary * random.uniform(0.1, 0.4))
                      medical = int(salary * random.uniform(0.0, 0.1)) if random.random() > 0.7 else 0
                      donation = int(salary * 0.1) if stype == 'Rich' else 0
                      
                      db[sim_name] = {
                          'salary': salary,
                          'pension': int(salary * 0.045),
                          'insurance': random.randint(500000, 2000000),
                          'medical': medical,
                          'card': card_usage,
                          'donation': donation,
                          'pre_paid': int(salary * random.uniform(0.03, 0.15)), # 기납부도 랜덤
                          'files': {f"virtual_data_{i}.dat"},
                          'dependents': dependents,
                          'source': 'SIMULATION'
                      }

          # -------------------------------------------------------
          # [Module 3] 세금 계산 엔진 (공통)
          # -------------------------------------------------------
          class TaxEngine:
              @staticmethod
              def calculate(data):
                  salary = data['salary']
                  if salary == 0: return None

                  # 1. 소득공제
                  if salary <= 5000000: income_ded = salary * 0.7
                  elif salary <= 15000000: income_ded = 3500000 + (salary - 5000000) * 0.4
                  elif salary <= 45000000: income_ded = 7500000 + (salary - 15000000) * 0.15
                  elif salary <= 100000000: income_ded = 12000000 + (salary - 45000000) * 0.05
                  else: income_ded = 14750000 + (salary - 100000000) * 0.02
                  
                  personal_ded = data['dependents'] * 1500000
                  card_ded = min(max((data['card'] - salary*0.25) * 0.15, 0), 3000000)
                  
                  tax_base = max(salary - income_ded - personal_ded - data['pension'] - card_ded - data['donation'], 0)

                  # 2. 산출세액 (누진세율)
                  if tax_base <= 14000000: calc_tax = tax_base * 0.06
                  elif tax_base <= 50000000: calc_tax = 840000 + (tax_base - 14000000) * 0.15
                  elif tax_base <= 88000000: calc_tax = 6240000 + (tax_base - 50000000) * 0.24
                  elif tax_base <= 150000000: calc_tax = 15360000 + (tax_base - 88000000) * 0.35
                  elif tax_base <= 300000000: calc_tax = 37060000 + (tax_base - 150000000) * 0.38
                  else: calc_tax = 94060000 + (tax_base - 300000000) * 0.40
                  
                  # 3. 세액공제
                  credits = min(data['insurance'], 1000000)*0.12 + max(data['medical']-salary*0.03, 0)*0.15
                  determined = max(calc_tax - credits, 0)
                  
                  final = int(determined - data['pre_paid'])
                  
                  return {
                      "tax_base": int(tax_base),
                      "determined": int(determined),
                      "final": final
                  }

          def generate_receipt(r):
              if r['source'] == 'SIMULATION' and random.random() > 0.01: return # 시뮬레이션은 1%만 영수증 생성 (속도 최적화)
              
              res = r['result']
              color = "blue" if res['final'] < 0 else "red"
              html = f"<html><body><h2>{r['name']} 영수증</h2><h1 style='color:{color}'>{res['final']:,} 원</h1></body></html>"
              with open(os.path.join(RECEIPT_DIR, f"{r['name']}.html"), "w", encoding="utf-8") as f: f.write(html)

          def run_engine():
              # 1. Real Data Scan
              migrate_real_data()
              
              # 2. Massive Simulation (1,000 ~ 5,000 cases)
              SimulationGenerator.run(count=1200) 
              
              results = []
              start_time = time.time()
              
              print(">>> [Engine] Calculating Taxes...")
              for name, data in db.items():
                  if not name: continue
                  if data['salary'] == 0: data['salary'] = 40000000 # Default fallback
                  
                  calc = TaxEngine.calculate(data)
                  
                  entry = {
                      "name": name,
                      "salary": data['salary'],
                      "dependents": data['dependents'],
                      "source": data['source'],
                      "result": calc,
                      "final_money": calc['final'],
                      "files_count": len(data['files'])
                  }
                  generate_receipt(entry)
                  results.append(entry)
                  
              elapsed = time.time() - start_time
              print(f">>> [Performance] Processed {len(results)} items in {elapsed:.4f}s")
              
              return results

          if __name__ == "__main__":
              res = run_engine()
              with open('final_result.json', 'w', encoding='utf-8') as f: json.dump(res, f, ensure_ascii=False)
              print(f"Total Records: {len(res)}")
          '''

          # ==============================================================================
          # [3] 통합 대시보드 (Simulation Analytics)
          # ==============================================================================
          APP_PY = r'''
          from flask import Flask, render_template_string, send_from_directory
          import json, os
          app = Flask(__name__)

          @app.route('/')
          def index():
              try:
                  with open('final_result.json', 'r', encoding='utf-8') as f: results = json.load(f)
              except: results = []
              
              # 데이터 분리 (Real vs Sim)
              real_data = [r for r in results if r['source'] == 'REAL']
              sim_data = [r for r in results if r['source'] == 'SIMULATION']
              
              total_refund = sum([abs(r['final_money']) for r in results if r['final_money'] < 0])
              total_collect = sum([r['final_money'] for r in results if r['final_money'] >= 0])
              
              # 소득 구간별 분포 (시뮬레이션 포함)
              ranges = {"3천이하":0, "3천~7천":0, "7천~1.5억":0, "1.5억이상":0}
              for r in results:
                  s = r['salary']
                  if s <= 30000000: ranges["3천이하"] += 1
                  elif s <= 70000000: ranges["3천~7천"] += 1
                  elif s <= 150000000: ranges["7천~1.5억"] += 1
                  else: ranges["1.5억이상"] += 1

              html = """
              <!DOCTYPE html>
              <html>
              <head>
                  <title>Tax Master Simulation</title>
                  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
                  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
              </head>
              <body class="bg-light p-4">
                  <div class="container-fluid">
                      <div class="d-flex justify-content-between align-items-center mb-4">
                          <h2 class="fw-bold">🏢 Tax Master Pro <span class="badge bg-danger">Simulation Mode</span></h2>
                          <div>
                              <span class="badge bg-primary fs-6 me-2">Real: {{ real_len }}건</span>
                              <span class="badge bg-success fs-6">Simulated: {{ sim_len }}건</span>
                          </div>
                      </div>

                      <div class="row g-3 mb-4">
                          <div class="col-md-3"><div class="card p-3 shadow-sm border-start border-5 border-primary"><h5>총 처리 건수</h5><h3>{{ total_len }} Case</h3></div></div>
                          <div class="col-md-3"><div class="card p-3 shadow-sm border-start border-5 border-success"><h5>예상 환급액</h5><h3>{{ "{:,}".format(total_refund) }}</h3></div></div>
                          <div class="col-md-3"><div class="card p-3 shadow-sm border-start border-5 border-danger"><h5>예상 징수액</h5><h3>{{ "{:,}".format(total_collect) }}</h3></div></div>
                          <div class="col-md-3"><div class="card p-3 shadow-sm border-start border-5 border-warning"><h5>스트레스 테스트</h5><h3>PASS ✅</h3></div></div>
                      </div>

                      <div class="row mb-4">
                          <div class="col-md-8">
                              <div class="card p-4 shadow-sm h-100">
                                  <h5>📈 소득 구간별 시뮬레이션 분포</h5>
                                  <canvas id="distChart" height="100"></canvas>
                              </div>
                          </div>
                          <div class="col-md-4">
                              <div class="card p-4 shadow-sm h-100">
                                  <h5>⚖️ 환급 vs 징수 비율</h5>
                                  <canvas id="ratioChart" height="200"></canvas>
                              </div>
                          </div>
                      </div>

                      <ul class="nav nav-tabs" id="myTab" role="tablist">
                          <li class="nav-item"><a class="nav-link active" id="real-tab" data-bs-toggle="tab" href="#real">📁 실데이터 ({{ real_len }})</a></li>
                          <li class="nav-item"><a class="nav-link" id="sim-tab" data-bs-toggle="tab" href="#sim">🎲 시뮬레이션 ({{ sim_len }})</a></li>
                      </ul>
                      
                      <div class="tab-content bg-white p-3 border border-top-0 shadow-sm" id="myTabContent">
                          <div class="tab-pane fade show active" id="real">
                              <table class="table table-hover">
                                  <thead><tr><th>이름</th><th>연봉</th><th>결과</th><th>금액</th><th>증빙</th></tr></thead>
                                  <tbody>
                                      {% for r in real_data %}
                                      <tr>
                                          <td class="fw-bold">{{ r.name }}</td><td>{{ "{:,}".format(r.salary) }}</td>
                                          <td><span class="badge bg-{{ 'primary' if r.final_money < 0 else 'danger' }}">{{ '환급' if r.final_money < 0 else '징수' }}</span></td>
                                          <td>{{ "{:,}".format(abs(r.final_money)) }}</td>
                                          <td><a href="/receipt/{{ r.name }}" target="_blank" class="btn btn-sm btn-outline-dark">보기</a></td>
                                      </tr>
                                      {% endfor %}
                                  </tbody>
                              </table>
                          </div>
                          <div class="tab-pane fade" id="sim">
                              <div class="alert alert-info">💡 몬테카를로 시뮬레이션으로 생성된 가상 데이터 1,200건 중 일부입니다.</div>
                              <table class="table table-sm table-striped">
                                  <thead><tr><th>Sim ID</th><th>가상 연봉</th><th>가족수</th><th>계산 결과</th></tr></thead>
                                  <tbody>
                                      {% for r in sim_data[:50] %}
                                      <tr>
                                          <td>{{ r.name }}</td><td>{{ "{:,}".format(r.salary) }}</td><td>{{ r.dependents }}</td>
                                          <td class="text-{{ 'primary' if r.final_money < 0 else 'danger' }} fw-bold">{{ "{:,}".format(r.final_money) }}</td>
                                      </tr>
                                      {% endfor %}
                                  </tbody>
                              </table>
                              <p class="text-center text-muted">... (Total {{ sim_len }} records) ...</p>
                          </div>
                      </div>
                  </div>

                  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
                  <script>
                      new Chart(document.getElementById('distChart'), {
                          type: 'bar',
                          data: {
                              labels: {{ ranges.keys() | list | tojson }},
                              datasets: [{ label: '인원수', data: {{ ranges.values() | list | tojson }}, backgroundColor: '#6c5ce7' }]
                          }
                      });
                      new Chart(document.getElementById('ratioChart'), {
                          type: 'pie',
                          data: {
                              labels: ['환급', '징수'],
                              datasets: [{ data: [
                                  {{ results | selectattr('final_money', 'lt', 0) | list | length }},
                                  {{ results | selectattr('final_money', 'ge', 0) | list | length }}
                              ], backgroundColor: ['#00b894', '#d63031'] }]
                          }
                      });
                  </script>
              </body>
              </html>
              """
              return render_template_string(html, results=results, real_data=real_data, sim_data=sim_data,
                                            real_len=len(real_data), sim_len=len(sim_data), total_len=len(results),
                                            total_refund=total_refund, total_collect=total_collect, ranges=ranges)

          @app.route('/receipt/<name>')
          def get_receipt(name): return send_from_directory('receipts', f"{name}.html")

          if __name__ == '__main__': app.run(host='0.0.0.0', port=8080)
          '''

          # ==============================================================================
          # [4] 파일 생성기
          # ==============================================================================
          def create_full_project():
              base_dir = "app_root"
              os.makedirs(os.path.join(base_dir, "templates"), exist_ok=True)
              os.makedirs(os.path.join(base_dir, "static"), exist_ok=True)
              os.makedirs(os.path.join(base_dir, "receipts"), exist_ok=True)
              
              with open(os.path.join(base_dir, "requirements.txt"), "w") as f: f.write(REQ_TXT.strip())
              with open(os.path.join(base_dir, "Dockerfile"), "w") as f: f.write(DOCKERFILE.strip())
              with open(os.path.join(base_dir, "engine.py"), "w", encoding="utf-8") as f: f.write(ENGINE_PY.strip())
              with open(os.path.join(base_dir, "app.py"), "w", encoding="utf-8") as f: f.write(APP_PY.strip())
              
              print(f"✅ Simulation Project Ready at {os.path.abspath(base_dir)}")

          if __name__ == "__main__":
              create_full_project()
          EOF

      - name: 🏗️ 프로젝트 생성 (시뮬레이션 모드)
        run: python generate_full_project.py

      # ----------------------------------------------------------------------
      # [Step 3] 대량 계산 실행
      # ----------------------------------------------------------------------
      - name: 🚀 엔진 구동 (Real + Simulation)
        run: |
          cd app_root
          pip install -r requirements.txt
          python engine.py

      # ----------------------------------------------------------------------
      # [Step 4] 패키징
      # ----------------------------------------------------------------------
      - name: 🐳 Docker 이미지 빌드
        run: |
          cd app_root
          docker build -t tax-master-system:latest .
          docker save -o tax-master-system.tar tax-master-system:latest

      - name: 📦 아티팩트 저장
        uses: actions/upload-artifact@v4
        with:
          name: 세금 마스터 시스템 앱 (시뮬레이션 포함)
          path: |
             app_root/tax-master-system.tar
             generate_full_project.py
          retention-days: 7
