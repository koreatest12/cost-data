name: 🏢 엔터프라이즈 세금 시스템 (모듈 대량 설치 및 통합 빌드)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  enterprise-processing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 시스템 체크아웃
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # [Step 1] 데이터 수집
      # ----------------------------------------------------------------------
      - name: 📥 데이터 리포지토리 로드
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: app_root/cost_data
          fetch-depth: 0 

      - name: 🔧 권한 설정
        run: chmod -R 755 app_root/cost_data
          
      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # ======================================================================
      # [Step 1.5] 📦 필수 모듈 대량 설치 (여기가 핵심입니다!)
      # generate_full_project.py 실행에 필요한 모든 라이브러리를 미리 설치합니다.
      # ======================================================================
      - name: 📦 필수 라이브러리 대량 설치 (Pre-install Dependencies)
        run: |
          echo ">>> 시스템 구동에 필요한 모듈을 대량 설치합니다..."
          pip install --upgrade pip
          pip install pandas openpyxl pdfplumber tabulate faker numpy flask

      # ----------------------------------------------------------------------
      # [Step 2] 엔터프라이즈 프로젝트 생성 (이제 에러 없이 실행됩니다)
      # ----------------------------------------------------------------------
      - name: 🛠️ generate_full_project.py 생성
        run: |
          cat <<EOF > generate_full_project.py
          import os, sys, glob, json, re, random, time, shutil, datetime
          # 이제 pandas 등 모듈이 설치되어 있으므로 import 에러가 발생하지 않습니다.
          import pandas as pd
          import pdfplumber
          import numpy as np
          from collections import defaultdict
          from faker import Faker

          # ==============================================================================
          # [1] 설정 및 디렉토리 구조 정의
          # ==============================================================================
          BASE_DIR = "app_root"
          DATA_DIR = os.path.join(BASE_DIR, 'cost_data')
          
          # 외부 서비스 시뮬레이션 디렉토리
          SERVICE_DIRS = {
              "S3_BUCKET": os.path.join(BASE_DIR, "services", "aws_s3_receipts"),
              "ERP_API":   os.path.join(BASE_DIR, "services", "erp_data_sync"),
              "NAS_LOGS":  os.path.join(BASE_DIR, "services", "nas_audit_logs")
          }

          REQ_TXT = """
          flask
          pandas
          openpyxl
          pdfplumber
          tabulate
          faker
          numpy
          """

          DOCKERFILE = """
          FROM python:3.9-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY . .
          RUN chmod -R 755 services cost_data
          EXPOSE 8080
          CMD ["python", "app.py"]
          """

          # ==============================================================================
          # [2] 서비스 커넥터
          # ==============================================================================
          class ServiceConnector:
              def __init__(self):
                  for key, path in SERVICE_DIRS.items():
                      os.makedirs(path, exist_ok=True)
                      print(f"✅ [Service] Connected to {key}: {path}")

              def upload_receipt(self, name, content):
                  filename = f"{name}_receipt.html"
                  path = os.path.join(SERVICE_DIRS["S3_BUCKET"], filename)
                  with open(path, "w", encoding="utf-8") as f: f.write(content)
                  return f"s3://bucket/{filename}"

              def sync_erp(self, data):
                  # Numpy 타입 등을 JSON 직렬화 가능하게 변환
                  class NpEncoder(json.JSONEncoder):
                      def default(self, obj):
                          if isinstance(obj, np.integer): return int(obj)
                          if isinstance(obj, np.floating): return float(obj)
                          if isinstance(obj, np.ndarray): return obj.tolist()
                          return super(NpEncoder, self).default(obj)

                  filename = f"{data['name']}_erp_sync.json"
                  path = os.path.join(SERVICE_DIRS["ERP_API"], filename)
                  with open(path, "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2, cls=NpEncoder)

              def write_log(self, name, action, amount):
                  log_entry = f"[{datetime.datetime.now()}] USER:{name} | ACTION:{action} | AMT:{amount}\n"
                  with open(os.path.join(SERVICE_DIRS["NAS_LOGS"], "audit.log"), "a", encoding="utf-8") as f:
                      f.write(log_entry)

          # ==============================================================================
          # [3] 대량 데이터 처리 엔진 (Massive Engine)
          # ==============================================================================
          # generate_full_project.py 내에서 엔진 로직을 정의하고, 
          # 이를 파일로 쓰는 방식(app_root/engine.py)으로 구현합니다.

          ENGINE_TEMPLATE = r'''
          import os, glob, json, re, random, time, datetime
          import pandas as pd
          import numpy as np
          from collections import defaultdict
          # (커넥터 및 설정 코드는 main함수에서 합쳐짐)

          db = defaultdict(lambda: {
              'salary': 0, 'pension': 0, 'insurance': 0, 'medical': 0, 
              'card': 0, 'donation': 0, 'pre_paid': 0, 'files': set(), 
              'dependents': 1, 'source': 'REAL'
          })

          def migrate_data(root_path):
              files = glob.glob(os.path.join(root_path, '**', '*'), recursive=True)
              valid_files = [f for f in files if os.path.isfile(f)]
              print(f">>> [Loader] Scanning {len(valid_files)} files...")
              
              for filepath in valid_files:
                  try:
                      fname = os.path.basename(filepath)
                      if fname.endswith('.json'):
                          with open(filepath, 'r', encoding='utf-8') as f:
                              js = json.load(f)
                              name = js.get('name')
                              if name: 
                                  db[name]['salary'] = max(db[name]['salary'], int(js.get('total_salary', 0)))
                  except: pass

          def generate_simulation(count=2000):
              print(f">>> [Sim] Generating {count} massive virtual users...")
              # Numpy를 이용한 고속 난수 생성
              salaries = np.random.normal(50000000, 15000000, count).astype(int)
              
              for i in range(count):
                  uid = f"User_{i:04d}"
                  sal = max(24000000, salaries[i]) # 최소 연봉 보정
                  
                  db[uid] = {
                      'salary': int(sal),
                      'pension': int(sal * 0.045),
                      'insurance': int(random.uniform(50, 200) * 10000),
                      'medical': int(random.uniform(0, 500) * 10000),
                      'card': int(sal * random.uniform(0.1, 0.4)),
                      'pre_paid': int(sal * random.uniform(0.05, 0.15)),
                      'files': {f"virtual_{i}.pdf"},
                      'dependents': random.randint(1, 4),
                      'source': 'SIMULATION'
                  }

          def calculate_tax(data):
              salary = data['salary']
              income_ded = salary * 0.4 if salary <= 50000000 else 12000000 + (salary - 45000000) * 0.05
              tax_base = max(salary - income_ded - (data['dependents']*1500000) - data['pension'], 0)
              
              tax = tax_base * 0.15 - 1080000 if tax_base <= 46000000 else tax_base * 0.24 - 5220000
              tax = max(tax, 0)
              
              determined = max(tax - (data['insurance']*0.12) - (data['medical']*0.15), 0)
              final = int(determined - data['pre_paid'])
              return int(tax_base), int(determined), final

          def process_all(connector):
              migrate_data('cost_data')
              generate_simulation(2000) # 대량 시뮬레이션
              
              results = []
              print(">>> [Engine] Processing...")
              
              for name, data in db.items():
                  if not name: continue
                  if data['salary'] == 0: data['salary'] = 30000000
                  
                  base, det, final = calculate_tax(data)
                  
                  res_data = {
                      "name": name, "salary": data['salary'], 
                      "result": {"base": base, "determined": det, "final": final},
                      "type": "REFUND" if final < 0 else "COLLECT",
                      "source": data['source']
                  }
                  
                  # 서비스 적재
                  connector.upload_receipt(name, f"<html><h1>Receipt {name}</h1></html>")
                  connector.sync_erp(res_data)
                  connector.write_log(name, "TAX_CALC", final)
                  
                  results.append(res_data)
              return results
          '''

          APP_PY = r'''
          from flask import Flask, render_template_string
          import json, os
          app = Flask(__name__)
          @app.route('/')
          def index():
              with open('final_result.json', 'r') as f: results = json.load(f)
              s3_cnt = len(os.listdir('services/aws_s3_receipts'))
              erp_cnt = len(os.listdir('services/erp_data_sync'))
              return f"<h1>Enterprise Dashboard</h1><p>S3 Files: {s3_cnt}</p><p>ERP Records: {erp_cnt}</p>"
          if __name__ == '__main__': app.run(host='0.0.0.0', port=8080)
          '''

          def main():
              # 프로젝트 파일 생성
              os.makedirs("app_root", exist_ok=True)
              with open("app_root/requirements.txt", "w") as f: f.write(REQ_TXT.strip())
              with open("app_root/Dockerfile", "w") as f: f.write(DOCKERFILE.strip())
              with open("app_root/app.py", "w", encoding="utf-8") as f: f.write(APP_PY.strip())
              
              # Engine 코드는 커넥터 로직과 합쳐서 생성
              full_engine = """
          import os, json, numpy as np
          # (Connector 클래스 정의 복사됨 - 실제로는 템플릿 사용 권장)
          SERVICE_DIRS = {
              "S3_BUCKET": "services/aws_s3_receipts",
              "ERP_API":   "services/erp_data_sync",
              "NAS_LOGS":  "services/nas_audit_logs"
          }
          class ServiceConnector:
              def __init__(self):
                  for path in SERVICE_DIRS.values(): os.makedirs(path, exist_ok=True)
              def upload_receipt(self, name, content):
                  with open(os.path.join(SERVICE_DIRS["S3_BUCKET"], f"{name}.html"), "w") as f: f.write(content)
              def sync_erp(self, data):
                  # Numpy 처리
                  class NpEncoder(json.JSONEncoder):
                      def default(self, obj):
                          if isinstance(obj, np.integer): return int(obj)
                          if isinstance(obj, np.floating): return float(obj)
                          if isinstance(obj, np.ndarray): return obj.tolist()
                          return super(NpEncoder, self).default(obj)
                  with open(os.path.join(SERVICE_DIRS["ERP_API"], f"{data['name']}.json"), "w") as f:
                      json.dump(data, f, cls=NpEncoder)
              def write_log(self, name, action, amount):
                  with open(os.path.join(SERVICE_DIRS["NAS_LOGS"], "audit.log"), "a") as f: f.write(f"{name} {amount}\\n")
          """ + ENGINE_TEMPLATE + """
          if __name__ == "__main__":
              conn = ServiceConnector()
              res = process_all(conn)
              # Numpy 인코더 사용
              class NpEncoder(json.JSONEncoder):
                  def default(self, obj):
                      if isinstance(obj, np.integer): return int(obj)
                      if isinstance(obj, np.floating): return float(obj)
                      if isinstance(obj, np.ndarray): return obj.tolist()
                      return super(NpEncoder, self).default(obj)
              with open('final_result.json', 'w', encoding='utf-8') as f: json.dump(res, f, ensure_ascii=False, cls=NpEncoder)
          """
              with open("app_root/engine.py", "w", encoding="utf-8") as f: f.write(full_engine.strip())
              print("✅ Project Generation Complete.")

          if __name__ == "__main__":
              main()
          EOF

      - name: 🏗️ 프로젝트 생성 실행
        run: python generate_full_project.py

      # ----------------------------------------------------------------------
      # [Step 3] 대량 계산 및 서비스 적재 실행
      # ----------------------------------------------------------------------
      - name: 🚀 엔진 구동 (계산 -> 분류 -> 업로드)
        run: |
          cd app_root
          # 여기서도 런타임용 라이브러리가 필요하지만 이미 위에서 설치했으므로 바로 실행 가능
          # 혹은 가상환경 분리를 위해 다시 설치
          pip install -r requirements.txt
          python engine.py

      # ----------------------------------------------------------------------
      # [Step 4] 결과물 확인 및 저장
      # ----------------------------------------------------------------------
      - name: 📊 결과 검증
        run: |
          echo ">>> AWS S3 Receipts (Top 5):"
          ls -1 app_root/services/aws_s3_receipts | head -n 5
          echo ">>> ERP Sync Files (Top 5):"
          ls -1 app_root/services/erp_data_sync | head -n 5

      - name: 🐳 Docker 이미지 빌드
        run: |
          cd app_root
          docker build -t tax-enterprise-system:latest .
          docker save -o tax-enterprise-system.tar tax-enterprise-system:latest

      - name: 📦 통합 아티팩트 저장
        uses: actions/upload-artifact@v4
        with:
          name: 엔터프라이즈 통합 데이터 (Services & App)
          path: |
             app_root/tax-enterprise-system.tar
             app_root/services/aws_s3_receipts
             app_root/services/erp_data_sync
             app_root/services/nas_audit_logs
          retention-days: 7
