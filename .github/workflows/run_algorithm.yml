name: Algorithm Workflow

# 언제 실행할지 정의 (main 브랜치에 push나 pull request가 발생하면 실행)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 실행할 작업 정의
jobs:
  build-and-run:
    # 우분투(리눅스) 환경에서 실행
    runs-on: ubuntu-latest

    steps:
    # 1단계: 저장소의 코드를 서버로 내려받음
    - name: Checkout code
      uses: actions/checkout@v4

    # 2단계: 파이썬 3.9 환경 설정
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    # 3단계: (선택) 필요한 라이브러리가 있다면 설치
    # 현재 코드는 표준 라이브러리(heapq, sys)만 사용하므로 pip upgrade만 수행
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 만약 외부 라이브러리가 있다면 아래 주석 해제 후 requirements.txt 사용
        # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4단계: 파이썬 알고리즘 스크립트 실행
    # (앞서 저장한 파일명이 navigation.py 라고 가정)
    - name: Run Shortest Path Algorithm
      run: |
        python navigation.py
