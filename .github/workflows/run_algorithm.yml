name: 🌌 Infinity Scale Data & Deployment System (Full Integration)

on:
  workflow_dispatch:
    inputs:
      record_count:
        description: '총 생성 데이터 건수 (기본 20만)'
        required: true
        default: '200000'
      chunk_size:
        description: '분할 전송 단위 (과부하 방지용)'
        required: true
        default: '50000'

env:
  PROJECT_NAME: "omni-infinity-system"
  DOCKER_IMAGE: "omni-infinity-server"
  VERSION: "v2026.${{ github.run_number }}"

jobs:
  # [Step 1] 대량 데이터 생산 및 용량 분할 (Generator)
  data-factory:
    runs-on: ubuntu-latest
    outputs:
      chunk_count: ${{ steps.gen.outputs.chunk_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: 🏭 고속 분할 생성기 실행
        id: gen
        run: |
          pip install pandas numpy faker
          mkdir -p data_chunks
          cat <<'EOF' > generator.py
          import os, pandas as pd, numpy as np, uuid
          TOTAL = int(os.environ.get('RECORD_COUNT', 200000))
          CHUNK = int(os.environ.get('CHUNK_SIZE', 50000))
          os.makedirs('data_chunks', exist_ok=True)
          for i in range(0, TOTAL, CHUNK):
              size = min(CHUNK, TOTAL - i)
              df = pd.DataFrame({
                  'uuid': [str(uuid.uuid4()) for _ in range(size)],
                  'amount': np.random.randint(1000, 1000000, size=size),
                  'status': np.random.choice(['ACTIVE', 'PENDING', 'COMPLETED'], size=size)
              })
              df.to_csv(f'data_chunks/chunk_{i//CHUNK}.csv', index=False)
          print(f"chunk_count={TOTAL//CHUNK + (1 if TOTAL%CHUNK > 0 else 0)}")
          EOF
          RECORD_COUNT=${{ github.event.inputs.record_count }} CHUNK_SIZE=${{ github.event.inputs.chunk_size }} python generator.py >> $GITHUB_OUTPUT
      - name: 📦 데이터 아티팩트 저장
        uses: actions/upload-artifact@v4
        with:
          name: partitioned-data
          path: data_chunks/

  # [Step 2] 전송 서버 적재 및 메인 시스템 배포
  system-deployment:
    needs: data-factory
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: partitioned-data, path: src/main/resources/data }
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'maven' }

      - name: 🏗️ 풀스택 아키텍처 자동 생성 (Spring + Web + Docker)
        run: |
          BASE="src/main/java/com/omni/infinity"
          RES="src/main/resources"
          mkdir -p $BASE/controller $BASE/model $BASE/repository $BASE/service $RES/static/js
          
          # 1. 홈페이지 (Dashboard) 생성
          cat <<EOF > $RES/static/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <title>Infinity Scale Dashboard</title>
              <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
              <style>
                  body { background: #0b0f19; color: #00d2ff; font-family: 'Segoe UI', sans-serif; text-align: center; }
                  .container { width: 80%; margin: auto; padding-top: 50px; }
                  .stats-card { background: #161e2d; padding: 20px; border-radius: 15px; border: 1px solid #1e293b; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🌌 Infinity System Monitor</h1>
                  <div class="stats-card">
                      <h2 id="totalCount">Total Records: Loading...</h2>
                      <canvas id="loadChart"></canvas>
                  </div>
              </div>
              <script>
                  setInterval(() => {
                      fetch('/api/stats').then(r => r.json()).then(d => {
                          document.getElementById('totalCount').innerText = '적재 완료 데이터: ' + d.total.toLocaleString() + ' 건';
                      });
                  }, 2000);
              </script>
          </body>
          </html>
          EOF

          # 2. 전송 서버 적재 로직 (Batch Ingestion Service)
          cat <<EOF > $BASE/service/IngestionService.java
          package com.omni.infinity.service;
          import com.omni.infinity.repository.DataRepository;
          import com.omni.infinity.model.InfinityData;
          import org.springframework.stereotype.Service;
          import jakarta.annotation.PostConstruct;
          import lombok.RequiredArgsConstructor;
          import java.io.*;
          import java.nio.file.*;
          import java.util.*;

          @Service @RequiredArgsConstructor
          public class IngestionService {
              private final DataRepository repo;
              @PostConstruct
              public void startIngestion() throws Exception {
                  File dir = new File("src/main/resources/data");
                  File[] files = dir.listFiles();
                  if(files == null) return;
                  for(File f : files) {
                      System.out.println("🚀 Loading " + f.getName());
                      // 과부하 방지를 위한 스트림 처리 및 Batch Save
                      try (BufferedReader br = new BufferedReader(new FileReader(f))) {
                          br.readLine(); // skip header
                          List<InfinityData> batch = new ArrayList<>();
                          String line;
                          while((line = br.readLine()) != null) {
                              String[] s = line.split(",");
                              batch.add(new InfinityData(s[0], Long.parseLong(s[1]), s[2]));
                              if(batch.size() >= 5000) { repo.saveAll(batch); batch.clear(); }
                          }
                          repo.saveAll(batch);
                      }
                  }
              }
          }
          EOF

          # 3. Model & Controller (생략 없이 생성)
          cat <<EOF > $BASE/model/InfinityData.java
          package com.omni.infinity.model;
          import jakarta.persistence.*;
          import lombok.*;
          @Entity @Getter @NoArgsConstructor
          public class InfinityData {
              @Id @GeneratedValue(strategy = GenerationType.IDENTITY) private Long id;
              private String uuid; private Long amount; private String status;
              public InfinityData(String u, Long a, String s) { this.uuid=u; this.amount=a; this.status=s; }
          }
          EOF
          
          echo "package com.omni.infinity.repository; import com.omni.infinity.model.InfinityData; import org.springframework.data.jpa.repository.JpaRepository; public interface DataRepository extends JpaRepository<InfinityData, Long> {}" > $BASE/repository/DataRepository.java

      - name: 🔨 시스템 빌드 및 Docker 패키징
        run: |
          mvn clean package -DskipTests
          cat <<EOF > Dockerfile
          FROM eclipse-temurin:17-jdk-alpine
          COPY target/*.jar app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-Xmx2048m", "-jar", "app.jar"]
          EOF
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.VERSION }} .
          docker save ${{ env.DOCKER_IMAGE }}:${{ env.VERSION }} > system_bundle.tar

      - name: 🚀 Release 배포 (서버 파일 및 컨테이너 포함)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            target/*.jar
            system_bundle.tar
            src/main/resources/data/*.csv
