name: 📱 Pokemon GO 데이터 및 엔터프라이즈 통합 시스템

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PIP_ROOT_USER_ACTION: ignore
  PYTHONUNBUFFERED: 1

jobs:
  pokemon-cluster-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📥 시스템 소스 체크아웃
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # [Step 1] Docker Compose V2 설치
      # ----------------------------------------------------------------------
      - name: 🔧 Docker Compose V2 설정
        run: |
          mkdir -p ~/.docker/cli-plugins/
          curl -SL https://github.com/docker/compose/releases/download/v2.24.1/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version

      # ----------------------------------------------------------------------
      # [Step 2] 데이터 리포지토리 수집 (Cost Data + Pokemon Data 시뮬레이션)
      # ----------------------------------------------------------------------
      - name: 📥 데이터 수집
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: app_root/raw_data
          fetch-depth: 0 

      - name: 🔧 권한 및 환경 설정
        run: |
          chmod -R 755 app_root/raw_data
          python -m pip install --upgrade pip
          pip install pandas numpy pdfplumber faker flask pyyaml requests

      # ----------------------------------------------------------------------
      # [Step 3] 메가 클러스터 생성 (Pokemon Service 추가)
      # ----------------------------------------------------------------------
      - name: 🛠️ 인프라 코드 생성 (generate_mega_structure.py)
        run: |
          cat <<'EOF' > generate_mega_structure.py
          import os, sys, yaml, shutil, json, random, time
          
          ROOT = "app_root"
          
          # [1] 서비스 정의 (Pokemon Service 추가됨!)
          SERVICES = [
              "gateway-nginx",      # API Gateway
              "auth-server",        # 인증
              "calc-engine",        # 정산
              "pokemon-game-svc",   # [NEW] 포켓몬 데이터 처리
              "storage-node",       # 저장소
              "log-aggregator",     # 로그
              "analytics-core",     # 분석
              "noti-service"        # 알림
          ]
          
          # [2] 볼륨 정의
          VOLUMES = {svc: os.path.join(ROOT, "volumes", svc) for svc in SERVICES}

          # [3] Docker Compose 생성
          def generate_docker_compose():
              compose = {
                  "version": "3.8",
                  "services": {},
                  "networks": {"enterprise-net": {"driver": "bridge"}},
                  "volumes": {f"{s}-vol": {} for s in SERVICES}
              }
              
              for svc in SERVICES:
                  svc_def = {
                      "build": f"./containers/{svc}",
                      "container_name": f"ent-{svc}",
                      "networks": ["enterprise-net"],
                      "restart": "always",
                      "environment": [f"SERVICE_NAME={svc}", "ENV=PROD"],
                      "volumes": [f"{os.path.abspath(VOLUMES[svc])}:/app/data"]
                  }
                  
                  if svc == "gateway-nginx":
                      svc_def["ports"] = ["80:80"]
                      svc_def["depends_on"] = [s for s in SERVICES if s != "gateway-nginx"]
                  elif svc == "pokemon-game-svc":
                      # 포켓몬 서비스는 분석 코어와 연동
                      svc_def["depends_on"] = ["analytics-core"]
                  
                  compose["services"][svc] = svc_def
              
              with open(os.path.join(ROOT, "docker-compose.yml"), "w") as f:
                  yaml.dump(compose, f)
              print(f"✅ Docker Compose Generated with {len(SERVICES)} services (Includes Pokemon-GO).")

          # [4] 컨테이너 소스 생성
          def generate_containers():
              # Python Base (VENV 적용)
              dockerfile_py = """
          FROM python:3.9-slim
          ENV VIRTUAL_ENV=/opt/venv
          RUN python3 -m venv $VIRTUAL_ENV
          ENV PATH="$VIRTUAL_ENV/bin:$PATH"
          WORKDIR /app
          COPY . .
          RUN pip install flask numpy faker
          CMD ["python", "app.py"]
          """
              # Nginx Base
              dockerfile_nginx = """
          FROM nginx:alpine
          RUN echo "server { listen 80; location / { return 200 'Enterprise Gateway w/ Pokemon Support'; } }" > /etc/nginx/conf.d/default.conf
          """

              for svc in SERVICES:
                  path = os.path.join(ROOT, "containers", svc)
                  os.makedirs(path, exist_ok=True)
                  
                  if "nginx" in svc:
                      with open(os.path.join(path, "Dockerfile"), "w") as f: f.write(dockerfile_nginx.strip())
                  else:
                      with open(os.path.join(path, "Dockerfile"), "w") as f: f.write(dockerfile_py.strip())
                      
                      # 서비스별 로직 (포켓몬 서비스 특화)
                      if svc == "pokemon-game-svc":
                          app_code = r'''
          from flask import Flask, jsonify
          import os, json, random
          app = Flask(__name__)
          
          @app.route('/')
          def status():
              files = os.listdir('/app/data')
              count = len([f for f in files if f.endswith('.json')])
              return jsonify({"status": "Pokemon Service Online", "captured_pokemon": count})
              
          @app.route('/scan')
          def scan():
              # 데이터 갱신 시뮬레이션
              return "Scanning for wild pokemon..."
              
          if __name__ == '__main__': app.run(host='0.0.0.0', port=5000)
          '''
                      else:
                          app_code = f"""
          from flask import Flask
          import os
          app = Flask(__name__)
          @app.route('/')
          def i(): return "<h1>{svc} Online</h1>Data: " + str(len(os.listdir('/app/data')))
          if __name__ == '__main__': app.run(host='0.0.0.0', port=5000)
          """
                      with open(os.path.join(path, "app.py"), "w") as f: f.write(app_code.strip())

          # [5] 대량 데이터 생성 (Pokemon Data Injection)
          def inject_massive_data():
              print(">>> [Loader] Injecting MASSIVE Pokemon & Enterprise Data...")
              
              # 포켓몬 데이터베이스
              POKEMON_DB = ["Pikachu", "Charizard", "Bulbasaur", "Mewtwo", "Eevee", "Snorlax", "Gengar", "Dragonite"]
              TEAMS = ["Mystic", "Valor", "Instinct"]
              
              for svc, vol_path in VOLUMES.items():
                  os.makedirs(vol_path, exist_ok=True)
                  
                  # 1. Pokemon Service: 포획 데이터 5,000건 생성
                  if svc == "pokemon-game-svc":
                      print(f"  - Generating Pokemon Data in {vol_path}...")
                      for i in range(5000):
                          p_data = {
                              "capture_id": f"C_{i:06d}",
                              "trainer_id": f"T_{random.randint(1000,9999)}",
                              "pokemon": random.choice(POKEMON_DB),
                              "cp": random.randint(10, 4000),
                              "iv": {
                                  "attack": random.randint(0, 15),
                                  "defense": random.randint(0, 15),
                                  "stamina": random.randint(0, 15)
                              },
                              "team": random.choice(TEAMS),
                              "shiny": random.random() < 0.05, # 5% 확률 이로치
                              "timestamp": time.time()
                          }
                          with open(os.path.join(vol_path, f"catch_{i}.json"), "w") as f:
                              json.dump(p_data, f)
                              
                  # 2. Analytics Core: 레이드 배틀 로그 생성
                  elif svc == "analytics-core":
                      for i in range(1000):
                          raid_log = f"RAID_BATTLE | BOSS: {random.choice(POKEMON_DB)} | PLAYERS: {random.randint(5,20)} | RESULT: WIN\n"
                          with open(os.path.join(vol_path, f"raid_log_{i}.txt"), "w") as f: f.write(raid_log)
                          
                  # 3. Calc Engine: 기존 세금 데이터
                  elif svc == "calc-engine":
                      for i in range(1000):
                          with open(os.path.join(vol_path, f"tax_{i}.json"), "w") as f:
                              json.dump({"id": i, "amt": random.randint(100,10000)}, f)
                              
                  # 4. 기타 서비스 더미 데이터
                  else:
                      with open(os.path.join(vol_path, "status.dat"), "w") as f: f.write("ONLINE")
                      
              print("✅ Data Injection Complete.")

          if __name__ == "__main__":
              generate_docker_compose()
              generate_containers()
              inject_massive_data()
          EOF

      - name: 🏗️ 인프라 생성 실행
        run: python generate_mega_structure.py

      # ----------------------------------------------------------------------
      # [Step 4] 컨테이너 클러스터 구동
      # ----------------------------------------------------------------------
      - name: 🚀 클러스터 배포 (Docker Compose)
        run: |
          cd app_root
          echo ">>> [Deploy] Building & Starting Services..."
          docker compose build --parallel
          docker compose up -d
          
          echo ">>> [Wait] Waiting for Pokemon Service initialization..."
          sleep 15
          docker compose ps

      # ----------------------------------------------------------------------
      # [Step 5] 데이터 검증 및 분석
      # ----------------------------------------------------------------------
      - name: 🔍 Pokemon 데이터 검증
        run: |
          echo "================================================="
          echo "   📱 Pokemon GO Service Status"
          echo "================================================="
          
          VOL_PATH="app_root/volumes/pokemon-game-svc"
          COUNT=$(ls $VOL_PATH/*.json | wc -l)
          
          echo "Total Captured Pokemon: $COUNT"
          echo ""
          echo "[Sample Data - Top 5 Catches]"
          head -n 5 $VOL_PATH/catch_0.json
          
          echo ""
          echo ">>> Shiny Pokemon Check (Sample):"
          grep -l '"shiny": true' $VOL_PATH/*.json | head -n 3 || echo "No Shiny found in sample"

          echo ""
          echo "================================================="
          echo "   🏢 Enterprise Services Status"
          echo "================================================="
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      - name: 🐳 전체 시스템 로그 저장
        if: always()
        run: |
          cd app_root
          docker compose logs > cluster_logs.txt

      - name: 📦 아티팩트 업로드 (Pokemon Data 포함)
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon_Enterprise_System
          path: |
             app_root/docker-compose.yml
             app_root/cluster_logs.txt
             app_root/volumes/pokemon-game-svc/
             app_root/volumes/analytics-core/
          retention-days: 7
