name: 🌌 Infinity Scale Data & Deployment System

on:
  workflow_dispatch:
    inputs:
      record_count:
        description: '총 생성 데이터 건수'
        required: true
        default: '200000'
      chunk_size:
        description: '분할 적재 단위'
        required: true
        default: '50000'

env:
  PROJECT_NAME: "omni-infinity-system"
  DOCKER_IMAGE: "omni-infinity-server"
  VERSION: "v2026.${{ github.run_number }}"

jobs:
  # [Step 1] 초거대 데이터 생산 및 물리적 분할
  data-factory:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 소스 체크아웃
        uses: actions/checkout@v4
      - name: 🐍 Python 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: 🏭 고속 분할 생성기 실행
        run: |
          pip install pandas numpy faker
          mkdir -p data_chunks
          cat <<'EOF' > generator.py
          import os, pandas as pd, numpy as np, uuid
          TOTAL = int(os.environ.get('RECORD_COUNT', 200000))
          CHUNK = int(os.environ.get('CHUNK_SIZE', 50000))
          for i in range(0, TOTAL, CHUNK):
              size = min(CHUNK, TOTAL - i)
              df = pd.DataFrame({
                  'uuid': [str(uuid.uuid4()) for _ in range(size)],
                  'amount': np.random.randint(1000, 1000000, size=size),
                  'status': np.random.choice(['ACTIVE', 'PENDING', 'COMPLETED'], size=size)
              })
              df.to_csv(f'data_chunks/chunk_{i//CHUNK}.csv', index=False)
          EOF
          RECORD_COUNT=${{ github.event.inputs.record_count }} CHUNK_SIZE=${{ github.event.inputs.chunk_size }} python generator.py
      - name: 📤 분할 데이터 아티팩트 저장
        uses: actions/upload-artifact@v4
        with:
          name: partitioned-data
          path: data_chunks/

  # [Step 2] 시스템 빌드, 적재 엔진 및 대시보드 통합 배포
  system-deployment:
    needs: data-factory
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 소스 체크아웃
        uses: actions/checkout@v4
      - name: 📥 분할 데이터 다운로드
        uses: actions/download-artifact@v4
        with:
          name: partitioned-data
          path: src/main/resources/data
      - name: ☕ JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🏗️ 풀스택 시스템 자동 생성
        run: |
          BASE="src/main/java/com/omni/infinity"
          RES="src/main/resources"
          mkdir -p $BASE/model $BASE/repository $BASE/service $BASE/controller $RES/static

          # 1. Maven Project 설정 (컴파일 에러 해결의 핵심)
          cat <<EOF > pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <parent><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-parent</artifactId><version>3.2.2</version></parent>
            <groupId>com.omni</groupId><artifactId>infinity-api</artifactId><version>1.0.0</version>
            <dependencies>
                <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId></dependency>
                <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-data-jpa</artifactId></dependency>
                <dependency><groupId>com.h2database</groupId><artifactId>h2</artifactId><scope>runtime</scope></dependency>
                <dependency><groupId>org.projectlombok</groupId><artifactId>lombok</artifactId><optional>true</optional></dependency>
            </dependencies>
            <build><plugins><plugin><groupId>org.springframework.boot</groupId><artifactId>spring-boot-maven-plugin</artifactId></plugin></plugins></build>
          </project>
          EOF

          # 2. 고속 배치 삽입 최적화 설정
          cat <<EOF > $RES/application.properties
          spring.datasource.url=jdbc:h2:mem:infinitydb;DB_CLOSE_DELAY=-1;rewriteBatchedStatements=true
          spring.jpa.properties.hibernate.jdbc.batch_size=1000
          spring.jpa.properties.hibernate.order_inserts=true
          spring.jpa.hibernate.ddl-auto=create
          server.port=8080
          EOF

          # 3. Entity & Repository
          cat <<EOF > $BASE/model/InfinityData.java
          package com.omni.infinity.model;
          import jakarta.persistence.*;
          import lombok.*;
          @Entity @Data @NoArgsConstructor
          public class InfinityData {
              @Id @GeneratedValue(strategy = GenerationType.IDENTITY) private Long id;
              private String uuid; private Long amount; private String status;
              public InfinityData(String u, Long a, String s) { this.uuid=u; this.amount=a; this.status=s; }
          }
          EOF
          echo "package com.omni.infinity.repository; import com.omni.infinity.model.InfinityData; import org.springframework.data.jpa.repository.JpaRepository; public interface DataRepository extends JpaRepository<InfinityData, Long> {}" > $BASE/repository/DataRepository.java

          # 4. 대용량 적재 엔진 (메모리 관리 포함)
          cat <<EOF > $BASE/service/IngestionService.java
          package com.omni.infinity.service;
          import com.omni.infinity.model.InfinityData;
          import jakarta.persistence.EntityManager;
          import jakarta.persistence.PersistenceContext;
          import org.springframework.stereotype.Service;
          import org.springframework.transaction.annotation.Transactional;
          import jakarta.annotation.PostConstruct;
          import java.io.*;
          @Service
          public class IngestionService {
              @PersistenceContext private EntityManager em;
              @PostConstruct
              public void init() {
                  new Thread(() -> { try { runBatch(); } catch (Exception e) { e.printStackTrace(); } }).start();
              }
              @Transactional
              public void runBatch() throws Exception {
                  File dir = new File("src/main/resources/data");
                  if (!dir.exists() || dir.listFiles() == null) return;
                  for (File f : dir.listFiles()) {
                      if (!f.getName().endsWith(".csv")) continue;
                      try (BufferedReader br = new BufferedReader(new FileReader(f))) {
                          br.readLine(); String line; int count = 0;
                          while ((line = br.readLine()) != null) {
                              String[] s = line.split(",");
                              em.persist(new InfinityData(s[0], Long.parseLong(s[1]), s[2]));
                              if (++count % 1000 == 0) { em.flush(); em.clear(); }
                          }
                      }
                  }
              }
          }
          EOF

          # 5. Controller & Monitoring Homepage
          cat <<EOF > $BASE/controller/ApiController.java
          package com.omni.infinity.controller;
          import com.omni.infinity.repository.DataRepository;
          import lombok.RequiredArgsConstructor;
          import org.springframework.web.bind.annotation.*;
          import java.util.Map;
          @RestController @RequiredArgsConstructor @RequestMapping("/api")
          public class ApiController {
              private final DataRepository repo;
              @GetMapping("/stats") public Map<String, Object> stats() { return Map.of("total", repo.count()); }
          }
          EOF
          cat <<EOF > $BASE/App.java
          package com.omni.infinity;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          @SpringBootApplication public class App { public static void main(String[] args) { SpringApplication.run(App.class, args); } }
          EOF
          cat <<EOF > $RES/static/index.html
          <!DOCTYPE html><html><head><title>Infinity Monitor</title></head>
          <body style="background:#0b0f19; color:#00d2ff; text-align:center; font-family:sans-serif;">
              <h1>🌌 Real-time Data Ingestion</h1>
              <div style="font-size:4em;" id="c">0</div><script>
              setInterval(() => { fetch('/api/stats').then(r=>r.json()).then(d=>document.getElementById('c').innerText=d.total.toLocaleString()); }, 1000);
              </script>
          </body></html>
          EOF

      - name: 🔨 시스템 빌드
        run: mvn clean package -DskipTests

      - name: 🐳 Docker화 및 컨테이너 생성
        run: |
          cat <<EOF > Dockerfile
          FROM eclipse-temurin:17-jdk-alpine
          COPY target/*.jar app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-Xmx2048m", "-jar", "app.jar"]
          EOF
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.VERSION }} .
          docker save ${{ env.DOCKER_IMAGE }}:${{ env.VERSION }} > system_bundle.tar

      - name: 📦 GitHub Release 생성
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            target/*.jar
            system_bundle.tar
            src/main/resources/data/*.csv
