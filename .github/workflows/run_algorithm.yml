name: 🔄 매시간/매주 대량 데이터 생성 및 적재 파이프라인

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  # [핵심] 스케줄러 적용
  schedule:
    - cron: '0 * * * *'   # 매시간 실행 (Hourly Batch)
    - cron: '0 0 * * 0'   # 매주 일요일 자정 실행 (Weekly Full Batch)

env:
  PIP_ROOT_USER_ACTION: ignore
  PYTHONUNBUFFERED: 1
  TZ: 'Asia/Seoul' # 한국 시간 기준

jobs:
  data-factory-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 대량 데이터 처리를 위해 시간 넉넉히 설정
    
    steps:
      - name: 📥 시스템 체크아웃
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # [Step 1] 원천 데이터 수집
      # ----------------------------------------------------------------------
      - name: 📥 원천 데이터 가져오기 (koreatest12/cost-data)
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: app_root/source_data
          fetch-depth: 0 

      - name: 🔧 환경 설정
        run: |
          chmod -R 755 app_root/source_data
          python -m pip install --upgrade pip
          pip install pandas numpy faker pyyaml tabulate

      # ----------------------------------------------------------------------
      # [Step 2] 데이터 팩토리 및 적재 엔진 생성
      # ----------------------------------------------------------------------
      - name: 🛠️ generate_data_factory.py 생성
        run: |
          cat <<'EOF' > generate_data_factory.py
          import os, sys, json, random, time, shutil, glob
          import pandas as pd
          import numpy as np
          from datetime import datetime
          from faker import Faker
          
          fake = Faker('ko_KR')
          
          # ==============================================================================
          # [1] 데이터 레이크 디렉토리 구조 정의 (Smart Partitioning)
          # ==============================================================================
          ROOT = "app_root"
          NOW = datetime.now()
          PARTITION_PATH = f"{NOW.year}/{NOW.month:02d}/{NOW.day:02d}/{NOW.hour:02d}"
          
          DIRS = {
              "SOURCE":   os.path.join(ROOT, "source_data"),
              "LAKE_RAW": os.path.join(ROOT, "data_lake", "raw", PARTITION_PATH),       # 원천 데이터 적재
              "LAKE_PROC": os.path.join(ROOT, "data_lake", "processed", PARTITION_PATH), # 가공 데이터 적재
              "WAREHOUSE": os.path.join(ROOT, "data_warehouse", "mart"),                 # 최종 마트
              "ARCHIVE":  os.path.join(ROOT, "archive_storage")                          # 장기 보관
          }

          # ==============================================================================
          # [2] 데이터 생성기 (Massive Data Generator)
          # ==============================================================================
          class DataFactory:
              def __init__(self):
                  for d in DIRS.values(): os.makedirs(d, exist_ok=True)
                  print(f">>> [Init] Data Lake Initialized at {PARTITION_PATH}")

              def analyze_source(self):
                  """기존 리포지토리의 데이터 패턴 분석"""
                  files = glob.glob(os.path.join(DIRS["SOURCE"], "**", "*.json"), recursive=True)
                  print(f">>> [Source] Found {len(files)} reference files.")
                  return len(files)

              def generate_massive_batch(self, count=10000):
                  """대량의 시뮬레이션 데이터 생성"""
                  print(f">>> [Gen] Generating {count} massive records...")
                  
                  data_batch = []
                  for i in range(count):
                      # Faker를 이용한 고품질 더미 데이터
                      record = {
                          "transaction_id": fake.uuid4(),
                          "timestamp": fake.iso8601(),
                          "user_info": {
                              "name": fake.name(),
                              "email": fake.email(),
                              "company": fake.company(),
                              "job": fake.job()
                          },
                          "cost_data": {
                              "salary": np.random.randint(30000000, 150000000),
                              "expense": np.random.randint(100000, 5000000),
                              "tax_rate": round(random.uniform(0.03, 0.35), 2)
                          },
                          "meta": {
                              "source": "koreatest12/cost-data",
                              "batch_type": "HOURLY"
                          }
                      }
                      data_batch.append(record)
                  return data_batch

              def load_to_lake(self, data):
                  """데이터 레이크 적재 (Load)"""
                  print(">>> [Load] Loading data into Data Lake (Raw Zone)...")
                  
                  # 1000개씩 쪼개서 파일 저장 (Partitioning)
                  chunk_size = 1000
                  for i in range(0, len(data), chunk_size):
                      chunk = data[i:i + chunk_size]
                      filename = f"batch_data_{i//chunk_size:03d}.json"
                      path = os.path.join(DIRS["LAKE_RAW"], filename)
                      
                      class NpEncoder(json.JSONEncoder):
                          def default(self, o):
                              return int(o) if isinstance(o, np.integer) else super().default(o)

                      with open(path, "w", encoding="utf-8") as f:
                          json.dump(chunk, f, ensure_ascii=False, cls=NpEncoder)
                  
                  print(f"✅ Saved {len(data)} records to {DIRS['LAKE_RAW']}")

          # ==============================================================================
          # [3] ETL 프로세서 (Extract -> Transform -> Load)
          # ==============================================================================
          def run_etl_pipeline():
              factory = DataFactory()
              
              # 1. Source 분석
              ref_count = factory.analyze_source()
              
              # 2. 대량 생성 (참조 파일 수에 비례하여 생성량 조절)
              # 기본 5,000건 + 참조파일 * 100건
              gen_count = 5000 + (ref_count * 100)
              raw_data = factory.generate_massive_batch(gen_count)
              
              # 3. Raw Zone 적재
              factory.load_to_lake(raw_data)
              
              # 4. Transform & Load to Mart (간단한 요약 집계)
              print(">>> [Transform] Aggregating Data for Warehouse...")
              df = pd.DataFrame([
                  {
                      "company": d['user_info']['company'],
                      "salary": d['cost_data']['salary']
                  } for d in raw_data
              ])
              
              summary = df.groupby("company")['salary'].mean().reset_index()
              summary.columns = ['Company', 'Avg_Salary']
              
              mart_path = os.path.join(DIRS["WAREHOUSE"], f"salary_summary_{int(time.time())}.csv")
              summary.to_csv(mart_path, index=False)
              print(f"✅ Data Mart Updated: {mart_path}")

              # 5. Archiving (디렉토리 구조 복사)
              print(">>> [Archive] creating backup snapshot...")
              shutil.make_archive(
                  os.path.join(DIRS["ARCHIVE"], f"backup_{NOW.strftime('%Y%m%d_%H')}"),
                  'zip',
                  DIRS["LAKE_RAW"]
              )

          if __name__ == "__main__":
              run_etl_pipeline()
          EOF

      - name: 🏗️ 데이터 팩토리 가동
        run: python generate_data_factory.py

      # ----------------------------------------------------------------------
      # [Step 3] 데이터 적재 결과 검증
      # ----------------------------------------------------------------------
      - name: 📊 적재 현황 리포트
        run: |
          echo "======================================================="
          echo "   🏭 Data Lake & Warehouse Status Report"
          echo "======================================================="
          
          echo "1. [Data Lake - Raw Zone] Partition Structure:"
          tree app_root/data_lake/raw | head -n 20
          
          echo ""
          echo "2. [Data Warehouse - Mart] Generated Reports:"
          ls -lh app_root/data_warehouse/mart/
          
          echo ""
          echo "3. [Archive] Backup Files:"
          ls -lh app_root/archive_storage/

      # ----------------------------------------------------------------------
      # [Step 4] 결과물 업로드 (적재된 데이터 전체)
      # ----------------------------------------------------------------------
      - name: 📦 데이터 레이크 스냅샷 저장
        uses: actions/upload-artifact@v4
        with:
          name: Hourly_Data_Lake_Snapshot
          path: |
             app_root/data_lake/
             app_root/data_warehouse/
             app_root/archive_storage/
          retention-days: 30 # 장기 보관
