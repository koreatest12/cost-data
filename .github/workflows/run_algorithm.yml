name: 🔄 리포지토리 데이터 동기화 및 대량 생성/반영 시스템

on:
  workflow_dispatch:        # 수동 실행
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */4 * * *'   # 4시간마다 최신 데이터 생성 및 반영

env:
  PIP_ROOT_USER_ACTION: ignore
  PYTHONUNBUFFERED: 1
  TZ: 'Asia/Seoul'

jobs:
  massive-data-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📥 시스템 체크아웃
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # [Step 1] 타겟 리포지토리 데이터 다운로드 (Source Download)
      # ----------------------------------------------------------------------
      - name: 📥 koreatest12/cost-data 다운로드
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: app_root/source_repo
          fetch-depth: 0 

      - name: 🔧 환경 및 권한 설정
        run: |
          echo ">>> [Init] Setting up directories..."
          chmod -R 755 app_root/source_repo
          python -m pip install --upgrade pip
          pip install pandas numpy faker openpyxl tabulate

      # ----------------------------------------------------------------------
      # [Step 2] 데이터 증식 및 반영 엔진 생성 (Python Engine)
      # ----------------------------------------------------------------------
      - name: 🛠️ mass_generator.py 생성
        run: |
          cat <<'EOF' > mass_generator.py
          import os, glob, json, random, shutil, uuid
          import pandas as pd
          import numpy as np
          from datetime import datetime, timedelta
          from faker import Faker
          
          # 한국어 더미 데이터 생성기
          fake = Faker('ko_KR')
          
          # ==============================================================================
          # [1] 디렉토리 구조 정의 (Data Lake Architecture)
          # ==============================================================================
          ROOT = "app_root"
          SOURCE_DIR = os.path.join(ROOT, "source_repo")
          
          # 날짜별 파티셔닝
          TODAY = datetime.now().strftime("%Y-%m-%d")
          
          DIRS = {
              "RAW":      os.path.join(ROOT, "data_lake", "raw", TODAY),
              "PROCESSED": os.path.join(ROOT, "data_lake", "processed", TODAY),
              "ANALYTICS": os.path.join(ROOT, "data_warehouse", "analytics"),
              "LATEST":   os.path.join(ROOT, "latest_sync_data")
          }
          
          # ==============================================================================
          # [2] 데이터 분석 및 증식 로직
          # ==============================================================================
          class DataExpander:
              def __init__(self):
                  for d in DIRS.values(): os.makedirs(d, exist_ok=True)
                  print(f">>> [Init] Data Pipeline ready for date: {TODAY}")

              def load_source_patterns(self):
                  """기존 리포지토리 데이터 읽기"""
                  print(">>> [Step 1] Analyze Source Data...")
                  files = glob.glob(os.path.join(SOURCE_DIR, "**", "*.json"), recursive=True)
                  print(f"    - Found {len(files)} JSON source files.")
                  # 패턴 학습 로직 (여기서는 단순 카운트만 활용)
                  return len(files)

              def generate_massive_data(self, base_count):
                  """최신 데이터 대량 생성 (Massive Generation)"""
                  target_count = max(1000, base_count * 100) # 최소 1000건, 원본의 100배
                  print(f">>> [Step 2] Generating {target_count} NEW records based on source...")
                  
                  generated_data = []
                  
                  for i in range(target_count):
                      # 비용 데이터 시뮬레이션
                      cost_item = {
                          "id": str(uuid.uuid4()),
                          "created_at": datetime.now().isoformat(),
                          "category": random.choice(["Development", "Marketing", "Server", "Labor", "Tax"]),
                          "amount": int(np.random.normal(5000000, 2000000)), # 평균 500만원
                          "currency": "KRW",
                          "vendor": fake.company(),
                          "requester": fake.name(),
                          "description": fake.bs(),
                          "is_processed": False
                      }
                      generated_data.append(cost_item)
                  
                  return generated_data

              def reflect_and_load(self, data):
                  """데이터 반영 및 적재 (Load & Partition)"""
                  print(">>> [Step 3] Reflecting & Loading Data...")
                  
                  # 1. Raw Zone 적재 (JSON 분할 저장)
                  chunk_size = 500
                  for i in range(0, len(data), chunk_size):
                      chunk = data[i:i+chunk_size]
                      fname = f"cost_batch_{i//chunk_size:04d}.json"
                      with open(os.path.join(DIRS["RAW"], fname), "w", encoding='utf-8') as f:
                          json.dump(chunk, f, ensure_ascii=False, indent=2)
                  
                  # 2. Processed Zone 적재 (CSV 변환)
                  df = pd.DataFrame(data)
                  csv_path = os.path.join(DIRS["PROCESSED"], "daily_cost_summary.csv")
                  df.to_csv(csv_path, index=False, encoding='utf-8-sig')
                  
                  # 3. Analytics Zone 적재 (요약 통계)
                  summary = df.groupby('category')['amount'].sum().reset_index()
                  summary['updated_at'] = TODAY
                  
                  analytics_path = os.path.join(DIRS["ANALYTICS"], f"report_{TODAY}.json")
                  summary.to_json(analytics_path, orient='records', force_ascii=False)
                  
                  # 4. Latest Sync 폴더로 최신본 복사
                  shutil.copy(csv_path, os.path.join(DIRS["LATEST"], "latest_full_data.csv"))
                  
                  print(f"✅ Data Loaded: {len(data)} records processed.")
                  print(f"    - Raw Path: {DIRS['RAW']}")
                  print(f"    - Processed: {csv_path}")

          if __name__ == "__main__":
              expander = DataExpander()
              count = expander.load_source_patterns()
              new_data = expander.generate_massive_data(count)
              expander.reflect_and_load(new_data)
          EOF

      # ----------------------------------------------------------------------
      # [Step 3] 파이프라인 가동
      # ----------------------------------------------------------------------
      - name: 🚀 데이터 생성 및 반영 실행
        run: python mass_generator.py

      # ----------------------------------------------------------------------
      # [Step 4] 결과 확인 (Verification)
      # ----------------------------------------------------------------------
      - name: 📊 생성된 데이터 현황 리포트
        run: |
          echo "======================================================="
          echo "   🏭 Massive Data Generation Report"
          echo "======================================================="
          
          echo "[1] Source Data (koreatest12/cost-data):"
          find app_root/source_repo -type f | wc -l
          
          echo ""
          echo "[2] Raw Data Lake (Generated JSON Batches):"
          ls -1 app_root/data_lake/raw/$(date +%Y-%m-%d)/ | head -n 10
          echo "... and many more files."
          
          echo ""
          echo "[3] Processed Data (Latest CSV):"
          ls -lh app_root/latest_sync_data/
          
          echo ""
          echo "[4] Analytics Report:"
          ls -lh app_root/data_warehouse/analytics/

      # ----------------------------------------------------------------------
      # [Step 5] 전체 데이터 아티팩트 저장 (다운로드 가능하도록)
      # ----------------------------------------------------------------------
      - name: 📦 최신 데이터 패키지 업로드
        uses: actions/upload-artifact@v6
        with:
          name: Latest_Massive_Cost_Data
          path: |
             app_root/data_lake/
             app_root/data_warehouse/
             app_root/latest_sync_data/
          retention-days: 7
