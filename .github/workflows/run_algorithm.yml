name: 🏢 세금 마스터 시스템 (대시보드 시각화 강화판)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  master-processing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 메인 시스템 체크아웃
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # [Step 1] 데이터 스캔 준비
      # ----------------------------------------------------------------------
      - name: 📥 데이터 마이그레이션 (koreatest12/cost-data)
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: app_root/cost_data
          fetch-depth: 0 

      - name: 🔧 파일 권한 및 환경 설정
        run: chmod -R 755 app_root/cost_data
          
      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # ----------------------------------------------------------------------
      # [Step 2] 프로젝트 생성 스크립트 (대시보드 UI 대폭 추가)
      # ----------------------------------------------------------------------
      - name: 🛠️ generate_full_project.py 생성
        run: |
          cat <<EOF > generate_full_project.py
          import os

          # ==============================================================================
          # [1] 설정 및 라이브러리
          # ==============================================================================
          
          REQ_TXT = """
          flask
          pandas
          openpyxl
          pdfplumber
          tabulate
          """

          DOCKERFILE = """
          FROM python:3.9-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY . .
          RUN chmod -R 755 cost_data
          EXPOSE 8080
          CMD ["python", "app.py"]
          """

          # ==============================================================================
          # [2] 정산 엔진 (engine.py) - 통계 데이터 산출 기능 추가
          # ==============================================================================
          ENGINE_PY = r'''
          import os, glob, json, re
          import pandas as pd
          import pdfplumber
          from collections import defaultdict
          from tabulate import tabulate

          DATA_DIR = 'cost_data'
          RECEIPT_DIR = 'receipts'

          db = defaultdict(lambda: {
              'salary': 0, 'pension': 0, 'insurance': 0,
              'medical': 0, 'card': 0, 'donation': 0,
              'pre_paid': 0, 'files': set(), 'dependents': 1
          })

          def extract_number(text, keywords, min_value=0):
              best_val = 0
              for key in keywords:
                  matches = re.finditer(key + r'[^0-9\n]*([0-9,]+)', text)
                  for match in matches:
                      try:
                          val = int(match.group(1).replace(',', ''))
                          if val >= min_value: best_val = max(best_val, val)
                      except: pass
              return best_val

          def migrate_data():
              # 모든 하위 폴더 스캔
              search_path = os.path.join(DATA_DIR, '**', '*')
              all_files = [f for f in glob.glob(search_path, recursive=True) if os.path.isfile(f)]
              print(f">>> [Scan] {len(all_files)} files detected.")

              for filepath in all_files:
                  try:
                      fname = os.path.basename(filepath)
                      _, ext = os.path.splitext(filepath)
                      ext = ext.lower()
                      name = None
                      
                      if ext == '.json':
                          with open(filepath, 'r', encoding='utf-8') as f:
                              js = json.load(f)
                              name = js.get('name')
                              if name:
                                  db[name]['salary'] = max(db[name]['salary'], int(js.get('total_salary', 0)))
                                  db[name]['card'] += int(js.get('credit', 0)) + int(js.get('debit', 0))
                      elif ext in ['.xlsx', '.xls']:
                          df = pd.read_excel(filepath)
                          row = df.iloc[0]
                          for col in ['name', '성명', '이름']:
                              if col in df.columns: name = row[col]; break
                          if name:
                              if 'total_salary' in row: db[name]['salary'] = max(db[name]['salary'], int(row['total_salary']))
                              if 'credit' in row: db[name]['card'] += int(row['credit'])
                      elif ext == '.pdf':
                          with pdfplumber.open(filepath) as pdf:
                              text = "".join([p.extract_text() or "" for p in pdf.pages])
                              nm_match = re.search(r'성\s*명\s*[:]?\s*([가-힣]{2,4})', text)
                              if nm_match: name = nm_match.group(1)
                              else:
                                  nm_file = re.match(r'([가-힣]{2,4})', fname)
                                  if nm_file: name = nm_file.group(1)
                              if name:
                                  salary = extract_number(text, ['총급여', '급여계'], 1000000)
                                  if salary > 0: db[name]['salary'] = max(db[name]['salary'], salary)
                                  db[name]['insurance'] += extract_number(text, ['보장성', '보험료'])
                                  db[name]['pension'] += extract_number(text, ['국민연금', '연금'])
                                  db[name]['medical'] += extract_number(text, ['의료비'])
                                  db[name]['card'] += extract_number(text, ['신용카드', '현금영수증'])
                                  db[name]['donation'] += extract_number(text, ['기부금'])
                      if name: db[name]['files'].add(fname)
                  except: pass
              return db

          class TaxCalculator:
              @staticmethod
              def compute(data):
                  salary = data['salary']
                  if salary == 0: return None
                  
                  # 근로소득공제
                  if salary <= 5000000: income_ded = salary * 0.7
                  elif salary <= 15000000: income_ded = 3500000 + (salary - 5000000) * 0.4
                  elif salary <= 45000000: income_ded = 7500000 + (salary - 15000000) * 0.15
                  elif salary <= 100000000: income_ded = 12000000 + (salary - 45000000) * 0.05
                  else: income_ded = 14750000 + (salary - 100000000) * 0.02
                  
                  # 과세표준
                  personal_ded = data['dependents'] * 1500000
                  card_ded = min(max((data['card'] - salary*0.25) * 0.15, 0), 3000000)
                  tax_base = max(salary - income_ded - personal_ded - data['pension'] - card_ded, 0)
                  
                  # 산출세액
                  if tax_base <= 14000000: calc_tax = tax_base * 0.06
                  elif tax_base <= 50000000: calc_tax = 840000 + (tax_base - 14000000) * 0.15
                  elif tax_base <= 88000000: calc_tax = 6240000 + (tax_base - 50000000) * 0.24
                  else: calc_tax = 15360000 + (tax_base - 88000000) * 0.35
                  
                  # 세액공제 및 결정세액
                  credits = min(data['insurance'], 1000000)*0.12 + max(data['medical']-salary*0.03, 0)*0.15
                  determined = max(calc_tax - credits, 0)
                  
                  pre_paid = data['pre_paid'] if data['pre_paid'] > 0 else int(salary * 0.045)
                  
                  return {
                      "income_ded": int(income_ded),
                      "tax_base": int(tax_base),
                      "determined": int(determined),
                      "pre_paid": int(pre_paid),
                      "final": int(determined - pre_paid)
                  }

          def generate_receipt(r):
              res = r['result']
              color = "blue" if res['final'] < 0 else "red"
              res_txt = "환급" if res['final'] < 0 else "징수"
              html = f"""
              <html><head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
              <body class="p-5 bg-light"><div class="container bg-white p-5 shadow" style="max-width:800px">
              <h2 class="text-center border-bottom pb-3">🧾 원천징수 영수증</h2>
              <table class="table mt-4"><tr><th>성명</th><td>{r['name']}</td><th>총급여</th><td>{r['salary']:,}</td></tr>
              <tr><th>결정세액</th><td>{res['determined']:,}</td><th>기납부</th><td>{res['pre_paid']:,}</td></tr>
              <tr class="fs-4 fw-bold"><td colspan="2">결과 ({res_txt})</td><td colspan="2" style="color:{color}">{abs(res['final']):,} 원</td></tr>
              </table>
              <div class="text-center mt-4"><button onclick="window.print()" class="btn btn-dark">🖨️ 인쇄</button></div>
              </div></body></html>
              """
              with open(os.path.join(RECEIPT_DIR, f"{r['name']}.html"), "w", encoding="utf-8") as f: f.write(html)

          def run_simulation():
              migrate_data()
              results = []
              for name, data in db.items():
                  if not name or len(name) < 2: continue
                  
                  if data['salary'] == 0: data['salary'] = 40000000 # 추정치
                  calc = TaxCalculator.compute(data)
                  
                  entry = {
                      "name": name,
                      "salary": data['salary'],
                      "dependents": data['dependents'],
                      "files_count": len(data['files']),
                      "result": calc,
                      "final_money": calc['final'],
                      "type": "환급" if calc['final'] < 0 else "징수"
                  }
                  generate_receipt(entry)
                  results.append(entry)
              return results

          if __name__ == "__main__":
              res = run_simulation()
              with open('final_result.json', 'w', encoding='utf-8') as f: json.dump(res, f, ensure_ascii=False)
              print(f"DONE: Processed {len(res)} people.")
          '''

          # ==============================================================================
          # [3] 대시보드 웹 앱 (App.py) - Chart.js 및 시각화 강화
          # ==============================================================================
          APP_PY = r'''
          from flask import Flask, render_template_string, send_from_directory
          import json, os
          app = Flask(__name__)

          @app.route('/')
          def index():
              try:
                  with open('final_result.json', 'r', encoding='utf-8') as f: results = json.load(f)
              except: results = []
              
              # 통계 데이터 계산
              total_people = len(results)
              refund_people = len([r for r in results if r['final_money'] < 0])
              collect_people = len([r for r in results if r['final_money'] >= 0])
              total_refund = sum([abs(r['final_money']) for r in results if r['final_money'] < 0])
              total_collect = sum([r['final_money'] for r in results if r['final_money'] >= 0])
              avg_salary = sum([r['salary'] for r in results]) / total_people if total_people > 0 else 0
              
              # 차트 데이터 준비
              salary_ranges = {"3천이하":0, "3천~5천":0, "5천~7천":0, "7천~1억":0, "1억이상":0}
              for r in results:
                  s = r['salary']
                  if s <= 30000000: salary_ranges["3천이하"] += 1
                  elif s <= 50000000: salary_ranges["3천~5천"] += 1
                  elif s <= 70000000: salary_ranges["5천~7천"] += 1
                  elif s <= 100000000: salary_ranges["7천~1억"] += 1
                  else: salary_ranges["1억이상"] += 1

              html = """
              <!DOCTYPE html>
              <html>
              <head>
                  <title>Tax Master Dashboard</title>
                  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
                  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
                  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
                  <style>
                      body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
                      .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; }
                      .card:hover { transform: translateY(-5px); }
                      .kpi-icon { font-size: 2.5rem; opacity: 0.8; }
                      .sidebar { background: #2c3e50; min-height: 100vh; color: white; }
                      .nav-link { color: rgba(255,255,255,0.8); padding: 15px 20px; }
                      .nav-link:hover, .nav-link.active { background: #34495e; color: white; border-left: 4px solid #3498db; }
                  </style>
              </head>
              <body>
                  <div class="container-fluid">
                      <div class="row">
                          <div class="col-md-2 sidebar d-none d-md-block p-0">
                              <div class="p-4 text-center border-bottom border-secondary">
                                  <h4 class="fw-bold"><i class="fas fa-building"></i> Tax Master</h4>
                                  <small class="text-muted">Enterprise Edition</small>
                              </div>
                              <nav class="nav flex-column mt-3">
                                  <a class="nav-link active" href="#"><i class="fas fa-chart-line me-2"></i> 대시보드</a>
                                  <a class="nav-link" href="#"><i class="fas fa-users me-2"></i> 임직원 관리</a>
                                  <a class="nav-link" href="#"><i class="fas fa-file-invoice-dollar me-2"></i> 정산 리포트</a>
                                  <a class="nav-link" href="#"><i class="fas fa-cog me-2"></i> 설정</a>
                              </nav>
                          </div>

                          <div class="col-md-10 p-4">
                              <div class="d-flex justify-content-between align-items-center mb-4">
                                  <h2 class="fw-bold text-dark">📊 2024년 귀속 연말정산 대시보드</h2>
                                  <button class="btn btn-primary shadow-sm"><i class="fas fa-download me-2"></i> 전체 리포트 다운로드</button>
                              </div>

                              <div class="row g-4 mb-4">
                                  <div class="col-md-3">
                                      <div class="card bg-white p-3">
                                          <div class="d-flex justify-content-between align-items-center">
                                              <div>
                                                  <h6 class="text-muted text-uppercase mb-1">총 대상자</h6>
                                                  <h3 class="fw-bold">{{ total_people }} 명</h3>
                                              </div>
                                              <div class="kpi-icon text-primary"><i class="fas fa-users"></i></div>
                                          </div>
                                      </div>
                                  </div>
                                  <div class="col-md-3">
                                      <div class="card bg-white p-3">
                                          <div class="d-flex justify-content-between align-items-center">
                                              <div>
                                                  <h6 class="text-muted text-uppercase mb-1">예상 환급액</h6>
                                                  <h3 class="fw-bold text-success">{{ "{:,}".format(total_refund) }}</h3>
                                              </div>
                                              <div class="kpi-icon text-success"><i class="fas fa-hand-holding-usd"></i></div>
                                          </div>
                                      </div>
                                  </div>
                                  <div class="col-md-3">
                                      <div class="card bg-white p-3">
                                          <div class="d-flex justify-content-between align-items-center">
                                              <div>
                                                  <h6 class="text-muted text-uppercase mb-1">예상 징수액</h6>
                                                  <h3 class="fw-bold text-danger">{{ "{:,}".format(total_collect) }}</h3>
                                              </div>
                                              <div class="kpi-icon text-danger"><i class="fas fa-file-invoice"></i></div>
                                          </div>
                                      </div>
                                  </div>
                                  <div class="col-md-3">
                                      <div class="card bg-white p-3">
                                          <div class="d-flex justify-content-between align-items-center">
                                              <div>
                                                  <h6 class="text-muted text-uppercase mb-1">평균 연봉</h6>
                                                  <h3 class="fw-bold text-info">{{ "{:,}".format(int(avg_salary)) }}</h3>
                                              </div>
                                              <div class="kpi-icon text-info"><i class="fas fa-chart-bar"></i></div>
                                          </div>
                                      </div>
                                  </div>
                              </div>

                              <div class="row g-4 mb-4">
                                  <div class="col-md-8">
                                      <div class="card p-4 h-100">
                                          <h5 class="fw-bold mb-3">💰 급여 구간별 인원 분포</h5>
                                          <canvas id="salaryChart"></canvas>
                                      </div>
                                  </div>
                                  <div class="col-md-4">
                                      <div class="card p-4 h-100">
                                          <h5 class="fw-bold mb-3">⚖️ 정산 결과 비율</h5>
                                          <canvas id="resultChart"></canvas>
                                      </div>
                                  </div>
                              </div>

                              <div class="card p-4">
                                  <h5 class="fw-bold mb-3">📋 임직원별 상세 정산 내역</h5>
                                  <div class="table-responsive">
                                      <table class="table table-hover align-middle">
                                          <thead class="table-light">
                                              <tr><th>성명</th><th>연봉</th><th>부양가족</th><th>결정세액</th><th>최종결과</th><th>영수증</th></tr>
                                          </thead>
                                          <tbody>
                                              {% for r in results %}
                                              <tr>
                                                  <td class="fw-bold">{{ r.name }}</td>
                                                  <td>{{ "{:,}".format(r.salary) }}</td>
                                                  <td>{{ r.dependents }}명</td>
                                                  <td>{{ "{:,}".format(r.result.determined) }}</td>
                                                  <td>
                                                      {% if r.final_money < 0 %}
                                                      <span class="badge bg-success rounded-pill">환급 {{ "{:,}".format(abs(r.final_money)) }}</span>
                                                      {% else %}
                                                      <span class="badge bg-danger rounded-pill">징수 {{ "{:,}".format(r.final_money) }}</span>
                                                      {% endif %}
                                                  </td>
                                                  <td><a href="/receipt/{{ r.name }}" target="_blank" class="btn btn-sm btn-outline-dark"><i class="fas fa-file-pdf"></i> 발급</a></td>
                                              </tr>
                                              {% endfor %}
                                          </tbody>
                                      </table>
                                  </div>
                              </div>
                          </div>
                      </div>
                  </div>

                  <script>
                      // 1. 급여 분포 차트
                      const ctx1 = document.getElementById('salaryChart').getContext('2d');
                      new Chart(ctx1, {
                          type: 'bar',
                          data: {
                              labels: {{ salary_ranges.keys() | list | tojson }},
                              datasets: [{
                                  label: '인원 수',
                                  data: {{ salary_ranges.values() | list | tojson }},
                                  backgroundColor: '#3498db',
                                  borderRadius: 5
                              }]
                          },
                          options: { responsive: true, plugins: { legend: { display: false } } }
                      });

                      // 2. 결과 비율 차트
                      const ctx2 = document.getElementById('resultChart').getContext('2d');
                      new Chart(ctx2, {
                          type: 'doughnut',
                          data: {
                              labels: ['환급 대상', '징수 대상'],
                              datasets: [{
                                  data: [{{ refund_people }}, {{ collect_people }}],
                                  backgroundColor: ['#2ecc71', '#e74c3c'],
                                  hoverOffset: 4
                              }]
                          },
                          options: { responsive: true }
                      });
                  </script>
              </body>
              </html>
              """
              return render_template_string(html, results=results, total_people=total_people, total_refund=total_refund, 
                                            total_collect=total_collect, avg_salary=avg_salary, salary_ranges=salary_ranges,
                                            refund_people=refund_people, collect_people=collect_people)

          @app.route('/receipt/<name>')
          def get_receipt(name): return send_from_directory('receipts', f"{name}.html")

          if __name__ == '__main__': app.run(host='0.0.0.0', port=8080)
          '''

          # ==============================================================================
          # [4] 파일 생성
          # ==============================================================================
          def create_full_project():
              base_dir = "app_root"
              os.makedirs(os.path.join(base_dir, "templates"), exist_ok=True)
              os.makedirs(os.path.join(base_dir, "static"), exist_ok=True)
              os.makedirs(os.path.join(base_dir, "receipts"), exist_ok=True)
              
              with open(os.path.join(base_dir, "requirements.txt"), "w") as f: f.write(REQ_TXT.strip())
              with open(os.path.join(base_dir, "Dockerfile"), "w") as f: f.write(DOCKERFILE.strip())
              with open(os.path.join(base_dir, "engine.py"), "w", encoding="utf-8") as f: f.write(ENGINE_PY.strip())
              with open(os.path.join(base_dir, "app.py"), "w", encoding="utf-8") as f: f.write(APP_PY.strip())
              
              print(f"✅ Dashboard Project Created at {os.path.abspath(base_dir)}")

          if __name__ == "__main__":
              create_full_project()
          EOF

      - name: 🏗️ 대시보드 프로젝트 생성기 실행
        run: python generate_full_project.py

      # ----------------------------------------------------------------------
      # [Step 3] 시스템 구동
      # ----------------------------------------------------------------------
      - name: 🚀 엔진 구동 및 결과 생성
        run: |
          cd app_root
          pip install -r requirements.txt
          python engine.py

      # ----------------------------------------------------------------------
      # [Step 4] 패키징 및 저장
      # ----------------------------------------------------------------------
      - name: 🐳 Docker 이미지 빌드
        run: |
          cd app_root
          docker build -t tax-master-system:latest .
          docker save -o tax-master-system.tar tax-master-system:latest

      - name: 📦 실행 파일 저장 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: 세금 마스터 시스템 앱 (대시보드 포함)
          path: |
             app_root/tax-master-system.tar
             generate_full_project.py
          retention-days: 7
