name: 🏢 엔터프라이즈 컨테이너 설치 및 데이터 적재 시스템

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PIP_ROOT_USER_ACTION: ignore
  PYTHONUNBUFFERED: 1

jobs:
  container-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📥 소스 체크아웃
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # [Step 1] 데이터 준비
      # ----------------------------------------------------------------------
      - name: 📥 데이터 수집 (koreatest12/cost-data)
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: app_root/raw_data
          fetch-depth: 0 

      - name: 🔧 권한 설정
        run: chmod -R 755 app_root/raw_data
          
      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pdfplumber faker flask pyyaml

      # ----------------------------------------------------------------------
      # [Step 2] 아키텍처 및 Docker Compose 생성
      # ----------------------------------------------------------------------
      - name: 🛠️ 인프라 코드 생성 (docker-compose & loading scripts)
        run: |
          cat <<'EOF' > generate_infrastructure.py
          import os, sys, yaml, shutil

          # ==============================================================================
          # [1] 디렉토리 및 서비스 정의
          # ==============================================================================
          ROOT = "app_root"
          SERVICES = ["auth-server", "calc-engine", "storage-node", "log-aggregator", "dashboard-ui"]
          
          # 호스트 측 데이터 경로 (여기에 데이터가 준비되면 컨테이너로 마운트됨)
          HOST_VOLUMES = {
              "auth_data":    os.path.join(ROOT, "volumes", "auth_db"),
              "calc_input":   os.path.join(ROOT, "volumes", "calc_input"),
              "storage_data": os.path.join(ROOT, "volumes", "receipts"),
              "log_data":     os.path.join(ROOT, "volumes", "audit_logs")
          }

          # ==============================================================================
          # [2] Docker Compose 생성 (컨테이너 설치 명세서)
          # ==============================================================================
          def generate_docker_compose():
              compose = {
                  "version": "3.8",
                  "services": {},
                  "networks": {"tax-net": {"driver": "bridge"}},
                  "volumes": {
                      "auth-vol": {}, "calc-vol": {}, "storage-vol": {}, "log-vol": {}
                  }
              }
              
              for svc in SERVICES:
                  # 각 서비스별 설정
                  service_def = {
                      "build": f"./containers/{svc}",
                      "container_name": f"tax-{svc}",
                      "networks": ["tax-net"],
                      "restart": "always",
                      "environment": ["ENV=PRODUCTION"]
                  }
                  
                  # 볼륨 마운트 (데이터 적재 포인트)
                  if svc == "auth-server":
                      service_def["volumes"] = [f"{os.path.abspath(HOST_VOLUMES['auth_data'])}:/app/data"]
                      service_def["ports"] = ["5001:5000"]
                  elif svc == "calc-engine":
                      service_def["volumes"] = [f"{os.path.abspath(HOST_VOLUMES['calc_input'])}:/app/input"]
                  elif svc == "storage-node":
                      service_def["volumes"] = [f"{os.path.abspath(HOST_VOLUMES['storage_data'])}:/app/storage"]
                  elif svc == "log-aggregator":
                      service_def["volumes"] = [f"{os.path.abspath(HOST_VOLUMES['log_data'])}:/app/logs"]
                  elif svc == "dashboard-ui":
                      service_def["ports"] = ["8080:8080"]
                      service_def["depends_on"] = ["auth-server", "calc-engine"]
                  
                  compose["services"][svc] = service_def
              
              with open(os.path.join(ROOT, "docker-compose.yml"), "w") as f:
                  yaml.dump(compose, f, default_flow_style=False)
              print("✅ docker-compose.yml Generated.")

          # ==============================================================================
          # [3] 컨테이너 소스 코드 생성 (가상환경 VENV 적용)
          # ==============================================================================
          def generate_containers():
              base_dockerfile = """
          FROM python:3.9-slim
          ENV VIRTUAL_ENV=/opt/venv
          RUN python3 -m venv $VIRTUAL_ENV
          ENV PATH="$VIRTUAL_ENV/bin:$PATH"
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY . .
          CMD ["python", "app.py"]
          """
              
              for svc in SERVICES:
                  path = os.path.join(ROOT, "containers", svc)
                  os.makedirs(path, exist_ok=True)
                  
                  # Dockerfile
                  with open(os.path.join(path, "Dockerfile"), "w") as f: f.write(base_dockerfile.strip())
                  
                  # Requirements
                  with open(os.path.join(path, "requirements.txt"), "w") as f: f.write("flask\nwatchdog")
                  
                  # App Code (데이터 감지 로직 포함)
                  app_code = f"""
          import os, time
          from flask import Flask
          app = Flask(__name__)
          
          SERVICE_NAME = "{svc}"
          DATA_DIR = "/app/data" if "auth" in SERVICE_NAME else "/app/input" if "calc" in SERVICE_NAME else "/app/storage"
          
          @app.route('/')
          def index():
              # 적재된 데이터 확인
              files = os.listdir(DATA_DIR) if os.path.exists(DATA_DIR) else []
              return f"<h1>{{SERVICE_NAME}} Online</h1><p>Loaded Files: {{len(files)}}</p>"

          if __name__ == "__main__":
              print(f"Starting {{SERVICE_NAME}}...")
              app.run(host='0.0.0.0', port=5000)
          """
                  with open(os.path.join(path, "app.py"), "w") as f: f.write(app_code.strip())

          # ==============================================================================
          # [4] 데이터 적재 스크립트 (Loader Logic)
          # ==============================================================================
          def generate_loader():
              loader_code = r'''
          import os, shutil, glob, time, json
          import numpy as np

          # 호스트 경로 설정 (이 경로에 파일을 넣으면 컨테이너 내부로 마운트됨)
          VOLUMES = {
              "AUTH":    "app_root/volumes/auth_db",
              "CALC":    "app_root/volumes/calc_input",
              "STORAGE": "app_root/volumes/receipts",
              "LOGS":    "app_root/volumes/audit_logs"
          }

          def inject_data():
              print(">>> [Loader] Starting Data Injection to Containers...")
              
              # 1. Auth Service 적재 (사용자 DB 생성)
              users = [{"id": f"user_{i}", "role": "admin" if i<5 else "user"} for i in range(100)]
              with open(os.path.join(VOLUMES["AUTH"], "users.json"), "w") as f:
                  json.dump(users, f)
              print(f"✅ Loaded {len(users)} users into [Auth Container]")

              # 2. Calc Service 적재 (Raw Data 이동)
              raw_files = glob.glob("app_root/raw_data/**/*.json", recursive=True)
              for i, src in enumerate(raw_files[:50]): # 샘플 50개
                  dst = os.path.join(VOLUMES["CALC"], f"tax_data_{i}.json")
                  shutil.copy(src, dst)
              print(f"✅ Loaded {len(raw_files[:50])} tax records into [Calc Container]")

              # 3. Storage Service 적재 (영수증 생성)
              for i in range(20):
                  with open(os.path.join(VOLUMES["STORAGE"], f"receipt_{i}.html"), "w") as f:
                      f.write("<html>Receipt</html>")
              print(f"✅ Loaded 20 receipts into [Storage Container]")

              # 4. Logs 적재
              with open(os.path.join(VOLUMES["LOGS"], "startup.log"), "w") as f:
                  f.write(f"System started at {time.ctime()}")
              print("✅ Initialized Logs in [Log Container]")

          if __name__ == "__main__":
              # 디렉토리 초기화
              for p in VOLUMES.values(): os.makedirs(p, exist_ok=True)
              inject_data()
          '''
              with open("data_loader.py", "w") as f: f.write(loader_code.strip())

          if __name__ == "__main__":
              for p in HOST_VOLUMES.values(): os.makedirs(p, exist_ok=True)
              generate_docker_compose()
              generate_containers()
              generate_loader()
              print(">>> Infrastructure Generation Complete.")
          EOF

      - name: 🏗️ 인프라 및 컨테이너 코드 생성
        run: python generate_infrastructure.py

      # ----------------------------------------------------------------------
      # [Step 3] 컨테이너 설치 및 구동 (Docker Compose)
      # ----------------------------------------------------------------------
      - name: 🚀 컨테이너 스택 설치 (Install & Up)
        run: |
          cd app_root
          
          echo ">>> [Install] Pulling & Building Services..."
          docker-compose build
          
          echo ">>> [Deploy] Starting Container Stack..."
          docker-compose up -d
          
          echo ">>> [Check] Waiting for services..."
          sleep 10
          docker-compose ps

      # ----------------------------------------------------------------------
      # [Step 4] 서비스별 데이터 적재 (Data Injection)
      # ----------------------------------------------------------------------
      - name: 🚚 데이터 적재 실행 (Inject to Volumes)
        run: |
          echo ">>> [ETL] Injecting data into running containers..."
          python data_loader.py

      # ----------------------------------------------------------------------
      # [Step 5] 적재 결과 검증
      # ----------------------------------------------------------------------
      - name: 🔍 컨테이너 내부 데이터 검증 (Verification)
        run: |
          echo "================================================="
          echo "   🕵️ Container Data Verification Report"
          echo "================================================="
          
          echo "[1] Auth Service Data (User DB):"
          ls -lh app_root/volumes/auth_db/
          
          echo "[2] Calc Service Data (Input Files):"
          ls -1 app_root/volumes/calc_input/ | head -n 5
          echo "... (Total $(ls app_root/volumes/calc_input/ | wc -l) files)"
          
          echo "[3] Storage Service (Receipts):"
          ls -1 app_root/volumes/receipts/ | head -n 5
          
          echo "[4] Log Aggregator:"
          cat app_root/volumes/audit_logs/startup.log

      - name: 🐳 컨테이너 로그 및 볼륨 백업
        if: always()
        run: |
          cd app_root
          docker-compose logs > system_wide.log

      - name: 📦 전체 시스템 아티팩트 저장
        uses: actions/upload-artifact@v4
        with:
          name: Installed_Container_System
          path: |
             app_root/docker-compose.yml
             app_root/volumes/
             app_root/system_wide.log
          retention-days: 7
