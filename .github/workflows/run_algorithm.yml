name: 🏢 엔터프라이즈 시스템 (가상환경 VENV 적용 및 경고 해결)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]

# [핵심] 전역 환경 변수 설정 (Pip 경고 제어)
env:
  PIP_ROOT_USER_ACTION: ignore  # 루트 유저로 실행 시 경고 무시 (CI 환경 표준)
  PYTHONUNBUFFERED: 1           # 로그 즉시 출력

jobs:
  enterprise-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: 📥 시스템 소스 체크아웃
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # [Step 1] 데이터 레이크 초기화
      # ----------------------------------------------------------------------
      - name: 📥 원천 데이터 수집 (koreatest12/cost-data)
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: app_root/raw_data
          fetch-depth: 0 

      - name: 🔧 데이터 레이크 권한 설정
        run: chmod -R 755 app_root/raw_data
          
      - name: 🐍 파이썬 런타임 구성
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # ----------------------------------------------------------------------
      # [Step 2] 인프라 모듈 설치 (가상환경 사용 권장 대응)
      # ----------------------------------------------------------------------
      - name: 📦 인프라 모듈 대량 설치
        run: |
          echo ">>> [Infra] Setting up Python dependencies..."
          # Pip 업그레이드 및 필수 패키지 설치
          python -m pip install --upgrade pip
          pip install pandas openpyxl pdfplumber tabulate faker numpy flask requests

      # ----------------------------------------------------------------------
      # [Step 3] 아키텍처 생성기 (VENV 적용된 Dockerfile 생성)
      # ----------------------------------------------------------------------
      - name: 🛠️ generate_enterprise_arch.py 실행
        run: |
          cat <<'EOF' > generate_enterprise_arch.py
          import os, sys, glob, json, re, random, time, shutil
          import pandas as pd
          import numpy as np
          from datetime import datetime

          # ==============================================================================
          # [1] 디렉토리 구조 정의
          # ==============================================================================
          ROOT = "app_root"
          DIRS = {
              "RAW":      os.path.join(ROOT, "raw_data"),
              "BACKUP":   os.path.join(ROOT, "data_lake", "backup_zone"),
              "ARCHIVE":  os.path.join(ROOT, "data_lake", "archive_zone"),
              "MART":     os.path.join(ROOT, "data_warehouse", "data_mart"),
              "LOGS":     os.path.join(ROOT, "system_logs"),
              "CONTAINERS": os.path.join(ROOT, "containers")
          }
          MICROSERVICES = ["auth-service", "calc-engine", "log-aggregator", "storage-gateway"]

          REQ_TXT = """
          flask
          pandas
          numpy
          pdfplumber
          faker
          """

          # ==============================================================================
          # [2] ETL 파이프라인 엔진
          # ==============================================================================
          ENGINE_CODE = r'''
          import os, glob, json, shutil, time, random
          import pandas as pd
          import numpy as np
          from datetime import datetime

          DIRS = {
              "RAW":      "raw_data",
              "BACKUP":   "data_lake/backup_zone",
              "ARCHIVE":  "data_lake/archive_zone",
              "MART":     "data_warehouse/data_mart",
              "LOGS":     "system_logs"
          }

          class DataPipeline:
              def __init__(self):
                  for d in DIRS.values(): os.makedirs(d, exist_ok=True)
                  self.log_file = os.path.join(DIRS["LOGS"], "pipeline.log")

              def log(self, msg):
                  ts = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
                  with open(self.log_file, "a") as f: f.write(f"[{ts}] {msg}\n")
                  print(f"[{ts}] {msg}")

              def replicate_data(self):
                  self.log("[ETL] Starting Backup Replication...")
                  files = glob.glob(os.path.join(DIRS["RAW"], "**", "*.*"), recursive=True)
                  for src in files:
                      if os.path.isfile(src):
                          shutil.copy2(src, os.path.join(DIRS["BACKUP"], os.path.basename(src)))
                  self.log(f"[ETL] Backup complete: {len(files)} files.")

              def process_and_load(self):
                  self.log("[ETL] Generating Mart Data...")
                  users = [{"id": f"U{i}", "amt": int(np.random.normal(5000,1000))} for i in range(1000)]
                  
                  class NpEncoder(json.JSONEncoder):
                      def default(self, o):
                          return int(o) if isinstance(o, np.integer) else super().default(o)
                          
                  with open(os.path.join(DIRS["MART"], "daily.json"), "w") as f:
                      json.dump(users, f, cls=NpEncoder)
                  return len(users)

              def archive_processed(self):
                  self.log("[ETL] Archiving...")
                  for f in os.listdir(DIRS["BACKUP"])[:20]:
                      shutil.move(os.path.join(DIRS["BACKUP"], f), os.path.join(DIRS["ARCHIVE"], f))

          if __name__ == "__main__":
              p = DataPipeline()
              p.replicate_data()
              p.process_and_load()
              p.archive_processed()
          '''

          APP_CODE = r'''
          from flask import Flask
          import os
          app = Flask(__name__)
          @app.route('/')
          def index():
              return "<h1>Enterprise System Online</h1>"
          if __name__ == '__main__': app.run(host='0.0.0.0', port=8080)
          '''

          def main():
              print(">>> [Gen] Generating Enterprise Architecture with VENV Support...")
              for path in DIRS.values(): os.makedirs(path, exist_ok=True)

              # [핵심] 가상환경(VENV)이 적용된 Dockerfile 생성
              for svc in MICROSERVICES:
                  svc_path = os.path.join(DIRS["CONTAINERS"], svc)
                  os.makedirs(svc_path, exist_ok=True)
                  
                  # VIRTUAL_ENV 환경변수와 PATH 설정을 통해 가상환경 활성화
                  dfile = f"""
                  FROM python:3.9-slim
                  
                  # 1. 가상환경 설정
                  ENV VIRTUAL_ENV=/opt/venv
                  RUN python3 -m venv $VIRTUAL_ENV
                  ENV PATH="$VIRTUAL_ENV/bin:$PATH"

                  # 2. 작업 디렉토리 설정
                  WORKDIR /app
                  
                  # 3. 의존성 설치 (가상환경 내부에 설치됨)
                  COPY requirements.txt .
                  RUN pip install --no-cache-dir -r requirements.txt
                  
                  # 4. 앱 실행
                  COPY app.py .
                  CMD ["python", "app.py"]
                  """
                  with open(os.path.join(svc_path, "Dockerfile"), "w") as f: f.write(dfile.strip())
                  with open(os.path.join(svc_path, "requirements.txt"), "w") as f: f.write(REQ_TXT.strip())
                  with open(os.path.join(svc_path, "app.py"), "w") as f: f.write(f"print('{svc} running in venv')")

              # 메인 루트 파일 생성
              with open(os.path.join(ROOT, "engine.py"), "w", encoding="utf-8") as f: f.write(ENGINE_CODE.strip())
              with open(os.path.join(ROOT, "app.py"), "w", encoding="utf-8") as f: f.write(APP_CODE.strip())
              with open(os.path.join(ROOT, "requirements.txt"), "w") as f: f.write(REQ_TXT.strip())

              # 오케스트레이터 Dockerfile (VENV 적용)
              root_docker = """
              FROM python:3.9-slim
              ENV VIRTUAL_ENV=/opt/venv
              RUN python3 -m venv $VIRTUAL_ENV
              ENV PATH="$VIRTUAL_ENV/bin:$PATH"
              
              WORKDIR /app
              COPY . .
              RUN pip install --no-cache-dir -r requirements.txt
              EXPOSE 8080
              CMD ["python", "app.py"]
              """
              with open(os.path.join(ROOT, "Dockerfile"), "w") as f: f.write(root_docker.strip())
              
              print("✅ Architecture Generation Complete.")

          if __name__ == "__main__":
              main()
          EOF

      - name: 🏗️ 아키텍처 생성 실행
        run: python generate_enterprise_arch.py

      # ----------------------------------------------------------------------
      # [Step 4] ETL 파이프라인 구동
      # ----------------------------------------------------------------------
      - name: 🚀 데이터 파이프라인 가동
        run: |
          cd app_root
          # PR Dry Run 체크
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "⚠️ [DRY RUN] PR Event detected. Simulating logic only."
          fi
          
          # 로컬 실행 시에도 의존성 설치 (Runner 환경)
          pip install -r requirements.txt
          python engine.py

      # ----------------------------------------------------------------------
      # [Step 5] 컨테이너 대량 빌드 (VENV 내장 이미지)
      # ----------------------------------------------------------------------
      - name: 🐳 마이크로서비스 이미지 빌드
        run: |
          cd app_root/containers
          for d in */; do
              svc_name=${d%/}
              echo ">>> Building $svc_name with Virtual Environment..."
              docker build -t "tax-$svc_name:v1" ./$svc_name
          done
          
          cd ..
          docker build -t tax-orchestrator:latest .

      # ----------------------------------------------------------------------
      # [Step 6] 결과 검증 및 저장
      # ----------------------------------------------------------------------
      - name: 📊 데이터 현황 보고
        run: |
          echo ">>> Data Lake Status:"
          echo "Backup Zone: $(ls app_root/data_lake/backup_zone | wc -l) files"
          echo "Archive Zone: $(ls app_root/data_lake/archive_zone | wc -l) files"
          echo "Data Mart Size: $(du -sh app_root/data_warehouse/data_mart)"

      - name: 📦 전체 시스템 스냅샷 저장
        uses: actions/upload-artifact@v4
        with:
          name: VENV_Enabled_Enterprise_System
          path: app_root/
          retention-days: 5
