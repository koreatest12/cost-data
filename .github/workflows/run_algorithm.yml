name: 🏢 엔터프라이즈 세금 시스템 (대량 계산 및 서비스 적재)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  enterprise-processing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 시스템 체크아웃
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # [Step 1] 데이터 수집 (Deep Scan)
      # ----------------------------------------------------------------------
      - name: 📥 데이터 리포지토리 로드 (koreatest12/cost-data)
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: app_root/cost_data
          fetch-depth: 0 

      - name: 🔧 권한 및 환경 설정
        run: |
          chmod -R 755 app_root/cost_data
          
      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # ----------------------------------------------------------------------
      # [Step 2] 엔터프라이즈 프로젝트 생성 (서비스 연동 엔진 포함)
      # ----------------------------------------------------------------------
      - name: 🛠️ generate_full_project.py 생성
        run: |
          cat <<EOF > generate_full_project.py
          import os, sys, glob, json, re, random, time, shutil, datetime
          import pandas as pd
          import pdfplumber
          from collections import defaultdict

          # ==============================================================================
          # [1] 설정 및 디렉토리 구조 정의
          # ==============================================================================
          BASE_DIR = "app_root"
          DATA_DIR = os.path.join(BASE_DIR, 'cost_data')
          
          # [핵심] 외부 서비스 시뮬레이션 디렉토리 (여기에 자동 적재됨)
          SERVICE_DIRS = {
              "S3_BUCKET": os.path.join(BASE_DIR, "services", "aws_s3_receipts"),  # 영수증 저장소
              "ERP_API":   os.path.join(BASE_DIR, "services", "erp_data_sync"),    # ERP 연동 데이터
              "NAS_LOGS":  os.path.join(BASE_DIR, "services", "nas_audit_logs")    # 감사 로그 저장소
          }

          REQ_TXT = """
          flask
          pandas
          openpyxl
          pdfplumber
          tabulate
          """

          DOCKERFILE = """
          FROM python:3.9-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY . .
          RUN chmod -R 755 services cost_data
          EXPOSE 8080
          CMD ["python", "app.py"]
          """

          # ==============================================================================
          # [2] 서비스 커넥터 (Service Connector) - 데이터 적재 담당
          # ==============================================================================
          class ServiceConnector:
              def __init__(self):
                  # 디렉토리 초기화
                  for key, path in SERVICE_DIRS.items():
                      os.makedirs(path, exist_ok=True)
                      print(f"✅ [Service] Connected to {key}: {path}")

              def upload_receipt(self, name, content):
                  """AWS S3에 영수증 업로드 시뮬레이션"""
                  filename = f"{name}_receipt.html"
                  path = os.path.join(SERVICE_DIRS["S3_BUCKET"], filename)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  return f"s3://bucket/{filename}"

              def sync_erp(self, data):
                  """ERP 시스템에 JSON 데이터 전송 시뮬레이션"""
                  filename = f"{data['name']}_erp_sync.json"
                  path = os.path.join(SERVICE_DIRS["ERP_API"], filename)
                  with open(path, "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
                  return "ERP_200_OK"

              def write_log(self, name, action, amount):
                  """NAS에 감사 로그 기록"""
                  log_entry = f"[{datetime.datetime.now()}] USER:{name} | ACTION:{action} | AMT:{amount} | STATUS:SUCCESS\n"
                  with open(os.path.join(SERVICE_DIRS["NAS_LOGS"], "audit_2024.log"), "a", encoding="utf-8") as f:
                      f.write(log_entry)

          # ==============================================================================
          # [3] 대량 계산 및 데이터 처리 엔진 (Massive Calculation Engine)
          # ==============================================================================
          ENGINE_PY = r'''
          import os, glob, json, re, random, time, datetime
          import pandas as pd
          import pdfplumber
          from collections import defaultdict

          # (위에서 정의한 경로 변수들을 템플릿 안에서도 사용할 수 있게 재정의하거나 주입해야 함. 
          #  편의상 Engine 클래스 내부에서 사용)
          
          # [서비스 커넥터 인스턴스]
          # generate_full_project.py 실행 시점에 정의된 경로를 그대로 사용하기 위해
          # 엔진 코드 내부는 논리적인 흐름만 포함하고, 실제 파일 쓰기는 외부 함수와 연동
          
          db = defaultdict(lambda: {
              'salary': 0, 'pension': 0, 'insurance': 0, 'medical': 0, 
              'card': 0, 'donation': 0, 'pre_paid': 0, 'files': set(), 
              'dependents': 1, 'source': 'REAL'
          })

          # --- [데이터 파싱 로직] ---
          def extract_number(text, keywords):
              best_val = 0
              for key in keywords:
                  matches = re.finditer(key + r'[^0-9\n]*([0-9,]+)', text)
                  for match in matches:
                      try:
                          val = int(match.group(1).replace(',', ''))
                          best_val = max(best_val, val)
                      except: pass
              return best_val

          def migrate_data(root_path):
              files = glob.glob(os.path.join(root_path, '**', '*'), recursive=True)
              valid_files = [f for f in files if os.path.isfile(f)]
              print(f">>> [Loader] Loading {len(valid_files)} raw files...")
              
              for filepath in valid_files:
                  try:
                      fname = os.path.basename(filepath)
                      _, ext = os.path.splitext(filepath)
                      name = None
                      
                      if ext.lower() == '.json':
                          with open(filepath, 'r', encoding='utf-8') as f:
                              js = json.load(f)
                              name = js.get('name')
                              if name: 
                                  db[name]['salary'] = max(db[name]['salary'], int(js.get('total_salary', 0)))
                                  db[name]['card'] += int(js.get('credit', 0))
                      # (Excel, PDF 파싱 로직 생략 - 이전과 동일하게 동작한다고 가정)
                      # ... 
                      if name: db[name]['files'].add(fname)
                  except: pass

          # --- [시뮬레이션 생성] ---
          def generate_simulation(count=2000):
              print(f">>> [Sim] Generating {count} virtual user data...")
              names = ["김", "이", "박", "최", "정", "강", "조", "윤", "장", "임"]
              
              for i in range(count):
                  uid = f"User_{i:04d}"
                  salary_base = random.choice([3000, 4000, 5000, 7000, 9000, 12000, 20000]) * 10000
                  salary = int(salary_base * random.uniform(0.9, 1.2))
                  
                  db[uid] = {
                      'salary': salary,
                      'pension': int(salary * 0.045),
                      'insurance': int(random.uniform(50, 200) * 10000),
                      'medical': int(random.uniform(0, 500) * 10000),
                      'card': int(salary * random.uniform(0.1, 0.4)),
                      'donation': 0,
                      'pre_paid': int(salary * random.uniform(0.05, 0.15)),
                      'files': {f"virtual_doc_{i}.pdf"},
                      'dependents': random.randint(1, 4),
                      'source': 'SIMULATION'
                  }

          # --- [세금 계산기] ---
          def calculate_tax(data):
              salary = data['salary']
              if salary == 0: return 0, 0, 0 # 예외처리
              
              # 1. 소득공제
              if salary <= 50000000: income_ded = salary * 0.4 # 간소화 공식
              else: income_ded = 12000000 + (salary - 45000000) * 0.05
              
              tax_base = max(salary - income_ded - (data['dependents']*1500000) - data['pension'], 0)
              
              # 2. 산출세액
              if tax_base <= 46000000: tax = tax_base * 0.15 - 1080000
              else: tax = tax_base * 0.24 - 5220000
              tax = max(tax, 0)
              
              # 3. 결정세액
              determined = max(tax - (data['insurance']*0.12) - (data['medical']*0.15), 0)
              final = int(determined - data['pre_paid'])
              
              return int(tax_base), int(determined), final

          # --- [메인 프로세서] ---
          def process_all(connector):
              results = []
              
              # 1. 데이터 준비
              migrate_data('cost_data')
              generate_simulation(1500) # 1500명 추가 생성
              
              print(">>> [Engine] Starting Mass Calculation & Upload...")
              start = time.time()
              
              for name, data in db.items():
                  if not name: continue
                  if data['salary'] == 0: data['salary'] = 35000000
                  
                  # 계산
                  base, det, final = calculate_tax(data)
                  
                  res_data = {
                      "name": name, "salary": data['salary'], 
                      "result": {"base": base, "determined": det, "final": final},
                      "type": "REFUND" if final < 0 else "COLLECT",
                      "source": data['source']
                  }
                  
                  # [핵심] 서비스별 자동 업로드 (Directory 적재)
                  # 1. S3 영수증 업로드
                  html_content = f"<html><h1>Receipt for {name}</h1><h2>Final: {final:,}</h2></html>"
                  s3_path = connector.upload_receipt(name, html_content)
                  
                  # 2. ERP 데이터 전송
                  connector.sync_erp(res_data)
                  
                  # 3. 로그 기록
                  connector.write_log(name, "CALC_TAX", final)
                  
                  results.append(res_data)
                  
              print(f">>> [Done] Processed {len(results)} records in {time.time()-start:.2f}s")
              return results
          '''

          # ==============================================================================
          # [4] 웹 대시보드 (App.py) - 서비스 연동 상태 모니터링
          # ==============================================================================
          APP_PY = r'''
          from flask import Flask, render_template_string, send_from_directory
          import json, os
          app = Flask(__name__)

          @app.route('/')
          def index():
              with open('final_result.json', 'r') as f: results = json.load(f)
              
              # 서비스 디렉토리 상태 확인
              s3_count = len(os.listdir('services/aws_s3_receipts'))
              erp_count = len(os.listdir('services/erp_data_sync'))
              
              total_amt = sum([r['result']['final'] for r in results])

              html = """
              <!DOCTYPE html>
              <html>
              <head>
                  <title>Enterprise Tax System</title>
                  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
              </head>
              <body class="bg-dark text-white p-4">
                  <div class="container bg-secondary p-5 rounded shadow">
                      <h2 class="mb-4">🏢 Enterprise Tax Integration System</h2>
                      
                      <div class="row mb-4 text-center">
                          <div class="col-md-4">
                              <div class="card bg-warning text-dark p-3">
                                  <h4>☁️ AWS S3 Uploads</h4>
                                  <h2>{{ s3_count }} Files</h2>
                              </div>
                          </div>
                          <div class="col-md-4">
                              <div class="card bg-info text-dark p-3">
                                  <h4>🔄 ERP Sync Status</h4>
                                  <h2>{{ erp_count }} Records</h2>
                              </div>
                          </div>
                          <div class="col-md-4">
                              <div class="card bg-success text-white p-3">
                                  <h4>💰 Total Volume</h4>
                                  <h2>{{ "{:,}".format(total_amt) }}</h2>
                              </div>
                          </div>
                      </div>

                      <div class="card bg-light text-dark p-3">
                          <h5>📋 Live Transaction Log (Latest 10)</h5>
                          <table class="table table-sm table-striped">
                              <thead><tr><th>User</th><th>Salary</th><th>Tax Base</th><th>Final Result</th><th>Source</th></tr></thead>
                              <tbody>
                                  {% for r in results[:10] %}
                                  <tr>
                                      <td>{{ r.name }}</td>
                                      <td>{{ "{:,}".format(r.salary) }}</td>
                                      <td>{{ "{:,}".format(r.result.base) }}</td>
                                      <td class="fw-bold {{ 'text-primary' if r.result.final < 0 else 'text-danger' }}">
                                          {{ "{:,}".format(r.result.final) }}
                                      </td>
                                      <td><span class="badge bg-secondary">{{ r.source }}</span></td>
                                  </tr>
                                  {% endfor %}
                              </tbody>
                          </table>
                      </div>
                  </div>
              </body>
              </html>
              """
              return render_template_string(html, results=results, s3_count=s3_count, erp_count=erp_count, total_amt=total_amt)

          if __name__ == '__main__': app.run(host='0.0.0.0', port=8080)
          '''

          # ==============================================================================
          # [5] 메인 실행기 (Orchestrator)
          # ==============================================================================
          def main():
              # 1. 파일 구조 생성
              os.makedirs("app_root", exist_ok=True)
              with open("app_root/requirements.txt", "w") as f: f.write(REQ_TXT.strip())
              with open("app_root/Dockerfile", "w") as f: f.write(DOCKERFILE.strip())
              
              # 2. 엔진 코드 주입 (실행 가능한 형태로 조합)
              # generate_full_project.py 안에 있는 connector 로직과 엔진 로직을 합쳐서 실제 engine.py로 씀
              # 편의상 여기서는 Connector 코드를 engine.py 헤더에 포함시킴
              
              full_engine_code = f"""
          import os, glob, json, re, random, time, datetime
          import pandas as pd
          from collections import defaultdict

          # 경로 설정
          SERVICE_DIRS = {{
              "S3_BUCKET": "services/aws_s3_receipts",
              "ERP_API":   "services/erp_data_sync",
              "NAS_LOGS":  "services/nas_audit_logs"
          }}

          # ServiceConnector 클래스 정의
          class ServiceConnector:
              def __init__(self):
                  for path in SERVICE_DIRS.values(): os.makedirs(path, exist_ok=True)
              def upload_receipt(self, name, content):
                  path = os.path.join(SERVICE_DIRS["S3_BUCKET"], f"{{name}}.html")
                  with open(path, "w", encoding="utf-8") as f: f.write(content)
                  return path
              def sync_erp(self, data):
                  path = os.path.join(SERVICE_DIRS["ERP_API"], f"{{data['name']}}.json")
                  with open(path, "w", encoding="utf-8") as f: json.dump(data, f, ensure_ascii=False)
              def write_log(self, name, action, amount):
                  with open(os.path.join(SERVICE_DIRS["NAS_LOGS"], "audit.log"), "a", encoding="utf-8") as f:
                      f.write(f"[LOG] {{name}} {{action}} {{amount}}\\n")

          {ENGINE_PY}

          if __name__ == "__main__":
              conn = ServiceConnector()
              res = process_all(conn)
              with open('final_result.json', 'w', encoding='utf-8') as f: json.dump(res, f, ensure_ascii=False)
              """
              
              with open("app_root/engine.py", "w", encoding="utf-8") as f: f.write(full_engine_code.strip())
              with open("app_root/app.py", "w", encoding="utf-8") as f: f.write(APP_PY.strip())

              print("✅ Enterprise Project Generation Complete.")

          if __name__ == "__main__":
              main()
          EOF

      - name: 🏗️ 프로젝트 생성 실행
        run: python generate_full_project.py

      # ----------------------------------------------------------------------
      # [Step 3] 대량 계산 및 서비스 적재 실행
      # ----------------------------------------------------------------------
      - name: 🚀 엔진 구동 (계산 -> 분류 -> 업로드)
        run: |
          cd app_root
          pip install -r requirements.txt
          python engine.py

      # ----------------------------------------------------------------------
      # [Step 4] 결과물 확인 및 저장
      # ----------------------------------------------------------------------
      - name: 📊 서비스 디렉토리 상태 확인
        run: |
          echo ">>> [AWS S3 Receipts] Checking stored files..."
          ls -1 app_root/services/aws_s3_receipts | head -n 5
          echo "... and more"
          
          echo ">>> [ERP Data Sync] Checking sync files..."
          ls -1 app_root/services/erp_data_sync | head -n 5
          
          echo ">>> [NAS Audit Log] Checking log file..."
          cat app_root/services/nas_audit_logs/audit.log | head -n 5

      - name: 🐳 Docker 이미지 빌드
        run: |
          cd app_root
          docker build -t tax-enterprise-system:latest .
          docker save -o tax-enterprise-system.tar tax-enterprise-system:latest

      - name: 📦 통합 아티팩트 저장 (서비스별 분류 포함)
        uses: actions/upload-artifact@v4
        with:
          name: 엔터프라이즈 통합 데이터 (Services & App)
          path: |
             app_root/tax-enterprise-system.tar
             app_root/services/aws_s3_receipts
             app_root/services/erp_data_sync
             app_root/services/nas_audit_logs
          retention-days: 7
