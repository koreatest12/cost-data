name: 🏢 엔터프라이즈 메가 클러스터 (Docker Compose Fix & Massive Scale)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PIP_ROOT_USER_ACTION: ignore
  PYTHONUNBUFFERED: 1

jobs:
  mega-cluster-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📥 소스 체크아웃
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # [Step 1] Docker Compose V2 강제 설치 (에러 해결 핵심)
      # ----------------------------------------------------------------------
      - name: 🔧 Docker Compose V2 설치 및 설정
        run: |
          echo ">>> [Fix] Installing Docker Compose V2..."
          mkdir -p ~/.docker/cli-plugins/
          curl -SL https://github.com/docker/compose/releases/download/v2.24.1/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          
          echo ">>> [Check] Version Confirmation"
          docker compose version || echo "Docker Compose Install Failed"

      # ----------------------------------------------------------------------
      # [Step 2] 데이터 및 환경 준비
      # ----------------------------------------------------------------------
      - name: 📥 데이터 수집 (Deep Scan)
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: app_root/raw_data
          fetch-depth: 0 

      - name: 🔧 권한 설정
        run: chmod -R 755 app_root/raw_data
          
      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 파이썬 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pdfplumber faker flask pyyaml requests

      # ----------------------------------------------------------------------
      # [Step 3] 대규모 인프라 생성기 (8개 서비스 + Nginx)
      # ----------------------------------------------------------------------
      - name: 🛠️ 인프라 코드 생성 (generate_mega_structure.py)
        run: |
          cat <<'EOF' > generate_mega_structure.py
          import os, sys, yaml, shutil, json, random
          
          ROOT = "app_root"
          
          # [1] 마이크로서비스 정의 (8개 서비스)
          SERVICES = [
              "gateway-nginx",      # 진입점
              "auth-server",        # 인증
              "calc-engine",        # 계산
              "storage-node",       # 저장소
              "log-aggregator",     # 로그
              "noti-service",       # 알림 (New)
              "analytics-core",     # 분석 (New)
              "payment-proc"        # 결제 (New)
          ]
          
          # [2] 호스트 볼륨 경로 (데이터 적재소)
          VOLUMES = {svc: os.path.join(ROOT, "volumes", svc) for svc in SERVICES}

          # [3] Docker Compose 생성 로직
          def generate_docker_compose():
              compose = {
                  "version": "3.8",
                  "services": {},
                  "networks": {"enterprise-net": {"driver": "bridge"}},
                  "volumes": {f"{s}-vol": {} for s in SERVICES}
              }
              
              for svc in SERVICES:
                  # 기본 설정
                  svc_def = {
                      "build": f"./containers/{svc}",
                      "container_name": f"tax-{svc}",
                      "networks": ["enterprise-net"],
                      "restart": "always",
                      "environment": [f"SERVICE_NAME={svc}", "ENV=PROD"],
                      "volumes": [f"{os.path.abspath(VOLUMES[svc])}:/app/data"]
                  }
                  
                  # 서비스별 특화 설정
                  if svc == "gateway-nginx":
                      svc_def["ports"] = ["80:80"]
                      svc_def["depends_on"] = [s for s in SERVICES if s != "gateway-nginx"]
                  
                  compose["services"][svc] = svc_def
              
              with open(os.path.join(ROOT, "docker-compose.yml"), "w") as f:
                  yaml.dump(compose, f)
              print(f"✅ Generated docker-compose.yml with {len(SERVICES)} services.")

          # [4] 컨테이너 소스 생성 (가상환경 적용)
          def generate_containers():
              dockerfile_py = """
          FROM python:3.9-slim
          ENV VIRTUAL_ENV=/opt/venv
          RUN python3 -m venv $VIRTUAL_ENV
          ENV PATH="$VIRTUAL_ENV/bin:$PATH"
          WORKDIR /app
          COPY . .
          RUN pip install flask
          CMD ["python", "app.py"]
          """
              # Nginx용 Dockerfile
              dockerfile_nginx = """
          FROM nginx:alpine
          RUN echo "server { listen 80; location / { return 200 'Gateway Online'; } }" > /etc/nginx/conf.d/default.conf
          """

              for svc in SERVICES:
                  path = os.path.join(ROOT, "containers", svc)
                  os.makedirs(path, exist_ok=True)
                  
                  if "nginx" in svc:
                      with open(os.path.join(path, "Dockerfile"), "w") as f: f.write(dockerfile_nginx.strip())
                  else:
                      with open(os.path.join(path, "Dockerfile"), "w") as f: f.write(dockerfile_py.strip())
                      app_code = f"""
          from flask import Flask
          import os
          app = Flask(__name__)
          @app.route('/')
          def i(): return "<h1>{svc} Running</h1>Data Count: " + str(len(os.listdir('/app/data')))
          if __name__ == '__main__': app.run(host='0.0.0.0', port=5000)
          """
                      with open(os.path.join(path, "app.py"), "w") as f: f.write(app_code.strip())

          # [5] 대량 데이터 생성 및 적재 (Data Injection)
          def inject_massive_data():
              print(">>> [Loader] Injecting MASSIVE data into volumes...")
              for svc, vol_path in VOLUMES.items():
                  os.makedirs(vol_path, exist_ok=True)
                  
                  # 서비스 성격에 따라 다른 데이터 생성
                  count = 1000 # 서비스당 1000개 파일
                  if "calc" in svc:
                      for i in range(count):
                          with open(os.path.join(vol_path, f"tax_case_{i}.json"), "w") as f:
                              json.dump({"id": i, "salary": random.randint(3000,9000)}, f)
                  elif "log" in svc:
                      with open(os.path.join(vol_path, "audit.log"), "w") as f:
                          f.write("LOG START\n" * 5000)
                  else:
                      # 일반 더미 데이터
                      for i in range(100):
                          with open(os.path.join(vol_path, f"data_{i}.dat"), "w") as f: f.write("DATA")
              
              print("✅ Data Injection Complete.")

          if __name__ == "__main__":
              generate_docker_compose()
              generate_containers()
              inject_massive_data()
          EOF

      - name: 🏗️ 인프라 생성기 실행
        run: python generate_mega_structure.py

      # ----------------------------------------------------------------------
      # [Step 4] 컨테이너 클러스터 실행 (Fix: docker compose 사용)
      # ----------------------------------------------------------------------
      - name: 🚀 메가 클러스터 구동 (Docker Compose Up)
        run: |
          cd app_root
          
          echo ">>> [Build] Building 8 Microservices..."
          # docker-compose (구버전) 대신 docker compose (신버전) 사용
          docker compose build --parallel
          
          echo ">>> [Deploy] Starting Cluster..."
          docker compose up -d
          
          echo ">>> [Wait] Stabilizing services..."
          sleep 15
          
          echo ">>> [Status] Checking Service Health"
          docker compose ps -a

      # ----------------------------------------------------------------------
      # [Step 5] 결과 검증 및 리포트
      # ----------------------------------------------------------------------
      - name: 📊 클러스터 상태 및 데이터 검증
        run: |
          echo "================================================="
          echo "   🏙️ Mega Cluster Status Report"
          echo "================================================="
          
          # 컨테이너 실행 상태 확인
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          
          echo ""
          echo ">>> [Data Check] Volume Mount Inspection:"
          echo "1. Calc Engine Inputs: $(ls app_root/volumes/calc-engine | wc -l) files"
          echo "2. Auth Server DB: $(ls app_root/volumes/auth-server | wc -l) files"
          echo "3. Log Aggregator Size: $(du -sh app_root/volumes/log-aggregator)"
          
          echo ""
          echo ">>> [Network] Gateway Connectivity Check:"
          # Nginx Gateway 응답 확인
          curl -I http://localhost:80 || echo "Gateway might be initializing..."

      - name: 🐳 전체 시스템 로그 덤프
        if: always()
        run: |
          cd app_root
          docker compose logs > cluster_full_logs.txt

      - name: 📦 아티팩트 저장 (Logs & Configs)
        uses: actions/upload-artifact@v4
        with:
          name: Mega_Cluster_Artifacts
          path: |
             app_root/docker-compose.yml
             app_root/cluster_full_logs.txt
             app_root/volumes/
          retention-days: 7
