name: 🌌 Omni-Intelligence Grand Pipeline (Real-Time & Massive)

on:
  schedule:
    - cron: '0 21 * * *' # ⏰ KST 06:00
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  # ==============================================================================
  # 🛡️ 1. Security Engine (실시간 RSS 수집 + 대량 데이터 증폭)
  # ==============================================================================
  security-core:
    name: 🛡️ Security Engine (Real+Massive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # [경로 설정] 라이브 데이터 및 아카이브 폴더
      - run: mkdir -p DB_SEC/live DB_SEC/archive
      
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      
      # [의존성 설치] 사용자 요청 라이브러리 추가
      - name: 📦 Install Dependencies
        run: pip install feedparser requests deep_translator fake_useragent faker

      # [핵심] 파이썬 스크립트 실행 (RSS 수집 + JSON 변환 + 대량 증폭)
      - name: 🧬 Run Hybrid Security Core
        run: |
          cat << 'EOF' > sec_core.py
          import feedparser, requests, re, concurrent.futures, os, json, time, random, datetime
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          import urllib3
          from fake_useragent import UserAgent
          from deep_translator import GoogleTranslator
          from faker import Faker
          
          # 설정
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          DB_DIR = "DB_SEC/live"
          JSON_OUTPUT = os.path.join(DB_DIR, "security_data.json")
          REPORT_FILE = os.path.join(DB_DIR, "hourly_security_report.md")
          fake = Faker()

          # RSS 채널 정의
          RSS_FEEDS = {
              "🚨 Critical Threats": [
                  {"title": "CISA Alerts", "url": "https://www.cisa.gov/uscert/ncas/alerts.xml", "lang": "en"},
                  {"title": "MS Security", "url": "https://www.microsoft.com/security/blog/feed/", "lang": "en"},
              ],
              "🌍 Global Intelligence": [
                  {"title": "The Hacker News", "url": "https://feeds.feedburner.com/TheHackersNews", "lang": "en"},
                  {"title": "BleepingComputer", "url": "https://www.bleepingcomputer.com/feed/", "lang": "en"},
              ],
              "🇰🇷 Korea Security": [
                  {"title": "보안뉴스", "url": "https://www.boannews.com/media/news_rss.xml", "lang": "ko"},
                  {"title": "데일리시큐", "url": "https://www.dailysecu.com/rss/allArticle.xml", "lang": "ko"},
              ]
          }

          def create_session():
              session = requests.Session()
              try: ua = UserAgent(); header = ua.random
              except: header = 'Mozilla/5.0'
              session.headers.update({'User-Agent': header})
              retry = Retry(total=3, backoff_factor=1, status_forcelist=[500, 502, 503, 504])
              session.mount("https://", HTTPAdapter(max_retries=retry))
              return session

          def clean_html(raw_html):
              if not raw_html: return ""
              text = re.sub(r'<[^>]+>', '', raw_html).strip()
              return text[:200] + "..." if len(text) > 200 else text

          def translate_text(text):
              try: return GoogleTranslator(source='auto', target='ko').translate(text)
              except: return text

          def fetch_single_feed(feed):
              session = create_session()
              try:
                  resp = session.get(feed['url'], timeout=10, verify=False)
                  parsed = feedparser.parse(resp.content)
                  processed = []
                  for entry in parsed.entries[:3]: # 피드당 최신 3개만
                      title = entry.title
                      summary = clean_html(getattr(entry, 'summary', ''))
                      if feed.get('lang') == 'en':
                          title = f"[번역] {translate_text(title)}"
                          summary = translate_text(summary[:100])
                      
                      processed.append({
                          "id": entry.link,
                          "title": title,
                          "content": summary,
                          "source": feed['title'],
                          "date": datetime.datetime.now().strftime('%Y-%m-%d')
                      })
                  return processed
              except Exception as e: 
                  print(f"Error fetching {feed['title']}: {e}")
                  return []

          def main():
              print("🚀 Starting Hybrid Security Engine...")
              
              # 1. Real-Time RSS Fetching
              real_data = []
              all_feeds = [f for cat in RSS_FEEDS.values() for f in cat]
              
              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as executor:
                  futures = [executor.submit(fetch_single_feed, f) for f in all_feeds]
                  for future in concurrent.futures.as_completed(futures):
                      real_data.extend(future.result())
              
              print(f"✅ Fetched {len(real_data)} Real-Time Articles.")
              
              # 2. Massive Data Augmentation (50만 건 채우기)
              print("⚡ Augmenting with Synthetic Data (Target: 500,000)...")
              total_target = 500000
              synthetic_count = total_target - len(real_data)
              
              synthetic_data = []
              # 성능을 위해 50만건 루프 대신 배치 처리 시뮬레이션
              for i in range(synthetic_count):
                  synthetic_data.append({
                      "id": f"SYN-SEC-{i}",
                      "title": f"Simulated Security Threat #{i} - {fake.sentence()}",
                      "content": fake.paragraph(),
                      "source": "Omni-AI-Simulator",
                      "date": datetime.datetime.now().strftime('%Y-%m-%d')
                  })
                  if i % 100000 == 0: print(f"  ...generated {i} records")

              final_data = real_data + synthetic_data
              
              # 3. Save JSON for Microservices
              with open(JSON_OUTPUT, "w", encoding='utf-8') as f:
                  json.dump(final_data, f, indent=2, ensure_ascii=False)
              
              # 4. Create Markdown Report
              md_report = f"# 🛡️ Security Report\n\n- Real Data: {len(real_data)}\n- Synthetic: {len(synthetic_data)}\n\n## Top News\n"
              for item in real_data[:5]:
                  md_report += f"- **{item['title']}**\n  - {item['content']}\n"
              
              with open(REPORT_FILE, "w", encoding='utf-8') as f:
                  f.write(md_report)

              print(f"✅ Total {len(final_data)} Records Saved to {JSON_OUTPUT}")

          if __name__ == "__main__":
              main()
          EOF
          python sec_core.py

      - name: 📦 Pack
        run: tar -czf security_pkg.tar.gz DB_SEC/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-security, path: security_pkg.tar.gz }

  # ==============================================================================
  # 💼 2. Job Engine (30만 건 생성)
  # ==============================================================================
  job-core:
    name: 💼 Job Fortress (300k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_JOB/live
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install faker
      - name: 🧬 Generate Massive Data
        run: |
          cat << 'EOF' > job_core.py
          import json, os, random
          from faker import Faker
          fake = Faker()
          print("⚡ Generating 300,000 Job Records...")
          data = []
          for i in range(300000):
              data.append({"id":f"JOB-{i}", "title":f"{fake.job()} at {fake.company()}", "loc":"Global"})
          with open("DB_JOB/live/job_data.json", "w") as f: json.dump(data, f)
          EOF
          python job_core.py
      - name: 📦 Pack
        run: tar -czf job_pkg.tar.gz DB_JOB/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-job, path: job_pkg.tar.gz }

  # ==============================================================================
  # 🧮 3. Algo Engine (10만 건 생성)
  # ==============================================================================
  algo-core:
    name: 🧮 Algo Engine (100k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_ALGO/live
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 Generate Data
        run: |
          cat << 'EOF' > algo_core.py
          import json, os
          data = [{"id":i, "title":f"Algo Research #{i}"} for i in range(100000)]
          with open("DB_ALGO/live/algo_data.json", "w") as f: json.dump(data, f)
          EOF
          python algo_core.py
      - name: 📦 Pack
        run: tar -czf algo_pkg.tar.gz DB_ALGO/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-algo, path: algo_pkg.tar.gz }

  # ==============================================================================
  # 💰 4. Cost Engine (10만 건 생성)
  # ==============================================================================
  misc-core:
    name: 💰 Cost Engine (100k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_COST/live
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 Generate Data
        run: |
          cat << 'EOF' > misc_core.py
          import json, os
          data = [{"id":i, "rate":1400+i} for i in range(100000)]
          with open("DB_COST/live/cost_data.json", "w") as f: json.dump(data, f)
          EOF
          python misc_core.py
      - name: 📦 Pack
        run: tar -czf cost_pkg.tar.gz DB_COST/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-cost, path: cost_pkg.tar.gz }

  # ==============================================================================
  # 🏭 5. Microservices Factory (실시간 데이터 반영 및 빌드)
  # ==============================================================================
  services-factory:
    needs: [security-core, job-core, algo-core, misc-core]
    name: 🏭 Microservices Build & Containerize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/download-artifact@v4
        with:
          pattern: 'pkg-*'
          merge-multiple: true
        continue-on-error: true

      - name: ☕ JDK 17 Setup
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: maven }

      # [1] 데이터 패키지 설치
      - name: 🛠️ Install Data
        run: |
          if ls *.tar.gz 1> /dev/null 2>&1; then
            for pkg in *.tar.gz; do tar -xzf "$pkg"; done
          else
            mkdir -p DB_SEC/live DB_JOB/live DB_ALGO/live DB_COST/live
          fi
          echo "✅ Data Packets Extracted."

      # [2] 멀티 모듈 프로젝트 구조 생성
      - name: 🏗️ Scaffold Microservices
        run: |
          rm -rf services
          mkdir -p services
          SERVICES="security job algo cost"
          
          for svc in $SERVICES; do
            echo "🔨 Creating Service: omni-$svc-service"
            mkdir -p services/omni-$svc-service/src/main/java/com/costdata/$svc
            mkdir -p services/omni-$svc-service/src/main/resources/data
            
            # 데이터 주입
            if [ "$svc" == "security" ] && [ -d "DB_SEC/live" ]; then cp -r DB_SEC/live/* services/omni-$svc-service/src/main/resources/data/; fi
            if [ "$svc" == "job" ] && [ -d "DB_JOB/live" ]; then cp -r DB_JOB/live/* services/omni-$svc-service/src/main/resources/data/; fi
            if [ "$svc" == "algo" ] && [ -d "DB_ALGO/live" ]; then cp -r DB_ALGO/live/* services/omni-$svc-service/src/main/resources/data/; fi
            if [ "$svc" == "cost" ] && [ -d "DB_COST/live" ]; then cp -r DB_COST/live/* services/omni-$svc-service/src/main/resources/data/; fi
            
            # POM
            cat <<EOF > services/omni-$svc-service/pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <parent><groupId>com.costdata</groupId><artifactId>omni-platform</artifactId><version>1.0.0</version></parent>
              <artifactId>omni-$svc-service</artifactId>
              <packaging>jar</packaging>
              <dependencies>
                  <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId></dependency>
                  <dependency><groupId>jakarta.annotation</groupId><artifactId>jakarta.annotation-api</artifactId></dependency>
                  <dependency><groupId>com.fasterxml.jackson.core</groupId><artifactId>jackson-databind</artifactId></dependency>
              </dependencies>
              <build><plugins><plugin><groupId>org.springframework.boot</groupId><artifactId>spring-boot-maven-plugin</artifactId></plugin></plugins></build>
          </project>
          EOF

            # Java Code (데이터 로딩 로직 포함)
            cat <<EOF > services/omni-$svc-service/src/main/java/com/costdata/$svc/ServiceApplication.java
          package com.costdata.$svc;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;
          import jakarta.annotation.PostConstruct;
          import java.util.Map;
          import java.io.File;
          
          @SpringBootApplication @RestController
          public class ServiceApplication {
              public static void main(String[] args) { SpringApplication.run(ServiceApplication.class, args); }
              
              @PostConstruct public void init() { 
                  System.out.println("🚀 $svc Service Starting...");
                  File dataDir = new File("src/main/resources/data");
                  if(dataDir.exists()) {
                      System.out.println("📦 Data Loaded: " + dataDir.list().length + " files");
                  }
              }
              
              @GetMapping("/") public Map<String, String> status() { return Map.of("service", "$svc", "status", "active", "data", "loaded"); }
          }
          EOF
          done

          # Root POM
          cat <<EOF > services/pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.costdata</groupId><artifactId>omni-platform</artifactId><version>1.0.0</version>
              <packaging>pom</packaging>
              <modules>
                  <module>omni-security-service</module>
                  <module>omni-job-service</module>
                  <module>omni-algo-service</module>
                  <module>omni-cost-service</module>
              </modules>
              <parent><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-parent</artifactId><version>3.2.1</version><relativePath/></parent>
          </project>
          EOF

      # [3] 대량 컴파일
      - name: 🔨 Compile All Services
        run: |
          cd services
          mvn clean package -DskipTests
          echo "✅ All Microservices Built Successfully."

      # [4] 컨테이너화 및 배포
      - name: 🐳 Dockerize & Push Grid
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          SERVICES="security job algo cost"
          for svc in $SERVICES; do
            cd services/omni-$svc-service
            cat <<EOF > Dockerfile
          FROM eclipse-temurin:17-jdk-jammy
          WORKDIR /app
          COPY target/*.jar app.jar
          ENTRYPOINT ["java", "-jar", "/app.jar"]
          EOF
            IMG="ghcr.io/${GITHUB_REPOSITORY,,}/omni-$svc-service:latest"
            docker build -t $IMG .
            docker push $IMG
            cd ../.. 
          done

      # [5] 소스 코드 업로드 (Persistence)
      - name: 📤 Upload Source Code
        uses: actions/upload-artifact@v4
        with:
          name: generated-source-code
          path: services/

  # ==============================================================================
  # 🌍 6. Master Dashboard
  # ==============================================================================
  master-hub:
    needs: [services-factory]
    name: 🌍 Master Dashboard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/download-artifact@v4
        with:
          name: generated-source-code
          path: services
      
      - name: 📊 Generate README
        run: |
          cat << 'EOF' > dashboard.py
          md = "# 🌌 Omni-Intelligence Hub (Real-Time + Massive)\n\n"
          md += "![Status](https://img.shields.io/badge/System-Distributed-blue) ![Data](https://img.shields.io/badge/Data-1M_Records-green)\n\n"
          md += "## 🏭 Container Grid Status\n"
          md += "| Service | Image | Data Type |\n|---|---|---|\n"
          md += "| 🛡️ Security | `omni-security-service` | ✅ Real RSS + Synthetic (500k) |\n"
          md += "| 💼 Jobs | `omni-job-service` | ✅ Synthetic (300k) |\n"
          md += "| 🧮 Algo | `omni-algo-service` | ✅ Synthetic (100k) |\n"
          md += "| 💰 Cost | `omni-cost-service` | ✅ Synthetic (100k) |\n"
          with open("README.md", "w") as f: f.write(md)
          EOF
          python dashboard.py

      - run: cat README.md >> $GITHUB_STEP_SUMMARY

      - name: 🌿 Commit & Push
        run: |
          git config --global user.name "Omni Bot"
          git config --global user.email "bot@actions"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          
          git add README.md services/
          if git diff --cached --quiet; then echo "✨ No changes"; exit 0; fi
          
          git commit -m "🌌 Real-Time Update: $(date +'%Y-%m-%d %H:%M')"
          
          n=0
          until [ "$n" -ge 10 ]; do
             git pull origin main --no-rebase -s recursive -X ours && git push origin main && break
             n=$((n+1))
             sleep 5
          done
