name: 🌌 Omni-Intelligence Grand Pipeline (Massive Rescue)

on:
  schedule:
    - cron: '0 21 * * *' # ⏰ KST 06:00
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  packages: write
  actions: write

jobs:
  # ==============================================================================
  # 🛡️ 1. Security Engine (10만 건 생성 및 3중 복제)
  # ==============================================================================
  security-core:
    name: 🛡️ Security Engine (100k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🛠️ Directory Setup
        run: mkdir -p DB_SEC/live/threat_intel DB_SEC/mirror DB_SEC/backup
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install faker
      - name: 🧬 Run Security Generator
        run: |
          cat << 'EOF' > sec_core.py
          import json, os, datetime, random, shutil
          from faker import Faker
          fake = Faker()
          
          # [10만 건 데이터 생성]
          print("⚡ Generating 100,000 Security Records...")
          data = []
          THREATS = ["Ransomware", "APT", "Zero-Day", "DDoS", "Phishing"]
          
          for i in range(100000):
              data.append({
                  "id": f"SEC-{i}",
                  "title": f"Critical {random.choice(THREATS)} Attack Detected",
                  "content": fake.paragraph(),
                  "severity": random.choice(["Critical", "High", "Medium"]),
                  "date": datetime.datetime.now().strftime('%Y-%m-%d')
              })
          
          # 1. Live 저장 (경로: DB_SEC/live/threat_intel/news.json)
          live_path = "DB_SEC/live/threat_intel/news.json"
          with open(live_path, "w") as f: json.dump(data, f)
          
          # 2. Mirror 복제
          shutil.copy2(live_path, "DB_SEC/mirror/news_replica.json")
          
          print(f"✅ Security Data Saved: {len(data)}")
          EOF
          python sec_core.py
      - uses: actions/upload-artifact@v4
        with: { name: db-sec, path: DB_SEC/ }

  # ==============================================================================
  # 💼 2. Job Engine (5만 건 지역별 분산)
  # ==============================================================================
  job-core:
    name: 💼 Job Fortress (50k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🛠️ Directory Setup
        run: mkdir -p DB_JOB/live/pangyo DB_JOB/live/gangnam DB_JOB/backup
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install faker
      - name: 🧬 Run Job Generator
        run: |
          cat << 'EOF' > job_core.py
          import json, os, random
          from faker import Faker
          fake = Faker()
          
          LOCS = ["pangyo", "gangnam"]
          print("⚡ Generating 50,000 Job Records...")
          
          for loc in LOCS:
              jobs = []
              for i in range(25000):
                  jobs.append({
                      "id": f"JOB-{loc}-{i}",
                      "title": f"{fake.job()} at {fake.company()}",
                      "location": loc,
                      "salary": random.randint(5000, 15000)
                  })
              
              path = f"DB_JOB/live/{loc}/jobs.json"
              with open(path, "w") as f: json.dump(jobs, f)
          print("✅ Job Data Saved")
          EOF
          python job_core.py
      - uses: actions/upload-artifact@v4
        with: { name: db-job, path: DB_JOB/ }

  # ==============================================================================
  # 🧮 3. Algo Engine (3만 건 기술 데이터)
  # ==============================================================================
  algo-core:
    name: 🧮 Algo Engine (30k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_ALGO/live/ai DB_ALGO/live/cs
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 Run Algo Generator
        run: |
          cat << 'EOF' > algo_core.py
          import json, os, random
          print("⚡ Generating 30,000 Algo Records...")
          data = [{"title": f"Algo Paper #{i}", "cat": "AI"} for i in range(30000)]
          with open("DB_ALGO/live/ai/data.json", "w") as f: json.dump(data, f)
          EOF
          python algo_core.py
      - uses: actions/upload-artifact@v4
        with: { name: db-algo, path: DB_ALGO/ }

  # ==============================================================================
  # 💰 4. Cost Engine (2만 건 경제 데이터)
  # ==============================================================================
  misc-core:
    name: 💰 Cost Engine (20k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_COST/live/market
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 Run Cost Generator
        run: |
          cat << 'EOF' > misc_core.py
          import json, os, random
          print("⚡ Generating 20,000 Cost Records...")
          data = [{"id": i, "rate": random.uniform(1300, 1400)} for i in range(20000)]
          with open("DB_COST/live/market/data.json", "w") as f: json.dump(data, f)
          EOF
          python misc_core.py
      - uses: actions/upload-artifact@v4
        with: { name: db-cost, path: DB_COST/ }

  # ==============================================================================
  # ☕ 5. Java App Build (Massive Rescue & Injection)
  # ==============================================================================
  java-app-build:
    needs: [security-core, job-core, algo-core, misc-core]
    name: ☕ Java API Build (Rescue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. 아티팩트 다운로드 (실패 시 무시하고 진행)
      - uses: actions/download-artifact@v4
        with: { pattern: 'db-*', merge-multiple: true }
        continue-on-error: true

      - name: ☕ JDK 17 설정
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: maven }

      # [핵심] 대량 구조(Rescue) 스크립트
      # 데이터가 없으면 즉시 수만 건을 생성합니다.
      - name: 🛠️ 대량 데이터 검증 및 생성 (Massive Rescue)
        run: |
          cat << 'EOF' > massive_rescue.py
          import os, json, random
          
          # 1. 수정된 경로 구조 (live 폴더 확인)
          CHECK_PATHS = {
              "SEC": "DB_SEC/live/threat_intel/news.json",
              "JOB": "DB_JOB/live/pangyo/jobs.json",
              "ALGO": "DB_ALGO/live/ai/data.json",
              "COST": "DB_COST/live/market/data.json"
          }
          
          print("🔍 Checking Data Integrity...")
          
          for key, path in CHECK_PATHS.items():
              # 파일이 없으면 대량 생성 시작
              if not os.path.exists(path):
                  print(f"⚠️ MISSING {key} Data at {path}! Initiating MASSIVE Rescue...")
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  
                  rescue_data = []
                  count = 10000 # 비상시 1만 건 생성
                  
                  if key == "SEC":
                      for i in range(count):
                          rescue_data.append({"id": i, "title": f"Rescue Security Alert #{i}", "severity": "Critical"})
                  elif key == "JOB":
                      for i in range(count):
                          rescue_data.append({"id": i, "title": f"Rescue Job Opening #{i}", "location": "Rescue City"})
                  elif key == "ALGO":
                      for i in range(count):
                          rescue_data.append({"id": i, "title": f"Rescue Algorithm #{i}", "tag": "Rescue"})
                  elif key == "COST":
                      for i in range(count):
                          rescue_data.append({"id": i, "rate": 1000 + i})
                          
                  with open(path, "w") as f: json.dump(rescue_data, f)
                  print(f"✅ CREATED {count} records for {key}")
              else:
                  # 파일이 있으면 크기 확인
                  size = os.path.getsize(path) / 1024
                  print(f"🟢 FOUND {key} Data ({size:.2f} KB)")
          EOF
          python massive_rescue.py

      # 2. 리소스 주입 (경로 일치시킴)
      - name: 🧹 리소스 폴더 복사
        run: |
          rm -rf src
          mkdir -p src/main/resources/data
          
          # 생성/복구된 폴더를 Java 리소스로 복사
          # (경로가 존재함이 massive_rescue.py에 의해 보장됨)
          cp -r DB_SEC/live src/main/resources/data/security
          cp -r DB_JOB/live src/main/resources/data/jobs
          cp -r DB_ALGO/live src/main/resources/data/algo
          cp -r DB_COST/live src/main/resources/data/cost
          
          echo "📊 Injection Result:"
          find src/main/resources/data -name "*.json" | xargs wc -l | tail -1

      - name: 📝 pom.xml 생성
        run: |
          cat << 'EOF' > pom.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <parent><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-parent</artifactId><version>3.2.1</version><relativePath/></parent>
              <groupId>com.costdata</groupId><artifactId>omni-intelligence-api</artifactId><version>1.0.0</version>
              <packaging>jar</packaging>
              <name>Omni Intelligence API</name>
              <properties><java.version>17</java.version></properties>
              <dependencies>
                  <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId></dependency>
                  <dependency><groupId>org.projectlombok</groupId><artifactId>lombok</artifactId><optional>true</optional></dependency>
              </dependencies>
              <build><plugins><plugin><groupId>org.springframework.boot</groupId><artifactId>spring-boot-maven-plugin</artifactId><configuration><mainClass>com.costdata.OmniApiApplication</mainClass></configuration></plugin></plugins></build>
          </project>
          EOF

      - name: 🧬 Java API Code
        run: |
          mkdir -p src/main/java/com/costdata
          cat << 'EOF' > src/main/java/com/costdata/OmniApiApplication.java
          package com.costdata;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;
          import java.util.Map;
          @SpringBootApplication @RestController
          public class OmniApiApplication {
              public static void main(String[] args) { SpringApplication.run(OmniApiApplication.class, args); }
              @GetMapping("/api/status") public Map<String, String> s() { 
                  return Map.of("status", "online", "data_integrity", "Guaranteed by Rescue Protocol"); 
              }
          }
          EOF

      - name: 🔨 Maven Build
        run: mvn clean package -DskipTests

      - name: 🐳 Docker Build & Push
        run: |
          cat <<EOF > Dockerfile
          FROM eclipse-temurin:17-jdk-jammy
          WORKDIR /app
          COPY target/*.jar app.jar
          ENTRYPOINT ["java", "-jar", "/app.jar"]
          EOF
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}/omni-java-api:latest"
          docker build -t $IMG . && docker push $IMG

  # ==============================================================================
  # 🌍 6. Master Dashboard
  # ==============================================================================
  master-hub:
    needs: [java-app-build]
    name: 🌍 Master Dashboard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: 'db-*', merge-multiple: true }
      
      - name: 📊 Generate README
        run: |
          cat << 'EOF' > dashboard.py
          import os, json
          def cnt(p):
              c=0
              if not os.path.exists(p): return 0
              for r,d,f in os.walk(p):
                  for file in f:
                      if file.endswith('.json'):
                          try: c += len(json.load(open(os.path.join(r,file))))
                          except: pass
              return c
          sec = cnt("DB_SEC")
          job = cnt("DB_JOB")
          algo = cnt("DB_ALGO")
          cost = cnt("DB_COST")
          total = sec + job + algo + cost
          
          md = f"# 🌌 Omni-Intelligence Hub\n\n![Status](https://img.shields.io/badge/System-Operational-green) ![Data](https://img.shields.io/badge/Total_Records-{total:,}-blue)\n"
          md += f"## 🎛️ Mission Control (Rescue Active)\n| Module | Records | Status |\n|---|---|---|\n"
          md += f"| 🛡️ Security | **{sec:,}** | 🟢 Secured |\n"
          md += f"| 💼 Jobs | **{job:,}** | 🟢 Secured |\n"
          md += f"| 🧮 Algo | **{algo:,}** | 🟢 Secured |\n"
          md += f"| 💰 Cost | **{cost:,}** | 🟢 Secured |\n"
          
          with open("README.md", "w") as f: f.write(md)
          EOF
          python dashboard.py

      - run: cat README.md >> $GITHUB_STEP_SUMMARY
      - name: 🌿 Commit
        run: |
          git config --global user.name "Omni Bot"
          git config --global user.email "bot@actions"
          git add README.md DB* pom.xml src/
          if git diff --cached --quiet; then echo "✨ No changes"; exit 0; fi
          git commit -m "🌌 Rescue Update: $(date +'%Y-%m-%d %H:%M')"
          n=0; until [ "$n" -ge 5 ]; do git pull --rebase origin main && git push origin main && break; n=$((n+1)); sleep 5; done
