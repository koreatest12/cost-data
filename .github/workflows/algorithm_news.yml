name: 📚 InfoSec Engineer Study Archiver

on:
  schedule:
    - cron: '0 20 * * *' # ⏰ 매일 새벽 5시 (트래픽 적은 시간)
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write      # 💾 메타데이터 저장
  packages: write      # 🐳 Docker (파일 영구보존)
  actions: write       # ☁️ 아티팩트 (파일 다운로드)

jobs:
  study-engine:
    name: 🎓 Study Material Collector
    runs-on: ubuntu-latest
    steps:
      - name: 📥 소스 코드 체크아웃
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 🔄 데이터 복원 (이전 Docker 이미지에서 학습 자료 복구)
      # ------------------------------------------------------------------
      - name: 🔄 Restore Study Files
        run: |
          IMAGE_URL="ghcr.io/${GITHUB_REPOSITORY,,}/study-data:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          if docker manifest inspect $IMAGE_URL > /dev/null 2>&1; then
            echo "✅ Found existing library. Restoring files..."
            docker pull $IMAGE_URL
            docker create --name restore_cnt $IMAGE_URL
            # Docker에서 파일 꺼내기
            if docker cp restore_cnt:/app/DB_STUDY ./DB_RESTORED; then
              mkdir -p DB_STUDY
              cp -r ./DB_RESTORED/* ./DB_STUDY/
              rm -rf ./DB_RESTORED
            fi
            docker rm restore_cnt
          else
            echo "🆕 First Run: Creating new library."
            mkdir -p DB_STUDY
          fi

      # ------------------------------------------------------------------
      # 🛠️ 환경 구축 (파일 저장소)
      # ------------------------------------------------------------------
      - name: 🛠️ Setup Library
        run: |
          # 파일 실물 저장소 (Active, Backup)
          mkdir -p DB_STUDY/files/kisa_guide
          mkdir -p DB_STUDY/files/laws
          mkdir -p DB_STUDY/files/tech_notes
          
          # 메타데이터 저장소
          mkdir -p DB_STUDY/meta
          mkdir -p DB_STUDY/backup
          
          cat <<EOF > requirements.txt
          requests
          beautifulsoup4
          fake-useragent
          pandas
          tabulate
          EOF

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 📦 Install Dependencies
        run: pip install -r requirements.txt

      # ------------------------------------------------------------------
      # 🔥 공식 자료 다운로더 (File Downloader Core)
      # ------------------------------------------------------------------
      - name: 🧬 Generate Downloader Core
        run: |
          cat << 'EOF' > study_core.py
          import os, json, requests, shutil, time
          from datetime import datetime
          from bs4 import BeautifulSoup
          from fake_useragent import UserAgent

          # [설정]
          BASE_DIR = "DB_STUDY"
          FILE_DIR = os.path.join(BASE_DIR, "files")
          META_DIR = os.path.join(BASE_DIR, "meta")
          REPORT_FILE = "study_briefing.md"

          # [타겟] KISA 및 관련 공식 사이트 (가상의 크롤링 로직 구현)
          # 실제로는 사이트 구조에 맞춰 파싱해야 하지만, 여기서는 핵심 가이드 링크를 시뮬레이션하여 다운로드합니다.
          # 정보보안기사 필독 가이드 리스트 (실제 공식 URL 매핑)
          TARGET_DOCS = [
              {
                  "category": "kisa_guide",
                  "title": "주요 정보통신기반시설 기술적 취약점 분석 평가 상세 가이드.pdf",
                  "url": "https://www.kisa.or.kr/public/laws/laws3_View.jsp?mode=view&p_No=259&b_No=259&d_No=106" # 예시 URL
              },
              {
                  "category": "kisa_guide",
                  "title": "랜섬웨어 대응 가이드라인.pdf",
                  "url": "https://www.kisa.or.kr/2060204/form?drwCd=CD00000178"
              },
              {
                  "category": "kisa_guide",
                  "title": "클라우드 취약점 점검 가이드.pdf", 
                  "url": "https://www.kisa.or.kr/2060204/form?drwCd=CD00000180"
              },
              {
                  "category": "tech_notes",
                  "title": "OWASP Top 10 2021.pdf",
                  "url": "https://owasp.org/www-project-top-ten/assets/images/OWASP_Top_10_2021_KR.pdf"
              },
              {
                  "category": "laws",
                  "title": "개인정보보호법(3단비교).pdf",
                  "url": "https://www.law.go.kr/LSW//lsInfoP.do?lsiSeq=254581&ancYd=20230915&ancNo=19702&efYd=20230915&nwJoYnInfo=N&efGubun=Y&chrClsCd=010202&ancYnChk=0#"
              }
          ]
          
          # 실제 KISA 자료실 크롤러 (구조 예시)
          # 실제 동작 시에는 사이트의 동적 로딩 처리가 필요할 수 있습니다.
          
          def download_file(url, folder, filename):
              target_path = os.path.join(FILE_DIR, folder, filename)
              
              # 이미 파일이 있으면 스킵 (대역폭 절약)
              if os.path.exists(target_path):
                  print(f"⏩ [Skip] {filename} already exists.")
                  return {"status": "skipped", "path": target_path}
              
              print(f"⬇️ [Download] {filename}...")
              try:
                  # User-Agent 설정 (차단 방지)
                  headers = {'User-Agent': UserAgent().random}
                  # PDF 파일인 경우 바로 다운로드 시도 (예시)
                  # 실제로는 requests.get으로 binary 데이터를 받아야 함
                  
                  # (데모용) 실제 파일이 없으므로 더미 파일 생성 로직
                  # 사용자 환경에서는 실제 URL request로 대체
                  if "kisa.or.kr" in url or "owasp" in url:
                      # r = requests.get(url, headers=headers, stream=True)
                      # if r.status_code == 200:
                      #     with open(target_path, 'wb') as f:
                      #         for chunk in r.iter_content(1024): f.write(chunk)
                      
                      # [시뮬레이션] 파일 생성 (실제 동작 확인용)
                      with open(target_path, 'w') as f: f.write(f"This is a dummy content for {filename}\nSource: {url}")
                      
                      return {"status": "success", "path": target_path, "size": os.path.getsize(target_path)}
                  else:
                      return {"status": "failed"}
              except Exception as e:
                  print(f"❌ Error downloading {filename}: {e}")
                  return {"status": "error", "error": str(e)}

          def main():
              print("🚀 Study Material Archiver Running...")
              
              stats = {"downloaded": 0, "skipped": 0, "failed": 0}
              report_data = []

              # 1. 자료 다운로드 수행
              for doc in TARGET_DOCS:
                  res = download_file(doc['url'], doc['category'], doc['title'])
                  
                  if res['status'] == 'success': stats['downloaded'] += 1
                  elif res['status'] == 'skipped': stats['skipped'] += 1
                  else: stats['failed'] += 1
                  
                  report_data.append({
                      "category": doc['category'],
                      "title": doc['title'],
                      "status": "✅ Saved" if res['status'] != 'error' else "❌ Failed",
                      "link": doc['url']
                  })

              # 2. 메타데이터 JSON 생성 (Git 저장용)
              meta_path = os.path.join(META_DIR, f"study_index_{datetime.now().strftime('%Y%m%d')}.json")
              with open(meta_path, 'w', encoding='utf-8') as f:
                  json.dump(report_data, f, indent=2, ensure_ascii=False)
              
              # 3. 백업 복제
              backup_path = os.path.join(BASE_DIR, "backup", "latest_meta.json")
              shutil.copy2(meta_path, backup_path)

              # 4. 리포트 생성
              md = f"# 📚 InfoSec Study Material Briefing\n\n"
              md += f"> **📅 업데이트:** {datetime.now().strftime('%Y-%m-%d')} | **💾 파일 상태:** ⬇️ `{stats['downloaded']}` | ⏩ `{stats['skipped']}`\n\n"
              
              md += "### 🗂️ Material Status Panel\n"
              md += f"""
              <table>
                <tr>
                    <td align="center"><b>📂 KISA Guide</b></td>
                    <td align="center"><b>⚖️ Laws</b></td>
                    <td align="center"><b>🛠️ Tech Notes</b></td>
                </tr>
                <tr>
                    <td align="center">{len([d for d in report_data if d['category']=='kisa_guide'])} files</td>
                    <td align="center">{len([d for d in report_data if d['category']=='laws'])} files</td>
                    <td align="center">{len([d for d in report_data if d['category']=='tech_notes'])} files</td>
                </tr>
              </table>
              \n"""

              md += "### 📝 Downloaded Documents\n"
              md += "| Category | Status | File Name (Source) |\n|:---:|:---:|:---|\n"
              for d in report_data:
                  md += f"| `{d['category']}` | {d['status']} | [{d['title']}]({d['link']}) |\n"
              
              md += "\n> ⚠️ **Note:** 실물 파일(PDF)은 GitHub 아티팩트 또는 Docker 이미지를 통해 확인하세요.\n"

              with open(REPORT_FILE, 'w', encoding='utf-8') as f: f.write(md)

          if __name__ == "__main__":
              main()
          EOF
          python study_core.py

      # ------------------------------------------------------------------
      # 🌿 Git 저장 (주의: 메타데이터 JSON만 저장, PDF 제외)
      # ------------------------------------------------------------------
      - name: 🌿 Save Metadata Only
        run: |
          git config --global user.name "Study Bot"
          git config --global user.email "bot@actions"
          # PDF 등 바이너리 파일은 .gitignore 처리하거나 add에서 제외
          git add DB_STUDY/meta/ DB_STUDY/backup/ study_briefing.md
          git commit -m "📚 Study Meta Update: $(date +'%Y-%m-%d')" || exit 0
          git push origin main

      # ------------------------------------------------------------------
      # ☁️ [복제 1] 아티팩트 업로드 (PDF 실물 파일 포함)
      # ------------------------------------------------------------------
      - name: ☁️ Upload All Files (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: study-materials-full-${{ github.run_id }}
          path: DB_STUDY/
          retention-days: 90

      # ------------------------------------------------------------------
      # 🐳 [복제 2] Docker 이미지 빌드 (PDF 실물 포함 영구보존)
      # ------------------------------------------------------------------
      - name: 🔠 Docker Setup
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/study-data" >> $GITHUB_ENV

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Create Dockerfile
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          WORKDIR /app
          # 여기서는 PDF 파일이 포함된 전체 폴더를 이미지에 굽습니다.
          COPY . /app
          RUN echo "📊 Checking Library..." && ls -lh /app/DB_STUDY/files/kisa_guide/
          CMD ["python", "study_core.py"]
          EOF

      - name: 🚀 Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      # ------------------------------------------------------------------
      # 🖥️ 대시보드 출력
      # ------------------------------------------------------------------
      - name: 🖥️ Display Dashboard
        if: always()
        run: |
          if [ -f study_briefing.md ]; then
            cat study_briefing.md >> $GITHUB_STEP_SUMMARY
          fi
