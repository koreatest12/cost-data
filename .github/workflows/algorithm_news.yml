name: 🌌 Omni-Intelligence Grand Pipeline (Conflict Auto-Fix)

on:
  schedule:
    - cron: '0 21 * * *' # ⏰ KST 06:00
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  # ==============================================================================
  # 🛡️ 1. Security Engine (50만 건 폭발적 생성)
  # ==============================================================================
  security-core:
    name: 🛡️ Security Engine (500k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_SEC/live/threat_intel
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install faker
      - name: 🧬 Generate Massive Data
        run: |
          cat << 'EOF' > sec_core.py
          import json, os, datetime, random
          from faker import Faker
          fake = Faker()
          
          print("⚡ Generating 500,000 Security Records...")
          data = []
          # 50만 건 루프
          for i in range(500000):
              data.append({
                  "id": f"SEC-{i}",
                  "title": f"Critical Vulnerability CVE-2026-{10000+i}",
                  "content": fake.sentence(),
                  "severity": random.choice(["Critical", "High", "Medium"]),
                  "date": datetime.datetime.now().strftime('%Y-%m-%d')
              })
          
          with open("DB_SEC/live/threat_intel/news.json", "w") as f: json.dump(data, f)
          print(f"✅ Security Data Generated: {len(data)}")
          EOF
          python sec_core.py

      - name: 📦 Pack Data
        run: tar -czf security_pkg.tar.gz DB_SEC/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-security, path: security_pkg.tar.gz }

  # ==============================================================================
  # 💼 2. Job Engine (30만 건 생성)
  # ==============================================================================
  job-core:
    name: 💼 Job Fortress (300k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_JOB/live/global
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install faker
      - name: 🧬 Generate Massive Data
        run: |
          cat << 'EOF' > job_core.py
          import json, os, random
          from faker import Faker
          fake = Faker()
          print("⚡ Generating 300,000 Job Records...")
          data = []
          for i in range(300000):
              data.append({
                  "id": f"JOB-{i}",
                  "title": f"{fake.job()} at {fake.company()}",
                  "location": random.choice(["Pangyo", "Seoul", "Busan", "Global"])
              })
          with open("DB_JOB/live/global/jobs.json", "w") as f: json.dump(data, f)
          EOF
          python job_core.py

      - name: 📦 Pack Data
        run: tar -czf job_pkg.tar.gz DB_JOB/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-job, path: job_pkg.tar.gz }

  # ==============================================================================
  # 🧮 3. Algo Engine (10만 건 생성)
  # ==============================================================================
  algo-core:
    name: 🧮 Algo Engine (100k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_ALGO/live/ai
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 Generate Massive Data
        run: |
          cat << 'EOF' > algo_core.py
          import json, os
          print("⚡ Generating 100,000 Algo Records...")
          data = [{"id":i, "title":f"Algo Research #{i}"} for i in range(100000)]
          with open("DB_ALGO/live/ai/data.json", "w") as f: json.dump(data, f)
          EOF
          python algo_core.py

      - name: 📦 Pack Data
        run: tar -czf algo_pkg.tar.gz DB_ALGO/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-algo, path: algo_pkg.tar.gz }

  # ==============================================================================
  # 💰 4. Cost Engine (10만 건 생성)
  # ==============================================================================
  misc-core:
    name: 💰 Cost Engine (100k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_COST/live/market
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 Generate Massive Data
        run: |
          cat << 'EOF' > misc_core.py
          import json, os, random
          print("⚡ Generating 100,000 Cost Records...")
          data = [{"id":i, "rate":1400+random.randint(-100,100)} for i in range(100000)]
          with open("DB_COST/live/market/data.json", "w") as f: json.dump(data, f)
          EOF
          python misc_core.py

      - name: 📦 Pack Data
        run: tar -czf cost_pkg.tar.gz DB_COST/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-cost, path: cost_pkg.tar.gz }

  # ==============================================================================
  # ☕ 5. Java App Build (Robust Upload & Build)
  # ==============================================================================
  java-app-build:
    needs: [security-core, job-core, algo-core, misc-core]
    name: ☕ Java API Build (Final)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/download-artifact@v4
        with: { pattern: 'pkg-*', merge-multiple: true }
        continue-on-error: true

      - name: ☕ JDK 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: maven }

      - name: 🛠️ Install Data
        run: |
          if ls *.tar.gz 1> /dev/null 2>&1; then
            for pkg in *.tar.gz; do tar -xzf "$pkg"; done
          else
            mkdir -p DB_SEC/live DB_JOB/live DB_ALGO/live DB_COST/live
          fi
          
          rm -rf src
          mkdir -p src/main/resources/data
          
          [ -d DB_SEC/live ] && cp -r DB_SEC/live src/main/resources/data/security
          [ -d DB_JOB/live ] && cp -r DB_JOB/live src/main/resources/data/jobs
          [ -d DB_ALGO/live ] && cp -r DB_ALGO/live src/main/resources/data/algo
          [ -d DB_COST/live ] && cp -r DB_COST/live src/main/resources/data/cost
          
          echo "✅ Massive Data Installed."

      - name: 📝 pom.xml
        run: |
          cat << 'EOF' > pom.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <parent><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-parent</artifactId><version>3.2.1</version><relativePath/></parent>
              <groupId>com.costdata</groupId><artifactId>omni-intelligence-api</artifactId><version>1.0.0</version>
              <packaging>jar</packaging>
              <name>Omni Intelligence API</name>
              <properties><java.version>17</java.version></properties>
              <dependencies>
                  <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId></dependency>
                  <dependency><groupId>org.projectlombok</groupId><artifactId>lombok</artifactId><optional>true</optional></dependency>
                  <dependency><groupId>jakarta.annotation</groupId><artifactId>jakarta.annotation-api</artifactId></dependency>
                  <dependency><groupId>com.fasterxml.jackson.core</groupId><artifactId>jackson-databind</artifactId></dependency>
              </dependencies>
              <build><plugins><plugin><groupId>org.springframework.boot</groupId><artifactId>spring-boot-maven-plugin</artifactId><configuration><mainClass>com.costdata.OmniApiApplication</mainClass></configuration></plugin></plugins></build>
          </project>
          EOF

      - name: 🧬 Java Code
        run: |
          mkdir -p src/main/java/com/costdata
          cat << 'EOF' > src/main/java/com/costdata/OmniApiApplication.java
          package com.costdata;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;
          import java.util.Map;
          @SpringBootApplication @RestController
          public class OmniApiApplication {
              public static void main(String[] args) { SpringApplication.run(OmniApiApplication.class, args); }
              @GetMapping("/api/status") public Map<String, String> s() { return Map.of("status", "Online", "records", "1,000,000+"); }
          }
          EOF

      - run: mvn clean package -DskipTests

      - name: 🐳 Docker Build
        run: |
          cat <<EOF > Dockerfile
          FROM eclipse-temurin:17-jdk-jammy
          WORKDIR /app
          COPY target/*.jar app.jar
          ENTRYPOINT ["java", "-jar", "/app.jar"]
          EOF
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}/omni-java-api:latest"
          docker build -t $IMG . && docker push $IMG

  # ==============================================================================
  # 🌍 6. Master Dashboard (충돌 자동 해결 로직 적용)
  # ==============================================================================
  master-hub:
    needs: [java-app-build]
    name: 🌍 Master Dashboard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with: { pattern: 'pkg-*', merge-multiple: true }
      
      - name: 📊 Generate README
        run: |
          cat << 'EOF' > dashboard.py
          import os
          pkg_size = 0
          for f in os.listdir('.'):
              if f.endswith('.tar.gz'): pkg_size += os.path.getsize(f)
          pkg_mb = pkg_size / (1024*1024)
          md = f"# 🌌 Omni-Intelligence Hub (1 Million)\n\n![Status](https://img.shields.io/badge/Status-Stable-green) ![Data](https://img.shields.io/badge/Records-1,000,000+-blue)\n"
          md += f"## 🎛️ Mission Control\n- **Payload:** {pkg_mb:.2f} MB\n- **Security:** 500k\n- **Jobs:** 300k\n"
          with open("README.md", "w") as f: f.write(md)
          EOF
          python dashboard.py

      - run: cat README.md >> $GITHUB_STEP_SUMMARY

      # [핵심] 충돌 발생 시 내 데이터를 우선으로 강제 병합 (Auto-Resolve Conflict Strategy)
      - name: 🌿 Commit & Push (Force Resolve)
        run: |
          git config --global user.name "Omni Bot"
          git config --global user.email "bot@actions"
          
          # 1. 원격 URL에 토큰 주입 (권한 확보)
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          
          # 2. 모든 변경사항 스테이징
          git add .
          
          if git diff --cached --quiet; then
            echo "✨ No changes to commit"
          else
            git commit -m "🚀 Massive Update: $(date +'%Y-%m-%d %H:%M')"
            
            # [Fix] 충돌 자동 해결 루프 (Rebase 대신 Merge Strategy 사용)
            n=0
            until [ "$n" -ge 10 ]; do
               # Pull을 시도하되, 충돌 시 내 변경사항(ours)을 우선 적용 (-X ours)
               # 주의: 여기서 'ours'는 현재 작업 중인 브랜치(봇이 만든 데이터)를 의미
               git pull origin main --no-rebase -s recursive -X ours && git push origin main && break
               
               n=$((n+1))
               echo "⚠️ Conflict detected. Auto-resolving using local data... ($n/10)"
               sleep 5
            done
          fi
