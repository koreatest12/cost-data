name: 🌍 Omni-Intelligence Master Dashboard

on:
  schedule:
    - cron: '30 23 * * *' # ⏰ 모든 수집이 끝난 후 (KST 08:30) 실행
  workflow_dispatch:      # 수동 실행 가능

permissions:
  contents: write

jobs:
  master-dashboard:
    name: 📊 Generate Master View
    runs-on: ubuntu-latest
    steps:
      - name: 📥 전체 데이터 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🧩 마스터 리포트 생성 코어
        run: |
          cat << 'EOF' > master_core.py
          import os, json, datetime

          # [설정] 각 DB 경로
          DBS = {
              "🛡️ SECURITY": "DB_SEC",
              "💼 JOBS": "DB/jobs", # 취업 정보는 DB/jobs 안에 있음
              "🧮 ALGO": "DB_ALGO",
              "💰 COST": "DB_COST",
              "📚 STUDY": "DB_STUDY/meta"
          }

          def count_files(path):
              count = 0
              if not os.path.exists(path): return 0
              for root, dirs, files in os.walk(path):
                  # JSON 파일 내부의 항목 수를 세는 것이 정확하지만,
                  # 속도를 위해 파일 용량이나 개수로 추산하거나, JSON을 로드해서 합산
                  for f in files:
                      if f.endswith('.json'):
                          try:
                              with open(os.path.join(root, f), 'r', encoding='utf-8') as json_file:
                                  data = json.load(json_file)
                                  if isinstance(data, list): count += len(data)
                          except: pass
              return count

          def main():
              print("🚀 Generating Master Dashboard...")
              
              total_stats = {}
              grand_total = 0
              
              for name, path in DBS.items():
                  cnt = count_files(path)
                  total_stats[name] = cnt
                  grand_total += cnt

              now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M')

              # README.md 내용 생성
              md = f"# 🌌 Omni-Intelligence Data Hub\n\n"
              md += f"![Status](https://img.shields.io/badge/System-Operational-success?style=for-the-badge) "
              md += f"![Data](https://img.shields.io/badge/Total_Records-{grand_total:,}-blue?style=for-the-badge) "
              md += f"![Sync](https://img.shields.io/badge/Last_Sync-{now.replace(' ', '_')}-orange?style=for-the-badge)\n\n"
              
              md += "> **이 리포지토리는 보안, 취업, 기술, 경제, 학습 데이터를 매일 대량으로 수집하여 영구 보존합니다.**\n\n"

              # 1. 통합 상태 패널
              md += "## 🎛️ Mission Control Status\n"
              md += "| Domain | Status | Data Count | Storage |\n|:---:|:---:|:---:|:---:|\n"
              
              for name, cnt in total_stats.items():
                  status = "🟢 Active" if cnt > 0 else "🟡 Initializing"
                  md += f"| **{name}** | {status} | **{cnt:,}** | Docker & Git |\n"

              # 2. 도메인별 바로가기
              md += "\n## 📂 Data Sectors\n"
              
              md += "### 🛡️ [Security Intelligence](DB_SEC/)\n"
              md += "- **CVE/Zero-Day**: 2025년형 최신 취약점 및 PQC(양자내성암호) 동향\n"
              md += "- **Threat Intel**: 랜섬웨어, APT 그룹, 다크웹 유출 모니터링\n"
              
              md += "\n### 💼 [Job & Recruitment](DB/jobs/)\n"
              md += "- **Hyper-Scale**: 4대 포털(잡코리아, 사람인 등) + 20개 지역 + 100개 직무\n"
              md += "- **Analyzer**: 연봉 파싱, 기술 스택 분석, S급 공고 자동 랭킹\n"
              
              md += "\n### 🧮 [Algorithm & Tech](DB_ALGO/)\n"
              md += "- **AI Research**: LLM, 논문, 빅테크 기술 블로그\n"
              md += "- **Coding**: 백준, 리트코드, 알고리즘 트렌드\n"

              md += "\n### 💰 [Cost & FinOps](DB_COST/)\n"
              md += "- **Cloud Price**: AWS/Azure/GCP 스팟 인스턴스 가격 추적\n"
              md += "- **Economy**: 환율, 금리, 유가 등 IT 비용 영향 지표\n"

              md += "\n### 📚 [Study Archiver](DB_STUDY/)\n"
              md += "- **Official Docs**: KISA 가이드, 법령 PDF, 기술 문서 실물 저장\n"

              md += "\n---\n"
              md += f"Automated by **Gemini Neural Engine** | Repo: {os.getenv('GITHUB_REPOSITORY')}"

              with open("README.md", "w", encoding='utf-8') as f:
                  f.write(md)
              
              print("✅ README.md Updated successfully.")

          if __name__ == "__main__":
              main()
          EOF
          python master_core.py

      - name: 🌿 결과 반영 (Commit)
        run: |
          git config --global user.name "Master Bot"
          git config --global user.email "bot@actions"
          git add README.md
          git commit -m "🌌 Update Master Dashboard: $(date +'%Y-%m-%d')" || exit 0
          git push origin main
