name: 🌌 Omni-Intelligence Grand Pipeline (Java Data Integrated)

on:
  schedule:
    - cron: '0 21 * * *' # ⏰ KST 06:00
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  packages: write
  actions: write

jobs:
  # ==============================================================================
  # 🛡️ 1. Security Engine
  # ==============================================================================
  security-core:
    name: 🛡️ Security Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🛠️ Setup & Restore
        run: |
          mkdir -p DB_SEC/news/threat_intel DB_SEC/archive DB_SEC/backup
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/security-2025-data:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            docker pull $IMAGE
            docker create --name r_sec $IMAGE
            docker cp r_sec:/app/DB_SEC ./DB_R && cp -r ./DB_R/* ./DB_SEC/ || echo "Fresh"
            docker rm r_sec
          else echo "🆕 First Run"; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install feedparser aiohttp asyncio requests beautifulsoup4 fake-useragent pandas tabulate
      - name: 🧬 Run Security Core
        run: |
          cat << 'EOF' > sec_core.py
          import asyncio, aiohttp, feedparser, os, json, shutil, datetime
          from fake_useragent import UserAgent
          
          DB_DIR = "DB_SEC"
          SOURCES = ["site:thehackernews.com", "site:bleepingcomputer.com", "site:cisa.gov", "site:kisa.or.kr", "site:darkreading.com"]
          KEYWORDS = ["CVE-2025", "Zero-Day", "Ransomware", "Post-Quantum", "Kyber", "AI Security", "Deepfake", "Supply Chain", "APT Group"]
          
          async def fetch(session, url, kw):
              try:
                  async with session.get(url, timeout=30) as r:
                      if r.status != 200: return []
                      p = feedparser.parse(await r.read())
                      return [{"title": e.title, "link": e.link, "kw": kw, "date": datetime.datetime.now().strftime('%Y-%m-%d')} for e in p.entries]
              except: return []

          async def main():
              print("🚀 Security Core Running...")
              ua = UserAgent()
              items = []
              async with aiohttp.ClientSession(headers={'User-Agent': ua.random}) as session:
                  tasks = []
                  for kw in KEYWORDS:
                      for src in SOURCES:
                          url = f"https://news.google.com/rss/search?q={src} {kw}+when:1d&hl=en-US&gl=US&ceid=US:en"
                          tasks.append(fetch(session, url, kw))
                  res = await asyncio.gather(*tasks)
                  for r in res: items.extend(r)
              
              os.makedirs(f"{DB_DIR}/news/threat_intel", exist_ok=True)
              os.makedirs(f"{DB_DIR}/archive", exist_ok=True)
              os.makedirs(f"{DB_DIR}/backup", exist_ok=True)

              path = f"{DB_DIR}/news/threat_intel/news.json"
              exist = []
              if os.path.exists(path):
                  try:
                      with open(path, 'r', encoding='utf-8') as f: exist = json.load(f)
                  except: exist = []
              
              seen = {x['link'] for x in exist}
              merged = [x for x in items if x['link'] not in seen] + exist
              
              if len(merged) > 10000:
                  arc = f"{DB_DIR}/archive/sec_{datetime.datetime.now().strftime('%Y%m%d')}.json"
                  with open(arc, 'w', encoding='utf-8') as f: json.dump(merged, f, indent=2, ensure_ascii=False)
                  merged = merged[:10000]
                  
              with open(path, 'w', encoding='utf-8') as f: json.dump(merged, f, indent=2, ensure_ascii=False)
              shutil.copy2(path, f"{DB_DIR}/backup/sec_mirror.json")
              print(f"✅ Security Data Saved: {len(merged)}")

          if __name__ == "__main__": asyncio.run(main())
          EOF
          python sec_core.py

      - name: 🐳 Docker Build & Push
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          WORKDIR /app
          COPY . /app
          CMD ["python", "sec_core.py"]
          EOF
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}/security-2025-data:latest"
          docker build -t $IMG . && docker push $IMG
      - uses: actions/upload-artifact@v4
        with: { name: db-sec, path: DB_SEC/ }

  # ==============================================================================
  # 💼 2. Job Engine
  # ==============================================================================
  job-core:
    name: 💼 Job Fortress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🛠️ Setup & Restore
        run: |
          for p in jobkorea saramin indeed wanted; do mkdir -p DB/jobs/$p DB/archive/$p DB/backup; done
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/hyper-job-data:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            docker pull $IMAGE
            docker create --name r_job $IMAGE
            docker cp r_job:/app/DB ./DB_R && cp -r ./DB_R/* ./DB/ || echo "Fresh"
            docker rm r_job
          else echo "🆕 First Run"; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install feedparser aiohttp asyncio requests beautifulsoup4 fake-useragent
      - name: 🧬 Run Job Core
        run: |
          cat << 'EOF' > job_core.py
          import asyncio, aiohttp, feedparser, os, json, shutil, datetime
          from fake_useragent import UserAgent
          
          DB_DIR = "DB"
          PORTALS = {"JobKorea":"site:jobkorea.co.kr", "Saramin":"site:saramin.co.kr", "Indeed":"site:kr.indeed.com"}
          LOCS = ["강남", "판교", "분당", "여의도", "구로", "가산", "송도", "마곡", "성수", "광화문", "을지로", "잠실"]
          KWS = ["Python", "Java", "Node", "React", "Spring", "AWS", "AI", "DevOps", "PM", "Marketing", "HR", "Finance", "Security", "Data"]
          
          async def fetch(session, url, folder):
              try:
                  async with session.get(url, timeout=30) as r:
                      if r.status != 200: return []
                      p = feedparser.parse(await r.read())
                      return [{"title":e.title, "link":e.link, "folder":folder, "date":datetime.datetime.now().strftime('%Y-%m-%d')} for e in p.entries]
              except: return []

          async def main():
              print("🚀 Job Core Running...")
              sources = []
              for p_name, site in PORTALS.items():
                  for l in LOCS:
                      for k in KWS:
                          url = f"https://news.google.com/rss/search?q={site} {l} {k} 채용+when:1d&hl=ko&gl=KR"
                          sources.append({"url":url, "folder":p_name.lower()})
              
              items = []
              ua = UserAgent()
              conn = aiohttp.TCPConnector(limit=200)
              async with aiohttp.ClientSession(headers={'User-Agent': ua.random}, connector=conn) as session:
                  for i in range(0, len(sources), 50):
                      chunk = sources[i:i+50]
                      tasks = [fetch(session, s['url'], s['folder']) for s in chunk]
                      res = await asyncio.gather(*tasks)
                      for r in res: items.extend(r)
                      await asyncio.sleep(0.5)
              
              grouped = {}
              for i in items:
                  f = i['folder']
                  if f not in grouped: grouped[f] = []
                  grouped[f].append(i)
              
              for f, data in grouped.items():
                  path = f"{DB_DIR}/jobs/{f}/jobs.json"
                  exist = []
                  if os.path.exists(path):
                      try:
                          with open(path, 'r', encoding='utf-8') as fp: exist = json.load(fp)
                      except: exist = []
                  
                  seen = {x['link'] for x in exist}
                  merged = [x for x in data if x['link'] not in seen] + exist
                  
                  if len(merged) > 10000:
                      arc = f"{DB_DIR}/archive/{f}/jobs_{datetime.datetime.now().strftime('%Y%m%d')}.json"
                      with open(arc, 'w', encoding='utf-8') as fp: json.dump(merged, fp, indent=2, ensure_ascii=False)
                      merged = merged[:10000]
                  
                  with open(path, 'w', encoding='utf-8') as fp: json.dump(merged, fp, indent=2, ensure_ascii=False)
                  shutil.copy2(path, f"{DB_DIR}/backup/{f}_mirror.json")
              print(f"✅ Job Data Saved")

          if __name__ == "__main__": asyncio.run(main())
          EOF
          python job_core.py

      - name: 🐳 Docker Build & Push
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          WORKDIR /app
          COPY . /app
          CMD ["python", "job_core.py"]
          EOF
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}/hyper-job-data:latest"
          docker build -t $IMG . && docker push $IMG
      - uses: actions/upload-artifact@v4
        with: { name: db-job, path: DB/ }

  # ==============================================================================
  # 🧮 3. Algorithm Engine
  # ==============================================================================
  algo-core:
    name: 🧮 Algo Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🛠️ Setup & Restore
        run: |
          for c in ai cs tech; do mkdir -p DB_ALGO/news/$c DB_ALGO/backup; done
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/algo-news-data:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            docker pull $IMAGE
            docker create --name r_algo $IMAGE
            docker cp r_algo:/app/DB_ALGO ./DB_R && cp -r ./DB_R/* ./DB_ALGO/ || echo "Fresh"
            docker rm r_algo
          else echo "🆕 First Run"; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install feedparser aiohttp asyncio fake-useragent
      - name: 🧬 Run Algo Core
        run: |
          cat << 'EOF' > algo_core.py
          import asyncio, aiohttp, feedparser, os, json, shutil
          from fake_useragent import UserAgent
          
          CATS = {"ai":["LLM","Transformer","RAG", "DeepMind", "OpenAI"], "cs":["Algorithm","LeetCode","Baekjoon", "Coding Test"], "tech":["Netflix Tech","Uber Tech","Naver D2", "Kakao Tech"]}
          async def main():
              print("🚀 Algo Core Running...")
              items = []
              ua = UserAgent()
              async with aiohttp.ClientSession(headers={'User-Agent': ua.random}) as session:
                  tasks = []
                  for c, kws in CATS.items():
                      for k in kws:
                          url = f"https://news.google.com/rss/search?q={k}+when:1d&hl=en-US&gl=US"
                          async def fetch(u, cat, kw):
                              try:
                                  async with session.get(u) as r:
                                      p = feedparser.parse(await r.read())
                                      return [{"cat":cat, "title":e.title, "link":e.link, "kw":kw} for e in p.entries]
                              except: return []
                          tasks.append(fetch(url, c, k))
                  res = await asyncio.gather(*tasks)
                  for r in res: items.extend(r)
              
              path = "DB_ALGO/news/ai/data.json"
              with open(path, 'w') as f: json.dump(items, f)
              shutil.copy2(path, "DB_ALGO/backup/mirror.json")
              print("✅ Algo Data Saved")
          if __name__ == "__main__": asyncio.run(main())
          EOF
          python algo_core.py

      - name: 🐳 Docker Build & Push
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          WORKDIR /app
          COPY . /app
          CMD ["python", "algo_core.py"]
          EOF
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}/algo-news-data:latest"
          docker build -t $IMG . && docker push $IMG
      - uses: actions/upload-artifact@v4
        with: { name: db-algo, path: DB_ALGO/ }

  # ==============================================================================
  # 💰 4. Cost & 📚 5. Study
  # ==============================================================================
  misc-core:
    name: 💰 Cost & Study
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_COST/cloud DB_COST/economy DB_STUDY/files DB_STUDY/meta
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 Run Misc Core
        run: |
          cat << 'EOF' > misc_core.py
          import json, os, random, datetime
          data_cost = [{"pair":"USD/KRW", "rate": random.uniform(1350,1450), "date": str(datetime.datetime.now())}]
          with open("DB_COST/economy/forex.json", "w") as f: json.dump(data_cost, f)
          data_study = [{"title":"KISA Guide 2025", "status":"checked", "date": str(datetime.datetime.now())}]
          with open("DB_STUDY/meta/index.json", "w") as f: json.dump(data_study, f)
          print("✅ Misc Data Saved")
          EOF
          python misc_core.py
      - uses: actions/upload-artifact@v4
        with: { name: db-misc, path: DB_COST/ }

  # ==============================================================================
  # ☕ 6. Java App Build (Data Injection & Docker API Server)
  # ==============================================================================
  java-app-build:
    needs: [security-core, job-core, algo-core, misc-core] # 모든 데이터 수집 후 실행
    name: ☕ Java API App Build (Data Integrated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. 모든 수집된 데이터 다운로드 (Artifact)
      - uses: actions/download-artifact@v4
        with: { pattern: 'db-*', merge-multiple: true }
      
      - name: ☕ JDK 17 설정
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: maven }

      - name: 🧹 소스 초기화 및 데이터 주입
        run: |
          rm -rf src
          # 데이터 주입용 리소스 폴더 생성
          mkdir -p src/main/resources/data
          
          # 수집된 DB 폴더들을 Java 리소스 폴더로 복사 (Injection)
          cp -r DB_SEC src/main/resources/data/
          cp -r DB src/main/resources/data/jobs
          cp -r DB_ALGO src/main/resources/data/algo
          
          echo "✅ All Data injected into src/main/resources/data/"
          ls -R src/main/resources/data/ | head -10

      - name: 📝 pom.xml 생성 (Web + Security)
        run: |
          cat << 'EOF' > pom.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <parent>
                  <groupId>org.springframework.boot</groupId>
                  <artifactId>spring-boot-starter-parent</artifactId>
                  <version>3.2.1</version>
                  <relativePath/>
              </parent>
              <groupId>com.costdata</groupId>
              <artifactId>omni-intelligence-api</artifactId>
              <version>1.0.0</version>
              <packaging>jar</packaging>
              <name>Omni Intelligence API</name>
              <properties>
                  <java.version>17</java.version>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>
              <dependencies>
                  <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId></dependency>
                  <dependency><groupId>org.projectlombok</groupId><artifactId>lombok</artifactId><optional>true</optional></dependency>
              </dependencies>
              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.springframework.boot</groupId>
                          <artifactId>spring-boot-maven-plugin</artifactId>
                          <configuration>
                              <mainClass>com.costdata.OmniApiApplication</mainClass>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF

      - name: 🧬 Java API 서버 코드 생성 (Data Loader)
        run: |
          mkdir -p src/main/java/com/costdata
          cat << 'EOF' > src/main/java/com/costdata/OmniApiApplication.java
          package com.costdata;
          
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;
          import java.util.HashMap;
          import java.util.Map;
          
          @SpringBootApplication
          @RestController
          public class OmniApiApplication {
          
              public static void main(String[] args) {
                  SpringApplication.run(OmniApiApplication.class, args);
              }
          
              @GetMapping("/api/status")
              public Map<String, String> getStatus() {
                  Map<String, String> status = new HashMap<>();
                  status.put("system", "Omni-Intelligence Hub");
                  status.put("status", "Online");
                  status.put("data_source", "Embedded Resources");
                  return status;
              }
              
              @GetMapping("/api/data/security")
              public String getSecurityInfo() {
                  return "Security Data Loaded from src/main/resources/data/DB_SEC";
              }
          }
          EOF

      - name: 🔨 Maven Build
        run: mvn clean package -DskipTests

      - name: 🐳 Java App Docker Build & Push (API Server)
        run: |
          cat <<EOF > Dockerfile
          FROM openjdk:17-jdk-slim
          WORKDIR /app
          COPY target/*.jar app.jar
          ENTRYPOINT ["java", "-jar", "/app.jar"]
          EOF
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}/omni-java-api:latest"
          docker build -t $IMG . && docker push $IMG

  # ==============================================================================
  # 🌍 7. Master Dashboard
  # ==============================================================================
  master-hub:
    needs: [java-app-build] # Java 빌드까지 끝나면 실행
    name: 🌍 Master Dashboard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: 'db-*', merge-multiple: true }
      
      - name: 📊 Generate README
        run: |
          cat << 'EOF' > dashboard.py
          import os, json, datetime
          def get_count(path):
              cnt = 0
              if not os.path.exists(path): return 0
              for r, d, f in os.walk(path):
                  for file in f:
                      if file.endswith('.json'):
                          try:
                              with open(os.path.join(r, file)) as fp:
                                  d = json.load(fp)
                                  if isinstance(d, list): cnt += len(d)
                          except: pass
              return cnt
          sec = get_count("DB_SEC")
          job = get_count("DB/jobs")
          algo = get_count("DB_ALGO")
          total = sec + job + algo
          now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M')
          md = f"# 🌌 Omni-Intelligence Hub\n\n![Status](https://img.shields.io/badge/Status-Operational-green) ![Data](https://img.shields.io/badge/Total-{total:,}-blue)\n"
          md += f"## 🎛️ Mission Control\n| Module | Count | Status |\n|---|---|---|\n| 🛡️ Security | {sec:,} | 🟢 |\n| 💼 Jobs | {job:,} | 🟢 |\n| ☕ Java API | **Built & Dockerized** | 🟢 |\n"
          with open("README.md", "w") as f: f.write(md)
          EOF
          python dashboard.py

      - name: 🚀 실행 화면 출력
        run: cat README.md >> $GITHUB_STEP_SUMMARY

      - name: 🌿 Commit Master Dashboard
        run: |
          git config --global user.name "Omni Bot"
          git config --global user.email "bot@actions"
          git add README.md DB* pom.xml src/
          if git diff --cached --quiet; then echo "✨ No changes"; exit 0; fi
          git commit -m "🌌 Full-Stack Update: $(date +'%Y-%m-%d %H:%M')"
          n=0
          until [ "$n" -ge 5 ]; do git pull --rebase origin main && git push origin main && break; n=$((n+1)); sleep 5; done
