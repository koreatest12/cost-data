name: 🛡️ Security & Crypto Intelligence

on:
  schedule:
    - cron: '30 22 * * *' # ⏰ KST 07:30
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  crypto-security-engine:
    name: 🔐 Crypto & Security Engine
    runs-on: ubuntu-latest
    steps:
      - name: 📥 소스 코드 체크아웃
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 🔄 데이터 복원 (이전 데이터 불러오기)
      # ------------------------------------------------------------------
      - name: 🔄 Smart Data Restore
        run: |
          IMAGE_URL="ghcr.io/${GITHUB_REPOSITORY,,}/security-news-data:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          if docker manifest inspect $IMAGE_URL > /dev/null 2>&1; then
            echo "✅ Restore: Pulling previous security data..."
            docker pull $IMAGE_URL
            docker create --name restore_cnt $IMAGE_URL
            if docker cp restore_cnt:/app/DB_SEC ./DB_SEC_RESTORED; then
              mkdir -p DB_SEC
              cp -r ./DB_SEC_RESTORED/* ./DB_SEC/
              rm -rf ./DB_SEC_RESTORED
            fi
            docker rm restore_cnt
          else
            echo "🆕 First Run: Initializing Security DB."
            mkdir -p DB_SEC
          fi

      # ------------------------------------------------------------------
      # 🛠️ 환경 구축
      # ------------------------------------------------------------------
      - name: 🛠️ Setup Infrastructure
        run: |
          # 폴더 구조: 일반 보안 / 키 교환(암호화) / 아카이브 / 백업
          mkdir -p DB_SEC/news/general
          mkdir -p DB_SEC/news/crypto
          mkdir -p DB_SEC/archive
          mkdir -p DB_SEC/backup
          
          cat <<EOF > requirements.txt
          feedparser
          aiohttp
          asyncio
          beautifulsoup4
          fake-useragent
          tabulate
          pandas
          EOF

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 📦 Install Dependencies
        run: pip install -r requirements.txt

      # ------------------------------------------------------------------
      # 🔥 키 교환 및 보안 특화 수집 코어
      # ------------------------------------------------------------------
      - name: 🧬 Generate Crypto-Security Core
        run: |
          cat << 'EOF' > security_core.py
          import asyncio, aiohttp, feedparser, os, json, shutil, re
          from datetime import datetime
          from fake_useragent import UserAgent
          from collections import Counter

          # [설정]
          DB_DIR = "DB_SEC"
          NEWS_DIR = os.path.join(DB_DIR, "news")
          ARCHIVE_DIR = os.path.join(DB_DIR, "archive")
          BACKUP_DIR = os.path.join(DB_DIR, "backup")
          REPORT_FILE = "security_briefing.md"
          
          # [핵심] 키워드 매트릭스 (보안 + 키 교환 특화)
          SEARCH_KEYWORDS = {
              "🔐 Key_Exchange": [
                  "Post-Quantum Cryptography", "PQC NIST", "Kyber Key Exchange", "ML-KEM", "CRYSTALS-Kyber",
                  "Diffie-Hellman Vulnerability", "ECDH Key Exchange", "TLS 1.3 Handshake", "SSH Key Exchange",
                  "Quantum Key Distribution", "QKD Network", "Key Encapsulation Mechanism", "KEM Algorithm"
              ],
              "🛡️ Cyber_Threat": [
                  "Ransomware Gang", "Zero-day Exploit", "CVE-2025", "CVE-2026", "Supply Chain Attack",
                  "APT Group", "Cobalt Strike", "Phishing Campaign", "Cloud Security Breach"
              ],
              "📜 Standard_Policy": [
                  "NIST SP 800-56A", "FIPS 140-3", "ISO/IEC 27001", "KISA Security Guide",
                  "Cryptographic Standard", "Zero Trust Architecture"
              ]
          }
          
          # 타겟 소스
          SOURCES = [
              "site:nist.gov", "site:cisa.gov", "site:ietf.org", "site:iso.org", # 표준 기구
              "site:schneier.com", "site:krebsonsecurity.com", # 전문가 블로그
              "site:thehackernews.com", "site:bleepingcomputer.com" # 뉴스
          ]

          async def fetch(session, url, category, sub_cat, keyword):
              try:
                  async with session.get(url, timeout=35) as r:
                      if r.status != 200: return []
                      p = feedparser.parse(await r.read())
                      results = []
                      for e in p.entries:
                          title = e.title.strip()
                          results.append({
                              "category": category,   # news
                              "sub_cat": sub_cat,     # Key_Exchange, Cyber_Threat...
                              "title": title, 
                              "link": e.link, 
                              "keyword": keyword,
                              "published": datetime.now().strftime('%Y-%m-%d')
                          })
                      return results
              except: return []

          def secure_save(folder_name, new_data):
              active_path = os.path.join(NEWS_DIR, folder_name, "data.json")
              backup_path = os.path.join(BACKUP_DIR, f"{folder_name}_mirror.json")
              
              if not os.path.exists(os.path.dirname(active_path)):
                  os.makedirs(os.path.dirname(active_path))

              existing = []
              if os.path.exists(active_path):
                  try:
                      with open(active_path, 'r', encoding='utf-8') as f: existing = json.load(f)
                  except: existing = []
              
              ex_links = {x['link'] for x in existing}
              unique_new = [x for x in new_data if x['link'] not in ex_links]
              merged = unique_new + existing
              
              # 아카이빙 (8888건 초과)
              if len(merged) > 8888:
                  snapshot = f"{folder_name}_{datetime.now().strftime('%Y%m%d_%H%M')}.json"
                  arc_path = os.path.join(ARCHIVE_DIR, snapshot)
                  with open(arc_path, 'w', encoding='utf-8') as f: json.dump(merged, f, indent=2, ensure_ascii=False)
                  merged = merged[:8888]

              with open(active_path, 'w', encoding='utf-8') as f: json.dump(merged, f, indent=2, ensure_ascii=False)
              shutil.copy2(active_path, backup_path)
              return merged

          def generate_dashboard(all_items):
              total_cnt = len(all_items)
              now = datetime.now().strftime('%Y-%m-%d %H:%M')
              
              # 카테고리 통계
              cats = [i['sub_cat'] for i in all_items]
              cat_cnt = Counter(cats)
              
              # 키워드 통계
              kws = [i['keyword'] for i in all_items]
              kw_cnt = Counter(kws).most_common(10)

              md = f"# 🔐 Crypto & Security Intelligence\n\n"
              
              # Status Panel
              md += f"""
              <table>
                <tr>
                    <td align="center"><b>🖥️ System Status</b></td>
                    <td align="center"><b>💾 Total Intel</b></td>
                    <td align="center"><b>🛡️ Protection</b></td>
                </tr>
                <tr>
                    <td align="center">🟢 <b style="color:green">Online</b></td>
                    <td align="center"><b>{total_cnt:,}</b></td>
                    <td align="center">🔐 <b>3-Way Sync</b></td>
                </tr>
              </table>
              """
              
              # Mermaid Pie Chart (카테고리 비율)
              md += "\n### 📊 Intelligence Distribution\n"
              md += "```mermaid\npie title Threat & Crypto Share\n"
              for k, v in cat_cnt.items():
                  label = k.replace("_", " ")
                  md += f'    "{label}" : {v}\n'
              md += "```\n"
              
              # Key Exchange / PQC Special Section
              crypto_items = [i for i in all_items if i['sub_cat'] == '🔐 Key_Exchange']
              md += f"\n### 🔐 Key Exchange & PQC Updates ({len(crypto_items)})\n"
              md += "| Keyword | Title |\n|:---:|:---|\n"
              for item in crypto_items[:20]:
                  title = item['title'][:50].replace("|", "-")
                  md += f"| `{item['keyword']}` | [{title}]({item['link']}) |\n"

              # Critical Threats
              threat_items = [i for i in all_items if i['sub_cat'] == '🛡️ Cyber_Threat']
              md += f"\n### 🚨 Critical Cyber Threats ({len(threat_items)})\n"
              md += "| Keyword | Title |\n|:---:|:---|\n"
              for item in threat_items[:20]:
                  title = item['title'][:50].replace("|", "-")
                  md += f"| `{item['keyword']}` | [{title}]({item['link']}) |\n"

              md += "\n### 🔥 Trending Keywords\n"
              for k, c in kw_cnt:
                  bar = "█" * int((c/total_cnt)*50) if total_cnt > 0 else ""
                  md += f"- **{k}**: `{bar}` ({c})\n"

              with open(REPORT_FILE, 'w', encoding='utf-8') as f: f.write(md)

          async def main():
              print("🚀 Crypto-Security Engine Running...")
              
              sources = []
              # 쿼리 생성: [키워드] x [타겟사이트]
              for sub_cat, keywords in SEARCH_KEYWORDS.items():
                  folder = "crypto" if "Key" in sub_cat else "general"
                  for kw in keywords:
                      # 일반 검색 + 사이트 타겟 검색 병행
                      # 1. 일반 검색
                      url = f"https://news.google.com/rss/search?q={kw}+when:1d&hl=en-US&gl=US&ceid=US:en"
                      sources.append({"url": url, "folder": folder, "sub_cat": sub_cat, "kw": kw})
                      
                      # 2. 전문 사이트 타겟 (Deep Dive) - 일부 키워드만
                      if "Quantum" in kw or "NIST" in kw or "CVE" in kw:
                          for site in SOURCES:
                              query = f"{site} {kw}"
                              url_deep = f"https://news.google.com/rss/search?q={query}+when:1d&hl=en-US&gl=US&ceid=US:en"
                              sources.append({"url": url_deep, "folder": folder, "sub_cat": sub_cat, "kw": kw})

              print(f"📡 Generated {len(sources)} Crypto-Security Queries.")
              
              ua = UserAgent()
              conn = aiohttp.TCPConnector(limit=120)
              items = []
              
              async with aiohttp.ClientSession(headers={'User-Agent': ua.random}, connector=conn) as session:
                  chunk_size = 50
                  for i in range(0, len(sources), chunk_size):
                      chunk = sources[i:i+chunk_size]
                      tasks = [fetch(session, s['url'], s['folder'], s['sub_cat'], s['kw']) for s in chunk]
                      
                      results = await asyncio.gather(*tasks)
                      for res in results: items.extend(res)
                      
                      if i % 100 == 0: print(f"⏳ Processed {i}/{len(sources)}...")
                      await asyncio.sleep(0.5)

              # 분류 및 저장
              grouped = {}
              all_flat = []
              for item in items:
                  f = "crypto" if "Key" in item['sub_cat'] else "general"
                  if f not in grouped: grouped[f] = []
                  grouped[f].append(item)
              
              for folder, data_list in grouped.items():
                  saved = secure_save(folder, data_list)
                  all_flat.extend(saved)
              
              generate_dashboard(all_flat)

          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          python security_core.py

      # ------------------------------------------------------------------
      # 🌿 Git 저장
      # ------------------------------------------------------------------
      - name: 🌿 Save to Git
        run: |
          git config --global user.name "Crypto Bot"
          git config --global user.email "bot@actions"
          git add DB_SEC/
          git commit -m "🔐 Crypto & Sec Update: $(date +'%Y-%m-%d')" || exit 0
          git push origin main

      # ------------------------------------------------------------------
      # 🐳 Docker 이미지 (백업용)
      # ------------------------------------------------------------------
      - name: 🔠 Docker Setup
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/security-news-data" >> $GITHUB_ENV

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Create Dockerfile
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          WORKDIR /app
          COPY . /app
          RUN echo "📊 Checking Security Data..." && ls -lh /app/DB_SEC/news/
          CMD ["python", "security_core.py"]
          EOF

      - name: 🚀 Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      # ------------------------------------------------------------------
      # 🖥️ 대시보드 출력
      # ------------------------------------------------------------------
      - name: 🖥️ Display Dashboard
        if: always()
        run: |
          if [ -f security_briefing.md ]; then
            cat security_briefing.md >> $GITHUB_STEP_SUMMARY
          fi
