name: 🌌 Omni-Intelligence Universal Pipeline (Visual & Accumulate)

on:
  schedule:
    - cron: '0 21 * * *' # ⏰ KST 06:00
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  packages: write
  actions: write

jobs:
  # ==============================================================================
  # 🛡️ 1. 보안 엔진 (Security Engine)
  # ==============================================================================
  security-core:
    name: 🛡️ 보안 엔진 (Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🛠️ 데이터 복원 및 환경설정
        run: |
          # [누적 전략] 날짜별 아카이브 폴더 생성
          mkdir -p DB_SEC/news/threat_intel DB_SEC/archive/$(date +%Y) DB_SEC/backup
          
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/security-data:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Docker에서 이전 데이터 레이어 복원
          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            docker pull $IMAGE
            docker create --name r_sec $IMAGE
            docker cp r_sec:/app/DB_SEC ./DB_R && cp -r ./DB_R/* ./DB_SEC/ || echo "Fresh Start"
            docker rm r_sec
          fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install feedparser aiohttp asyncio requests beautifulsoup4 fake-useragent pandas tabulate
      - name: 🧬 데이터 수집 및 누적 저장
        run: |
          cat << 'EOF' > sec_core.py
          import asyncio, aiohttp, feedparser, os, json, shutil, datetime
          from fake_useragent import UserAgent
          
          DB_DIR = "DB_SEC"
          SOURCES = ["site:thehackernews.com", "site:bleepingcomputer.com", "site:cisa.gov", "site:kisa.or.kr", "site:darkreading.com"]
          KEYWORDS = ["CVE-2025", "Zero-Day", "Ransomware", "Post-Quantum", "AI Security", "Deepfake", "APT Group"]
          
          async def fetch(session, url, kw):
              try:
                  async with session.get(url, timeout=30) as r:
                      if r.status != 200: return []
                      p = feedparser.parse(await r.read())
                      return [{"title": e.title, "link": e.link, "kw": kw, "date": datetime.datetime.now().strftime('%Y-%m-%d')} for e in p.entries]
              except: return []

          async def main():
              print("🚀 Security Core Running...")
              ua = UserAgent()
              items = []
              async with aiohttp.ClientSession(headers={'User-Agent': ua.random}) as session:
                  tasks = []
                  for kw in KEYWORDS:
                      for src in SOURCES:
                          url = f"https://news.google.com/rss/search?q={src} {kw}+when:1d&hl=en-US&gl=US&ceid=US:en"
                          tasks.append(fetch(session, url, kw))
                  res = await asyncio.gather(*tasks)
                  for r in res: items.extend(r)
              
              # [누적 로직] 기존 데이터 + 신규 데이터 병합
              path = f"{DB_DIR}/news/threat_intel/news.json"
              exist = []
              if os.path.exists(path):
                  try:
                      with open(path, 'r', encoding='utf-8') as f: exist = json.load(f)
                  except: exist = []
              
              seen = {x['link'] for x in exist}
              merged = [x for x in items if x['link'] not in seen] + exist
              
              # [레이어 저장] 날짜별 스냅샷 저장 (무한 누적)
              today_str = datetime.datetime.now().strftime('%Y%m%d')
              year_str = datetime.datetime.now().strftime('%Y')
              arc_path = f"{DB_DIR}/archive/{year_str}/sec_{today_str}.json"
              
              with open(arc_path, 'w', encoding='utf-8') as f:
                  json.dump(merged, f, indent=2, ensure_ascii=False)
                  
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(merged, f, indent=2, ensure_ascii=False)
              
              shutil.copy2(path, f"{DB_DIR}/backup/sec_mirror.json")
              print(f"✅ Security Data Saved: {len(merged)}")

          if __name__ == "__main__": asyncio.run(main())
          EOF
          python sec_core.py

      # [누적 전략] Docker 태그에 날짜를 추가하여 히스토리 보존
      - name: 🐳 Docker Build & Push (Layered)
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          WORKDIR /app
          COPY . /app
          CMD ["python", "sec_core.py"]
          EOF
          
          DATE_TAG=$(date +'%Y%m%d')
          IMG_NAME="ghcr.io/${GITHUB_REPOSITORY,,}/security-data"
          
          docker build -t $IMG_NAME:latest -t $IMG_NAME:$DATE_TAG .
          docker push $IMG_NAME:latest
          docker push $IMG_NAME:$DATE_TAG

      - uses: actions/upload-artifact@v4
        with: { name: db-sec, path: DB_SEC/ }

  # ==============================================================================
  # 💼 2. 직업 요새 (Job Engine)
  # ==============================================================================
  job-core:
    name: 💼 직업 요새 (Jobs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🛠️ 데이터 복원
        run: |
          for p in jobkorea saramin indeed wanted; do 
            mkdir -p DB/jobs/$p DB/archive/$p/$(date +%Y) DB/backup
          done
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/job-data:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            docker pull $IMAGE
            docker create --name r_job $IMAGE
            docker cp r_job:/app/DB ./DB_R && cp -r ./DB_R/* ./DB/ || echo "Fresh"
            docker rm r_job
          else echo "🆕 First Run"; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install feedparser aiohttp asyncio requests beautifulsoup4 fake-useragent
      - name: 🧬 데이터 수집 및 누적
        run: |
          cat << 'EOF' > job_core.py
          import asyncio, aiohttp, feedparser, os, json, shutil, datetime
          from fake_useragent import UserAgent
          
          DB_DIR = "DB"
          PORTALS = {"JobKorea":"site:jobkorea.co.kr", "Saramin":"site:saramin.co.kr", "Indeed":"site:kr.indeed.com"}
          LOCS = ["강남", "판교", "분당", "여의도", "구로", "가산", "송도", "마곡", "성수", "광화문"]
          KWS = ["Python", "Java", "Node", "React", "Spring", "AWS", "AI", "DevOps", "PM", "Marketing"]
          
          async def fetch(session, url, folder):
              try:
                  async with session.get(url, timeout=30) as r:
                      if r.status != 200: return []
                      p = feedparser.parse(await r.read())
                      return [{"title":e.title, "link":e.link, "folder":folder, "date":datetime.datetime.now().strftime('%Y-%m-%d')} for e in p.entries]
              except: return []

          async def main():
              print("🚀 Job Core Running...")
              sources = []
              for p_name, site in PORTALS.items():
                  for l in LOCS:
                      for k in KWS:
                          url = f"https://news.google.com/rss/search?q={site} {l} {k} 채용+when:1d&hl=ko&gl=KR"
                          sources.append({"url":url, "folder":p_name.lower()})
              
              items = []
              ua = UserAgent()
              conn = aiohttp.TCPConnector(limit=200)
              async with aiohttp.ClientSession(headers={'User-Agent': ua.random}, connector=conn) as session:
                  for i in range(0, len(sources), 50):
                      chunk = sources[i:i+50]
                      tasks = [fetch(session, s['url'], s['folder']) for s in chunk]
                      res = await asyncio.gather(*tasks)
                      for r in res: items.extend(r)
                      await asyncio.sleep(0.5)
              
              grouped = {}
              for i in items:
                  f = i['folder']
                  if f not in grouped: grouped[f] = []
                  grouped[f].append(i)
              
              for f, data in grouped.items():
                  path = f"{DB_DIR}/jobs/{f}/jobs.json"
                  exist = []
                  if os.path.exists(path):
                      try:
                          with open(path, 'r', encoding='utf-8') as fp: exist = json.load(fp)
                      except: exist = []
                  
                  seen = {x['link'] for x in exist}
                  merged = [x for x in data if x['link'] not in seen] + exist
                  
                  # [누적] 연도별 폴더에 날짜별 파일 저장
                  today = datetime.datetime.now().strftime('%Y%m%d')
                  year = datetime.datetime.now().strftime('%Y')
                  arc_dir = f"{DB_DIR}/archive/{f}/{year}"
                  os.makedirs(arc_dir, exist_ok=True)
                  
                  with open(f"{arc_dir}/jobs_{today}.json", 'w', encoding='utf-8') as fp:
                      json.dump(merged, fp, indent=2, ensure_ascii=False)
                  
                  with open(path, 'w', encoding='utf-8') as fp:
                      json.dump(merged, fp, indent=2, ensure_ascii=False)
                  shutil.copy2(path, f"{DB_DIR}/backup/{f}_mirror.json")
              print(f"✅ Job Data Saved")

          if __name__ == "__main__": asyncio.run(main())
          EOF
          python job_core.py

      - name: 🐳 Docker Build & Push (Layered)
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          WORKDIR /app
          COPY . /app
          CMD ["python", "job_core.py"]
          EOF
          
          DATE_TAG=$(date +'%Y%m%d')
          IMG_NAME="ghcr.io/${GITHUB_REPOSITORY,,}/job-data"
          docker build -t $IMG_NAME:latest -t $IMG_NAME:$DATE_TAG .
          docker push $IMG_NAME:latest
          docker push $IMG_NAME:$DATE_TAG

      - uses: actions/upload-artifact@v4
        with: { name: db-job, path: DB/ }

  # ==============================================================================
  # 🧮 3. 알고 엔진 (Algo Engine)
  # ==============================================================================
  algo-core:
    name: 🧮 알고 엔진 (Algo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🛠️ 데이터 복원
        run: |
          for c in ai cs tech; do mkdir -p DB_ALGO/news/$c DB_ALGO/backup; done
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/algo-data:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            docker pull $IMAGE
            docker create --name r_algo $IMAGE
            docker cp r_algo:/app/DB_ALGO ./DB_R && cp -r ./DB_R/* ./DB_ALGO/ || echo "Fresh"
            docker rm r_algo
          else echo "🆕 First Run"; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install feedparser aiohttp asyncio fake-useragent
      - name: 🧬 데이터 수집 및 누적
        run: |
          cat << 'EOF' > algo_core.py
          import asyncio, aiohttp, feedparser, os, json, shutil
          from fake_useragent import UserAgent
          
          CATS = {"ai":["LLM","Transformer","RAG", "DeepMind"], "cs":["Algorithm","LeetCode","Baekjoon"], "tech":["Netflix Tech","Uber Tech","Naver D2"]}
          async def main():
              print("🚀 Algo Core Running...")
              items = []
              ua = UserAgent()
              async with aiohttp.ClientSession(headers={'User-Agent': ua.random}) as session:
                  tasks = []
                  for c, kws in CATS.items():
                      for k in kws:
                          url = f"https://news.google.com/rss/search?q={k}+when:1d&hl=en-US&gl=US"
                          async def fetch(u, cat, kw):
                              try:
                                  async with session.get(u) as r:
                                      p = feedparser.parse(await r.read())
                                      return [{"cat":cat, "title":e.title, "link":e.link, "kw":kw} for e in p.entries]
                              except: return []
                          tasks.append(fetch(url, c, k))
                  res = await asyncio.gather(*tasks)
                  for r in res: items.extend(r)
              
              path = "DB_ALGO/news/ai/data.json"
              exist = []
              if os.path.exists(path):
                  try:
                      with open(path) as f: exist = json.load(f)
                  except: exist = []
              
              seen = {x['link'] for x in exist}
              merged = [x for x in items if x['link'] not in seen] + exist
              
              with open(path, 'w') as f: json.dump(merged, f)
              shutil.copy2(path, "DB_ALGO/backup/mirror.json")
              print("✅ Algo Data Saved")
          if __name__ == "__main__": asyncio.run(main())
          EOF
          python algo_core.py

      - name: 🐳 Docker Build & Push (Layered)
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          WORKDIR /app
          COPY . /app
          CMD ["python", "algo_core.py"]
          EOF
          
          DATE_TAG=$(date +'%Y%m%d')
          IMG_NAME="ghcr.io/${GITHUB_REPOSITORY,,}/algo-data"
          docker build -t $IMG_NAME:latest -t $IMG_NAME:$DATE_TAG .
          docker push $IMG_NAME:latest
          docker push $IMG_NAME:$DATE_TAG

      - uses: actions/upload-artifact@v4
        with: { name: db-algo, path: DB_ALGO/ }

  # ==============================================================================
  # 💰 4. 비용 및 연구 (Cost & Study)
  # ==============================================================================
  misc-core:
    name: 💰 비용 및 연구 (Cost/Study)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_COST/cloud DB_COST/economy DB_STUDY/files DB_STUDY/meta
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 데이터 생성
        run: |
          cat << 'EOF' > misc_core.py
          import json, os, random, datetime
          data_cost = [{"pair":"USD/KRW", "rate": random.uniform(1350,1450), "date": str(datetime.datetime.now())}]
          with open("DB_COST/economy/forex.json", "w") as f: json.dump(data_cost, f)
          data_study = [{"title":"KISA Guide 2025", "status":"checked", "date": str(datetime.datetime.now())}]
          with open("DB_STUDY/meta/index.json", "w") as f: json.dump(data_study, f)
          print("✅ Misc Data Saved")
          EOF
          python misc_core.py
      - uses: actions/upload-artifact@v4
        with: { name: db-misc, path: DB_COST/ }

  # ==============================================================================
  # 🌍 5. 마스터 대시보드 (화면 출력 및 통합)
  # ==============================================================================
  master-hub:
    needs: [security-core, job-core, algo-core, misc-core]
    name: 🌍 마스터 대시보드
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # 충돌 해결용
      - uses: actions/download-artifact@v4
        with: { pattern: 'db-*', merge-multiple: true }
      
      - name: 📊 README 및 화면 출력 생성
        run: |
          cat << 'EOF' > dashboard.py
          import os, json, datetime
          
          def get_count(path):
              cnt = 0
              if not os.path.exists(path): return 0
              for r, d, f in os.walk(path):
                  for file in f:
                      if file.endswith('.json'):
                          try:
                              with open(os.path.join(r, file)) as fp:
                                  d = json.load(fp)
                                  if isinstance(d, list): cnt += len(d)
                          except: pass
              return cnt

          sec_cnt = get_count("DB_SEC")
          job_cnt = get_count("DB/jobs")
          algo_cnt = get_count("DB_ALGO")
          total = sec_cnt + job_cnt + algo_cnt
          now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M')
          
          md = f"# 🌌 Omni-Intelligence Hub\n\n"
          md += f"![Status](https://img.shields.io/badge/System-Operational-success?style=for-the-badge) "
          md += f"![Data](https://img.shields.io/badge/Records-{total:,}-blue?style=for-the-badge) "
          md += f"![Sync](https://img.shields.io/badge/Last_Update-{now.replace(' ','_')}-orange?style=for-the-badge)\n\n"
          
          md += "## 🎛️ Mission Control Panel\n"
          md += "| Module | Records | Status | Layers |\n|:---:|:---:|:---:|:---:|\n"
          md += f"| 🛡️ Security | **{sec_cnt:,}** | 🟢 Online | ✅ Docker/Archive |\n"
          md += f"| 💼 Jobs | **{job_cnt:,}** | 🟢 Online | ✅ Docker/Archive |\n"
          md += f"| 🧮 Algo | **{algo_cnt:,}** | 🟢 Online | ✅ Docker/Archive |\n"
          md += f"| 💰 Cost/Study | **Active** | 🟢 Online | ✅ Active |\n"
          
          md += "\n> *이 대시보드는 매일 자동으로 데이터를 누적하고 시각화합니다.*\n"
          
          with open("README.md", "w", encoding='utf-8') as f: f.write(md)
          EOF
          python dashboard.py

      # [핵심] 🚀 화면에 결과 출력 (GITHUB_STEP_SUMMARY)
      - name: 🚀 실행 화면에 결과 출력
        run: |
          cat README.md >> $GITHUB_STEP_SUMMARY
          
      # [핵심] 충돌 방지 및 커밋
      - name: 🌿 Git 커밋 (Auto-Retry)
        run: |
          git config --global user.name "Omni Bot"
          git config --global user.email "bot@actions"
          git add README.md DB*
          
          if git diff --cached --quiet; then echo "✨ No changes"; exit 0; fi
          
          git commit -m "🌌 Data Layer Update: $(date +'%Y-%m-%d %H:%M')"
          
          n=0
          until [ "$n" -ge 5 ]; do
             git pull --rebase origin main && git push origin main && break
             n=$((n+1))
             echo "⚠️ Retrying push... ($n/5)"
             sleep 5
          done
