name: 🛡️ 2025 Security Intelligence (Hyper-Scale)

on:
  schedule:
    - cron: '0 22 * * *' # ⏰ KST 07:00 (매일 아침)
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write      # 💾 Git 저장
  issues: write        # 📝 이슈 작성
  packages: write      # 🐳 Docker 이미지
  actions: write       # ☁️ 아티팩트

jobs:
  security-2025-engine:
    name: 🕵️ 2025 Threat Hunter
    runs-on: ubuntu-latest
    steps:
      - name: 📥 소스 코드 체크아웃
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 🔄 [1단계] 데이터 이관 및 복원 (Data Migration)
      # 이전 Docker 이미지에서 2025년 누적 데이터를 불러옵니다.
      # ------------------------------------------------------------------
      - name: 🔄 Migrate 2025 Data
        run: |
          echo "📡 Connecting to 2025 Intelligence Grid..."
          IMAGE_URL="ghcr.io/${GITHUB_REPOSITORY,,}/security-2025-data:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          if docker manifest inspect $IMAGE_URL > /dev/null 2>&1; then
            echo "✅ Previous Data Found. Restoring..."
            docker pull $IMAGE_URL
            docker create --name restore_cnt $IMAGE_URL
            if docker cp restore_cnt:/app/DB_SEC ./DB_RESTORED; then
              mkdir -p DB_SEC
              cp -r ./DB_RESTORED/* ./DB_SEC/
              rm -rf ./DB_RESTORED
            fi
            docker rm restore_cnt
          else
            echo "🆕 2025 Intelligence System Initialized."
            mkdir -p DB_SEC
          fi

      # ------------------------------------------------------------------
      # 🛠️ 환경 구축 (3중 백업 구조)
      # ------------------------------------------------------------------
      - name: 🛠️ Setup Infrastructure
        run: |
          echo "📂 Initializing 2025 Data Structure..."
          # 2025년 핵심 분야별 폴더 생성
          for cat in ai_sec quantum_sec cloud_sec threat_intel compliance; do
            mkdir -p DB_SEC/news/$cat
            mkdir -p DB_SEC/archive/$cat
            mkdir -p DB_SEC/backup
          done
          
          cat <<EOF > requirements.txt
          feedparser
          aiohttp
          asyncio
          requests
          beautifulsoup4
          lxml
          fake-useragent
          pandas
          tabulate
          EOF

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 📦 Install Dependencies
        run: pip install -r requirements.txt

      # ------------------------------------------------------------------
      # 🔥 2025년형 보안 뉴스 하이퍼 코어 (Hyper Core 2025)
      # ------------------------------------------------------------------
      - name: 🧬 Generate 2025 Core
        run: |
          cat << 'EOF' > security_core.py
          import asyncio, aiohttp, feedparser, os, json, shutil, re, random
          from datetime import datetime
          from fake_useragent import UserAgent
          from collections import Counter

          # [설정]
          DB_DIR = "DB_SEC"
          NEWS_DIR = os.path.join(DB_DIR, "news")
          ARCHIVE_DIR = os.path.join(DB_DIR, "archive")
          BACKUP_DIR = os.path.join(DB_DIR, "backup")
          REPORT_FILE = "security_2025_briefing.md"
          
          # [전략 1] 2025년 핵심 보안 트렌드 키워드 (Massive Targeting)
          KEYWORDS_2025 = {
              "ai_sec": [
                  "LLM Vulnerability", "Prompt Injection", "AI Red Teaming", "Deepfake Security",
                  "ChatGPT Data Breach", "AI Governance", "Adversarial Machine Learning",
                  "GenAI Security 2025", "NIST AI RMF", "OWASP LLM Top 10"
              ],
              "quantum_sec": [
                  "Post-Quantum Cryptography", "PQC Migration", "NIST PQC Standards", 
                  "Kyber-ML-KEM", "Dilithium-ML-DSA", "Quantum Key Distribution (QKD)",
                  "Harvest Now Decrypt Later", "Quantum Resistance"
              ],
              "cloud_sec": [
                  "Cloud Native Security", "Kubernetes CVE", "Serverless Security", "AWS Security 2025",
                  "Azure Zero Day", "GCP IAM Misconfiguration", "CI/CD Pipeline Security",
                  "Zero Trust Architecture", "SASE 2025"
              ],
              "threat_intel": [
                  "Ransomware Gang 2025", "APT Group Trend", "Supply Chain Attack", "Zero-Day Exploit",
                  "CVE-2025", "Dark Web Leak", "State-Sponsored Hacker", "Lazarus Group",
                  "LockBit Variant", "Social Engineering 2025"
              ],
              "compliance": [
                  "EU AI Act", "SEC Cybersecurity Rule", "ISMS-P 2025", "GDPR Update",
                  "DORA Regulation", "Cyber Resilience Act", "KISA Security Guide"
              ]
          }
          
          # [전략 2] 타겟 소스 (글로벌 + 국내)
          SOURCES = [
              "site:thehackernews.com", "site:bleepingcomputer.com", "site:darkreading.com", 
              "site:krebsonsecurity.com", "site:cisa.gov", "site:nist.gov",
              "site:boannews.com", "site:dailysecu.com", "site:kisa.or.kr"
          ]

          # 분석기
          class SecurityAnalyzer:
              def __init__(self):
                  self.cve_pattern = re.compile(r'CVE-202[4-5]-\d+')
                  self.severity_keywords = ["Critical", "Zero-day", "Active Exploitation"]
              
              def analyze(self, text):
                  score = 0
                  cve = self.cve_pattern.search(text)
                  cve_id = cve.group(0) if cve else None
                  
                  if cve_id: score += 30
                  if any(k in text for k in self.severity_keywords): score += 20
                  if "2025" in text: score += 10
                  
                  return cve_id, score

          analyzer = SecurityAnalyzer()

          async def fetch(session, url, folder, category, keyword):
              try:
                  async with session.get(url, timeout=35) as r:
                      if r.status != 200: return []
                      p = feedparser.parse(await r.read())
                      results = []
                      for e in p.entries:
                          title = e.title.strip()
                          full_text = f"{title} {e.get('summary', '')}"
                          cve_id, score = analyzer.analyze(full_text)
                          
                          results.append({
                              "folder": folder,
                              "category": category,
                              "title": title, 
                              "link": e.link, 
                              "keyword": keyword,
                              "cve_id": cve_id,
                              "score": score,
                              "published": datetime.now().strftime('%Y-%m-%d')
                          })
                      return results
              except: return []

          def secure_save(folder_name, new_data):
              # 폴더 자동 생성 (안전장치)
              if not folder_name: folder_name = "threat_intel"
              
              active_path = os.path.join(NEWS_DIR, folder_name, "news.json")
              backup_path = os.path.join(BACKUP_DIR, f"{folder_name}_mirror.json")
              
              if not os.path.exists(os.path.dirname(active_path)):
                  os.makedirs(os.path.dirname(active_path))

              existing = []
              if os.path.exists(active_path):
                  try:
                      with open(active_path, 'r', encoding='utf-8') as f: existing = json.load(f)
                  except: existing = []
              
              ex_links = {x['link'] for x in existing}
              unique_new = [x for x in new_data if x['link'] not in ex_links]
              merged = unique_new + existing
              
              # 점수순 정렬 (중요도)
              merged.sort(key=lambda x: x.get('score', 0), reverse=True)
              
              # 아카이빙 (8888건 초과 시 스냅샷)
              if len(merged) > 8888:
                  snapshot = f"sec_{datetime.now().strftime('%Y%m%d_%H%M')}.json"
                  arc_path = os.path.join(ARCHIVE_DIR, folder_name, snapshot)
                  if not os.path.exists(os.path.dirname(arc_path)): os.makedirs(os.path.dirname(arc_path))
                  
                  with open(arc_path, 'w', encoding='utf-8') as f: json.dump(merged, f, indent=2, ensure_ascii=False)
                  merged = merged[:8888]

              with open(active_path, 'w', encoding='utf-8') as f: json.dump(merged, f, indent=2, ensure_ascii=False)
              shutil.copy2(active_path, backup_path)
              return merged

          def generate_dashboard(all_items, stats):
              total_cnt = len(all_items)
              now = datetime.now().strftime('%Y-%m-%d %H:%M')
              
              cve_list = [i['cve_id'] for i in all_items if i['cve_id']]
              cve_cnt = len(set(cve_list))
              
              md = f"# 🛡️ 2025 Security Intelligence Briefing\n\n"
              
              # Status Panel
              md += f"""
              <table>
                <tr>
                    <td align="center"><b>🖥️ System</b></td>
                    <td align="center"><b>💾 Total Data</b></td>
                    <td align="center"><b>🚨 Detected CVEs</b></td>
                    <td align="center"><b>🔄 Sync</b></td>
                </tr>
                <tr>
                    <td align="center">🟢 <b>Online</b></td>
                    <td align="center"><b>{total_cnt:,}</b></td>
                    <td align="center">🔥 <b>{cve_cnt}</b></td>
                    <td align="center">⚡ <b>{now}</b></td>
                </tr>
              </table>
              \n"""
              
              # Mermaid Pie Chart
              md += "### 📊 Threat Landscape (2025 Trends)\n"
              md += "```mermaid\npie title Security Category Share\n"
              for k, v in stats.items():
                  if v > 0: md += f'    "{k}" : {v}\n'
              md += "```\n"

              # Critical Alerts
              md += "\n### 🚨 Critical Alerts (Score 30+)\n"
              md += "| Category | CVE / Tag | Title |\n|:---:|:---:|:---|\n"
              
              critical_items = [i for i in all_items if i['score'] >= 30]
              for item in critical_items[:20]:
                  tag = f"`{item['cve_id']}`" if item['cve_id'] else "⚠️ **Critical**"
                  title = item['title'][:40].replace("|", "-")
                  md += f"| {item['folder']} | {tag} | [{title}]({item['link']}) |\n"

              # Detailed Keyword Analysis
              md += "\n### 📈 Top Trending Keywords\n"
              kws = [i['keyword'] for i in all_items]
              for k, c in Counter(kws).most_common(10):
                  bar = "█" * int((c/total_cnt)*50) if total_cnt > 0 else ""
                  md += f"- **{k}**: `{bar}` ({c})\n"

              with open(REPORT_FILE, 'w', encoding='utf-8') as f: f.write(md)

          async def main():
              print("🚀 2025 Security Engine Running...")
              
              sources = []
              # 쿼리 매트릭스 생성 (키워드 x 소스)
              for folder, kws in KEYWORDS_2025.items():
                  for kw in kws:
                      # 1. 일반 구글 뉴스 (최신순)
                      url = f"https://news.google.com/rss/search?q={kw}+when:1d&hl=en-US&gl=US&ceid=US:en"
                      sources.append({"url": url, "folder": folder, "category": folder, "kw": kw})
                      
                      # 2. 전문 사이트 타겟 (정확도) - 일부 핵심 키워드만
                      if "CVE" in kw or "AI" in kw or "Quantum" in kw:
                          for site in SOURCES:
                              query = f"{site} {kw}"
                              url_site = f"https://news.google.com/rss/search?q={query}+when:1d&hl=en-US&gl=US&ceid=US:en"
                              sources.append({"url": url_site, "folder": folder, "category": folder, "kw": kw})

              print(f"📡 Generated {len(sources)} Security Queries.")
              
              ua = UserAgent()
              conn = aiohttp.TCPConnector(limit=150)
              items = []
              
              async with aiohttp.ClientSession(headers={'User-Agent': ua.random}, connector=conn) as session:
                  chunk_size = 50
                  for i in range(0, len(sources), chunk_size):
                      chunk = sources[i:i+chunk_size]
                      tasks = [fetch(session, s['url'], s['folder'], s['category'], s['kw']) for s in chunk]
                      
                      results = await asyncio.gather(*tasks)
                      
                      # 폴더 정보 유지
                      for j, res in enumerate(results):
                          src = chunk[j]
                          for item in res:
                              item['folder'] = src['folder']
                              items.append(item)
                              
                      if i % 200 == 0: print(f"⏳ Processed {i}/{len(sources)}...")
                      await asyncio.sleep(0.5)

              # 저장 및 통계
              all_items_flat = []
              stats = {}
              
              grouped = {}
              for item in items:
                  f = item.get('folder', 'threat_intel')
                  if f not in grouped: grouped[f] = []
                  grouped[f].append(item)
              
              for folder, data_list in grouped.items():
                  saved = secure_save(folder, data_list)
                  stats[folder] = len(saved)
                  all_items_flat.extend(saved)
              
              generate_dashboard(all_items_flat, stats)

          if __name__ == "__main__":
              asyncio.run(main())
          EOF
          python security_core.py

      # ------------------------------------------------------------------
      # ☁️ [복제 1] 아티팩트 업로드 (외부 백업)
      # ------------------------------------------------------------------
      - name: ☁️ Upload 2025 Intelligence
        uses: actions/upload-artifact@v4
        with:
          name: security-2025-full-${{ github.run_id }}
          path: DB_SEC/
          retention-days: 90

      # ------------------------------------------------------------------
      # 🌿 [복제 2] Git 저장
      # ------------------------------------------------------------------
      - name: 🌿 Save to Git
        run: |
          git config --global user.name "Security Bot"
          git config --global user.email "bot@actions"
          git add DB_SEC/ requirements.txt
          git commit -m "🛡️ 2025 Intel Update: $(date +'%Y-%m-%d')" || exit 0
          git push origin main

      # ------------------------------------------------------------------
      # 🐳 [복제 3] Docker 이미지 (불변 저장소)
      # ------------------------------------------------------------------
      - name: 🔠 Docker Setup
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/security-2025-data" >> $GITHUB_ENV

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Create Dockerfile
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          WORKDIR /app
          COPY . /app
          RUN echo "📊 Checking 2025 Data..." && ls -lh /app/DB_SEC/news/
          CMD ["python", "security_core.py"]
          EOF

      - name: 🚀 Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      # ------------------------------------------------------------------
      # 🖥️ 대시보드 출력
      # ------------------------------------------------------------------
      - name: 🖥️ Display Dashboard
        if: always()
        run: |
          if [ -f security_2025_briefing.md ]; then
            cat security_2025_briefing.md >> $GITHUB_STEP_SUMMARY
          fi
