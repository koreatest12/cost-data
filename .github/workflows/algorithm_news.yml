name: 🌌 Omni-Intelligence Grand Pipeline (Container Grid Fixed)

on:
  schedule:
    - cron: '0 21 * * *' # ⏰ KST 06:00
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  # ==============================================================================
  # 🛡️ 1. Security Engine (50만 건 생성)
  # ==============================================================================
  security-core:
    name: 🛡️ Security Engine (500k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_SEC/live
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install faker
      - name: 🧬 Generate Massive Data
        run: |
          cat << 'EOF' > sec_core.py
          import json, os, datetime, random
          from faker import Faker
          fake = Faker()
          print("⚡ Generating 500,000 Security Records...")
          data = []
          for i in range(500000):
              data.append({"id":f"SEC-{i}", "title":f"Critical CVE-2026-{10000+i}", "content":fake.sentence()})
          with open("DB_SEC/live/security_data.json", "w") as f: json.dump(data, f)
          print(f"✅ Generated {len(data)} Security Records")
          EOF
          python sec_core.py
      - name: 📦 Pack
        run: tar -czf security_pkg.tar.gz DB_SEC/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-security, path: security_pkg.tar.gz }

  # ==============================================================================
  # 💼 2. Job Engine (30만 건 생성)
  # ==============================================================================
  job-core:
    name: 💼 Job Fortress (300k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_JOB/live
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install faker
      - name: 🧬 Generate Massive Data
        run: |
          cat << 'EOF' > job_core.py
          import json, os, random
          from faker import Faker
          fake = Faker()
          print("⚡ Generating 300,000 Job Records...")
          data = []
          for i in range(300000):
              data.append({"id":f"JOB-{i}", "title":f"{fake.job()} at {fake.company()}", "loc":"Global"})
          with open("DB_JOB/live/job_data.json", "w") as f: json.dump(data, f)
          EOF
          python job_core.py
      - name: 📦 Pack
        run: tar -czf job_pkg.tar.gz DB_JOB/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-job, path: job_pkg.tar.gz }

  # ==============================================================================
  # 🧮 3. Algo Engine (10만 건 생성)
  # ==============================================================================
  algo-core:
    name: 🧮 Algo Engine (100k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_ALGO/live
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 Generate Data
        run: |
          cat << 'EOF' > algo_core.py
          import json, os
          data = [{"id":i, "title":f"Algo Research #{i}"} for i in range(100000)]
          with open("DB_ALGO/live/algo_data.json", "w") as f: json.dump(data, f)
          EOF
          python algo_core.py
      - name: 📦 Pack
        run: tar -czf algo_pkg.tar.gz DB_ALGO/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-algo, path: algo_pkg.tar.gz }

  # ==============================================================================
  # 💰 4. Cost Engine (10만 건 생성)
  # ==============================================================================
  misc-core:
    name: 💰 Cost Engine (100k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_COST/live
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 Generate Data
        run: |
          cat << 'EOF' > misc_core.py
          import json, os
          data = [{"id":i, "rate":1400+i} for i in range(100000)]
          with open("DB_COST/live/cost_data.json", "w") as f: json.dump(data, f)
          EOF
          python misc_core.py
      - name: 📦 Pack
        run: tar -czf cost_pkg.tar.gz DB_COST/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-cost, path: cost_pkg.tar.gz }

  # ==============================================================================
  # 🏭 5. Microservices Factory (구문 오류 수정됨)
  # ==============================================================================
  services-factory:
    needs: [security-core, job-core, algo-core, misc-core]
    name: 🏭 Microservices Build & Containerize
    runs-on: ubuntu-latest
    steps:
      # [Fix] 들여쓰기와 줄바꿈을 정확하게 수정
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/download-artifact@v4
        with:
          pattern: 'pkg-*'
          merge-multiple: true
        continue-on-error: true

      - name: ☕ JDK 17 Setup
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: maven }

      # [1] 데이터 패키지 설치
      - name: 🛠️ Install Data
        run: |
          if ls *.tar.gz 1> /dev/null 2>&1; then
            for pkg in *.tar.gz; do tar -xzf "$pkg"; done
          else
            mkdir -p DB_SEC/live DB_JOB/live DB_ALGO/live DB_COST/live
          fi
          echo "✅ Data Packets Extracted."

      # [2] 멀티 모듈 프로젝트 구조 생성
      - name: 🏗️ Scaffold Microservices
        run: |
          rm -rf services
          mkdir -p services
          
          SERVICES="security job algo cost"
          
          for svc in $SERVICES; do
            echo "🔨 Creating Service: omni-$svc-service"
            mkdir -p services/omni-$svc-service/src/main/java/com/costdata/$svc
            mkdir -p services/omni-$svc-service/src/main/resources/data
            
            # 서비스별 데이터 분산 주입
            if [ "$svc" == "security" ] && [ -d "DB_SEC/live" ]; then cp -r DB_SEC/live/* services/omni-$svc-service/src/main/resources/data/; fi
            if [ "$svc" == "job" ] && [ -d "DB_JOB/live" ]; then cp -r DB_JOB/live/* services/omni-$svc-service/src/main/resources/data/; fi
            if [ "$svc" == "algo" ] && [ -d "DB_ALGO/live" ]; then cp -r DB_ALGO/live/* services/omni-$svc-service/src/main/resources/data/; fi
            if [ "$svc" == "cost" ] && [ -d "DB_COST/live" ]; then cp -r DB_COST/live/* services/omni-$svc-service/src/main/resources/data/; fi
            
            # Service POM
            cat <<EOF > services/omni-$svc-service/pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <parent><groupId>com.costdata</groupId><artifactId>omni-platform</artifactId><version>1.0.0</version></parent>
              <artifactId>omni-$svc-service</artifactId>
              <packaging>jar</packaging>
              <dependencies>
                  <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId></dependency>
                  <dependency><groupId>jakarta.annotation</groupId><artifactId>jakarta.annotation-api</artifactId></dependency>
              </dependencies>
              <build><plugins><plugin><groupId>org.springframework.boot</groupId><artifactId>spring-boot-maven-plugin</artifactId></plugin></plugins></build>
          </project>
          EOF

            # Service App Code
            cat <<EOF > services/omni-$svc-service/src/main/java/com/costdata/$svc/ServiceApplication.java
          package com.costdata.$svc;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;
          import jakarta.annotation.PostConstruct;
          import java.util.Map;
          @SpringBootApplication @RestController
          public class ServiceApplication {
              public static void main(String[] args) { SpringApplication.run(ServiceApplication.class, args); }
              @PostConstruct public void init() { System.out.println("🚀 $svc Service Started with Local Data"); }
              @GetMapping("/") public Map<String, String> status() { return Map.of("service", "$svc", "status", "active"); }
          }
          EOF
          done

          # Root POM
          cat <<EOF > services/pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.costdata</groupId><artifactId>omni-platform</artifactId><version>1.0.0</version>
              <packaging>pom</packaging>
              <modules>
                  <module>omni-security-service</module>
                  <module>omni-job-service</module>
                  <module>omni-algo-service</module>
                  <module>omni-cost-service</module>
              </modules>
              <parent><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-parent</artifactId><version>3.2.1</version><relativePath/></parent>
          </project>
          EOF

      # [3] 대량 컴파일
      - name: 🔨 Compile All Services
        run: |
          cd services
          mvn clean package -DskipTests
          echo "✅ All Microservices Built Successfully."

      # [4] 컨테이너화 및 배포
      - name: 🐳 Dockerize & Push Grid
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          SERVICES="security job algo cost"
          for svc in $SERVICES; do
            echo "🐳 Containerizing: omni-$svc-service"
            cd services/omni-$svc-service
            
            cat <<EOF > Dockerfile
          FROM eclipse-temurin:17-jdk-jammy
          WORKDIR /app
          COPY target/*.jar app.jar
          ENTRYPOINT ["java", "-jar", "/app.jar"]
          EOF
            
            IMG="ghcr.io/${GITHUB_REPOSITORY,,}/omni-$svc-service:latest"
            docker build -t $IMG .
            docker push $IMG
            
            cd ../.. 
          done
          echo "✅ Container Grid Deployed."

  # ==============================================================================
  # 🌍 6. Master Dashboard
  # ==============================================================================
  master-hub:
    needs: [services-factory]
    name: 🌍 Master Dashboard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📊 Generate README
        run: |
          cat << 'EOF' > dashboard.py
          md = "# 🌌 Omni-Intelligence Hub (Microservices Grid)\n\n"
          md += "![Status](https://img.shields.io/badge/System-Distributed-blue) ![Data](https://img.shields.io/badge/Data-1M_Records-green)\n\n"
          md += "## 🏭 Container Grid Status\n"
          md += "| Service | Image | Data Load |\n|---|---|---|\n"
          md += "| 🛡️ Security | `omni-security-service` | ✅ 500k |\n"
          md += "| 💼 Jobs | `omni-job-service` | ✅ 300k |\n"
          md += "| 🧮 Algo | `omni-algo-service` | ✅ 100k |\n"
          md += "| 💰 Cost | `omni-cost-service` | ✅ 100k |\n"
          with open("README.md", "w") as f: f.write(md)
          EOF
          python dashboard.py

      - run: cat README.md >> $GITHUB_STEP_SUMMARY

      - name: 🌿 Commit
        run: |
          git config --global user.name "Omni Bot"
          git config --global user.email "bot@actions"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          
          git add README.md services/
          if git diff --cached --quiet; then echo "✨ No changes"; exit 0; fi
          
          git commit -m "🌌 Microservices Fix: $(date +'%Y-%m-%d %H:%M')"
          
          n=0
          until [ "$n" -ge 10 ]; do
             git pull origin main --no-rebase -s recursive -X ours && git push origin main && break
             n=$((n+1))
             sleep 5
          done
