name: Ultimate CI & API Server & Dashboard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-verify-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Python Dependencies
        run: pip install requests

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # [핵심] Python 스크립트가 Spring Boot MVC 파일(Controller, Service, DTO)을 대량 생성
      - name: Run Ultimate Setup Script (Generate MVC Architecture)
        id: setup
        run: |
          if [ -f setup_ultimate_system.py ]; then
            echo "🚀 setup_ultimate_system.py 실행: MVC 구조 및 API 서버 코드 생성 중..."
            python setup_ultimate_system.py
          else
            echo "❌ 스크립트가 없습니다."
            exit 1
          fi

      # Maven 빌드 (API 서버 컴파일)
      - name: Build Spring Boot App
        run: |
          cd services/omni-pokemon-web
          mvn clean package -DskipTests

      # API 서버 실행 및 테스트
      - name: 🌐 API Server Smoke Test
        id: smoke_test
        run: |
          echo "🔥 API 서버 백그라운드 실행..."
          nohup java -jar ./services/omni-pokemon-web/target/*.jar > api.log 2>&1 &
          PID=$!
          
          echo "⏳ 서버 부팅 대기 (25초)..."
          sleep 25
          
          echo "🧪 1. 메인 페이지 접속 테스트"
          HTTP_CODE_WEB=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8086/index.html)
          
          echo "🧪 2. REST API (한국어 검색) 테스트"
          # '피카츄'로 검색 테스트 (URL 인코딩 필요할 수 있으나 curl이 처리)
          API_RES=$(curl -s "http://localhost:8086/api/pokemon/search?keyword=피카츄")
          echo "API Response: $API_RES"
          
          if [ "$HTTP_CODE_WEB" -eq 200 ] && [[ "$API_RES" == *"피카츄"* ]]; then
            echo "✅ 모든 테스트 통과 (Web + API)"
            echo "TEST_RESULT=SUCCESS" >> $GITHUB_ENV
          else
            echo "❌ 테스트 실패"
            echo "TEST_RESULT=FAILURE" >> $GITHUB_ENV
            cat api.log
            kill $PID
            exit 1
          fi
          kill $PID

      - name: 📊 Generate Summary
        if: always()
        run: |
          echo "# 🚀 Omni API Server Report" >> $GITHUB_STEP_SUMMARY
          echo "### 📡 API Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Base URL:** \`/api/pokemon\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Search Feature:** 🇰🇷 Korean Supported" >> $GITHUB_STEP_SUMMARY
          echo "- **IV Analysis:** ✅ Active" >> $GITHUB_STEP_SUMMARY
          
          if [ "$TEST_RESULT" == "SUCCESS" ]; then
             echo "✅ **System Healthy**" >> $GITHUB_STEP_SUMMARY
          else
             echo "❌ **System Error**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-api-server-jar
          path: services/**/*.jar
