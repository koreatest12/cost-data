name: 🌌 Ultimate Integrated Infrastructure Pipeline
on: [push, workflow_dispatch]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 🛠️ 1. Infrastructure Auto-Patch (Python)
        run: |
          # 파이썬 스크립트 실행으로 pom.xml 및 소스코드 에러 즉시 해결
          python setup_ultimate_system.py

      - name: ☕ 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 📦 3. Massive Compile (Maven)
        run: |
          # 파이썬이 수정한 pom.xml 기반으로 빌드 수행
          mvn clean package -DskipTests

      - name: 🌐 4. Infrastructure Smoke Test
        run: |
          JAR=$(find . -name "*.jar" | grep -v "original" | head -n 1)
          nohup java -Xmx2048m -jar $JAR > server.log 2>&1 &
          PID=$!
          
          echo "⏳ 서버 안정화 대기 (40초)..."
          sleep 40
          
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/system/health || echo "FAIL")
          
          if [ "$CODE" == "200" ]; then
            echo "✅ 인프라 가동 성공!"
            kill $PID
          else
            echo "❌ 가동 실패. 로그 분석 필요:"
            cat server.log
            kill $PID
            exit 1
          fi

      - name: 📤 5. Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: infra-bundle-v${{ github.run_number }}
          path: "**/target/*.jar"
