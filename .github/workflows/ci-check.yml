name: Ultimate CI & Smoke Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-verify-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 소스 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 환경 설정 (Python & Java)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. [구축] 시스템 자동 설치 스크립트 실행 (대량 생성 & 빌드)
      - name: Run Ultimate Setup Script
        run: |
          if [ -f setup_ultimate_system.py ]; then
            echo "🚀 setup_ultimate_system.py 실행 중..."
            python setup_ultimate_system.py
          else
            echo "❌ 스크립트가 없습니다. setup_ultimate_system.py를 확인하세요."
            exit 1
          fi

      # 4. [검증] 대량 생성된 리소스 확인
      - name: Verify Generated Resources
        run: |
          echo "✅ [Check 1] Docker Compose:"
          ls -l docker-compose.yml
          
          echo "✅ [Check 2] Dependabot Config:"
          ls -l .github/dependabot.yml
          
          echo "✅ [Check 3] Build Artifacts (JARs):"
          count=$(find ./services -name "*.jar" | wc -l)
          if [ "$count" -lt 7 ]; then
            echo "❌ 빌드된 JAR 파일이 부족합니다. (Found: $count)"
            exit 1
          fi
          echo "Found $count JAR files."

      # 5. [테스트] 홈페이지 서버 접속 테스트 (Smoke Test)
      #    실제 웹 서버를 백그라운드에서 실행하고 curl로 접속을 시도합니다.
      - name: 🌐 Homepage Access Test (Smoke Test)
        run: |
          echo "🔥 포켓몬 웹 서버(omni-pokemon-web) 실행 중..."
          # 백그라운드 실행 (&)
          nohup java -jar ./services/omni-pokemon-web/target/omni-pokemon-web-1.0.0.jar > web.log 2>&1 &
          PID=$!
          
          echo "⏳ 서버 부팅 대기 (15초)..."
          sleep 15
          
          echo "📡 홈페이지 접속 시도 (curl localhost:8086)..."
          # -f: 오류 시 Fail 처리, -s: silent
          if curl -f -s http://localhost:8086/index.html > /dev/null; then
            echo "✅ [Success] 홈페이지 접속 성공! (HTTP 200 OK)"
          else
            echo "❌ [Fail] 홈페이지 접속 실패. 로그 확인:"
            cat web.log
            kill $PID
            exit 1
          fi
          
          # 프로세스 종료
          kill $PID
