name: Ultimate CI/CD (Resource File Fix)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Python 환경 (비동기 처리)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Python Libs
        run: pip install requests aiohttp asyncio

      # 2. Java 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. [핵심] 소스 생성 및 JSON 파일 분리 저장
      - name: 🚀 Run Setup (Externalize Data)
        id: setup
        run: |
          if [ -f setup_ultimate_system.py ]; then
            echo "⚡ setup_ultimate_system.py 실행: 데이터 파일(json) 분리 및 소스 생성..."
            python setup_ultimate_system.py
          else
            echo "❌ 스크립트가 없습니다."
            exit 1
          fi

      # 4. 빌드 (데이터 파일이 resources에 포함됨)
      - name: Build with Maven
        run: |
          cd services/omni-pokemon-web
          mvn clean package -DskipTests

      # 5. 서버 테스트 (인코딩 + 데이터 로드 확인)
      - name: 🌐 Server Smoke Test
        run: |
          echo "🔥 서버 시작..."
          nohup java -jar ./services/omni-pokemon-web/target/*.jar > app.log 2>&1 &
          PID=$!
          
          echo "⏳ 부팅 대기 (20초)..."
          sleep 20
          
          echo "🧪 1. Health Check"
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8086/api/system/health)
          
          echo "🧪 2. 대량 데이터 검색 (피카츄 - URL 인코딩)"
          SEARCH_RES=$(curl -s -G --data-urlencode "keyword=피카츄" http://localhost:8086/api/pokemon/search)
          
          echo "Health: $HEALTH"
          echo "Search Result Length: ${#SEARCH_RES}"
          
          if [ "$HEALTH" -eq 200 ] && [[ "$SEARCH_RES" == *"피카츄"* ]]; then
            echo "✅ 테스트 성공! (대량 데이터 로드 및 인코딩 정상)"
          else
            echo "❌ 실패 로그 확인"
            cat app.log
            kill $PID
            exit 1
          fi
          kill $PID

      # 6. 아티팩트 업로드
      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-server-fixed
          path: services/**/*.jar
