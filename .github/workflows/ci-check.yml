name: Fixed Master Infra Patch

on:
  push:
    branches: [ "main" ]

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Secrets 설정 오류를 사전에 체크합니다.
      - name: Check DB Secrets
        run: |
          if [ -z "${{ secrets.DB_HOST }}" ]; then
            echo "❌ ERROR: DB_HOST is not set in GitHub Secrets!"
            exit 1
          fi

      - name: Run SQL Patch
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          # 변수를 명확히 할당하여 에러를 방지합니다.
          psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -f ./scripts/patch_all.sql

      - name: Maven Build (File Sync)
        run: mvn clean package -DskipTests
