name: CI & Dependabot Check & Mass Build

# 1. Dependabot이 PR을 올리거나, 코드가 푸시될 때 실행
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Python 설정 (스크립트 실행용)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. Java 설정 (Maven 빌드용 - JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 4. 모델 정의 파일(models.json)이 없으면 더미 파일 생성 (에러 방지용)
      - name: Create dummy models.json if missing
        run: |
          if [ ! -f models.json ]; then
            echo '{}' > models.json
          fi

      # 5. [핵심 변경] 시스템 통합 설치 스크립트 실행 (setup_system_final.py)
      #    이 단계에서 파일 생성, 구버전 청소, Main Class 충돌 해결, Maven 빌드가 일괄 수행됩니다.
      - name: Run Final System Setup & Mass Build
        run: |
          if [ -f setup_system_final.py ]; then
            echo "🚀 setup_system_final.py 실행 중..."
            python setup_system_final.py
          else
            echo "❌ setup_system_final.py 파일이 없습니다. 리포지토리에 파일을 커밋해주세요."
            exit 1
          fi

      # 6. 결과 검증 (대량 추가된 리소스 확인)
      #    실제로 Docker Compose 파일과 JAR 파일들이 생성되었는지 확인합니다.
      - name: Verify Generated Resources
        run: |
          echo "✅ Docker Compose 생성 확인:"
          ls -l docker-compose.yml
          
          echo "✅ 빌드된 JAR 파일 확인 (7개 서비스):"
          find ./services -name "*.jar"
          
          echo "✅ 포켓몬 웹 소스 생성 확인:"
          ls -l services/omni-pokemon-web/src/main/resources/static/index.html
