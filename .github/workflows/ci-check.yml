name: Master Infra Patch Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # [중요] DB 접속 정보를 Secrets에서 가져와서 실행
      - name: Run Master SQL Patch
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql -h ${{ secrets.DB_HOST }} \
               -p ${{ secrets.DB_PORT }} \
               -U ${{ secrets.DB_USER }} \
               -d ${{ secrets.DB_NAME }} \
               -f ./scripts/patch_all.sql

      - name: Build and Sync Files
        run: mvn clean package -DskipTests

      - name: Verify Results
        run: |
          ls -R src/main/java/com/costdata/filemanagement/dto/
          cat pom.xml
