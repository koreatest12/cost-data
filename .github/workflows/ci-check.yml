name: Ultimate CI/CD (Resource File Fix)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Python Libs
        run: pip install requests aiohttp asyncio

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 디렉토리 구조 확인 (디버깅용)
      - name: Check Directory Structure
        run: ls -R

      - name: 🚀 Run Setup (Externalize Data)
        id: setup
        run: |
          if [ -f setup_ultimate_system.py ]; then
            python setup_ultimate_system.py
          else
            echo "⚠️ setup_ultimate_system.py missing, creating dummy directory for build"
            mkdir -p services/omni-pokemon-web/src/main/resources
          fi

      - name: Build with Maven
        run: |
          # 디렉토리가 있으면 이동하고, 없으면 루트에서 빌드 시도
          if [ -d "services/omni-pokemon-web" ]; then
            cd services/omni-pokemon-web
            mvn clean package -DskipTests
          else
            echo "⚠️ Target directory not found. Running maven at root."
            mvn clean package -DskipTests
          fi

      - name: 🌐 Server Smoke Test
        run: |
          # JAR 파일 위치 유연하게 탐색
          JAR_PATH=$(find . -name "*.jar" | grep -v "original" | head -n 1)
          echo "🔥 Found JAR: $JAR_PATH"
          
          nohup java -jar $JAR_PATH > app.log 2>&1 &
          PID=$!
          
          echo "⏳ 부팅 대기 (25초)..."
          sleep 25
          
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8086/api/system/health || echo "404")
          SEARCH_RES=$(curl -s -G --data-urlencode "keyword=피카츄" http://localhost:8086/api/pokemon/search || echo "ERROR")
          
          if [ "$HEALTH" -eq 200 ]; then
            echo "✅ 테스트 성공!"
          else
            echo "❌ 실패 로그 확인"
            cat app.log
            kill $PID
            exit 1
          fi
          kill $PID

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-server-fixed
          path: "**/target/*.jar"
