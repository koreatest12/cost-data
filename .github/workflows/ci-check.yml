name: Ultimate CI & Smoke Test & Dashboard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-verify-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      # 1. 소스 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 환경 설정 (Python & Java)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. [구축] 시스템 자동 설치 스크립트 실행
      - name: Run Ultimate Setup Script
        id: setup
        run: |
          if [ -f setup_ultimate_system.py ]; then
            echo "🚀 setup_ultimate_system.py 실행 중..."
            python setup_ultimate_system.py
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ 스크립트가 없습니다."
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

      # 4. [검증] 리소스 확인
      - name: Verify Generated Resources
        run: |
          echo "🔍 Resource Verification..."
          JAR_COUNT=$(find ./services -name "*.jar" | wc -l)
          echo "Found $JAR_COUNT JAR files."
          if [ "$JAR_COUNT" -lt 7 ]; then
            echo "❌ JAR 파일 빌드 실패 (개수 부족)"
            exit 1
          fi

      # 5. [핵심 수정] 홈페이지 서버 접속 테스트 (Retry Logic 추가)
      #    단순 대기가 아니라, 서버가 응답할 때까지 최대 60초간 반복 확인합니다.
      - name: 🌐 Homepage Access Test (Smart Wait)
        id: smoke_test
        run: |
          echo "🔥 포켓몬 웹 서버(omni-pokemon-web) 백그라운드 실행..."
          # 로그를 web.log에 기록하며 백그라운드 실행
          nohup java -jar ./services/omni-pokemon-web/target/omni-pokemon-web-1.0.0.jar > web.log 2>&1 &
          PID=$!
          echo "SERVER_PID=$PID" >> $GITHUB_ENV
          
          echo "⏳ 서버 부팅 대기 중 (최대 60초)..."
          
          # [Retry Logic] 2초 간격으로 30번(총 60초) 접속 시도
          MAX_RETRIES=30
          COUNT=0
          SUCCESS=false
          
          for i in $(seq 1 $MAX_RETRIES); do
            # HTTP 200 코드가 오는지 확인
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8086/index.html || echo "000")
            
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ [$i/$MAX_RETRIES] 접속 성공! 서버가 정상 작동 중입니다."
              SUCCESS=true
              break
            else
              echo "zzz [$i/$MAX_RETRIES] 서버 응답 대기 중... (Status: $HTTP_CODE)"
              sleep 2
            fi
          done
          
          if [ "$SUCCESS" = true ]; then
            echo "TEST_RESULT=SUCCESS" >> $GITHUB_ENV
          else
            echo "❌ [Timeout] 60초 동안 서버가 응답하지 않았습니다."
            echo "TEST_RESULT=FAILURE" >> $GITHUB_ENV
            
            echo "::group::📄 Server Logs (web.log)"
            cat web.log
            echo "::endgroup::"
            
            kill $PID
            exit 1
          fi
          
          # 테스트 후 프로세스 종료
          kill $PID

      # 6. [화면 표시] GitHub Actions Summary (대시보드 링크 추가)
      - name: 📊 Generate GitHub Summary
        if: always()
        run: |
          echo "# 🚀 Omni System Build Report" >> $GITHUB_STEP_SUMMARY
          echo "### 🛠️ Service Status" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | Port |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          
          if [ "$TEST_RESULT" == "SUCCESS" ]; then
            STATUS="🟢 Online"
          else
            STATUS="🔴 Offline"
          fi
          
          echo "| **Pokemon Web** | $STATUS | 8086 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cost Core** | 🟢 Build OK | 8082 |" >> $GITHUB_STEP_SUMMARY
          echo "| **AI Model** | 🟢 Build OK | 5000 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🌐 How to Access" >> $GITHUB_STEP_SUMMARY
          echo "아래 **Artifacts**에서 \`pokemon-dashboard-html\`을 다운로드하여 브라우저로 여세요." >> $GITHUB_STEP_SUMMARY

      # 7. [파일 제공] 홈페이지 및 빌드 결과물 업로드
      - name: 📤 Upload Dashboard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-dashboard-html
          path: services/omni-pokemon-web/src/main/resources/static/index.html
          retention-days: 5
