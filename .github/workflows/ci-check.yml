name: Ultimate CI/CD & Fix Encoding

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Python 환경 (비동기 처리용)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Python Libs
        run: pip install requests aiohttp asyncio

      # 2. Java 17 설정 (Maven 캐싱)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. [핵심] 소스 코드 생성 (수정된 Python 스크립트 실행)
      - name: 🚀 Generate Source & Fetch Massive Data
        id: setup
        run: |
          if [ -f setup_ultimate_system.py ]; then
            echo "⚡ setup_ultimate_system.py 실행: 소스 생성 및 대량 데이터 수집..."
            python setup_ultimate_system.py
          else
            echo "❌ 스크립트가 없습니다."
            exit 1
          fi

      # 4. 빌드
      - name: Build with Maven
        run: |
          cd services/omni-pokemon-web
          mvn clean package -DskipTests

      # 5. 서버 실행 및 인코딩 테스트 (수정됨)
      - name: 🌐 Server Smoke Test (Encoding Fix)
        run: |
          echo "🔥 서버 시작..."
          nohup java -jar ./services/omni-pokemon-web/target/*.jar > app.log 2>&1 &
          PID=$!
          
          echo "⏳ 부팅 대기 (25초)..."
          sleep 25
          
          echo "🧪 1. Health Check (시스템 상태)"
          HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8086/api/system/health)
          echo "Health Status: $HEALTH_CODE"

          echo "🧪 2. 한국어 검색 테스트 ('피카츄' -> URL 인코딩 전송)"
          # 중요: -G --data-urlencode 옵션 사용
          SEARCH_RES=$(curl -s -G --data-urlencode "keyword=피카츄" http://localhost:8086/api/pokemon/search)
          
          echo "🔍 검색 결과 일부: ${SEARCH_RES:0:100}..."
          
          if [ "$HEALTH_CODE" -eq 200 ] && [[ "$SEARCH_RES" == *"피카츄"* ]]; then
            echo "✅ 테스트 성공! (한국어 처리가 완벽합니다)"
          else
            echo "❌ 테스트 실패"
            echo "=== SERVER LOGS ==="
            cat app.log
            kill $PID
            exit 1
          fi
          kill $PID

      # 6. 결과물 업로드
      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-pokemon-server
          path: services/**/*.jar
