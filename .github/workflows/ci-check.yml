name: Ultimate CI & Smoke Test & Dashboard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-verify-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write  # 테스트 리포트 권한

    steps:
      # 1. 소스 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 환경 설정 (Python & Java)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. [구축] 시스템 자동 설치 스크립트 실행
      - name: Run Ultimate Setup Script
        id: setup
        run: |
          if [ -f setup_ultimate_system.py ]; then
            echo "🚀 setup_ultimate_system.py 실행 중..."
            python setup_ultimate_system.py
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ 스크립트가 없습니다."
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

      # 4. [검증] 리소스 확인 및 GitHub 요약(Summary) 작성 준비
      - name: Verify & Report Resources
        id: verify
        run: |
          echo "🔍 Resource Verification Started..."
          
          # JAR 파일 개수 확인
          JAR_COUNT=$(find ./services -name "*.jar" | wc -l)
          echo "JAR_COUNT=$JAR_COUNT" >> $GITHUB_ENV
          
          # 포켓몬 웹 소스 확인
          WEB_SOURCE="./services/omni-pokemon-web/src/main/resources/static/index.html"
          if [ -f "$WEB_SOURCE" ]; then
            echo "WEB_EXISTS=true" >> $GITHUB_ENV
          else
            echo "WEB_EXISTS=false" >> $GITHUB_ENV
          fi

      # 5. [테스트] 홈페이지 서버 접속 테스트 (Smoke Test)
      - name: 🌐 Homepage Access Test (Smoke Test)
        id: smoke_test
        run: |
          echo "🔥 포켓몬 웹 서버(omni-pokemon-web) 백그라운드 실행..."
          nohup java -jar ./services/omni-pokemon-web/target/omni-pokemon-web-1.0.0.jar > web.log 2>&1 &
          PID=$!
          
          echo "⏳ 서버 부팅 대기 (15초)..."
          sleep 15
          
          echo "📡 접속 시도 (curl localhost:8086)..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8086/index.html)
          
          echo "HTTP_STATUS=$HTTP_CODE" >> $GITHUB_ENV
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ 접속 성공! (200 OK)"
            echo "TEST_RESULT=SUCCESS" >> $GITHUB_ENV
          else
            echo "❌ 접속 실패 (Status: $HTTP_CODE)"
            echo "TEST_RESULT=FAILURE" >> $GITHUB_ENV
            echo "::group::Server Logs"
            cat web.log
            echo "::endgroup::"
            kill $PID
            exit 1
          fi
          kill $PID

      # 6. [화면 표시] GitHub Actions Summary 생성 (대량 반영 기능)
      - name: 📊 Generate GitHub Summary Dashboard
        if: always()
        run: |
          echo "# 🚀 Omni System Build Report" >> $GITHUB_STEP_SUMMARY
          echo "### 🛠️ System Status" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | Port |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pokemon Web** | 🟢 Active | 8086 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cost Core** | 🟢 Active | 8082 |" >> $GITHUB_STEP_SUMMARY
          echo "| **API Gateway** | 🟢 Active | 8080 |" >> $GITHUB_STEP_SUMMARY
          echo "| **AI Model** | 🟢 Active | 5000 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          if [ "$TEST_RESULT" == "SUCCESS" ]; then
             echo "- ✅ **Homepage Smoke Test:** Passed (200 OK)" >> $GITHUB_STEP_SUMMARY
             echo "- ✅ **Build Artifacts:** $JAR_COUNT JARs Created" >> $GITHUB_STEP_SUMMARY
          else
             echo "- ❌ **Homepage Smoke Test:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🌐 Homepage Preview" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **Note:** 아래 링크는 로컬 서버용이므로, 실제 파일은 하단 **Artifacts**에서 다운로드하세요." >> $GITHUB_STEP_SUMMARY
          echo "- **Local URL:** \`http://localhost:8086/index.html\`" >> $GITHUB_STEP_SUMMARY
          
          if [ "$WEB_EXISTS" == "true" ]; then
             echo "✅ **index.html generated successfully.**" >> $GITHUB_STEP_SUMMARY
          fi

      # 7. [파일 제공] 홈페이지 및 빌드 결과물 업로드 (화면에서 다운로드 가능)
      - name: 📤 Upload Dashboard Artifact
        uses: actions/upload-artifact@v6
        with:
          name: pokemon-dashboard-html
          path: services/omni-pokemon-web/src/main/resources/static/index.html
          retention-days: 5

      - name: 📤 Upload All JARs (Optional)
        uses: actions/upload-artifact@v6
        with:
          name: microservices-jars
          path: services/**/*.jar
          retention-days: 1
