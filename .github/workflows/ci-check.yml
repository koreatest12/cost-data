name: Ultimate CI/CD & Fix Compilation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Python 환경 (비동기 처리용)
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Python Libs
        run: pip install requests aiohttp asyncio

      # 2. Java 17 설정 (Maven 캐싱 포함)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. [핵심] 소스 코드 생성 (수정된 Python 스크립트 실행)
      - name: 🚀 Generate Source & Fetch Data
        id: setup
        run: |
          if [ -f setup_ultimate_system.py ]; then
            echo "⚡ setup_ultimate_system.py 실행: 컴파일 에러 수정 및 데이터 수집..."
            python setup_ultimate_system.py
          else
            echo "❌ 스크립트가 없습니다."
            exit 1
          fi

      # 4. 빌드 (컴파일 에러 해결 확인)
      - name: Build with Maven
        run: |
          cd services/omni-pokemon-web
          mvn clean package -DskipTests

      # 5. 서버 실행 및 검증
      - name: 🌐 Server Smoke Test
        run: |
          nohup java -jar ./services/omni-pokemon-web/target/*.jar > app.log 2>&1 &
          PID=$!
          sleep 20
          
          # Health Check
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8086/api/pokemon/search?keyword=피카츄)
          echo "Server Status Code: $STATUS"
          
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ 서버 정상 작동 및 데이터 로드 완료"
          else
            echo "❌ 서버 시작 실패"
            cat app.log
            kill $PID
            exit 1
          fi
          kill $PID

      # 6. 결과물 업로드
      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixed-pokemon-server
          path: services/**/*.jar
