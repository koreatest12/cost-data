name: Ultimate CI & Ultra-Fast Data Setup

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-setup-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 전체 타임아웃 10분 설정
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Python 환경 설정 (비동기 처리를 위한 라이브러리 추가)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip' # pip 캐싱

      - name: Install Python Dependencies (Async)
        run: |
          pip install requests aiohttp asyncio

      # 2. JDK 설정 및 Maven 캐싱 (빌드 속도 획기적 개선)
      - name: Set up JDK 17 with Maven Cache
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # 핵심: 의존성 캐싱

      # 3. [핵심] Python 스크립트 실행 (MVC 구조 생성 + 초고속 데이터 수집)
      - name: 🚀 Run Ultimate Setup (Async & Parallel)
        id: setup
        run: |
          if [ -f setup_ultimate_system.py ]; then
            echo "⚡ setup_ultimate_system.py 실행: 비동기 데이터 수집 및 소스 생성..."
            python setup_ultimate_system.py
          else
            echo "❌ 스크립트가 없습니다."
            exit 1
          fi

      # 4. Maven 빌드 (API 서버 컴파일)
      - name: Build Spring Boot App
        run: |
          cd services/omni-pokemon-web
          mvn clean package -DskipTests

      # 5. API 서버 실행 및 정밀 진단 (Health Check)
      - name: 🌐 API Server Smoke Test & Data Check
        id: smoke_test
        run: |
          echo "🔥 API 서버 백그라운드 실행..."
          nohup java -jar ./services/omni-pokemon-web/target/*.jar > api.log 2>&1 &
          PID=$!
          
          echo "⏳ 서버 부팅 대기 (20초)..."
          sleep 20
          
          echo "🧪 1. 메인 페이지 접속 테스트"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8086/index.html)
          
          echo "🧪 2. 대량 데이터(망나뇽) 검색 테스트"
          # URL 인코딩 된 '망나뇽' 검색 시도
          SEARCH_RES=$(curl -s "http://localhost:8086/api/pokemon/search?keyword=%EB%A7%9D%EB%82%98%EB%85%B9")
          
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ 테스트 성공"
            echo "TEST_RESULT=SUCCESS" >> $GITHUB_ENV
          else
            echo "❌ 테스트 실패 - 로그 확인"
            cat api.log
            kill $PID
            exit 1
          fi
          kill $PID

      # 6. 결과 리포트
      - name: 📊 Generate Final Report
        if: always()
        run: |
          echo "# 🚀 Ultra-Fast CI/CD Report" >> $GITHUB_STEP_SUMMARY
          echo "### ⚡ Performance & Data" >> $GITHUB_STEP_SUMMARY
          echo "- **Data Processing:** Async Parallel Fetching (aiohttp)" >> $GITHUB_STEP_SUMMARY
          echo "- **Maven Cache:** ✅ Active" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** $TEST_RESULT" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omni-pokemon-server
          path: services/**/*.jar
