name: Universe Ops (Inc. Bitcoin & Crypto Intelligence)

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 06:00 KST
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: 유니버스 엔진 (Crypto 모듈 추가)
  # ------------------------------------------------------------------
  universe-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout External Resources
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: external_src
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # [통합 엔진] Python 스크립트 생성
      - name: Generate Universe Engine
        run: |
          cat << 'EOF' > universe_engine.py
          import os, sqlite3, random, uuid, json, datetime, shutil, sys

          ROOT_DIR = "universe_datacenter"
          DB_PATH = os.path.join(ROOT_DIR, "central_core.db")
          
          # 서비스 정의 (블록체인 노드 증설)
          CLUSTERS = {
              "prod-payment-gateway": 100,
              "prod-backend-java": 200,
              "prod-data-python": 150,
              "prod-blockchain-btc": 50,  # [NEW] 비트코인 노드
              "prod-blockchain-eth": 50,  # [NEW] 이더리움 노드
              "infra-k8s-worker": 200,
              "infra-db-shard": 50
          }

          CRYPTO_SOURCES = ["CoinDesk", "CoinTelegraph", "Bloomberg Crypto", "Upbit News", "Binance Research"]

          def log(msg):
              print(f"[{datetime.datetime.now().strftime('%H:%M:%S')}] {msg}")
              sys.stdout.flush()

          # ---------------------------------------------------------
          # 1. [인프라] 서버 프로비저닝 (블록체인 노드 포함)
          # ---------------------------------------------------------
          def provision_servers():
              log("🏗️ [Infra] Provisioning Universe Infrastructure...")
              os.makedirs(ROOT_DIR, exist_ok=True)
              
              total_nodes = 0
              for cluster, count in CLUSTERS.items():
                  for i in range(1, count + 1):
                      hostname = f"{cluster}-{i:04d}"
                      base_path = os.path.join(ROOT_DIR, "regions", "global", cluster, hostname)
                      os.makedirs(os.path.join(base_path, "data/chaindata"), exist_ok=True) # 체인 데이터 경로
                      
                      # 설정 파일
                      config = {"hostname": hostname, "role": cluster, "status": "SYNCING"}
                      with open(os.path.join(base_path, "config.json"), "w") as f:
                          json.dump(config, f)
                      total_nodes += 1
              log(f"✅ [Infra] {total_nodes} nodes ready (Inc. Crypto Nodes).")

          # ---------------------------------------------------------
          # 2. [크립토] 비트코인 뉴스 및 시세 데이터 대량 수집
          # ---------------------------------------------------------
          def collect_crypto_intelligence():
              log("🪙 [Crypto] Collecting Bitcoin News & Market Data...")
              conn = sqlite3.connect(DB_PATH)
              cur = conn.cursor()
              
              # 테이블 생성
              cur.execute("CREATE TABLE IF NOT EXISTS crypto_news (id TEXT, source TEXT, title TEXT, sentiment TEXT, url TEXT)")
              cur.execute("CREATE TABLE IF NOT EXISTS market_tickers (id TEXT, symbol TEXT, price REAL, volume REAL, timestamp TEXT)")
              
              # A. 뉴스 데이터 10,000건 생성
              news_titles = [
                  "Bitcoin breaks resistance at $150k", "SEC approves new Crypto ETF", 
                  "Ethereum Layer 2 fees drop 90%", "Institutional inflows hit record high",
                  "New regulation framework proposed for DeFi"
              ]
              
              news_data = []
              for _ in range(10000):
                  news_data.append((
                      str(uuid.uuid4()), 
                      random.choice(CRYPTO_SOURCES), 
                      random.choice(news_titles), 
                      random.choice(["POSITIVE", "NEUTRAL", "NEGATIVE"]),
                      f"https://news.crypto.com/{uuid.uuid4()}"
                  ))
              cur.executemany("INSERT INTO crypto_news VALUES (?,?,?,?,?)", news_data)
              
              # B. 시세 데이터 1,000,000건 (대량 틱 데이터)
              log("   -> Ingesting 1M Market Ticks...")
              ticks = []
              price = 150000.0
              for _ in range(1000000):
                  price += random.uniform(-50, 50)
                  ticks.append((str(uuid.uuid4()), "BTC/USD", round(price, 2), random.uniform(0.1, 5.0), str(datetime.datetime.now())))
              cur.executemany("INSERT INTO market_tickers VALUES (?,?,?,?,?)", ticks)
              
              conn.commit()
              conn.close()
              log(f"✅ [Crypto] Indexed {len(news_data)} news & 1,000,000 tickers.")

          # ---------------------------------------------------------
          # 3. [리포트] 통합 브리핑 생성
          # ---------------------------------------------------------
          def generate_report():
              conn = sqlite3.connect(DB_PATH)
              news_cnt = conn.execute("SELECT COUNT(*) FROM crypto_news").fetchone()[0]
              tick_cnt = conn.execute("SELECT COUNT(*) FROM market_tickers").fetchone()[0]
              conn.close()
              
              report = f"""# 🌌 Universe Daily Briefing (Inc. Bitcoin) - {datetime.date.today()}

              ## 1️⃣ 🪙 비트코인 & 크립토 인텔리전스
              - **수집된 뉴스:** {news_cnt:,} 건
              - **마켓 데이터:** {tick_cnt:,} Ticks (High-Frequency Data)
              - **주요 키워드:** BTC, ETF, Regulation, Layer2
              - **데이터 위치:** `{DB_PATH}` (Table: `crypto_news`, `market_tickers`)

              ## 2️⃣ 💰 부업 및 채용 정보
              - **상태:** Active Crawling
              - **추천:** Blockchain Developer, Crypto Analyst

              ## 3️⃣ 🏗️ 인프라 상태
              - **블록체인 노드:** 100 Nodes (BTC/ETH) Syncing...
              - **전체 서버:** 1,000+ Nodes Operational
              """
              with open("daily_universe_report.md", "w", encoding="utf-8") as f:
                  f.write(report)
              log("📄 Report Generated.")

          if __name__ == "__main__":
              provision_servers()
              collect_crypto_intelligence() # 크립토 모듈 실행
              generate_report()
          EOF

          # 엔진 가동
          python universe_engine.py

      # [아티팩트 업로드]
      - name: Upload Assets
        uses: actions/upload-artifact@v4
        with:
          name: universe-assets
          path: |
            daily_universe_report.md
            universe_datacenter/

      # [Git 반영]
      - name: Commit & Push
        run: |
          git config --global user.name "Universe Bot"
          git config --global user.email "bot@universe.com"
          
          git add -f universe_datacenter/ daily_universe_report.md
          
          git commit -m "🪙 Crypto Ops: Bitcoin News & 1M Ticks: $(date +'%Y-%m-%d')" || echo "No changes"
          git pull origin main --rebase
          git push origin main

  # ------------------------------------------------------------------
  # JOB 2: 리포트 발행
  # ------------------------------------------------------------------
  publish-report:
    needs: universe-simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download Report
        uses: actions/download-artifact@v4
        with:
          name: universe-assets
          path: .

      - name: Create Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🌌 [브리핑] 비트코인 뉴스 및 유니버스 인프라 리포트"
          content-filepath: ./daily_universe_report.md
          labels: |
            bitcoin
            crypto
            universe-scale
            automated
