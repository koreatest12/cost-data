name: 🌌 Omni-Intelligence Grand Pipeline (Job Hyper-Scale)

on:
  schedule:
    - cron: '0 21 * * *' # ⏰ KST 06:00
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  packages: write
  actions: write

jobs:
  # ==============================================================================
  # 💼 1. Job Engine (Hyper-Scale & Precision) - MAJOR UPGRADE 🚀
  # ==============================================================================
  job-core:
    name: 💼 채용 엔진 (Recruit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🛠️ 데이터 복원 및 환경 설정
        run: |
          # 지역별/직무별 폴더 체계화
          for loc in pangyo gangnam yeouido guro; do
            mkdir -p DB/jobs/$loc
            mkdir -p DB/archive/jobs/2026
            mkdir -p DB/backup
          done
          
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/job-data:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            docker pull $IMAGE
            docker create --name r_job $IMAGE
            docker cp r_job:/app/DB ./DB_R || true
            cp -r ./DB_R/* ./DB/ || echo "Fresh Start"
            docker rm r_job
          else echo "🆕 First Run"; fi

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install feedparser aiohttp asyncio requests beautifulsoup4 fake-useragent pandas

      - name: 🧬 Run Hyper-Job Core
        run: |
          cat << 'EOF' > job_core.py
          import asyncio, aiohttp, feedparser, os, json, shutil, datetime, random
          from fake_useragent import UserAgent
          
          DB_DIR = "DB"
          
          # [정밀 타겟팅 매트릭스]
          # 1. 소스: 개발자 친화적 플랫폼 집중
          PORTALS = {
              "Saramin": "site:saramin.co.kr",
              "JobKorea": "site:jobkorea.co.kr", 
              "Wanted": "site:wanted.co.kr",
              "Programmers": "site:programmers.co.kr"
          }
          
          # 2. 지역: IT 기업 밀집 지역
          LOCATIONS = {
              "pangyo": "판교",
              "gangnam": "강남",
              "yeouido": "여의도",
              "guro": "구로 가산",
              "magok": "마곡",
              "remotework": "재택근무"
          }
          
          # 3. 기술 스택: 2026 수요 높은 기술 (구체적 명시)
          STACKS = [
              "Spring Boot", "Java Backend", "Python Django", "Node.js", "React Frontend", 
              "DevOps Docker Kubernetes", "AWS Cloud", "AI Engineer", "Data Scientist",
              "Information Security", "Android Kotlin", "iOS Swift", "Flutter"
          ]
          
          async def fetch(session, url, loc_key, stack):
              try:
                  async with session.get(url, timeout=30) as r:
                      if r.status != 200: return []
                      p = feedparser.parse(await r.read())
                      results = []
                      for e in p.entries:
                          # [필터링] 알바, 파견 등 노이즈 제거 시도
                          if any(x in e.title for x in ["아르바이트", "파견", "학원"]): continue
                          
                          results.append({
                              "location": loc_key,
                              "stack": stack,
                              "title": e.title,
                              "link": e.link,
                              "source": e.get('source', {}).get('title', 'Unknown'),
                              "date": datetime.datetime.now().strftime('%Y-%m-%d')
                          })
                      return results
              except: return []

          async def main():
              print("🚀 Hyper-Recruit Engine Starting...")
              ua = UserAgent()
              conn = aiohttp.TCPConnector(limit=300) # 대량 수집을 위한 연결 증설
              
              tasks = []
              async with aiohttp.ClientSession(headers={'User-Agent': ua.random}, connector=conn) as session:
                  for loc_key, loc_name in LOCATIONS.items():
                      for stack in STACKS:
                          for p_name, p_url in PORTALS.items():
                              # 검색어 조합: "site:wanted.co.kr 판교 Spring Boot 채용"
                              query = f"{p_url} {loc_name} {stack} 채용"
                              url = f"https://news.google.com/rss/search?q={query}+when:1d&hl=ko&gl=KR&ceid=KR:ko"
                              tasks.append(fetch(session, url, loc_key, stack))
                  
                  # 비동기 병렬 실행
                  results = await asyncio.gather(*tasks)
                  items = [item for sublist in results for item in sublist]
              
              print(f"📡 Collected Raw Data: {len(items)}")
              
              if not items:
                  items.append({"title":"Sample Job", "link":"http://localhost", "location":"pangyo", "stack":"Java"})

              # [데이터 저장 및 아카이빙]
              # 지역별로 데이터 분산 저장
              grouped = {}
              for i in items:
                  loc = i['location']
                  if loc not in grouped: grouped[loc] = []
                  grouped[loc].append(i)
              
              for loc, data in grouped.items():
                  dir_path = f"{DB_DIR}/jobs/{loc}"
                  os.makedirs(dir_path, exist_ok=True)
                  file_path = f"{dir_path}/recruit.json"
                  
                  exist = []
                  if os.path.exists(file_path):
                      try: 
                          with open(file_path, 'r', encoding='utf-8') as f: exist = json.load(f)
                      except: exist = []
                  
                  seen = {x['link'] for x in exist}
                  merged = [x for x in data if x['link'] not in seen] + exist
                  
                  # 1. 최신 데이터 저장
                  with open(file_path, 'w', encoding='utf-8') as f:
                      json.dump(merged, f, indent=2, ensure_ascii=False)
                  
                  # 2. 일자별 아카이빙 (누적)
                  today = datetime.datetime.now().strftime('%Y%m%d')
                  archive_path = f"{DB_DIR}/archive/jobs/2026/{loc}_{today}.json"
                  os.makedirs(os.path.dirname(archive_path), exist_ok=True)
                  with open(archive_path, 'w', encoding='utf-8') as f:
                      json.dump(merged, f, indent=2, ensure_ascii=False)

              print("✅ Job Data Saved Successfully")

          if __name__ == "__main__": asyncio.run(main())
          EOF
          python job_core.py

      - name: 🐳 Docker Build & Push (Layered)
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          WORKDIR /app
          COPY . /app
          CMD ["python", "job_core.py"]
          EOF
          
          DATE_TAG=$(date +'%Y%m%d')
          IMG_NAME="ghcr.io/${GITHUB_REPOSITORY,,}/job-data"
          docker build -t $IMG_NAME:latest -t $IMG_NAME:$DATE_TAG .
          docker push $IMG_NAME:latest
          docker push $IMG_NAME:$DATE_TAG

      - uses: actions/upload-artifact@v4
        with: { name: db-job, path: DB/ }

  # ==============================================================================
  # 🛡️ 2. Security Engine (기존 유지)
  # ==============================================================================
  security-core:
    name: 🛡️ 보안 엔진 (Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🛠️ Setup
        run: |
          mkdir -p DB_SEC/news/threat_intel DB_SEC/archive DB_SEC/backup
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/security-2025-data:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            docker pull $IMAGE
            docker create --name r_sec $IMAGE
            docker cp r_sec:/app/DB_SEC ./DB_R || true
            cp -r ./DB_R/* ./DB_SEC/ || echo "Fresh"
            docker rm r_sec
          else echo "🆕 First Run"; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install feedparser aiohttp asyncio fake-useragent
      - name: 🧬 Run Security Core
        run: |
          cat << 'EOF' > sec_core.py
          import asyncio, aiohttp, feedparser, os, json, shutil, datetime
          from fake_useragent import UserAgent
          DB_DIR = "DB_SEC"
          SOURCES = ["site:thehackernews.com", "site:bleepingcomputer.com", "site:kisa.or.kr", "site:dailysecu.com"]
          KEYWORDS = ["CVE-2025", "Zero-Day", "Ransomware", "AI Security", "Supply Chain"]
          async def fetch(session, url, kw):
              try:
                  async with session.get(url, timeout=30) as r:
                      if r.status != 200: return []
                      p = feedparser.parse(await r.read())
                      return [{"title": e.title, "link": e.link, "kw": kw, "date": datetime.datetime.now().strftime('%Y-%m-%d')} for e in p.entries]
              except: return []
          async def main():
              ua = UserAgent()
              items = []
              async with aiohttp.ClientSession(headers={'User-Agent': ua.random}) as session:
                  tasks = []
                  for kw in KEYWORDS:
                      for src in SOURCES:
                          url = f"https://news.google.com/rss/search?q={src} {kw}+when:1d&hl=en-US&gl=US"
                          tasks.append(fetch(session, url, kw))
                  res = await asyncio.gather(*tasks)
                  for r in res: items.extend(r)
              os.makedirs(f"{DB_DIR}/news/threat_intel", exist_ok=True)
              path = f"{DB_DIR}/news/threat_intel/news.json"
              exist = []
              if os.path.exists(path):
                  try:
                      with open(path, 'r') as f: exist = json.load(f)
                  except: exist = []
              merged = items + exist
              with open(path, 'w') as f: json.dump(merged, f, indent=2)
          if __name__ == "__main__": asyncio.run(main())
          EOF
          python sec_core.py
      - name: 🐳 Docker Build
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          WORKDIR /app
          COPY . /app
          CMD ["python", "sec_core.py"]
          EOF
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}/security-2025-data:latest"
          docker build -t $IMG . && docker push $IMG
      - uses: actions/upload-artifact@v4
        with: { name: db-sec, path: DB_SEC/ }

  # ==============================================================================
  # 🧮 3. Algo Core (기존 유지)
  # ==============================================================================
  algo-core:
    name: 🧮 알고 엔진 (Algo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_ALGO/news/ai DB_ALGO/backup
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 Run Algo Core
        run: |
          cat << 'EOF' > algo_core.py
          import json, os
          os.makedirs("DB_ALGO/news/ai", exist_ok=True)
          data = [{"title":"Algorithm Study", "link":"http://localhost"}]
          with open("DB_ALGO/news/ai/data.json", "w") as f: json.dump(data, f)
          EOF
          python algo_core.py
      - uses: actions/upload-artifact@v4
        with: { name: db-algo, path: DB_ALGO/ }

  # ==============================================================================
  # 💰 4. Misc Core (기존 유지)
  # ==============================================================================
  misc-core:
    name: 💰 비용/기타 (Misc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_COST/economy DB_STUDY/meta
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 Run Misc
        run: |
          cat << 'EOF' > misc_core.py
          import json, os
          os.makedirs("DB_COST/economy", exist_ok=True)
          with open("DB_COST/economy/forex.json","w") as f: json.dump([{"rate":1400}],f)
          EOF
          python misc_core.py
      - uses: actions/upload-artifact@v4
        with: { name: db-misc, path: DB_COST/ }

  # ==============================================================================
  # ☕ 5. Java App Build (데이터 주입 & 빌드)
  # ==============================================================================
  java-app-build:
    needs: [job-core, security-core, algo-core, misc-core]
    name: ☕ Java Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'db-*', merge-multiple: true }
      
      - name: ☕ JDK 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: maven }

      - name: 🧹 데이터 주입
        run: |
          rm -rf src
          mkdir -p src/main/resources/data
          # 수집된 폴더 강제 복사
          cp -r DB src/main/resources/data/jobs || true
          cp -r DB_SEC src/main/resources/data/ || true
          cp -r DB_ALGO src/main/resources/data/algo || true
          echo "✅ Data Injected"

      - name: 📝 pom.xml
        run: |
          cat << 'EOF' > pom.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <parent><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-parent</artifactId><version>3.2.1</version><relativePath/></parent>
              <groupId>com.costdata</groupId><artifactId>omni-intelligence-api</artifactId><version>1.0.0</version>
              <properties><java.version>17</java.version></properties>
              <dependencies>
                  <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId></dependency>
                  <dependency><groupId>org.projectlombok</groupId><artifactId>lombok</artifactId><optional>true</optional></dependency>
              </dependencies>
              <build><plugins><plugin><groupId>org.springframework.boot</groupId><artifactId>spring-boot-maven-plugin</artifactId><configuration><mainClass>com.costdata.OmniApiApplication</mainClass></configuration></plugin></plugins></build>
          </project>
          EOF

      - name: 🧬 Java Code
        run: |
          mkdir -p src/main/java/com/costdata
          cat << 'EOF' > src/main/java/com/costdata/OmniApiApplication.java
          package com.costdata;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;
          import java.util.Map;
          @SpringBootApplication @RestController
          public class OmniApiApplication {
              public static void main(String[] args) { SpringApplication.run(OmniApiApplication.class, args); }
              @GetMapping("/api/status") public Map<String, String> s() { return Map.of("status", "online"); }
          }
          EOF
      
      - run: mvn clean package -DskipTests
      - name: 🐳 Docker Build
        run: |
          cat <<EOF > Dockerfile
          FROM openjdk:17-jdk-slim
          COPY target/*.jar app.jar
          ENTRYPOINT ["java", "-jar", "/app.jar"]
          EOF
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}/omni-java-api:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t $IMG . && docker push $IMG

  # ==============================================================================
  # 🌍 6. Master Dashboard
  # ==============================================================================
  master-hub:
    needs: [java-app-build]
    name: 🌍 Master Dashboard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: 'db-*', merge-multiple: true }
      
      - name: 📊 README Gen
        run: |
          cat << 'EOF' > dashboard.py
          import os, json, datetime
          def cnt(p):
              c=0
              if not os.path.exists(p): return 0
              for r,d,f in os.walk(p):
                  for file in f:
                      if file.endswith('.json'):
                          try: c += len(json.load(open(os.path.join(r,file))))
                          except: pass
              return c
          sec = cnt("DB_SEC")
          job = cnt("DB/jobs")
          algo = cnt("DB_ALGO")
          total = sec + job + algo
          md = f"# 🌌 Omni-Intelligence Hub\n\n![Status](https://img.shields.io/badge/System-Online-green) ![Data](https://img.shields.io/badge/Total-{total:,}-blue)\n"
          md += f"## 📊 Data Statistics\n| Sector | Count | Status |\n|---|---|---|\n| 🛡️ Security | {sec:,} | 🟢 |\n| 💼 Jobs | {job:,} | 🟢 |\n| 🧮 Algo | {algo:,} | 🟢 |\n"
          with open("README.md", "w") as f: f.write(md)
          EOF
          python dashboard.py

      - run: cat README.md >> $GITHUB_STEP_SUMMARY
      
      - name: 🌿 Commit
        run: |
          git config --global user.name "Omni Bot"
          git config --global user.email "bot@actions"
          git add README.md DB* pom.xml src/
          if git diff --cached --quiet; then echo "✨ No changes"; exit 0; fi
          git commit -m "🌌 Update: $(date +'%Y-%m-%d %H:%M')"
          n=0; until [ "$n" -ge 5 ]; do git pull --rebase origin main && git push origin main && break; n=$((n+1)); sleep 5; done
