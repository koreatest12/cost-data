name: Universe Ops (Massive Scale & Disk Optimized)

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 06:00 KST
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: 유니버스 엔진 (디스크 최적화 + 대량 생성)
  # ------------------------------------------------------------------
  universe-simulation:
    runs-on: ubuntu-latest
    steps:
      # [1] ★ 핵심 해결: 디스크 공간 확보 (30GB+ 확보) ★
      - name: Free Disk Space (Ubuntu)
        run: |
          echo "🧹 Cleaning up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "✅ Disk space freed."
          df -h

      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # [외부 리소스]
      - name: Checkout External Resources
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: external_src
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # [통합 엔진] Python 스크립트 생성 (최적화 로직 적용)
      - name: Generate Optimized Universe Engine
        run: |
          cat << 'EOF' > universe_engine.py
          import os, sqlite3, random, uuid, json, datetime, shutil, sys

          # --- [설정] ---
          ROOT_DIR = "universe_datacenter"
          EXT_SRC = "external_src"
          DB_PATH = os.path.join(ROOT_DIR, "central_core.db")
          
          # 노드 개수 (스케일 유지)
          CLUSTERS = {
              "prod-payment": 100, "prod-backend": 200, "prod-frontend": 150,
              "prod-data": 150, "infra-k8s": 200, "prod-crypto": 100
          }

          def log(msg):
              print(f"[{datetime.datetime.now().strftime('%H:%M:%S')}] {msg}")
              sys.stdout.flush()

          # ---------------------------------------------------------
          # 1. [인프라] 서버 프로비저닝 (파일 사이즈 최적화)
          # ---------------------------------------------------------
          def provision_servers():
              log("🏗️ [Infra] Provisioning 1,000+ Servers (Storage Optimized)...")
              os.makedirs(ROOT_DIR, exist_ok=True)
              
              total_nodes = 0
              for cluster, count in CLUSTERS.items():
                  for i in range(1, count + 1):
                      hostname = f"{cluster}-{i:04d}"
                      # 깊은 폴더 구조 대신 Flat 구조로 속도/용량 최적화
                      base_path = os.path.join(ROOT_DIR, "nodes", cluster, hostname)
                      os.makedirs(base_path, exist_ok=True)
                      
                      # Config (JSON은 작아서 OK)
                      config = {
                          "hostname": hostname, "role": cluster, 
                          "status": "ONLINE", "ip": f"10.0.{random.randint(0,255)}.{random.randint(0,255)}"
                      }
                      with open(os.path.join(base_path, "config.json"), "w") as f:
                          json.dump(config, f)
                      
                      # Dockerfile (가볍게 생성)
                      with open(os.path.join(base_path, "Dockerfile"), "w") as f:
                          f.write(f"FROM alpine:latest\nRUN echo 'Booting {hostname}'")

                      total_nodes += 1
              
              log(f"✅ [Infra] {total_nodes} nodes ready.")

          # ---------------------------------------------------------
          # 2. [데이터] 대규모 트랜잭션 (Batch Insert 최적화)
          # ---------------------------------------------------------
          def inject_massive_data():
              log("💾 [DB] Injecting Massive Data (Batch Processing)...")
              conn = sqlite3.connect(DB_PATH)
              cur = conn.cursor()
              
              # 테이블 생성
              cur.execute("CREATE TABLE IF NOT EXISTS transactions (id TEXT, type TEXT, amount INTEGER, status TEXT)")
              cur.execute("CREATE TABLE IF NOT EXISTS server_logs (id TEXT, node TEXT, cpu INTEGER, mem INTEGER)")
              cur.execute("CREATE TABLE IF NOT EXISTS crypto_trades (id TEXT, pair TEXT, price INTEGER, vol REAL)")

              # A. 트랜잭션 100,000건 (메모리 효율을 위해 배치 처리 없음, SQLite는 빠름)
              log("   -> Generating 100k Transactions...")
              txs = [(str(uuid.uuid4()), "PAYMENT", random.randint(100, 10000), "OK") for _ in range(100000)]
              cur.executemany("INSERT INTO transactions VALUES (?,?,?,?)", txs)
              
              # B. 서버 로그 50,000건
              log("   -> Generating 50k Server Logs...")
              logs = [(str(uuid.uuid4()), f"node-{i}", random.randint(10,90), random.randint(20,80)) for i in range(50000)]
              cur.executemany("INSERT INTO server_logs VALUES (?,?,?,?)", logs)

              # C. 크립토 거래 50,000건
              log("   -> Generating 50k Crypto Trades...")
              trades = [(str(uuid.uuid4()), "BTC/KRW", random.randint(140000000, 150000000), random.random()) for _ in range(50000)]
              cur.executemany("INSERT INTO crypto_trades VALUES (?,?,?,?)", trades)
              
              conn.commit()
              conn.close()
              log("✅ [DB] 200,000+ Records injected.")

          # ---------------------------------------------------------
          # 3. [통합] 외부 리소스 스마트 배포 (용량 절약)
          # ---------------------------------------------------------
          def deploy_external_resources():
              log(f"📦 [Deploy] Smart Integrating resources from '{EXT_SRC}'...")
              
              if not os.path.exists(EXT_SRC):
                  log("⚠️ External source not found.")
                  return

              deployed_cnt = 0
              # 모든 파일을 복사하면 용량 부족 -> 핵심 파일만 골라서 분산 배포
              for root, dirs, files in os.walk(EXT_SRC):
                  if ".git" in root: continue
                  for file in files:
                      # 타겟 노드 선정 (전체 노드가 아닌 랜덤 1개 노드에만 배포하여 용량 절약)
                      cluster = random.choice(list(CLUSTERS.keys()))
                      node_id = random.randint(1, CLUSTERS[cluster])
                      target_path = os.path.join(ROOT_DIR, "nodes", cluster, f"{cluster}-{node_id:04d}", file)
                      
                      # 파일 복사
                      shutil.copy(os.path.join(root, file), target_path)
                      deployed_cnt += 1

              log(f"✅ [Deploy] {deployed_cnt} external files distributed.")
              
              # ★ 핵심: 사용 후 원본 소스 삭제하여 공간 확보 ★
              log("🧹 Cleaning up external source to free space...")
              shutil.rmtree(EXT_SRC)

          # ---------------------------------------------------------
          # 4. [리포트]
          # ---------------------------------------------------------
          def generate_report():
              conn = sqlite3.connect(DB_PATH)
              tx_cnt = conn.execute("SELECT COUNT(*) FROM transactions").fetchone()[0]
              db_size = os.path.getsize(DB_PATH) / (1024*1024) # MB
              conn.close()
              
              report = f"""# 🌌 Universe Optimized Report ({datetime.date.today()})

              ## 1️⃣ 인프라 구축 (Storage Optimized)
              - **총 서버 노드:** 1,000+ Nodes
              - **디스크 상태:** Optimized (Cleaned up unused tools)
              - **클러스터:** Payment, Backend, AI, Crypto, K8s

              ## 2️⃣ 데이터 자산 (Massive DB)
              - **DB 파일 크기:** {db_size:.2f} MB
              - **총 레코드:** {tx_cnt + 100000:,} Rows
              - **마이그레이션:** ✅ Completed

              ## 3️⃣ 통합 배포
              - **외부 리소스:** Distributed & Source Cleaned
              - **상태:** Ready for Service
              """
              with open("daily_universe_report.md", "w", encoding="utf-8") as f:
                  f.write(report)
              log("📄 Report Generated.")

          if __name__ == "__main__":
              provision_servers()
              inject_massive_data()
              deploy_external_resources()
              generate_report()
          EOF

          # 엔진 가동
          python universe_engine.py

      # [결과 확인]
      - name: Check Disk Usage After Run
        run: df -h

      # [아티팩트 업로드]
      - name: Upload Optimized Assets
        uses: actions/upload-artifact@v4
        with:
          name: universe-optimized-data
          path: |
            daily_universe_report.md
            universe_datacenter/

      # [Git 반영]
      - name: Commit & Push
        run: |
          git config --global user.name "Universe Bot"
          git config --global user.email "bot@universe.com"
          
          # 대량 파일 추가 (경고 무시)
          git add -f universe_datacenter/ daily_universe_report.md
          
          git commit -m "🌌 Universe Optimized: 1000+ Nodes & Data w/ Disk Fix: $(date +'%Y-%m-%d')" || echo "No changes"
          git pull origin main --rebase
          git push origin main

  # ------------------------------------------------------------------
  # JOB 2: 리포트 발행
  # ------------------------------------------------------------------
  publish-report:
    needs: universe-simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download Report
        uses: actions/download-artifact@v4
        with:
          name: universe-optimized-data
          path: .

      - name: Create Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🌌 [유니버스] 디스크 최적화 및 대량 서버 구축 결과"
          content-filepath: ./daily_universe_report.md
          labels: |
            optimized
            universe-scale
            massive-data
            automated
