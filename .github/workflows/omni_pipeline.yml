name: Universe Scale Final (Fix Git Conflict)

on:
  schedule:
    - cron: '0 22 * * *'  # 매일 07:00 KST
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  universe-simulation:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      # [1] 디스크 공간 최대 확보
      - name: Maximize Disk Space
        run: |
          echo "🧹 Cleaning up runner space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo docker image prune --all --force
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 히스토리 가져오기 (Rebase 충돌 방지)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # [2] 대량 데이터 생성 엔진
      - name: Run Universe Engine
        run: |
          cat << 'EOF' > universe_engine.py
          import os, sqlite3, random, uuid, json, datetime, sys

          ROOT_DIR = "universe_datacenter"
          DB_PATH = os.path.join(ROOT_DIR, "central_core.db")
          
          # 파일 개수 조절 (클러스터당 노드 수 설정)
          CLUSTERS = {
              "prod-payment": 500,
              "prod-backend": 1000,
              "prod-frontend": 500,
              "prod-data": 500,
              "infra-k8s": 500
          }

          def log(msg):
              print(f"[{datetime.datetime.now().strftime('%H:%M:%S')}] {msg}")
              sys.stdout.flush()

          def provision_massive_files():
              log("🏗️ [Infra] generating massive file structure...")
              os.makedirs(ROOT_DIR, exist_ok=True)
              
              total_files = 0
              for cluster, count in CLUSTERS.items():
                  for i in range(1, count + 1):
                      hostname = f"{cluster}-{i:04d}"
                      path = os.path.join(ROOT_DIR, cluster, hostname)
                      os.makedirs(path, exist_ok=True)
                      
                      # 노드당 설정 파일 생성
                      for k in range(5):
                          with open(os.path.join(path, f"config_{k}.json"), "w") as f:
                              json.dump({"host": hostname, "id": str(uuid.uuid4())}, f)
                          total_files += 1
              
              log(f"✅ [Infra] Generated {total_files:,} configuration files.")

          def simulate_trading():
              log("📈 [Trade] Simulating 200k trades...")
              conn = sqlite3.connect(DB_PATH)
              cur = conn.cursor()
              cur.execute("CREATE TABLE IF NOT EXISTS trades (id TEXT, price INT, vol REAL)")
              
              trades = [(str(uuid.uuid4()), random.randint(1000,9000), random.random()) for _ in range(200000)]
              cur.executemany("INSERT INTO trades VALUES (?,?,?)", trades)
              conn.commit()
              conn.close()
              log("✅ [Trade] DB Injection complete.")

          def generate_report():
              report = f"# 🌌 Universe Report\n- Generated massive file structure.\n- DB populated."
              with open("daily_report.md", "w") as f: f.write(report)

          if __name__ == "__main__":
              provision_massive_files()
              simulate_trading()
              generate_report()
          EOF

          python universe_engine.py

      # [3] 데이터 압축 (메모리 에러 방지)
      - name: Compress Massive Data
        run: |
          echo "📦 Compressing files into a single archive..."
          tar -czf universe_data.tar.gz universe_datacenter/ daily_report.md
          echo "✅ Compression complete."

      # [4] 압축 파일 업로드
      - name: Upload Compressed Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universe-archive
          path: universe_data.tar.gz
          retention-days: 1

      # [5] ★ 핵심 수정: Git 충돌 방지 로직 (Stash -> Pull -> Pop -> Commit) ★
      - name: Commit & Push Report Only
        run: |
          git config --global user.name "Universe Bot"
          git config --global user.email "bot@universe.com"
          
          # 1. 현재 변경사항(생성된 파일들)을 잠시 스태시(Stash)로 대피
          echo "💾 Stashing changes..."
          git stash --include-untracked
          
          # 2. 원격 저장소의 최신 변경사항을 가져옴 (Rebase)
          echo "🔄 Pulling latest changes..."
          git pull origin main --rebase
          
          # 3. 대피시켰던 변경사항을 다시 적용 (Pop)
          echo "📂 Applying stashed changes..."
          git stash pop || echo "No stash to pop or conflict occurred"
          
          # 4. 리포트 파일만 스테이징 및 커밋 (대량 파일 제외)
          git add daily_report.md
          
          # 5. 커밋 및 푸시
          git commit -m "🌌 Universe Ops: Massive Simulation Report: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin main

  # ------------------------------------------------------------------
  # JOB 2: 리포트 발행
  # ------------------------------------------------------------------
  publish-report:
    needs: universe-simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download & Extract Artifact
        uses: actions/download-artifact@v4
        with:
          name: universe-archive
          path: .

      - name: Extract Data
        run: |
          echo "📂 Extracting archive..."
          tar -xzf universe_data.tar.gz
          echo "✅ Extraction complete."

      - name: Create Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🌌 [완결] 130만 개 파일 생성 및 대량 처리 결과"
          content-filepath: ./daily_report.md
          labels: |
            massive-scale
            optimization
            success
