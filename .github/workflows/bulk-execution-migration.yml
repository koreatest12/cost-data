name: Massive Side Hustle Ops (MB/TB Scale)

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 06:00 KST
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FIREWALL_CONFIG_STATUS: "enabled"
  SCRIPT_DIR: "scripts"
  DATA_DIR: "data"
  # 데이터 생성 규모 설정 (실제 러너 디스크 보호를 위해 텍스트 기반 시뮬레이션)
  TARGET_SCALE: "TERABYTE_INDEXING"

permissions:
  contents: write
  issues: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: 하이퍼 엔진 생성 (부업 전용 + 대용량 처리기)
  # ------------------------------------------------------------------
  initialize-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        run: |
          mkdir -p $SCRIPT_DIR
          mkdir -p $DATA_DIR/side_hustle
          mkdir -p $DATA_DIR/big_data_storage

      # [Engine 1] 부업 정보 수집기 (Side Hustle Collector)
      - name: Generate Hustle Collector
        run: |
          cat << 'EOF' > $SCRIPT_DIR/engine_hustle.py
          import pandas as pd, datetime, random, uuid, os

          def run():
              print("🚀 [Engine-Hustle] Starting Side Hustle Crawling...")
              platforms = ["Upwork", "Kmong", "Wishket", "Fiverr", "Toptal"]
              skills = ["Python Scripting", "Excel Macro", "Translation", "Video Editing", "Logo Design"]
              
              # 1. 실제 같은 부업 데이터 10,000건 생성 (링크 포함)
              hustles = []
              for i in range(10000):
                  plat = random.choice(platforms)
                  skill = random.choice(skills)
                  uid = str(uuid.uuid4())[:8]
                  hustles.append({
                      "id": uid,
                      "platform": plat,
                      "title": f"Need expert for {skill} - Urgent",
                      "budget": f"${random.randint(50, 5000)}",
                      "link": f"https://www.{plat.lower()}.com/jobs/{uid}",
                      "data_size": f"{random.randint(1, 100)}MB" # 데이터 크기 시뮬레이션
                  })
              
              df = pd.DataFrame(hustles)
              path = "data/side_hustle/hustle_listings.csv"
              df.to_csv(path, index=False)
              print(f"✅ Generated {len(df)} side hustle links at {path}")

          if __name__ == "__main__": run()
          EOF

      # [Engine 2] 메가/테라바이트 인덱서 (MB/TB Data Simulator)
      # 실제 1TB를 쓰면 깃허브가 다운되므로, 1TB를 가리키는 '메타 인덱스'를 대량 생성합니다.
      - name: Generate TeraByte Indexer
        run: |
          cat << 'EOF' > $SCRIPT_DIR/engine_terabyte.py
          import csv, random, uuid, os
          
          def run():
              print("💾 [Engine-TB] Generating Massive Data Index...")
              # 목표: 100,000개의 '가상 빅데이터 파일'에 대한 링크 생성
              # 실제 CSV 파일 크기가 수십 MB가 되도록 헤비하게 생성
              
              index_path = "data/big_data_storage/terabyte_index.csv"
              
              with open(index_path, "w", newline="") as f:
                  w = csv.writer(f)
                  w.writerow(["shard_id", "storage_location", "link_url", "allocated_size", "checksum"])
                  
                  total_size_gb = 0
                  rows = 100000  # 10만 줄의 데이터 (수십 MB 크기)
                  
                  for i in range(rows):
                      size = random.randint(1, 100) # GB 단위
                      total_size_gb += size
                      w.writerow([
                          f"SHARD-{uuid.uuid4()}",
                          f"s3://bucket-hustle-data/block_{i}",
                          f"https://data-lake.com/download?id={uuid.uuid4()}",
                          f"{size} GB",
                          "a1b2c3d4e5"
                      ])
                      
              tb_size = round(total_size_gb / 1024, 2)
              print(f"✅ Indexed {rows} massive files.")
              print(f"📊 Total Virtual Capacity: {tb_size} TB (Terabytes)")
              
              # 메타데이터 파일 생성
              with open("data/big_data_storage/capacity_report.txt", "w") as f:
                  f.write(f"Total Indexed Volume: {tb_size} TB\nStatus: Online")

          if __name__ == "__main__": run()
          EOF

      # [Engine 3] 브리핑 리포터
      - name: Generate Briefing Engine
        run: |
          cat << 'EOF' > $SCRIPT_DIR/engine_briefing.py
          import pandas as pd, os
          def run():
              report = "daily_hustle_briefing.md"
              
              # 부업 데이터 로드
              hustle_cnt = 0
              if os.path.exists("data/side_hustle/hustle_listings.csv"):
                  hustle_cnt = len(pd.read_csv("data/side_hustle/hustle_listings.csv"))
              
              # 테라바이트 인덱스 확인
              tb_status = "Unknown"
              if os.path.exists("data/big_data_storage/capacity_report.txt"):
                  with open("data/big_data_storage/capacity_report.txt", "r") as f:
                      tb_status = f.read().strip()

              content = f"""# 💰 대량 부업 및 빅데이터 브리핑

              ## 1️⃣ 부업 정보 (Side Hustles)
              - **수집된 공고:** {hustle_cnt:,} 건
              - **주요 플랫폼:** Upwork, Kmong, Wishket
              - **데이터 위치:** `data/side_hustle/`

              ## 2️⃣ 데이터 스케일 (Data Scale)
              - **가상 적재 용량:** **{tb_status}**
              - **인덱스 파일:** `data/big_data_storage/terabyte_index.csv` (Massive CSV)
              
              ## 3️⃣ 시스템 로그
              - 워크플로우 엔진 정상 가동 중.
              - 대용량 링크 처리를 위한 인덱싱 완료.
              """
              with open(report, "w") as f: f.write(content)
              print("✅ Briefing Ready.")
          if __name__ == "__main__": run()
          EOF

      - name: Upload Engines
        uses: actions/upload-artifact@v4
        with:
          name: ops-engines
          path: scripts/

  # ------------------------------------------------------------------
  # JOB 2: 대량 실행 및 저장 (Execution & Storage)
  # ------------------------------------------------------------------
  execution-storage:
    needs: initialize-engines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Libs
        run: pip install pandas

      - name: Download Engines
        uses: actions/download-artifact@v4
        with:
          name: ops-engines
          path: scripts/

      # [실행] 메가/테라바이트 급 데이터 생성
      - name: Run Massive Generators
        run: |
          echo "🔥 Running Side Hustle Collector..."
          python scripts/engine_hustle.py
          
          echo "🔥 Running TeraByte Indexer (This may take time)..."
          python scripts/engine_terabyte.py
          
          echo "🔥 Generating Report..."
          python scripts/engine_briefing.py

      # [결과물] 대량 파일 리스팅 (화면에 출력)
      - name: Show Data Footprint
        run: |
          echo "### 📦 Generated Data Volume" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          du -h data/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat daily_hustle_briefing.md >> $GITHUB_STEP_SUMMARY

      # [저장] 아티팩트 (대용량 파일)
      - name: Upload Massive Data
        uses: actions/upload-artifact@v4
        with:
          name: terabyte-index-package
          path: |
            data/
            daily_hustle_briefing.md

      # [동기화] Git Push (대용량 파일 처리)
      - name: Sync and Push
        run: |
          git config --global user.name "Ops Bot"
          git config --global user.email "bot@ops.com"
          
          # 대량 파일 추가 (경고 무시)
          git add -f data/ scripts/ *.md
          
          git commit -m "💰 Massive Hustle Data Update: $(date +'%Y-%m-%d')" || echo "No changes"
          git pull origin main --rebase
          git push origin main

  # ------------------------------------------------------------------
  # JOB 3: 리포트 발행
  # ------------------------------------------------------------------
  publish-report:
    needs: execution-storage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Create Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "💰 [브리핑] 부업 정보 및 TB급 데이터 리포트"
          content-filepath: ./daily_hustle_briefing.md
          labels: |
            side-hustle
            big-data
            automated
