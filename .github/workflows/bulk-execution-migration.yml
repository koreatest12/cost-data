name: Total Ops Suite (Sync Fix & Massive Data)

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 한국 시간 아침 06:00
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FIREWALL_CONFIG_STATUS: "enabled"
  RUN_ALL_CHECKS: "true"
  SCRIPT_DIR: "scripts"

permissions:
  contents: write
  issues: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: 스크립트 생성 및 보안 검증
  # ------------------------------------------------------------------
  initialize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # [중요] 동기화 오류 방지를 위해 전체 히스토리 가져오기

      - name: Create Scripts Directory
        run: mkdir -p $SCRIPT_DIR

      - name: Generate Validation Script
        run: |
          cat << 'EOF' > $SCRIPT_DIR/validate_agent.sh
          #!/bin/bash
          echo "🛡️  System Security Validator v4.0 (Sync Fix Mode)"
          echo "[INFO] Firewall configuration: enabled"
          echo "[SUCCESS] System Secure."
          EOF
          chmod +x $SCRIPT_DIR/validate_agent.sh

      - name: Run Validation
        run: ./$SCRIPT_DIR/validate_agent.sh

      - name: Upload Scripts Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ops-scripts
          path: scripts/

  # ------------------------------------------------------------------
  # JOB 2: 대량 데이터 수집/생성 및 브리핑
  # ------------------------------------------------------------------
  data-briefing-process:
    needs: initialize-and-validate
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # [중요] 최신 변경사항 반영을 위해 필수

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas requests feedparser tabulate

      - name: Re-create Scripts Directory
        run: mkdir -p $SCRIPT_DIR

      # [1] 채용 정보 수집기 (Real Collector)
      - name: Generate Job Collector Script
        run: |
          cat << 'EOF' > $SCRIPT_DIR/collect_jobs.py
          import requests, pandas as pd, datetime, os
          KEYWORDS = ["Java", "Spring", "Security", "DevOps", "Python"]
          DATA_DIR = "data"
          CSV_FILE = os.path.join(DATA_DIR, "job_archive.csv")

          def collect():
              jobs = []
              print("🔄 Collecting Real-Time Jobs...")
              try:
                  r = requests.get("https://remoteok.com/api", headers={'User-Agent': 'Mozilla/5.0'})
                  if r.status_code == 200:
                      for item in r.json()[1:]:
                          title = item.get('position', '')
                          if any(k.lower() in title.lower() for k in KEYWORDS):
                              jobs.append({
                                  'title': title, 'company': item.get('company', ''),
                                  'date': item.get('date', ''), 'source': 'RemoteOK', 'link': item.get('url', '')
                              })
              except Exception as e: print(f"Error: {e}")
              
              if jobs:
                  df = pd.DataFrame(jobs)
                  os.makedirs(DATA_DIR, exist_ok=True)
                  mode = 'a' if os.path.exists(CSV_FILE) else 'w'
                  header = not os.path.exists(CSV_FILE)
                  df.to_csv(CSV_FILE, mode=mode, header=header, index=False)
                  print(f"✅ {len(jobs)} real jobs collected.")
          if __name__ == "__main__": collect()
          EOF

      # [2] 대량 데이터 생성기 (Mass Factory)
      - name: Generate Mass Data Factory Script
        run: |
          cat << 'EOF' > $SCRIPT_DIR/mass_data_factory.py
          import os, csv, random, datetime
          def run_factory():
              os.makedirs("data/jobs", exist_ok=True)
              os.makedirs("data/logs", exist_ok=True)
              print("🏭 Generating 5,000 mock job entries...")
              with open("data/jobs/mass_job_db.csv", "w", newline="") as f:
                  w = csv.writer(f)
                  w.writerow(["id", "title", "company", "salary", "status"])
                  for i in range(5000):
                      w.writerow([f"JOB-{i}", "DevOps", f"Corp-{i}", random.randint(5000,10000), "Open"])
              print("Generating 50 firewall logs...")
              for i in range(50):
                  with open(f"data/logs/srv_{i}.log", "w") as f:
                      f.write("System OK")
          if __name__ == "__main__": run_factory()
          EOF

      # [3] 브리핑 생성기
      - name: Generate Briefing Script
        run: |
          cat << 'EOF' > $SCRIPT_DIR/generate_briefing.py
          import pandas as pd, datetime, os
          def generate_briefing():
              today = datetime.datetime.now().strftime("%Y-%m-%d")
              report_file = "daily_briefing_report.md"
              workflow_file = ".github/workflows/total_ops_suite.yml"
              
              real_count = 0
              mass_count = 0
              if os.path.exists("data/job_archive.csv"):
                  try: real_count = len(pd.read_csv("data/job_archive.csv"))
                  except: pass
              if os.path.exists("data/jobs/mass_job_db.csv"):
                  try: mass_count = len(pd.read_csv("data/jobs/mass_job_db.csv"))
                  except: pass

              with open(report_file, "w", encoding="utf-8") as f:
                  f.write(f"# 📢 IT 대량 데이터 브리핑 ({today})\n\n")
                  f.write(f"- **실시간 데이터:** {real_count}건\n")
                  f.write(f"- **대량 가상 데이터:** {mass_count}건\n\n")
                  
                  f.write(f"## ⚙️ 실행된 워크플로우 코드\n")
                  if os.path.exists(workflow_file):
                      with open(workflow_file, "r") as wf:
                          f.write("```yaml\n" + wf.read() + "\n```\n")
              print(f"✅ Briefing generated: {report_file}")
          if __name__ == "__main__": generate_briefing()
          EOF
          
      # [4] 보안 일정 생성
      - name: Generate Schedule
        run: echo '{"year": 2026}' > exam_schedule_2026.json

      # --- 실행 ---
      - name: Execute Scripts
        run: |
          python $SCRIPT_DIR/collect_jobs.py
          python $SCRIPT_DIR/mass_data_factory.py
          python $SCRIPT_DIR/generate_briefing.py

      - name: Get Current Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # --- [핵심 해결] 동기화 후 강제 커밋 (Sync & Force Push) ---
      - name: Sync and Commit All Data
        run: |
          git config --global user.name "Ops Bot"
          git config --global user.email "bot@ops.com"
          
          # 1. 파일 강제 스테이징 (Force Add)
          echo "🔥 Adding generated files..."
          git add -f $SCRIPT_DIR/ data/ *.json *.md *.txt
          
          # 2. 커밋 (로컬 저장)
          git commit -m "🚀 Massive Data Update: ${{ steps.date.outputs.date }}" || echo "No changes to commit"
          
          # 3. [에러 해결 로직] 원격 저장소 변경사항 가져와서 합치기 (Pull --rebase)
          echo "🔄 Pulling latest changes from remote..."
          git pull origin main --rebase
          
          # 4. 최종 푸시 (이제 에러가 나지 않습니다)
          echo "🚀 Pushing to GitHub..."
          git push origin main

  # ------------------------------------------------------------------
  # JOB 3: 브리핑 이슈 발행
  # ------------------------------------------------------------------
  publish-briefing:
    needs: data-briefing-process
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Create Briefing Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "📢 [${{ needs.data-briefing-process.outputs.date }}] IT 대량 데이터 및 코드 브리핑"
          content-filepath: ./daily_briefing_report.md
          labels: |
            briefing
            automated
