name: Enterprise Hustle Ops (Massive System Build)

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 06:00 KST
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: 엔터프라이즈 시스템 구축 및 가동
  # ------------------------------------------------------------------
  build-and-operate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Enterprise Dependencies
        run: |
          pip install flask pandas sqlalchemy schedule faker openpyxl

      # [1] 시스템 빌더 스크립트 생성 (사용자 요청 코드 탑재)
      - name: Generate System Builder
        run: |
          cat << 'EOF' > setup_enterprise_system.py
          import os, sqlite3, random, time, json, uuid
          from datetime import datetime

          # --- 설정 ---
          BASE_DIR = "app_root"
          NODES = ["server_node_alpha", "server_node_beta", "server_node_gamma"]
          
          # 디렉토리 초기화
          os.makedirs(BASE_DIR, exist_ok=True)
          for node in NODES:
              os.makedirs(os.path.join(BASE_DIR, "storage", node), exist_ok=True)
          os.makedirs(os.path.join(BASE_DIR, "logs"), exist_ok=True)

          # --- [모듈 1] 수집기 (Collector) ---
          COLLECTOR_CODE = r'''
          import sqlite3, os, json, random, uuid
          from datetime import datetime
          
          DB_PATH = os.path.join("app_root", "tax_master.db")
          NODES = ["server_node_alpha", "server_node_beta", "server_node_gamma"]
          PLATFORMS = ["Upwork", "Kmong", "Wishket", "Wanted", "RemoteOK"]
          TITLES = ["Python Auto Script", "Excel Macro Expert", "Data Entry", "Translation KR-EN", "Video Editor"]

          def run():
              print("🚀 [Collector] Starting Bulk Collection...")
              conn = sqlite3.connect(DB_PATH)
              cur = conn.cursor()
              
              # 1. 대량 데이터 생성 (100~200건)
              jobs = []
              for _ in range(random.randint(100, 200)):
                  job = {
                      "id": str(uuid.uuid4()),
                      "platform": random.choice(PLATFORMS),
                      "title": random.choice(TITLES) + " - Urgent",
                      "pay": random.randint(100, 5000) * 1000,
                      "date": datetime.now().strftime("%Y-%m-%d %H:%M:%S")
                  }
                  jobs.append(job)
                  
                  # DB 적재
                  cur.execute("INSERT INTO side_hustle_jobs (job_id, platform, title, pay, collected_at) VALUES (?,?,?,?,?)",
                              (job['id'], job['platform'], job['title'], job['pay'], job['date']))
              
              conn.commit()
              conn.close()
              
              # 2. 분산 서버(JSON 파일) 적재
              for job in jobs:
                  node = random.choice(NODES)
                  path = os.path.join("app_root", "storage", node, f"{job['id']}.json")
                  with open(path, "w") as f: json.dump(job, f, indent=2)
              
              print(f"✅ [Collector] Processed {len(jobs)} jobs across {len(NODES)} nodes.")
          if __name__ == "__main__": run()
          '''

          # --- [모듈 2] 메일러 (Mailer) ---
          MAILER_CODE = r'''
          import sqlite3, os, random
          from datetime import datetime
          
          DB_PATH = os.path.join("app_root", "tax_master.db")
          
          def run():
              print("📧 [Mailer] Starting Mass Email Dispatch...")
              conn = sqlite3.connect(DB_PATH)
              cur = conn.cursor()
              
              # 대상자 조회
              cur.execute("SELECT name, final_tax FROM tax_analysis_results")
              users = cur.fetchall()
              
              sent = 0
              for user in users:
                  status = "SENT" if random.random() > 0.05 else "BOUNCED"
                  subj = f"💰 {user[0]}님, 절세 및 부업 추천 알림"
                  body = f"예상세액 {user[1]}원을 아끼세요."
                  
                  cur.execute("INSERT INTO email_logs (recipient, subject, body, status, sent_at) VALUES (?,?,?,?,?)",
                              (user[0], subj, body, status, datetime.now().strftime("%Y-%m-%d %H:%M:%S")))
                  sent += 1
              
              conn.commit()
              conn.close()
              print(f"✅ [Mailer] Sent {sent} emails (Logged in DB).")
          if __name__ == "__main__": run()
          '''
          
          # --- [시스템 빌더] 실행 로직 ---
          def build():
              print("🏗️ Building Enterprise System...")
              
              # 1. 파일 생성
              with open(os.path.join(BASE_DIR, "collector.py"), "w") as f: f.write(COLLECTOR_CODE)
              with open(os.path.join(BASE_DIR, "mailer.py"), "w") as f: f.write(MAILER_CODE)
              
              # 2. DB 초기화
              conn = sqlite3.connect(os.path.join(BASE_DIR, "tax_master.db"))
              cur = conn.cursor()
              cur.executescript("""
                  CREATE TABLE IF NOT EXISTS tax_analysis_results (name TEXT, salary INTEGER, final_tax INTEGER, applied_rate TEXT, ai_advice TEXT);
                  CREATE TABLE IF NOT EXISTS side_hustle_jobs (id INTEGER PRIMARY KEY AUTOINCREMENT, job_id TEXT, platform TEXT, title TEXT, pay INTEGER, collected_at TEXT);
                  CREATE TABLE IF NOT EXISTS email_logs (id INTEGER PRIMARY KEY AUTOINCREMENT, recipient TEXT, subject TEXT, body TEXT, status TEXT, sent_at TEXT);
              """)
              
              # 3. 샘플 유저 데이터 주입 (메일 발송 대상)
              cur.execute("SELECT COUNT(*) FROM tax_analysis_results")
              if cur.fetchone()[0] == 0:
                  users = [(f"User_{i:03d}", 50000000, 1200000, "15%", "절세필요") for i in range(100)] # 100명 생성
                  cur.executemany("INSERT INTO tax_analysis_results VALUES (?,?,?,?,?)", users)
              
              conn.commit()
              conn.close()
              print("✅ System Build Complete.")

          if __name__ == "__main__": build()
          EOF

      # [2] 시스템 구축 및 엔진 가동
      - name: Execute Enterprise Operations
        run: |
          # 1. 시스템 폴더 및 DB 생성
          python setup_enterprise_system.py
          
          # 2. 수집기 실행 (Collector Engine)
          python app_root/collector.py
          
          # 3. 메일러 실행 (Mailer Engine)
          python app_root/mailer.py

      # [3] 브리핑 리포트 생성 (DB 조회)
      - name: Generate Executive Briefing
        run: |
          cat << 'EOF' > generate_briefing.py
          import sqlite3, os
          from datetime import datetime
          
          conn = sqlite3.connect("app_root/tax_master.db")
          cur = conn.cursor()
          
          job_cnt = cur.execute("SELECT COUNT(*) FROM side_hustle_jobs").fetchone()[0]
          email_cnt = cur.execute("SELECT COUNT(*) FROM email_logs").fetchone()[0]
          user_cnt = cur.execute("SELECT COUNT(*) FROM tax_analysis_results").fetchone()[0]
          
          # 분산 서버 파일 개수 확인
          storage_cnt = 0
          for root, dirs, files in os.walk("app_root/storage"):
              storage_cnt += len(files)

          report = f"""# 🏢 Enterprise System Daily Briefing ({datetime.now().strftime('%Y-%m-%d')})

          ## 1️⃣ 부업 정보 수집 현황
          - **총 수집 공고:** {job_cnt:,} 건
          - **분산 서버 적재:** {storage_cnt:,} Files (JSON Sharding)
          - **서버 노드:** Node_Alpha, Node_Beta, Node_Gamma (Active)

          ## 2️⃣ 마케팅/알림 시스템
          - **관리 회원 수:** {user_cnt:,} 명
          - **금일 이메일 발송:** {email_cnt:,} 건
          - **발송 상태:** ✅ Completed (Logged in DB)

          ## 3️⃣ 시스템 아키텍처
          - **Core:** Python Flask / SQLite
          - **Storage:** Distributed File System (Simulated)
          - **Path:** `app_root/`
          """
          
          with open("daily_enterprise_report.md", "w") as f: f.write(report)
          conn.close()
          EOF
          
          python generate_briefing.py

      # [4] 대시보드 및 결과 출력
      - name: System Dashboard Output
        run: |
          echo "### 🚀 Enterprise Ops Summary" >> $GITHUB_STEP_SUMMARY
          cat daily_enterprise_report.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📂 Distributed Storage Structure" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -R app_root/storage | head -n 20 >> $GITHUB_STEP_SUMMARY
          echo "..." >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # [5] 데이터 동기화 및 영구 저장
      - name: Sync and Commit System Data
        run: |
          git config --global user.name "Enterprise Bot"
          git config --global user.email "bot@enterprise.com"
          
          # app_root 폴더 전체 추가 (DB, JSON 파일, 소스코드 포함)
          git add -f app_root/ daily_enterprise_report.md setup_enterprise_system.py
          
          git commit -m "🏢 Enterprise System Update: $(date +'%Y-%m-%d')" || echo "No changes"
          git pull origin main --rebase
          git push origin main

  # ------------------------------------------------------------------
  # JOB 2: 리포트 발행
  # ------------------------------------------------------------------
  publish-report:
    needs: build-and-operate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Create Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🏢 [브리핑] 엔터프라이즈 시스템 운영 보고서"
          content-filepath: ./daily_enterprise_report.md
          labels: |
            enterprise
            automated
            system-ops
