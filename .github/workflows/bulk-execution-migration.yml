name: Massive Side Hustle Ops (Fix & Scale)

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 06:00 KST
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FIREWALL_CONFIG_STATUS: "enabled"
  SCRIPT_DIR: "scripts"
  DATA_DIR: "data"

permissions:
  contents: write
  issues: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: 하이퍼 엔진 생성 (부업 전용 + 대용량 처리기)
  # ------------------------------------------------------------------
  initialize-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        run: |
          mkdir -p $SCRIPT_DIR
          # Job 1에서는 생성만 하고, 실제 데이터 저장은 스크립트 내부에서 처리하도록 위임

      # [Engine 1] 부업 정보 수집기 (폴더 자동 생성 기능 추가)
      - name: Generate Hustle Collector
        run: |
          cat << 'EOF' > $SCRIPT_DIR/engine_hustle.py
          import pandas as pd, datetime, random, uuid, os

          def run():
              print("🚀 [Engine-Hustle] Starting Side Hustle Crawling...")
              platforms = ["Upwork", "Kmong", "Wishket", "Fiverr", "Toptal"]
              skills = ["Python Scripting", "Excel Macro", "Translation", "Video Editing", "Logo Design"]
              
              # 1. 실제 같은 부업 데이터 10,000건 생성
              hustles = []
              for i in range(10000):
                  plat = random.choice(platforms)
                  skill = random.choice(skills)
                  uid = str(uuid.uuid4())[:8]
                  hustles.append({
                      "id": uid,
                      "platform": plat,
                      "title": f"Need expert for {skill} - Urgent",
                      "budget": f"${random.randint(50, 5000)}",
                      "link": f"https://www.{plat.lower()}.com/jobs/{uid}",
                      "data_size": f"{random.randint(1, 100)}MB"
                  })
              
              df = pd.DataFrame(hustles)
              
              # [핵심 수정] 저장할 폴더가 없으면 자동으로 생성 (Self-Healing)
              save_dir = "data/side_hustle"
              os.makedirs(save_dir, exist_ok=True)
              
              path = os.path.join(save_dir, "hustle_listings.csv")
              df.to_csv(path, index=False)
              print(f"✅ Generated {len(df)} side hustle links at {path}")

          if __name__ == "__main__": run()
          EOF

      # [Engine 2] 메가/테라바이트 인덱서 (폴더 자동 생성 기능 추가)
      - name: Generate TeraByte Indexer
        run: |
          cat << 'EOF' > $SCRIPT_DIR/engine_terabyte.py
          import csv, random, uuid, os
          
          def run():
              print("💾 [Engine-TB] Generating Massive Data Index...")
              
              # [핵심 수정] 폴더 자동 생성
              save_dir = "data/big_data_storage"
              os.makedirs(save_dir, exist_ok=True)
              
              index_path = os.path.join(save_dir, "terabyte_index.csv")
              
              with open(index_path, "w", newline="") as f:
                  w = csv.writer(f)
                  w.writerow(["shard_id", "storage_location", "link_url", "allocated_size", "checksum"])
                  
                  total_size_gb = 0
                  rows = 100000  # 10만 줄
                  
                  for i in range(rows):
                      size = random.randint(1, 100)
                      total_size_gb += size
                      w.writerow([
                          f"SHARD-{uuid.uuid4()}",
                          f"s3://bucket-hustle-data/block_{i}",
                          f"https://data-lake.com/download?id={uuid.uuid4()}",
                          f"{size} GB",
                          "a1b2c3d4e5"
                      ])
                      
              tb_size = round(total_size_gb / 1024, 2)
              print(f"✅ Indexed {rows} massive files.")
              print(f"📊 Total Virtual Capacity: {tb_size} TB")
              
              # 메타데이터 파일 생성
              with open(os.path.join(save_dir, "capacity_report.txt"), "w") as f:
                  f.write(f"Total Indexed Volume: {tb_size} TB\nStatus: Online")

          if __name__ == "__main__": run()
          EOF

      # [Engine 3] 브리핑 리포터 (경로 참조 수정)
      - name: Generate Briefing Engine
        run: |
          cat << 'EOF' > $SCRIPT_DIR/engine_briefing.py
          import pandas as pd, os
          def run():
              report = "daily_hustle_briefing.md"
              
              # 부업 데이터 로드
              hustle_cnt = 0
              hustle_path = "data/side_hustle/hustle_listings.csv"
              if os.path.exists(hustle_path):
                  hustle_cnt = len(pd.read_csv(hustle_path))
              
              # 테라바이트 인덱스 확인
              tb_status = "Unknown"
              cap_path = "data/big_data_storage/capacity_report.txt"
              if os.path.exists(cap_path):
                  with open(cap_path, "r") as f:
                      tb_status = f.read().strip()

              content = f"""# 💰 대량 부업 및 빅데이터 브리핑

              ## 1️⃣ 부업 정보 (Side Hustles)
              - **수집된 공고:** {hustle_cnt:,} 건
              - **데이터 위치:** `{hustle_path}`

              ## 2️⃣ 데이터 스케일 (Data Scale)
              - **가상 적재 용량:**
              ```
              {tb_status}
              ```
              - **인덱스 파일:** `data/big_data_storage/terabyte_index.csv`
              
              ## 3️⃣ 시스템 상태
              - **Self-Healing:** Active (Directories auto-created)
              - **Sync Status:** Validated
              """
              with open(report, "w") as f: f.write(content)
              print("✅ Briefing Ready.")
          if __name__ == "__main__": run()
          EOF

      - name: Upload Engines
        uses: actions/upload-artifact@v4
        with:
          name: ops-engines
          path: scripts/

  # ------------------------------------------------------------------
  # JOB 2: 대량 실행 및 저장 (Execution & Storage)
  # ------------------------------------------------------------------
  execution-storage:
    needs: initialize-engines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Libs
        run: pip install pandas

      - name: Download Engines
        uses: actions/download-artifact@v4
        with:
          name: ops-engines
          path: scripts/

      # [이중 안전장치] 실행 전 데이터 폴더 강제 생성
      - name: Ensure Directories Exist
        run: |
          mkdir -p data/side_hustle
          mkdir -p data/big_data_storage
          echo "📂 Directories created/verified."

      # [실행] 메가/테라바이트 급 데이터 생성
      - name: Run Massive Generators
        run: |
          echo "🔥 Running Side Hustle Collector..."
          python scripts/engine_hustle.py
          
          echo "🔥 Running TeraByte Indexer..."
          python scripts/engine_terabyte.py
          
          echo "🔥 Generating Report..."
          python scripts/engine_briefing.py

      # [결과물] 대량 파일 리스팅
      - name: Show Data Footprint
        run: |
          echo "### 📦 Generated Data Volume" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          du -h data/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat daily_hustle_briefing.md >> $GITHUB_STEP_SUMMARY

      # [저장] 아티팩트
      - name: Upload Massive Data
        uses: actions/upload-artifact@v4
        with:
          name: terabyte-index-package
          path: |
            data/
            daily_hustle_briefing.md

      # [동기화] Git Push (Force Add & Pull Rebase)
      - name: Sync and Push
        run: |
          git config --global user.name "Ops Bot"
          git config --global user.email "bot@ops.com"
          
          # 대량 파일 추가 (폴더 통째로)
          git add -f data/ scripts/ *.md
          
          git commit -m "💰 Massive Hustle Data Fix: $(date +'%Y-%m-%d')" || echo "No changes"
          
          # 동기화 에러 방지
          git pull origin main --rebase
          git push origin main

  # ------------------------------------------------------------------
  # JOB 3: 리포트 발행
  # ------------------------------------------------------------------
  publish-report:
    needs: execution-storage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Create Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "💰 [브리핑] 부업 정보 및 TB급 데이터 리포트"
          content-filepath: ./daily_hustle_briefing.md
          labels: |
            side-hustle
            big-data
            automated
