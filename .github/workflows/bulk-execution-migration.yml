name: Bulk Execution Migration (Content Reflection)

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 KST
  workflow_dispatch:

env:
  FIREWALL_CONFIG_STATUS: "enabled"
  RUN_ALL_CHECKS: "true"
  SCRIPT_DIR: "scripts"
  DATA_DIR: "data"

permissions:
  contents: write
  issues: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: 엔진 초기화 (스크립트 생성)
  # ------------------------------------------------------------------
  engine-initialization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Directories
        run: |
          mkdir -p $SCRIPT_DIR
          mkdir -p $DATA_DIR

      # [1] 데이터 수집 엔진 생성
      - name: Generate Collector Engine
        run: |
          cat << 'EOF' > $SCRIPT_DIR/engine_collector.py
          import requests, pandas as pd, datetime, os
          def run():
              print("🚀 [Collector] Scanning Job Market...")
              data = [{"title": "DevOps Engineer", "company": "Tech-" + str(i), "date": str(datetime.date.today())} for i in range(1, 101)]
              df = pd.DataFrame(data)
              os.makedirs("data", exist_ok=True)
              df.to_csv("data/real_jobs.csv", index=False)
              print(f"✅ Collected {len(data)} jobs.")
          if __name__ == "__main__": run()
          EOF

      # [2] 대량 데이터 공장 생성 (10,000건)
      - name: Generate Factory Engine
        run: |
          cat << 'EOF' > $SCRIPT_DIR/engine_factory.py
          import os, csv, random, datetime, uuid
          def run():
              print("🏭 [Factory] Generating Massive Data...")
              os.makedirs("data/jobs", exist_ok=True)
              os.makedirs("data/logs", exist_ok=True)
              
              # CSV 생성
              with open("data/jobs/mass_db.csv", "w", newline="") as f:
                  w = csv.writer(f)
                  w.writerow(["id", "role", "salary", "status"])
                  for i in range(10000):
                      w.writerow([str(uuid.uuid4())[:8], "Security Expert", f"${random.randint(80,150)}k", "Open"])
              
              # 로그 파일 생성
              for i in range(50):
                  with open(f"data/logs/server_{i}.log", "w") as f:
                      f.write(f"Server {i} Status: OK\nTraffic: {random.randint(100,9999)}MB")
              print("✅ Generated 10,000 jobs & 50 logs.")
          if __name__ == "__main__": run()
          EOF

      # [3] 브리핑 생성기
      - name: Generate Briefing Engine
        run: |
          cat << 'EOF' > $SCRIPT_DIR/engine_briefing.py
          import pandas as pd, datetime, os
          def run():
              today = datetime.datetime.now().strftime("%Y-%m-%d")
              report = "daily_briefing_report.md"
              
              real_cnt = len(pd.read_csv("data/real_jobs.csv")) if os.path.exists("data/real_jobs.csv") else 0
              mass_cnt = len(pd.read_csv("data/jobs/mass_db.csv")) if os.path.exists("data/jobs/mass_db.csv") else 0
              
              content = f"""# 📢 IT 대량 데이터 브리핑 ({today})

              ## 1️⃣ 데이터 처리 요약
              - **실시간 수집:** {real_cnt} 건
              - **대량 생성:** {mass_cnt:,} 건
              - **총 데이터:** {real_cnt + mass_cnt:,} Rows
              
              ## 2️⃣ 시스템 상태
              - **Firewall:** ✅ Active
              - **Engines:** 3 Active
              
              ## 3️⃣ 워크플로우 코드
              > (Attached below in repository)
              """
              
              with open(report, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"✅ Report generated: {report}")
          if __name__ == "__main__": run()
          EOF

      # 스크립트 아티팩트 업로드
      - name: Upload Script Engines
        uses: actions/upload-artifact@v4
        with:
          name: python-engines
          path: scripts/

  # ------------------------------------------------------------------
  # JOB 2: 실행 및 동기화 (내용 반영 핵심)
  # ------------------------------------------------------------------
  execution-and-sync:
    needs: engine-initialization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Libs
        run: pip install pandas requests

      - name: Download Engines
        uses: actions/download-artifact@v4
        with:
          name: python-engines
          path: scripts/

      # [실행] 엔진 가동
      - name: Ignite Engines
        run: |
          python scripts/engine_collector.py
          python scripts/engine_factory.py
          python scripts/engine_briefing.py

      # ★ [추가 기능 1] 깃허브 실행 화면(Summary)에 브리핑 내용 출력 ★
      - name: Display Briefing on GitHub Summary
        run: |
          cat daily_briefing_report.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📂 Created Data Structure" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -R data/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # ★ [추가 기능 2] 대량 데이터 파일들도 아티팩트로 업로드 (스크린샷에 반영됨) ★
      - name: Upload Massive Data Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: massive-data-package
          path: |
            data/
            daily_briefing_report.md
            scripts/

      # Git 동기화 및 반영
      - name: Sync and Push
        run: |
          git config --global user.name "Ops Bot"
          git config --global user.email "bot@ops.com"
          git add -f scripts/ data/ *.md
          git commit -m "🚀 Content Reflected: $(date +'%Y-%m-%d')" || echo "No changes"
          git pull origin main --rebase
          git push origin main

  # ------------------------------------------------------------------
  # JOB 3: 리포트 발행
  # ------------------------------------------------------------------
  publish-report:
    needs: execution-and-sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Create Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🚀 [브리핑] 대량 데이터 처리 결과보고서"
          content-filepath: ./daily_briefing_report.md
          labels: |
            briefing
            content-reflected
