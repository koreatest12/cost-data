name: Final Omnibus Ops (All-in-One Massive Upgrade)

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 06:00 KST
  push:
    branches: [ main ]
  workflow_dispatch:      # 수동 재수행 버튼

permissions:
  contents: write
  issues: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: 통합 마스터 엔진 가동 (인프라 + 데이터 + 서비스)
  # ------------------------------------------------------------------
  omnibus-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # [외부 리소스] 코스트 데이터 리포지토리 클론
      - name: Checkout External Resources
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: external_resources
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # [통합 엔진] Python 스크립트 생성
      - name: Generate Omnibus Engine
        run: |
          cat << 'EOF' > omnibus_engine.py
          import os, sqlite3, random, uuid, json, datetime, shutil

          # --- [설정] ---
          ROOT_DIR = "omnibus_datacenter"
          EXT_REPO = "external_resources"
          DB_PATH = os.path.join(ROOT_DIR, "central_brain.db")
          
          # 마이크로서비스 아키텍처 정의
          SERVICES = {
              "svc-payment": 15, "svc-backend-java": 20, "svc-data-python": 20,
              "svc-frontend-node": 15, "svc-auth-go": 10, "infra-redis": 10,
              "infra-kafka": 10, "infra-postgres": 5, "ops-email-sender": 5
          }

          def log(msg):
              print(f"[{datetime.datetime.now().strftime('%H:%M:%S')}] {msg}")

          # ---------------------------------------------------------
          # 1. [인프라] 서버 프로비저닝 및 기본 설치
          # ---------------------------------------------------------
          def provision_infrastructure():
              log("🏗️ [Infra] Provisioning 110+ Server Nodes...")
              os.makedirs(ROOT_DIR, exist_ok=True)
              os.makedirs(os.path.join(ROOT_DIR, "backups"), exist_ok=True)
              
              nodes_created = 0
              for svc, count in SERVICES.items():
                  for i in range(1, count + 1):
                      hostname = f"{svc}-node-{i:03d}"
                      base_path = os.path.join(ROOT_DIR, "clusters", svc, hostname)
                      
                      # 디렉토리 구조
                      os.makedirs(os.path.join(base_path, "etc"), exist_ok=True)
                      os.makedirs(os.path.join(base_path, "var/log"), exist_ok=True)
                      os.makedirs(os.path.join(base_path, "opt/app/bin"), exist_ok=True)
                      os.makedirs(os.path.join(base_path, "opt/app/data"), exist_ok=True)
                      os.makedirs(os.path.join(base_path, "docker"), exist_ok=True)

                      # Config v1.0 배포
                      config = {
                          "host": hostname, "role": svc, "version": "1.0.0-legacy",
                          "resources": {"cpu": "4Core", "ram": "16GB"},
                          "created_at": str(datetime.datetime.now())
                      }
                      with open(os.path.join(base_path, "etc", "config.json"), "w") as f:
                          json.dump(config, f, indent=2)

                      # Dockerfile 생성
                      with open(os.path.join(base_path, "docker", "Dockerfile"), "w") as f:
                          f.write(f"FROM {svc.split('-')[1]}:latest\nWORKDIR /app\nCOPY . .\nCMD [\"run\"]")
                          
                      nodes_created += 1
              
              log(f"✅ [Infra] {nodes_created} servers provisioned.")

          # ---------------------------------------------------------
          # 2. [통합] 외부 리소스(`koreatest12/cost-data`) 배포
          # ---------------------------------------------------------
          def deploy_external_resources():
              log(f"📦 [Deploy] Integrating resources from '{EXT_REPO}'...")
              conn = sqlite3.connect(DB_PATH)
              cur = conn.cursor()
              cur.execute("CREATE TABLE IF NOT EXISTS deploy_history (id TEXT, file TEXT, target TEXT, status TEXT)")
              
              if not os.path.exists(EXT_REPO):
                  log("⚠️ External repo not found.")
                  return

              deployed_cnt = 0
              for root, dirs, files in os.walk(EXT_REPO):
                  if ".git" in root: continue
                  for file in files:
                      ext = file.split('.')[-1]
                      
                      # 확장자 기반 라우팅
                      target = "svc-backend-java" if ext in ["java", "jar"] else \
                               "svc-data-python" if ext in ["py", "csv"] else \
                               "svc-frontend-node" if ext in ["js", "ts", "css"] else \
                               "infra-postgres"
                      
                      # 해당 클러스터의 첫 번째 노드에 배포 (샘플)
                      target_path = os.path.join(ROOT_DIR, "clusters", target, f"{target}-node-001", "opt/app/data", file)
                      # 폴더가 존재할 때만 복사
                      if os.path.exists(os.path.dirname(target_path)):
                          shutil.copy(os.path.join(root, file), target_path)
                          cur.execute("INSERT INTO deploy_history VALUES (?,?,?,?)", 
                                      (str(uuid.uuid4()), file, target, "SUCCESS"))
                          deployed_cnt += 1

              conn.commit()
              conn.close()
              log(f"✅ [Deploy] {deployed_cnt} external files deployed to clusters.")

          # ---------------------------------------------------------
          # 3. [운영] 시스템 대규모 업그레이드 (Rolling Update)
          # ---------------------------------------------------------
          def upgrade_system_version():
              log("🚀 [Upgrade] Performing Rolling Update (v1.0 -> v2.5)...")
              upgraded = 0
              cluster_root = os.path.join(ROOT_DIR, "clusters")
              
              for svc in os.listdir(cluster_root):
                  svc_path = os.path.join(cluster_root, svc)
                  for host in os.listdir(svc_path):
                      cfg_path = os.path.join(svc_path, host, "etc", "config.json")
                      
                      # 백업
                      shutil.copy(cfg_path, os.path.join(ROOT_DIR, "backups", f"{host}.bkp"))
                      
                      # 패치 적용
                      with open(cfg_path, "r") as f: data = json.load(f)
                      data['version'] = "2.5.0-Enterprise"
                      data['security_patch'] = "APPLIED"
                      data['last_updated'] = str(datetime.datetime.now())
                      
                      with open(cfg_path, "w") as f: json.dump(data, f, indent=2)
                      upgraded += 1
                      
              log(f"✨ [Upgrade] {upgraded} nodes upgraded successfully.")

          # ---------------------------------------------------------
          # 4. [데이터] 대규모 데이터 생성 (부업/채용 + 트랜잭션)
          # ---------------------------------------------------------
          def inject_massive_data():
              log("💾 [Data] Generating Massive Dataset (Jobs & Transactions)...")
              conn = sqlite3.connect(DB_PATH)
              cur = conn.cursor()
              
              # 테이블 생성
              cur.execute("CREATE TABLE IF NOT EXISTS job_market (id TEXT, title TEXT, pay INTEGER, platform TEXT)")
              cur.execute("CREATE TABLE IF NOT EXISTS transactions (id TEXT, svc TEXT, amount INTEGER, status TEXT)")
              cur.execute("CREATE TABLE IF NOT EXISTS email_logs (id TEXT, recipient TEXT, subject TEXT, sent_at TEXT)")

              # 1. 부업 정보 50,000건 (이전 요청 반영)
              jobs = []
              titles = ["Python Scripting", "Data Labeling", "Translation", "Java Dev", "DevOps"]
              for _ in range(50000):
                  jobs.append((str(uuid.uuid4()), random.choice(titles), random.randint(10,500)*100, "RemoteOK"))
              cur.executemany("INSERT INTO job_market VALUES (?,?,?,?)", jobs)
              
              # 2. 인프라 트랜잭션 100,000건
              txs = []
              for _ in range(100000):
                  txs.append((str(uuid.uuid4()), "svc-payment", random.randint(100,9999), "COMPLETED"))
              cur.executemany("INSERT INTO transactions VALUES (?,?,?,?)", txs)
              
              # 3. 이메일 발송 로그 5,000건
              emails = []
              for i in range(5000):
                  emails.append((str(uuid.uuid4()), f"user_{i}@test.com", "System Upgrade Notice", str(datetime.datetime.now())))
              cur.executemany("INSERT INTO email_logs VALUES (?,?,?,?)", emails)

              conn.commit()
              conn.close()
              log("✅ [Data] 155,000+ records injected into Central DB.")

          # ---------------------------------------------------------
          # 5. [리포트] 결과 보고서 생성
          # ---------------------------------------------------------
          def generate_report():
              conn = sqlite3.connect(DB_PATH)
              job_cnt = conn.execute("SELECT COUNT(*) FROM job_market").fetchone()[0]
              tx_cnt = conn.execute("SELECT COUNT(*) FROM transactions").fetchone()[0]
              email_cnt = conn.execute("SELECT COUNT(*) FROM email_logs").fetchone()[0]
              deploy_cnt = conn.execute("SELECT COUNT(*) FROM deploy_history").fetchone()[0]
              conn.close()

              report = f"""# 🏢 Final Omnibus Ops Report ({datetime.date.today()})

              ## 1️⃣ 인프라 및 시스템 상태
              - **총 서버 노드:** 110+ Nodes
              - **서비스 구성:** Java, Python, Node, Go, Redis, Kafka, Postgres
              - **버전 상태:** v1.0 ➡️ **v2.5-Enterprise (Upgraded)**
              - **보안 패치:** ✅ All Applied

              ## 2️⃣ 데이터 자산 현황 (Massive Scale)
              - **부업/채용 데이터:** {job_cnt:,} 건
              - **결제 트랜잭션:** {tx_cnt:,} 건
              - **이메일 발송 로그:** {email_cnt:,} 건
              - **총 데이터 레코드:** {job_cnt + tx_cnt + email_cnt:,} Rows

              ## 3️⃣ 통합 배포 (`koreatest12/cost-data`)
              - **외부 리소스 배포:** {deploy_cnt:,} Files
              - **적재 전략:** File Type Based Routing
              """
              with open("daily_omnibus_report.md", "w", encoding="utf-8") as f:
                  f.write(report)
              log("📄 Omnibus Report Generated.")

          if __name__ == "__main__":
              provision_infrastructure()   # 1. 서버 구축
              deploy_external_resources()  # 2. 외부 데이터 적재
              upgrade_system_version()     # 3. 시스템 업그레이드
              inject_massive_data()        # 4. 데이터 대량 생성
              generate_report()            # 5. 리포트 발행
          EOF

          # 엔진 가동
          python omnibus_engine.py

      # [결과 확인]
      - name: Verify Operations
        run: |
          echo "📂 Checking Cluster Structure..."
          ls -R omnibus_datacenter/clusters/svc-backend-java/ | head -n 10

      # [아티팩트 업로드]
      - name: Upload Omnibus Assets
        uses: actions/upload-artifact@v4
        with:
          name: omnibus-assets
          path: |
            daily_omnibus_report.md
            omnibus_datacenter/

      # [Git 반영] 대량 파일 커밋
      - name: Commit & Push Everything
        run: |
          git config --global user.name "Omnibus Bot"
          git config --global user.email "bot@omnibus.com"
          
          # 모든 생성 파일 강제 추가
          git add -f omnibus_datacenter/ daily_omnibus_report.md
          
          git commit -m "🚀 Final Omnibus: Infra, Data, Upgrade & Integration: $(date +'%Y-%m-%d')" || echo "No changes"
          git pull origin main --rebase
          git push origin main

  # ------------------------------------------------------------------
  # JOB 2: 리포트 발행
  # ------------------------------------------------------------------
  publish-report:
    needs: omnibus-simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download Report
        uses: actions/download-artifact@v4
        with:
          name: omnibus-assets
          path: .

      - name: Create Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🚀 [완결] 인프라/데이터/업그레이드 통합 수행 리포트"
          content-filepath: ./daily_omnibus_report.md
          labels: |
            omnibus
            infrastructure
            massive-data
            automated
