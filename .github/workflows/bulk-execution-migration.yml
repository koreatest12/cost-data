name: Bulk Script Execution and DB Migration

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 수동 실행 가능

jobs:
  execute-and-migrate:
    runs-on: ubuntu-latest

    services:
      # DB 마이그레이션을 위한 PostgreSQL 서비스 (필요시 사용)
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cost_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # 필요한 기본 패키지 설치
          pip install psycopg2-binary requests

      - name: Validate Scripts Permission
        run: |
          chmod +x validate-agent.sh
          # 모든 쉘 스크립트에 실행 권한 부여
          find . -name "*.sh" -exec chmod +x {} +

      - name: Run DB Migration & Initialization
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: cost_db
          DB_USER: user
          DB_PASSWORD: password
        run: |
          echo "Starting DB Migration..."
          # 여기에 마이그레이션 스크립트가 있다면 실행 (예: alembic upgrade head 또는 커스텀 스크립트)
          # 예시: python migrate.py 

      - name: Bulk Execute Server Manager Scripts
        run: |
          echo "Executing bulk operations for server management..."
          
          # 1. 서버 추가 (대량 예시)
          python3 server_manager.py add --server-id server-01 --cpu 4 --memory 8
          python3 server_manager.py add --server-id server-02 --cpu 8 --memory 16
          
          # 2. 디스크 설치 및 업그레이드 테스트
          python3 server_manager.py install-disk --server-id server-01 --disk 500
          python3 server_manager.py upgrade --server-id server-02 --cpu 16 --memory 32
          
          # 3. 용량 체크
          python3 server_manager.py check-capacity --server-id server-01
          python3 server_manager.py check-capacity --server-id server-02

      - name: Run Validation Scripts
        run: |
          echo "Running system validation..."
          ./validate-agent.sh

      - name: Finalizing and Artifact Backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: |
            *.log
            *.json
