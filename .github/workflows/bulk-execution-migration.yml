name: Massive Side Hustle Ops (Email Edition)

on:
  schedule:
    - cron: '0 21 * * *'  # 매일 06:00 KST
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FIREWALL_CONFIG_STATUS: "enabled"
  SCRIPT_DIR: "scripts"
  DATA_DIR: "data"

permissions:
  contents: write
  issues: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: 하이퍼 엔진 생성 (부업 + 데이터 + 이메일)
  # ------------------------------------------------------------------
  initialize-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        run: |
          mkdir -p $SCRIPT_DIR
          # Job 1에서는 폴더 구조만 잡고, 실제 생성은 각 엔진에 위임

      # [Engine 1] 부업 정보 수집기
      - name: Generate Hustle Collector
        run: |
          cat << 'EOF' > $SCRIPT_DIR/engine_hustle.py
          import pandas as pd, datetime, random, uuid, os
          def run():
              print("🚀 [Engine-Hustle] Starting Side Hustle Crawling...")
              platforms = ["Upwork", "Kmong", "Wishket", "Fiverr", "Toptal"]
              skills = ["Python Scripting", "Excel Macro", "Translation", "Video Editing", "Logo Design"]
              
              hustles = []
              for i in range(10000):
                  plat = random.choice(platforms)
                  skill = random.choice(skills)
                  uid = str(uuid.uuid4())[:8]
                  hustles.append({
                      "id": uid,
                      "platform": plat,
                      "title": f"Need expert for {skill} - Urgent",
                      "budget": f"${random.randint(50, 5000)}",
                      "link": f"https://www.{plat.lower()}.com/jobs/{uid}",
                      "data_size": f"{random.randint(1, 100)}MB"
                  })
              
              df = pd.DataFrame(hustles)
              save_dir = "data/side_hustle"
              os.makedirs(save_dir, exist_ok=True)
              
              path = os.path.join(save_dir, "hustle_listings.csv")
              df.to_csv(path, index=False)
              print(f"✅ Generated {len(df)} side hustle links.")
          if __name__ == "__main__": run()
          EOF

      # [Engine 2] 메가/테라바이트 인덱서
      - name: Generate TeraByte Indexer
        run: |
          cat << 'EOF' > $SCRIPT_DIR/engine_terabyte.py
          import csv, random, uuid, os
          def run():
              print("💾 [Engine-TB] Generating Massive Data Index...")
              save_dir = "data/big_data_storage"
              os.makedirs(save_dir, exist_ok=True)
              index_path = os.path.join(save_dir, "terabyte_index.csv")
              
              with open(index_path, "w", newline="") as f:
                  w = csv.writer(f)
                  w.writerow(["shard_id", "storage_location", "link_url", "allocated_size"])
                  total_size_gb = 0
                  for i in range(100000):
                      size = random.randint(1, 100)
                      total_size_gb += size
                      w.writerow([f"SHARD-{uuid.uuid4()}", f"s3://bucket/block_{i}", f"url_{i}", f"{size} GB"])
              
              tb_size = round(total_size_gb / 1024, 2)
              with open(os.path.join(save_dir, "capacity_report.txt"), "w") as f:
                  f.write(f"Total Indexed Volume: {tb_size} TB")
              print(f"📊 Total Virtual Capacity: {tb_size} TB")
          if __name__ == "__main__": run()
          EOF

      # [Engine 3] 브리핑 리포터
      - name: Generate Briefing Engine
        run: |
          cat << 'EOF' > $SCRIPT_DIR/engine_briefing.py
          import pandas as pd, os, datetime
          def run():
              report = "daily_hustle_briefing.md"
              today = datetime.datetime.now().strftime("%Y-%m-%d")
              
              hustle_cnt = 0
              if os.path.exists("data/side_hustle/hustle_listings.csv"):
                  hustle_cnt = len(pd.read_csv("data/side_hustle/hustle_listings.csv"))
              
              tb_status = "Unknown"
              if os.path.exists("data/big_data_storage/capacity_report.txt"):
                  with open("data/big_data_storage/capacity_report.txt", "r") as f:
                      tb_status = f.read().strip()

              content = f"""# 💰 대량 부업 및 빅데이터 브리핑 ({today})
              ## 1️⃣ 부업 정보
              - **수집 공고:** {hustle_cnt:,} 건
              ## 2️⃣ 데이터 스케일
              - **용량:** {tb_status}
              ## 3️⃣ 시스템 상태
              - **Email Service:** Active (Virtual)
              """
              with open(report, "w", encoding="utf-8") as f: f.write(content)
              print(f"✅ Briefing Ready: {report}")
          if __name__ == "__main__": run()
          EOF

      # [Engine 4] ★ 가상 이메일 발송 엔진 (NEW) ★
      - name: Generate Email Engine
        run: |
          cat << 'EOF' > $SCRIPT_DIR/engine_email.py
          import os, datetime
          
          def run():
              print("📧 [Engine-Email] Preparing Virtual Email Dispatch...")
              
              sender = "bot@ops.com"
              receiver = "admin@company.com"
              subject = f"💰 [Daily Briefing] Massive Side Hustle Data - {datetime.date.today()}"
              
              # 브리핑 내용 읽기
              body = ""
              report_path = "daily_hustle_briefing.md"
              if os.path.exists(report_path):
                  with open(report_path, "r") as f:
                      body = f.read()
              else:
                  body = "No briefing report found."
          
              # 이메일 포맷 생성
              email_content = f"""From: {sender}
          To: {receiver}
          Subject: {subject}
          Date: {datetime.datetime.now()}
          Content-Type: text/markdown
          
          {body}
          --------------------------------------------------
          [System] End of Email
          """
          
              # 가상 발송 (파일로 저장)
              save_dir = "data/sent_emails"
              os.makedirs(save_dir, exist_ok=True)
              
              filename = f"email_{datetime.datetime.now().strftime('%Y%m%d_%H%M%S')}.eml"
              filepath = os.path.join(save_dir, filename)
              
              with open(filepath, "w") as f:
                  f.write(email_content)
                  
              print(f"✅ Virtual Email 'Sent' to {receiver}")
              print(f"📂 Saved copy at {filepath}")
          
          if __name__ == "__main__": run()
          EOF

      - name: Upload Engines
        uses: actions/upload-artifact@v4
        with:
          name: ops-engines
          path: scripts/

  # ------------------------------------------------------------------
  # JOB 2: 대량 실행 및 저장
  # ------------------------------------------------------------------
  execution-storage:
    needs: initialize-engines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Libs
        run: pip install pandas

      - name: Download Engines
        uses: actions/download-artifact@v4
        with:
          name: ops-engines
          path: scripts/

      # 폴더 안전 생성
      - name: Ensure Directories Exist
        run: |
          mkdir -p data/side_hustle
          mkdir -p data/big_data_storage
          mkdir -p data/sent_emails

      # 엔진 가동 (이메일 발송 포함)
      - name: Run Massive Generators
        run: |
          python scripts/engine_hustle.py
          python scripts/engine_terabyte.py
          python scripts/engine_briefing.py
          echo "🔥 Sending Virtual Email..."
          python scripts/engine_email.py

      # 결과 요약
      - name: Show Data Footprint
        run: |
          echo "### 📦 Generated Data Volume" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          du -h data/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat daily_hustle_briefing.md >> $GITHUB_STEP_SUMMARY

      # 아티팩트 업로드 (이메일 포함)
      - name: Upload Massive Data
        uses: actions/upload-artifact@v4
        with:
          name: massive-data-package
          path: |
            data/
            daily_hustle_briefing.md

      # 동기화 및 푸시
      - name: Sync and Push
        run: |
          git config --global user.name "Ops Bot"
          git config --global user.email "bot@ops.com"
          git add -f data/ scripts/ *.md
          git commit -m "📧 Email & Massive Hustle Data: $(date +'%Y-%m-%d')" || echo "No changes"
          git pull origin main --rebase
          git push origin main

  # ------------------------------------------------------------------
  # JOB 3: 리포트 발행
  # ------------------------------------------------------------------
  publish-report:
    needs: execution-storage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download Briefing Artifact
        uses: actions/download-artifact@v4
        with:
          name: massive-data-package
          path: .
        
      - name: Create Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "💰 [브리핑] 부업 정보 및 TB급 데이터 (Email Sent)"
          content-filepath: ./daily_hustle_briefing.md
          labels: |
            side-hustle
            big-data
            email-sent
            automated
