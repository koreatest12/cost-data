name: KCA 정보보안기사 대량 아카이빙 시스템 (v3.0 Bypass)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  archive-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 필수 디렉토리 생성
        run: mkdir -p data/kca-notifications scripts/kca-monitor

      # [핵심] curl_cffi 설치 (403 우회용)
      - name: 라이브러리 설치
        run: pip install curl_cffi beautifulsoup4

      - name: 대량 수집 및 아카이빙 실행
        id: run_script
        run: python scripts/kca-monitor/kca_exam_monitor.py

      - name: 전체 보드 및 데이터 업데이트 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ KCA_NOTICE_BOARD.md
          
          if ! git diff --staged --quiet; then
            git commit -m "🚀 KCA 정보보안기사 데이터 업데이트 (신규: ${{ steps.run_script.outputs.new_count }}건)"
            git pull --rebase origin main
            git push origin main
          fi

      - name: 신규 정보 발생 시 Issue 알림
        if: steps.run_script.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('data/kca-notifications/latest_report.md')) {
              const report = fs.readFileSync('data/kca-notifications/latest_report.md', 'utf8');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📚 [신규] 정보보안기사 학습 정보 업데이트`,
                body: report + "\n\n---\n[전체 대시보드 바로가기](./KCA_NOTICE_BOARD.md)",
                labels: ['kca-exam', 'study-material']
              });
            }
