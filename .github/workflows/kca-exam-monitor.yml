name: KCA 정보보안기사 대량 모니터링 시스템

on:
  schedule:
    - cron: '0 * * * *' # 매시간 정각 실행
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/kca-monitor/**'

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    name: 모니터링 - ${{ matrix.category }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 모니터링할 카테고리를 확장 가능합니다.
        include:
          - category: "security-exam"
            name: "정보보안기사 공지"
            target_url: "https://www.cq.or.kr/main.do" # 예시 URL
          - category: "general-notice"
            name: "KCA 일반 공지"
            target_url: "https://www.kca.or.kr/main.do"

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/kca-monitor/requirements.txt
          # 크롤링 안정성을 위한 추가 라이브러리 (필요시)
          pip install requests beautifulsoup4 fake-useragent

      - name: 데이터 디렉토리 생성
        run: mkdir -p data/kca-notifications/${{ matrix.category }}

      - name: KCA 공지사항 대량 크롤링
        id: monitor
        run: |
          echo "실행 카테고리: ${{ matrix.name }}"
          # 스크립트에 카테고리 인자를 전달하여 처리하도록 수정 필요
          python scripts/kca-monitor/kca_exam_monitor.py --category ${{ matrix.category }}
        env:
          USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

      - name: 변경사항 커밋 및 동기화
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kca-notifications/
          
          if git diff --staged --quiet; then
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S KST')
            git commit -m "🔔 [${{ matrix.name }}] 업데이트 - $TIMESTAMP"
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: 안전한 푸시 (충돌 방지)
        if: steps.commit.outputs.committed == 'true'
        run: |
          git pull --rebase origin main
          git push origin main

      - name: 결과 요약 보고 (Job Summary)
        if: always()
        run: |
          echo "### 🚀 ${{ matrix.name }} 결과" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/kca-notifications/${{ matrix.category }}/latest_report.md" ]; then
            cat data/kca-notifications/${{ matrix.category }}/latest_report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "새로운 변경사항이 없습니다." >> $GITHUB_STEP_SUMMARY
          fi

      - name: 실패 알림 생성
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ 모니터링 실패: ${{ matrix.name }}`,
              body: `워크플로우 실행 중 오류가 발생했습니다. 로그를 확인하세요: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              labels: ['bug', 'alert']
            });
