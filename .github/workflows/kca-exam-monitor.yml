name: KCA 정보보안기사 통합 시스템 (All-in-One)

on:
  schedule:
    - cron: '0 */4 * * *'  # 4시간마다 자동 실행 (대량 갱신)
  workflow_dispatch:       # 수동 실행 버튼
  push:
    branches: [ main ]     # 코드 푸시 시 실행

permissions:
  contents: write
  issues: write

jobs:
  run-integrated-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 📂 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 필수 라이브러리 대량 설치
        # curl_cffi: 403 차단 우회용 핵심 엔진
        # pytz: 한국 시간대 처리
        run: |
          pip install curl_cffi beautifulsoup4 requests pytz

      - name: 🛠️ 디렉토리 자동 생성
        run: mkdir -p scripts data

      - name: 🚀 통합 스크립트 실행 (일정주입+크롤링+뉴스+대시보드)
        run: python scripts/kca_all_in_one.py

      - name: 💾 결과 대량 반영 (Git Commit & Push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 생성된 모든 데이터와 대시보드 추가
          git add KCA_NOTICE_BOARD.md data/
          
          # 변경사항이 있을 경우에만 커밋
          if ! git diff --staged --quiet; then
            git commit -m "🚀 [Auto] KCA 정보보안기사 및 보안뉴스 대량 업데이트 ($(date +'%Y-%m-%d %H:%M'))"
            git pull --rebase origin main
            git push origin main
          else
            echo "변경사항이 없어 커밋하지 않습니다."
          fi
