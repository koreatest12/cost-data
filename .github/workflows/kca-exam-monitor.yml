name: KCA 정보보안기사 대량 모니터링

on:
  schedule:
    - cron: '0 * * * *'  # 매시간 정각 실행
  workflow_dispatch:      # 수동 실행 버튼 활성화
  push:
    branches: [ main ]
    paths:
      - 'scripts/kca-monitor/**'

permissions:
  contents: write
  issues: write

jobs:
  kca-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 대량 모니터링 스크립트 실행
        id: monitor_run
        run: python scripts/kca-monitor/kca_exam_monitor.py

      - name: 변경사항 커밋 및 푸시
        if: steps.monitor_run.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kca-notifications/
          git commit -m "🔔 KCA 공지사항 업데이트: ${{ steps.monitor_run.outputs.new_count }}건"
          git pull --rebase origin main
          git push origin main

      - name: 신규 공지 Issue 발행
        if: steps.monitor_run.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('data/kca-notifications/latest_report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📢 KCA 신규 공지 알림 (${new Date().toLocaleDateString('ko-KR')})`,
              body: report,
              labels: ['notification', 'kca-exam']
            });

      - name: 실행 결과 요약
        if: always()
        run: |
          echo "### 🚀 모니터링 실행 완료" >> $GITHUB_STEP_SUMMARY
          echo "- 실행 시간: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- 신규 공지 발견: ${{ steps.monitor_run.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
