name: KCA 정보보안기사 대량 아카이빙 시스템

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write

jobs:
  archive-process:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 라이브러리 설치
        run: pip install requests beautifulsoup4

      - name: 대량 수집 및 아카이빙 실행
        id: run_script
        run: python scripts/kca-monitor/kca_exam_monitor.py

      - name: 전체 보드 및 데이터 업데이트 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ KCA_NOTICE_BOARD.md
          # 변경사항이 있을 때만 커밋 (데이터베이스나 MD 파일 변경 시)
          if ! git diff --staged --quiet; then
            git commit -m "🗂️ KCA 공지사항 데이터베이스 업데이트 (신규: ${{ steps.run_script.outputs.new_count }}건)"
            git pull --rebase origin main
            git push origin main
          fi

      - name: 신규 공지 발생 시 Issue 알림
        if: steps.run_script.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('data/kca-notifications/latest_report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📢 [신규] KCA 정보보안기사 공지사항 업데이트`,
              body: report + "\n\n---\n[전체 공지사항 보드 보기](./KCA_NOTICE_BOARD.md)",
              labels: ['notification', 'kca-exam']
            });

      - name: 요약 리포트 표시
        if: always()
        run: |
          echo "### 📊 KCA 모니터링 현황" >> $GITHUB_STEP_SUMMARY
          echo "- 업데이트 시간: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- 신규 발견: ${{ steps.run_script.outputs.new_count }}건" >> $GITHUB_STEP_SUMMARY
          echo "- 전체 목록은 [KCA_NOTICE_BOARD.md](./KCA_NOTICE_BOARD.md)에서 확인 가능합니다." >> $GITHUB_STEP_SUMMARY
