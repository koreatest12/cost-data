name: Robust Auto-Gen & Deploy (Printf Mode)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-and-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🏗️ Java Spring Boot 소스 대량 자동 생성 (Safe Mode)
        run: |
          echo ">>> [Phase 1] 소스 코드 유무 확인 및 생성"

          # pom.xml이 없으면 프로젝트가 없다고 판단하여 생성 시작
          if [ ! -f "pom.xml" ] && [ ! -f "build.gradle" ]; then
            echo "⚠️ 소스 코드가 없어 'printf' 방식으로 안전하게 생성합니다..."
            
            # 1. 필수 디렉토리 구조 생성
            mkdir -p src/main/java/com/example/demo
            mkdir -p src/main/resources
            
            # 2. pom.xml 생성 (EOF 대신 printf 사용으로 문법 에러 원천 차단)
            printf '<project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"\n' > pom.xml
            printf '  xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">\n' >> pom.xml
            printf '  <modelVersion>4.0.0</modelVersion>\n' >> pom.xml
            printf '  <groupId>com.example</groupId>\n' >> pom.xml
            printf '  <artifactId>demo</artifactId>\n' >> pom.xml
            printf '  <version>0.0.1-SNAPSHOT</version>\n' >> pom.xml
            printf '  <parent>\n' >> pom.xml
            printf '    <groupId>org.springframework.boot</groupId>\n' >> pom.xml
            printf '    <artifactId>spring-boot-starter-parent</artifactId>\n' >> pom.xml
            printf '    <version>3.2.0</version>\n' >> pom.xml
            printf '  </parent>\n' >> pom.xml
            printf '  <properties>\n' >> pom.xml
            printf '    <java.version>17</java.version>\n' >> pom.xml
            printf '  </properties>\n' >> pom.xml
            printf '  <dependencies>\n' >> pom.xml
            printf '    <dependency>\n' >> pom.xml
            printf '      <groupId>org.springframework.boot</groupId>\n' >> pom.xml
            printf '      <artifactId>spring-boot-starter-web</artifactId>\n' >> pom.xml
            printf '    </dependency>\n' >> pom.xml
            printf '  </dependencies>\n' >> pom.xml
            printf '  <build>\n' >> pom.xml
            printf '    <plugins>\n' >> pom.xml
            printf '      <plugin>\n' >> pom.xml
            printf '        <groupId>org.springframework.boot</groupId>\n' >> pom.xml
            printf '        <artifactId>spring-boot-maven-plugin</artifactId>\n' >> pom.xml
            printf '      </plugin>\n' >> pom.xml
            printf '    </plugins>\n' >> pom.xml
            printf '  </build>\n' >> pom.xml
            printf '</project>\n' >> pom.xml

            # 3. Java Main Application 생성
            TARGET_JAVA="src/main/java/com/example/demo/DemoApplication.java"
            printf 'package com.example.demo;\n' > $TARGET_JAVA
            printf 'import org.springframework.boot.SpringApplication;\n' >> $TARGET_JAVA
            printf 'import org.springframework.boot.autoconfigure.SpringBootApplication;\n' >> $TARGET_JAVA
            printf 'import org.springframework.web.bind.annotation.GetMapping;\n' >> $TARGET_JAVA
            printf 'import org.springframework.web.bind.annotation.RestController;\n' >> $TARGET_JAVA
            printf '\n' >> $TARGET_JAVA
            printf '@SpringBootApplication\n' >> $TARGET_JAVA
            printf '@RestController\n' >> $TARGET_JAVA
            printf 'public class DemoApplication {\n' >> $TARGET_JAVA
            printf '    public static void main(String[] args) {\n' >> $TARGET_JAVA
            printf '        SpringApplication.run(DemoApplication.class, args);\n' >> $TARGET_JAVA
            printf '    }\n' >> $TARGET_JAVA
            printf '    @GetMapping("/")\n' >> $TARGET_JAVA
            printf '    public String home() {\n' >> $TARGET_JAVA
            printf '        return "<h1>🚀 배포 성공! (Syntax Error Fixed)</h1>";\n' >> $TARGET_JAVA
            printf '    }\n' >> $TARGET_JAVA
            printf '}\n' >> $TARGET_JAVA

            # 4. application.properties 생성
            printf 'server.port=8080\n' > src/main/resources/application.properties
            
            echo "✅ Spring Boot 소스 코드 생성 완료 (printf 방식 적용)."
          else
            echo "✅ 기존 소스 코드가 존재합니다."
          fi

      - name: 🛠️ Dockerfile 자동 생성 (Safe Mode)
        run: |
          echo ">>> [Phase 2] Dockerfile 생성"
          
          # Dockerfile 생성 (Maven 이미지 사용으로 apt-get 에러 방지)
          printf 'FROM maven:3.9-eclipse-temurin-17 AS builder\n' > Dockerfile
          printf 'WORKDIR /app\n' >> Dockerfile
          printf 'COPY . .\n' >> Dockerfile
          printf 'RUN mvn clean package -DskipTests\n' >> Dockerfile
          printf '\n' >> Dockerfile
          printf 'FROM eclipse-temurin:17-jre-alpine\n' >> Dockerfile
          printf 'WORKDIR /app\n' >> Dockerfile
          printf 'COPY --from=builder /app/target/*.jar app.jar\n' >> Dockerfile
          printf 'ENTRYPOINT ["java", "-jar", "app.jar"]\n' >> Dockerfile
          
          echo "✅ Dockerfile 생성 완료."

      - name: 🐳 도커 이미지 빌드
        run: |
          # 빌드 시작
          docker build -t cost-data-app:latest .
          # 파일 저장
          docker save -o cost-data-app.tar cost-data-app:latest

      - name: 🚀 서버로 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "cost-data-app.tar,docker-compose.yml"
          target: "/home/${{ secrets.SERVER_USER }}/cost-data-service/"

  deploy-server:
    needs: build-and-transfer
    runs-on: ubuntu-latest
    steps:
      - name: SSH 접속 및 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            APP_DIR="/home/${{ secrets.SERVER_USER }}/cost-data-service"
            cd $APP_DIR

            # 환경변수 파일 생성 (printf 사용)
            printf "DB_URL=${{ secrets.DB_URL }}\n" > .env
            printf "DB_USERNAME=${{ secrets.DB_USERNAME }}\n" >> .env
            printf "DB_PASSWORD=${{ secrets.DB_PASSWORD }}\n" >> .env
            printf "API_KEY=${{ secrets.API_KEY }}\n" >> .env

            # 이미지 로드
            docker load -i cost-data-app.tar

            # docker-compose.yml 생성 (없을 경우)
            if [ ! -f "docker-compose.yml" ]; then
                printf "version: '3'\n" > docker-compose.yml
                printf "services:\n" >> docker-compose.yml
                printf "  app:\n" >> docker-compose.yml
                printf "    image: cost-data-app:latest\n" >> docker-compose.yml
                printf "    ports: ['80:80', '8080:8080']\n" >> docker-compose.yml
                printf "    restart: always\n" >> docker-compose.yml
                printf "    env_file: .env\n" >> docker-compose.yml
            fi

            # 컨테이너 실행
            sed -i 's|image: .*|image: cost-data-app:latest|g' docker-compose.yml
            docker compose up -d --force-recreate
            
            # 정리
            rm -f cost-data-app.tar
            docker image prune -f
            
            echo ">>> 배포 성공!"
