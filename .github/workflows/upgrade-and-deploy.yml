name: 🧠 INTELLIGENT TAX-MASTER ENTERPRISE WORKFLOW

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  intelligent-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 [1] 소스 및 데이터 체크아웃
        uses: actions/checkout@v4

      - name: 📥 [2] 원천 데이터 마이그레이션
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: app_root/cost_data

      - name: 🐍 [3] Python 고성능 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
      - run: pip install flask pandas sqlalchemy aiosmtpd numpy

      - name: 🛠️ [4] 지능형 프로젝트 생성기 실행
        run: |
          mkdir -p app_root/receipts
          cat <<EOF > generate_intelligent_system.py
          import os

          # [엔진: 지식 베이스 및 계산 로직 내장]
          ENGINE = r'''
          import sqlite3, json, os

          def setup_intelligence():
              conn = sqlite3.connect('tax_master.db')
              cur = conn.cursor()

              # 1. 세무 지식 베이스 테이블 (세율 및 규정)
              cur.execute("DROP TABLE IF EXISTS tax_knowledge")
              cur.execute("""CREATE TABLE tax_knowledge (
                  id INTEGER PRIMARY KEY,
                  category TEXT,
                  threshold_min INTEGER,
                  threshold_max INTEGER,
                  tax_rate REAL,
                  deduction_fixed INTEGER
              )""")

              # 2026년 최신 세율 지식 대량 주입 (예시 데이터)
              tax_rules = [
                  ('INCOME_TAX', 0, 14000000, 0.06, 0),
                  ('INCOME_TAX', 14000000, 50000000, 0.15, 1260000),
                  ('INCOME_TAX', 50000000, 88000000, 0.24, 5760000),
                  ('INCOME_TAX', 88000000, 150000000, 0.35, 15440000)
              ]
              cur.executemany("INSERT INTO tax_knowledge (category, threshold_min, threshold_max, tax_rate, deduction_fixed) VALUES (?,?,?,?,?)", tax_rules)

              # 2. 계산 엔진 로직 (DB 함수 형태 또는 트리거 대비용 테이블)
              cur.execute("""CREATE TABLE IF NOT EXISTS tax_records (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  name TEXT,
                  salary INTEGER,
                  calculated_tax INTEGER,
                  tax_bracket REAL,
                  advice TEXT
              )""")
              
              conn.commit()
              conn.close()

          def process_with_intelligence():
              setup_intelligence()
              conn = sqlite3.connect('tax_master.db')
              conn.row_factory = sqlite3.Row
              cur = conn.cursor()

              # 대량 데이터 로드 (cost_data 폴더 스캔 가정)
              # 예시: 임의의 대량 데이터 생성 및 지능형 계산 적용
              raw_data = [('홍길동', 45000000), ('이순신', 75000000), ('강감찬', 120000000)]
              
              for name, salary in raw_data:
                  # 지식 베이스에서 세율 계산 로직 추출
                  cur.execute("SELECT * FROM tax_knowledge WHERE ? > threshold_min AND ? <= threshold_max", (salary, salary))
                  rule = cur.fetchone()
                  
                  if rule:
                      tax = int(salary * rule['tax_rate'] - rule['deduction_fixed'])
                      rate = rule['tax_rate']
                      advice = f"연봉 {salary:,}원 기준 {rate*100}% 세율이 적용되었습니다."
                  else:
                      tax, rate, advice = 0, 0, "계산 불가"

                  cur.execute("INSERT INTO tax_records (name, salary, calculated_tax, tax_bracket, advice) VALUES (?,?,?,?,?)",
                             (name, salary, tax, rate, advice))
              
              conn.commit()
              conn.close()

          if __name__ == "__main__": process_with_intelligence()
          '''

          # [앱: 지식 기반 대시보드]
          APP = r'''
          from flask import Flask, render_template_string
          import sqlite3

          app = Flask(__name__)

          @app.route('/')
          def dashboard():
              conn = sqlite3.connect('tax_master.db'); conn.row_factory = sqlite3.Row
              records = conn.execute("SELECT * FROM tax_records").fetchall()
              rules = conn.execute("SELECT * FROM tax_knowledge").fetchall()
              conn.close()
              return render_template_string("""
                  <html><head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
                  <body class="p-5 bg-dark text-white">
                      <div class="container bg-secondary p-5 rounded shadow">
                          <h1>🧠 Intelligent Tax Master v4.0</h1>
                          <hr>
                          <h3>📘 세무 지식 베이스 (Tax Rules)</h3>
                          <table class="table table-dark table-striped mb-5">
                              <thead><tr><th>구분</th><th>범위</th><th>세율</th><th>누진공제</th></tr></thead>
                              <tbody>
                                  {% for r in rules %}
                                  <tr><td>{{r.category}}</td><td>{{r.threshold_min}}~{{r.threshold_max}}</td><td>{{r.tax_rate*100}}%</td><td>{{r.deduction_fixed}}</td></tr>
                                  {% endfor %}
                              </tbody>
                          </table>
                          <h3>📊 지능형 계산 결과</h3>
                          <table class="table table-light table-hover text-dark">
                              <thead><tr><th>성명</th><th>급여</th><th>계산세액</th><th>적용세율</th><th>AI 어드바이스</th></tr></thead>
                              <tbody>
                                  {% for d in records %}
                                  <tr><td>{{d.name}}</td><td>{{d.salary:,}}</td><td>{{d.calculated_tax:,}}</td><td>{{d.tax_bracket*100}}%</td><td>{{d.advice}}</td></tr>
                                  {% endfor %}
                              </tbody>
                          </table>
                      </div>
                  </body></html>
              """, records=records, rules=rules)

          if __name__ == '__main__': app.run(host='0.0.0.0', port=8080)
          '''

          with open('app_root/engine.py', 'w', encoding='utf-8') as f: f.write(ENGINE)
          with open('app_root/app.py', 'w', encoding='utf-8') as f: f.write(APP)
          EOF
          python generate_intelligent_system.py

      - name: 🗄️ [5] 지능형 데이터 적재 및 자동 계산 실행
        run: |
          cd app_root
          python engine.py

      - name: 🐳 [6] Docker 빌드 및 패키징
        run: |
          cd app_root
          cat <<EOF > Dockerfile
          FROM python:3.9-slim
          WORKDIR /app
          COPY . .
          RUN pip install flask sqlalchemy pandas
          EXPOSE 8080
          CMD ["python", "app.py"]
          EOF
          docker build -t tax-intel:latest .
          docker save -o tax-intel.tar tax-intel:latest

      - name: 📦 [7] 최종 아티팩트 보관
        uses: actions/upload-artifact@v4
        with:
          name: Intelligent-Tax-Asset
          path: |
            app_root/tax_master.db
            app_root/tax-intel.tar
