name: 🚀 ULTIMATE REPAIR & ENTERPRISE UPGRADE (v15.3 - ENOENT FIX)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  system-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 [1] 소스 클론 및 작업 디렉토리 초기화
        uses: actions/checkout@v4

      - name: 📂 [2] 필수 경로 강제 생성
        # 모든 파일 생성 전, 최상위 루트에서 경로가 확실히 존재하는지 확인합니다.
        run: |
          mkdir -p public/data assets/data receipts pages middleware
          echo "Current Directory: $(pwd)"

      - name: 🐍 [3] 파이썬 엔진 실행 (데이터 생성)
        run: |
          cat <<'EOF' > tax_engine.py
          import sqlite3, json, random
          def run_engine():
              conn = sqlite3.connect('tax_master.db')
              cur = conn.cursor()
              cur.execute("CREATE TABLE IF NOT EXISTS tax_results (id INTEGER PRIMARY KEY, name TEXT, salary INTEGER, tax INTEGER, net_pay INTEGER, advice TEXT)")
              for i in range(1, 51):
                  sal = random.randint(30000000, 120000000)
                  tax = int(sal * 0.15)
                  cur.execute("INSERT INTO tax_results (name, salary, tax, net_pay, advice) VALUES (?,?,?,?,?)",
                             (f"임직원_{i:02d}", sal, tax, sal-tax, "보안 검증 완료"))
              conn.commit()
              conn.close()
          if __name__ == "__main__": run_engine()
          EOF
          python3 tax_engine.py

      - name: 📊 [4] 데이터 정적화 (JSON 변환)
        run: |
          python3 -c "import sqlite3, json; conn=sqlite3.connect('tax_master.db'); conn.row_factory=sqlite3.Row; data=[dict(r) for r in conn.execute('SELECT * FROM tax_results').fetchall()]; open('public/data/report.json', 'w').write(json.dumps(data))"
          cp public/data/report.json assets/data/report.json

      - name: 🛠️ [5] 프론트엔드 핵심 파일 생성 (ENOENT 방지 핵심)
        # package.json과 nuxt.config.ts를 워크플로우 루트에 확실히 생성합니다.
        env:
          SECRET_KEY: ${{ secrets.ENTERPRISE_PASSKEY || 'admin123' }}
        run: |
          # 1. package.json 생성
          cat <<'EOF' > package.json
          {
            "name": "tax-master-enterprise",
            "private": true,
            "type": "module",
            "scripts": { "build": "nuxt build", "generate": "nuxt generate" },
            "devDependencies": { "nuxt": "^3.10.0" }
          }
          EOF

          # 2. nuxt.config.ts 생성
          PASS_HASH=$(echo -n "$SECRET_KEY" | sha256sum | cut -d' ' -f1)
          cat <<EOF > nuxt.config.ts
          export default defineNuxtConfig({
            runtimeConfig: { public: { passkeyHash: '$PASS_HASH' } },
            ssr: false,
            app: { baseURL: '/' }
          })
          EOF

          # 3. Middleware & Pages 생성
          cat <<'EOF' > middleware/auth.global.ts
          export default defineNuxtRouteMiddleware((to) => {
            if (process.client && !localStorage.getItem('auth_session') && to.path !== '/login') {
              return navigateTo('/login');
            }
          })
          EOF

          cat <<'EOF' > pages/login.vue
          <template>
            <div style="background:#0f172a;height:100vh;display:flex;align-items:center;justify-content:center;color:white;flex-direction:column">
              <h2>🔐 ENTERPRISE AUTH</h2>
              <input v-model="key" type="password" style="margin:20px;padding:10px" placeholder="Passkey" />
              <button @click="verify" style="padding:10px 20px;cursor:pointer">Access</button>
            </div>
          </template>
          <script setup>
          const key = ref('');
          const verify = async () => {
            const msg = new TextEncoder().encode(key.value);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msg);
            const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
            if (hashHex === useRuntimeConfig().public.passkeyHash) {
              localStorage.setItem('auth_session', 'true');
              navigateTo('/');
            } else { alert('Invalid Key'); }
          };
          </script>
          EOF

          cat <<'EOF' > pages/index.vue
          <template>
            <div style="padding:40px;font-family:sans-serif">
              <h1>🏢 TAX-MASTER DASHBOARD</h1>
              <div v-for="item in reports" :key="item.id" style="border:1px solid #ccc;padding:10px;margin:10px">
                {{ item.name }} | 급여: {{ item.salary.toLocaleString() }}원
              </div>
            </div>
          </template>
          <script setup>
          import data from '../assets/data/report.json';
          const reports = data;
          </script>
          EOF

      - name: 🚀 [6] 종속성 설치 및 정적 빌드
        # 파일이 존재하는지 최종 확인 후 실행
        run: |
          ls -al package.json
          npm install
          npm run generate

      - name: 📤 [7] Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: system-intelligence
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
