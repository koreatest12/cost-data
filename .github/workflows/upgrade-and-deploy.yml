name: 🚀 AI-TAX INTEGRATED ENTERPRISE SYSTEM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # [Phase 1] 데이터 클론, 지능형 엔진 가동 및 DB 구축
  system-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 [1] 저장소 체크아웃 및 외부 앱 복제
        uses: actions/checkout@v4
      
      - name: 📥 [2] 외부 자산 및 데이터 소스 클론 (Deep Clone)
        run: |
          git clone https://github.com/koreatest12/cost-data.git data_source
          git clone https://github.com/leonoffou/ollama-TTS-STT-App.git ai_app
          mkdir -p public/data receipts

      - name: 🐍 [3] 파이썬 환경 구성 및 라이브러리 전수 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      
      - name: 📦 [수정반영] 필수 라이브러리 강제 설치 (에러 해결)
        run: |
          pip install --upgrade pip
          pip install pandas openpyxl sqlalchemy numpy flask

      - name: 🛠️ [4] 지능형 세무 엔진 생성 및 실행 (권한 자동 부여)
        run: |
          cat <<'EOF' > tax_engine.py
          import os, sqlite3, json, glob
          import pandas as pd

          def run_system():
              conn = sqlite3.connect('tax_master.db')
              cur = conn.cursor()
              # 지식 베이스 및 스키마 구축
              cur.executescript("""
                  CREATE TABLE IF NOT EXISTS tax_knowledge (id INTEGER PRIMARY KEY, min_val INTEGER, max_val INTEGER, rate REAL, ded INTEGER);
                  CREATE TABLE IF NOT EXISTS tax_results (
                      id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, salary INTEGER, tax INTEGER, advice TEXT
                  );
              """)
              # 2026년 최신 세율 주입
              rules = [(1, 0, 14000000, 0.06, 0), (2, 14000000, 50000000, 0.15, 1260000), (3, 50000000, 88000000, 0.24, 5760000)]
              cur.executemany("INSERT OR REPLACE INTO tax_knowledge VALUES (?,?,?,?,?)", rules)
              
              # 모든 경로 데이터 Deep Scan
              for f in glob.glob('data_source/**/*', recursive=True):
                  if os.path.isfile(f) and f.lower().endswith('.json'):
                      try:
                          with open(f, 'r', encoding='utf-8') as jf:
                              d = json.load(jf)
                              name, sal = d.get('name', 'Unknown'), int(d.get('total_salary', 0))
                              cur.execute("SELECT * FROM tax_knowledge WHERE ? > min_val AND ? <= max_val", (sal, sal))
                              rule = cur.fetchone()
                              tax = int(sal * rule[3] - rule[4]) if rule else 0
                              cur.execute("INSERT INTO tax_results (name, salary, tax, advice) VALUES (?,?,?,?)", (name, sal, tax, 'AI 분석 완료'))
                      except: continue
              conn.commit()
              conn.close()
          if __name__ == "__main__": run_system()
          EOF
          
          chmod 755 tax_engine.py
          python tax_engine.py

      - name: 🛠️ [5] Nuxt 소스 대량 생성 (Full UI 반영)
        run: |
          cat <<'EOF' > package.json
          {
            "name": "ai-tax-master",
            "private": true,
            "type": "module",
            "scripts": { "build": "nuxt build", "generate": "nuxt generate" },
            "devDependencies": { "nuxt": "^3.10.0" }
          }
          EOF

          mkdir -p pages
          cat <<'EOF' > pages/index.vue
          <template>
            <div class="main-container">
              <header>
                <h1>🎙️ AI-TAX Intelligent Dashboard</h1>
                <p>TTS/STT 연동형 세무 지능 시스템 v9.0</p>
              </header>
              <div class="data-card">
                <table class="tax-table">
                  <thead>
                    <tr><th>성명</th><th>연봉</th><th>산출세액</th><th>AI 어드바이스</th></tr>
                  </thead>
                  <tbody>
                    <tr v-for="item in reports" :key="item.id">
                      <td>{{ item.name }}</td>
                      <td>{{ item.salary.toLocaleString() }}원</td>
                      <td class="highlight">{{ item.tax.toLocaleString() }}원</td>
                      <td>{{ item.advice }}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </template>
          <script setup>
          import reportData from '~/public/data/report.json'
          const reports = reportData
          </script>
          <style scoped>
            .main-container { padding: 40px; background: #f8f9fa; min-height: 100vh; font-family: 'Inter', sans-serif; }
            header { margin-bottom: 30px; text-align: center; }
            .data-card { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; }
            .tax-table { width: 100%; border-collapse: collapse; }
            th { background: #007bff; color: white; padding: 15px; text-align: left; }
            td { padding: 15px; border-bottom: 1px solid #eee; }
            .highlight { color: #dc3545; font-weight: bold; }
          </style>
          EOF

      - name: 📊 [6] 데이터 통합 및 권한 설정
        run: |
          python3 -c "import sqlite3, json; conn=sqlite3.connect('tax_master.db'); conn.row_factory=sqlite3.Row; data=[dict(r) for r in conn.execute('SELECT * FROM tax_results').fetchall()]; open('public/data/report.json', 'w').write(json.dumps(data))"
          chmod -R 755 public/data ai_app

      - name: 🚀 [7] Nuxt 빌드 및 정적 사이트 배포
        run: |
          npm install
          npm run generate

      - name: 📤 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  # [Phase 2] 최종 배포
  deploy:
    needs: system-intelligence
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
