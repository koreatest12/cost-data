name: 🚀 ULTIMATE REPAIR & ENTERPRISE UPGRADE (v15.2 - Auth Security)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  system-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 [1] 소스 및 외부 데이터 클론
        uses: actions/checkout@v4

      - name: 📂 [1-1] 데이터 경로 사전 생성
        run: mkdir -p public/data assets/data receipts

      - name: 🐍 [2] 파이썬 분석 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 📦 [2-1] 의존성 라이브러리 설치
        run: pip install pandas openpyxl sqlalchemy numpy

      - name: 🛠️ [3] 지능형 엔진 가동 (데이터 및 암호화 지식 구축)
        run: |
          cat <<'EOF' > tax_engine.py
          import sqlite3, json, random, hashlib

          def run_engine():
              conn = sqlite3.connect('tax_master.db')
              cur = conn.cursor()
              cur.executescript("""
                  CREATE TABLE IF NOT EXISTS tax_results (
                      id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, salary INTEGER, tax INTEGER, net_pay INTEGER, advice TEXT
                  );
              """)
              
              # 대량 시뮬레이션 데이터 생성 (50건)
              for i in range(1, 51):
                  sal = random.randint(30000000, 120000000)
                  tax = int(sal * 0.24 - 5760000) if sal > 50000000 else int(sal * 0.15 - 1260000)
                  cur.execute("INSERT INTO tax_results (name, salary, tax, net_pay, advice) VALUES (?,?,?,?,?)",
                             (f"임직원_{i:02d}", sal, tax, sal-tax, "AI 보안 분석 완료"))
              conn.commit()
              conn.close()
          if __name__ == "__main__": run_engine()
          EOF
          python tax_engine.py

      - name: 📊 [4] 데이터 정적화 및 보안 해시 생성
        run: |
          python3 -c "import sqlite3, json; conn=sqlite3.connect('tax_master.db'); conn.row_factory=sqlite3.Row; data=[dict(r) for r in conn.execute('SELECT * FROM tax_results').fetchall()]; open('public/data/report.json', 'w').write(json.dumps(data))"
          cp public/data/report.json assets/data/report.json

      - name: 🛠️ [5] Nuxt 인증 및 Secrets 시스템 주입
        env:
          # GitHub Settings -> Secrets -> Actions에 저장된 값을 가져옵니다.
          # 설정되지 않았을 경우 기본값으로 'admin123'을 사용합니다.
          SECRET_KEY: ${{ secrets.ENTERPRISE_PASSKEY || 'admin123' }}
        run: |
          # 1. 환경 변수를 프론트엔드에서 참조 가능하도록 .env 생성
          echo "NUXT_PUBLIC_PASSKEY_HASH=$(echo -n $SECRET_KEY | sha256sum | cut -d' ' -f1)" > .env

          # 2. 전역 인증 미들웨어
          mkdir -p middleware
          cat <<'EOF' > middleware/auth.global.ts
          export default defineNuxtRouteMiddleware((to, from) => {
            if (process.client) {
              const isAuthenticated = localStorage.getItem('auth_session');
              if (!isAuthenticated && to.path !== '/login') {
                return navigateTo('/login');
              }
            }
          })
          EOF

          # 3. 로그인 페이지 (SHA-256 해시 검증 방식)
          mkdir -p pages
          cat <<'EOF' > pages/login.vue
          <template>
            <div class="auth-page">
              <div class="login-card">
                <h2>🔐 ENTERPRISE AUTH</h2>
                <input v-model="inputKey" type="password" placeholder="Passkey" @keyup.enter="verify" />
                <button @click="verify">Verify & Access</button>
              </div>
            </div>
          </template>
          <script setup>
          const config = useRuntimeConfig();
          const inputKey = ref('');
          const verify = async () => {
            // 입력값을 SHA-256으로 해싱하여 환경변수의 해시값과 비교 (간이 보안)
            const msgUint8 = new TextEncoder().encode(inputKey.value);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            if (hashHex === config.public.passkeyHash) {
              localStorage.setItem('auth_session', Date.now());
              navigateTo('/');
            } else {
              alert('Invalid Passkey');
            }
          };
          </script>
          <style scoped>
          .auth-page { height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: white; }
          .login-card { background: #1e293b; padding: 3rem; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
          input { display: block; width: 100%; padding: 0.75rem; margin: 1.5rem 0; border-radius: 0.5rem; border: none; }
          button { width: 100%; padding: 0.75rem; background: #3b82f6; border: none; border-radius: 0.5rem; color: white; cursor: pointer; }
          </style>
          EOF

          # 4. Nuxt 설정 파일 수정 (Runtime Config 주입)
          cat <<'EOF' > nuxt.config.ts
          export default defineNuxtConfig({
            runtimeConfig: {
              public: {
                passkeyHash: process.env.NUXT_PUBLIC_PASSKEY_HASH
              }
            },
            ssr: false // 정적 배포를 위한 설정
          })
          EOF

      - name: 🚀 [6] Nuxt 빌드 및 정적 사이트 생성
        run: |
          npm install
          npm run generate

      - name: 📤 [7] Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: system-intelligence
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
