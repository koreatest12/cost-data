name: 🚀 ULTIMATE ENTERPRISE TAX-SYSTEM TOTAL UPGRADE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  enterprise-total-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 📥 [1] 소스 및 외부 데이터 저장소 전체 클론 (Deep Scan)
        uses: actions/checkout@v4
      - run: |
          git clone https://github.com/koreatest12/cost-data.git data_source
          mkdir -p app_root/receipts
          mkdir -p app_root/cost_data/uploads

      - name: 🐍 [2] 분석 최적화 환경 구성
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
      - run: pip install flask pandas openpyxl sqlalchemy pdfplumber numpy aiosmtpd

      - name: 🛠️ [3] 지능형 생성기 및 모든 기능 업그레이드 실행
        run: |
          cat <<EOF > generate_and_upgrade.py
          import os, sqlite3, json, glob
          import pandas as pd
          from datetime import datetime

          BASE_DIR = "app_root"
          DB_PATH = os.path.join(BASE_DIR, "tax_master.db")

          def build_upgrade_db():
              conn = sqlite3.connect(DB_PATH)
              cur = conn.cursor()
              # 고성능 처리를 위한 WAL 모드 및 스키마 초기화
              cur.execute("PRAGMA journal_mode=WAL")
              cur.executescript("""
                  DROP TABLE IF EXISTS tax_knowledge;
                  CREATE TABLE tax_knowledge (
                      id INTEGER PRIMARY KEY, 
                      category TEXT, 
                      threshold_min INTEGER, 
                      threshold_max INTEGER, 
                      tax_rate REAL, 
                      deduction_fixed INTEGER
                  );
                  CREATE TABLE IF NOT EXISTS tax_records (
                      id INTEGER PRIMARY KEY AUTOINCREMENT, 
                      name TEXT, 
                      salary INTEGER, 
                      source_path TEXT, 
                      final_tax INTEGER, 
                      advice TEXT, 
                      processed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                  );
                  CREATE INDEX IF NOT EXISTS idx_main ON tax_records(name, salary);
              """)
              
              # [지식 베이스 업그레이드] 2026 최신 누진세율 대량 주입
              knowledge = [
                  (1, 'INCOME', 0, 14000000, 0.06, 0),
                  (2, 'INCOME', 14000000, 50000000, 0.15, 1260000),
                  (3, 'INCOME', 50000000, 88000000, 0.24, 5760000),
                  (4, 'INCOME', 88000000, 150000000, 0.35, 15440000),
                  (5, 'INCOME', 150000000, 300000000, 0.38, 19940000),
                  (6, 'INCOME', 300000000, 500000000, 0.40, 25940000),
                  (7, 'INCOME', 500000000, 1000000000, 0.42, 35940000)
              ]
              cur.executemany("INSERT INTO tax_knowledge VALUES (?,?,?,?,?,?)", knowledge)
              conn.commit()
              conn.close()

          def deep_scan_engine():
              conn = sqlite3.connect(DB_PATH)
              cur = conn.cursor()
              
              # 모든 경로의 모든 파일 멀티 스캔 및 데이터 추출
              all_files = glob.glob('data_source/**/*', recursive=True)
              print(f">>> 총 {len(all_files)}개의 파일 탐색 중...")

              for f in all_files:
                  if os.path.isdir(f): continue
                  ext = os.path.splitext(f)[1].lower()
                  try:
                      if ext == '.json':
                          with open(f, 'r', encoding='utf-8') as jf:
                              d = json.load(jf)
                              items = d if isinstance(d, list) else [d]
                              for i in items:
                                  process_logic(cur, i.get('name', 'N/A'), int(i.get('total_salary', 0)), f)
                      elif ext in ['.xlsx', '.xls', '.csv']:
                          df = pd.read_excel(f) if 'xl' in ext else pd.read_csv(f)
                          for _, row in df.iterrows():
                              process_logic(cur, str(row.iloc[0]), int(row.iloc[1]), f)
                  except: continue
              conn.commit()
              conn.close()

          def process_logic(cur, name, salary, path):
              if salary <= 0: return
              # 지능형 세율 매칭 연산
              cur.execute("SELECT * FROM tax_knowledge WHERE ? > threshold_min AND ? <= threshold_max", (salary, salary))
              rule = cur.fetchone()
              if rule:
                  tax = int(salary * rule[4] - rule[5])
                  advice = f"[{int(rule[4]*100)}% 적용] " + ("고소득 관리 대상" if salary > 88000000 else "정상 과세 범위")
                  cur.execute("INSERT INTO tax_records (name, salary, source_path, final_tax, advice) VALUES (?,?,?,?,?)",
                             (name, salary, path, tax, advice))

          if __name__ == "__main__":
              build_upgrade_db()
              deep_scan_engine()
          EOF
          python generate_and_upgrade.py

      - name: 🐳 [4] Docker 및 웹 서버 모든 기능 반영 빌드
        run: |
          cd app_root
          # Dockerfile 줄바꿈 에러 완벽 해결 (Single quote heredoc 사용)
          cat <<'EOF' > Dockerfile
          FROM python:3.9-slim
          WORKDIR /app
          COPY . .
          RUN pip install --no-cache-dir flask pandas sqlalchemy openpyxl
          EXPOSE 8080
          CMD ["python", "app.py"]
          EOF
          
          # [UI 업그레이드] 대량 데이터 시각화 및 통계 요약 기능 포함
          cat <<'EOF' > app.py
          from flask import Flask, render_template_string
          import sqlite3
          app = Flask(__name__)
          @app.route('/')
          def index():
              conn = sqlite3.connect('tax_master.db'); conn.row_factory = sqlite3.Row
              data = conn.execute("SELECT * FROM tax_records ORDER BY salary DESC").fetchall()
              summary = conn.execute("SELECT COUNT(*), SUM(final_tax) FROM tax_records").fetchone()
              conn.close()
              return render_template_string('''
                  <html><head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
                  <body class="bg-light p-5">
                      <div class="container bg-white shadow rounded p-4">
                          <h2 class="text-primary mb-3">🏢 Total Intelligence Tax Dashboard v5.0</h2>
                          <div class="row mb-4">
                              <div class="col-md-6"><div class="card p-3 bg-info text-white"><h5>분석 대상: {{summary[0]}}명</h5></div></div>
                              <div class="col-md-6"><div class="card p-3 bg-success text-white"><h5>합계 세액: {{summary[1]|default(0, true)|format_price}}원</h5></div></div>
                          </div>
                          <table class="table table-hover">
                              <thead class="table-dark"><tr><th>이름</th><th>급여</th><th>산출세액</th><th>AI 어드바이스</th></tr></thead>
                              <tbody>
                                  {% for r in data %}
                                  <tr><td>{{r.name}}</td><td>{{r.salary:,}}</td><td class="fw-bold">{{r.final_tax:,}}</td><td>{{r.advice}}</td></tr>
                                  {% endfor %}
                              </tbody>
                          </table>
                      </div>
                  </body></html>
              ''', data=data, summary=summary)

          @app.template_filter('format_price')
          def format_price(value): return "{:,}".format(value)
          if __name__ == "__main__": app.run(host='0.0.0.0', port=8080)
          EOF

          docker build -t tax-master-ultimate:latest .
          docker save -o tax-master-ultimate.tar tax-master-ultimate:latest

      - name: 📦 [5] 최종 업그레이드 자산 아티팩트 저장
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Enterprise-System-v5
          path: |
            app_root/tax_master.db
            app_root/tax-master-ultimate.tar
