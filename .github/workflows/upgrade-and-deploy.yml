name: 📊 Mass Data Analysis & Tax Report

on:
  workflow_dispatch: # 수동 실행 버튼
  push:
    branches: [ "main" ]

jobs:
  # ==================================================================================
  # [Job 1] 대량 데이터 생성 -> 일괄 분석 -> 리포트 아티팩트 저장
  # ==================================================================================
  batch-processing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 소스 코드 체크아웃
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # [Step 1] 파이썬 환경 설정
      # ----------------------------------------------------------------------
      - name: 🐍 파이썬 3.9 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # ----------------------------------------------------------------------
      # [Step 2] 분석 프로그램 및 샘플 대량 데이터 자동 생성
      # ----------------------------------------------------------------------
      - name: 🏗️ 분석 엔진 및 대량 데이터 생성
        run: |
          echo ">>> [Init] 프로젝트 구조 생성..."
          mkdir -p src
          mkdir -p data # 데이터가 위치할 폴더

          # 1. 핵심 계산 로직 (TaxCalculator)
          cat <<EOF > src/tax_calculator.py
          class TaxCalculator:
              def __init__(self, salary):
                  self.salary = int(salary)
              
              def calc_tax(self, data):
                  # 근로소득공제 (간이)
                  if self.salary <= 5000000: income_ded = self.salary * 0.7
                  elif self.salary <= 15000000: income_ded = 3500000 + (self.salary - 5000000) * 0.4
                  elif self.salary <= 45000000: income_ded = 7500000 + (self.salary - 15000000) * 0.15
                  elif self.salary <= 100000000: income_ded = 12000000 + (self.salary - 45000000) * 0.05
                  else: income_ded = 14750000 + (self.salary - 100000000) * 0.02
                  
                  # 공제 계산
                  basic_ded = 1500000
                  ins_ded = data.get('pension',0) + data.get('health',0) + data.get('employ',0)
                  housing_ded = min(data.get('housing',0) * 0.4, 2400000)
                  
                  # 신용카드 등
                  min_usage = self.salary * 0.25
                  total_usage = data.get('credit',0) + data.get('debit',0) + data.get('cash',0)
                  card_ded = 0
                  if total_usage > min_usage:
                      card_ded = min((total_usage - min_usage) * 0.15, 3000000)
                      
                  # 과세표준
                  deductions = int(income_ded + basic_ded + ins_ded + housing_ded + card_ded)
                  tax_base = max(self.salary - deductions, 0)
                  
                  # 산출세액
                  if tax_base <= 14000000: calc_tax = tax_base * 0.06
                  elif tax_base <= 50000000: calc_tax = 840000 + (tax_base - 14000000) * 0.15
                  elif tax_base <= 88000000: calc_tax = 6240000 + (tax_base - 50000000) * 0.24
                  else: calc_tax = 15360000 + (tax_base - 88000000) * 0.35
                  
                  return {
                      "salary": self.salary,
                      "income_ded": int(income_ded),
                      "deductions": deductions,
                      "tax_base": int(tax_base),
                      "calc_tax": int(calc_tax)
                  }
          EOF

          # 2. 대량 분석기 (Batch Analyzer) - 통계 및 리포트 생성
          cat <<EOF > src/batch_analyzer.py
          import glob
          import json
          import datetime
          from tax_calculator import TaxCalculator

          def run_analysis():
              files = glob.glob('data/*.json')
              print(f">>> [Analysis] 총 {len(files)}개의 데이터 파일을 발견했습니다.")
              
              results = []
              total_salary = 0
              total_tax = 0
              
              # 1. 일괄 계산 (Loop)
              for f_path in files:
                  with open(f_path, 'r', encoding='utf-8') as f:
                      user_data = json.load(f)
                      
                  calc = TaxCalculator(user_data['total_salary'])
                  res = calc.calc_tax(user_data)
                  
                  res['name'] = user_data['name']
                  results.append(res)
                  
                  total_salary += res['salary']
                  total_tax += res['calc_tax']
              
              # 2. 통계 분석
              count = len(results)
              avg_tax = total_tax / count if count > 0 else 0
              max_tax_payer = max(results, key=lambda x: x['calc_tax']) if count > 0 else None
              
              # 3. HTML 리포트 생성
              html_content = f"""
              <html>
              <head>
                  <meta charset="utf-8">
                  <style>
                      body {{ font-family: Arial, sans-serif; padding: 20px; }}
                      table {{ width: 100%; border-collapse: collapse; margin-top: 20px; }}
                      th, td {{ border: 1px solid #ddd; padding: 8px; text-align: right; }}
                      th {{ background-color: #f2f2f2; text-align: center; }}
                      .summary {{ background-color: #e8f4f8; padding: 15px; border-radius: 5px; }}
                      h1 {{ color: #2c3e50; }}
                  </style>
              </head>
              <body>
                  <h1>📊 연말정산 대량 분석 리포트</h1>
                  <p>생성일시: {datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')}</p>
                  
                  <div class="summary">
                      <h2>📈 종합 분석 요약</h2>
                      <ul>
                          <li><strong>총 처리 건수:</strong> {count} 건</li>
                          <li><strong>총 급여 합계:</strong> {total_salary:,} 원</li>
                          <li><strong>총 징수 예상 세액:</strong> {total_tax:,} 원</li>
                          <li><strong>1인당 평균 세액:</strong> {int(avg_tax):,} 원</li>
                          <li><strong>최대 납부 예상자:</strong> {max_tax_payer['name']} ({max_tax_payer['calc_tax']:,} 원)</li>
                      </ul>
                  </div>

                  <h2>📋 상세 내역 (전체)</h2>
                  <table>
                      <tr>
                          <th>성명</th>
                          <th>총급여</th>
                          <th>소득공제 총액</th>
                          <th>과세표준</th>
                          <th>산출세액</th>
                      </tr>
              """
              
              for r in results:
                  html_content += f"""
                      <tr>
                          <td style="text-align:center">{r['name']}</td>
                          <td>{r['salary']:,}</td>
                          <td>{r['deductions']:,}</td>
                          <td>{r['tax_base']:,}</td>
                          <td><strong>{r['calc_tax']:,}</strong></td>
                      </tr>
                  """
                  
              html_content += """
                  </table>
              </body>
              </html>
              """
              
              with open('analysis_report.html', 'w', encoding='utf-8') as f:
                  f.write(html_content)
                  print(">>> [Report] 'analysis_report.html' 생성 완료!")

          if __name__ == '__main__':
              run_analysis()
          EOF

          # 3. 테스트용 대량 데이터 생성 (JSON)
          # 김병권님 데이터
          cat <<EOF > data/user_001.json
          { "name": "김병권", "total_salary": 40000000, "pension": 1236000, "health": 1126370, "employ": 252360, "housing": 1200000, "credit": 412670, "debit": 13086527, "cash": 2502383 }
          EOF
          
          # 가상 데이터 1 (고액 연봉자)
          cat <<EOF > data/user_002.json
          { "name": "이철수", "total_salary": 85000000, "pension": 2000000, "health": 1500000, "employ": 300000, "housing": 0, "credit": 15000000, "debit": 5000000, "cash": 1000000 }
          EOF
          
          # 가상 데이터 2 (신입 사원)
          cat <<EOF > data/user_003.json
          { "name": "박지민", "total_salary": 28000000, "pension": 900000, "health": 800000, "employ": 150000, "housing": 2400000, "credit": 5000000, "debit": 5000000, "cash": 500000 }
          EOF
          
          # 가상 데이터 3
          cat <<EOF > data/user_004.json
          { "name": "정민수", "total_salary": 55000000, "pension": 1500000, "health": 1200000, "employ": 200000, "housing": 0, "credit": 8000000, "debit": 2000000, "cash": 1500000 }
          EOF

          echo ">>> [Data] 샘플 데이터 4건 생성 완료 (폴더: data/)"

      # ----------------------------------------------------------------------
      # [Step 3] 대량 분석 실행
      # ----------------------------------------------------------------------
      - name: 🚀 데이터 일괄 분석 실행
        run: |
          python src/batch_analyzer.py

      # ----------------------------------------------------------------------
      # [Step 4] 분석 리포트 업로드 (다운로드 가능하도록)
      # ----------------------------------------------------------------------
      - name: 📊 분석 결과 리포트 저장
        uses: actions/upload-artifact@v4
        with:
          name: Tax_Analysis_Report
          path: analysis_report.html
          retention-days: 3
