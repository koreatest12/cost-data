name: Deploy and Sync Cost-Data

on:
  workflow_dispatch: # 수동 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Remote Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Settings > Secrets에 등록된 변수들을 불러옵니다.
          host: ${{ secrets.SERVER_HOST }}     
          username: ${{ secrets.SERVER_USER }} 
          key: ${{ secrets.SERVER_KEY }}       
          port: ${{ secrets.SERVER_PORT }}     
          script_stop: true
          script: |
            echo "========== [1] 시스템 및 도커 엔진 보안 업데이트 =========="
            sudo apt-get update
            # 도커 관련 패키지만 지정하여 업그레이드 (시스템 전체 업그레이드 방지)
            sudo apt-get install --only-upgrade docker-ce docker-ce-cli containerd.io -y || true

            echo "========== [2] Cost-Data 리포지토리 대량 동기화 =========="
            # 데이터를 저장할 서버 경로 (필요시 수정하세요)
            DEPLOY_DIR="/home/${{ secrets.SERVER_USER }}/cost-data"
            REPO_URL="https://github.com/koreatest12/cost-data.git"

            # 1. 폴더가 없으면 Clone(복제)
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "폴더가 없어 새로 복제합니다."
              git clone "$REPO_URL" "$DEPLOY_DIR"
            else
              # 2. 폴더가 있으면 강제 동기화 (Reset Hard)
              echo "기존 폴더를 최신 상태로 강제 동기화합니다."
              cd "$DEPLOY_DIR"
              
              # 최신 변경사항 가져오기
              git fetch origin main
              
              # [중요] '대량 적용'의 핵심: 로컬의 변경사항을 무시하고 리포지토리와 100% 똑같이 맞춤
              git reset --hard origin/main
              
              # 불필요한 파일 삭제 (리포지토리에 없는 파일 제거)
              git clean -fd
            fi

            echo "-> $DEPLOY_DIR 경로에 데이터 동기화 완료"

            echo "========== [3] 도커 컨테이너 서비스 업그레이드 =========="
            # docker-compose.yml 파일이 위에서 동기화한 폴더 안에 있다고 가정
            # 만약 다른 곳에 있다면 경로를 수정해야 함 (예: cd /home/user/my-app)
            cd "$DEPLOY_DIR"

            # 최신 이미지가 있다면 받아오기
            docker-compose pull

            # 컨테이너 재생성 (이미지나 설정이 변경된 경우만 재시작됨)
            docker-compose up -d --remove-orphans

            # 디스크 공간 확보를 위해 사용하지 않는 이미지 정리
            docker image prune -f
            
            echo "========== 모든 작업 완료 =========="
