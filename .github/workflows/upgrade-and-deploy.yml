name: 🚀 ULTIMATE ENTERPRISE UPGRADE & FAST-BUILD (v15.5)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  system-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 [1] 소스 클론
        uses: actions/checkout@v4

      - name: 📂 [2] 환경 정렬 및 경로 생성
        run: mkdir -p public/data assets/data pages middleware

      - name: 🐍 [3] 데이터 엔진 가동
        run: |
          python3 -c "
          import sqlite3, random, json
          conn = sqlite3.connect('tax_master.db')
          cur = conn.cursor()
          cur.execute('CREATE TABLE tax (id INTEGER, name TEXT, salary INTEGER, tax INTEGER)')
          data = [(i, f'Manager_{i:02d}', s:=random.randint(4000, 12000)*10000, int(s*0.15)) for i in range(1, 61)]
          cur.executemany('INSERT INTO tax VALUES (?,?,?,?)', data)
          conn.commit()
          res = [dict(zip(['id','name','salary','tax'], r)) for r in cur.execute('SELECT * FROM tax').fetchall()]
          with open('public/data/report.json', 'w') as f: json.dump(res, f)
          conn.close()
          "
          cp public/data/report.json assets/data/report.json

      - name: ⚡ [4] 빌드 가속화 (Dependency Caching)
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 🛠️ [5] 엔터프라이즈 UI 및 빌드 설정 업그레이드
        env:
          SECRET_KEY: ${{ secrets.ENTERPRISE_PASSKEY || 'admin123' }}
        run: |
          # 1. package.json (최신 의존성 적용)
          cat <<'EOF' > package.json
          {
            "name": "tax-master-v15",
            "type": "module",
            "scripts": { "build": "nuxt build", "generate": "nuxt generate" },
            "devDependencies": { "nuxt": "^3.10.0", "sass": "^1.70.0" }
          }
          EOF

          # 2. nuxt.config.ts (빌드 최적화 및 보안)
          PASS_HASH=$(echo -n "$SECRET_KEY" | sha256sum | cut -d' ' -f1)
          cat <<EOF > nuxt.config.ts
          export default defineNuxtConfig({
            runtimeConfig: { public: { passkeyHash: '$PASS_HASH' } },
            ssr: false,
            app: {
              head: { title: 'TAX-MASTER Enterprise v15.5' },
              baseURL: './'
            }
          })
          EOF

          # 3. 고도화된 메인 대시보드 UI
          cat <<'EOF' > pages/index.vue
          <template>
            <div class="app-container">
              <aside class="sidebar">
                <h2>🏢 HQ System</h2>
                <div class="stats-card">
                  <p>총 인원: <strong>{{ reports.length }}명</strong></p>
                  <p>평균 급여: <strong>{{ avgSalary }}원</strong></p>
                </div>
                <button @click="logout" class="btn-logout">보안 로그아웃</button>
              </aside>
              <main class="content">
                <header class="top-bar">
                  <h1>📊 실시간 급여/세무 분석 리포트</h1>
                </header>
                <div class="data-grid">
                  <div v-for="item in reports" :key="item.id" class="item-card">
                    <div class="user-info">
                      <span class="name">{{ item.name }}</span>
                      <span class="id">#{{ item.id }}</span>
                    </div>
                    <div class="amount-info">
                      <p>연봉: {{ item.salary.toLocaleString() }}</p>
                      <p class="tax">세액: {{ item.tax.toLocaleString() }}</p>
                    </div>
                  </div>
                </div>
              </main>
            </div>
          </template>
          <script setup>
          import data from '../assets/data/report.json';
          const reports = data;
          const avgSalary = Math.floor(reports.reduce((acc, cur) => acc + cur.salary, 0) / reports.length).toLocaleString();
          const logout = () => { localStorage.removeItem('auth_session'); navigateTo('/login'); };
          </script>
          <style>
          .app-container { display: flex; min-height: 100vh; background: #f1f5f9; font-family: sans-serif; }
          .sidebar { width: 280px; background: #1e293b; color: white; padding: 30px; }
          .content { flex: 1; padding: 40px; }
          .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
          .item-card { background: white; padding: 20px; border-radius: 12px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
          .tax { color: #ef4444; font-weight: bold; }
          .btn-logout { margin-top: 40px; width: 100%; padding: 10px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; }
          </style>
          EOF

          # 4. 보안 인증 페이지 & 미들웨어 (이전 단계 유지)
          mkdir -p middleware
          cat <<'EOF' > middleware/auth.global.ts
          export default defineNuxtRouteMiddleware((to) => {
            if (process.client && !localStorage.getItem('auth_session') && to.path !== '/login') return navigateTo('/login');
          })
          EOF

      - name: 🚀 [6] 고속 빌드 및 정적 생성
        run: |
          npm install
          npm run generate

      - name: 📤 [7] Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: system-intelligence
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
