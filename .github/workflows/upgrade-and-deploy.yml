name: Build, Auto-Scaffold & Deploy (Final Fix)

on:
  workflow_dispatch: # 수동 실행
  push:
    branches: [ "main" ]

jobs:
  # [Job 1] 파일/디렉토리 자동 생성 -> 빌드 -> 서버 전송
  build-and-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🛠️ 프로젝트 구조 분석 및 대량 파일 자동 생성
        run: |
          echo ">>> [Phase 1] 프로젝트 구조 진단 시작"
          
          # 1. Java 프로젝트 감지
          if [ -f "pom.xml" ] || [ -f "build.gradle" ]; then
             echo "✅ Java 프로젝트 감지됨."
             PROJECT_TYPE="JAVA"
          
          # 2. Node.js 프로젝트 감지
          elif [ -f "package.json" ]; then
             echo "✅ Node.js 프로젝트 감지됨."
             PROJECT_TYPE="NODE"
          
          # 3. 아무것도 없을 경우 -> 정적 웹사이트(Nginx)로 자동 생성
          else
             echo "⚠️ 소스 코드가 없습니다. '대량 파일 생성 모드'를 실행합니다..."
             PROJECT_TYPE="STATIC"
             
             # 디렉토리 생성
             mkdir -p src/main/resources/static
             
             # 샘플 HTML 파일 생성
             echo '<!DOCTYPE html><html><body><h1>🚀 배포 성공! (Auto-Generated)</h1><p>소스코드가 감지되지 않아 샘플 페이지가 생성되었습니다.</p></body></html>' > src/main/resources/static/index.html
             
             echo "✅ 샘플 파일 및 디렉토리 구조 생성 완료."
          fi

          # 4. Dockerfile 자동 생성 (EOF 문법 오류 방지를 위해 printf 사용)
          if [ ! -f "Dockerfile" ]; then
            echo ">>> [Phase 2] Dockerfile이 없어 자동으로 생성합니다 ($PROJECT_TYPE 타입)"
            
            if [ "$PROJECT_TYPE" == "JAVA" ]; then
                # Java용 Dockerfile 생성
                printf "FROM gradle:8.5-jdk17 AS builder\n" > Dockerfile
                printf "WORKDIR /app\n" >> Dockerfile
                printf "COPY . .\n" >> Dockerfile
                printf "RUN if [ -f \"build.gradle\" ]; then gradle build -x test --no-daemon; else apt-get update && apt-get install -y maven && mvn clean package -DskipTests; fi\n\n" >> Dockerfile
                printf "FROM openjdk:17-jdk-slim\n" >> Dockerfile
                printf "WORKDIR /app\n" >> Dockerfile
                printf "COPY --from=builder /app/build/libs/*.jar app.jar 2>/dev/null || COPY --from=builder /app/target/*.jar app.jar\n" >> Dockerfile
                printf "ENTRYPOINT [\"java\", \"-jar\", \"app.jar\"]\n" >> Dockerfile

            elif [ "$PROJECT_TYPE" == "NODE" ]; then
                # Node.js용 Dockerfile 생성
                printf "FROM node:18-alpine\n" > Dockerfile
                printf "WORKDIR /app\n" >> Dockerfile
                printf "COPY package*.json ./\n" >> Dockerfile
                printf "RUN npm install --production\n" >> Dockerfile
                printf "COPY . .\n" >> Dockerfile
                printf "CMD [\"npm\", \"start\"]\n" >> Dockerfile

            else
                # 정적 웹(Nginx)용 Dockerfile 생성
                printf "FROM nginx:alpine\n" > Dockerfile
                printf "COPY src/main/resources/static /usr/share/nginx/html\n" >> Dockerfile
            fi
            
            echo "✅ Dockerfile 생성 완료:"
            cat Dockerfile
          fi

      - name: 🐳 도커 이미지 빌드 (로그인 불필요)
        run: |
          # 위에서 생성된 Dockerfile로 빌드
          docker build -t cost-data-app:latest .
          # 이미지를 파일로 추출 (.tar)
          docker save -o cost-data-app.tar cost-data-app:latest

      - name: 🚀 서버로 이미지 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "cost-data-app.tar,docker-compose.yml"
          target: "/home/${{ secrets.SERVER_USER }}/cost-data-service/"

  # [Job 2] 서버 접속 및 컨테이너 업그레이드
  deploy-server:
    needs: build-and-transfer
    runs-on: ubuntu-latest
    steps:
      - name: SSH 접속 및 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            APP_DIR="/home/${{ secrets.SERVER_USER }}/cost-data-service"
            cd $APP_DIR

            echo ">>> [Phase 1] 환경 변수(.env) 설정"
            # API 키나 DB 정보가 없어도 에러가 나지 않도록 빈 값 처리
            cat <<ENV > .env
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            API_KEY=${{ secrets.API_KEY }}
            ENV

            echo ">>> [Phase 2] Docker 이미지 로드 (Load)"
            # 이전 이미지 로드 실패 방지
            docker load -i cost-data-app.tar

            echo ">>> [Phase 3] 컨테이너 실행"
            # docker-compose.yml이 없으면 임시 생성
            if [ ! -f "docker-compose.yml" ]; then
                echo "docker-compose.yml이 없어 임시로 생성합니다."
                echo "version: '3'" > docker-compose.yml
                echo "services:" >> docker-compose.yml
                echo "  app:" >> docker-compose.yml
                echo "    image: cost-data-app:latest" >> docker-compose.yml
                echo "    ports: ['80:80', '8080:8080']" >> docker-compose.yml
                echo "    restart: always" >> docker-compose.yml
                echo "    env_file: .env" >> docker-compose.yml
            fi

            # docker-compose 파일 내 이미지 이름 강제 보정
            sed -i 's|image: .*|image: cost-data-app:latest|g' docker-compose.yml
            
            # 컨테이너 재실행
            docker compose up -d --force-recreate

            # 파일 정리
            rm -f cost-data-app.tar
            docker image prune -f

            echo ">>> 모든 배포 과정이 성공적으로 완료되었습니다."
