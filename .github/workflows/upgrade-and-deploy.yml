name: 🚀 Nuxt & Intelligent Tax-Engine Enterprise v5.5

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # [Step 1] 대량 데이터 분석 및 지능형 DB 구축 (백엔드 엔진)
  intelligent-engine-processing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clone Deep Data Source
        run: git clone https://github.com/koreatest12/cost-data.git data_source

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Advanced Engine Dependencies
        run: pip install pandas openpyxl sqlalchemy numpy aiosmtpd

      - name: 🛠️ 실행: 지능형 세무 지식 베이스 및 대량 연산 엔진
        run: |
          cat <<'EOF' > full_upgrade_engine.py
          import os, sqlite3, json, glob
          import pandas as pd

          def build_enterprise_system():
              conn = sqlite3.connect('tax_master.db')
              cur = conn.cursor()
              # 고성능 PRAGMA 설정
              cur.execute("PRAGMA journal_mode=WAL")
              
              # 스키마 대량 생성 및 업그레이드
              cur.executescript("""
                  DROP TABLE IF EXISTS tax_knowledge;
                  CREATE TABLE tax_knowledge (id INTEGER PRIMARY KEY, min_val INTEGER, max_val INTEGER, rate REAL, ded INTEGER);
                  CREATE TABLE IF NOT EXISTS tax_results (
                      id INTEGER PRIMARY KEY AUTOINCREMENT, 
                      name TEXT, salary INTEGER, tax INTEGER, advice TEXT, processed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                  );
                  CREATE INDEX IF NOT EXISTS idx_salary ON tax_results(salary);
              """)

              # 2026 최신 누진 세율 지식 대량 주입 (대량 업그레이드 반영)
              knowledge = [
                  (1, 0, 14000000, 0.06, 0),
                  (2, 14000000, 50000000, 0.15, 1260000),
                  (3, 50000000, 88000000, 0.24, 5760000),
                  (4, 88000000, 150000000, 0.35, 15440000),
                  (5, 150000000, 300000000, 0.38, 19940000)
              ]
              cur.executemany("INSERT INTO tax_knowledge VALUES (?,?,?,?,?)", knowledge)
              
              # Deep Scan: 모든 경로의 대량 파일 자동 분석
              files = glob.glob('data_source/**/*', recursive=True)
              for f in files:
                  if os.path.isfile(f):
                      ext = os.path.splitext(f)[1].lower()
                      try:
                          if ext == '.json':
                              with open(f, 'r', encoding='utf-8') as jf:
                                  d = json.load(jf)
                                  items = d if isinstance(d, list) else [d]
                                  for i in items:
                                      process_data(cur, i.get('name', 'N/A'), int(i.get('total_salary', 0)))
                      except: continue
              conn.commit()
              conn.close()

          def process_data(cur, name, sal):
              if sal <= 0: return
              cur.execute("SELECT * FROM tax_knowledge WHERE ? > min_val AND ? <= max_val", (sal, sal))
              rule = cur.fetchone()
              tax = int(sal * rule[3] - rule[4]) if rule else 0
              advice = f"적용세율 {int(rule[3]*100) if rule else 0}% 최적화 알고리즘 반영"
              cur.execute("INSERT INTO tax_results (name, salary, tax, advice) VALUES (?,?,?,?)", (name, sal, tax, advice))

          if __name__ == "__main__": build_enterprise_system()
          EOF
          python full_upgrade_engine.py

      - name: Upload Intelligent DB
        uses: actions/upload-artifact@v4
        with:
          name: tax-enterprise-db
          path: tax_master.db

  # [Step 2] Nuxt 프론트엔드 대량 빌드 (DB 데이터 포함)
  build:
    needs: intelligent-engine-processing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Intelligent DB
        uses: actions/download-artifact@v4
        with:
          name: tax-enterprise-db

      - name: Setup Node (Optimized Cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Nuxt Dependencies
        run: npm ci

      - name: Generate Static Nuxt Site with Data Integration
        run: |
          mkdir -p public/data
          cp tax_master.db public/data/
          # DB 데이터를 기반으로 정적 JSON 파일 대량 생성 (Nuxt에서 접근 가능하도록)
          python -c "import sqlite3, json; conn=sqlite3.connect('tax_master.db'); conn.row_factory=sqlite3.Row; data=[dict(r) for r in conn.execute('SELECT * FROM tax_results').fetchall()]; open('public/data/report.json', 'w').write(json.dumps(data))"
          npm run generate

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  # [Step 3] 최종 배포
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
