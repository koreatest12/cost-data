name: 🏢 세금 마스터 시스템 (업그레이드 및 배포)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  # ==================================================================================
  # [Job] 데이터 마이그레이션 -> 엔진 구동 -> 결과 분석 -> 리포트 생성
  # ==================================================================================
  master-processing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 메인 시스템 체크아웃
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # [Step 1] 전체 데이터 리포지토리 마이그레이션 (모든 하위 폴더 포함)
      # ----------------------------------------------------------------------
      - name: 📥 데이터 마이그레이션 (koreatest12/cost-data)
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: app_root/cost_data
          fetch-depth: 0 # 전체 히스토리 및 모든 하위 파일 가져오기

      - name: 🔧 파일 권한 대량 수정
        run: |
          echo ">>> 데이터 접근 권한을 수정합니다 (재귀적 적용)..."
          chmod -R 755 app_root/cost_data

      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # ----------------------------------------------------------------------
      # [Step 2] 마스터 시뮬레이션 엔진 생성 (Engine + Web UI)
      # ----------------------------------------------------------------------
      - name: 🏗️ 마스터 시스템 코드 생성
        run: |
          mkdir -p app_root/templates
          mkdir -p app_root/static

          # 1. 필수 라이브러리 설정
          cat <<EOF > app_root/requirements.txt
          flask
          pandas
          openpyxl
          pdfplumber
          tabulate
          EOF

          # 2. [Core] 마이그레이션 및 계산 엔진 (engine.py)
          # (모든 하위 폴더 검색 기능 포함됨)
          cat <<EOF > app_root/engine.py
          import os
          import glob
          import json
          import pandas as pd
          import pdfplumber
          import re
          from collections import defaultdict
          from tabulate import tabulate

          DATA_DIR = 'cost_data'
          
          # [A] 데이터 저장소 (In-Memory DB)
          db = defaultdict(lambda: {
              'salary': 0,        'pension': 0,       'insurance': 0,
              'medical': 0,       'card': 0,          'donation': 0,
              'pre_paid': 0,      'files': set()
          })

          # [B] 정밀 파싱 헬퍼
          def extract_number(text, keywords, min_value=0):
              best_val = 0
              for key in keywords:
                  matches = re.finditer(key + r'[^0-9\n]*([0-9,]+)', text)
                  for match in matches:
                      try:
                          val = int(match.group(1).replace(',', ''))
                          if val >= min_value:
                              best_val = max(best_val, val)
                      except: pass
              return best_val

          # [C] 데이터 마이그레이션 (재귀적 전체 스캔)
          def migrate_data():
              # 모든 하위 폴더(**)와 모든 파일(*) 스캔
              search_path = os.path.join(DATA_DIR, '**', '*')
              all_entries = glob.glob(search_path, recursive=True)
              all_files = [f for f in all_entries if os.path.isfile(f)]
              
              print(f">>> [Migration] 총 {len(all_files)}개의 파일을 분석합니다.")

              for filepath in all_files:
                  filename = os.path.basename(filepath)
                  _, ext = os.path.splitext(filepath)
                  ext = ext.lower()
                  name = None
                  
                  try:
                      # 1. JSON
                      if ext == '.json':
                          with open(filepath, 'r', encoding='utf-8') as f:
                              js = json.load(f)
                              name = js.get('name')
                              if name:
                                  db[name]['salary'] = max(db[name]['salary'], int(js.get('total_salary', 0)))
                                  db[name]['card'] += int(js.get('credit', 0)) + int(js.get('debit', 0))

                      # 2. Excel
                      elif ext in ['.xlsx', '.xls']:
                          df = pd.read_excel(filepath)
                          row = df.iloc[0]
                          for col in ['name', '성명', '이름']:
                              if col in df.columns:
                                  name = row[col]; break
                          if name:
                              if 'total_salary' in row: db[name]['salary'] = max(db[name]['salary'], int(row['total_salary']))
                              if 'credit' in row: db[name]['card'] += int(row['credit'])

                      # 3. PDF
                      elif ext == '.pdf':
                          with pdfplumber.open(filepath) as pdf:
                              text = "".join([p.extract_text() or "" for p in pdf.pages])
                              nm_match = re.search(r'성\s*명\s*[:]?\s*([가-힣]{2,4})', text)
                              if nm_match: name = nm_match.group(1)
                              else:
                                  nm_file = re.match(r'([가-힣]{2,4})', filename)
                                  if nm_file: name = nm_file.group(1)
                              
                              if name:
                                  salary = extract_number(text, ['총급여', '급여계', '소득월액'], 1000000)
                                  if salary > 0: db[name]['salary'] = max(db[name]['salary'], salary)
                                  db[name]['insurance'] += extract_number(text, ['보장성', '보험료'])
                                  db[name]['pension'] += extract_number(text, ['국민연금', '연금'])
                                  db[name]['medical'] += extract_number(text, ['의료비', '진료비'])
                                  db[name]['card'] += extract_number(text, ['신용카드', '직불카드', '현금영수증'])
                                  db[name]['donation'] += extract_number(text, ['기부금'])
                      
                      if name: db[name]['files'].add(filename)
                  except Exception as e:
                      print(f"Skipping {filename}: {e}")
              return db

          # [D] 정산 시뮬레이션
          def run_simulation():
              migrate_data()
              results = []
              for name, data in db.items():
                  if not name or len(name) < 2: continue
                  
                  salary = data['salary'] if data['salary'] > 0 else 40000000
                  is_estimated = (data['salary'] == 0)
                  
                  # 간이 세액 계산 로직
                  if salary <= 5000000: income_ded = salary * 0.7
                  elif salary <= 15000000: income_ded = 3500000 + (salary - 5000000) * 0.4
                  elif salary <= 45000000: income_ded = 7500000 + (salary - 15000000) * 0.15
                  elif salary <= 100000000: income_ded = 12000000 + (salary - 45000000) * 0.05
                  else: income_ded = 14750000 + (salary - 100000000) * 0.02
                  
                  basic_ded = 1500000
                  card_ded = min(max((data['card'] - salary*0.25) * 0.15, 0), 3000000)
                  
                  tax_base = max(salary - (income_ded + basic_ded + data['pension'] + data['insurance'] + data['donation'] + card_ded), 0)
                  
                  if tax_base <= 14000000: calc_tax = tax_base * 0.06
                  elif tax_base <= 50000000: calc_tax = 840000 + (tax_base - 14000000) * 0.15
                  elif tax_base <= 88000000: calc_tax = 6240000 + (tax_base - 50000000) * 0.24
                  else: calc_tax = 15360000 + (tax_base - 88000000) * 0.35
                  
                  determined_tax = max(calc_tax - (min(data['insurance'], 1000000)*0.12), 0)
                  pre_paid = data['pre_paid'] if data['pre_paid'] > 0 else int(salary * 0.045)
                  final_money = int(determined_tax - pre_paid)
                  
                  results.append({
                      "name": name, "salary": int(salary), "salary_note": "(추정)" if is_estimated else "",
                      "files_count": len(data['files']),
                      "tax": { "determined": int(determined_tax), "pre_paid": int(pre_paid) },
                      "final_money": final_money, "type": "환급" if final_money < 0 else "징수"
                  })
              return results

          if __name__ == "__main__":
              res = run_simulation()
              with open('final_result.json', 'w', encoding='utf-8') as f:
                  json.dump(res, f, ensure_ascii=False)
              
              print("\n" + "="*80 + "\n   🚀 [Master] 시뮬레이션 결과\n" + "="*80)
              table = []
              for r in res:
                  table.append([r['name'], f"{r['salary']:,}", f"{r['files_count']}개", r['type'], f"{abs(r['final_money']):,} 원"])
              if not res: print("데이터 없음")
              else: print(tabulate(table, headers=["성명", "총급여", "파일", "결과", "금액"], tablefmt="grid"))
          EOF

          # 3. [UI] 웹 리포트 서버 (app.py)
          cat <<EOF > app_root/app.py
          from flask import Flask, render_template_string
          import json
          
          app = Flask(__name__)
          
          @app.route('/')
          def index():
              try:
                  with open('final_result.json', 'r', encoding='utf-8') as f: results = json.load(f)
              except: results = []
              
              total_refund = sum([abs(r['final_money']) for r in results if r['final_money'] < 0])
              total_collect = sum([r['final_money'] for r in results if r['final_money'] >= 0])
              
              html = """
              <!DOCTYPE html>
              <html>
              <head>
                  <title>Tax Master Report</title>
                  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
                  <style>body { background: #f8f9fa; }</style>
              </head>
              <body class="p-5">
                  <div class="container bg-white p-5 shadow rounded">
                      <h2 class="fw-bold mb-4">🏢 연말정산 마스터 리포트</h2>
                      <div class="row text-center mb-5">
                          <div class="col-6"><div class="card bg-primary text-white p-3"><h3>환급 총액</h3><h1>{{ "{:,}".format(total_refund) }} 원</h1></div></div>
                          <div class="col-6"><div class="card bg-danger text-white p-3"><h3>징수 총액</h3><h1>{{ "{:,}".format(total_collect) }} 원</h1></div></div>
                      </div>
                      <table class="table table-hover">
                          <thead><tr><th>성명</th><th>총급여</th><th>파일수</th><th>결과</th></tr></thead>
                          <tbody>
                              {% for r in results %}
                              <tr>
                                  <td class="fw-bold">{{ r.name }}</td>
                                  <td>{{ "{:,}".format(r.salary) }} <small>{{ r.salary_note }}</small></td>
                                  <td>{{ r.files_count }}</td>
                                  <td>
                                      {% if r.final_money < 0 %} <span class="text-primary fw-bold">환급 +{{ "{:,}".format(abs(r.final_money)) }}</span>
                                      {% else %} <span class="text-danger fw-bold">징수 -{{ "{:,}".format(r.final_money) }}</span> {% endif %}
                                  </td>
                              </tr>
                              {% endfor %}
                          </tbody>
                      </table>
                  </div>
              </body>
              </html>
              """
              return render_template_string(html, results=results, total_refund=total_refund, total_collect=total_collect)
          
          if __name__ == '__main__': app.run(host='0.0.0.0', port=8080)
          EOF

          # Dockerfile
          cat <<EOF > app_root/Dockerfile
          FROM python:3.9-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY . .
          RUN chmod -R 755 cost_data
          EXPOSE 8080
          CMD ["python", "app.py"]
          EOF

      # ----------------------------------------------------------------------
      # [Step 3] 엔진 구동
      # ----------------------------------------------------------------------
      - name: 🚀 마이그레이션 & 시뮬레이션 실행
        run: |
          cd app_root
          pip install -r requirements.txt
          python engine.py

      # ----------------------------------------------------------------------
      # [Step 4] 최종 산출물 빌드 및 저장 (한글 이름 반영)
      # ----------------------------------------------------------------------
      - name: 🐳 마스터 시스템 이미지 빌드
        run: |
          cd app_root
          docker build -t tax-master-system:latest .
          docker save -o tax-master-system.tar tax-master-system:latest

      - name: 📦 실행 파일 저장 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: 세금 마스터 시스템 앱  # ✅ 요청하신대로 결과물 이름을 한글로 변경했습니다.
          path: app_root/tax-master-system.tar
          retention-days: 7
