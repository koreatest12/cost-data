name: 💰 Tax Money Simulation (Fixed & Upgraded)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  calculate-and-show:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 메인 코드 체크아웃
        uses: actions/checkout@v4

      # 1. 정산 데이터 가져오기
      - name: 📥 데이터 리포지토리 연동
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: app_root/cost_data
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 2. 시뮬레이션 엔진 및 웹 앱 생성 (수정됨)
      - name: 🏗️ 시뮬레이션 엔진 & 리포트 생성기 작성
        run: |
          mkdir -p app_root/templates
          mkdir -p app_root/static

          # [패키지 설정]
          cat <<EOF > app_root/requirements.txt
          flask
          pandas
          openpyxl
          pdfplumber
          tabulate
          EOF

          # [핵심] 시뮬레이터 + 결과 출력 + 웹 생성 (simulator.py)
          cat <<EOF > app_root/simulator.py
          import os
          import glob
          import json
          import pandas as pd
          import pdfplumber
          import re
          from tabulate import tabulate

          DATA_DIR = 'cost_data'
          
          # --- 1. 세금 계산 로직 ---
          def calculate_money(data):
              salary = int(data.get('total_salary', 0))
              
              # 유효성 검사: 급여가 너무 적으면(100만원 미만) 계산 불가 처리
              if salary < 1000000:
                  return None

              # 소득공제 (간이)
              if salary <= 5000000: income_ded = salary * 0.7
              elif salary <= 15000000: income_ded = 3500000 + (salary - 5000000) * 0.4
              elif salary <= 45000000: income_ded = 7500000 + (salary - 15000000) * 0.15
              elif salary <= 100000000: income_ded = 12000000 + (salary - 45000000) * 0.05
              else: income_ded = 14750000 + (salary - 100000000) * 0.02
              
              basic_ded = 1500000
              pension = float(data.get('pension', 0))
              card = float(data.get('credit', 0)) + float(data.get('debit', 0))
              
              # 과세표준
              tax_base = max(salary - (income_ded + basic_ded + pension + (card * 0.15)), 0)
              
              # 산출세액
              if tax_base <= 14000000: calc_tax = tax_base * 0.06
              elif tax_base <= 50000000: calc_tax = 840000 + (tax_base - 14000000) * 0.15
              else: calc_tax = 6240000 + (tax_base - 50000000) * 0.24
              
              # 기납부세액 (데이터 없으면 급여의 3% 가정)
              pre_paid = float(data.get('pre_paid_tax', salary * 0.03))
              
              final_money = int(calc_tax - pre_paid)
              
              return {
                  "name": data.get('name', '미상'),
                  "filename": data.get('filename', ''),
                  "salary": salary,
                  "calc_tax": int(calc_tax),
                  "pre_paid": int(pre_paid),
                  "final_money": final_money,
                  "type": "💰환급(받을돈)" if final_money < 0 else "💸징수(낼돈)",
                  "abs_money": abs(final_money)
              }

          # --- 2. 데이터 파싱 (개선됨) ---
          def run_simulation():
              files = glob.glob(os.path.join(DATA_DIR, '**', '*.*'), recursive=True)
              results = []
              
              for filepath in files:
                  ext = os.path.splitext(filepath)[1].lower()
                  filename = os.path.basename(filepath)
                  data = {"name": filename, "filename": filename}
                  
                  try:
                      if ext == '.json':
                          with open(filepath, 'r', encoding='utf-8') as f: data.update(json.load(f))
                          
                      elif ext == '.xlsx':
                          df = pd.read_excel(filepath)
                          if 'total_salary' in df.columns: data.update(df.iloc[0].to_dict())
                          
                      elif ext == '.pdf':
                          with pdfplumber.open(filepath) as pdf:
                              text = "".join([p.extract_text() or "" for p in pdf.pages])
                              
                              # [개선된 파싱] 7자리 이상(100만원 이상) 숫자만 급여로 인식
                              # "총급여" 주변의 큰 숫자를 찾음
                              sal_match = re.search(r'총\s*급\s*여[^0-9]*([0-9,]{7,})', text)
                              if sal_match:
                                  data['total_salary'] = int(sal_match.group(1).replace(',',''))
                              
                              # 이름 추출
                              nm = re.search(r'성\s*명\s*[:]?\s*([가-힣]{2,4})', text)
                              if nm: data['name'] = nm.group(1)
                      
                      # 계산 시도
                      if 'total_salary' in data:
                          res = calculate_money(data)
                          if res: results.append(res)
                          
                  except Exception as e:
                      # 에러가 나도 멈추지 않고 다음 파일 진행
                      print(f"Skipping {filename}: {e}")
              
              return results

          if __name__ == "__main__":
              results = run_simulation()
              
              # 1. [콘솔 출력]
              print("\n" + "="*80)
              print("   💰 [2025 귀속] 연말정산 금액 시뮬레이션 결과 (AI 분석)")
              print("="*80)
              
              table_data = []
              total_refund = 0
              total_pay = 0
              
              for r in results:
                  money_str = f"{r['abs_money']:,} 원"
                  table_data.append([r['name'], f"{r['salary']:,}", r['type'], money_str])
                  if r['final_money'] < 0: total_refund += abs(r['final_money'])
                  else: total_pay += r['final_money']
              
              if not results:
                  print("⚠️ 유효한 급여 데이터가 포함된 파일을 찾지 못했습니다.")
              else:
                  print(tabulate(table_data, headers=["이름/파일", "총급여", "구분", "금액"], tablefmt="grid"))
                  
                  print("\n" + "-"*80)
                  print(f" 💵 총 환급 예상액 (받을 돈): {total_refund:,} 원")
                  print(f" 💳 총 징수 예상액 (낼 돈)  : {total_pay:,} 원")
                  print("-" * 80 + "\n")
              
              # 2. [웹 데이터 저장] (경로 에러 수정됨: app_root/ 제거)
              with open('data.json', 'w', encoding='utf-8') as f:
                  json.dump({"results": results, "total_refund": f"{total_refund:,}", "total_pay": f"{total_pay:,}"}, f, ensure_ascii=False)
          EOF

          # [웹 서버] Flask App
          cat <<EOF > app_root/app.py
          from flask import Flask, render_template_string
          import json
          
          app = Flask(__name__)
          
          @app.route('/')
          def index():
              try:
                  with open('data.json', 'r', encoding='utf-8') as f:
                      data = json.load(f)
              except:
                  data = {"results": [], "total_refund": "0", "total_pay": "0"}
              
              html_template = """
              <!DOCTYPE html>
              <html>
              <head>
                  <title>정산 시뮬레이션 결과</title>
                  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
              </head>
              <body class="bg-light p-5">
                  <div class="container bg-white p-5 shadow rounded">
                      <h2 class="mb-4 fw-bold text-center">💰 연말정산 금액 시뮬레이션</h2>
                      <div class="alert alert-info text-center">GitHub Actions 자동 분석 결과 (Cost-Data 연동)</div>
                      <div class="row text-center mb-4">
                          <div class="col-6"><div class="p-3 bg-primary text-white rounded"><h4>총 환급액</h4><h1>{{data.total_refund}} 원</h1></div></div>
                          <div class="col-6"><div class="p-3 bg-danger text-white rounded"><h4>총 징수액</h4><h1>{{data.total_pay}} 원</h1></div></div>
                      </div>
                      <table class="table table-striped table-hover text-center align-middle">
                          <thead class="table-dark"><tr><th>이름</th><th>총급여</th><th>구분</th><th>금액</th></tr></thead>
                          <tbody>
                              {% for r in data.results %}
                              <tr>
                                  <td>{{ r.name }}<br><small class="text-muted">{{ r.filename }}</small></td>
                                  <td>{{ "{:,}".format(r.salary) }}</td>
                                  <td><span class="badge {% if r.final_money < 0 %}bg-primary{% else %}bg-danger{% endif %}">{{ r.type }}</span></td>
                                  <td class="fw-bold">{{ "{:,}".format(r.abs_money) }}</td>
                              </tr>
                              {% endfor %}
                              {% if not data.results %}
                              <tr><td colspan="4" class="text-muted py-4">분석 가능한 급여 데이터가 없습니다.</td></tr>
                              {% endif %}
                          </tbody>
                      </table>
                  </div>
              </body>
              </html>
              """
              return render_template_string(html_template, data=data)

          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=8080)
          EOF

          # [Dockerfile]
          cat <<EOF > app_root/Dockerfile
          FROM python:3.9-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY . .
          EXPOSE 8080
          CMD ["python", "app.py"]
          EOF

      # 3. [핵심] 시뮬레이션 실행 (로그 확인용)
      - name: 🚀 금액 시뮬레이션 실행 & 결과보기
        run: |
          cd app_root
          pip install -r requirements.txt
          python simulator.py

      # 4. 도커 이미지 빌드
      - name: 🐳 시뮬레이션 결과 앱 빌드
        run: |
          cd app_root
          docker build -t tax-money-simulation:latest .
          docker save -o tax-money-simulation.tar tax-money-simulation:latest

      # 5. 아티팩트 업로드
      - name: 📦 실행 파일 저장
        uses: actions/upload-artifact@v4
        with:
          name: Tax_Money_Simulation_App
          path: app_root/tax-money-simulation.tar
          retention-days: 7
