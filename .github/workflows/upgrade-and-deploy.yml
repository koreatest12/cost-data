name: 🏢 세금 마스터 시스템 (업그레이드 및 배포)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  master-processing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 메인 시스템 체크아웃
        uses: actions/checkout@v4

      - name: 📥 데이터 마이그레이션 (Deep Scan)
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: app_root/cost_data
          fetch-depth: 0 

      - name: 🔧 파일 권한 대량 수정
        run: chmod -R 755 app_root/cost_data

      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 🏗️ 마스터 시스템 코드 생성 (영수증 기능 추가)
        run: |
          mkdir -p app_root/templates
          mkdir -p app_root/static
          mkdir -p app_root/receipts  # 영수증 저장소 생성

          # 1. 라이브러리 설정
          cat <<EOF > app_root/requirements.txt
          flask
          pandas
          openpyxl
          pdfplumber
          tabulate
          EOF

          # 2. [Core] 엔진 (영수증 대량 발급 로직 추가)
          cat <<EOF > app_root/engine.py
          import os, glob, json, re
          import pandas as pd
          import pdfplumber
          from collections import defaultdict
          from tabulate import tabulate

          DATA_DIR = 'cost_data'
          RECEIPT_DIR = 'receipts'
          
          db = defaultdict(lambda: {
              'salary': 0, 'pension': 0, 'insurance': 0,
              'medical': 0, 'card': 0, 'donation': 0,
              'pre_paid': 0, 'files': set()
          })

          def extract_number(text, keywords, min_value=0):
              best_val = 0
              for key in keywords:
                  matches = re.finditer(key + r'[^0-9\n]*([0-9,]+)', text)
                  for match in matches:
                      try:
                          val = int(match.group(1).replace(',', ''))
                          if val >= min_value: best_val = max(best_val, val)
                      except: pass
              return best_val

          def migrate_data():
              # 모든 하위 폴더/파일 스캔
              all_files = [f for f in glob.glob(os.path.join(DATA_DIR, '**', '*'), recursive=True) if os.path.isfile(f)]
              print(f">>> [Migration] 총 {len(all_files)}개 파일 분석 중...")

              for filepath in all_files:
                  try:
                      fname = os.path.basename(filepath)
                      _, ext = os.path.splitext(filepath)
                      ext = ext.lower()
                      name = None
                      
                      if ext == '.json':
                          with open(filepath, 'r', encoding='utf-8') as f:
                              js = json.load(f)
                              name = js.get('name')
                              if name:
                                  db[name]['salary'] = max(db[name]['salary'], int(js.get('total_salary', 0)))
                                  db[name]['card'] += int(js.get('credit', 0)) + int(js.get('debit', 0))
                      elif ext in ['.xlsx', '.xls']:
                          df = pd.read_excel(filepath)
                          row = df.iloc[0]
                          for col in ['name', '성명', '이름']:
                              if col in df.columns: name = row[col]; break
                          if name:
                              if 'total_salary' in row: db[name]['salary'] = max(db[name]['salary'], int(row['total_salary']))
                              if 'credit' in row: db[name]['card'] += int(row['credit'])
                      elif ext == '.pdf':
                          with pdfplumber.open(filepath) as pdf:
                              text = "".join([p.extract_text() or "" for p in pdf.pages])
                              nm_match = re.search(r'성\s*명\s*[:]?\s*([가-힣]{2,4})', text)
                              if nm_match: name = nm_match.group(1)
                              else:
                                  nm_file = re.match(r'([가-힣]{2,4})', fname)
                                  if nm_file: name = nm_file.group(1)
                              if name:
                                  salary = extract_number(text, ['총급여', '급여계'], 1000000)
                                  if salary > 0: db[name]['salary'] = max(db[name]['salary'], salary)
                                  db[name]['insurance'] += extract_number(text, ['보장성', '보험료'])
                                  db[name]['pension'] += extract_number(text, ['국민연금', '연금'])
                                  db[name]['medical'] += extract_number(text, ['의료비'])
                                  db[name]['card'] += extract_number(text, ['신용카드', '현금영수증'])
                                  db[name]['donation'] += extract_number(text, ['기부금'])
                      if name: db[name]['files'].add(fname)
                  except: pass
              return db

          # [New] 영수증 생성기
          def generate_receipt_html(r):
              color = "blue" if r['final_money'] < 0 else "red"
              result_text = "환급 (돌려받을 세액)" if r['final_money'] < 0 else "징수 (추가 납부 세액)"
              money_str = "{:,}".format(abs(r['final_money']))
              
              html = f"""
              <html>
              <head>
                  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
                  <style>
                      body {{ background: #eee; padding: 40px; }}
                      .paper {{ background: white; width: 800px; margin: 0 auto; padding: 50px; border: 1px solid #ddd; box-shadow: 0 0 10px rgba(0,0,0,0.1); }}
                      .title {{ text-align: center; border-bottom: 2px solid #333; padding-bottom: 20px; margin-bottom: 30px; }}
                  </style>
              </head>
              <body>
                  <div class="paper">
                      <h2 class="title fw-bold">🧾 2024년 귀속 근로소득 원천징수 영수증</h2>
                      <table class="table table-bordered">
                          <tr><th class="bg-light" style="width:150px">성 명</th><td>{r['name']}</td><th class="bg-light">총 급 여</th><td>{r['salary']:,} 원</td></tr>
                          <tr><th class="bg-light">참조 파일</th><td colspan="3">{r['files_count']} 건 확인됨</td></tr>
                      </table>
                      <h5 class="mt-4 border-bottom pb-2">📌 세액 계산 상세</h5>
                      <table class="table table-sm">
                          <tr><td>결정 세액 (내야할 세금)</td><td class="text-end">{r['tax']['determined']:,} 원</td></tr>
                          <tr><td>기납부 세액 (이미 낸 세금)</td><td class="text-end">- {r['tax']['pre_paid']:,} 원</td></tr>
                          <tr class="fw-bold fs-5 table-{color.replace('blue','primary').replace('red','danger')}">
                              <td>최종 결과 ({result_text})</td>
                              <td class="text-end" style="color:{color}">{money_str} 원</td>
                          </tr>
                      </table>
                      <div class="mt-5 text-center text-muted">
                          <p>위와 같이 정산되었음을 증명합니다.</p>
                          <h4>Tax Master System 직인생략</h4>
                      </div>
                      <div class="text-center mt-4 d-print-none">
                          <button onclick="window.print()" class="btn btn-dark">🖨️ 인쇄 / PDF 저장</button>
                      </div>
                  </div>
              </body>
              </html>
              """
              with open(os.path.join(RECEIPT_DIR, f"{r['name']}.html"), "w", encoding="utf-8") as f:
                  f.write(html)

          def run_simulation():
              migrate_data()
              results = []
              print(">>> [Simulation] 정산 및 영수증 발행 시작...")
              
              for name, data in db.items():
                  if not name or len(name) < 2: continue
                  
                  salary = data['salary'] if data['salary'] > 0 else 40000000
                  is_estimated = (data['salary'] == 0)
                  
                  # 간이 계산
                  if salary <= 5000000: income_ded = salary * 0.7
                  elif salary <= 15000000: income_ded = 3500000 + (salary - 5000000) * 0.4
                  elif salary <= 45000000: income_ded = 7500000 + (salary - 15000000) * 0.15
                  elif salary <= 100000000: income_ded = 12000000 + (salary - 45000000) * 0.05
                  else: income_ded = 14750000 + (salary - 100000000) * 0.02
                  
                  basic_ded = 1500000
                  card_ded = min(max((data['card'] - salary*0.25) * 0.15, 0), 3000000)
                  tax_base = max(salary - (income_ded + basic_ded + data['pension'] + data['insurance'] + data['donation'] + card_ded), 0)
                  
                  if tax_base <= 14000000: calc_tax = tax_base * 0.06
                  elif tax_base <= 50000000: calc_tax = 840000 + (tax_base - 14000000) * 0.15
                  elif tax_base <= 88000000: calc_tax = 6240000 + (tax_base - 50000000) * 0.24
                  else: calc_tax = 15360000 + (tax_base - 88000000) * 0.35
                  
                  determined_tax = max(calc_tax - (min(data['insurance'], 1000000)*0.12), 0)
                  pre_paid = data['pre_paid'] if data['pre_paid'] > 0 else int(salary * 0.045)
                  final_money = int(determined_tax - pre_paid)
                  
                  res_entry = {
                      "name": name, "salary": int(salary), "salary_note": "(추정)" if is_estimated else "",
                      "files_count": len(data['files']),
                      "tax": { "determined": int(determined_tax), "pre_paid": int(pre_paid) },
                      "final_money": final_money, "type": "환급" if final_money < 0 else "징수"
                  }
                  
                  # [핵심] 결과 계산 즉시 영수증 파일 생성
                  generate_receipt_html(res_entry)
                  results.append(res_entry)
                  
              print(f">>> [Simulation] 총 {len(results)}건의 영수증 발행 완료.")
              return results

          if __name__ == "__main__":
              res = run_simulation()
              with open('final_result.json', 'w', encoding='utf-8') as f:
                  json.dump(res, f, ensure_ascii=False)
              
              table = [[r['name'], f"{r['salary']:,}", r['type'], f"{abs(r['final_money']):,}"] for r in res]
              print(tabulate(table, headers=["이름", "급여", "결과", "금액"], tablefmt="grid"))
          EOF

          # 3. [UI] 웹 리포트 (영수증 보기 기능 추가)
          cat <<EOF > app_root/app.py
          from flask import Flask, render_template_string, send_from_directory
          import json, os
          
          app = Flask(__name__)
          
          @app.route('/')
          def index():
              try:
                  with open('final_result.json', 'r', encoding='utf-8') as f: results = json.load(f)
              except: results = []
              
              total_refund = sum([abs(r['final_money']) for r in results if r['final_money'] < 0])
              total_collect = sum([r['final_money'] for r in results if r['final_money'] >= 0])
              
              html = """
              <!DOCTYPE html>
              <html>
              <head>
                  <title>Tax Master</title>
                  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
              </head>
              <body class="bg-light p-5">
                  <div class="container bg-white p-5 shadow rounded">
                      <div class="d-flex justify-content-between align-items-center mb-4">
                          <h2 class="fw-bold">🏢 연말정산 마스터 리포트</h2>
                          <span class="badge bg-secondary">자동 영수증 발급 시스템</span>
                      </div>
                      <div class="row text-center mb-4">
                          <div class="col-6"><div class="card bg-primary text-white p-3"><h3>환급 총액</h3><h1>{{ "{:,}".format(total_refund) }} 원</h1></div></div>
                          <div class="col-6"><div class="card bg-danger text-white p-3"><h3>징수 총액</h3><h1>{{ "{:,}".format(total_collect) }} 원</h1></div></div>
                      </div>
                      <table class="table table-hover align-middle">
                          <thead class="table-light"><tr><th>성명</th><th>총급여</th><th>결과</th><th>금액</th><th>증빙</th></tr></thead>
                          <tbody>
                              {% for r in results %}
                              <tr>
                                  <td class="fw-bold">{{ r.name }}</td>
                                  <td>{{ "{:,}".format(r.salary) }}</td>
                                  <td><span class="badge bg-{{ 'primary' if r.final_money < 0 else 'danger' }}">{{ r.type }}</span></td>
                                  <td class="fw-bold">{{ "{:,}".format(abs(r.final_money)) }} 원</td>
                                  <td>
                                      <a href="/receipt/{{ r.name }}" target="_blank" class="btn btn-sm btn-outline-dark">
                                          📄 영수증 발급
                                      </a>
                                  </td>
                              </tr>
                              {% endfor %}
                          </tbody>
                      </table>
                  </div>
              </body>
              </html>
              """
              return render_template_string(html, results=results, total_refund=total_refund, total_collect=total_collect)
          
          # 영수증 파일 서빙 라우트
          @app.route('/receipt/<name>')
          def get_receipt(name):
              return send_from_directory('receipts', f"{name}.html")

          if __name__ == '__main__': app.run(host='0.0.0.0', port=8080)
          EOF

          # Dockerfile
          cat <<EOF > app_root/Dockerfile
          FROM python:3.9-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY . .
          RUN chmod -R 755 cost_data
          EXPOSE 8080
          CMD ["python", "app.py"]
          EOF

      - name: 🚀 엔진 구동 (데이터 처리 및 영수증 생성)
        run: |
          cd app_root
          pip install -r requirements.txt
          python engine.py

      - name: 🐳 이미지 빌드 및 아티팩트 저장
        run: |
          cd app_root
          docker build -t tax-master-system:latest .
          docker save -o tax-master-system.tar tax-master-system:latest

      - name: 📦 실행 파일 저장
        uses: actions/upload-artifact@v4
        with:
          name: 세금 마스터 시스템 앱
          path: app_root/tax-master-system.tar
          retention-days: 7
