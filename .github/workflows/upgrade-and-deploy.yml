name: Build, Install & Deploy

on:
  workflow_dispatch: # 수동 실행
  push:
    branches: [ "main" ] # 메인 브랜치 푸시 시 자동 실행 (필요 시 주석 해제)

jobs:
  # [Step 1] 도커 이미지 빌드 및 푸시 (Build & Push)
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: 도커 로그인 (Docker Hub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 태그 설정: latest 태그와 현재 커밋 해시 태그 동시 생성
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cost-data-app:latest
            ${{ secrets.DOCKER_USERNAME }}/cost-data-app:${{ github.sha }}

  # [Step 2] 서버 환경 설치 및 배포 (Install & Deploy)
  deploy-server:
    needs: build-image # 빌드가 성공해야 실행됨
    runs-on: ubuntu-latest
    steps:
      - name: SSH 접속 및 서버 설정/배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            echo "#######################################################"
            echo ">>> [Phase 1] 배포 서버 환경 자동 설치 (Provisioning)"
            echo "#######################################################"
            
            # 1. Git 설치 확인 및 설치
            if ! command -v git &> /dev/null; then
                echo "Git이 없습니다. 설치를 진행합니다..."
                sudo apt-get update
                sudo apt-get install -y git
            else
                echo "Git이 이미 설치되어 있습니다."
            fi

            # 2. Docker 설치 확인 및 설치 (Docker 공식 스크립트 활용)
            if ! command -v docker &> /dev/null; then
                echo "Docker가 없습니다. 설치를 진행합니다..."
                curl -fsSL https://get.docker.com -o get-docker.sh
                sudo sh get-docker.sh
                # 현재 사용자를 docker 그룹에 추가 (sudo 없이 docker 사용)
                sudo usermod -aG docker ${{ secrets.SERVER_USER }}
            else
                echo "Docker가 이미 설치되어 있습니다."
            fi

            # 3. Docker Compose 설치 확인 및 설치 (플러그인 방식)
            if ! docker compose version &> /dev/null; then
                echo "Docker Compose Plugin 설치 중..."
                sudo apt-get update
                sudo apt-get install -y docker-compose-plugin
            fi

            echo "#######################################################"
            echo ">>> [Phase 2] Cost-Data 데이터 대량 동기화"
            echo "#######################################################"
            
            APP_DIR="/home/${{ secrets.SERVER_USER }}/cost-data-service"
            REPO_URL="https://github.com/koreatest12/cost-data.git"

            # 폴더 생성
            mkdir -p $APP_DIR

            # Git Clone 또는 Reset (강제 동기화)
            if [ ! -d "$APP_DIR/.git" ]; then
                echo "프로젝트 폴더를 새로 복제합니다."
                git clone $REPO_URL $APP_DIR
            else
                echo "기존 폴더를 최신 상태로 강제 동기화합니다."
                cd $APP_DIR
                git fetch origin main
                git reset --hard origin/main
                git clean -fd # 추적되지 않는 파일 삭제
            fi

            echo "#######################################################"
            echo ">>> [Phase 3] 컨테이너 서비스 업그레이드 및 배포"
            echo "#######################################################"
            
            cd $APP_DIR
            
            # .env 파일 생성 (필요한 경우 환경변수 주입)
            # echo "IMAGE_TAG=latest" > .env
            
            # 최신 이미지 다운로드 (Build Job에서 만든 이미지)
            # docker-compose.yml 파일 내의 image가 ${{ secrets.DOCKER_USERNAME }}/cost-data-app:latest 여야 함
            docker compose pull

            # 컨테이너 재실행 (이미지 변경 감지 시 자동 재시작)
            docker compose up -d --remove-orphans
            
            # 구버전 이미지 정리
            docker image prune -f

            echo ">>> 모든 배포 과정이 완료되었습니다."
