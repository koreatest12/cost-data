name: 🚀 ULTIMATE AI-TAX SYSTEM (FIXED DEPLOYMENT)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 배포 권한 명시적 강화
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  system-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 [1] 소스 및 외부 AI 앱 복제
        uses: actions/checkout@v4
      
      - name: 📥 [2] 데이터 소스 및 외부 자산 클론
        run: |
          git clone https://github.com/koreatest12/cost-data.git data_source
          git clone https://github.com/leonoffou/ollama-TTS-STT-App.git ai_app
          mkdir -p public/data receipts

      - name: 🐍 [3] 파이썬 및 필수 라이브러리 전수 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      
      - name: 📦 라이브러리 강제 설치 (에러 차단)
        run: |
          pip install pandas openpyxl sqlalchemy numpy flask

      - name: 🛠️ [4] 지능형 엔진 생성 및 대량 연산 (권한 755 적용)
        run: |
          cat <<'EOF' > tax_engine.py
          import os, sqlite3, json, glob
          import pandas as pd

          def run_intelligence():
              conn = sqlite3.connect('tax_master.db')
              cur = conn.cursor()
              cur.executescript("""
                  CREATE TABLE IF NOT EXISTS tax_knowledge (id INTEGER PRIMARY KEY, min_val INTEGER, max_val INTEGER, rate REAL, ded INTEGER);
                  CREATE TABLE IF NOT EXISTS tax_results (
                      id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, salary INTEGER, tax INTEGER, advice TEXT
                  );
              """)
              knowledge = [(1, 0, 14000000, 0.06, 0), (2, 14000000, 50000000, 0.15, 1260000), (3, 50000000, 88000000, 0.24, 5760000)]
              cur.executemany("INSERT OR REPLACE INTO tax_knowledge VALUES (?,?,?,?,?)", knowledge)
              
              for f in glob.glob('data_source/**/*', recursive=True):
                  if os.path.isfile(f) and f.lower().endswith('.json'):
                      try:
                          with open(f, 'r', encoding='utf-8') as jf:
                              d = json.load(jf)
                              name, sal = d.get('name', 'N/A'), int(d.get('total_salary', 0))
                              cur.execute("SELECT * FROM tax_knowledge WHERE ? > min_val AND ? <= max_val", (sal, sal))
                              rule = cur.fetchone()
                              tax = int(sal * rule[3] - rule[4]) if rule else 0
                              cur.execute("INSERT INTO tax_results (name, salary, tax, advice) VALUES (?,?,?,?)", (name, sal, tax, 'AI 정밀 분석 완료'))
                      except: continue
              conn.commit()
              conn.close()
          if __name__ == "__main__": run_intelligence()
          EOF
          
          chmod 755 tax_engine.py
          python tax_engine.py

      - name: 🛠️ [5] Nuxt 프로젝트 및 UI 대량 생성
        run: |
          cat <<'EOF' > package.json
          {
            "name": "enterprise-tax-ai",
            "private": true,
            "type": "module",
            "scripts": { "build": "nuxt build", "generate": "nuxt generate" },
            "devDependencies": { "nuxt": "^3.10.0" }
          }
          EOF

          mkdir -p pages
          cat <<'EOF' > pages/index.vue
          <template>
            <div class="dashboard">
              <div class="header">
                <h1>🏢 AI-TAX Master Dashboard</h1>
                <p>Enterprise Intelligence System v10.0</p>
              </div>
              <div class="stats-grid">
                <div class="card" v-for="item in taxReports" :key="item.id">
                  <h3>{{ item.name }}</h3>
                  <p class="salary">연봉: {{ item.salary.toLocaleString() }}원</p>
                  <p class="tax">산출세액: <span>{{ item.tax.toLocaleString() }}원</span></p>
                  <p class="advice">{{ item.advice }}</p>
                </div>
              </div>
            </div>
          </template>
          <script setup>
          import reportData from '~/public/data/report.json'
          const taxReports = reportData
          </script>
          <style scoped>
            .dashboard { padding: 50px; background: #f0f4f8; min-height: 100vh; font-family: 'Segoe UI', sans-serif; }
            .header { text-align: center; margin-bottom: 40px; }
            .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
            .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 5px solid #007bff; }
            .salary { color: #666; font-size: 0.9em; }
            .tax { font-weight: bold; margin-top: 10px; }
            .tax span { color: #d93025; }
            .advice { margin-top: 15px; font-style: italic; font-size: 0.85em; color: #1a73e8; }
          </style>
          EOF

      - name: 📊 [6] 데이터 정적화 및 전체 권한 부여
        run: |
          python3 -c "import sqlite3, json; conn=sqlite3.connect('tax_master.db'); conn.row_factory=sqlite3.Row; data=[dict(r) for r in conn.execute('SELECT * FROM tax_results').fetchall()]; open('public/data/report.json', 'w').write(json.dumps(data))"
          chmod -R 755 public/data ai_app

      - name: 🚀 [7] Nuxt 정적 사이트 생성
        run: |
          npm install
          npm run generate

      - name: 📤 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: system-intelligence
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 GitHub Pages 최종 배포
        id: deployment
        uses: actions/deploy-pages@v4
