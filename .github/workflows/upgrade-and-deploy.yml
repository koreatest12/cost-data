name: 📱 Tax Web App Dev & Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  # ==================================================================================
  # [Job 1] 웹 애플리케이션 소스 풀 패키지 생성 -> 도커 빌드 -> 아티팩트
  # ==================================================================================
  develop-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # ----------------------------------------------------------------------
      # [Step 1] 웹 애플리케이션 전체 소스 코드 대량 생성
      # ----------------------------------------------------------------------
      - name: 🏗️ Flask 웹 앱 소스 코드 생성 (Front/Back)
        run: |
          echo ">>> [Init] 웹 앱 프로젝트 구조 생성..."
          mkdir -p webapp/static/css
          mkdir -p webapp/static/js
          mkdir -p webapp/templates
          mkdir -p webapp/uploads

          # 1. Python 패키지 의존성
          echo "flask\npandas\nopenpyxl\npdfplumber" > webapp/requirements.txt

          # 2. 백엔드 로직 (app.py)
          cat <<EOF > webapp/app.py
          import os
          import pandas as pd
          import pdfplumber
          import json
          import re
          from flask import Flask, render_template, request, redirect, url_for
          from werkzeug.utils import secure_filename

          app = Flask(__name__)
          app.config['UPLOAD_FOLDER'] = 'uploads'
          app.config['MAX_CONTENT_LENGTH'] = 16 * 1024 * 1024  # 16MB limit

          # --- 계산 엔진 (축약됨) ---
          def calculate_tax(salary, data):
              salary = int(salary)
              if salary <= 5000000: income_ded = salary * 0.7
              elif salary <= 15000000: income_ded = 3500000 + (salary - 5000000) * 0.4
              elif salary <= 45000000: income_ded = 7500000 + (salary - 15000000) * 0.15
              elif salary <= 100000000: income_ded = 12000000 + (salary - 45000000) * 0.05
              else: income_ded = 14750000 + (salary - 100000000) * 0.02
              
              basic_ded = 1500000
              # 데이터 안전하게 가져오기
              ins_ded = float(data.get('pension',0)) + float(data.get('health',0)) + float(data.get('employ',0))
              housing_ded = min(float(data.get('housing',0)) * 0.4, 2400000)
              
              min_usage = salary * 0.25
              total_usage = float(data.get('credit',0)) + float(data.get('debit',0)) + float(data.get('cash',0))
              card_ded = 0
              if total_usage > min_usage:
                  card_ded = min((total_usage - min_usage) * 0.15, 3000000)
                  
              tax_base = max(salary - (income_ded + basic_ded + ins_ded + housing_ded + card_ded), 0)
              
              if tax_base <= 14000000: calc_tax = tax_base * 0.06
              elif tax_base <= 50000000: calc_tax = 840000 + (tax_base - 14000000) * 0.15
              elif tax_base <= 88000000: calc_tax = 6240000 + (tax_base - 50000000) * 0.24
              else: calc_tax = 15360000 + (tax_base - 88000000) * 0.35
              
              return int(calc_tax)

          # --- 파서 (Parser) ---
          def parse_file(filepath, filename):
              ext = os.path.splitext(filename)[1].lower()
              data = {"name": filename, "total_salary": 30000000} # Default
              
              try:
                  if ext == '.json':
                      with open(filepath, 'r', encoding='utf-8') as f:
                          data.update(json.load(f))
                  elif ext == '.xlsx':
                      df = pd.read_excel(filepath)
                      if 'total_salary' in df.columns:
                          data.update(df.iloc[0].to_dict())
                  elif ext == '.pdf':
                      with pdfplumber.open(filepath) as pdf:
                          text = "".join([p.extract_text() or "" for p in pdf.pages])
                          # 데모용 파싱 로직
                          sal_match = re.search(r'([0-9,]+)', text) 
                          if sal_match: data['total_salary'] = int(sal_match.group(1).replace(',',''))
              except Exception as e:
                  print(f"Error parsing {filename}: {e}")
                  
              return data

          @app.route('/', methods=['GET', 'POST'])
          def index():
              if request.method == 'POST':
                  files = request.files.getlist('files')
                  results = []
                  total_tax = 0
                  
                  if not os.path.exists(app.config['UPLOAD_FOLDER']):
                      os.makedirs(app.config['UPLOAD_FOLDER'])

                  for file in files:
                      if file.filename == '': continue
                      filename = secure_filename(file.filename)
                      filepath = os.path.join(app.config['UPLOAD_FOLDER'], filename)
                      file.save(filepath)
                      
                      # 파싱 및 계산
                      parsed_data = parse_file(filepath, filename)
                      tax = calculate_tax(parsed_data.get('total_salary', 0), parsed_data)
                      
                      parsed_data['calc_tax'] = tax
                      parsed_data['filename'] = filename
                      parsed_data['file_type'] = os.path.splitext(filename)[1].upper()
                      results.append(parsed_data)
                      total_tax += tax
                  
                  return render_template('dashboard.html', results=results, total_tax=total_tax, count=len(results))
              return render_template('index.html')

          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=8080)
          EOF

          # 3. 프론트엔드 - 업로드 페이지 (index.html)
          cat <<EOF > webapp/templates/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <title>연말정산 스마트 분석기</title>
              <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
              <style>
                  body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
                  .upload-box { background: white; padding: 50px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
                  .drop-zone { border: 2px dashed #007bff; border-radius: 10px; padding: 40px; margin: 20px 0; cursor: pointer; background: #f0f8ff; }
                  .drop-zone:hover { background: #e3f2fd; }
              </style>
          </head>
          <body>
              <div class="upload-box">
                  <h1 class="mb-4">📂 연말정산 자료 분석</h1>
                  <p class="text-muted">JSON, Excel(.xlsx), PDF 파일을 드래그하여 업로드하세요.</p>
                  <form action="/" method="post" enctype="multipart/form-data">
                      <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                          <h3>클릭 또는 파일 드래그</h3>
                          <input type="file" name="files" id="fileInput" multiple style="display:none" onchange="this.form.submit()">
                      </div>
                  </form>
              </div>
          </body>
          </html>
          EOF

          # 4. 프론트엔드 - 대시보드 페이지 (dashboard.html)
          cat <<EOF > webapp/templates/dashboard.html
          <!DOCTYPE html>
          <html>
          <head>
              <title>분석 결과 대시보드</title>
              <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
              <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
          </head>
          <body class="p-4 bg-light">
              <div class="container">
                  <h2 class="mb-4">📊 분석 리포트 대시보드</h2>
                  
                  <div class="row mb-4">
                      <div class="col-md-6">
                          <div class="card text-white bg-primary mb-3">
                              <div class="card-body">
                                  <h5 class="card-title">총 처리 건수</h5>
                                  <p class="card-text display-4">{{ count }} 건</p>
                              </div>
                          </div>
                      </div>
                      <div class="col-md-6">
                          <div class="card text-white bg-success mb-3">
                              <div class="card-body">
                                  <h5 class="card-title">예상 총 징수 세액</h5>
                                  <p class="card-text display-4">{{ "{:,}".format(total_tax) }} 원</p>
                              </div>
                          </div>
                      </div>
                  </div>

                  <div class="card mb-4">
                      <div class="card-header">급여 대비 세금 분석</div>
                      <div class="card-body">
                          <canvas id="taxChart" height="100"></canvas>
                      </div>
                  </div>

                  <div class="card">
                      <div class="card-header">상세 데이터 목록</div>
                      <table class="table table-hover mb-0">
                          <thead>
                              <tr>
                                  <th>파일유형</th>
                                  <th>파일명/이름</th>
                                  <th>총급여</th>
                                  <th>산출세액</th>
                              </tr>
                          </thead>
                          <tbody>
                              {% for r in results %}
                              <tr>
                                  <td><span class="badge bg-secondary">{{ r.file_type }}</span></td>
                                  <td>{{ r.name }}</td>
                                  <td>{{ "{:,}".format(r.total_salary) }}</td>
                                  <td class="fw-bold text-danger">{{ "{:,}".format(r.calc_tax) }}</td>
                              </tr>
                              {% endfor %}
                          </tbody>
                      </table>
                  </div>
                  
                  <div class="mt-4 text-center">
                      <a href="/" class="btn btn-outline-primary">다시 분석하기</a>
                  </div>
              </div>

              <script>
                  const ctx = document.getElementById('taxChart').getContext('2d');
                  const labels = [{% for r in results %}"{{ r.name }}",{% endfor %}];
                  const data = [{% for r in results %}{{ r.calc_tax }},{% endfor %}];
                  
                  new Chart(ctx, {
                      type: 'bar',
                      data: {
                          labels: labels,
                          datasets: [{
                              label: '산출세액 (원)',
                              data: data,
                              backgroundColor: 'rgba(54, 162, 235, 0.5)',
                              borderColor: 'rgba(54, 162, 235, 1)',
                              borderWidth: 1
                          }]
                      },
                      options: { scales: { y: { beginAtZero: true } } }
                  });
              </script>
          </body>
          </html>
          EOF

          # 5. Dockerfile
          cat <<EOF > webapp/Dockerfile
          FROM python:3.9-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install -r requirements.txt
          COPY . .
          RUN mkdir -p uploads
          EXPOSE 8080
          CMD ["python", "app.py"]
          EOF
          
          echo ">>> [Dev] 웹 앱 개발 완료 (webapp/ 폴더 생성)"

      # ----------------------------------------------------------------------
      # [Step 2] 앱 빌드 및 이미지 생성
      # ----------------------------------------------------------------------
      - name: 🐳 Web App 도커 이미지 빌드
        run: |
          cd webapp
          docker build -t tax-web-app:v1.0 .
          docker save -o tax-web-app.tar tax-web-app:v1.0

      # ----------------------------------------------------------------------
      # [Step 3] 앱 아티팩트 저장 (다운로드용)
      # ----------------------------------------------------------------------
      - name: 📦 웹 앱 이미지 저장
        uses: actions/upload-artifact@v4
        with:
          name: Tax_Web_App_Image
          path: webapp/tax-web-app.tar
          retention-days: 5
