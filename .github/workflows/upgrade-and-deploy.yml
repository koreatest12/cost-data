name: Build, Auto-Gen & Deploy (No Login + Auto Dockerfile)

on:
  workflow_dispatch: # 수동 실행
  push:
    branches: [ "main" ]

jobs:
  # [Job 1] Dockerfile 자동 생성 -> 빌드 -> 서버 전송
  build-and-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: 📂 파일 목록 및 위치 확인 (디버깅용)
        run: |
          echo "현재 디렉토리 파일 목록:"
          ls -al
          echo "프로젝트 구조 확인:"
          find . -maxdepth 2 -not -path '*/.*'

      - name: 🛠️ Dockerfile 자동 감지 및 생성 (대량 생성 로직)
        run: |
          # 1. 이미 Dockerfile이 있다면 건너뜀
          if [ -f "Dockerfile" ]; then
            echo "✅ 기존 Dockerfile이 감지되었습니다. 이를 사용합니다."
            exit 0
          fi

          echo "⚠️ Dockerfile이 없습니다. 프로젝트 유형을 분석하여 자동 생성합니다..."

          # 2. Java (Maven/Gradle) 프로젝트 감지
          if [ -f "pom.xml" ] || [ -f "build.gradle" ]; then
            echo "☕ Java (Spring Boot) 프로젝트가 감지되었습니다."
            echo "자동으로 OpenJDK 17 기반의 Dockerfile을 생성합니다..."
            
            cat <<EOF > Dockerfile
            # --- Build Stage ---
            FROM gradle:8.5-jdk17 AS builder
            WORKDIR /app
            COPY . .
            # Gradle인 경우
            RUN if [ -f "build.gradle" ]; then gradle build -x test --no-daemon; fi
            # Maven인 경우
            RUN if [ -f "pom.xml" ]; then apt-get update && apt-get install -y maven && mvn clean package -DskipTests; fi

            # --- Run Stage ---
            FROM openjdk:17-jdk-slim
            WORKDIR /app
            # 빌드된 JAR 파일을 찾아서 app.jar로 복사 (이름이 달라도 자동 탐색)
            COPY --from=builder /app/build/libs/*.jar app.jar 2>/dev/null || COPY --from=builder /app/target/*.jar app.jar
            ENTRYPOINT ["java", "-jar", "app.jar"]
            EOF
          
          # 3. Node.js 프로젝트 감지
          elif [ -f "package.json" ]; then
            echo "🟢 Node.js 프로젝트가 감지되었습니다."
            
            cat <<EOF > Dockerfile
            FROM node:18-alpine
            WORKDIR /app
            COPY package*.json ./
            RUN npm install --production
            COPY . .
            CMD ["npm", "start"]
            EOF

          # 4. 그 외 (HTML/Static) 감지
          else
            echo "🌐 일반 정적 웹 프로젝트로 간주합니다 (Nginx)."
            
            cat <<EOF > Dockerfile
            FROM nginx:alpine
            COPY . /usr/share/nginx/html
            EOF
          fi

          echo "🎉 Dockerfile 생성이 완료되었습니다."
          cat Dockerfile

      - name: 🐳 도커 이미지 빌드 (로그인 불필요)
        run: |
          # 위에서 생성된(혹은 기존의) Dockerfile을 이용해 빌드
          docker build -t cost-data-app:latest .
          # 이미지를 파일로 저장 (.tar)
          docker save -o cost-data-app.tar cost-data-app:latest

      - name: 🚀 서버로 이미지 및 설정 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "cost-data-app.tar,docker-compose.yml"
          target: "/home/${{ secrets.SERVER_USER }}/cost-data-service/"

  # [Job 2] 서버 배포 (오프라인 로드)
  deploy-server:
    needs: build-and-transfer
    runs-on: ubuntu-latest
    steps:
      - name: SSH 접속 및 배포 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            APP_DIR="/home/${{ secrets.SERVER_USER }}/cost-data-service"
            cd $APP_DIR

            echo ">>> [Phase 1] 환경 변수(.env) 강제 주입"
            cat <<EOF > .env
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            API_KEY=${{ secrets.API_KEY }}
            EOF

            echo ">>> [Phase 2] Docker 이미지 로드 (Load)"
            docker load -i cost-data-app.tar

            echo ">>> [Phase 3] 컨테이너 서비스 재시작"
            # docker-compose가 없으면 실행, 있으면 강제 재생성
            if [ -f "docker-compose.yml" ]; then
                # 이미지명을 cost-data-app:latest로 강제 치환 (안전장치)
                sed -i 's|image: .*|image: cost-data-app:latest|g' docker-compose.yml
                docker compose up -d --force-recreate
            else
                # docker run 명령어로 직접 실행 (Fallback)
                docker stop cost-data-container || true
                docker rm cost-data-container || true
                docker run -d --name cost-data-container \
                  --restart always \
                  -p 80:8080 \
                  --env-file .env \
                  cost-data-app:latest
            fi

            # 청소
            rm -f cost-data-app.tar
            docker image prune -f
            echo ">>> 모든 배포가 완료되었습니다."
