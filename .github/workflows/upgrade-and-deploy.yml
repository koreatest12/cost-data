name: Build, Install & Deploy (No Login Mode)

on:
  workflow_dispatch: # 수동 실행
  push:
    branches: [ "main" ] # 메인 브랜치 푸시

jobs:
  # [Job 1] 이미지를 파일로 빌드 및 서버 전송
  build-and-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: 도커 이미지 빌드 (로그인 불필요)
        run: |
          # 로컬에서 이미지 빌드
          docker build -t cost-data-app:latest .
          # 이미지를 파일로 저장 (tar 아카이브)
          docker save -o cost-data-app.tar cost-data-app:latest

      - name: 서버로 이미지 파일 및 스크립트 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "cost-data-app.tar,docker-compose.yml" # 이미지 파일과 설정 파일 전송
          target: "/home/${{ secrets.SERVER_USER }}/cost-data-service/" # 서버 저장 경로

  # [Job 2] 서버 환경 설정 및 오프라인 배포
  deploy-server:
    needs: build-and-transfer
    runs-on: ubuntu-latest
    steps:
      - name: SSH 접속 및 설치/배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            APP_DIR="/home/${{ secrets.SERVER_USER }}/cost-data-service"
            
            echo "#######################################################"
            echo ">>> [Phase 1] 필수 프로그램(Git, Docker) 자동 설치"
            echo "#######################################################"
            
            # 1. Docker 설치 (공식 스크립트 - 다운로드 방식)
            if ! command -v docker &> /dev/null; then
                echo "Docker 설치 중..."
                curl -fsSL https://get.docker.com -o get-docker.sh
                sudo sh get-docker.sh
                sudo usermod -aG docker ${{ secrets.SERVER_USER }}
            fi

            # 2. Docker Compose Plugin 설치
            if ! docker compose version &> /dev/null; then
                 sudo apt-get update
                 sudo apt-get install -y docker-compose-plugin
            fi

            echo "#######################################################"
            echo ">>> [Phase 2] 데이터 동기화 (공식 주소 다운로드)"
            echo "#######################################################"
            
            # Git 공식 주소에서 소스 코드 강제 동기화
            if [ ! -d "$APP_DIR/.git" ]; then
                git clone https://github.com/koreatest12/cost-data.git $APP_DIR
            else
                cd $APP_DIR
                git fetch --all
                git reset --hard origin/main
            fi

            echo "#######################################################"
            echo ">>> [Phase 3] 이미지 로드 및 컨테이너 실행"
            echo "#######################################################"
            
            cd $APP_DIR

            # 환경변수 파일 생성 (DB 정보 등은 여전히 필요함)
            cat <<EOF > .env
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            API_KEY=${{ secrets.API_KEY }}
            EOF

            # 전송받은 이미지 파일(.tar)을 도커 엔진에 등록 (Load)
            # Docker Hub 로그인 없이 설치하는 핵심 단계
            echo "이미지 파일 로딩 중..."
            docker load -i cost-data-app.tar

            # 컨테이너 재실행
            # 이미지 이름은 빌드 시 지정한 'cost-data-app:latest'와 일치해야 함
            echo "서비스 재시작 중..."
            
            # docker-compose.yml이 없다면 임시 실행 명령어로 대체
            if [ -f "docker-compose.yml" ]; then
                # docker-compose.yml 내의 image: 항목을 cost-data-app:latest 로 수정하는 로직
                sed -i 's|image: .*|image: cost-data-app:latest|g' docker-compose.yml
                docker compose up -d --force-recreate
            else
                # docker-compose 파일이 없을 경우 docker run 사용
                docker stop cost-data-container || true
                docker rm cost-data-container || true
                docker run -d --name cost-data-container \
                  --restart always \
                  -p 80:8080 \
                  --env-file .env \
                  cost-data-app:latest
            fi

            # 설치 파일 및 구버전 정리
            rm cost-data-app.tar
            docker image prune -f

            echo ">>> 등록 절차 없는 배포가 완료되었습니다."
