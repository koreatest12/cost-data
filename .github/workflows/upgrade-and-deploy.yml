name: 🏢 ENTERPRISE FULL-STACK SYSTEM (FIXED & UPGRADED)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # [Phase 1] 지능형 세무 엔진 및 소스 파일 대량 생성
  system-generation:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 소스 체크아웃 및 데이터 클론
        uses: actions/checkout@v4
      - run: |
          git clone https://github.com/koreatest12/cost-data.git data_source
          mkdir -p public/data receipts

      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 🛠️ [수정반영] 지능형 세무 엔진 작성 (문법 오류 수정)
        run: |
          cat <<'EOF' > tax_engine.py
          import os, sqlite3, json, glob
          import pandas as pd

          def run_intelligence():
              # DB 초기화 및 고성능 설정
              conn = sqlite3.connect('tax_master.db')
              cur = conn.cursor()
              cur.execute("PRAGMA journal_mode=WAL")
              
              # 스키마 및 2026 지식 베이스 대량 반영
              cur.executescript("""
                  CREATE TABLE IF NOT EXISTS tax_knowledge (id INTEGER PRIMARY KEY, min_val INTEGER, max_val INTEGER, rate REAL, ded INTEGER);
                  CREATE TABLE IF NOT EXISTS tax_results (
                      id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, salary INTEGER, tax INTEGER, advice TEXT
                  );
              """)
              knowledge = [(1, 0, 14000000, 0.06, 0), (2, 14000000, 50000000, 0.15, 1260000), 
                           (3, 50000000, 88000000, 0.24, 5760000), (4, 88000000, 150000000, 0.35, 15440000)]
              cur.executemany("INSERT OR REPLACE INTO tax_knowledge VALUES (?,?,?,?,?)", knowledge)
              
              # Deep Scan: 데이터 소스 전수 조사
              files = glob.glob('data_source/**/*', recursive=True)
              for f in files:
                  if os.path.isfile(f) and f.lower().endswith(('.json', '.csv', '.xlsx')):
                      try:
                          name, sal = "Unknown", 0
                          if f.endswith('.json'):
                              with open(f, 'r', encoding='utf-8') as jf:
                                  d = json.load(jf)
                                  name, sal = d.get('name', 'N/A'), int(d.get('total_salary', 0))
                          
                          if sal > 0:
                              cur.execute("SELECT * FROM tax_knowledge WHERE ? > min_val AND ? <= max_val", (sal, sal))
                              rule = cur.fetchone()
                              tax = int(sal * rule[3] - rule[4]) if rule else 0
                              cur.execute("INSERT INTO tax_results (name, salary, tax, advice) VALUES (?,?,?,?)", 
                                         (name, sal, tax, 'AI 지능형 세무 분석 완료'))
                      except Exception as e:
                          print(f"Error processing {f}: {e}")
              conn.commit()
              conn.close()
          if __name__ == "__main__": run_intelligence()
          EOF
          python tax_engine.py

      - name: 🛠️ [수정반영] Nuxt 설정 및 소스 대량 생성 (의존성 파일 포함)
        run: |
          # package.json 생성 (의존성 오류 방지)
          cat <<'EOF' > package.json
          {
            "name": "tax-master-nuxt",
            "private": true,
            "type": "module",
            "scripts": {
              "build": "nuxt build",
              "generate": "nuxt generate"
            },
            "devDependencies": {
              "nuxt": "^3.10.0"
            }
          }
          EOF

          # Nuxt 메인 페이지 (Vue3 소스 반영)
          mkdir -p pages
          cat <<'EOF' > pages/index.vue
          <template>
            <div class="container">
              <h1>🏢 AI 세무 지능형 대시보드 v8.0</h1>
              <div class="card">
                <table>
                  <thead>
                    <tr><th>성명</th><th>연봉</th><th>산출세액</th><th>AI 분석</th></tr>
                  </thead>
                  <tbody>
                    <tr v-for="item in taxData" :key="item.id">
                      <td>{{ item.name }}</td>
                      <td>{{ item.salary.toLocaleString() }}원</td>
                      <td class="tax-text">{{ item.tax.toLocaleString() }}원</td>
                      <td class="advice">{{ item.advice }}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </template>
          <script setup>
          import reportData from '~/public/data/report.json'
          const taxData = reportData
          </script>
          <style scoped>
          .container { padding: 40px; font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; }
          .card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
          table { width: 100%; border-collapse: collapse; }
          th { background: #1a73e8; color: white; padding: 15px; text-align: left; }
          td { padding: 15px; border-bottom: 1px solid #eee; }
          .tax-text { color: #d93025; font-weight: bold; }
          .advice { font-style: italic; color: #5f6368; }
          </style>
          EOF

      - name: 📊 데이터 통합 및 JSON 리포트 생성
        run: |
          # DB 데이터를 홈페이지용 JSON으로 변환
          python3 -c "import sqlite3, json; conn=sqlite3.connect('tax_master.db'); conn.row_factory=sqlite3.Row; data=[dict(r) for r in conn.execute('SELECT * FROM tax_results').fetchall()]; open('public/data/report.json', 'w').write(json.dumps(data))"

      - name: 🚀 Nuxt 빌드 및 정적 사이트 생성
        run: |
          npm install
          npm run generate

      - name: 📤 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  # [Phase 2] 배포 실행
  deploy:
    needs: system-generation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
