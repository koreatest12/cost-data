name: Ultimate Deploy (Network Fix & Full Install)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 전체 작업 제한시간 15분으로 연장
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # [Phase 1] MVC 풀 패키지 소스 대량 자동 생성
      # ----------------------------------------------------------------
      - name: 🏗️ 프로젝트 소스 및 구조 대량 생성
        run: |
          echo ">>> 소스 코드 생성 시작..."
          if [ ! -f "pom.xml" ]; then
            mkdir -p src/main/java/com/example/demo/controller
            mkdir -p src/main/java/com/example/demo/service
            mkdir -p src/main/resources/static/css
            
            # pom.xml 생성
            printf '<project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd"><modelVersion>4.0.0</modelVersion><groupId>com.example</groupId><artifactId>demo</artifactId><version>1.0.0</version><parent><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-parent</artifactId><version>3.2.0</version></parent><properties><java.version>17</java.version></properties><dependencies><dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId></dependency></dependencies><build><plugins><plugin><groupId>org.springframework.boot</groupId><artifactId>spring-boot-maven-plugin</artifactId></plugin></plugins></build></project>\n' > pom.xml

            # Main App
            F="src/main/java/com/example/demo/DemoApplication.java"
            printf 'package com.example.demo; import org.springframework.boot.SpringApplication; import org.springframework.boot.autoconfigure.SpringBootApplication; @SpringBootApplication public class DemoApplication { public static void main(String[] args) { SpringApplication.run(DemoApplication.class, args); } }\n' > $F

            # Controller
            F="src/main/java/com/example/demo/controller/WebController.java"
            printf 'package com.example.demo.controller; import org.springframework.web.bind.annotation.GetMapping; import org.springframework.web.bind.annotation.RestController; @RestController public class WebController { @GetMapping("/") public String home() { return "<h1>🚀 네트워크 배포 성공! (Network Fixed)</h1>"; } }\n' > $F
            
            # 설정 파일
            printf 'server.port=8080\n' > src/main/resources/application.properties
          fi

          # Dockerfile 생성
          printf 'FROM maven:3.9-eclipse-temurin-17 AS builder\nWORKDIR /app\nCOPY . .\nRUN mvn clean package -DskipTests\n\nFROM eclipse-temurin:17-jre-alpine\nWORKDIR /app\nCOPY --from=builder /app/target/*.jar app.jar\nENTRYPOINT ["java", "-jar", "app.jar"]\n' > Dockerfile

      # ----------------------------------------------------------------
      # [Phase 2] 빌드 및 파일 권한 강제 개방
      # ----------------------------------------------------------------
      - name: 🐳 이미지 빌드 및 권한 해결
        run: |
          sudo docker build -t cost-data-app:latest .
          sudo docker save -o cost-data-app.tar cost-data-app:latest
          
          # [중요] 타임아웃/권한 에러 방지를 위한 권한 대개방
          sudo chmod 777 cost-data-app.tar
          sudo chown $USER:$USER cost-data-app.tar

      # ----------------------------------------------------------------
      # [Phase 3] 서버 전송 (타임아웃 대폭 연장)
      # ----------------------------------------------------------------
      - name: 🚀 서버로 파일 전송 (네트워크 강화)
        uses: appleboy/scp-action@v0.1.7
        with:
          # ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
          # [수정 필수] 123.123...을 지우고 본인의 '실제 서버 IP'를 넣으세요!
          host: "123.123.123.123" 
          # ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
          port: 22
          username: "root"             # [수정 필요] 서버 아이디
          password: "my_password_123"  # [수정 필요] 서버 비밀번호
          
          source: "cost-data-app.tar"
          target: "/root/deploy/"
          
          # [중요] 타임아웃을 120초(2분)로 늘려 네트워크 불안정 해결
          timeout: "120s"
          command_timeout: "120s"

      # ----------------------------------------------------------------
      # [Phase 4] 서버 네트워크/방화벽 설치 및 배포
      # ----------------------------------------------------------------
      - name: 🔧 서버 네트워크/환경 대량 설치 및 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          # ▼▼▼ [수정 필수] 위와 동일한 실제 서버 IP 입력 ▼▼▼
          host: "123.123.123.123"
          port: 22
          username: "root"             # [수정 필요]
          password: "my_password_123"  # [수정 필요]
          # ▲▲▲ [수정 필수] 위와 동일한 실제 서버 IP 입력 ▲▲▲
          
          script_stop: true
          # 타임아웃 5분으로 설정
          timeout: "5m"
          script: |
            echo "#######################################################"
            echo ">>> [Install] 필수 네트워크 도구 및 Docker 대량 설치"
            echo "#######################################################"
            
            # 1. 패키지 목록 업데이트
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y

            # 2. 네트워크 유틸리티 및 필수 도구 설치 (curl, net-tools, ufw 등)
            # - net-tools: netstat 사용 가능
            # - ufw: 방화벽 관리
            echo ">>> 네트워크 도구 설치 중..."
            apt-get install -y curl wget git net-tools ufw

            # 3. Docker 자동 설치 (없을 경우에만)
            if ! command -v docker &> /dev/null; then
                echo ">>> Docker 설치 시작..."
                curl -fsSL https://get.docker.com -o get-docker.sh
                sh get-docker.sh
            fi

            # 4. 방화벽(Firewall) 설정 - 8080 포트 강제 개방
            echo ">>> 방화벽 포트(8080) 개방 설정..."
            # ufw가 비활성화 상태라면 활성화하지 않고 rule만 추가 (서버 잠김 방지)
            if command -v ufw &> /dev/null; then
                ufw allow 22/tcp  # SSH 접속 보장
                ufw allow 80/tcp
                ufw allow 8080/tcp
                echo ">>> 방화벽 규칙 추가 완료."
            fi

            echo "#######################################################"
            echo ">>> [Deploy] 컨테이너 배포 시작"
            echo "#######################################################"

            mkdir -p /root/deploy
            cd /root/deploy

            # 이미지 로드
            if [ -f "cost-data-app.tar" ]; then
                docker load -i cost-data-app.tar
            else
                echo "❌ 오류: 전송된 파일이 없습니다."
                exit 1
            fi

            # 기존 컨테이너 삭제 및 재실행
            docker stop cost-data-app || true
            docker rm cost-data-app || true

            docker run -d \
              --name cost-data-app \
              --restart always \
              -p 80:8080 \
              cost-data-app:latest

            # 설치 파일 정리
            rm -f cost-data-app.tar
            docker image prune -f

            echo ">>> 배포 완료!"
            echo ">>> 현재 열려있는 포트 확인:"
            netstat -tuln | grep 8080 || echo "포트 확인 불가 (권한 부족 등)"
