name: 🚀 Enterprise Intelligent Tax-Nuxt Integration

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # [Job 1] 지능형 데이터 처리 및 세무 엔진 구동
  tax-engine-processing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clone External Data Source
        run: git clone https://github.com/koreatest12/cost-data.git data_source

      - name: Setup Python for Tax Engine
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Engine Dependencies
        run: pip install pandas openpyxl sqlalchemy flask aiosmtpd

      - name: 🛠️ 실행: 지능형 엔진 (Deep Scan + DB 적재 + 계산)
        run: |
          cat <<'EOF' > engine_core.py
          import os, sqlite3, json, glob
          import pandas as pd

          def run_system():
              conn = sqlite3.connect('tax_master.db')
              cur = conn.cursor()
              # 지식 베이스 및 데이터 스키마 생성
              cur.executescript("""
                  CREATE TABLE IF NOT EXISTS tax_knowledge (id INTEGER PRIMARY KEY, min_val INTEGER, max_val INTEGER, rate REAL, ded INTEGER);
                  CREATE TABLE IF NOT EXISTS tax_results (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, salary INTEGER, tax INTEGER, advice TEXT);
              """)
              # 2026 최신 세율 지식 주입
              knowledge = [(1, 0, 14000000, 0.06, 0), (2, 14000000, 50000000, 0.15, 1260000), (3, 50000000, 88000000, 0.24, 5760000)]
              cur.executemany("INSERT OR REPLACE INTO tax_knowledge VALUES (?,?,?,?,?)", knowledge)
              
              # Deep Scan: 모든 데이터 파일 탐색
              files = glob.glob('data_source/**/*', recursive=True)
              for f in files:
                  if os.path.isfile(f) and f.endswith('.json'):
                      with open(f, 'r') as jf:
                          d = json.load(jf)
                          name, sal = d.get('name', 'N/A'), int(d.get('total_salary', 0))
                          # 계산 로직
                          cur.execute("SELECT * FROM tax_knowledge WHERE ? > min_val AND ? <= max_val", (sal, sal))
                          rule = cur.fetchone()
                          tax = int(sal * rule[3] - rule[4]) if rule else 0
                          cur.execute("INSERT INTO tax_results (name, salary, tax, advice) VALUES (?,?,?,?)", (name, sal, tax, 'AI 분석 완료'))
              conn.commit()
              conn.close()
          if __name__ == "__main__": run_system()
          EOF
          python engine_core.py

      - name: Archive Tax Database
        uses: actions/upload-artifact@v4
        with:
          name: tax-db
          path: tax_master.db

  # [Job 2] Nuxt 빌드 (세무 데이터 포함)
  build:
    needs: tax-engine-processing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Tax DB
        uses: actions/download-artifact@v4
        with:
          name: tax-db

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Nuxt Static Site
        # 여기서 생성된 tax_master.db를 Nuxt의 public 폴더나 api 경로에 포함시킬 수 있습니다.
        run: |
          mkdir -p public/data
          mv tax_master.db public/data/
          npm run generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  # [Job 3] 배포
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
