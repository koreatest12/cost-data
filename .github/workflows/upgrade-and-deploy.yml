name: Deploy (Fix Permissions & Auto-Install)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # [Phase 1] 소스 코드 및 Dockerfile 자동 생성
      # ----------------------------------------------------------------
      - name: 🏗️ 빈 프로젝트 감지 및 소스 강제 생성
        run: |
          echo ">>> 소스 코드 점검 시작"
          
          # pom.xml이 없으면 프로젝트 생성
          if [ ! -f "pom.xml" ] && [ ! -f "build.gradle" ]; then
            echo "⚠️ 소스 코드가 없어 생성합니다..."
            mkdir -p src/main/java/com/example/demo
            mkdir -p src/main/resources
            
            # pom.xml 생성 (printf 사용)
            printf '<project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"\n' > pom.xml
            printf '  xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">\n' >> pom.xml
            printf '  <modelVersion>4.0.0</modelVersion>\n' >> pom.xml
            printf '  <groupId>com.example</groupId>\n' >> pom.xml
            printf '  <artifactId>demo</artifactId>\n' >> pom.xml
            printf '  <version>0.0.1-SNAPSHOT</version>\n' >> pom.xml
            printf '  <parent>\n' >> pom.xml
            printf '    <groupId>org.springframework.boot</groupId>\n' >> pom.xml
            printf '    <artifactId>spring-boot-starter-parent</artifactId>\n' >> pom.xml
            printf '    <version>3.2.0</version>\n' >> pom.xml
            printf '  </parent>\n' >> pom.xml
            printf '  <properties><java.version>17</java.version></properties>\n' >> pom.xml
            printf '  <dependencies>\n' >> pom.xml
            printf '    <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId></dependency>\n' >> pom.xml
            printf '  </dependencies>\n' >> pom.xml
            printf '  <build><plugins><plugin><groupId>org.springframework.boot</groupId><artifactId>spring-boot-maven-plugin</artifactId></plugin></plugins></build>\n' >> pom.xml
            printf '</project>\n' >> pom.xml

            # Main Java 파일 생성
            T="src/main/java/com/example/demo/DemoApplication.java"
            printf 'package com.example.demo;\n' > $T
            printf 'import org.springframework.boot.SpringApplication;\n' >> $T
            printf 'import org.springframework.boot.autoconfigure.SpringBootApplication;\n' >> $T
            printf 'import org.springframework.web.bind.annotation.*;\n' >> $T
            printf '@SpringBootApplication @RestController\n' >> $T
            printf 'public class DemoApplication {\n' >> $T
            printf '    public static void main(String[] args) { SpringApplication.run(DemoApplication.class, args); }\n' >> $T
            printf '    @GetMapping("/") public String home() { return "<h1>🚀 권한 문제 해결 완료! (Permission Fixed)</h1>"; }\n' >> $T
            printf '}\n' >> $T
          fi

          # Dockerfile 생성
          printf 'FROM maven:3.9-eclipse-temurin-17 AS builder\n' > Dockerfile
          printf 'WORKDIR /app\n' >> Dockerfile
          printf 'COPY . .\n' >> Dockerfile
          printf 'RUN mvn clean package -DskipTests\n' >> Dockerfile
          printf '\n' >> Dockerfile
          printf 'FROM eclipse-temurin:17-jre-alpine\n' >> Dockerfile
          printf 'WORKDIR /app\n' >> Dockerfile
          printf 'COPY --from=builder /app/target/*.jar app.jar\n' >> Dockerfile
          printf 'ENTRYPOINT ["java", "-jar", "app.jar"]\n' >> Dockerfile

      # ----------------------------------------------------------------
      # [Phase 2] 이미지 빌드 및 ★권한 강제 수정★ (핵심 수정 사항)
      # ----------------------------------------------------------------
      - name: 🐳 도커 이미지 빌드 및 권한 해제
        run: |
          echo ">>> 도커 이미지 빌드 중..."
          # sudo를 사용하여 권한 문제 방지
          sudo docker build -t cost-data-app:latest .
          
          echo ">>> 이미지를 파일로 저장 중..."
          sudo docker save -o cost-data-app.tar cost-data-app:latest

          echo ">>> [중요] 파일 권한 강제 변경 (Permission Denied 해결)"
          # 생성된 파일의 소유권을 현재 Runner 사용자로 변경하고 권한을 777로 풂
          sudo chmod 777 cost-data-app.tar
          sudo chown $USER:$USER cost-data-app.tar
          
          echo ">>> 파일 권한 확인:"
          ls -l cost-data-app.tar

      # ----------------------------------------------------------------
      # [Phase 3] 서버 전송 (SCP)
      # ----------------------------------------------------------------
      - name: 🚀 이미지 파일 서버 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          # ▼▼▼ [수정 필요] 본인의 서버 정보 입력 ▼▼▼
          host: "123.123.123.123"
          port: 22
          username: "root"
          password: "my_password_123"
          # ▲▲▲ [수정 필요] 본인의 서버 정보 입력 ▲▲▲
          
          source: "cost-data-app.tar"
          target: "/root/deploy/"
          timeout: "60s" # 전송 시간 넉넉하게 늘림

      # ----------------------------------------------------------------
      # [Phase 4] 서버 자동 설치 및 배포
      # ----------------------------------------------------------------
      - name: 🔧 서버 환경 설치 및 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          # ▼▼▼ [수정 필요] 위와 동일하게 입력 ▼▼▼
          host: "123.123.123.123"
          port: 22
          username: "root"
          password: "my_password_123"
          # ▲▲▲ [수정 필요] 위와 동일하게 입력 ▲▲▲
          
          script_stop: true
          script: |
            echo "#######################################################"
            echo ">>> [Server] Docker 자동 설치 및 배포 시작"
            echo "#######################################################"
            
            # Docker 설치
            if ! command -v docker &> /dev/null; then
                echo "Docker 설치 중..."
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -y > /dev/null
                apt-get install -y curl > /dev/null
                curl -fsSL https://get.docker.com -o get-docker.sh
                sh get-docker.sh > /dev/null
            fi

            # 작업 폴더 준비
            mkdir -p /root/deploy
            cd /root/deploy

            echo ">>> 이미지 로딩 (Load)"
            # 기존 컨테이너 정리
            docker stop cost-data-app || true
            docker rm cost-data-app || true
            
            # 파일이 전송되었는지 확인 후 로드
            if [ -f "cost-data-app.tar" ]; then
                docker load -i cost-data-app.tar
            else
                echo "❌ 오류: 이미지 파일이 전송되지 않았습니다."
                exit 1
            fi

            echo ">>> 컨테이너 실행 (Run)"
            docker run -d \
              --name cost-data-app \
              --restart always \
              -p 80:8080 \
              cost-data-app:latest

            # 정리
            rm -f cost-data-app.tar
            docker image prune -f

            echo ">>> ✅ 모든 작업 완료!"
