name: "🚀 Enterprise Keyless & Resilient Management"

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write

jobs:
  maintenance-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 히스토리를 가져와 rebase 안정성 확보

      # 1. 환경 정비 및 대량 설치
      - name: Setup & Bulk Upgrade
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: "의존성 대량 정비"
        run: |
          pip install --upgrade pip pip-review trivy-jr
          pip-review --auto
          pip freeze > requirements.txt

      # 2. 용량 및 파일 분할 관리 (Maintenance)
      - name: "대량 리포트 분할 및 최적화"
        run: |
          mkdir -p reports/archive
          # 기존 대형 리포트가 있다면 날짜별로 분할 및 압축하여 용량 절감
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          if [ -f "reports_maven_updates.txt" ]; then
            mv reports_maven_updates.txt reports/archive/maven_updates_$TIMESTAMP.txt
            gzip reports/archive/maven_updates_$TIMESTAMP.txt
          fi
          # 최신 요약본만 새로 생성
          echo "Last Maintenance: $TIMESTAMP" > reports/latest_summary.txt

      # 3. 보안 감사 (Keyless Trivy)
      - name: "Trivy 보안 스캔"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'reports/trivy_report.json'

      # 4. 고도화된 Push 전략 (에러 해결 핵심)
      - name: "안전한 대량 변경사항 반영 (Retry Loop)"
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          
          # 변경사항이 없으면 종료
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "⚙️ [Auto] 대량 정비 및 리포트 최적화 ($TIMESTAMP)"
          
          # Push 성공할 때까지 최대 5번 재시도
          SUCCESS=false
          for i in {1..5}; do
            echo "Push 시도 $i/5..."
            if git pull --rebase origin main && git push origin main; then
              SUCCESS=true
              break
            fi
            echo "충돌 발생, 10초 후 재시도..."
            sleep 10
          done

          if [ "$SUCCESS" = false ]; then
            echo "최종 Push 실패. 수동 확인이 필요합니다."
            exit 1
          fi

      - name: "실행 결과 요약"
        if: always()
        run: |
          echo "### 📊 정비 결과 보고" >> $GITHUB_STEP_SUMMARY
          echo "- **변경 파일 수**: $(git diff --name-only HEAD^ HEAD | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **상태**: ✅ 원격 저장소 동기화 완료" >> $GITHUB_STEP_SUMMARY
