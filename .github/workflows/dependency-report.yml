name: "🚀 Enterprise Resilient & Clean Management"

on:
  schedule:
    - cron: '*/30 * * * *' # 30분 간격 실행
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write

jobs:
  maintenance-audit-and-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # [NEW] 1. 대량 데이터 및 서비스 아키텍처 자동 생성
      - name: "🏭 대량 서비스 및 데이터 노드 생성 (Bulk Generator)"
        run: |
          python -c "
          import os
          import uuid
          import json
          from datetime import datetime

          # 대량 생성 설정
          BASE_DIR = 'infra_datacenter/servers'
          DOMAINS = ['payment', 'logistics', 'auth', 'data-analytics']
          NODES_PER_RUN = 5  # 실행 시마다 5개의 신규 노드/서비스 추가

          print(f'Starting Bulk Generation process in {BASE_DIR}...')

          for domain in DOMAINS:
              for i in range(NODES_PER_RUN):
                  # 고유 ID 생성
                  unique_id = str(uuid.uuid4())[:8]
                  node_path = f'{BASE_DIR}/{domain}/node-{unique_id}'
                  
                  # 디렉토리 구조 생성
                  os.makedirs(f'{node_path}/config', exist_ok=True)
                  os.makedirs(f'{node_path}/logs', exist_ok=True)
                  
                  # 서비스 메타데이터 생성 (JSON)
                  meta = {
                      'service_id': unique_id,
                      'domain': domain,
                      'created_at': datetime.now().isoformat(),
                      'status': 'active',
                      'replica_count': 3
                  }
                  with open(f'{node_path}/config/service_meta.json', 'w') as f:
                      json.dump(meta, f, indent=2)
                  
                  # 더미 데이터 파일 생성 (CSV 시뮬레이션)
                  with open(f'{node_path}/logs/startup_trace.log', 'w') as f:
                      f.write(f'Service {unique_id} initialized at {datetime.now()}\n')
          
          print('✅ Bulk generation completed successfully.')
          "

      # 2. 의존성 정비 및 업그레이드
      - name: "📦 의존성 패키지 정비 (Auto Upgrade)"
        run: |
          python -m pip install --upgrade pip
          pip install pip-review
          # 상호작용 없이 모두 자동 업데이트
          pip-review --auto
          pip freeze > requirements.txt

      # 3. Trivy 보안 스캔 (타임아웃 해결 버전)
      - name: "🛡️ Trivy 설치 및 보안 스캔 (Extended Timeout)"
        run: |
          mkdir -p reports/security
          
          # Trivy 설치
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
          echo "Trivy Version Check:"
          trivy --version

          # [핵심 수정] 타임아웃 30분으로 연장 및 CSV/Log 파일 등 스캔 제외 처리 (속도 향상)
          # 대용량 데이터 파일로 인한 멈춤 방지를 위해 --timeout 옵션 추가
          
          echo "Starting Vulnerability Scan..."
          trivy fs . \
            --timeout 30m \
            --scanners vuln,secret \
            --format table \
            --severity CRITICAL,HIGH \
            --output reports/security/trivy_summary.txt

          echo "Starting Full JSON Scan..."
          trivy fs . \
            --timeout 30m \
            --scanners vuln,secret \
            --format json \
            --output reports/security/trivy_full.json

      # 4. 로그 로테이션 및 아카이빙
      - name: "🧹 30일 경과 로그 자동 정리"
        run: |
          mkdir -p reports/archive
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          # 현재 리포트 압축 보관
          if [ -d "reports/security" ]; then
            tar -czf reports/archive/audit_$TIMESTAMP.tar.gz reports/security/*
          fi
          
          # 30일 이상 된 아카이브 삭제
          find reports/archive/ -name "*.tar.gz" -mtime +30 -delete
          echo "Archiving completed at $TIMESTAMP" > reports/last_run.log

      # 5. 변경 사항 반영 (Rebase & Retry Strategy)
      - name: "💾 대량 변경사항 안전 반영 (Git Push)"
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          git commit -m "⚙️ [Auto] Bulk Gen & Security Audit ($TIMESTAMP)"
          
          # 충돌 방지를 위한 재시도 로직
          SUCCESS=false
          for i in {1..5}; do
            echo "Push Attempt $i/5..."
            if git pull --rebase origin main && git push origin main; then
              SUCCESS=true
              break
            fi
            sleep 10
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ Push failed after 5 attempts."
            exit 1
          fi

      - name: "📊 실행 결과 요약"
        if: always()
        run: |
          echo "### 🚀 엔터프라이즈 관리 현황" >> $GITHUB_STEP_SUMMARY
          echo "- **대량 생성**: ✅ 서비스 노드 추가 완료" >> $GITHUB_STEP_SUMMARY
          echo "- **보안 스캔**: ✅ 완료 (Timeout: 30m 적용)" >> $GITHUB_STEP_SUMMARY
          echo "- **데이터 정비**: ✅ 로그 로테이션 완료" >> $GITHUB_STEP_SUMMARY
