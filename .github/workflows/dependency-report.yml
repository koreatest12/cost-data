name: "🚀 Keyless Enterprise Dependency Management"

on:
  schedule:
    - cron: '*/30 * * * *' # 30분 간격 실행
  workflow_dispatch:
  push:
    paths:
      - '**/requirements.txt'
      - '**/pom.xml'

permissions:
  contents: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  # 1. 의존성 대량 업그레이드 및 정비 (Python & Maven)
  upgrade-and-maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Python 대량 업그레이드
      - name: Setup Python & Bulk Upgrade
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Python Maintenance
        run: |
          pip install --upgrade pip pip-review
          pip-review --auto # 모든 패키지 자동 최신화
          pip freeze > requirements.txt

      # Maven 대량 업그레이드
      - name: Setup Java & Maven Upgrade
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Maven Maintenance
        run: |
          # 모든 의존성을 최신 릴리스 버전으로 자동 갱신
          mvn versions:use-latest-releases -DgenerateBackupPoms=false
          mvn versions:display-dependency-updates > reports_maven_updates.txt || true

      - name: Commit Upgraded Dependencies
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚙️ [Auto] 대량 의존성 업그레이드 및 정비" && git push)

  # 2. 키 없는 초고속 보안 감사 (Trivy 활용)
  security-audit:
    needs: upgrade-and-maintenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Trivy는 API 키 없이도 NVD 데이터를 포함한 보안 검사를 수행합니다.
      - name: "Trivy 보안 스캔 (키 발급 불필요)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0' # 취약점이 있어도 빌드는 완료 (리포트 생성을 위해)
          severity: 'CRITICAL,HIGH'
          output: 'trivy-report.txt'

      - name: "취약점 리포트 분할 및 정비"
        run: |
          mkdir -p reports/security
          # 전체 리포트는 JSON으로 저장
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs . --format json --output reports/security/full_audit.json
          
          # 용량 관리를 위해 텍스트 요약본 생성
          cat trivy-report.txt | head -n 50 > reports/security/summary.txt

      - name: "용량 최적화 및 아티팩트 업로드"
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/security/

  # 3. 결과 요약 및 이슈 생성 (API 연동)
  finalize:
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: reports

      - name: "GitHub Step Summary 시각화"
        run: |
          echo "## 🛡️ 보안 감시 결과 (Keyless Mode)" >> $GITHUB_STEP_SUMMARY
          echo "- **검사 도구**: Trivy (NVD API Key-free)" >> $GITHUB_STEP_SUMMARY
          echo "- **상태**: 분석 완료" >> $GITHUB_STEP_SUMMARY
          echo "### 📄 요약 리포트" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat reports/summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: "심각한 취약점 발견 시 자동 알림"
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('reports/full_audit.json', 'utf8'));
            const vulnerabilities = data.Results.flatMap(r => r.Vulnerabilities || []);
            
            if (vulnerabilities.length > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 [Urgent] ${vulnerabilities.length}개의 보안 취약점 감지`,
                body: `Trivy 스캔 결과 고위험 취약점이 발견되었습니다. \n 상세 내용은 Actions Artifact를 확인하세요.`,
                labels: ['security', 'automated']
              });
            }
