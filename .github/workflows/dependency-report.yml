name: "⚡ Ultimate Speed Trivy & Massive DataOps"

on:
  schedule:
    - cron: '*/30 * * * *' # 30분마다 실행
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write

jobs:
  ultimate-speed-ops:
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ------------------------------------------------------------------------
      # [핵심 개선 1] Trivy DB 초고속화: 날짜 기반 키 생성
      # ------------------------------------------------------------------------
      - name: "🕒 Get Date for Cache Key"
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------------
      # [핵심 개선 2] 강력한 듀얼 캐싱 (Vuln DB + Java DB)
      # 하루 단위(today)로 캐시를 묶어, 오늘 이미 받았다면 1초 만에 로드함
      # ------------------------------------------------------------------------
      - name: "⚡ Turbo Cache Trivy DB"
        uses: actions/cache@v4
        id: trivy-cache
        with:
          path: .trivy
          key: trivy-db-v3-${{ runner.os }}-${{ steps.date.outputs.today }}
          restore-keys: |
            trivy-db-v3-${{ runner.os }}-

      # ------------------------------------------------------------------------
      # [핵심 개선 3] DB 다운로드 (캐시가 없을 때만 실행 -> 시간 절약)
      # ------------------------------------------------------------------------
      - name: "📥 Download DB (Only on Cache Miss)"
        if: steps.trivy-cache.outputs.cache-hit != 'true'
        run: |
          echo "⚠️ Cache Miss! Downloading fresh DB..."
          # Trivy 설치
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
          # DB 폴더 생성
          mkdir -p .trivy
          
          # [Powerful] 메인 DB와 Java DB를 각각 명시적으로 다운로드
          trivy image --download-db-only --cache-dir .trivy
          trivy image --download-java-db-only --cache-dir .trivy
          
          echo "✅ DB Download Completed."

      # [4] 하이퍼 병렬 생성 (기존의 강력한 속도 유지)
      - name: "🚀 Hyper-Parallel Generation Engine"
        run: |
          python -c "
          import os, uuid, json, random
          import concurrent.futures
          from datetime import datetime

          run_id = os.getenv('RUN_ID')
          base_root = 'infra_datacenter'
          
          # 대량 생성 설정
          DOMAINS = ['payment', 'auth', 'search', 'inventory', 'user', 'shipping', 'ads', 'finance']
          CITIES = ['Seoul', 'NewYork', 'London', 'Tokyo', 'Paris', 'Berlin']
          NODES_PER_TASK = 50 # 작업량 대폭 증가 (속도 자신감)

          print(f'🚀 Starting Hyper-Speed Generation (Batch {run_id})...')

          def generate_domain_assets(domain):
              for _ in range(NODES_PER_TASK):
                  unique_id = str(uuid.uuid4())[:8]
                  srv_path = f'{base_root}/servers/{domain}/batch-{run_id}/srv-{unique_id}'
                  db_path = f'{base_root}/databases/{domain}/batch-{run_id}/db-{unique_id}'
                  
                  os.makedirs(f'{srv_path}/logs', exist_ok=True)
                  os.makedirs(db_path, exist_ok=True)

                  # POM.xml (Trivy Java DB 활용을 위해 정확한 구조 생성)
                  with open(f'{srv_path}/pom.xml', 'w') as f:
                      f.write(f'<project><modelVersion>4.0.0</modelVersion><groupId>com.{domain}</groupId><artifactId>{unique_id}</artifactId><version>1.0</version></project>')
                  
                  # Log Data
                  with open(f'{srv_path}/logs/app.log', 'w') as f:
                      f.write(f'INFO Started {uuid.uuid4()}\\n' * 50)

                  # SQL Assets
                  with open(f'{db_path}/dump.sql', 'w') as f:
                      f.write(f'INSERT INTO {domain}_tbl VALUES (\\'{uuid.uuid4()}\\');\\n' * 50)
              return f'{domain} Done'

          def generate_weather_assets(city):
              for _ in range(NODES_PER_TASK):
                  st_id = f'{city}-{uuid.uuid4().hex[:4]}'
                  path = f'{base_root}/iot-sensors/weather/{city}/batch-{run_id}/{st_id}'
                  os.makedirs(path, exist_ok=True)
                  with open(f'{path}/readings.csv', 'w') as f:
                      lines = [f'{datetime.now()},{random.randint(-10,35)},Sunny\\n' for _ in range(30)]
                      f.writelines(lines)
              return f'{city} Done'

          if __name__ == '__main__':
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as executor:
                  future_domains = [executor.submit(generate_domain_assets, d) for d in DOMAINS]
                  future_cities = [executor.submit(generate_weather_assets, c) for c in CITIES]
                  concurrent.futures.wait(future_domains + future_cities)
              
          print('✅ Hyper-Parallel Generation Completed.')
          "

      # [5] 데이터 최적화 (병렬)
      - name: "✨ Parallel Data Optimizer"
        run: |
          python -c "
          import os
          import concurrent.futures

          def optimize_file(path):
              try:
                  if path.endswith('.log') or path.endswith('.csv'):
                      with open(path, 'r') as f: lines = sorted(list(set(f.readlines())))
                      with open(path, 'w') as f: f.writelines(lines)
              except: pass

          all_files = []
          for root, _, files in os.walk('infra_datacenter'):
              for file in files:
                  all_files.append(os.path.join(root, file))

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as executor:
              executor.map(optimize_file, all_files)
          print('✅ Optimization Finished.')
          "

      # ------------------------------------------------------------------------
      # [핵심 개선 4] 초고속 스캔 (네트워크 연결 없이 로컬 DB로 즉시 실행)
      # ------------------------------------------------------------------------
      - name: "🛡️ Hyper-Speed Security Scan (Zero-Latency)"
        run: |
          # 캐시 히트 시 바이너리가 없을 수 있으므로 설치 체크
          if ! command -v trivy &> /dev/null; then
             curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          fi
          
          REPORT="reports/security/trivy_${{ github.run_id }}.txt"
          
          echo "🛡️ Starting Scan with FROZEN DB (No Update Check)..."
          
          # [핵심 플래그]
          # --skip-db-update : DB 업데이트 확인 생략 (속도 ↑)
          # --skip-java-db-update : Java DB 업데이트 확인 생략 (속도 ↑)
          # --offline-scan : (선택사항) 의존성 확인 시 인터넷 차단하여 속도 극대화
          
          trivy fs . \
            --cache-dir .trivy \
            --skip-db-update \
            --skip-java-db-update \
            --timeout 30m \
            --scanners vuln,secret \
            --format table \
            --output $REPORT

      # [6] 반영 (Fast Push)
      - name: "💾 Commit & Push"
        run: |
          git config --local user.email "speed-bot@example.com"
          git config --local user.name "Speed-Bot"
          git add .
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "⚡ [Turbo] Batch ${{ github.run_id }} - Trivy DB Optimized"
          
          for i in {1..20}; do
            sleep $(( $RANDOM % 5 + 1 ))
            if git pull --rebase origin main && git push origin main; then exit 0; fi
          done
          exit 1
