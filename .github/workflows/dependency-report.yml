name: "🚀 Enterprise Parallel Operations & Security"

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write

# [중요] 동시성 그룹 설정이 없어야 병렬 실행이 가능합니다. (Cancel-in-progress 제거)

jobs:
  parallel-secure-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # [1] 캐싱 (동시 실행 시에도 읽기 전용으로 안전하게 공유됨)
      - name: "⚡ Cache Trivy DB"
        uses: actions/cache@v4
        with:
          path: .trivy
          key: trivy-db-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # [2] 충돌 없는 대량 생성 (UUID 기반 격리)
      - name: "🏭 Generate Unique Data Nodes"
        run: |
          python -c "
          import os, uuid, json, random
          from datetime import datetime

          # 실행마다 고유한 배치 ID 부여
          BATCH_ID = '${{ github.run_id }}'
          BASE_DIR = 'infra_datacenter/servers'
          DOMAINS = ['payment', 'logistics', 'auth', 'inventory', 'user-profile']
          
          # 노드 개수 확장
          NODES_PER_RUN = 5 

          print(f'Starting Parallel Batch {BATCH_ID} in {BASE_DIR}...')
          
          for domain in DOMAINS:
              for i in range(NODES_PER_RUN):
                  unique_id = str(uuid.uuid4())[:8]
                  # 경로 충돌 방지를 위해 UUID 사용
                  node_path = f'{BASE_DIR}/{domain}/service-{unique_id}'
                  
                  os.makedirs(f'{node_path}/src/main/resources', exist_ok=True)
                  os.makedirs(f'{node_path}/logs', exist_ok=True)
                  
                  # POM 생성 (Trivy 에러 방지)
                  pom_content = f'''<project xmlns=\"http://maven.apache.org/POM/4.0.0\"
                      xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"
                      xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\">
                      <modelVersion>4.0.0</modelVersion>
                      <groupId>com.enterprise.{domain}</groupId>
                      <artifactId>service-{unique_id}</artifactId>
                      <version>1.0.0</version>
                      <properties><java.version>17</java.version></properties>
                  </project>'''
                  
                  with open(f'{node_path}/pom.xml', 'w') as f: f.write(pom_content)

                  # 로그 생성
                  with open(f'{node_path}/logs/app.log', 'w') as f:
                      f.write(f'Batch execution {BATCH_ID} initialized.\\n')
          
          print('✅ Unique Data Generation Completed.')
          "

      # [3] 데이터 최적화 (기존 유지)
      - name: "✨ Smart Data Optimizer"
        run: |
          cat << 'EOF' > data_optimizer.py
          import os, time
          # (최적화 로직은 파일 내부 내용만 변경하므로 충돌 위험 낮음)
          print("Optimization starting...")
          for root, _, files in os.walk('infra_datacenter'):
              for file in files:
                  if file.endswith('.xml') or file.endswith('.json'): continue
                  path = os.path.join(root, file)
                  try:
                      with open(path,'r') as f: lines = sorted(list(set(f.readlines())))
                      with open(path,'w') as f: f.writelines(lines)
                  except: pass
          EOF
          python data_optimizer.py

      # [4] OpenClaw (리포트 파일명 격리 적용)
      - name: "🦅 OpenClaw Deep Scan"
        run: |
          mkdir -p reports/security/quarantine
          
          # 리포트 파일명에 Run ID 포함 -> 충돌 방지
          REPORT_FILE = "reports/security/openclaw_audit_${{ github.run_id }}.json"
          
          cat << EOF > openclaw.py
          import os, re, json, shutil
          from datetime import datetime
          
          REPORT = {'scan_id': '${{ github.run_id }}', 'threats': []}
          PATTERNS = {'AWS_KEY': r'AKIA[0-9A-Z]{16}'}
          
          for root, _, files in os.walk('.'):
              if '.git' in root: continue
              for file in files:
                  path = os.path.join(root, file)
                  try:
                      with open(path,'r', errors='ignore') as f: content = f.read()
                      for k,v in PATTERNS.items():
                          if re.search(v, content):
                              REPORT['threats'].append({'file': path, 'type': k})
                              # 격리 파일도 고유 이름으로 저장
                              safe_name = f"{path.replace('/','_')}_${{ github.run_id }}"
                              shutil.copy(path, os.path.join('reports/security/quarantine', safe_name))
                  except: pass
                  
          with open('$REPORT_FILE', 'w') as f: json.dump(REPORT, f)
          EOF
          python openclaw.py

      # [5] Trivy 스캔 (리포트 파일명 격리 적용)
      - name: "🛡️ Trivy Security Scan"
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          mkdir -p .trivy
          
          # 고유한 리포트 파일명 생성
          REPORT_FILE="reports/security/trivy_summary_${{ github.run_id }}.txt"
          
          trivy fs . \
            --cache-dir .trivy \
            --timeout 30m \
            --scanners vuln,secret \
            --format table \
            --output $REPORT_FILE

      # [6] Git Push 충돌 방지 전략 (Random Backoff & Retry)
      - name: "💾 Safe Push with Random Backoff"
        run: |
          git config --local user.email "parallel-bot@example.com"
          git config --local user.name "Parallel-Ops-Bot"
          
          git add .
          
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          
          git commit -m "⚙️ [Ops] Batch ${{ github.run_id }} - Scale & Audit"
          
          # [핵심] 동시성 충돌 방지를 위한 재시도 로직 강화
          MAX_RETRIES=10
          for i in $(seq 1 $MAX_RETRIES); do
            
            # 1. Random Jitter: 1~15초 사이 랜덤 대기 (서로 겹치지 않게)
            SLEEP_TIME=$(( $RANDOM % 15 + 1 ))
            echo "⏳ Waiting ${SLEEP_TIME}s to avoid collision (Attempt $i/$MAX_RETRIES)..."
            sleep $SLEEP_TIME
            
            # 2. Rebase Pull (원격 변경사항 내 커밋 앞으로 가져오기)
            if git pull --rebase origin main; then
              # 3. Push 시도
              if git push origin main; then
                echo "✅ Push Success!"
                exit 0
              else
                echo "⚠️ Push failed, retrying..."
              fi
            else
              echo "⚠️ Rebase failed (conflict?), resolving automatically..."
              # 충돌 시 일단 내 변경사항 우선 (자동화 봇 특성상) 혹은 중단
              git rebase --abort || true
            fi
          done
          
          echo "❌ Failed to push after $MAX_RETRIES attempts."
          exit 1
