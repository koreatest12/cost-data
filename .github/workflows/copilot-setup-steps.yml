name: Copilot Agent - Complete Run (Ultimate Release Edition v5)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  agent-windows:
    name: Run Agent on Windows (Fixed & Enhanced)
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 1. 데이터 리포지토리 체크아웃
      - name: 데이터 리포지토리 체크아웃
        uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: cost-data-repo
          fetch-depth: 0

      # 2. 기본 환경 검증 및 방화벽
      - name: 환경 검증 및 방화벽 설정
        shell: powershell
        run: |
          Write-Host "Environment Check..."
          New-NetFirewallRule -DisplayName "Allow Auth Service" -Direction Inbound -Protocol TCP -LocalPort 389 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow Docker" -Direction Outbound -Protocol TCP -RemotePort 2375 -Action Allow -ErrorAction SilentlyContinue

      # [UPGRADE] 3. 초대량 가상 계정 생성 (200개로 증가)
      - name: 초대량 계정 생성 및 활성화 (Mass Account Provisioning)
        shell: powershell
        run: |
          $authDir = "cost-data-repo\auth_registry"
          New-Item -ItemType Directory -Force -Path $authDir | Out-Null
          $csvPath = "$authDir\windows_accounts.csv"
          
          "Username,Password,Service,Status,Created_At" | Out-File -FilePath $csvPath -Encoding utf8
          
          Write-Host "Starting Massive Account Activation (Target: 200 Accounts)..."
          
          1..200 | ForEach-Object {
              $id = $_
              $username = "svc_user_$id"
              $password = -join ((33..126) | Get-Random -Count 20 | % {[char]$_})
              $service = "Win_Svc_Tier_$($id % 10)"
              $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              
              $entry = "$username,$password,$service,Active,$timestamp"
              $entry | Out-File -FilePath $csvPath -Encoding utf8 -Append
          }
          Write-Host "Registry saved to $csvPath"

      # [UPGRADE] 4. 초대량 파일/디렉토리 데이터 생성 (Stress Test)
      - name: 초대량 데이터 파일 생성 (Mass Data Generation)
        shell: powershell
        run: |
          $baseDir = "cost-data-repo\generated_data"
          New-Item -ItemType Directory -Force -Path $baseDir | Out-Null
          
          Write-Host "Generating massive directory structure (20 Categories x 100 Files)..."
          1..20 | ForEach-Object {
              $subDir = "$baseDir\Category_$_"
              New-Item -ItemType Directory -Force -Path $subDir | Out-Null
              
              1..100 | ForEach-Object {
                  $content = "Log Entry $_ - $(Get-Date)"
                  Set-Content -Path "$subDir\data_$_.log" -Value $content
              }
              
              # 대용량 파일 생성 (분할 테스트용)
              if ($_ % 5 -eq 0) {
                  fsutil file createnew "$subDir\large_blob_$_.dat" (120 * 1024 * 1024)
                  Write-Host "Created 120MB file in Category_$_"
              }
          }

      # 5. Playwright 및 Maven 설정
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          npm install -g playwright
          npx playwright install --with-deps chromium
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          server-id: github
          settings-path: ${{ github.workspace }}

      # 6. [FIX] 데이터 권한 수정 (따옴표 추가) 및 분할
      - name: 데이터 처리 및 도커 빌드 (Fix Applied)
        shell: powershell
        run: |
          $target = "cost-data-repo"
          Write-Host "Upgrading Permissions for $target..."
          
          # [FIX] 에러 수정: 권한 구문을 따옴표로 감싸서 문자열 처리
          icacls $target /grant "Everyone:(OI)(CI)F" /T
          
          Write-Host "Splitting Large Files..."
          Get-ChildItem -Path $target -Recurse -File | Where-Object { $_.Length -gt 100MB } | ForEach-Object {
              Write-Host "Splitting $($_.Name)..."
              Rename-Item -Path $_.FullName -NewName "$($_.Name).split"
          }
          
          # 도커 빌드
          cd cost-data-repo
          if (-not (Test-Path "Dockerfile")) { "FROM alpine:latest`nCOPY . /data`nCMD [`"ls`", `"-R`", `"/data`"]" | Out-File -FilePath Dockerfile -Encoding utf8 }
          docker build -t cost-data-win:v5 .

      # 7. 패키징
      - name: 패키징
        shell: powershell
        run: |
          $ver = "v5.0.$(Get-Date -Format 'yyyyMMdd')"
          $pkg = "copilot-agent-win-$ver.zip"
          mkdir target -Force
          Compress-Archive -Path "cost-data-repo\*" -DestinationPath $pkg -Force
          Write-Host "Package Created: $pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-v5
          path: *.zip

  agent-linux:
    name: Run Agent on Linux (Fixed & Enhanced)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: koreatest12/cost-data
          path: cost-data-repo
          fetch-depth: 0

      # 1. 보안 업그레이드
      - name: 보안 업그레이드
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade ufw openssl -y
          sudo ufw allow 22/tcp

      # [UPGRADE] 2. 초대량 계정 생성 (200개)
      - name: 초대량 계정 생성 (Mass Account Provisioning)
        run: |
          AUTH_DIR="cost-data-repo/auth_registry"
          mkdir -p $AUTH_DIR
          CSV_PATH="$AUTH_DIR/linux_accounts.csv"
          
          echo "Username,Password_Hash,Service,Status,Created_At" > $CSV_PATH
          echo "Generating 200 Linux Service Accounts..."
          
          for i in {1..200}; do
            USERNAME="svc_linux_$i"
            PASS_HASH=$(openssl rand -base64 12 | openssl passwd -1 -stdin)
            SERVICE="Daemon_Tier_$((i % 10))"
            echo "$USERNAME,$PASS_HASH,$SERVICE,Active,$(date)" >> $CSV_PATH
          done
          echo "Registry generation done."

      # [UPGRADE] 3. 초대량 데이터 파일 생성
      - name: 초대량 데이터 파일 생성
        run: |
          BASE="cost-data-repo/generated_data"
          mkdir -p $BASE
          echo "Generating 20 Categories x 100 Files..."
          
          for i in {1..20}; do
            SUB="$BASE/Cat_$i"
            mkdir -p $SUB
            for j in {1..100}; do echo "Data $j" > "$SUB/file_$j.log"; done
            
            # 대용량 파일
            if [ $((i % 5)) -eq 0 ]; then
              dd if=/dev/zero of="$SUB/heavy_file_$i.bin" bs=1M count=120
            fi
          done

      # 4. Playwright 및 Maven
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          npm install -g playwright
          npx playwright install --with-deps chromium

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          server-id: github
          settings-path: ${{ github.workspace }}
      
      - run: mvn dependency:resolve -B -s ${{ github.workspace }}/settings.xml

      # 5. 권한, 분할, 도커
      - name: 데이터 처리 및 도커 빌드
        run: |
          TARGET="cost-data-repo"
          chmod -R 777 $TARGET
          find $TARGET -type f -size +100M -exec split -b 50M {} {}.part_ \; -exec rm {} \;
          
          cd cost-data-repo
          if [ ! -f Dockerfile ]; then echo -e "FROM alpine:latest\nCOPY . /data\nCMD [\"ls\", \"-R\"]" > Dockerfile; fi
          docker build -t cost-data-linux:v5 .

      # 6. 패키징
      - name: 패키징 및 업로드
        run: |
          VERSION="v5.0.$(date +%Y%m%d)"
          tar -czf copilot-agent-linux-$VERSION.tar.gz cost-data-repo/
      
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-v5
          path: *.tar.gz
