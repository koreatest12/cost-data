name: Copilot Agent - Robust Grid (Ultimate v5)
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
permissions:
  contents: read
  packages: write

jobs:
  agent-windows-robust:
    name: Windows Robust HA Grid (Self-Healing)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: 작업 설정 (Job Setup)
        uses: actions/checkout@v4

      # 1. 서버 환경 최적화
      - name: 서버 환경 최적화 및 보안 패치
        shell: powershell
        run: |
          Write-Host "Optimizing Host Environment..."
          # Windows Defender 정의 업데이트 (오류 무시 옵션 추가)
          Update-MpSignature -ErrorAction SilentlyContinue
          
          # Docker 데몬 상태 확인 및 재시작 (안정성 확보)
          $docker = Get-Service docker -ErrorAction SilentlyContinue
          if ($docker.Status -ne 'Running') { 
              Write-Host "Starting Docker Service..."
              Start-Service docker 
          }
          Write-Host "Host Environment Ready."

      # 2. 데이터 레이어 준비 (샤딩 포함)
      - name: 데이터 클론 및 샤딩 (Data Layer)
        shell: powershell
        run: |
          # 기존 폴더 정리
          if (Test-Path "migrated_data") { Remove-Item -Path "migrated_data" -Recurse -Force }
          
          Write-Host "Cloning Repository..."
          git clone https://github.com/koreatest12/cost-data.git cost-data-repo
          
          Write-Host "Executing Smart Sharding Algorithm..."
          $sourcePath = "migrated_data"
          New-Item -ItemType Directory -Force -Path $sourcePath | Out-Null
          
          $shards = 5
          1..$shards | ForEach-Object { New-Item -ItemType Directory -Force -Path "$sourcePath\batch_$_" | Out-Null }
          
          # 파일 분산 (Round Robin)
          $files = Get-ChildItem -Path "cost-data-repo" -Recurse -File
          $i = 0
          foreach ($file in $files) {
              $shardId = ($i % $shards) + 1
              Copy-Item -Path $file.FullName -Destination "$sourcePath\batch_$shardId"
              $i++
          }
          Write-Host "Data Distributed across $shards Shards successfully."

      # [FIX & NEW] 3. Native PowerShell 알고리즘 엔진 생성
      # Python 대신 Windows 컨테이너에 기본 내장된 PowerShell을 사용하여 호환성 문제 완벽 해결
      - name: PowerShell 연산 엔진 생성 (Native Engine)
        shell: powershell
        run: |
          $scriptContent = @"
          param(
              [string]`$BatchID,
              [string]`$Role
          )
          `$ErrorActionPreference = 'Stop'
          
          Write-Host "[`$Role] Initializing Batch Processing Node #`$BatchID..."
          
          # 데이터 경로 확인
          `$dataPath = "C:\app\data\batch_`$BatchID"
          if (-not (Test-Path `$dataPath)) {
              Write-Host "[ERROR] Data path not found: `$dataPath"
              exit 1
          }
          
          # 알고리즘 연산 시뮬레이션 (CPU 부하)
          `$files = Get-ChildItem -Path `$dataPath
          `$totalScore = 0
          
          foreach (`$f in `$files) {
              `$hash = (Get-FileHash `$f.FullName -Algorithm MD5).Hash
              `$seed = [int64](`$hash.Substring(0, 8) -replace '[^0-9]','1') 
              `$totalScore += (`$seed % 100)
              Start-Sleep -Milliseconds 50 # 연산 시간 시뮬레이션
          }
          
          Write-Host "[`$Role] Calculation Complete. Final Score: `$totalScore"
          Write-Host "[`$Role] System Metrics: Memory=OK, CPU=Stable"
          "@
          Set-Content -Path "calc_engine.ps1" -Value $scriptContent -Encoding UTF8

      # [FIX & NEW] 4. Dockerfile 수정 (CMD /c 에러 해결)
      - name: Docker 이미지 빌드 (Windows Native)
        shell: powershell
        run: |
          # Windows Server Core 이미지 사용 및 PowerShell 실행 설정
          $dockerfile = @"
          FROM mcr.microsoft.com/windows/servercore:ltsc2022
          
          WORKDIR /app
          
          # 데이터 및 스크립트 복사
          COPY migrated_data /app/data
          COPY calc_engine.ps1 /app/
          
          # [CRITICAL FIX] ENTRYPOINT를 PowerShell로 지정하여 실행 오류 방지
          ENTRYPOINT ["powershell", "-ExecutionPolicy", "Bypass", "-File", "C:\\app\\calc_engine.ps1"]
          "@
          Set-Content -Path "Dockerfile" -Value $dockerfile

          Write-Host "Building Robust Windows Image..."
          docker build -t win-algo-node:v5 .

      # [NEW] 5. 대량 기동 및 자가 복구(Retry) 로직 적용
      - name: 그리드 대량 기동 (Grid Launch with Retry)
        shell: powershell
        run: |
          $batches = 1..5
          $roles = @("primary", "replica")
          
          foreach ($id in $batches) {
              foreach ($role in $roles) {
                  $containerName = "node-$id-$role"
                  Write-Host "Launching Container: $containerName..."
                  
                  # 컨테이너 실행 (Retry 로직 포함)
                  $retryCount = 0
                  $maxRetries = 3
                  $success = $false
                  
                  while (-not $success -and $retryCount -lt $maxRetries) {
                      try {
                          # 이전 컨테이너 정리
                          docker rm -f $containerName 2>$null
                          
                          # 컨테이너 실행
                          $res = docker run -d --name $containerName win-algo-node:v5 "$id" "$role"
                          if ($LASTEXITCODE -eq 0) { 
                              $success = $true
                              Write-Host " -> [OK] $containerName launched (ID: $($res.Substring(0,12)))"
                          } else { throw "Docker run failed" }
                      } catch {
                          $retryCount++
                          Write-Host " -> [WARN] Launch failed. Retrying ($retryCount/$maxRetries)..."
                          Start-Sleep -Seconds 2
                      }
                  }
                  
                  if (-not $success) {
                      Write-Host " -> [CRITICAL] Failed to launch $containerName after retries."
                  }
              }
          }

      # [NEW] 6. 실시간 로그 모니터링 및 결과 검증
      - name: 실시간 모니터링 및 검증 (Monitoring)
        shell: powershell
        run: |
          Write-Host "Waiting for calculation convergence..."
          Start-Sleep -Seconds 10 
          
          $batches = 1..5
          foreach ($id in $batches) {
              Write-Host "=== BATCH #$id REPORT ==="
              $pLogs = docker logs "node-$id-primary" 2>&1
              $rLogs = docker logs "node-$id-replica" 2>&1
              
              if ($pLogs -match "Final Score") { Write-Host " [PRIMARY] Task Completed." -ForegroundColor Green }
              else { Write-Host " [PRIMARY] Task Running/Failed." -ForegroundColor Yellow }
              
              if ($rLogs -match "Final Score") { Write-Host " [REPLICA] Task Completed." -ForegroundColor Green }
              else { Write-Host " [REPLICA] Task Running/Failed." -ForegroundColor Yellow }
              
              Write-Host "-------------------------"
          }

      # 7. 정리 및 아티팩트
      - name: 시스템 정리
        if: always()
        shell: powershell
        run: |
          docker rm -f $(docker ps -aq) 2>$null
          Remove-Item -Path "migrated_data", "cost-data-repo" -Recurse -Force -ErrorAction SilentlyContinue

  agent-linux-robust:
    name: Linux Robust HA Grid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 시스템 초기화
        run: sudo apt-get update && sudo apt-get install -y ufw

      - name: 데이터 및 스크립트 준비
        run: |
          git clone https://github.com/koreatest12/cost-data.git cost-data-repo
          mkdir -p migrated_data
          cp -r cost-data-repo/* migrated_data/
          
          # Bash Sharding
          SHARDS=5
          for i in $(seq 1 $SHARDS); do mkdir -p "migrated_data/batch_$i"; done
          c=0
          for f in migrated_data/*; do
             if [ -f "$f" ]; then
                idx=$(( (c % SHARDS) + 1 ))
                mv "$f" "migrated_data/batch_$idx/"
                ((c++))
             fi
          done

          # Python Algorithm Engine
          cat <<EOF > calc_engine.py
          import sys, time
          print(f"[{sys.argv[2]}] Processing Batch {sys.argv[1]}...")
          time.sleep(1)
          print(f"[{sys.argv[2]}] Done.")
          EOF

          # Dockerfile
          echo -e "FROM python:3.9-slim\nWORKDIR /app\nCOPY . /app\nENTRYPOINT [\"python3\", \"calc_engine.py\"]" > Dockerfile

      - name: Docker 대량 실행 (Bash Loop)
        run: |
          docker build -t linux-node:v5 .
          for i in {1..5}; do
             docker run -d --name "node-$i-primary" linux-node:v5 "$i" "primary"
             docker run -d --name "node-$i-replica" linux-node:v5 "$i" "replica"
          done

      - name: 결과 확인
        run: |
          sleep 5
          docker ps -a
          docker logs node-1-primary
