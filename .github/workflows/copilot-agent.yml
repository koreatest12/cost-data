name: Cost Data Agent - Ultimate Virtual Account & Patch Edition

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==================================================================================
  # [JOB 1] Windows Agent (300k Virtual Accounts & Patches)
  # ==================================================================================
  agent-windows:
    name: Windows Fintech Agent (300k VA Data)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # 1. 작업 설정
      - name: 작업 설정
        uses: actions/checkout@v4

      # 2. 실행기 및 보안 검증
      - name: 실행기 및 보안 모듈 검증
        shell: powershell
        run: |
          Write-Host "Verifying Environment..."
          if (Get-Module -ListAvailable -Name NetSecurity) {
              Write-Host "NetSecurity Module [FOUND]."
          } else {
              Install-Module -Name NetSecurity -Force -AllowClobber -Scope CurrentUser
          }

      # 3. 보안 서비스 최적화
      - name: 보안 서비스 최적화
        shell: powershell
        run: |
          try { Update-MpSignature -ErrorAction SilentlyContinue } catch { }
          if ((Get-Service mpssvc).Status -eq 'Running') {
              Update-Help -Module NetSecurity -Force -ErrorAction SilentlyContinue
          }

      # 4. Java & Maven 설정
      - name: Java & Maven 환경 구성
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Maven 3.9.6 수동 설치
        shell: powershell
        run: |
          $url = "https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.zip"
          $output = "maven.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath .
          $mavenBin = "$(Get-Location)\apache-maven-3.9.6\bin"
          echo "$mavenBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 5. [신규 대량 생성] 가상 계좌 정보 30만 건 (StreamWriter 최적화)
      - name: 가상 계좌 정보 30만 건 생성 (Massive VA Generation)
        shell: powershell
        run: |
          Write-Host "Generating 300,000 Virtual Account Records..."
          $vaPath = "src/main/resources/services/virtual_accounts"
          New-Item -ItemType Directory -Force -Path $vaPath | Out-Null
          
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $swVA = New-Object System.IO.StreamWriter("$vaPath/va_master_db.csv", $false, $utf8NoBom)
          
          # CSV 헤더
          $swVA.WriteLine("VA_ID,BANK_CODE,ACCOUNT_NUM,OWNER_NAME,EXPIRY_DATE,STATUS,REF_ID")
          
          # 30만 건 루프 (성능 최적화: 단순 문자열 조합)
          1..300000 | ForEach-Object {
             $bankCode = Get-Random -InputObject "004", "088", "020", "011"
             $accNum = "999$(Get-Random -Min 10000000 -Max 99999999)"
             $status = if ($_ % 20 -eq 0) { "EXPIRED" } else { "ACTIVE" }
             $expiry = (Get-Date).AddDays(7).ToString("yyyy-MM-dd")
             
             # 쓰기 작업
             $swVA.WriteLine("VA_$_, $bankCode, $accNum, User_$_, $expiry, $status, REF_$_")
             
             if ($_ % 50000 -eq 0) { Write-Host " -> Generated $_ / 300,000 VA records..." }
          }
          $swVA.Close()
          Write-Host "Virtual Account Generation Completed."

      # 6. [기반 데이터] 서비스별 패치 파일 생성
      - name: 서비스별 패치 및 기반 데이터 생성
        shell: powershell
        run: |
          Write-Host "Generating Base Service & Patch Data..."
          $base = "src/main/resources/services"
          $dirs = "$base/auth", "$base/payment", "$base/patches"
          foreach ($d in $dirs) { New-Item -ItemType Directory -Force -Path $d | Out-Null }
          
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          
          # 패치 파일 1,000개 생성
          1..1000 | ForEach-Object {
             $sw = New-Object System.IO.StreamWriter("$base/patches/patch_v$_.sql", $false, $utf8NoBom)
             $sw.WriteLine("-- Critical Patch v$_`r`nUPDATE accounts SET status='VERIFIED' WHERE id=$_")
             $sw.Close()
          }
          Write-Host "Patch Data Generated."

      # 7. [시뮬레이션] 가상 계좌 입금 처리 시뮬레이션
      - name: 가상 계좌 입금 처리 시뮬레이션
        shell: powershell
        run: |
          Write-Host "Simulating VA Deposit Processing..."
          $logPath = "va_deposit_report.log"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $swLog = New-Object System.IO.StreamWriter($logPath, $false, $utf8NoBom)
          
          $swLog.WriteLine("TIMESTAMP | VA_ID | AMOUNT | RESULT | PROCESS_TIME_MS")
          
          # 1,000건의 입금 시도 시뮬레이션
          1..1000 | ForEach-Object {
              $amount = Get-Random -Min 10000 -Max 1000000
              $procTime = Get-Random -Min 5 -Max 50
              $status = "SUCCESS"
              
              $swLog.WriteLine("$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') | VA_$_ | $amount | $status | $procTime")
          }
          $swLog.Close()
          Write-Host "Deposit Simulation Completed."

      # 8. Maven 빌드
      - name: 통합 빌드
        shell: powershell
        run: |
          mvn dependency:go-offline -B
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          
          Write-Host "Building Application with 300k VA Data..."
          mvn clean package -DskipTests -B -q
          Write-Host "Build Successful."

      # 9. 패키징 및 업로드
      - name: 통합 아티팩트 패키징
        shell: powershell
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $packageName = "korea-fintech-windows-$date.zip"
          if (-not (Test-Path "target")) { New-Item -ItemType Directory -Force -Path "target" }
          
          # VA 데이터 포함 압축
          Compress-Archive -Path "target/*.jar", "src/main/resources/services", "va_deposit_report.log" -DestinationPath $packageName -Force
          Write-Host "Package Created: $packageName"

      - name: 정리 및 업로드
        shell: powershell
        run: Remove-Item -Path "maven.zip" -Force -ErrorAction SilentlyContinue
      
      - name: 결과물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-fintech-package
          path: '*.zip'

  # ==================================================================================
  # [JOB 2] Linux Agent (Python Optimized 300k Generation)
  # ==================================================================================
  agent-linux:
    name: Linux Fintech Agent (300k VA Data)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 작업 설정
        uses: actions/checkout@v4

      - name: 시스템 최적화
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade ufw iptables net-tools -y
          sudo ufw --force reset

      - name: Java & Maven 준비
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Maven 3.9.6 설치
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          echo "$PWD/apache-maven-3.9.6/bin" >> $GITHUB_PATH

      # [Python 사용] 30만 건 가상 계좌 데이터 고속 생성
      - name: 가상 계좌 30만 건 생성 (Python)
        run: |
          echo "Generating 300,000 Virtual Accounts using Python..."
          mkdir -p src/main/resources/services/virtual_accounts
          
          python3 -c "
          import random
          
          file_path = 'src/main/resources/services/virtual_accounts/va_master_db.csv'
          banks = ['004', '088', '020', '011', '003']
          total_records = 300000
          
          print(f'Starting generation of {total_records} VA records...')
          
          with open(file_path, 'w') as f:
              f.write('VA_ID,BANK_CODE,ACCOUNT_NUM,OWNER,EXPIRY,STATUS\n')
              
              for i in range(1, total_records + 1):
                  bank = random.choice(banks)
                  acc = f'999{random.randint(10000000, 99999999)}'
                  status = 'ACTIVE' if i % 20 != 0 else 'EXPIRED'
                  
                  f.write(f'VA_{i},{bank},{acc},User_{i},2025-12-31,{status}\n')
                  
                  if i % 50000 == 0:
                      print(f' -> Generated {i} records...')
                      
          print('Virtual Account Generation Completed.')
          "

      # [Python 사용] 서비스별 패치 파일 생성
      - name: 서비스별 패치 데이터 생성
        run: |
          echo "Generating Patch Data..."
          mkdir -p src/main/resources/services/patches
          python3 -c "
          for i in range(1, 1001):
              with open(f'src/main/resources/services/patches/patch_v{i}.sql', 'w') as f:
                  f.write(f'-- Patch v{i}\\nALTER TABLE users ADD col_{i} VARCHAR(10);')
          "

      - name: 통합 빌드
        run: mvn clean package -DskipTests -B -q

      # [Python 사용] 대량 입금 처리 및 패치 적용 시뮬레이션
      - name: 입금 처리 및 패치 시뮬레이션
        run: |
          echo "Running Deposit & Patch Simulation..."
          python3 -c "
          import random, time
          
          report_file = 'linux_fintech_report.csv'
          
          with open(report_file, 'w') as f:
              f.write('TIMESTAMP,TYPE,ID,RESULT,LATENCY\n')
              
              # 1. 입금 처리 시뮬레이션 (2,000건)
              print('Simulating Deposits...')
              for i in range(2000):
                  lat = random.randint(10, 100)
                  f.write(f'{int(time.time())},DEPOSIT,VA_{i},SUCCESS,{lat}\n')
                  
              # 2. 패치 적용 시뮬레이션 (500건)
              print('Simulating Patches...')
              for i in range(500):
                  status = 'APPLIED' if random.random() > 0.05 else 'FAILED'
                  f.write(f'{int(time.time())},PATCH,v{i},{status},0\n')
                  
          print('All Simulations Finished.')
          "

      - name: 패키징 및 업로드
        run: |
          VERSION="v1.0.fintech.$(date +%Y%m%d)"
          PKG_NAME="korea-fintech-linux-$VERSION.tar.gz"
          mkdir -p target
          
          tar -czf $PKG_NAME target/*.jar src/main/resources/services/ linux_fintech_report.csv
          
          echo "Package Created: $PKG_NAME"

      - name: 결과물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-fintech-package
          path: '*.tar.gz'
