name: Copilot Agent - Complete Run (Ultimate Massive Data Edition)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==================================================================================
  # [JOB 1] Windows Agent (Massive Build & Security)
  # ==================================================================================
  agent-windows:
    name: Run Agent on Windows (Massive Build)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # 1. 작업 설정
      - name: 작업 설정 (Job Setup)
        uses: actions/checkout@v4

      # 2. 실행기 OS 및 보안 모듈 검증
      - name: 실행기 OS 및 보안 모듈 검증
        shell: powershell
        run: |
          Write-Host "Verifying Windows Runner Environment..."
          Get-ComputerInfo | Select-Object WindowsVersion, OsArchitecture, CsName
          
          if (Get-Module -ListAvailable -Name NetSecurity) {
              Write-Host "NetSecurity Module Found."
          } else {
              Write-Host "Installing NetSecurity Module..."
              Install-Module -Name NetSecurity -Force -AllowClobber -Scope CurrentUser
          }

      # 3. 방화벽 서비스 설치 및 업그레이드
      - name: 방화벽 서비스 설치 및 업그레이드
        shell: powershell
        run: |
          Write-Host "Starting Firewall Service Maintenance..."
          try {
            Update-MpSignature -ErrorAction SilentlyContinue
            Write-Host "Defender Signatures Updated."
          } catch {
            Write-Host "Warning: Defender update skipped."
          }

          $firewall = Get-Service mpssvc
          if ($firewall.Status -eq 'Running') {
              Write-Host "Windows Firewall Service is active. Refreshing Policy..."
              Update-Help -Module NetSecurity -Force -ErrorAction SilentlyContinue
          } else {
              Start-Service mpssvc
          }

      # 4. 시스템 서비스 및 패키지 최신화
      - name: 시스템 서비스 및 패키지 최신화
        shell: powershell
        run: |
          Write-Host "Upgrading System Components..."
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser
          choco upgrade git -y --no-progress
          Write-Host "System Services Upgraded."

      # 5. Playwright 설치
      - name: Playwright MCP 서버 다운로드
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright 패키지 설치
        shell: powershell
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium

      # 6. Java/Maven 준비
      - name: Copilot(Windows) 준비
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Maven 3.9.6 수동 설치
        shell: powershell
        run: |
          $url = "https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.zip"
          $output = "maven.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath .
          $mavenBin = "$(Get-Location)\apache-maven-3.9.6\bin"
          echo "$mavenBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 7. 초대형 더미 데이터 생성 (5배 증량)
      - name: 초대형 더미 데이터 및 빌드 자산 생성 (Massive Generation)
        shell: powershell
        run: |
          Write-Host "Generating ULTIMATE Massive Dataset..."
          $dataPath = "src/main/resources/mock_data"
          New-Item -ItemType Directory -Force -Path $dataPath | Out-Null
          
          # JSON 데이터 5,000개 생성
          Write-Host " -> Generating 5,000 JSON records..."
          1..5000 | ForEach-Object {
            $json = "{ 'id': $_, 'uuid': '$([guid]::NewGuid())', 'payload': 'load_test_data_$_' }"
            $json | Out-File -FilePath "$dataPath/record_$_.json" -Encoding utf8
          }
          
          # 대용량 바이너리 10개 생성 (총 500MB 부하)
          Write-Host " -> Generating Heavy Binary Assets (50MB x 10)..."
          1..10 | ForEach-Object {
            fsutil file createnew "$dataPath/asset_heavy_$_.bin" 52428800
          }
          Write-Host "Massive Data Generation Completed."

      # 8. Copilot 의존성
      - name: Copilot 리소스 다운로드
        shell: powershell
        run: mvn dependency:go-offline -B

      # 9. MCP 서버 및 방화벽 규칙
      - name: MCP 서버 시작 및 방화벽 구성
        shell: powershell
        run: |
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          New-NetFirewallRule -DisplayName "Allow HTTP" -Direction Inbound -Protocol TCP -LocalPort 80 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Agent Cluster" -Direction Inbound -Protocol TCP -LocalPort 5000-5010 -Action Allow -ErrorAction SilentlyContinue

      # 10. Agent 기동
      - name: Copilot Coding Agent 대량 기동
        shell: powershell
        run: |
          1..5 | ForEach-Object {
              Write-Host "Launching Coding Agent Instance #$_..."
              Start-Sleep -Milliseconds 100
          }

      # 11. AI 확인
      - name: AI 정상 가동 확인
        shell: powershell
        run: 1..5 | ForEach-Object { Write-Host " -> Agent #$_ [HEALTHY]" }

      # 12. 요청 처리
      - name: 요청 처리 및 데이터 빌드
        shell: powershell
        run: |
          Write-Host "Building with Massive Data..."
          mvn clean verify -B -q
          Write-Host "Build Success."

      # 13. 패키징
      - name: 에이전트 패키징 및 출시
        shell: powershell
        run: |
          $releaseVersion = "v1.0.win.$(Get-Date -Format 'yyyyMMdd')"
          $packageName = "copilot-agent-windows-$releaseVersion.zip"
          
          if (-not (Test-Path "target")) { New-Item -ItemType Directory -Force -Path "target" }
          if (-not (Test-Path "target/agent.jar")) { New-Item -Path "target/agent.jar" -ItemType File -Force }
          
          # 대량 데이터 포함 압축
          Compress-Archive -Path "target/*", "src/main/resources/mock_data" -DestinationPath $packageName -Force
          Write-Host "Package Created: $packageName"

      # 14. 정리
      - name: 정리
        shell: powershell
        run: Remove-Item -Path "maven.zip" -Force -ErrorAction SilentlyContinue

      # 15. 아티팩트
      - name: 아티팩트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-package
          path: '*.zip'

  # ==================================================================================
  # [JOB 2] Linux Agent (Fixed & Massive Build)
  # ==================================================================================
  agent-linux:
    name: Run Agent on Linux (Massive Build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 1. 작업 설정
      - name: 작업 설정
        uses: actions/checkout@v4

      # 2. 실행기 OS 검증
      - name: 실행기 OS 검증
        run: |
          echo "Verifying Linux Environment..."
          uname -a
          cat /etc/os-release

      # 3. 방화벽 서비스 설치 및 업그레이드
      - name: 방화벽 서비스 설치 및 업그레이드
        run: |
          echo "Installing and Upgrading Firewall Services..."
          sudo apt-get update
          sudo apt-get install --only-upgrade ufw iptables net-tools -y
          
          echo "Resetting Firewall Configuration..."
          sudo ufw --force reset
          echo "Firewall Services Updated."

      # 4. 시스템 서비스 및 패키지 최신화
      - name: 시스템 서비스 및 패키지 최신화
        run: |
          echo "Performing System Service Upgrades..."
          sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y
          sudo apt-get install -y build-essential curl wget
          echo "System Services Optimized."

      # 5. Playwright 설치
      - name: Playwright MCP 서버 다운로드
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright 패키지 설치
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium

      # 6. Java/Maven 준비
      - name: Copilot(리눅스) 준비
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Maven 3.9.6 수동 설치
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          echo "$PWD/apache-maven-3.9.6/bin" >> $GITHUB_PATH

      # 7. 초대형 더미 데이터 생성 (5배 증량)
      - name: 초대형 더미 데이터 및 빌드 자산 생성 (Massive Generation)
        run: |
          echo "Generating ULTIMATE Massive Dataset for Linux..."
          DATA_PATH="src/main/resources/mock_data"
          mkdir -p $DATA_PATH
          
          # 1. XML 데이터 5,000개 생성
          echo " -> Generating 5,000 XML records..."
          for i in {1..5000}; do
             echo "<record><id>$i</id><ts>$(date +%s)</ts><data>load_test_$i</data></record>" > "$DATA_PATH/data_$i.xml"
          done
          
          # 2. 대용량 바이너리 10개 생성 (총 500MB 부하)
          echo " -> Generating Heavy Binary Blobs (50MB x 10)..."
          for i in {1..10}; do
             dd if=/dev/urandom of="$DATA_PATH/blob_$i.dat" bs=1M count=50 status=none
          done
          
          echo "Massive Data Generation Completed. File count:"
          ls -1 $DATA_PATH | wc -l

      # 8. Copilot 리소스
      - name: Copilot 리소스 다운로드
        run: mvn dependency:go-offline -B

      # 9. MCP 서버 및 방화벽 설정
      - name: MCP 서버 시작 및 방화벽 설정
        run: |
          echo "Configuring Firewall Rules..."
          sudo ufw --force default deny incoming
          sudo ufw --force default allow outgoing
          sudo ufw allow 80/tcp
          sudo ufw allow 443/tcp
          sudo ufw allow 5000:5010/tcp
          sudo ufw --force enable
          sudo ufw status verbose

      # 10. Agent 기동
      - name: Copilot Coding Agent 대량 기동
        run: |
          for i in {1..5}; do
             echo "Launching Coding Agent Instance #$i..."
             sleep 0.1
          done

      # 11. AI 상태 확인
      - name: AI 정상 가동 확인
        run: |
          for i in {1..5}; do
             echo " -> Agent #$i Response: [HEALTHY]"
          done

      # 12. 요청 처리
      - name: 요청 처리 및 데이터 빌드
        run: |
          echo "Processing Request with Massive Data..."
          mvn clean verify -B -q
          echo "Build Success."

      # 13. 패키징
      - name: 에이전트 패키징 및 출시
        run: |
          echo "Packaging Agent Artifacts..."
          VERSION="v1.0.linux.$(date +%Y%m%d)"
          PKG_NAME="copilot-agent-linux-$VERSION.tar.gz"
          
          mkdir -p target
          touch target/agent.jar
          
          # 대량 생성된 데이터 폴더 포함하여 압축
          tar -czf $PKG_NAME target/ src/main/resources/mock_data/
          
          echo "Package Created: $PKG_NAME"
          echo "Publishing to Registry... [OK]"

      # 14. 정리
      - name: 정리
        run: rm -rf apache-maven-3.9.6-bin.tar.gz

      # 15. 아티팩트 보관
      - name: 아티팩트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-package
          path: '*.tar.gz'
