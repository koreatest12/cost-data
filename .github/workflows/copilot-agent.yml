name: Cost Data Agent - Ultimate Service-Oriented Massive Edition

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==================================================================================
  # [JOB 1] Windows Agent (Multi-Service Data & Stable Build)
  # ==================================================================================
  agent-windows:
    name: Windows Service Agent (50k+ Records)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # 1. 작업 설정
      - name: 작업 설정
        uses: actions/checkout@v4

      # 2. 실행기 환경 검증
      - name: 실행기 및 보안 모듈 검증
        shell: powershell
        run: |
          Write-Host "Verifying Environment..."
          if (Get-Module -ListAvailable -Name NetSecurity) {
              Write-Host "NetSecurity Module [FOUND]."
          } else {
              Install-Module -Name NetSecurity -Force -AllowClobber -Scope CurrentUser
          }

      # 3. 보안 서비스 최적화
      - name: 보안 서비스 최적화
        shell: powershell
        run: |
          try { Update-MpSignature -ErrorAction SilentlyContinue } catch { }
          if ((Get-Service mpssvc).Status -eq 'Running') {
              Update-Help -Module NetSecurity -Force -ErrorAction SilentlyContinue
          }

      # 4. Java & Maven 설정
      - name: Java & Maven 환경 구성
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Maven 3.9.6 수동 설치
        shell: powershell
        run: |
          $url = "https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.zip"
          $output = "maven.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath .
          $mavenBin = "$(Get-Location)\apache-maven-3.9.6\bin"
          echo "$mavenBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 5. [핵심] 서비스별 데이터 디렉토리 생성
      - name: 서비스별 디렉토리 구성
        shell: powershell
        run: |
          $base = "src/main/resources/services"
          New-Item -ItemType Directory -Force -Path "$base/auth/users" | Out-Null
          New-Item -ItemType Directory -Force -Path "$base/auth/logs" | Out-Null
          New-Item -ItemType Directory -Force -Path "$base/payment/transactions" | Out-Null
          New-Item -ItemType Directory -Force -Path "$base/notification/emails" | Out-Null
          Write-Host "Service Directories Created: Auth, Payment, Notification"

      # 6. [대량 생성] 각 서비스별 데이터 50,000건 (StreamWriter 사용)
      - name: 서비스별 대량 데이터 생성 (50,000건)
        shell: powershell
        run: |
          Write-Host "Generating Multi-Service Data (50k Records)..."
          $base = "src/main/resources/services"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          
          # 1. 인증 서비스 (Auth Service) - 사용자 정보 및 로그인 로그
          $swUser = New-Object System.IO.StreamWriter("$base/auth/users/user_db.csv", $false, $utf8NoBom)
          $swLog  = New-Object System.IO.StreamWriter("$base/auth/logs/login_attempts.log", $false, $utf8NoBom)
          $swUser.WriteLine("USER_ID,USERNAME,ROLE,STATUS,LAST_LOGIN")
          
          # 2. 결제 서비스 (Payment Service) - 트랜잭션 기록
          $swTx = New-Object System.IO.StreamWriter("$base/payment/transactions/tx_history.csv", $false, $utf8NoBom)
          $swTx.WriteLine("TX_ID,USER_ID,AMOUNT,CURRENCY,STATUS,TS")
          
          # 3. 알림 서비스 (Notification Service) - 발송 로그
          $swNoti = New-Object System.IO.StreamWriter("$base/notification/emails/send_log.txt", $false, $utf8NoBom)
          
          # 통합 루프 (50,000건)
          1..50000 | ForEach-Object {
            $uid = $_
            $uuid = [guid]::NewGuid()
            
            # Auth Data Write
            $swUser.WriteLine("$uid,user_$uid,USER,ACTIVE,$(Get-Date -Format 'yyyy-MM-dd')")
            $swLog.WriteLine("[AUTH] User $uid login success at $(Get-Date)")
            
            # Payment Data Write (랜덤 결제 내역)
            if ($uid % 2 -eq 0) {
                $amount = Get-Random -Min 1000 -Max 50000
                $swTx.WriteLine("$uuid,$uid,$amount,KRW,COMPLETED,$(Get-Date)")
            }
            
            # Notification Data Write
            $swNoti.WriteLine("To: user_$uid@koreatest12.com | Subject: Welcome | Status: SENT")
            
            if ($uid % 10000 -eq 0) { Write-Host " -> Generated $uid / 50000 records across services..." }
          }
          
          $swUser.Close(); $swLog.Close(); $swTx.Close(); $swNoti.Close()
          Write-Host "Multi-Service Data Generation Completed."

      # 7. [대량 생성] Java 비즈니스 로직 동적 생성
      - name: 서비스별 처리 로직 동적 생성
        shell: powershell
        run: |
          Write-Host "Generating Dynamic Service Logic..."
          $sourcePath = "src/main/java/com/koreatest12/services"
          New-Item -ItemType Directory -Force -Path $sourcePath | Out-Null
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          
          1..200 | ForEach-Object {
            $className = "ServiceProcessor_$_"
            $code = "package com.koreatest12.services;`r`npublic class $className {`r`n  public void execute() { System.out.println(`"Processing Service $_`"); }`r`n}"
            $sw = New-Object System.IO.StreamWriter("$sourcePath/$className.java", $false, $utf8NoBom)
            $sw.Write($code)
            $sw.Close()
          }
          Write-Host "Service Logic Generated."

      # 8. Maven 빌드
      - name: 통합 빌드
        shell: powershell
        run: |
          mvn dependency:go-offline -B
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          
          Write-Host "Building Multi-Service Application..."
          mvn clean package -DskipTests -B -q
          Write-Host "Build Successful."

      # 9. 시뮬레이션
      - name: 서비스 처리 시뮬레이션
        shell: powershell
        run: |
          Write-Host "Simulating Service Processing..."
          $reportPath = "service_simulation_report.csv"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $swReport = New-Object System.IO.StreamWriter($reportPath, $false, $utf8NoBom)
          $swReport.WriteLine("SERVICE,TX_COUNT,STATUS,LATENCY_MS")
          
          # 가상의 서비스 처리 결과 리포팅
          $services = "AuthService", "PaymentService", "NotiService"
          foreach ($svc in $services) {
             1..100 | ForEach-Object {
                 $latency = Get-Random -Min 5 -Max 200
                 $swReport.WriteLine("$svc,$_,SUCCESS,$latency")
             }
          }
          $swReport.Close()
          Write-Host "Simulation Report Generated."

      # 10. 패키징 및 업로드
      - name: 통합 아티팩트 패키징
        shell: powershell
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $packageName = "korea-service-windows-$date.zip"
          if (-not (Test-Path "target")) { New-Item -ItemType Directory -Force -Path "target" }
          
          Compress-Archive -Path "target/*.jar", "src/main/resources/services", "src/main/java", "service_simulation_report.csv" -DestinationPath $packageName -Force
          Write-Host "Package Created: $packageName"

      - name: 정리 및 업로드
        shell: powershell
        run: Remove-Item -Path "maven.zip" -Force -ErrorAction SilentlyContinue
      
      - name: 결과물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-service-package
          path: '*.zip'

  # ==================================================================================
  # [JOB 2] Linux Agent (Python Optimized Multi-Service Gen)
  # ==================================================================================
  agent-linux:
    name: Linux Service Agent (50k+ Records)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 작업 설정
        uses: actions/checkout@v4

      - name: 시스템 최적화
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade ufw iptables net-tools -y
          sudo ufw --force reset

      - name: Java & Maven 준비
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Maven 3.9.6 설치
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          echo "$PWD/apache-maven-3.9.6/bin" >> $GITHUB_PATH

      # [Python 사용] 서비스별 대량 데이터 생성 (안정성 확보)
      - name: 서비스별 대량 데이터 생성 (Python)
        run: |
          echo "Generating Multi-Service Data using Python..."
          mkdir -p src/main/resources/services/{auth,payment,notification}
          
          python3 -c "
          import os, uuid, random, time

          base_dir = 'src/main/resources/services'
          total_records = 50000
          
          print(f'Starting generation of {total_records} records per service...')
          
          # 파일 핸들 열기
          with open(f'{base_dir}/auth/users.csv', 'w') as f_auth, \
               open(f'{base_dir}/payment/transactions.csv', 'w') as f_pay, \
               open(f'{base_dir}/notification/logs.txt', 'w') as f_noti:
               
               f_auth.write('UID,NAME,ROLE\n')
               f_pay.write('TX_ID,UID,AMOUNT\n')
               
               for i in range(1, total_records + 1):
                   # Auth Data
                   f_auth.write(f'{i},user_{i},USER\n')
                   
                   # Payment Data
                   if i % 2 == 0:
                       tx_id = str(uuid.uuid4())
                       amount = random.randint(1000, 100000)
                       f_pay.write(f'{tx_id},{i},{amount}\n')
                   
                   # Notification Data
                   f_noti.write(f'Email sent to user_{i}\n')
                   
                   if i % 10000 == 0:
                       print(f' -> Generated {i} records...')
                       
          print('All Service Data Generated Successfully.')
          "

      - name: 통합 빌드
        run: mvn clean package -DskipTests -B -q

      # [Python 사용] 처리 시뮬레이션 및 리포트
      - name: 서비스 처리 시뮬레이션
        run: |
          echo "Running Simulation..."
          python3 -c "
          import random, time
          
          report_file = 'linux_service_report.csv'
          services = ['Auth', 'Payment', 'Notification']
          
          with open(report_file, 'w') as f:
              f.write('TIMESTAMP,SERVICE,PROCESSED_ITEMS,STATUS\n')
              
              for svc in services:
                  print(f'Simulating {svc} Service...')
                  processed = 0
                  for _ in range(50): # 50 batches
                      batch_size = random.randint(500, 1000)
                      processed += batch_size
                      ts = int(time.time())
                      f.write(f'{ts},{svc},{batch_size},OK\n')
                  print(f' -> {svc} processed total {processed} items.')
          "

      - name: 패키징 및 업로드
        run: |
          VERSION="v1.0.svc.$(date +%Y%m%d)"
          PKG_NAME="korea-service-linux-$VERSION.tar.gz"
          mkdir -p target
          
          tar -czf $PKG_NAME target/*.jar src/main/resources/services/ linux_service_report.csv
          
          echo "Package Created: $PKG_NAME"

      - name: 결과물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-service-package
          path: '*.tar.gz'
