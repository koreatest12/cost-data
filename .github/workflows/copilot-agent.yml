name: Cost Data Agent - Ultimate Upload & Release Edition

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ==================================================================================
  # [JOB 1] Windows Agent (Full Finance Transaction Simulation)
  # ==================================================================================
  agent-windows:
    name: Windows Agent (Upload Release)
    runs-on: windows-latest
    steps:
      - name: 작업 설정
        uses: actions/checkout@v4

      # [캐시] Maven 의존성 캐싱 (빌드 속도 최적화)
      - name: Maven 의존성 캐싱 (Windows)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 실행기 및 보안 모듈 검증
        shell: powershell
        run: |
            if (Get-Module -ListAvailable -Name NetSecurity) { Write-Host "NetSecurity Found" } else { Install-Module -Name NetSecurity -Force -AllowClobber -Scope CurrentUser }
      
      - name: 보안 서비스 최적화
        shell: powershell
        run: try { Update-MpSignature -ErrorAction SilentlyContinue } catch { }

      - name: Java & Maven 환경 구성
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Maven 3.9.6 수동 설치
        shell: powershell
        run: |
          $url = "https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.zip"
          $output = "maven.zip"
          if (-not (Test-Path $output)) { Invoke-WebRequest -Uri $url -OutFile $output }
          Expand-Archive -Path $output -DestinationPath . -Force
          $mavenBin = "$(Get-Location)\apache-maven-3.9.6\bin"
          echo "$mavenBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 프로젝트 의존성 대량 설치 (Go Offline)
        shell: powershell
        run: |
          Write-Host "Downloading dependencies..."
          mvn dependency:go-offline -B

      # 1. 가상 계좌 생성
      - name: 가상 계좌 50만 건 생성
        shell: powershell
        run: |
          Write-Host "Generating 500,000 Virtual Account Records..."
          $basePath = "src/main/resources/services"
          $vaPath = "$basePath/virtual_accounts"
          New-Item -ItemType Directory -Force -Path $vaPath | Out-Null
          
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $swVA = New-Object System.IO.StreamWriter("$vaPath/va_master_db.csv", $false, $utf8NoBom)
          $swVA.WriteLine("VA_ID,BANK,ACCOUNT,OWNER,EMAIL,STATUS")
          1..500000 | ForEach-Object {
             $swVA.WriteLine("VA_$_,004,999$_,User_$_,user.$_@fintech.com,ACTIVE")
          }
          $swVA.Close()

      # 2. 펌뱅킹(예금주 검증)
      - name: 가상계좌 예금주 검증
        shell: powershell
        run: |
          Write-Host "Simulating Firm Banking Verification..."
          $vaPath = "src/main/resources/services/virtual_accounts"
          $sw = New-Object System.IO.StreamWriter("$vaPath/va_verification_result.csv", $false, (New-Object System.Text.UTF8Encoding $false))
          $sw.WriteLine("VA_ID,RESULT,MSG,TIME")
          1..500000 | ForEach-Object {
             $res = if ($_ % 100 -eq 0) { "FAIL" } else { "SUCCESS" }
             $sw.WriteLine("VA_$_, $res, CHECKED, $(Get-Date -Format 'yyyyMMddHHmmss')")
          }
          $sw.Close()

      # [신규] 3. 대량 입금(Deposit) 서비스 연동
      - name: 대량 입금 처리 (Deposit Service)
        shell: powershell
        run: |
          Write-Host "Processing 500,000 Deposit Transactions..."
          $depPath = "src/main/resources/services/deposit"
          New-Item -ItemType Directory -Force -Path $depPath | Out-Null
          
          $swDep = New-Object System.IO.StreamWriter("$depPath/deposit_trx_log.csv", $false, (New-Object System.Text.UTF8Encoding $false))
          $swDep.WriteLine("TX_ID,VA_ID,AMOUNT,SENDER,RESULT_CODE,TIMESTAMP")
          
          1..500000 | ForEach-Object {
             $amt = Get-Random -InputObject 10000, 30000, 50000, 100000
             $swDep.WriteLine("DEP_TX_$_, VA_$_, $amt, Sender_$_, 0000, $(Get-Date -Format 'yyyyMMddHHmmss')")
             if ($_ % 100000 -eq 0) { Write-Host " -> Deposit Processed: $_" }
          }
          $swDep.Close()
          Write-Host "Deposit Service Simulation Completed."

      # [신규] 4. 대량 출금(Withdrawal) 서비스 연동
      - name: 대량 출금 처리 (Withdrawal Service)
        shell: powershell
        run: |
          Write-Host "Processing 500,000 Withdrawal Transactions..."
          $wdPath = "src/main/resources/services/withdrawal"
          New-Item -ItemType Directory -Force -Path $wdPath | Out-Null
          
          $swWd = New-Object System.IO.StreamWriter("$wdPath/withdrawal_trx_log.csv", $false, (New-Object System.Text.UTF8Encoding $false))
          $swWd.WriteLine("TX_ID,VA_ID,AMOUNT,RECEIVER,RESULT_CODE,TIMESTAMP")
          
          1..500000 | ForEach-Object {
             $amt = Get-Random -InputObject 5000, 15000, 20000
             # 50건 중 1건 잔액 부족 시뮬레이션
             if ($_ % 50 -eq 0) { $code = "E001_INSUFFICIENT_FUNDS" } else { $code = "0000_SUCCESS" }
             
             $swWd.WriteLine("WD_TX_$_, VA_$_, $amt, Receiver_$_, $code, $(Get-Date -Format 'yyyyMMddHHmmss')")
             if ($_ % 100000 -eq 0) { Write-Host " -> Withdrawal Processed: $_" }
          }
          $swWd.Close()
          Write-Host "Withdrawal Service Simulation Completed."

      # 5. 마케팅 이메일 생성
      - name: 마케팅 이메일 100만 건 생성
        shell: powershell
        run: |
          $emailPath = "src/main/resources/services/marketing"
          New-Item -ItemType Directory -Force -Path $emailPath | Out-Null
          $swEmail = New-Object System.IO.StreamWriter("$emailPath/marketing_db.csv", $false, (New-Object System.Text.UTF8Encoding $false))
          $swEmail.WriteLine("EMAIL,STATUS")
          1..1000000 | ForEach-Object { $swEmail.WriteLine("customer.$_@market.com,SUBSCRIBED") }
          $swEmail.Close()

      # 6. 통합 빌드
      - name: 통합 빌드
        shell: powershell
        run: |
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          mvn clean package -DskipTests -B -q

      # 7. 리포트 및 패키징
      - name: 결과 리포트 및 패키징
        shell: powershell
        run: |
          $summaryFile = "FINAL_REPORT_WINDOWS.html"
          Set-Content -Path $summaryFile -Value "<html><body><h1>Windows Financial Report</h1><p>Deposit/Withdrawal Integrated.</p></body></html>"
          
          $packageName = "windows-release-$(Get-Date -Format 'yyyyMMdd').zip"
          if (-not (Test-Path "target")) { New-Item -ItemType Directory -Force -Path "target" }
          
          # [중요] services 폴더 내의 Deposit/Withdrawal 폴더까지 모두 포함됨
          Compress-Archive -Path "target/*.jar", "src/main/resources/services", $summaryFile -DestinationPath $packageName -Force

      - name: GitHub Release 업로드
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tagName = "v1.1.win.$(Get-Date -Format 'yyyyMMdd-HHmm')"
          $packageName = "windows-release-$(Get-Date -Format 'yyyyMMdd').zip"
          gh release create $tagName $packageName --title "Windows Finance Release" --notes "Included Deposit & Withdrawal Services." --repo koreatest12/cost-data

      - name: 결과물 업로드 (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-result-package
          path: '*.zip'

  # ==================================================================================
  # [JOB 2] Linux Agent (Full Finance Transaction Simulation)
  # ==================================================================================
  agent-linux:
    name: Linux Agent (Upload Release)
    runs-on: ubuntu-latest
    steps:
      - name: 작업 설정
        uses: actions/checkout@v4

      # [캐시] Maven 의존성 캐싱 (Linux)
      - name: Maven 의존성 캐싱 (Linux)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 시스템 최적화
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade ufw iptables net-tools -y
          sudo ufw --force reset

      - name: Java & Maven 준비
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Maven 3.9.6 설치
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          echo "$PWD/apache-maven-3.9.6/bin" >> $GITHUB_PATH

      - name: 프로젝트 의존성 대량 설치 (Go Offline)
        run: mvn dependency:go-offline -B

      # 1. Python 스크립트로 데이터 생성 (계좌, 검증, 입금, 출금, 마케팅)
      # 구문 오류 방지를 위해 하나의 블록에서 처리
      - name: 금융 데이터 대량 생성 및 처리 (Python)
        run: |
          mkdir -p src/main/resources/services/{virtual_accounts,deposit,withdrawal,marketing}
          
          python3 -c "
          import random
          import time
          from datetime import datetime

          # 1. 가상계좌 50만 건
          print('Generating 500k VA Records...')
          with open('src/main/resources/services/virtual_accounts/va.csv', 'w') as f:
              f.write('ID,BANK,ACC,EMAIL,STATUS\n')
              for i in range(500000):
                  f.write(f'VA_{i},004,999{i},user.{i}@mail.com,ACTIVE\n')

          # 2. 펌뱅킹 검증 결과
          print('Simulating Firm Banking...')
          with open('src/main/resources/services/virtual_accounts/va_verification.csv', 'w') as f:
              f.write('VA_ID,RESULT,TIME\n')
              for i in range(500000):
                  res = 'SUCCESS' if i % 100 != 0 else 'FAIL'
                  f.write(f'VA_{i},{res},{time.time()}\n')

          # 3. [신규] 대량 입금(Deposit) 50만 건
          print('Processing 500k Deposits...')
          with open('src/main/resources/services/deposit/deposit_log.csv', 'w') as f:
              f.write('TX_ID,VA_ID,AMOUNT,RESULT\n')
              for i in range(500000):
                  amt = random.choice([10000, 50000, 100000])
                  f.write(f'DEP_{i},VA_{i},{amt},0000\n')

          # 4. [신규] 대량 출금(Withdrawal) 50만 건
          print('Processing 500k Withdrawals...')
          with open('src/main/resources/services/withdrawal/withdrawal_log.csv', 'w') as f:
              f.write('TX_ID,VA_ID,AMOUNT,RESULT\n')
              for i in range(500000):
                  amt = random.choice([5000, 10000])
                  # 잔액 부족 시뮬레이션
                  res = 'E001' if i % 50 == 0 else '0000'
                  f.write(f'WD_{i},VA_{i},{amt},{res}\n')

          # 5. 마케팅 이메일 100만 건
          print('Generating 1M Emails...')
          with open('src/main/resources/services/marketing/email.csv', 'w') as f:
              f.write('EMAIL,OPT_IN\n')
              for i in range(1000000):
                  f.write(f'user_{i}@promo.com,YES\n')
          "

      - name: 통합 빌드
        run: mvn clean package -DskipTests -B -q

      - name: 리포트 생성
        run: |
          echo "<html><body><h1>Linux Finance Report</h1><p>Deposit/Withdrawal Completed.</p></body></html>" > FINAL_REPORT_LINUX.html
          
          # Job Summary 업데이트
          echo "## Linux Finance Integration Report" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Deposits | 500,000 |" >> $GITHUB_STEP_SUMMARY
          echo "| Withdrawals | 500,000 |" >> $GITHUB_STEP_SUMMARY

      - name: 패키징
        run: |
          PKG_NAME="linux-release-$(date +%Y%m%d).tar.gz"
          mkdir -p target
          # services 폴더 내의 deposit, withdrawal 폴더 자동 포함
          tar -czf $PKG_NAME target/*.jar src/main/resources/services/ FINAL_REPORT_LINUX.html

      - name: GitHub Release 업로드
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.1.linux.$(date +'%Y%m%d-%H%M')"
          PKG_NAME="linux-release-$(date +%Y%m%d).tar.gz"
          gh release create $TAG_NAME $PKG_NAME --title "Linux Finance Release" --notes "Included Deposit & Withdrawal Services." --repo koreatest12/cost-data

      - name: 결과물 업로드 (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-result-package
          path: '*.tar.gz'
