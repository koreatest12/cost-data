name: Cost Data Agent - Ultimate Service Patch & Massive Edition

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==================================================================================
  # [JOB 1] Windows Agent (Massive Data + Patch Operations)
  # ==================================================================================
  agent-windows:
    name: Windows Service Agent (Patch & Build)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # 1. 작업 설정
      - name: 작업 설정
        uses: actions/checkout@v4

      # 2. 실행기 및 보안 검증
      - name: 실행기 및 보안 모듈 검증
        shell: powershell
        run: |
          Write-Host "Verifying Environment..."
          if (Get-Module -ListAvailable -Name NetSecurity) {
              Write-Host "NetSecurity Module [FOUND]."
          } else {
              Install-Module -Name NetSecurity -Force -AllowClobber -Scope CurrentUser
          }

      # 3. 보안 서비스 최적화
      - name: 보안 서비스 최적화
        shell: powershell
        run: |
          try { Update-MpSignature -ErrorAction SilentlyContinue } catch { }
          if ((Get-Service mpssvc).Status -eq 'Running') {
              Update-Help -Module NetSecurity -Force -ErrorAction SilentlyContinue
          }

      # 4. Java & Maven 설정
      - name: Java & Maven 환경 구성
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Maven 3.9.6 수동 설치
        shell: powershell
        run: |
          $url = "https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.zip"
          $output = "maven.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath .
          $mavenBin = "$(Get-Location)\apache-maven-3.9.6\bin"
          echo "$mavenBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 5. [기반 데이터] 서비스별 디렉토리 및 데이터 생성 (50k)
      - name: 서비스별 대량 데이터 생성 (Base Data)
        shell: powershell
        run: |
          Write-Host "Generating Base Service Data..."
          $base = "src/main/resources/services"
          $dirs = "$base/auth/users", "$base/payment/tx", "$base/noti/logs", "$base/patches"
          foreach ($d in $dirs) { New-Item -ItemType Directory -Force -Path $d | Out-Null }
          
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          
          # 인증 사용자 20,000명
          $swUser = New-Object System.IO.StreamWriter("$base/auth/users/users.csv", $false, $utf8NoBom)
          $swUser.WriteLine("UID,NAME,STATUS")
          1..20000 | ForEach-Object { $swUser.WriteLine("$_,user_$_,ACTIVE") }
          $swUser.Close()
          
          # 결제 내역 20,000건
          $swTx = New-Object System.IO.StreamWriter("$base/payment/tx/transactions.csv", $false, $utf8NoBom)
          $swTx.WriteLine("TXID,AMOUNT,STATUS")
          1..20000 | ForEach-Object { $swTx.WriteLine("tx_$_,$(Get-Random -Min 100 -Max 9000),DONE") }
          $swTx.Close()
          
          Write-Host "Base Data Generation Completed."

      # 6. [신규 기능] 서비스별 패치(Patch) 파일 대량 생성
      - name: 서비스별 패치 파일 자동 생성 (Patch Generation)
        shell: powershell
        run: |
          Write-Host "Generating Service Patch Files..."
          $patchBase = "src/main/resources/services/patches"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          
          # 서비스 목록
          $services = "AuthService", "PaymentService", "NotiService"
          
          foreach ($svc in $services) {
              $svcPath = "$patchBase/$svc"
              New-Item -ItemType Directory -Force -Path $svcPath | Out-Null
              
              # 서비스당 500개의 패치 SQL/Script 생성
              1..500 | ForEach-Object {
                  $version = "v1.$_"
                  $patchFile = "$svcPath/patch_$version.sql"
                  $content = "-- PATCH for $svc $version`r`nALTER TABLE ${svc}_table ADD COLUMN patch_col_$_ VARCHAR(50);`r`nUPDATE ${svc}_config SET version='$version';"
                  
                  $sw = New-Object System.IO.StreamWriter($patchFile, $false, $utf8NoBom)
                  $sw.Write($content)
                  $sw.Close()
              }
          }
          Write-Host "Generated 1,500 Patch Files across services."

      # 7. [신규 기능] 패치 적용 시뮬레이션 및 로그 기록
      - name: 패치 적용 작업 시뮬레이션 (Patch Execution)
        shell: powershell
        run: |
          Write-Host "Simulating Patch Application..."
          $logPath = "patch_execution_report.log"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $swLog = New-Object System.IO.StreamWriter($logPath, $false, $utf8NoBom)
          
          $swLog.WriteLine("TIMESTAMP | SERVICE | PATCH_FILE | STATUS | DURATION_MS")
          
          $services = "AuthService", "PaymentService", "NotiService"
          foreach ($svc in $services) {
              Write-Host " -> Patching $svc..."
              1..500 | ForEach-Object {
                  $status = if ($_ % 50 -eq 0) { "SKIPPED (Already Applied)" } else { "APPLIED" }
                  $duration = Get-Random -Min 10 -Max 300
                  $swLog.WriteLine("$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') | $svc | patch_v1.$_.sql | $status | $duration")
              }
          }
          $swLog.Close()
          Write-Host "Patch Simulation Completed. Log: $logPath"

      # 8. Maven 빌드
      - name: 통합 빌드
        shell: powershell
        run: |
          mvn dependency:go-offline -B
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          
          Write-Host "Building Application with Patches..."
          mvn clean package -DskipTests -B -q
          Write-Host "Build Successful."

      # 9. 패키징 및 업로드
      - name: 통합 아티팩트 패키징
        shell: powershell
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $packageName = "korea-patch-windows-$date.zip"
          if (-not (Test-Path "target")) { New-Item -ItemType Directory -Force -Path "target" }
          
          # 패치 파일 및 로그 포함 압축
          Compress-Archive -Path "target/*.jar", "src/main/resources/services", "patch_execution_report.log" -DestinationPath $packageName -Force
          Write-Host "Package Created: $packageName"

      - name: 정리 및 업로드
        shell: powershell
        run: Remove-Item -Path "maven.zip" -Force -ErrorAction SilentlyContinue
      
      - name: 결과물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-patch-package
          path: '*.zip'

  # ==================================================================================
  # [JOB 2] Linux Agent (Python Optimized Patching)
  # ==================================================================================
  agent-linux:
    name: Linux Service Agent (Patch & Build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 작업 설정
        uses: actions/checkout@v4

      - name: 시스템 최적화
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade ufw iptables net-tools -y
          sudo ufw --force reset

      - name: Java & Maven 준비
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Maven 3.9.6 설치
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          echo "$PWD/apache-maven-3.9.6/bin" >> $GITHUB_PATH

      # [Python 사용] 서비스별 패치 데이터 생성 (안정성 확보)
      - name: 서비스별 패치 데이터 생성 (Python)
        run: |
          echo "Generating Patch Data using Python..."
          mkdir -p src/main/resources/services/{auth,payment,notification}/patches
          
          python3 -c "
          import os
          
          services = ['auth', 'payment', 'notification']
          base_dir = 'src/main/resources/services'
          
          for svc in services:
              print(f'Generating patches for {svc}...')
              patch_dir = f'{base_dir}/{svc}/patches'
              
              # 1,000개의 패치 파일 생성
              for i in range(1, 1001):
                  with open(f'{patch_dir}/update_v{i}.sh', 'w') as f:
                      f.write(f'#!/bin/bash\n# Patch {svc} v{i}\necho \"Updating {svc} to v{i}\"\n')
                      
          print('All Patch Files Generated.')
          "

      - name: 통합 빌드
        run: mvn clean package -DskipTests -B -q

      # [Python 사용] 패치 적용 및 롤백 시뮬레이션
      - name: 패치 적용 및 롤백 시뮬레이션
        run: |
          echo "Running Patch Simulation..."
          python3 -c "
          import random, time
          
          report_file = 'linux_patch_report.log'
          services = ['Auth', 'Payment', 'Notification']
          
          with open(report_file, 'w') as f:
              f.write('TIMESTAMP,SERVICE,ACTION,RESULT\n')
              
              for svc in services:
                  print(f'Patching {svc} Service...')
                  # 100개의 배포 작업 시뮬레이션
                  for i in range(1, 101):
                      ts = int(time.time())
                      
                      # 10% 확률로 패치 실패 및 롤백 시나리오
                      if random.random() < 0.1:
                          f.write(f'{ts},{svc},PATCH_v{i},FAILED\n')
                          f.write(f'{ts+1},{svc},ROLLBACK_v{i},SUCCESS\n')
                      else:
                          f.write(f'{ts},{svc},PATCH_v{i},SUCCESS\n')
                          
                  print(f' -> {svc} patching completed.')
          "

      - name: 패키징 및 업로드
        run: |
          VERSION="v1.0.patch.$(date +%Y%m%d)"
          PKG_NAME="korea-patch-linux-$VERSION.tar.gz"
          mkdir -p target
          
          tar -czf $PKG_NAME target/*.jar src/main/resources/services/ linux_patch_report.log
          
          echo "Package Created: $PKG_NAME"

      - name: 결과물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-patch-package
          path: '*.tar.gz'
