name: Cost Data Agent - Ultimate Upload & Release Edition

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ==================================================================================
  # [JOB 1] Windows Agent (1M Records + Release Upload + Finance Verification)
  # ==================================================================================
  agent-windows:
    name: Windows Agent (Upload Release)
    runs-on: windows-latest
    steps:
      # 1. 작업 설정
      - name: 작업 설정
        uses: actions/checkout@v4

      # 2. 실행기 및 보안 검증
      - name: 실행기 및 보안 모듈 검증
        shell: powershell
        run: |
          Write-Host "Verifying Environment..."
          if (Get-Module -ListAvailable -Name NetSecurity) {
              Write-Host "NetSecurity Module [FOUND]."
          } else {
              Install-Module -Name NetSecurity -Force -AllowClobber -Scope CurrentUser
          }

      # 3. 보안 서비스 최적화
      - name: 보안 서비스 최적화
        shell: powershell
        run: |
          try { Update-MpSignature -ErrorAction SilentlyContinue } catch { }
          if ((Get-Service mpssvc).Status -eq 'Running') {
              Update-Help -Module NetSecurity -Force -ErrorAction SilentlyContinue
          }

      # 4. Java & Maven 설정
      - name: Java & Maven 환경 구성
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Maven 3.9.6 수동 설치
        shell: powershell
        run: |
          $url = "https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.zip"
          $output = "maven.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath .
          $mavenBin = "$(Get-Location)\apache-maven-3.9.6\bin"
          echo "$mavenBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 5. [데이터 생성] 가상 계좌 50만 건
      - name: 가상 계좌 50만 건 생성
        shell: powershell
        run: |
          Write-Host "Generating 500,000 Virtual Account Records..."
          $vaPath = "src/main/resources/services/virtual_accounts"
          New-Item -ItemType Directory -Force -Path $vaPath | Out-Null
          
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $swVA = New-Object System.IO.StreamWriter("$vaPath/va_master_db.csv", $false, $utf8NoBom)
          $swVA.WriteLine("VA_ID,BANK,ACCOUNT,OWNER,EMAIL,STATUS")
          
          # 50만 건 루프
          1..500000 | ForEach-Object {
             $bank = Get-Random -InputObject "004", "088", "020"
             $acc = "999$(Get-Random -Min 10000000 -Max 99999999)"
             $email = "user.$_@fintech.com"
             $swVA.WriteLine("VA_$_, $bank, $acc, User_$_, $email, ACTIVE")
             
             if ($_ % 100000 -eq 0) { Write-Host " -> Generated $_ / 500,000 VA records..." }
          }
          $swVA.Close()
          Write-Host "VA Data Generated."

      # [신규 기능] 5-1. 자금 연동: 가상계좌 예금주 실명 조회 및 검증 (펌뱅킹 시뮬레이션)
      - name: 가상계좌 예금주 검증 및 등록 (Firm Banking)
        shell: powershell
        run: |
          Write-Host "Connecting to Mock Firm Banking Gateway..."
          $vaPath = "src/main/resources/services/virtual_accounts"
          $outputFile = "$vaPath/va_verification_result.csv"
          
          # 검증 결과 파일 헤더 생성
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $sw = New-Object System.IO.StreamWriter($outputFile, $false, $utf8NoBom)
          $sw.WriteLine("VA_ID,BANK_CODE,RESULT_CODE,MESSAGE,TIMESTAMP")
          
          Write-Host "Processing Batch Verification for 500,000 Records..."
          
          # 대량 처리를 위한 로직 (샘플링 시뮬레이션으로 속도 최적화)
          1..500000 | ForEach-Object {
             if ($_ % 10 -eq 0) { 
                # 10건 중 1건은 예금주 불일치 오류 시뮬레이션
                $resCode = "E004"
                $msg = "NAME_MISMATCH"
             } else {
                # 나머지는 정상 승인
                $resCode = "0000"
                $msg = "VERIFIED_SUCCESS"
             }
             
             $timestamp = (Get-Date).ToString("yyyyMMddHHmmss")
             $sw.WriteLine("VA_$_,004,$resCode,$msg,$timestamp")
             
             if ($_ % 100000 -eq 0) { Write-Host " -> Verified $_ accounts via Banking Network..." }
          }
          
          $sw.Close()
          Write-Host "Firm Banking Verification Completed."

      # 6. [데이터 생성] 마케팅 이메일 100만 건
      - name: 마케팅 이메일 100만 건 생성
        shell: powershell
        run: |
          Write-Host "Generating 1,000,000 Marketing Emails..."
          $emailPath = "src/main/resources/services/marketing"
          New-Item -ItemType Directory -Force -Path $emailPath | Out-Null
          
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $swEmail = New-Object System.IO.StreamWriter("$emailPath/marketing_db.csv", $false, $utf8NoBom)
          $swEmail.WriteLine("EMAIL,STATUS,LAST_SENT")
          
          1..1000000 | ForEach-Object {
             $swEmail.WriteLine("customer.$_@market.com,SUBSCRIBED,$(Get-Date -Format 'yyyy-MM-dd')")
             if ($_ % 200000 -eq 0) { Write-Host " -> Generated $_ / 1,000,000 emails..." }
          }
          $swEmail.Close()
          Write-Host "Marketing Email DB Generated."

      # 7. [시뮬레이션] 처리 결과 로그 생성
      - name: 통합 처리 시뮬레이션
        shell: powershell
        run: |
          Write-Host "Simulating Massive Transactions..."
          $logPath = "simulation_results.log"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $swLog = New-Object System.IO.StreamWriter($logPath, $false, $utf8NoBom)
          $swLog.WriteLine("TIMESTAMP | TYPE | ID | RESULT")
          
          1..10000 | ForEach-Object { $swLog.WriteLine("$(Get-Date) | DEPOSIT | VA_$_ | SUCCESS") }
          1..20000 | ForEach-Object { $swLog.WriteLine("$(Get-Date) | EMAIL_SEND | customer.$_ | SENT") }
          
          $swLog.Close()
          Write-Host "Simulation Completed."

      # 8. Maven 빌드
      - name: 통합 빌드
        shell: powershell
        run: |
          mvn dependency:go-offline -B
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          mvn clean package -DskipTests -B -q

      # 9. GitHub 요약 보고서
      - name: 실행 결과 요약 보고서 생성
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          $summaryContent = @(
              "## Windows Agent Upload Report",
              "",
              "| Category | Count | Status |",
              "|---|---|---|",
              "| Virtual Accounts | 500,000 | Created |",
              "| Firm Banking Verification | 500,000 | Verified (Mock) |",
              "| Marketing Emails | 1,000,000 | Created |",
              "| Build | Success | Ready to Upload |"
          )
          $summaryContent | Out-File -FilePath $summaryFile -Encoding utf8 -Append

      # 10. 통합 결과 이메일 생성
      - name: 통합 결과 리포트 파일 생성
        shell: powershell
        run: |
          $reportFile = "FINAL_REPORT_WINDOWS.html"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $sw = New-Object System.IO.StreamWriter($reportFile, $false, $utf8NoBom)
          $sw.WriteLine("<html><body><h1>Windows Release Report</h1><p>Data Upload Ready with Finance Verification.</p></body></html>")
          $sw.Close()

      # 11. 패키징
      - name: 통합 아티팩트 패키징
        shell: powershell
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $packageName = "windows-release-$date.zip"
          if (-not (Test-Path "target")) { New-Item -ItemType Directory -Force -Path "target" }
          
          # [자금 연동 반영] services 폴더 내의 검증 결과 파일도 함께 압축됨
          Compress-Archive -Path "target/*.jar", "src/main/resources/services", "simulation_results.log", "FINAL_REPORT_WINDOWS.html" -DestinationPath $packageName -Force
          Write-Host "Package Created: $packageName"

      # 12. GitHub Release에 업로드
      - name: GitHub Release 업로드 (Upload to koreatest12/cost-data)
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $date = Get-Date -Format 'yyyyMMdd-HHmm'
          $tagName = "v1.0.win.$date"
          $packageName = "windows-release-$(Get-Date -Format 'yyyyMMdd').zip"
          
          Write-Host "Creating Release $tagName and Uploading Artifact..."
          
          gh release create $tagName $packageName --title "Windows Release $date" --notes "Automated massive data build with Finance Verification." --repo koreatest12/cost-data
          
          Write-Host "Upload Successful."

      - name: 정리 및 업로드 (Artifact)
        shell: powershell
        run: Remove-Item -Path "maven.zip" -Force -ErrorAction SilentlyContinue
      
      - name: 결과물 업로드 (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-result-package
          path: '*.zip'

  # ==================================================================================
  # [JOB 2] Linux Agent (Python Reporting + Deposit Notification + Release Upload)
  # ==================================================================================
  agent-linux:
    name: Linux Agent (Upload Release)
    runs-on: ubuntu-latest
    steps:
      - name: 작업 설정
        uses: actions/checkout@v4

      - name: 시스템 최적화
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade ufw iptables net-tools -y
          sudo ufw --force reset

      - name: Java & Maven 준비
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Maven 3.9.6 설치
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          echo "$PWD/apache-maven-3.9.6/bin" >> $GITHUB_PATH

      # [Python] 데이터 대량 생성
      - name: 대량 데이터 생성 (Python)
        run: |
          echo "Generating Massive Data..."
          mkdir -p src/main/resources/services/{virtual_accounts,marketing}
          
          python3 -c "
          # 1. 500k VA Data
          with open('src/main/resources/services/virtual_accounts/va.csv', 'w') as f:
              f.write('ID,BANK,ACC,EMAIL,STATUS\n')
              for i in range(500000):
                  f.write(f'VA_{i},004,999{i},user.{i}@mail.com,ACTIVE\n')
          
          # 2. 1M Marketing Data
          with open('src/main/resources/services/marketing/email.csv', 'w') as f:
              f.write('EMAIL,OPT_IN\n')
              for i in range(1000000):
                  f.write(f'cust_{i}@promo.com,YES\n')
          "

      # [신규 기능] 자금 연동: 입금 통보(Webhook) 대량 처리 테스트
      - name: 입금 통보(Webhook) 대량 처리 테스트
        run: |
          echo "Starting Deposit Notification Simulation..."
          
          python3 -c "
          import random
          import json
          import time
          from datetime import datetime

          # 입금 로그 파일 생성
          report_file = 'src/main/resources/services/finance_reconciliation.csv'
          
          print(f'Simulating Bank Webhook Calls -> {report_file}')
          
          success_count = 0
          fail_count = 0
          
          # 10만 건의 입금 이벤트 발생 시뮬레이션
          with open(report_file, 'w') as f:
              f.write('TX_ID,VA_NUMBER,AMOUNT,STATUS,BANK_RES_TIME\n')
              
              for i in range(100000):
                  # 랜덤 입금 데이터 생성
                  tx_id = f'TX_{datetime.now().strftime(f\"%Y%m%d\")}{i:06d}'
                  amount = random.choice([10000, 30000, 50000, 100000])
                  va_num = f'999{i:08d}'
                  
                  # 95% 성공, 5% 실패(금액 상이 등) 시뮬레이션
                  if random.random() > 0.05:
                      status = 'MATCHED'
                      success_count += 1
                  else:
                      status = 'AMOUNT_MISMATCH'
                      fail_count += 1
                  
                  f.write(f'{tx_id},{va_num},{amount},{status},{time.time()}\n')
                  
                  if i % 20000 == 0:
                      print(f' -> Processed {i} deposit notifications...')

          print(f'Deposit Simulation Finished: Success={success_count}, Fail={fail_count}')
          "

      - name: 통합 빌드
        run: mvn clean package -DskipTests -B -q

      # [Python] 시뮬레이션 및 리포트
      - name: 시뮬레이션 및 리포트 생성
        run: |
          python3 -c "
          import time
          with open('linux_simulation.log', 'w') as f:
              f.write('TS,ACTION,RESULT\n')
              for i in range(10000):
                  f.write(f'{time.time()},PROCESS_TX_{i},SUCCESS\n')
          
          with open('FINAL_REPORT_LINUX.html', 'w') as f:
              f.write('<html><body><h1>Linux Report</h1><p>Ready to Upload with Deposit Simulation</p></body></html>')
          "

      - name: 실행 결과 요약 보고서 생성 (Job Summary)
        run: |
          echo "## Linux Agent Upload Report" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Data Count | 1,500,000 |" >> $GITHUB_STEP_SUMMARY
          echo "| Deposit Simulation | 100,000 TXs |" >> $GITHUB_STEP_SUMMARY
          echo "| Upload Target | koreatest12/cost-data |" >> $GITHUB_STEP_SUMMARY

      - name: 패키징
        run: |
          VERSION="v1.0.rpt.$(date +%Y%m%d)"
          PKG_NAME="linux-release-$(date +%Y%m%d).tar.gz"
          mkdir -p target
          
          # [자금 연동 반영] services 폴더 내의 입금 내역(finance_reconciliation.csv)도 함께 압축됨
          tar -czf $PKG_NAME target/*.jar src/main/resources/services/ linux_simulation.log FINAL_REPORT_LINUX.html
          
          echo "Package Created: $PKG_NAME"

      # GitHub Release에 업로드
      - name: GitHub Release 업로드 (Upload to koreatest12/cost-data)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          TAG_NAME="v1.0.linux.$DATE"
          PKG_NAME="linux-release-$(date +%Y%m%d).tar.gz"
          
          echo "Creating Release $TAG_NAME and Uploading..."
          
          gh release create $TAG_NAME $PKG_NAME --title "Linux Release $DATE" --notes "Automated massive data build with Finance Verification." --repo koreatest12/cost-data
          
          echo "Upload Successful."

      - name: 결과물 업로드 (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-result-package
          path: '*.tar.gz'
