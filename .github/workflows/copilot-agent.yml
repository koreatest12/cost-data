name: Copilot Agent - Complete Run
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-windows:
    name: Run Agent on Windows
    runs-on: windows-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure Windows Firewall
        shell: powershell
        run: |
          Write-Host "Configuring Windows Firewall - No Skip"
          
          # Enable Windows Firewall for all profiles
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          
          # Add firewall rules for HTTP
          New-NetFirewallRule -DisplayName "Allow HTTP Inbound" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 80 `
            -Action Allow `
            -ErrorAction SilentlyContinue
          
          # Add firewall rules for HTTPS
          New-NetFirewallRule -DisplayName "Allow HTTPS Inbound" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 443 `
            -Action Allow `
            -ErrorAction SilentlyContinue
          
          # Add firewall rules for SSH
          New-NetFirewallRule -DisplayName "Allow SSH Inbound" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 22 `
            -Action Allow `
            -ErrorAction SilentlyContinue
          
          Write-Host "Firewall rules configured successfully"
          
      - name: Verify Windows Firewall Status
        shell: powershell
        run: |
          Write-Host "Verifying Windows Firewall Status"
          Get-NetFirewallProfile | Select-Object Name, Enabled
          
          Write-Host "Checking configured rules"
          Get-NetFirewallRule -DisplayName "Allow HTTP*" | Select-Object DisplayName, Enabled, Direction
          Get-NetFirewallRule -DisplayName "Allow HTTPS*" | Select-Object DisplayName, Enabled, Direction
          Get-NetFirewallRule -DisplayName "Allow SSH*" | Select-Object DisplayName, Enabled, Direction
          
      - name: Run Windows-specific checks
        shell: powershell
        run: |
          Write-Host "Running Windows-specific checks - No Skip"
          
          # Check Windows Defender status
          Write-Host "Windows Defender Status:"
          Get-MpComputerStatus | Select-Object AntivirusEnabled, RealTimeProtectionEnabled
          
          # Check system information
          Write-Host "System Information:"
          Get-ComputerInfo | Select-Object WindowsVersion, OsArchitecture
          
          Write-Host "All Windows checks completed successfully"
          
      - name: Agent execution summary
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "Agent Execution Summary (Windows)"
          Write-Host "================================"
          Write-Host "Firewall Configuration: COMPLETED"
          Write-Host "Windows Checks: COMPLETED"
          Write-Host "Skip Status: NONE (All tasks executed)"
          Write-Host "================================"

  agent-linux:
    name: Run Agent on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure Linux Firewall (UFW)
        run: |
          echo "Configuring Linux Firewall (UFW) - No Skip"
          
          # Install UFW if not present
          sudo apt-get update
          sudo apt-get install -y ufw
          
          # Enable UFW
          sudo ufw --force enable
          
          # Configure firewall rules
          sudo ufw allow 80/tcp comment 'Allow HTTP'
          sudo ufw allow 443/tcp comment 'Allow HTTPS'
          sudo ufw allow 22/tcp comment 'Allow SSH'
          
          echo "Firewall rules configured successfully"
          
      - name: Verify Linux Firewall Status
        run: |
          echo "Verifying Linux Firewall Status"
          sudo ufw status verbose
          
      - name: Configure iptables rules
        run: |
          echo "Configuring iptables rules - No Skip"
          
          # Show current rules
          echo "Current iptables rules:"
          sudo iptables -L -n -v
          
          # Ensure basic rules are in place
          sudo iptables -A INPUT -p tcp --dport 80 -j ACCEPT -m comment --comment "Allow HTTP"
          sudo iptables -A INPUT -p tcp --dport 443 -j ACCEPT -m comment --comment "Allow HTTPS"
          sudo iptables -A INPUT -p tcp --dport 22 -j ACCEPT -m comment --comment "Allow SSH"
          
          echo "iptables rules configured successfully"
          
      - name: Run Linux-specific checks
        run: |
          echo "Running Linux-specific checks - No Skip"
          
          # Check system information
          echo "System Information:"
          uname -a
          lsb_release -a || cat /etc/os-release
          
          # Check network configuration
          echo "Network Configuration:"
          ip addr show
          
          echo "All Linux checks completed successfully"
          
      - name: Agent execution summary
        run: |
          echo "================================"
          echo "Agent Execution Summary (Linux)"
          echo "================================"
          echo "Firewall Configuration: COMPLETED"
          echo "Linux Checks: COMPLETED"
          echo "Skip Status: NONE (All tasks executed)"
          echo "================================"

  agent-validation:
    name: Validate Agent Configuration
    runs-on: ubuntu-latest
    needs: [agent-windows, agent-linux]
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Validate agent configuration
        run: |
          echo "Validating agent configuration file"
          
          if [ -f ".github/copilot/agent-config.yml" ]; then
            echo "✓ Agent configuration file found"
            cat .github/copilot/agent-config.yml
            
            # Check skip settings
            if grep -q "skip_firewall: false" .github/copilot/agent-config.yml && \
               grep -q "skip_windows: false" .github/copilot/agent-config.yml; then
              echo "✓ Skip settings are correctly configured (no skipping)"
            else
              echo "✗ Skip settings not found or incorrect"
              exit 1
            fi
          else
            echo "✗ Agent configuration file not found"
            exit 1
          fi
          
      - name: Final validation summary
        run: |
          echo "================================"
          echo "Complete Agent Validation Summary"
          echo "================================"
          echo "Windows Agent: PASSED"
          echo "Linux Agent: PASSED"
          echo "Firewall Config: NO SKIP"
          echo "Windows Config: NO SKIP"
          echo "All checks: COMPLETED"
          echo "================================"
          echo "✓ Agent is configured to run completely without skipping any components"
