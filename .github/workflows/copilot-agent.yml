name: Cost Data Agent - Ultimate Visibility & Reporting Edition

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==================================================================================
  # [JOB 1] Windows Agent (Massive Data + Visual Job Summary)
  # ==================================================================================
  agent-windows:
    name: Windows Agent (Report & Visual Summary)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # 1. 작업 설정
      - name: 작업 설정
        uses: actions/checkout@v4

      # 2. 실행기 및 보안 검증
      - name: 실행기 및 보안 모듈 검증
        shell: powershell
        run: |
          Write-Host "Verifying Environment..."
          if (Get-Module -ListAvailable -Name NetSecurity) {
              Write-Host "NetSecurity Module [FOUND]."
          } else {
              Install-Module -Name NetSecurity -Force -AllowClobber -Scope CurrentUser
          }

      # 3. 보안 서비스 최적화
      - name: 보안 서비스 최적화
        shell: powershell
        run: |
          try { Update-MpSignature -ErrorAction SilentlyContinue } catch { }
          if ((Get-Service mpssvc).Status -eq 'Running') {
              Update-Help -Module NetSecurity -Force -ErrorAction SilentlyContinue
          }

      # 4. Java & Maven 설정
      - name: Java & Maven 환경 구성
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Maven 3.9.6 수동 설치
        shell: powershell
        run: |
          $url = "https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.zip"
          $output = "maven.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath .
          $mavenBin = "$(Get-Location)\apache-maven-3.9.6\bin"
          echo "$mavenBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 5. [데이터 생성] 가상 계좌 + 이메일 30만 건
      - name: 가상 계좌 및 이메일 30만 건 생성
        shell: powershell
        run: |
          Write-Host "Generating 300,000 Virtual Account Records..."
          $vaPath = "src/main/resources/services/virtual_accounts"
          New-Item -ItemType Directory -Force -Path $vaPath | Out-Null
          
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $swVA = New-Object System.IO.StreamWriter("$vaPath/va_master_db.csv", $false, $utf8NoBom)
          $swVA.WriteLine("VA_ID,BANK,ACCOUNT,OWNER,EMAIL,STATUS")
          
          1..300000 | ForEach-Object {
             $bank = Get-Random -InputObject "004", "088", "020"
             $acc = "999$(Get-Random -Min 10000000 -Max 99999999)"
             $email = "user.$_@fintech.com"
             $swVA.WriteLine("VA_$_, $bank, $acc, User_$_, $email, ACTIVE")
             
             if ($_ % 50000 -eq 0) { Write-Host " -> Generated $_ / 300,000..." }
          }
          $swVA.Close()
          Write-Host "VA Data Generated."

      # 6. [데이터 생성] 마케팅 이메일 50만 건
      - name: 마케팅 이메일 50만 건 생성
        shell: powershell
        run: |
          Write-Host "Generating 500,000 Marketing Emails..."
          $emailPath = "src/main/resources/services/marketing"
          New-Item -ItemType Directory -Force -Path $emailPath | Out-Null
          
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $swEmail = New-Object System.IO.StreamWriter("$emailPath/marketing_db.csv", $false, $utf8NoBom)
          $swEmail.WriteLine("EMAIL,STATUS,LAST_SENT")
          
          1..500000 | ForEach-Object {
             $swEmail.WriteLine("customer.$_@market.com,SUBSCRIBED,$(Get-Date -Format 'yyyy-MM-dd')")
             if ($_ % 100000 -eq 0) { Write-Host " -> Generated $_ / 500,000..." }
          }
          $swEmail.Close()
          Write-Host "Marketing Email DB Generated."

      # 7. [시뮬레이션] 처리 결과 로그 생성
      - name: 통합 처리 시뮬레이션
        shell: powershell
        run: |
          Write-Host "Simulating Transactions..."
          $logPath = "simulation_results.log"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $swLog = New-Object System.IO.StreamWriter($logPath, $false, $utf8NoBom)
          $swLog.WriteLine("TIMESTAMP | TYPE | ID | RESULT")
          
          # 입금 2000건, 이메일 발송 3000건
          1..2000 | ForEach-Object { $swLog.WriteLine("$(Get-Date) | DEPOSIT | VA_$_ | SUCCESS") }
          1..3000 | ForEach-Object { $swLog.WriteLine("$(Get-Date) | EMAIL_SEND | customer.$_ | SENT") }
          
          $swLog.Close()
          Write-Host "Simulation Completed."

      # 8. Maven 빌드
      - name: 통합 빌드
        shell: powershell
        run: |
          mvn dependency:go-offline -B
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          mvn clean package -DskipTests -B -q

      # 9. [신규 기능] GitHub 요약 보고서 (Job Summary) 생성 - 화면에 바로 출력
      - name: 실행 결과 요약 보고서 생성 (Job Summary)
        shell: powershell
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          
          # 마크다운 형식으로 요약 작성
          Add-Content -Path $summaryFile -Value "## 🚀 Windows Agent Execution Report"
          Add-Content -Path $summaryFile -Value ""
          Add-Content -Path $summaryFile -Value "| Category | Count | Status |"
          Add-Content -Path $summaryFile -Value "|---|---|---|"
          Add-Content -Path $summaryFile -Value "| **Virtual Accounts** | 300,000 | ✅ Created |"
          Add-Content -Path $summaryFile -Value "| **Marketing Emails** | 500,000 | ✅ Created |"
          Add-Content -Path $summaryFile -Value "| **Deposits Processed** | 2,000 | ✅ Simulated |"
          Add-Content -Path $summaryFile -Value "| **Emails Sent** | 3,000 | ✅ Simulated |"
          Add-Content -Path $summaryFile -Value "| **Maven Build** | Build Success | ✅ Completed |"
          Add-Content -Path $summaryFile -Value ""
          Add-Content -Path $summaryFile -Value "### 📊 System Performance"
          Add-Content -Path $summaryFile -Value "- **OS:** Windows Server 2022"
          Add-Content -Path $summaryFile -Value "- **Java:** Temurin 17"
          Add-Content -Path $summaryFile -Value "- **Timestamp:** $(Get-Date)"
          
          Write-Host "Job Summary Updated."

      # 10. 통합 결과 이메일 생성
      - name: 통합 결과 이메일 생성 및 전송 시뮬레이션
        shell: powershell
        run: |
          $reportFile = "FINAL_EXECUTION_REPORT_EMAIL.html"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $sw = New-Object System.IO.StreamWriter($reportFile, $false, $utf8NoBom)
          
          $sw.WriteLine("<html><body><h1>[Windows] Execution Report</h1><ul><li>Status: Success</li><li>Data: 800k Records</li></ul></body></html>")
          $sw.Close()
          
          Write-Host "Email Content Generated."

      # 11. 패키징 및 업로드
      - name: 통합 아티팩트 패키징
        shell: powershell
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $packageName = "windows-result-package-$date.zip"
          if (-not (Test-Path "target")) { New-Item -ItemType Directory -Force -Path "target" }
          
          Compress-Archive -Path "target/*.jar", "src/main/resources/services", "simulation_results.log", "FINAL_EXECUTION_REPORT_EMAIL.html" -DestinationPath $packageName -Force
          Write-Host "Package Created: $packageName"

      - name: 정리 및 업로드
        shell: powershell
        run: Remove-Item -Path "maven.zip" -Force -ErrorAction SilentlyContinue
      
      - name: 결과물 업로드 (화면 표시용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-result-package
          path: '*.zip'

  # ==================================================================================
  # [JOB 2] Linux Agent (Python Reporting & Visual Summary)
  # ==================================================================================
  agent-linux:
    name: Linux Agent (Report & Visual Summary)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 작업 설정
        uses: actions/checkout@v4

      - name: 시스템 최적화
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade ufw iptables net-tools -y
          sudo ufw --force reset

      - name: Java & Maven 준비
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Maven 3.9.6 설치
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          echo "$PWD/apache-maven-3.9.6/bin" >> $GITHUB_PATH

      # [Python] 데이터 대량 생성
      - name: 대량 데이터 생성 (Python)
        run: |
          echo "Generating Massive Data..."
          mkdir -p src/main/resources/services/{virtual_accounts,marketing}
          
          python3 -c "
          # 1. 300k VA Data
          with open('src/main/resources/services/virtual_accounts/va.csv', 'w') as f:
              f.write('ID,BANK,ACC,EMAIL,STATUS\n')
              for i in range(300000):
                  f.write(f'VA_{i},004,999{i},user.{i}@mail.com,ACTIVE\n')
          
          # 2. 500k Marketing Data
          with open('src/main/resources/services/marketing/email.csv', 'w') as f:
              f.write('EMAIL,OPT_IN\n')
              for i in range(500000):
                  f.write(f'cust_{i}@promo.com,YES\n')
          "

      - name: 통합 빌드
        run: mvn clean package -DskipTests -B -q

      # [Python] 시뮬레이션 및 이메일 리포트 생성
      - name: 시뮬레이션 및 이메일 리포트 생성
        run: |
          python3 -c "
          import time
          
          # 시뮬레이션 로그
          with open('linux_simulation.log', 'w') as f:
              f.write('TS,ACTION,RESULT\n')
              for i in range(5000):
                  f.write(f'{time.time()},PROCESS_TX_{i},SUCCESS\n')
          
          # HTML 이메일 리포트
          with open('FINAL_REPORT_EMAIL.html', 'w') as f:
              f.write('<html><body><h1>Linux Report</h1><p>Success</p></body></html>')
          "

      # [신규 기능] GitHub 요약 보고서 (Job Summary) 생성 - 화면에 바로 출력
      - name: 실행 결과 요약 보고서 생성 (Job Summary)
        run: |
          echo "## 🐧 Linux Agent Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Virtual Accounts** | 300,000 | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| **Marketing DB** | 500,000 | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| **Simulation Tx** | 5,000 | ✅ Processed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Artifacts** | Included | ✅ Ready |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📧 Email Notification Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Recipient:** team@koreatest12.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Sent (Simulated)" >> $GITHUB_STEP_SUMMARY

      - name: 패키징 및 업로드
        run: |
          VERSION="v1.0.rpt.$(date +%Y%m%d)"
          PKG_NAME="linux-result-package-$VERSION.tar.gz"
          mkdir -p target
          
          tar -czf $PKG_NAME target/*.jar src/main/resources/services/ linux_simulation.log FINAL_REPORT_EMAIL.html
          
          echo "Package Created: $PKG_NAME"

      - name: 결과물 업로드 (화면 표시용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-result-package
          path: '*.tar.gz'
