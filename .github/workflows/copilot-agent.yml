name: Cost Data Agent - Ultimate Simulation & Massive Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==================================================================================
  # [JOB 1] Windows Agent (Gen -> Build -> Simulate -> Package)
  # ==================================================================================
  agent-windows:
    name: Windows Agent (Simulation & Build)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # 1. 작업 설정
      - name: 작업 설정 (Job Setup)
        uses: actions/checkout@v4

      # 2. 실행기 및 보안 모듈 검증
      - name: 실행기 및 보안 모듈 검증
        shell: powershell
        run: |
          Write-Host "Verifying Environment..."
          Get-ComputerInfo | Select-Object WindowsVersion, OsArchitecture
          if (Get-Module -ListAvailable -Name NetSecurity) {
              Write-Host "NetSecurity Module [FOUND]."
          } else {
              Install-Module -Name NetSecurity -Force -AllowClobber -Scope CurrentUser
          }

      # 3. 보안 서비스 최적화
      - name: 보안 서비스 최적화
        shell: powershell
        run: |
          try { Update-MpSignature -ErrorAction SilentlyContinue } catch { }
          if ((Get-Service mpssvc).Status -eq 'Running') {
              Update-Help -Module NetSecurity -Force -ErrorAction SilentlyContinue
          }

      # 4. Java 17 & Maven 설정
      - name: Java & Maven 환경 구성
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Maven 3.9.6 수동 설치
        shell: powershell
        run: |
          $url = "https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.zip"
          $output = "maven.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath .
          $mavenBin = "$(Get-Location)\apache-maven-3.9.6\bin"
          echo "$mavenBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 5. [데이터 생성] 계정 정보 10,000건 (BOM 제거)
      - name: 계정 정보 대량 생성 (Massive Accounts)
        shell: powershell
        run: |
          Write-Host "Generating 10,000 User Account Records..."
          $accPath = "src/main/resources/accounts"
          New-Item -ItemType Directory -Force -Path $accPath | Out-Null
          
          # [중요] BOM 없는 UTF-8 인코딩 객체
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          
          1..10000 | ForEach-Object {
            $uuid = [guid]::NewGuid()
            $role = if ($_ % 10 -eq 0) { "ADMIN" } else { "USER" }
            $json = "{ 'user_id': $_, 'uuid': '$uuid', 'username': 'user_$_', 'email': 'user_$_@koreatest12.com', 'role': '$role', 'status': 'ACTIVE' }"
            [System.IO.File]::WriteAllText("$accPath/user_$_.json", $json, $utf8NoBom)
          }
          Write-Host "Account Data Generation Completed (Clean UTF-8)."

      # 6. [데이터 생성] Spring Boot 리소스
      - name: Spring Boot 리소스 대량 생성
        shell: powershell
        run: |
          Write-Host "Generating Massive Spring Boot Resources..."
          $configPath = "src/main/resources/config"
          New-Item -ItemType Directory -Force -Path $configPath | Out-Null
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          
          1..500 | ForEach-Object {
            $prop = "server.port=80$_\nspring.application.name=service-$_\nlogging.level.root=INFO"
            [System.IO.File]::WriteAllText("$configPath/application-tenant-$_.properties", $prop, $utf8NoBom)
          }
          
          # 정적 자산 생성
          1..5 | ForEach-Object {
            fsutil file createnew "$configPath/asset_blob_$_.dat" 52428800
          }
          Write-Host "Spring Boot Resources Ready."

      # 7. [데이터 생성] Java 비즈니스 로직 (BOM 제거 필수)
      - name: 비즈니스 로직 동적 생성 (Java Source)
        shell: powershell
        run: |
          Write-Host "Generating Dynamic Java Business Logic (No BOM)..."
          $sourcePath = "src/main/java/com/koreatest12/dynamic"
          New-Item -ItemType Directory -Force -Path $sourcePath | Out-Null
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          
          1..500 | ForEach-Object {
            $className = "UserProcessingService_$_"
            $codeLines = @(
                "package com.koreatest12.dynamic;",
                "import java.util.UUID;",
                "public class $className {",
                "    public String processUser(int userId) {",
                "        return `"Processed User `" + userId + `" with Logic ID $_ : `" + UUID.randomUUID().toString();",
                "    }",
                "}"
            )
            $finalCode = $codeLines -join "`r`n"
            [System.IO.File]::WriteAllText("$sourcePath/$className.java", $finalCode, $utf8NoBom)
          }
          Write-Host "Java Source Code Generated."

      # 8. [데이터 생성] 상품 및 급여 데이터
      - name: 상품 및 급여 데이터 생성
        shell: powershell
        run: |
          Write-Host "Generating Product & Payroll Data..."
          $prodPath = "src/main/resources/products"
          $payrollPath = "src/main/resources/payroll"
          New-Item -ItemType Directory -Force -Path $prodPath | Out-Null
          New-Item -ItemType Directory -Force -Path $payrollPath | Out-Null
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          
          # 상품 20,000건
          [System.IO.File]::WriteAllText("$prodPath/products.csv", "ID,NAME,PRICE,STOCK`r`n", $utf8NoBom)
          $prodLines = 1..20000 | ForEach-Object { "$_,Item_$_,$(Get-Random -Min 100 -Max 9000),99" }
          [System.IO.File]::AppendAllLines("$prodPath/products.csv", $prodLines, $utf8NoBom)
          
          # 급여 5,000건
          [System.IO.File]::WriteAllText("$payrollPath/payroll.csv", "EMP_ID,SALARY,DATE`r`n", $utf8NoBom)
          $payLines = 1..5000 | ForEach-Object { "$_,$(Get-Random -Min 3000 -Max 8000),2025-01-21" }
          [System.IO.File]::AppendAllLines("$payrollPath/payroll.csv", $payLines, $utf8NoBom)
          
          Write-Host "CSV Data Generated."

      # 9. 환경 준비
      - name: Maven 의존성 및 네트워크 설정
        shell: powershell
        run: |
          mvn dependency:go-offline -B
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          New-NetFirewallRule -DisplayName "App Traffic" -Direction Inbound -Protocol TCP -LocalPort 8080 -Action Allow -ErrorAction SilentlyContinue

      # 10. 빌드 (Compile & Package)
      - name: 통합 대량 빌드 (Build)
        shell: powershell
        run: |
          Write-Host "Compiling Massive Application..."
          mvn clean package -DskipTests -B -q
          Write-Host "Build Successful."

      # 11. [신규] 계정 처리 시뮬레이션 (Simulation)
      - name: 계정 처리 시뮬레이션 (Account Processing Simulation)
        shell: powershell
        run: |
          Write-Host "Starting Account Processing Simulation..."
          $accPath = "src/main/resources/accounts"
          $reportPath = "simulation_report.csv"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          
          # CSV 리포트 헤더 작성
          [System.IO.File]::WriteAllText($reportPath, "USER_ID,PROCESS_STATUS,LATENCY_MS,TIMESTAMP`r`n", $utf8NoBom)
          
          # 10,000개 계정 파일을 읽어서 처리하는 척 시뮬레이션
          # 성능을 위해 1,000개 단위로 배치 처리 로그 출력
          $files = Get-ChildItem $accPath *.json
          $counter = 0
          $batchResults = New-Object System.Collections.Generic.List[string]
          
          foreach ($file in $files) {
             $counter++
             $status = Get-Random -InputObject "PROCESSED", "VERIFIED", "FLAGGED"
             $latency = Get-Random -Minimum 10 -Maximum 150
             
             # 결과 라인 추가
             $batchResults.Add("$($file.BaseName),$status,$latency,$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')")
             
             if ($counter % 2000 -eq 0) {
                 Write-Host " -> Processed $counter / 10000 accounts..."
             }
          }
          
          # 결과 파일 저장
          [System.IO.File]::AppendAllLines($reportPath, $batchResults, $utf8NoBom)
          
          Write-Host "Simulation Completed. Report Generated: $reportPath"
          Write-Host "Total Transactions Simulated: $counter"

      # 12. 패키징 (시뮬레이션 결과 포함)
      - name: 통합 아티팩트 패키징
        shell: powershell
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $packageName = "korea-complete-sim-windows-$date.zip"
          if (-not (Test-Path "target")) { New-Item -ItemType Directory -Force -Path "target" }
          
          # JAR, 리소스, 소스, 시뮬레이션 리포트 모두 포함
          Compress-Archive -Path "target/*.jar", "src/main/resources/*", "src/main/java", "simulation_report.csv" -DestinationPath $packageName -Force
          Write-Host "Package Created: $packageName"

      # 13. 정리 및 업로드
      - name: 정리 및 업로드
        shell: powershell
        run: Remove-Item -Path "maven.zip" -Force -ErrorAction SilentlyContinue
      
      - name: 결과물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-simulation-package
          path: '*.zip'

  # ==================================================================================
  # [JOB 2] Linux Agent (Simulate & Build)
  # ==================================================================================
  agent-linux:
    name: Linux Agent (Simulation & Build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 작업 설정
        uses: actions/checkout@v4

      - name: 시스템 최적화
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade ufw iptables net-tools -y
          sudo ufw --force reset

      - name: Java & Maven 준비
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Maven 3.9.6 설치
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          echo "$PWD/apache-maven-3.9.6/bin" >> $GITHUB_PATH

      - name: [통합] 데이터 대량 생성
        run: |
          echo "Generating Massive Data..."
          mkdir -p src/main/resources/{accounts,products,config}
          
          # 계정 10,000개
          for i in {1..10000}; do
             echo "<account><id>$i</id><status>ACTIVE</status></account>" > "src/main/resources/accounts/acc_$i.xml"
          done
          
          # 상품 20,000개
          for i in {1..20000}; do
             echo "PROD_$i,Item_$i,$(($RANDOM % 1000))" >> "src/main/resources/products/catalog.csv"
          done
          echo "Data Generation Complete."

      - name: 빌드 수행
        run: mvn clean package -DskipTests -B -q

      - name: [신규] 계정 처리 시뮬레이션 (Linux)
        run: |
          echo "Starting Batch Processing Simulation..."
          REPORT="linux_simulation_report.log"
          echo "TIMESTAMP,FILE,STATUS" > $REPORT
          
          # 10,000개 파일을 루프 돌면서 처리 시뮬레이션
          count=0
          for file in src/main/resources/accounts/*.xml; do
             ((count++))
             if ((count % 2500 == 0)); then
                 echo " -> Processed $count accounts..."
             fi
             # 랜덤 처리 상태 (의사 난수)
             if (( $RANDOM % 10 > 1 )); then STATUS="SUCCESS"; else STATUS="RETRY"; fi
             echo "$(date +%s),$file,$STATUS" >> $REPORT
          done
          echo "Simulation Finished. Total processed: $count"

      - name: 패키징 및 업로드
        run: |
          VERSION="v1.0.sim.$(date +%Y%m%d)"
          PKG_NAME="korea-complete-sim-linux-$VERSION.tar.gz"
          mkdir -p target
          
          tar -czf $PKG_NAME target/*.jar src/main/resources/ linux_simulation_report.log
          
          echo "Package Created: $PKG_NAME"

      - name: 결과물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-simulation-package
          path: '*.tar.gz'
