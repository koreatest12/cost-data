name: Cost Data Agent - Ultimate Massive Final (StreamWriter Fix)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==================================================================================
  # [JOB 1] Windows Agent (Stable StreamWriter & High Volume Data)
  # ==================================================================================
  agent-windows:
    name: Windows Agent (Mega Simulation)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # 1. 작업 설정
      - name: 작업 설정 (Job Setup)
        uses: actions/checkout@v4

      # 2. 실행기 및 보안 모듈 검증
      - name: 실행기 및 보안 모듈 검증
        shell: powershell
        run: |
          Write-Host "Verifying Environment..."
          Get-ComputerInfo | Select-Object WindowsVersion, OsArchitecture
          if (Get-Module -ListAvailable -Name NetSecurity) {
              Write-Host "NetSecurity Module [FOUND]."
          } else {
              Install-Module -Name NetSecurity -Force -AllowClobber -Scope CurrentUser
          }

      # 3. 보안 서비스 최적화
      - name: 보안 서비스 최적화
        shell: powershell
        run: |
          try { Update-MpSignature -ErrorAction SilentlyContinue } catch { }
          if ((Get-Service mpssvc).Status -eq 'Running') {
              Update-Help -Module NetSecurity -Force -ErrorAction SilentlyContinue
          }

      # 4. Java 17 & Maven 설정
      - name: Java & Maven 환경 구성
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Maven 3.9.6 수동 설치
        shell: powershell
        run: |
          $url = "https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.zip"
          $output = "maven.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath .
          $mavenBin = "$(Get-Location)\apache-maven-3.9.6\bin"
          echo "$mavenBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 5. [안정화] 계정 정보 대량 생성 (StreamWriter 사용)
      - name: 계정 정보 대량 생성 (Massive Accounts)
        shell: powershell
        run: |
          Write-Host "Generating 15,000 User Account Records..."
          $accPath = "src/main/resources/accounts"
          New-Item -ItemType Directory -Force -Path $accPath | Out-Null
          
          # BOM 없는 UTF-8 설정
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          
          # 15,000개 파일 생성 (StreamWriter로 안전하게 쓰기)
          1..15000 | ForEach-Object {
            $uuid = [guid]::NewGuid()
            $role = if ($_ % 10 -eq 0) { "ADMIN" } else { "USER" }
            $json = "{ 'user_id': $_, 'uuid': '$uuid', 'username': 'user_$_', 'email': 'user_$_@koreatest12.com', 'role': '$role', 'status': 'ACTIVE' }"
            
            # StreamWriter를 사용하여 파일 개별 생성 (BOM 방지)
            $sw = New-Object System.IO.StreamWriter("$accPath/user_$_.json", $false, $utf8NoBom)
            $sw.Write($json)
            $sw.Close()
          }
          Write-Host "Account Data Generation Completed."

      # 6. [대량 추가] Spring Boot 리소스 및 대용량 에셋
      - name: Spring Boot 리소스 대량 생성
        shell: powershell
        run: |
          Write-Host "Generating Massive Spring Boot Resources..."
          $configPath = "src/main/resources/config"
          New-Item -ItemType Directory -Force -Path $configPath | Out-Null
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          
          # 설정 파일 1,000개
          1..1000 | ForEach-Object {
            $sw = New-Object System.IO.StreamWriter("$configPath/application-tenant-$_.properties", $false, $utf8NoBom)
            $sw.WriteLine("server.port=80$_")
            $sw.WriteLine("spring.application.name=service-$_")
            $sw.Close()
          }
          
          # 정적 자산 생성 (500MB)
          Write-Host "Generating Heavy Static Assets..."
          1..10 | ForEach-Object {
            fsutil file createnew "$configPath/asset_blob_$_.dat" 52428800
          }
          Write-Host "Spring Boot Resources Ready."

      # 7. [안정화] Java 비즈니스 로직 동적 생성
      - name: 비즈니스 로직 동적 생성 (StreamWriter Fix)
        shell: powershell
        run: |
          Write-Host "Generating Dynamic Java Business Logic..."
          $sourcePath = "src/main/java/com/koreatest12/dynamic"
          New-Item -ItemType Directory -Force -Path $sourcePath | Out-Null
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          
          1..500 | ForEach-Object {
            $className = "UserProcessingService_$_"
            $code = "package com.koreatest12.dynamic;`r`nimport java.util.UUID;`r`npublic class $className {`r`n  public String process(int id) { return `"Processed `"+id; }`r`n}"
            
            $sw = New-Object System.IO.StreamWriter("$sourcePath/$className.java", $false, $utf8NoBom)
            $sw.Write($code)
            $sw.Close()
          }
          Write-Host "Java Source Code Generated."

      # 8. [오류 수정] 상품 및 급여 데이터 (StreamWriter 사용)
      - name: 상품, 급여, IoT 센서 데이터 생성 (Mega Volume)
        shell: powershell
        run: |
          Write-Host "Generating Massive CSV Data (Products, Payroll, IoT)..."
          $prodPath = "src/main/resources/products"
          $payrollPath = "src/main/resources/payroll"
          $iotPath = "src/main/resources/iot"
          
          New-Item -ItemType Directory -Force -Path $prodPath | Out-Null
          New-Item -ItemType Directory -Force -Path $payrollPath | Out-Null
          New-Item -ItemType Directory -Force -Path $iotPath | Out-Null
          
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          
          # 1. 상품 데이터 (30,000건) - StreamWriter 사용으로 오류 해결
          $swProd = New-Object System.IO.StreamWriter("$prodPath/products.csv", $false, $utf8NoBom)
          $swProd.WriteLine("ID,NAME,PRICE,STOCK")
          1..30000 | ForEach-Object {
            $swProd.WriteLine("$_,Item_$_,$(Get-Random -Min 100 -Max 9999),99")
          }
          $swProd.Close()
          Write-Host " -> Products Generated."
          
          # 2. 급여 데이터 (10,000건)
          $swPay = New-Object System.IO.StreamWriter("$payrollPath/payroll.csv", $false, $utf8NoBom)
          $swPay.WriteLine("EMP_ID,SALARY,DATE")
          1..10000 | ForEach-Object {
            $swPay.WriteLine("$_,$(Get-Random -Min 3000 -Max 8000),2025-01-21")
          }
          $swPay.Close()
          Write-Host " -> Payroll Generated."

          # 3. [신규] IoT 센서 데이터 (20,000건)
          $swIoT = New-Object System.IO.StreamWriter("$iotPath/sensor_logs.csv", $false, $utf8NoBom)
          $swIoT.WriteLine("SENSOR_ID,TEMP,HUMIDITY,TS")
          1..20000 | ForEach-Object {
            $swIoT.WriteLine("SENS_$_,$(Get-Random -Min 20 -Max 40),$(Get-Random -Min 30 -Max 80),$(Get-Date -Format 'yyyyMMddHHmmss')")
          }
          $swIoT.Close()
          Write-Host " -> IoT Sensor Data Generated."

      # 9. 환경 준비
      - name: Maven 의존성 및 네트워크 설정
        shell: powershell
        run: |
          mvn dependency:go-offline -B
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          New-NetFirewallRule -DisplayName "App Traffic" -Direction Inbound -Protocol TCP -LocalPort 8080 -Action Allow -ErrorAction SilentlyContinue

      # 10. 빌드 (Compile & Package)
      - name: 통합 대량 빌드 (Build)
        shell: powershell
        run: |
          Write-Host "Compiling Massive Application..."
          mvn clean package -DskipTests -B -q
          Write-Host "Build Successful."

      # 11. 계정 처리 시뮬레이션
      - name: 계정 처리 시뮬레이션 (Simulation)
        shell: powershell
        run: |
          Write-Host "Starting Account Processing Simulation..."
          $accPath = "src/main/resources/accounts"
          $reportPath = "simulation_report.csv"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          
          $swReport = New-Object System.IO.StreamWriter($reportPath, $false, $utf8NoBom)
          $swReport.WriteLine("USER_ID,STATUS,LATENCY,TS")
          
          # 파일 목록 가져오기 (15,000개)
          $files = Get-ChildItem $accPath *.json
          $counter = 0
          
          foreach ($file in $files) {
             $counter++
             # 랜덤 처리 시뮬레이션
             $status = Get-Random -InputObject "SUCCESS", "RETRY", "FAIL"
             $latency = Get-Random -Min 10 -Max 100
             
             $swReport.WriteLine("$($file.BaseName),$status,$latency,$(Get-Date)")
             
             if ($counter % 3000 -eq 0) {
                 Write-Host " -> Processed $counter / 15000 accounts..."
             }
          }
          $swReport.Close()
          
          Write-Host "Simulation Completed. Total: $counter"

      # 12. 패키징 (시뮬레이션 결과 포함)
      - name: 통합 아티팩트 패키징
        shell: powershell
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $packageName = "korea-complete-sim-windows-$date.zip"
          if (-not (Test-Path "target")) { New-Item -ItemType Directory -Force -Path "target" }
          
          Compress-Archive -Path "target/*.jar", "src/main/resources/*", "src/main/java", "simulation_report.csv" -DestinationPath $packageName -Force
          Write-Host "Package Created: $packageName"

      # 13. 정리 및 업로드
      - name: 정리 및 업로드
        shell: powershell
        run: Remove-Item -Path "maven.zip" -Force -ErrorAction SilentlyContinue
      
      - name: 결과물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-simulation-package
          path: '*.zip'

  # ==================================================================================
  # [JOB 2] Linux Agent (Optimized Loop & Mega Volume)
  # ==================================================================================
  agent-linux:
    name: Linux Agent (Mega Simulation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 작업 설정
        uses: actions/checkout@v4

      - name: 시스템 최적화
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade ufw iptables net-tools -y
          sudo ufw --force reset

      - name: Java & Maven 준비
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Maven 3.9.6 설치
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          echo "$PWD/apache-maven-3.9.6/bin" >> $GITHUB_PATH

      - name: 데이터 대량 생성 (Linux Optimized)
        run: |
          echo "Generating Massive Data for Linux..."
          mkdir -p src/main/resources/{accounts,products,config,logs}
          
          # 계정 15,000개 (Shell Loop 최적화)
          # seq를 사용하여 빠른 반복
          seq 1 15000 | xargs -I {} sh -c 'echo "<account><id>{}</id><status>ACTIVE</status></account>" > src/main/resources/accounts/acc_{}.xml'
          
          # 상품 30,000개 (단일 파일 append가 더 빠름)
          echo "ID,NAME,PRICE" > src/main/resources/products/catalog.csv
          for i in {1..30000}; do
             echo "PROD_$i,Item_$i,$((RANDOM % 1000))" >> src/main/resources/products/catalog.csv
          done
          
          # 로그 파일 5,000개
          seq 1 5000 | xargs -I {} sh -c 'echo "LOG ENTRY {}" > src/main/resources/logs/sys_{}.log'
          
          echo "Data Generation Complete."

      - name: 빌드 수행
        run: mvn clean package -DskipTests -B -q

      - name: 계정 처리 시뮬레이션 (Linux Loop Fix)
        run: |
          echo "Starting Batch Processing Simulation..."
          REPORT="linux_simulation_report.log"
          echo "TIMESTAMP,FILE,STATUS" > $REPORT
          
          # 파일이 존재하는지 확인 후 루프
          if [ -d "src/main/resources/accounts" ]; then
             count=0
             # find 명령어로 안전하게 파일 목록 순회
             find src/main/resources/accounts -name "*.xml" | while read file; do
                 ((count++))
                 # 3000건마다 진행상황 출력
                 if ((count % 3000 == 0)); then
                     echo " -> Processed $count accounts..."
                 fi
                 echo "$(date +%s),$file,PROCESSED" >> $REPORT
             done
             echo "Simulation Finished. Total processed: $count"
          else
             echo "Error: Account directory not found."
             exit 1
          fi

      - name: 패키징 및 업로드
        run: |
          VERSION="v1.0.sim.$(date +%Y%m%d)"
          PKG_NAME="korea-complete-sim-linux-$VERSION.tar.gz"
          mkdir -p target
          
          tar -czf $PKG_NAME target/*.jar src/main/resources/ linux_simulation_report.log
          
          echo "Package Created: $PKG_NAME"

      - name: 결과물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-simulation-package
          path: '*.tar.gz'
