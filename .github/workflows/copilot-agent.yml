name: Cost Data Agent - Ultimate Permissions & Logic Edition

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==================================================================================
  # [JOB 1] Windows Agent (Permissions, Logic Generation & Build)
  # ==================================================================================
  agent-windows:
    name: Windows Agent (Permissions & Logic)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # 1. 작업 설정
      - name: 작업 설정 (Job Setup)
        uses: actions/checkout@v4

      # 2. 실행기 환경 및 보안 모듈 검증
      - name: 실행기 환경 및 보안 모듈 검증
        shell: powershell
        run: |
          Write-Host "Verifying Environment..."
          Get-ComputerInfo | Select-Object WindowsVersion, OsArchitecture
          
          if (Get-Module -ListAvailable -Name NetSecurity) {
              Write-Host "NetSecurity Module [FOUND]."
          } else {
              Install-Module -Name NetSecurity -Force -AllowClobber -Scope CurrentUser
          }

      # 3. 보안 서비스 최적화
      - name: 보안 서비스 최적화
        shell: powershell
        run: |
          try {
            Update-MpSignature -ErrorAction SilentlyContinue
            Write-Host "Security Signatures Refreshed."
          } catch {
            Write-Host "Managed Environment Detected."
          }

      # 4. Java 17 (Spring Boot) 및 Maven 설정
      - name: Java & Maven 환경 구성
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Maven 3.9.6 수동 설치
        shell: powershell
        run: |
          $url = "https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.zip"
          $output = "maven.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath .
          $mavenBin = "$(Get-Location)\apache-maven-3.9.6\bin"
          echo "$mavenBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 5. [신규] 계정별 권한(Permission) 정책 대량 생성 (JSON)
      - name: 계정별 권한 정책 대량 생성
        shell: powershell
        run: |
          Write-Host "Generating RBAC Permission Policies..."
          $permPath = "src/main/resources/permissions"
          New-Item -ItemType Directory -Force -Path $permPath | Out-Null
          
          # 10,000개의 계정에 대해 랜덤 권한 부여 (골고루 반영)
          1..10000 | ForEach-Object {
            $role = Get-Random -InputObject "ADMIN", "MANAGER", "USER", "AUDITOR", "GUEST"
            $scope = Get-Random -InputObject "READ_ONLY", "READ_WRITE", "FULL_ACCESS"
            $canDelete = Get-Random -InputObject "true", "false"
            
            $json = "{ 'uid': $_, 'role': '$role', 'scope': '$scope', 'allow_delete': $canDelete, 'generated_at': '$(Get-Date)' }"
            $json | Out-File -FilePath "$permPath/perm_policy_$_.json" -Encoding utf8
          }
          Write-Host "Permission Policies Generated."

      # 6. [신규] 계정별 처리 로직(Java Class) 동적 생성 (컴파일 부하 테스트)
      - name: 계정별 처리 로직(Java Source) 동적 생성
        shell: powershell
        run: |
          Write-Host "Generating Dynamic Java Business Logic..."
          $sourcePath = "src/main/java/com/koreatest12/dynamic"
          New-Item -ItemType Directory -Force -Path $sourcePath | Out-Null
          
          # 500개의 Java 클래스 파일을 동적으로 생성하여 빌드에 포함
          1..500 | ForEach-Object {
            $className = "UserProcessingService_$_"
            $code = @"
            package com.koreatest12.dynamic;
            import java.util.UUID;
            public class $className {
                public String processUser(int userId) {
                    return "Processing User " + userId + " with Logic ID $_ : " + UUID.randomUUID().toString();
                }
            }
            "@
            $code | Out-File -FilePath "$sourcePath/$className.java" -Encoding utf8
          }
          Write-Host "Dynamic Java Source Code Generated (500 Classes)."

      # 7. [신규] 계정별 트랜잭션 처리 로그 대량 생성
      - name: 계정별 트랜잭션 로그 생성
        shell: powershell
        run: |
          Write-Host "Generating Transaction Logs..."
          $logPath = "src/main/resources/logs"
          New-Item -ItemType Directory -Force -Path $logPath | Out-Null
          
          # 5,000건의 랜덤 트랜잭션 로그 (다양한 상태값 반영)
          1..5000 | ForEach-Object {
            $status = Get-Random -InputObject "SUCCESS", "FAILED", "PENDING", "CANCELLED"
            $amount = Get-Random -Minimum 100 -Maximum 9999999
            $log = "TX_ID: $([guid]::NewGuid()) | USER: user_$_ | STATUS: $status | AMOUNT: $amount | TS: $(Get-Date)"
            $log | Out-File -FilePath "$logPath/tx_log_$_.txt" -Encoding utf8
          }
          Write-Host "Transaction Logs Created."

      # 8. 의존성 준비
      - name: Maven 의존성 오프라인 준비
        shell: powershell
        run: mvn dependency:go-offline -B

      # 9. 방화벽 규칙 적용
      - name: 네트워크/방화벽 규칙 적용
        shell: powershell
        run: |
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          New-NetFirewallRule -DisplayName "App Traffic" -Direction Inbound -Protocol TCP -LocalPort 8080,9090 -Action Allow -ErrorAction SilentlyContinue

      # 10. 빌드 수행 (동적 생성된 코드 컴파일 포함)
      - name: 전체 로직 빌드 및 검증
        shell: powershell
        run: |
          Write-Host "Compiling Generated Code & Resources..."
          # 테스트는 건너뛰고 컴파일 및 패키징 수행 (동적 생성된 Java 파일 컴파일 확인)
          mvn clean package -DskipTests -B -q
          Write-Host "Build Successful. Dynamic Logic Compiled."

      # 11. 패키징 및 배포
      - name: 아티팩트 패키징 (Zip)
        shell: powershell
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $packageName = "korea-logic-windows-$date.zip"
          
          if (-not (Test-Path "target")) { New-Item -ItemType Directory -Force -Path "target" }
          
          # 컴파일된 Jar, 권한 파일, 로그, 소스 코드 모두 포함
          Compress-Archive -Path "target/*.jar", "src/main/resources/permissions", "src/main/resources/logs", "src/main/java" -DestinationPath $packageName -Force
          
          Write-Host "Package Created: $packageName"

      # 12. 정리 및 업로드
      - name: 정리
        shell: powershell
        run: Remove-Item -Path "maven.zip" -Force -ErrorAction SilentlyContinue

      - name: 결과물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logic-package
          path: '*.zip'

  # ==================================================================================
  # [JOB 2] Linux Agent (Distributed Processing & Permissions)
  # ==================================================================================
  agent-linux:
    name: Linux Agent (Distributed Logic)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 1. 작업 설정
      - name: 작업 설정
        uses: actions/checkout@v4

      # 2. 시스템 최적화
      - name: 시스템 최적화 및 보안 설정
        run: |
          echo "Optimizing Linux Environment..."
          sudo apt-get update
          sudo apt-get install --only-upgrade ufw iptables net-tools -y
          sudo ufw --force reset
          echo "System Optimized."

      # 3. Java/Maven 준비
      - name: Java(Spring Boot) 준비
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Maven 3.9.6 설치
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          echo "$PWD/apache-maven-3.9.6/bin" >> $GITHUB_PATH

      # 4. [신규] 계정별 권한 매트릭스 생성 (XML) - 골고루 반영
      - name: 계정별 권한 매트릭스 생성 (Distributed)
        run: |
          echo "Generating XML Permission Matrix..."
          PERM_PATH="src/main/resources/permissions_xml"
          mkdir -p $PERM_PATH
          
          # 10,000개 계정에 대해 랜덤 Role 할당
          for i in {1..10000}; do
             # shuf 명령어로 랜덤 역할 배정
             ROLE=$(shuf -e "SUPER_ADMIN" "ADMIN" "OPERATOR" "VIEWER" -n 1)
             LEVEL=$(shuf -i 1-10 -n 1)
             echo "<permission><id>$i</id><role>$ROLE</role><level>$LEVEL</level></permission>" > "$PERM_PATH/perm_$i.xml"
          done
          
          echo "XML Permission Matrix Generated."

      # 5. [신규] 처리 로직 설정 파일 대량 생성 (YAML)
      - name: 처리 로직 설정 생성 (Business Logic Config)
        run: |
          echo "Generating Business Logic Configs..."
          CONF_PATH="src/main/resources/logic_config"
          mkdir -p $CONF_PATH
          
          # 각 계정별 처리 방식을 정의하는 YAML 파일 1,000개 생성
          for i in {1..1000}; do
             PROCESS_TYPE=$(shuf -e "SYNC" "ASYNC" "BATCH" "REALTIME" -n 1)
             echo -e "user_id: $i\nprocess:\n  type: $PROCESS_TYPE\n  timeout: 5000\n  retry: 3" > "$CONF_PATH/logic_user_$i.yml"
          done
          
          echo "Logic Configs Generated."

      # 6. Maven 빌드
      - name: Maven 빌드 (모든 리소스 포함)
        run: |
          echo "Starting Build..."
          mvn clean package -DskipTests -B -q
          echo "Build Completed."

      # 7. 패키징
      - name: 패키징 및 배포
        run: |
          echo "Creating Release Package..."
          VERSION="v1.0.logic.$(date +%Y%m%d)"
          PKG_NAME="korea-logic-linux-$VERSION.tar.gz"
          
          mkdir -p target
          
          # 권한 XML, 로직 설정, Jar 파일 포함 압축
          tar -czf $PKG_NAME target/*.jar src/main/resources/permissions_xml/ src/main/resources/logic_config/
          
          echo "Package: $PKG_NAME"

      # 8. 정리 및 업로드
      - name: 정리
        run: rm -rf apache-maven-3.9.6-bin.tar.gz

      - name: 결과물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-logic-package
          path: '*.tar.gz'
