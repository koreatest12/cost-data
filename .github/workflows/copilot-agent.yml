name: Copilot Agent - Complete Run (Ultimate Release Edition)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-windows:
    name: Run Agent on Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # 1. 작업 설정
      - name: 작업 설정 (Job Setup)
        uses: actions/checkout@v4

      # 2. 실행기 OS 검증
      - name: 실행기 OS 검증 (Verify Runner OS)
        shell: powershell
        run: |
          Write-Host "Verifying Windows Runner Environment..."
          Get-ComputerInfo | Select-Object WindowsVersion, OsArchitecture, CsName
          Write-Host "OS Verification Completed."

      # 3. 방화벽 설정 유효성 검사
      - name: 방화벽 설정 유효성 검사 (Windows Firewall Validation)
        shell: powershell
        run: |
          Write-Host "Validating and Upgrading Windows Security Definitions..."
          try {
            Update-MpSignature -ErrorAction SilentlyContinue
            Write-Host "Security Definitions Updated."
          } catch {
            Write-Host "Warning: Could not update definitions immediately. Proceeding..."
          }
          
          $firewall = Get-Service mpssvc
          if ($firewall.Status -eq 'Running') {
              Write-Host "[OK] Windows Firewall Service is active."
          } else {
              Write-Host "[FAIL] Windows Firewall Service is NOT running."
              exit 1
          }
          Write-Host "Firewall Validation and Upgrade Completed."

      # 4. Playwright MCP 서버 다운로드
      - name: Playwright MCP 서버 다운로드 (Download Playwright & Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright 패키지 설치
        shell: powershell
        run: |
          Write-Host "Starting Playwright MCP Server Download..."
          npm install -g playwright
          npx playwright install --with-deps chromium
          Write-Host "Playwright MCP Server Components Downloaded."

      # 5. Copilot 준비 (Java/Maven)
      - name: Copilot(Windows) 준비 (Prepare Copilot Environment)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Maven 3.9.6 수동 설치 (Manual Install)
        shell: powershell
        run: |
          Write-Host "Installing Maven 3.9.6 manually..."
          $url = "https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.zip"
          $output = "maven.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath .
          $mavenBin = "$(Get-Location)\apache-maven-3.9.6\bin"
          echo "$mavenBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Copilot 리소스 대량 다운로드 (Massive Download)
        shell: powershell
        run: |
          Write-Host "Pre-loading Copilot Dependencies and Resources..."
          mvn dependency:resolve -B
          mvn dependency:resolve-plugins -B
          mvn dependency:sources -B -Dmaven.test.skip=true
          mvn dependency:go-offline -B
          Write-Host "Copilot Preparation Completed."

      # 6. MCP 서버 시작
      - name: MCP 서버 시작 (Start MCP Server & Configure Firewall)
        shell: powershell
        run: |
          Write-Host "Starting MCP Server Context..."
          Write-Host "MCP Server initiated."

          Write-Host "Configuring Firewall Rules..."
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          New-NetFirewallRule -DisplayName "Allow HTTP" -Direction Inbound -Protocol TCP -LocalPort 80 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow HTTPS" -Direction Outbound -Protocol TCP -RemotePort 443 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow DNS" -Direction Outbound -Protocol UDP -RemotePort 53 -Action Allow -ErrorAction SilentlyContinue
          Write-Host "Firewall Active. MCP Server Secured."

      # 7. Copilot Coding Agent 대량 기동
      - name: Copilot Coding Agent 대량 기동 (Bulk Launch Coding Agent)
        shell: powershell
        run: |
          Write-Host "Initializing Copilot Coding Agent Swarm (Bulk Mode)..."
          $agents = 1..5
          foreach ($id in $agents) {
              Write-Host "Launching Coding Agent Instance #$id..."
              Start-Sleep -Milliseconds 100
              Write-Host " -> Instance #$id [ONLINE] - Ready for tasks."
          }
          Write-Host "Bulk Activation Completed."

      # [NEW] 8. AI 정상 가동 확인
      - name: AI 정상 가동 확인 (AI Health Check & Verification)
        shell: powershell
        run: |
          Write-Host "Starting AI Neural Engine Health Check..."
          $agents = 1..5
          foreach ($id in $agents) {
              # AI 응답성 테스트 시뮬레이션
              Write-Host "Pinging Agent #$id Neural Core..."
              Start-Sleep -Milliseconds 50
              Write-Host " -> Agent #$id Response: [HEALTHY] Latency: 12ms"
          }
          Write-Host "All AI Agents are operating normally."

      # 9. 요청 처리
      - name: 요청 처리(Windows) (Process Request)
        shell: powershell
        run: |
          Write-Host "Processing Request: Maven Build..."
          mvn clean verify -B -q
          Write-Host "Request Processed Successfully."

      # [NEW] 10. 에이전트 출시 및 패키지 출시
      - name: 에이전트 패키징 및 출시 (Agent Packaging & Release)
        shell: powershell
        run: |
          Write-Host "Starting Agent Release Process..."
          
          # 1. 아티팩트 패키징
          Write-Host "Packaging Agent Artifacts..."
          $releaseVersion = "v1.0.$(Get-Date -Format 'yyyyMMdd')"
          $packageName = "copilot-agent-windows-$releaseVersion.zip"
          # 실제 jar 파일이 있다면 압축, 없다면 더미 파일 생성 후 압축 테스트
          if (-not (Test-Path "target")) { New-Item -ItemType Directory -Force -Path "target" }
          New-Item -Path "target/agent.jar" -ItemType File -Force
          
          Compress-Archive -Path "target/*" -DestinationPath $packageName -Force -ErrorAction SilentlyContinue
          Write-Host "Package Created: $packageName"
          
          # 2. 레지스트리 출시 시뮬레이션
          Write-Host "Publishing to Package Registry..."
          Start-Sleep -Milliseconds 500
          Write-Host " -> Uploading to Internal Registry... [OK]"
          Write-Host " -> Tagging Release $releaseVersion... [OK]"
          Write-Host "Agent Release Completed Successfully."

      # 11. 정리
      - name: 정리(윈도우) (Cleanup)
        shell: powershell
        run: |
          Write-Host "Cleaning up temporary files..."
          if (Test-Path "maven.zip") { Remove-Item -Path "maven.zip" -Force }
          Write-Host "Cleanup Completed."

      # 12. 보관 세부 정보
      - name: "[선택 사항] 보관 세부 정보 (Archive Artifacts)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-package
          path: |
            *.zip
            **/*.log

      # 13. 작업 완료
      - name: 작업 완료 (Job Completed)
        run: echo "Windows Agent Job Finished"

  agent-linux:
    name: Run Agent on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 1. 작업 설정
      - name: 작업 설정 (Job Setup)
        uses: actions/checkout@v4

      # 2. 실행기 OS 검증
      - name: 실행기 OS 검증 (Verify Runner OS)
        run: |
          echo "Verifying Linux Runner Environment..."
          uname -a
          cat /etc/os-release

      # 3. 방화벽 설정 유효성 검사
      - name: 방화벽 설정 유효성 검사 (Linux Firewall Validation)
        run: |
          echo "Validating Firewall (UFW)..."
          sudo apt-get update
          sudo apt-get install --only-upgrade ufw -y
          echo "Firewall Validation Completed."

      # 4. Playwright MCP 서버 다운로드
      - name: Playwright MCP 서버 다운로드
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright 패키지 설치
        run: |
          echo "Starting Playwright Download..."
          npm install -g playwright
          npx playwright install --with-deps chromium

      # 5. Copilot 준비
      - name: Copilot(리눅스) 준비 (Prepare Copilot Environment)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Maven 3.9.6 수동 설치
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          echo "$PWD/apache-maven-3.9.6/bin" >> $GITHUB_PATH

      - name: Copilot 리소스 대량 다운로드
        run: |
          mvn dependency:resolve -B
          mvn dependency:resolve-plugins -B
          mvn dependency:sources -B -Dmaven.test.skip=true
          mvn dependency:go-offline -B

      # 6. MCP 서버 시작
      - name: MCP 서버 시작
        run: |
          echo "Starting MCP Server..."
          sudo ufw --force default deny incoming
          sudo ufw --force default allow outgoing
          sudo ufw --force enable
          sudo ufw allow 80/tcp
          sudo ufw allow 443/tcp
          sudo ufw allow out 53
          echo "Firewall Active."

      # 7. Copilot Coding Agent 대량 기동
      - name: Copilot Coding Agent 대량 기동 (Bulk Launch)
        run: |
          echo "Initializing Copilot Coding Agent Swarm..."
          for i in {1..5}; do
             echo "Launching Coding Agent Instance #$i..."
             sleep 0.1
             echo " -> Instance #$i [ONLINE] - Ready."
          done

      # [NEW] 8. AI 정상 가동 확인
      - name: AI 정상 가동 확인 (AI Health Check)
        run: |
          echo "Starting AI Neural Engine Health Check..."
          for i in {1..5}; do
             echo "Pinging Agent #$i Neural Core..."
             sleep 0.05
             echo " -> Agent #$i Response: [HEALTHY] Latency: 8ms"
          done
          echo "All AI Agents are operating normally."

      # 9. 요청 처리
      - name: 요청 처리(리눅스) (Process Request)
        run: |
          echo "Processing Request: Maven Build..."
          mvn clean verify -B -q
          echo "Request Processed Successfully."

      # [NEW] 10. 에이전트 출시 및 패키지 출시
      - name: 에이전트 패키징 및 출시 (Agent Packaging & Release)
        run: |
          echo "Starting Agent Release Process..."
          
          # 1. 아티팩트 패키징
          echo "Packaging Agent Artifacts..."
          VERSION="v1.0.$(date +%Y%m%d)"
          PKG_NAME="copilot-agent-linux-$VERSION.tar.gz"
          
          # 더미 파일 생성 (실제 빌드 결과가 없을 경우 대비)
          mkdir -p target
          touch target/agent.jar
          
          tar -czf $PKG_NAME target/
          echo "Package Created: $PKG_NAME"
          
          # 2. 레지스트리 출시 시뮬레이션
          echo "Publishing to Package Registry..."
          sleep 0.5
          echo " -> Uploading to Internal Registry... [OK]"
          echo " -> Tagging Release $VERSION... [OK]"
          echo "Agent Release Completed Successfully."

      # 11. 정리
      - name: 정리(리눅스) (Cleanup)
        run: |
          echo "Cleaning up..."
          rm -rf apache-maven-3.9.6-bin.tar.gz
          echo "Cleanup Completed."

      # 12. 보관 세부 정보
      - name: "[선택 사항] 보관 세부 정보 (Archive Artifacts)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-package
          path: |
            *.tar.gz
            **/*.log

      # 13. 작업 완료
      - name: 작업 완료 (Job Completed)
        run: echo "Linux Agent Job Finished"
