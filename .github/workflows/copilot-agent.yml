name: Copilot Agent - Complete Run

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-windows:
    name: Run Agent on Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # [NEW] Firewall & Security Definition Upgrade
      - name: Upgrade Firewall & Security Definitions
        shell: powershell
        run: |
          Write-Host "Starting Windows Firewall & Security Upgrade..."
          
          # Update Windows Defender Security Intelligence (includes network protection definitions)
          # 방화벽 및 네트워크 보호와 연관된 보안 정의를 최신으로 업데이트합니다.
          Write-Host "Upgrading Windows Security Intelligence..."
          Update-MpSignature
          
          Write-Host "Windows Firewall & Security Definitions Upgraded"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download Maven dependencies
        shell: powershell
        run: |
          Write-Host "Pre-downloading Maven dependencies..."
          mvn dependency:go-offline -B

      - name: Configure Windows Firewall
        shell: powershell
        run: |
          Write-Host "Configuring Windows Firewall - No Skip"
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True

          # HTTP/HTTPS/SSH Rules
          New-NetFirewallRule -DisplayName "Allow HTTP Inbound" -Direction Inbound -Protocol TCP -LocalPort 80 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow HTTP Outbound" -Direction Outbound -Protocol TCP -RemotePort 80 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow HTTPS Inbound" -Direction Inbound -Protocol TCP -LocalPort 443 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow HTTPS Outbound" -Direction Outbound -Protocol TCP -RemotePort 443 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow SSH Inbound" -Direction Inbound -Protocol TCP -LocalPort 22 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow SSH Outbound" -Direction Outbound -Protocol TCP -RemotePort 22 -Action Allow -ErrorAction SilentlyContinue
          
          # DNS Rule
          New-NetFirewallRule -DisplayName "Allow DNS Outbound" -Direction Outbound -Protocol UDP -RemotePort 53 -Action Allow -ErrorAction SilentlyContinue

          Write-Host "Firewall rules configured successfully"

      - name: Verify Windows Firewall Status
        shell: powershell
        run: |
          Write-Host "Verifying Windows Firewall Status"
          Get-NetFirewallProfile | Select-Object Name, Enabled
          Get-NetFirewallRule -DisplayName "Allow HTTP*" | Select-Object DisplayName, Enabled, Direction

      - name: Run Windows-specific checks
        shell: powershell
        run: |
          Write-Host "Running Windows-specific checks..."
          Get-MpComputerStatus | Select-Object AntivirusEnabled, RealTimeProtectionEnabled
          Get-ComputerInfo | Select-Object WindowsVersion, OsArchitecture

      - name: Verify build works after firewall configuration
        shell: powershell
        run: |
          Write-Host "Verifying Maven build works with firewall enabled..."
          mvn clean verify -B -q

      - name: Agent execution summary
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "Agent Execution Summary (Windows)"
          Write-Host "================================"
          Write-Host "Firewall Upgrade: COMPLETED"
          Write-Host "Firewall Configuration: COMPLETED"
          Write-Host "Skip Status: NONE"
          Write-Host "================================"

  agent-linux:
    name: Run Agent on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # [NEW] Firewall Software Upgrade
      - name: Upgrade Firewall Software (UFW)
        run: |
          echo "Starting Linux Firewall Upgrade..."
          
          # Update package lists
          sudo apt-get update
          
          # Explicitly upgrade only the UFW (Uncomplicated Firewall) package
          # 방화벽 소프트웨어(UFW)를 최신 버전으로 업그레이드합니다.
          echo "Upgrading UFW package..."
          sudo apt-get install --only-upgrade ufw -y
          
          echo "Linux Firewall Software Upgrade Completed"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download Maven dependencies
        run: |
          echo "Pre-downloading Maven dependencies..."
          mvn dependency:go-offline -B

      - name: Configure Linux Firewall (UFW)
        run: |
          echo "Configuring Linux Firewall (UFW)..."
          # Install UFW (ensure it's present if upgrade skipped it or it wasn't there)
          sudo apt-get install -y ufw
          
          # Configure policies
          sudo ufw --force default deny incoming
          sudo ufw --force default allow outgoing
          sudo ufw --force enable
          
          # Allow specific ports
          sudo ufw allow 80/tcp comment 'Allow HTTP'
          sudo ufw allow 443/tcp comment 'Allow HTTPS'
          sudo ufw allow 22/tcp comment 'Allow SSH'
          sudo ufw allow out 53 comment 'Allow DNS'
          
          # Reload to ensure upgrades and rules apply
          sudo ufw reload
          echo "Firewall configured and reloaded"

      - name: Verify Linux Firewall Status
        run: |
          echo "Verifying Linux Firewall Status"
          sudo ufw status verbose

      - name: Configure iptables rules
        run: |
          echo "Configuring iptables rules..."
          sudo iptables -A INPUT -p tcp --dport 80 -j ACCEPT
          sudo iptables -A INPUT -p tcp --dport 443 -j ACCEPT
          sudo iptables -A INPUT -p tcp --dport 22 -j ACCEPT
          sudo iptables -A OUTPUT -p tcp --dport 80 -j ACCEPT
          sudo iptables -A OUTPUT -p tcp --dport 443 -j ACCEPT
          sudo iptables -A OUTPUT -p udp --dport 53 -j ACCEPT
          sudo iptables -A OUTPUT -p tcp --dport 53 -j ACCEPT
          sudo iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT

      - name: Run Linux-specific checks
        run: |
          echo "Running Linux-specific checks..."
          uname -a
          ip addr show

      - name: Verify build works after firewall configuration
        run: |
          echo "Verifying Maven build works with firewall enabled..."
          mvn clean verify -B -q

      - name: Agent execution summary
        run: |
          echo "================================"
          echo "Agent Execution Summary (Linux)"
          echo "================================"
          echo "Firewall Upgrade: COMPLETED"
          echo "Firewall Configuration: COMPLETED"
          echo "Skip Status: NONE"
          echo "================================"

  agent-validation:
    name: Validate Agent Configuration
    runs-on: ubuntu-latest
    needs: [agent-windows, agent-linux]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate agent configuration
        run: |
          echo "Validating agent configuration file"
          if [ -f ".github/copilot/agent-config.yml" ]; then
            echo "✓ Agent configuration file found"
            if grep -q "skip_firewall: false" .github/copilot/agent-config.yml; then
              echo "✓ Skip settings are correctly configured"
            else
              echo "✗ Skip settings not found or incorrect"
              exit 1
            fi
          else
            echo "✗ Agent configuration file not found"
            exit 1
          fi
      - name: Final validation summary
        run: |
          echo "================================"
          echo "Complete Agent Validation Summary"
          echo "================================"
          echo "Windows Agent: PASSED"
          echo "Linux Agent: PASSED"
          echo "Firewall Upgrade: VERIFIED"
          echo "All checks: COMPLETED"
          echo "================================"
