name: Copilot Agent - Complete Run

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-windows:
    name: Run Agent on Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # [Security] Firewall & Security Upgrade
      - name: Upgrade Firewall & Security Definitions
        shell: powershell
        run: |
          Write-Host "Upgrading Windows Security Intelligence..."
          Update-MpSignature
          Write-Host "Windows Firewall & Security Definitions Upgraded"

      # [Cache] Restore Maven Cache
      - name: Restore Maven Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # [Setup] Java 17 (Maven version option removed to fix warning)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # [NEW] Explicit Install of Maven 3.9.6 (Fix for missing input)
      - name: Install Maven 3.9.6 Manually
        shell: powershell
        run: |
          Write-Host "Downloading Maven 3.9.6..."
          $url = "https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.zip"
          $output = "maven.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          
          Write-Host "Extracting Maven..."
          Expand-Archive -Path $output -DestinationPath .
          
          $mavenHome = "$(Get-Location)\apache-maven-3.9.6"
          $mavenBin = "$mavenHome\bin"
          
          Write-Host "Adding Maven to PATH: $mavenBin"
          echo "$mavenBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          Write-Host "Maven 3.9.6 Installation Completed"

      - name: Check Maven Version
        shell: powershell
        run: mvn -version

      # [Massive] Bulk Download
      - name: Massive Download of Maven Dependencies
        shell: powershell
        run: |
          Write-Host "Starting Massive Maven Resource Download..."
          
          # 1. Resolve Project Dependencies
          mvn dependency:resolve -B
          
          # 2. Resolve All Plugins
          mvn dependency:resolve-plugins -B
          
          # 3. Download Sources (Removed invalid 'javadoc' goal)
          mvn dependency:sources -B -Dmaven.test.skip=true
          
          # 4. Go Offline check
          mvn dependency:go-offline -B
          
          Write-Host "Massive Download Completed."

      - name: Configure Windows Firewall
        shell: powershell
        run: |
          Write-Host "Configuring Windows Firewall..."
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True

          # Essential Rules
          New-NetFirewallRule -DisplayName "Allow HTTP Inbound" -Direction Inbound -Protocol TCP -LocalPort 80 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow HTTP Outbound" -Direction Outbound -Protocol TCP -RemotePort 80 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow HTTPS Inbound" -Direction Inbound -Protocol TCP -LocalPort 443 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow HTTPS Outbound" -Direction Outbound -Protocol TCP -RemotePort 443 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow SSH Inbound" -Direction Inbound -Protocol TCP -LocalPort 22 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow SSH Outbound" -Direction Outbound -Protocol TCP -RemotePort 22 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow DNS Outbound" -Direction Outbound -Protocol UDP -RemotePort 53 -Action Allow -ErrorAction SilentlyContinue

      - name: Verify build works after firewall configuration
        shell: powershell
        run: |
          mvn clean verify -B -q

      - name: Agent execution summary
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "Agent Execution Summary (Windows)"
          Write-Host "================================"
          Write-Host "Maven Version: 3.9.6 (Manually Installed)"
          Write-Host "Firewall: ACTIVE"
          Write-Host "Warning Fix: Valid Inputs Only"
          Write-Host "================================"

  agent-linux:
    name: Run Agent on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # [Security] Firewall Upgrade
      - name: Upgrade Firewall Software (UFW)
        run: |
          echo "Upgrading UFW package..."
          sudo apt-get update && sudo apt-get install --only-upgrade ufw -y

      # [Cache] Restore Maven Cache
      - name: Restore Maven Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # [Setup] Java 17 (Maven version option removed)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # [NEW] Explicit Install of Maven 3.9.6
      - name: Install Maven 3.9.6 Manually
        run: |
          echo "Downloading Maven 3.9.6..."
          wget -q https://archive.apache.org/dist/maven/maven-3/3.9.6/binaries/apache-maven-3.9.6-bin.tar.gz
          
          echo "Extracting Maven..."
          tar -xzf apache-maven-3.9.6-bin.tar.gz
          
          echo "Adding Maven to PATH..."
          echo "$PWD/apache-maven-3.9.6/bin" >> $GITHUB_PATH
          
          echo "Maven 3.9.6 Installation Completed"

      - name: Check Maven Version
        run: mvn -version

      # [Massive] Bulk Download
      - name: Massive Download of Maven Dependencies
        run: |
          echo "Starting Massive Maven Resource Download..."
          
          # 1. Resolve Project Dependencies
          mvn dependency:resolve -B
          
          # 2. Resolve All Plugins
          mvn dependency:resolve-plugins -B
          
          # 3. Download Sources
          mvn dependency:sources -B -Dmaven.test.skip=true
          
          # 4. Go Offline check
          mvn dependency:go-offline -B
          
          echo "Massive Download Completed."

      - name: Configure Linux Firewall (UFW)
        run: |
          echo "Configuring Linux Firewall (UFW)..."
          sudo apt-get install -y ufw
          sudo ufw --force default deny incoming
          sudo ufw --force default allow outgoing
          sudo ufw --force enable
          
          sudo ufw allow 80/tcp comment 'Allow HTTP'
          sudo ufw allow 443/tcp comment 'Allow HTTPS'
          sudo ufw allow 22/tcp comment 'Allow SSH'
          sudo ufw allow out 53 comment 'Allow DNS'
          
          sudo ufw reload

      - name: Verify build works after firewall configuration
        run: |
          mvn clean verify -B -q

      - name: Agent execution summary
        run: |
          echo "================================"
          echo "Agent Execution Summary (Linux)"
          echo "================================"
          echo "Maven Version: 3.9.6 (Manually Installed)"
          echo "Firewall: ACTIVE"
          echo "Warning Fix: Valid Inputs Only"
          echo "================================"

  agent-validation:
    name: Validate Agent Configuration
    runs-on: ubuntu-latest
    needs: [agent-windows, agent-linux]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Final validation summary
        run: |
          echo "================================"
          echo "Complete Agent Validation Summary"
          echo "================================"
          echo "Agents: Windows & Linux PASSED"
          echo "Maven Install: MANUAL (v3.9.6)"
          echo "Warnings: FIXED"
          echo "================================"
