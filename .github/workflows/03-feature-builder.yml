name: 🏗️ Feature Builder (Dispatch)
on:
  workflow_dispatch:
    inputs:
      requirement:
        description: '구현할 기능 설명 (예: 로그인 페이지에 구글 OAuth 추가)'
        required: true
      branch_name:
        description: '생성할 브랜치 이름'
        required: true
        default: 'feature/claude-gen'

jobs:
  build-feature:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
      
      - uses: ./.github/actions/setup-claude
        with:
          anthropic-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Configure Git
        run: |
          git config --global user.name "Claude Bot"
          git config --global user.email "claude@anthropic.com"

      - name: Create Branch & Code
        run: |
          git checkout -b ${{ inputs.branch_name }}
          
          # Claude에게 코딩 지시
          claude -p "
            ${{ inputs.requirement }}
            
            위 요구사항을 구현해줘.
            필요한 파일을 생성하거나 수정하고,
            테스트 코드도 가능하면 작성해줘.
          "
          
          # 변경 사항 확인 및 커밋
          git add .
          
          # Claude에게 커밋 메시지 작성 요청
          COMMIT_MSG=$(git diff --staged | claude -p "Generate a concise commit message for these changes")
          git commit -m "$COMMIT_MSG"
          git push origin ${{ inputs.branch_name }}

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "✨ Feature: ${{ inputs.branch_name }}" \
            --body "Implemented by Claude Code based on prompt: ${{ inputs.requirement }}" \
            --head ${{ inputs.branch_name }} \
            --base main
