name: Hourly AI Security Briefing

on:
  schedule:
    - cron: '0 * * * *' # ⏰ 매 시간(Hourly) 0분에 자동 실행
  workflow_dispatch: # 수동 실행 버튼

jobs:
  security-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install AI & Translator Tools
        run: |
          python -m pip install --upgrade pip
          # 번역(deep-translator) 및 AI 검색(duckduckgo) 모듈 대량 설치
          pip install feedparser requests beautifulsoup4 lxml duckduckgo-search fake-useragent deep-translator

      - name: 🚀 Run Security Analyst Agent
        run: |
          python security_news.py

      - name: 📊 Real-time Dashboard (Summary)
        if: always()
        run: |
          if [ -f hourly_security_report.md ]; then
            cat hourly_security_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🚨 Create Hourly Alert Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🚨 [Hourly] AI Security Briefing - ${{ steps.date.outputs.date }}"
          content-filepath: ./hourly_security_report.md
          labels: |
            hourly-briefing
            security-alert
            auto-translated
