name: Copilot Agent - Data Integrity & Service Segmentation

on:
  schedule:
    - cron: '0 * * * *' # ⏰ 매 시간 실행
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write      # 💾 데이터 저장
  issues: write        # 🏷️ 라벨
  packages: write      # 🐳 GHCR 업로드
  pull-requests: write # 🔀 PR 자동화

jobs:
  # --------------------------------------------------------------------------------
  # 🖥️ Windows Agent
  # --------------------------------------------------------------------------------
  agent-windows:
    name: 🤖 Run Agent on Windows
    runs-on: windows-latest
    steps:
      - name: 📥 작업 설정
        uses: actions/checkout@v4
      - name: 🛡️ 시스템 검증
        shell: powershell
        run: Write-Host "[INIT] Ready for Data Migration & Service Ops."

  # --------------------------------------------------------------------------------
  # 🐧 Linux Agent: 데이터 수집 -> 마이그레이션 -> 분류 -> 배포
  # --------------------------------------------------------------------------------
  agent-linux-intelligence:
    name: 🧠 Service Node (Fixed)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
    
    steps:
      - name: 📥 소스 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: 🐍 Python 3.11 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 모듈 설치
        run: |
          python -m pip install --upgrade pip
          pip install feedparser aiohttp asyncio requests beautifulsoup4 lxml duckduckgo-search fake-useragent deep-translator pandas tabulate

      # ------------------------------------------------------------------
      # 🏷️ 라벨 초기화
      # ------------------------------------------------------------------
      - name: 🏷️ Initialize Labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🛠️ Creating Service Labels..."
          labels=(
            "automated:0E8A16:Automated process"
            "data-sync:1D76DB:Data synchronization"
            "svc-politics:D93F0B:Service: Politics"
            "svc-it:BFD4F2:Service: IT & GenAI"
            "svc-agri:2ECC71:Service: Agriculture"
            "svc-economy:FBCA04:Service: Economy"
            "svc-security:B60205:Service: Security"
          )
          for label_info in "${labels[@]}"; do
            IFS=':' read -r name color desc <<< "$label_info"
            gh label create "$name" --color "$color" --description "$desc" --force || echo "Label exists."
          done

      # ------------------------------------------------------------------
      # 🔥 AI 뉴럴 코어 (데이터 마이그레이션 로직 탑재)
      # ------------------------------------------------------------------
      - name: 🧬 Generate Service Core (Fixed)
        run: |
          cat << 'EOF' > ai_neural_core.py
          import asyncio, aiohttp, feedparser, os, json, re, gzip
          from datetime import datetime
          from fake_useragent import UserAgent

          # [설정] 디렉토리 구조
          DB_DIR = "DB"
          SERVICES_DIR = os.path.join(DB_DIR, "services")
          MEMORY_FILE = os.path.join(DB_DIR, "neural_memory.json.gz")
          CATALOG_FILE = os.path.join(DB_DIR, "service_catalog.json")
          REPORT_FILE = "latest_briefing.md"
          
          # 카테고리 매핑
          KEYWORD_MAP = {
              "🏛️ Politics": {
                  "keywords": ["정치", "국회", "대통령", "총선", "정책", "외교"],
                  "filename": "service_politics.json"
              },
              "💻 IT & GenAI": {
                  "keywords": ["IT", "AI", "생성형 AI", "ChatGPT", "Gemini", "반도체", "클라우드"],
                  "filename": "service_it_genai.json"
              },
              "🌾 Agriculture": {
                  "keywords": ["농산물", "식량", "스마트팜", "배추", "과일", "농업", "물가"],
                  "filename": "service_agriculture.json"
              },
              "💰 Economy": {
                  "keywords": ["경제", "주식", "금리", "부동산", "삼성전자", "환율"],
                  "filename": "service_economy.json"
              },
              "🛡️ Security": {
                  "keywords": ["보안", "해킹", "랜섬웨어", "정보유출", "제로데이"],
                  "filename": "service_security.json"
              }
          }
          
          def generate_sources():
              urls = []
              for category, info in KEYWORD_MAP.items():
                  for kw in info['keywords']:
                      urls.append({
                          "url": f"https://news.google.com/rss/search?q={kw}&hl=ko&gl=KR&ceid=KR:ko", 
                          "tag": kw,
                          "category": category
                      })
              return urls

          def init_fs():
              if not os.path.exists(DB_DIR): os.makedirs(DB_DIR)
              if not os.path.exists(SERVICES_DIR): os.makedirs(SERVICES_DIR)

          def load_memory():
              try:
                  if os.path.exists(MEMORY_FILE):
                      with gzip.open(MEMORY_FILE, 'rt', encoding='utf-8') as f:
                          return json.load(f)
              except: pass
              return []

          def save_segmented_services(all_data):
              # 1. 원본 저장
              with gzip.open(MEMORY_FILE, 'wt', encoding='utf-8') as f:
                  json.dump(all_data, f)
              
              # 2. 서비스별 분리 저장
              catalog_info = {}
              for category, info in KEYWORD_MAP.items():
                  filtered = [item for item in all_data if item.get('category') == category]
                  file_path = os.path.join(SERVICES_DIR, info['filename'])
                  with open(file_path, 'w', encoding='utf-8') as f:
                      json.dump(filtered, f, indent=2, ensure_ascii=False)
                  catalog_info[category] = {"file": f"services/{info['filename']}", "count": len(filtered)}

              # 3. 카탈로그 생성
              with open(CATALOG_FILE, 'w', encoding='utf-8') as f:
                  json.dump({"meta": {"updated": datetime.now().isoformat()}, "services": catalog_info}, f, indent=2)

          async def fetch_feed(session, source):
              try:
                  async with session.get(source['url'], timeout=15) as response:
                      if response.status != 200: return []
                      data = await response.read()
                      parsed = feedparser.parse(data)
                      for entry in parsed.entries: 
                          entry['source_tag'] = source['tag']
                          entry['category'] = source['category']
                      return parsed.entries
              except: return []

          async def main_intelligence():
              print("🚀 Service Engine Running with Migration Fix...")
              init_fs()
              
              raw_memory = load_memory()
              memory_list = []
              memory_links = set()

              # 🛠️ [FIX] 데이터 마이그레이션 (String -> Dict 변환)
              # 구버전 데이터(단순 문자열 URL)가 섞여있을 경우 자동으로 변환하여 에러 방지
              print(f"📊 Loading Memory: {len(raw_memory)} items found.")
              
              for item in raw_memory:
                  if isinstance(item, str):
                      # 구버전 데이터 처리
                      if item not in memory_links:
                          memory_links.add(item)
                          memory_list.append({
                              "link": item,
                              "title": "Legacy Archived Data",
                              "tag": "Legacy",
                              "category": "Unknown",
                              "timestamp": datetime.now().isoformat()
                          })
                  elif isinstance(item, dict) and 'link' in item:
                      # 신버전 데이터 처리
                      if item['link'] not in memory_links:
                          memory_links.add(item['link'])
                          memory_list.append(item)
              
              print(f"✅ Migration Complete. Validated {len(memory_list)} records.")

              sources = generate_sources()
              new_items = []
              ua = UserAgent()
              headers = {'User-Agent': ua.random}
              
              async with aiohttp.ClientSession(headers=headers) as session:
                  tasks = [fetch_feed(session, src) for src in sources]
                  results = await asyncio.gather(*tasks)
                  
                  for entries in results:
                      for entry in entries:
                          if entry.link in memory_links: continue
                          memory_links.add(entry.link)
                          
                          item = {
                              "title": entry.title,
                              "link": entry.link,
                              "tag": entry.get('source_tag', 'General'),
                              "category": entry.get('category', 'Unknown'),
                              "timestamp": datetime.now().isoformat()
                          }
                          new_items.append(item)
                          memory_list.append(item)

              if new_items:
                  save_segmented_services(memory_list)
                  
                  briefing = f"### 🏭 Service Report (New: {len(new_items)})\n\n| Service | File | New Items |\n|---|---|---|\n"
                  for cat, info in KEYWORD_MAP.items():
                      count = len([x for x in new_items if x['category'] == cat])
                      briefing += f"| {cat} | `{info['filename']}` | {count} |\n"
                  
                  with open(REPORT_FILE, 'w', encoding='utf-8') as f: f.write(briefing)
              else:
                  with open(REPORT_FILE, 'w', encoding='utf-8') as f: f.write("### 💤 No new data.")

          if __name__ == "__main__":
              asyncio.run(main_intelligence())
          EOF
          
          python ai_neural_core.py

      # ------------------------------------------------------------------
      # 🔀 Git 커밋
      # ------------------------------------------------------------------
      - name: 🌿 Create Branch & Commit
        id: git_ops
        run: |
          BRANCH_NAME="service-update/$(date +'%Y%m%d-%H%M')"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          git config --global user.name "Copilot AI Bot"
          git config --global user.email "ai-bot@github.actions"
          
          git checkout -b $BRANCH_NAME
          git add DB/
          
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "🏭 Data Migration & Service Load: $(date +'%Y-%m-%d %H:%M')"
            git push origin $BRANCH_NAME
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------
      # 🔀 PR 생성
      # ------------------------------------------------------------------
      - name: 🔀 Create & Merge PR
        if: steps.git_ops.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.git_ops.outputs.branch_name }}"
          gh pr create \
            --title "🏭 Service Data Fix [$(date +'%Y-%m-%d %H:%M')]" \
            --body "Migrated legacy string data to objects and separated services." \
            --head $BRANCH_NAME \
            --base main \
            --label "automated" \
            --label "svc-it" \
            --label "svc-politics"
          
          gh pr merge --auto --squash --delete-branch "$BRANCH_NAME"

      # ------------------------------------------------------------------
      # 🏷️ 태그
      # ------------------------------------------------------------------
      - name: 🏷️ Generate Version Tag
        id: tagger
        run: |
          echo "version=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # 🐳 Dockerfile
      # ------------------------------------------------------------------
      - name: 🐳 Generate Segmentation Dockerfile
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          RUN apt-get update && apt-get upgrade -y && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          RUN pip install --upgrade pip && \
              pip install feedparser aiohttp asyncio requests beautifulsoup4 lxml duckduckgo-search fake-useragent
          COPY . /app
          RUN echo "📊 Verifying Services..." && ls -lh /app/DB/services/
          LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          LABEL org.opencontainers.image.description="Segmented Data Services Container"
          CMD ["python", "ai_neural_core.py"]
          EOF

      # ------------------------------------------------------------------
      # 🐳 GHCR 업로드
      # ------------------------------------------------------------------
      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Build and Push Service Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.tagger.outputs.repo_lower }}:${{ steps.tagger.outputs.version }}
            ghcr.io/${{ steps.tagger.outputs.repo_lower }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Segmented Service Data

      # ------------------------------------------------------------------
      # 🖥️ 대시보드
      # ------------------------------------------------------------------
      - name: 🖥️ Display Segmentation Dashboard
        if: always()
        run: |
          echo "## 🏭 Service Segmentation Dashboard" >> $GITHUB_STEP_SUMMARY
          
          echo "| Domain | File | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          
          for file in service_politics.json service_it_genai.json service_agriculture.json service_economy.json service_security.json; do
            if [ -f "DB/services/$file" ]; then STAT="✅ Ready"; else STAT="❌ Wait"; fi
            echo "| **$file** | \`DB/services/$file\` | $STAT |" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f latest_briefing.md ]; then cat latest_briefing.md >> $GITHUB_STEP_SUMMARY; fi

      # ------------------------------------------------------------------
      # 🚀 릴리즈
      # ------------------------------------------------------------------
      - name: 🚀 Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ steps.tagger.outputs.version }}
          name: "🏭 Segmented Service Batch ${{ steps.tagger.outputs.version }}"
          body_path: latest_briefing.md
          files: |
            latest_briefing.md
            DB/service_catalog.json
            DB/services/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
