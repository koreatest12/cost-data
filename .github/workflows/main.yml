name: Copilot Agent - Tax Season Security Special

on:
  schedule:
    - cron: '0 * * * *' # ⏰ 매 시간 실행 (연말정산 기간 집중 모니터링)
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: write  # 💾 DB 및 릴리즈 저장 권한
  issues: write

jobs:
  # --------------------------------------------------------------------------------
  # 🖥️ Windows Agent: 실행 환경 검증 (텍스트 태그 사용)
  # --------------------------------------------------------------------------------
  agent-windows:
    name: 🤖 Run Agent on Windows
    runs-on: windows-latest
    steps:
      - name: 📥 작업 설정
        uses: actions/checkout@v4

      - name: 🛡️ 보안 환경 검증
        shell: powershell
        run: |
          Write-Host "[SCAN] Scanning Windows Security Environment..."
          Write-Host "[OK] Firewall Service: ACTIVE"

      - name: 🚀 Copilot 에이전트 기동 확인
        shell: powershell
        run: |
          Write-Host "[INIT] Initializing Copilot Agent Swarm..."
          Write-Host " -> [ONLINE] Agent Unit #1 - Systems Normal."

  # --------------------------------------------------------------------------------
  # 🐧 Linux Agent: 연말정산 보안 이슈 집중 분석 및 데이터 누적
  # --------------------------------------------------------------------------------
  agent-linux-intelligence:
    name: 🧠 AI Intelligence Node (Tax Special)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    
    steps:
      - name: 📥 소스 코드 체크아웃 (전체 히스토리)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: 🐍 Python 3.11 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 AI 학습 도구 대량 설치
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 lxml duckduckgo-search fake-useragent deep-translator pandas tabulate

      # ------------------------------------------------------------------
      # 🔥 [핵심] AI 뉴럴 코어 (연말정산 감시 로직 추가)
      # ------------------------------------------------------------------
      - name: 🧬 Generate & Run AI Neural Core
        run: |
          # 파이썬 스크립트 생성
          cat << 'EOF' > ai_neural_core.py
          import feedparser, requests, os, json, time, re, random
          from datetime import datetime
          from fake_useragent import UserAgent
          from deep_translator import GoogleTranslator
          import urllib3

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          # --- [설정] ---
          DB_DIR = "DB"
          MEMORY_FILE = os.path.join(DB_DIR, "neural_memory.json") # 학습된 URL 기억
          LOG_FILE = os.path.join(DB_DIR, "knowledge_base.md")     # 누적 지식 데이터
          REPORT_FILE = "latest_briefing.md"

          # [NEW] 연말정산 키워드 정의
          TAX_KEYWORDS = ["연말정산", "국세청", "홈택스", "소득공제", "세금", "Year-end", "Tax", "환급", "세무", "Hometax"]

          # 소스 대량 확장
          RSS_SOURCES = {
              "🚨 Critical": [
                  {"url": "https://www.cisa.gov/uscert/ncas/alerts.xml", "lang": "en"},
                  {"url": "https://www.microsoft.com/security/blog/feed/", "lang": "en"}
              ],
              "🇰🇷 Tax & Finance (Season)": [
                  {"url": "https://www.boannews.com/media/news_rss.xml", "lang": "ko"}, # 보안뉴스 (스미싱 주타겟)
                  {"url": "https://www.dailysecu.com/rss/allArticle.xml", "lang": "ko"}, # 데일리시큐
                  {"url": "https://rss.etnews.com/04045.xml", "lang": "ko"}, # 전자신문 (시스템 장애 등)
                  {"url": "https://www.ddaily.co.kr/rss/?section_id=10", "lang": "ko"} # 디지털데일리
              ],
              "🌍 Global": [
                  {"url": "https://feeds.feedburner.com/TheHackersNews", "lang": "en"},
                  {"url": "https://www.bleepingcomputer.com/feed/", "lang": "en"}
              ]
          }

          # --- [함수] ---
          def init_memory():
              if not os.path.exists(DB_DIR): os.makedirs(DB_DIR)
              if not os.path.exists(MEMORY_FILE):
                  with open(MEMORY_FILE, 'w') as f: json.dump([], f)

          def load_memory():
              try:
                  with open(MEMORY_FILE, 'r') as f: return set(json.load(f))
              except: return set()

          def save_memory(data):
              with open(MEMORY_FILE, 'w') as f: json.dump(list(data), f)

          def translate(text):
              try: return GoogleTranslator(source='auto', target='ko').translate(text)
              except: return text

          def clean_html(raw):
              return re.sub(r'<[^>]+>', '', raw).strip()[:200] + "..."

          def get_session():
              s = requests.Session()
              try: s.headers.update({'User-Agent': UserAgent().random})
              except: s.headers.update({'User-Agent': 'Mozilla/5.0'})
              return s

          def is_tax_related(text):
              return any(keyword in text for keyword in TAX_KEYWORDS)

          # --- [실행 로직] ---
          def run_intelligence():
              print("🤖 AI Neural Core Initialized (Tax Season Mode)...")
              init_memory()
              memory = load_memory()
              
              # 섹션별 버퍼
              tax_buffer = ""      # 연말정산 전용 섹션
              general_buffer = ""  # 일반 보안 뉴스
              
              knowledge_buffer = f"\n## 📅 Update: {datetime.now().strftime('%Y-%m-%d %H:%M')}\n"
              new_items_count = 0
              tax_items_count = 0

              session = get_session()

              for category, feeds in RSS_SOURCES.items():
                  print(f"📡 Scanning Sector: {category}...")
                  
                  for feed in feeds:
                      try:
                          resp = session.get(feed['url'], timeout=10, verify=False)
                          parsed = feedparser.parse(resp.content)
                          if not parsed.entries: parsed = feedparser.parse(resp.text)
                          
                          # [확장] 더 깊이 탐색 (최신 5개)
                          for entry in parsed.entries[:5]: 
                              if entry.link in memory: continue 
                              
                              # 신규 데이터 발견
                              memory.add(entry.link)
                              new_items_count += 1
                              
                              title = entry.title
                              summary = clean_html(getattr(entry, 'summary', ''))
                              
                              # 번역
                              if feed['lang'] == 'en':
                                  title = f"[번역] {translate(title)}"
                                  if summary: summary = translate(summary[:100]) + "..."
                              
                              item_md = f"- **[{title}]({entry.link})**\n  - {summary}\n\n"
                              
                              # [핵심] 연말정산 분류 로직
                              full_text = title + " " + summary
                              if is_tax_related(full_text):
                                  tax_buffer += item_md
                                  tax_items_count += 1
                                  item_md = "🧾 (Tax Security) " + item_md # 지식베이스엔 태그 추가
                              else:
                                  general_buffer += item_md

                              # 지식베이스 누적
                              knowledge_buffer += item_md

                      except Exception as e:
                          print(f"⚠️ Error reading feed: {e}")

              # 리포트 조합
              final_report = ""
              
              # 1. 연말정산 섹션 (최상단 노출)
              if tax_buffer:
                  final_report += "## 🧾 🔥 긴급: 연말정산 보안 위협 (Tax Season Alert)\n"
                  final_report += "> ⚠️ 국세청 사칭 스미싱 및 악성 파일 주의!\n\n"
                  final_report += tax_buffer
                  final_report += "---\n\n"
              
              # 2. 일반 뉴스 섹션
              if general_buffer:
                  final_report += "## 🌍 최신 보안 브리핑\n" + general_buffer

              # 변경사항 저장
              if new_items_count > 0:
                  save_memory(memory)
                  
                  # 누적 데이터 파일에 추가
                  with open(LOG_FILE, 'a', encoding='utf-8') as f:
                      f.write(knowledge_buffer)
                      
                  # 이번 릴리즈용 리포트 생성
                  header = f"# 🤖 AI Security Briefing (Tax Season)\n> 🧠 Memory: {len(memory)} | 🆕 Total: {new_items_count} | 🧾 Tax Alerts: {tax_items_count}\n\n"
                  with open(REPORT_FILE, 'w', encoding='utf-8') as f:
                      f.write(header + final_report)
                      
                  print(f"✅ Learning Complete. New: {new_items_count}, Tax Related: {tax_items_count}")
              else:
                  with open(REPORT_FILE, 'w', encoding='utf-8') as f:
                      f.write("# 🤖 AI Status Report\n\n> 💤 No new patterns detected.")
                  print("💤 No new data to learn.")

          if __name__ == "__main__":
              run_intelligence()
          EOF
          
          # 실행
          python ai_neural_core.py

      # ------------------------------------------------------------------
      # 💾 학습 데이터 영구 저장 (Git Commit & Push)
      # ------------------------------------------------------------------
      - name: 💾 Commit AI Memory (Save Learning)
        run: |
          git config --global user.name "Copilot AI Bot"
          git config --global user.email "ai-bot@github.actions"
          
          git add DB/
          
          git commit -m "🧠 AI Neural Upgrade: Memory Expanded [$(date +'%Y-%m-%d %H:%M')]" || echo "No memory updates needed."
          git push

      # ------------------------------------------------------------------
      # 🏷️ 날짜 태그 생성 (422 에러 방지)
      # ------------------------------------------------------------------
      - name: 🏷️ Generate Version Tag
        id: tagger
        shell: bash
        run: |
          echo "version=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # 🖥️ 로봇 대시보드 출력 (연말정산 카운트 포함)
      # ------------------------------------------------------------------
      - name: 🖥️ Display Robot Dashboard
        if: always()
        run: |
          echo "## 🤖 Copilot Agent Status Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "| System | Status | Mode | Memory |" >> $GITHUB_STEP_SUMMARY
          echo "| :---: | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| **Neural Core** | 🟢 **ONLINE** | **🧾 Tax Season** | **$(jq length DB/neural_memory.json 2>/dev/null || echo 0)** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f latest_briefing.md ]; then
            cat latest_briefing.md >> $GITHUB_STEP_SUMMARY
          fi

      # ------------------------------------------------------------------
      # 🚀 릴리즈 생성 (패키지 배포)
      # ------------------------------------------------------------------
      - name: 🚀 Release AI Agent Package
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ steps.tagger.outputs.version }}
          name: "🧾 Tax Season Security Briefing ${{ steps.tagger.outputs.version }}"
          body_path: latest_briefing.md
          files: |
            latest_briefing.md
            DB/knowledge_base.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
