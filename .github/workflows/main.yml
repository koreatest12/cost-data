name: Hourly Cumulative Security Briefing

on:
  schedule:
    - cron: '0 * * * *' # 매 시간 실행
  workflow_dispatch:

permissions:
  contents: write # ⭐️ DB 저장을 위해 쓰기 권한 필수
  issues: write

jobs:
  security-archiving:
    name: 🔄 Collect & Archive
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 히스토리 유지를 위해 전체 가져오기

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 lxml duckduckgo-search fake-useragent deep-translator

      - name: 🔄 Run Cumulative Collector
        run: python security_news.py

      # [NEW] ⭐️ DB 변경사항(누적된 뉴스)을 저장소에 반영
      - name: 💾 Commit & Push DB Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # DB 폴더와 JSON 파일 추가
          git add DB/
          
          # 변경사항이 있을 때만 커밋
          git commit -m "🗄️ Update Security News DB [$(date +'%Y-%m-%d %H:%M')]" || echo "No changes to commit"
          git push

      - name: 🏷️ Generate Version Tag
        id: tagger
        run: echo "version=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: 🚀 Create Release (Hourly Snapshot)
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ steps.tagger.outputs.version }}
          name: "🛡️ Security Briefing ${{ steps.tagger.outputs.version }}"
          body_path: hourly_security_report.md
          files: hourly_security_report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚨 Create Issue (Notification)
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🚨 [Update] Security News - ${{ steps.tagger.outputs.version }}"
          content-filepath: ./hourly_security_report.md
          labels: |
            security-update
            automated
