name: AI Powered Security News

on:
  schedule:
    - cron: '0 23 * * *' # 매일 아침 8시 (KST)
  workflow_dispatch:

jobs:
  ai-analysis:
    name: 🤖 AI Security Analyst
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install AI & Network Tools
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🚀 Run AI Analysis Engine
        run: python security_news.py

      # (옵션) 이슈로도 남기고 싶다면 유지, 화면만 보고 싶다면 삭제 가능
      - name: 📝 Save to GitHub Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🤖 AI Security Report - ${{ steps.date.outputs.date }}"
          content-filepath: ./daily_security_report.md
          labels: |
            ai-report
            security
