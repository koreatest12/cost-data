name: Hourly Security Release & Package

on:
  schedule:
    - cron: '0 * * * *' # ⏰ 매 시간 0분에 실행
  workflow_dispatch: # 수동 실행

permissions:
  contents: write  # 릴리즈 생성을 위해 쓰기 권한 필수
  issues: write    # 이슈 생성을 위해 쓰기 권한 필수

jobs:
  security-release:
    name: 🚀 Build, Package & Release
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # 2. 파이썬 환경 설정
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. 필수 도구 대량 설치
      - name: 📦 Install AI & Tools
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 lxml duckduckgo-search fake-useragent deep-translator

      # 4. 보안 분석 에이전트 실행
      - name: 🤖 Run Security Analyst
        run: python security_news.py

      # 5. [NEW] 버전 태그 생성 (예: v2026.01.11-1800)
      - name: 🏷️ Generate Version Tag
        id: tagger
        run: |
          echo "version=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "date_str=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      # 6. [NEW] 아티팩트 패키징 (압축 저장)
      - name: 📦 Upload Artifact Package
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ steps.tagger.outputs.version }}
          path: hourly_security_report.md
          retention-days: 90 # 90일간 보관

      # 7. [NEW] GitHub Release 정식 출시 (파일 첨부)
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: success() # 성공했을 때만 릴리즈
        with:
          tag_name: ${{ steps.tagger.outputs.version }}
          name: "🛡️ Security Briefing ${{ steps.tagger.outputs.version }}"
          body_path: hourly_security_report.md
          draft: false
          prerelease: false
          files: |
            hourly_security_report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8. 대시보드(Summary) 출력
      - name: 📊 Dashboard Summary
        if: always()
        run: |
          if [ -f hourly_security_report.md ]; then
            echo "### 🚀 Release Created: ${{ steps.tagger.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            cat hourly_security_report.md >> $GITHUB_STEP_SUMMARY
          fi

      # 9. (선택) 이슈 생성 알림
      - name: 🚨 Create Alert Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🚨 [Release] Security Report ${{ steps.tagger.outputs.version }}"
          content-filepath: ./hourly_security_report.md
          labels: |
            security-release
            automated
            package-launch
