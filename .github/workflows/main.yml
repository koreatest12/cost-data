name: Copilot Agent - Data Loader & Service Injection

on:
  schedule:
    - cron: '0 * * * *' # ⏰ 매 시간 실행 (데이터 적재)
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write      # 💾 코드, 태그, DB 저장
  issues: write        # 🏷️ 라벨 및 이슈
  packages: write      # 🐳 GHCR 업로드
  pull-requests: write # 🔀 PR 자동화

jobs:
  # --------------------------------------------------------------------------------
  # 🖥️ Windows Agent
  # --------------------------------------------------------------------------------
  agent-windows:
    name: 🤖 Run Agent on Windows
    runs-on: windows-latest
    steps:
      - name: 📥 작업 설정
        uses: actions/checkout@v4
      - name: 🛡️ 시스템 검증
        shell: powershell
        run: Write-Host "[INIT] Ready for Service Data Loading."

  # --------------------------------------------------------------------------------
  # 🐧 Linux Agent: 데이터 수집 -> 카탈로그 생성 -> 서비스 적재 -> 도커 배포
  # --------------------------------------------------------------------------------
  agent-linux-intelligence:
    name: 🧠 Data Loader Node
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
    
    steps:
      - name: 📥 소스 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: 🐍 Python 3.11 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 모듈 설치
        run: |
          python -m pip install --upgrade pip
          pip install feedparser aiohttp asyncio requests beautifulsoup4 lxml duckduckgo-search fake-useragent deep-translator pandas tabulate

      # ------------------------------------------------------------------
      # 🏷️ 라벨 초기화
      # ------------------------------------------------------------------
      - name: 🏷️ Initialize Labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🛠️ Creating Service Labels..."
          labels=(
            "automated:0E8A16:Automated process"
            "data-sync:1D76DB:Data synchronization"
            "service-loader:0052CC:Data injected to services"
            "agriculture:2ECC71:Agriculture"
            "politics:D93F0B:Politics"
            "it-genai:BFD4F2:IT & GenAI"
          )
          for label_info in "${labels[@]}"; do
            IFS=':' read -r name color desc <<< "$label_info"
            gh label create "$name" --color "$color" --description "$desc" --force || echo "Label exists."
          done

      # ------------------------------------------------------------------
      # 🔥 AI 뉴럴 코어 (서비스 적재 로직 추가)
      # ------------------------------------------------------------------
      - name: 🧬 Generate Data Loader Core
        run: |
          cat << 'EOF' > ai_neural_core.py
          import asyncio, aiohttp, feedparser, os, json, re, gzip
          from datetime import datetime
          from fake_useragent import UserAgent

          # [설정] 데이터 적재 경로
          DB_DIR = "DB"
          MEMORY_FILE = os.path.join(DB_DIR, "neural_memory.json.gz") # 원본 데이터
          CATALOG_FILE = os.path.join(DB_DIR, "service_catalog.json") # 서비스용 메타데이터
          REPORT_FILE = "latest_briefing.md"
          
          # [핵심] 다분야 키워드 맵
          KEYWORD_MAP = {
              "🏛️ Politics": ["정치", "국회", "대통령", "총선", "정책", "외교"],
              "💻 IT & GenAI": ["IT", "AI", "생성형 AI", "ChatGPT", "Gemini", "반도체", "클라우드"],
              "🌾 Agriculture": ["농산물", "식량", "스마트팜", "배추", "과일", "농업", "물가"],
              "💰 Economy": ["경제", "주식", "금리", "부동산", "삼성전자", "환율"],
              "🛡️ Security": ["보안", "해킹", "랜섬웨어", "정보유출", "제로데이"]
          }
          
          def generate_sources():
              urls = []
              for category, keywords in KEYWORD_MAP.items():
                  for kw in keywords:
                      urls.append({
                          "url": f"https://news.google.com/rss/search?q={kw}&hl=ko&gl=KR&ceid=KR:ko", 
                          "tag": kw,
                          "category": category
                      })
              return urls

          def init_db():
              if not os.path.exists(DB_DIR): os.makedirs(DB_DIR)

          def load_memory():
              try:
                  if os.path.exists(MEMORY_FILE):
                      with gzip.open(MEMORY_FILE, 'rt', encoding='utf-8') as f:
                          return set(json.load(f))
              except: pass
              return set()

          def save_to_services(memory_data, new_items):
              # 1. 원본 데이터 압축 저장 (DB 적재)
              with gzip.open(MEMORY_FILE, 'wt', encoding='utf-8') as f:
                  json.dump(list(memory_data), f)
              
              # 2. 서비스 카탈로그 생성 (Service Loading)
              # 외부 서비스나 도커 컨테이너가 쉽게 읽을 수 있는 요약본 생성
              catalog = {
                  "last_updated": datetime.now().isoformat(),
                  "total_records": len(memory_data),
                  "new_batch_size": len(new_items),
                  "categories": list(KEYWORD_MAP.keys()),
                  "latest_items": new_items[:20] # 최신 20개만 샘플링
              }
              with open(CATALOG_FILE, 'w', encoding='utf-8') as f:
                  json.dump(catalog, f, indent=2, ensure_ascii=False)
              
              print(f"✅ Data Loaded to Service Catalog: {CATALOG_FILE}")

          async def fetch_feed(session, source):
              try:
                  async with session.get(source['url'], timeout=15) as response:
                      if response.status != 200: return []
                      data = await response.read()
                      parsed = feedparser.parse(data)
                      for entry in parsed.entries: 
                          entry['source_tag'] = source['tag']
                          entry['category'] = source['category']
                      return parsed.entries
              except: return []

          async def main_intelligence():
              print("🚀 Data Loader Engine Running...")
              init_db()
              memory = load_memory()
              sources = generate_sources()
              
              new_items = []
              ua = UserAgent()
              headers = {'User-Agent': ua.random}
              
              async with aiohttp.ClientSession(headers=headers) as session:
                  tasks = [fetch_feed(session, src) for src in sources]
                  results = await asyncio.gather(*tasks)
                  
                  for entries in results:
                      for entry in entries:
                          if entry.link in memory: continue
                          memory.add(entry.link)
                          new_items.append({
                              "title": entry.title,
                              "link": entry.link,
                              "tag": entry.get('source_tag', 'General'),
                              "category": entry.get('category', 'Unknown'),
                              "timestamp": datetime.now().isoformat()
                          })

              if new_items:
                  # [중요] 각 서비스(DB, Catalog, Docker)로 데이터 적재 실행
                  save_to_services(memory, new_items)
                  
                  # 화면 리포트 생성
                  category_order = ["🌾 Agriculture", "🏛️ Politics", "💻 IT & GenAI", "💰 Economy"]
                  briefing = f"### 🏭 Service Data Loader Report (New: {len(new_items)})\n\n"
                  briefing += "| Category | Tag | Headline |\n|---|---|---|\n"
                  sorted_items = sorted(new_items[:60], key=lambda x: category_order.index(x['category']) if x['category'] in category_order else 99)
                  for item in sorted_items:
                      briefing += f"| `{item['category']}` | `{item['tag']}` | {item['title']} |\n"
                  
                  with open(REPORT_FILE, 'w', encoding='utf-8') as f: f.write(briefing)
                  print(f"✅ Batch Processed: {len(new_items)} items loaded.")
              else:
                  with open(REPORT_FILE, 'w', encoding='utf-8') as f: f.write("### 💤 No new data to load.")

          if __name__ == "__main__":
              asyncio.run(main_intelligence())
          EOF
          
          python ai_neural_core.py

      # ------------------------------------------------------------------
      # 🔀 브랜치 생성 및 커밋 (DB 업데이트)
      # ------------------------------------------------------------------
      - name: 🌿 Create Branch & Commit
        id: git_ops
        run: |
          BRANCH_NAME="data-load/$(date +'%Y%m%d-%H%M')"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          git config --global user.name "Copilot AI Bot"
          git config --global user.email "ai-bot@github.actions"
          
          git checkout -b $BRANCH_NAME
          git add DB/
          
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "🏭 Data Loading: $(date +'%Y-%m-%d %H:%M')"
            git push origin $BRANCH_NAME
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------
      # 🔀 PR 생성 및 병합 (서비스 적재 라벨)
      # ------------------------------------------------------------------
      - name: 🔀 Create & Merge PR
        if: steps.git_ops.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.git_ops.outputs.branch_name }}"
          gh pr create \
            --title "🏭 Service Data Load [$(date +'%Y-%m-%d %H:%M')]" \
            --body "Data injected into Service Catalog and DB." \
            --head $BRANCH_NAME \
            --base main \
            --label "automated" \
            --label "service-loader"
          
          gh pr merge --auto --squash --delete-branch "$BRANCH_NAME"

      # ------------------------------------------------------------------
      # 🏷️ 버전 태그
      # ------------------------------------------------------------------
      - name: 🏷️ Generate Version Tag
        id: tagger
        run: |
          echo "version=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # 🐳 [핵심] Dockerfile (데이터 적재 검증 포함)
      # ------------------------------------------------------------------
      - name: 🐳 Generate Service-Ready Dockerfile
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          RUN apt-get update && apt-get upgrade -y && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          RUN pip install --upgrade pip && \
              pip install feedparser aiohttp asyncio requests beautifulsoup4 lxml duckduckgo-search fake-useragent
          
          # [Data Injection] DB 폴더(카탈로그 포함)를 컨테이너로 적재
          COPY . /app
          
          # [Validation] 데이터 적재 상태 검증
          RUN echo "📊 Verifying Service Data Injection..." && \
              ls -lh /app/DB/neural_memory.json.gz && \
              cat /app/DB/service_catalog.json && \
              echo "✅ Data Load Verified."
          
          LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          LABEL org.opencontainers.image.description="Service-Ready Data Container"
          
          CMD ["python", "ai_neural_core.py"]
          EOF

      # ------------------------------------------------------------------
      # 🐳 GHCR 업로드 (서비스 이미지 배포)
      # ------------------------------------------------------------------
      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Build and Push Service Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.tagger.outputs.repo_lower }}:${{ steps.tagger.outputs.version }}
            ghcr.io/${{ steps.tagger.outputs.repo_lower }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Service Data Loader

      # ------------------------------------------------------------------
      # 🖥️ 대시보드 (적재 현황)
      # ------------------------------------------------------------------
      - name: 🖥️ Display Loader Dashboard
        if: always()
        run: |
          echo "## 🏭 Service Data Loader Dashboard" >> $GITHUB_STEP_SUMMARY
          
          if [ -f DB/neural_memory.json.gz ]; then
            COUNT=$(python -c "import gzip, json; print(len(json.load(gzip.open('DB/neural_memory.json.gz', 'rt'))))")
          else
            COUNT=0
          fi
          
          echo "| System | Total Records | Catalog Status | Docker |" >> $GITHUB_STEP_SUMMARY
          echo "| :---: | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          # 카탈로그 파일 존재 여부 체크
          if [ -f DB/service_catalog.json ]; then CAT="✅ Created"; else CAT="❌ Missing"; fi
          echo "| **Loader** | **$COUNT** | **$CAT** | \`ghcr.io/...:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f latest_briefing.md ]; then
            cat latest_briefing.md >> $GITHUB_STEP_SUMMARY
          fi

      # ------------------------------------------------------------------
      # 🚀 릴리즈
      # ------------------------------------------------------------------
      - name: 🚀 Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ steps.tagger.outputs.version }}
          name: "🏭 Service Data Batch ${{ steps.tagger.outputs.version }}"
          body_path: latest_briefing.md
          files: |
            latest_briefing.md
            DB/service_catalog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
