name: Copilot Agent - Multi-Domain Data Lake (Politics, IT, Agri)

on:
  schedule:
    - cron: '0 * * * *' # ⏰ 매 시간 실행
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write      # 💾 코드 및 태그
  issues: write        # 🏷️ 라벨 및 이슈
  packages: write      # 🐳 GHCR 업로드
  pull-requests: write # 🔀 PR 생성 및 병합

jobs:
  # --------------------------------------------------------------------------------
  # 🖥️ Windows Agent
  # --------------------------------------------------------------------------------
  agent-windows:
    name: 🤖 Run Agent on Windows
    runs-on: windows-latest
    steps:
      - name: 📥 작업 설정
        uses: actions/checkout@v4
      - name: 🛡️ 시스템 검증
        shell: powershell
        run: Write-Host "[INIT] Ready for Multi-Domain Intelligence."

  # --------------------------------------------------------------------------------
  # 🐧 Linux Agent: 다분야 데이터 수집 -> PR -> 도커
  # --------------------------------------------------------------------------------
  agent-linux-intelligence:
    name: 🧠 Multi-Domain Node
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
    
    steps:
      - name: 📥 소스 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: 🐍 Python 3.11 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 모듈 설치
        run: |
          python -m pip install --upgrade pip
          pip install feedparser aiohttp asyncio requests beautifulsoup4 lxml duckduckgo-search fake-useragent deep-translator pandas tabulate

      # ------------------------------------------------------------------
      # 🏷️ 라벨 자동 생성 (농산물, 정치, IT 추가)
      # ------------------------------------------------------------------
      - name: 🏷️ Initialize Repository Labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🛠️ Creating Domain Labels..."
          labels=(
            "automated:0E8A16:Automated process"
            "data-sync:1D76DB:Data synchronization"
            "gen-ai:BFD4F2:Generative AI & IT"
            "politics:D93F0B:Politics & Policy"
            "agriculture:2ECC71:Agriculture & Food" # [NEW] 농산물 라벨
            "economy:FBCA04:Economy & Finance"
            "security-alert:B60205:Security critical alert"
          )
          for label_info in "${labels[@]}"; do
            IFS=':' read -r name color desc <<< "$label_info"
            gh label create "$name" --color "$color" --description "$desc" --force || echo "Label exists."
          done

      # ------------------------------------------------------------------
      # 🔥 AI 뉴럴 코어 (분야별 키워드 대량 확장)
      # ------------------------------------------------------------------
      - name: 🧬 Generate Async Neural Core
        run: |
          cat << 'EOF' > ai_neural_core.py
          import asyncio, aiohttp, feedparser, os, json, re, gzip
          from datetime import datetime
          from fake_useragent import UserAgent

          DB_DIR = "DB"
          MEMORY_FILE = os.path.join(DB_DIR, "neural_memory.json.gz")
          REPORT_FILE = "latest_briefing.md"
          
          # [핵심] 분야별 키워드 매핑 (카테고리화)
          KEYWORD_MAP = {
              "🏛️ Politics": [
                  "정치", "국회", "대통령", "총선", "여당", "야당", "법안", "행정", "외교", "정책"
              ],
              "💻 IT & GenAI": [
                  "IT", "AI", "생성형 AI", "ChatGPT", "Gemini", "반도체", "클라우드", 
                  "네이버", "카카오", "스타트업", "코딩", "LLM"
              ],
              "🌾 Agriculture": [
                  "농산물", "식량", "스마트팜", "배추", "과일", "쌀값", "농식품부", 
                  "농업", "축산", "기후변화", "장바구니 물가"
              ],
              "💰 Economy": [
                  "경제", "주식", "금리", "부동산", "환율", "삼성전자", "물가", "재테크"
              ],
              "🛡️ Security": [
                  "보안", "해킹", "랜섬웨어", "정보유출", "사이버 공격", "제로데이"
              ],
              "🌍 Society": [
                  "사회", "날씨", "교통", "사건사고", "환경"
              ]
          }
          
          def generate_sources():
              urls = []
              # 카테고리와 키워드를 조합하여 소스 생성
              for category, keywords in KEYWORD_MAP.items():
                  for kw in keywords:
                      # category 정보를 함께 담음
                      urls.append({
                          "url": f"https://news.google.com/rss/search?q={kw}&hl=ko&gl=KR&ceid=KR:ko", 
                          "tag": kw,
                          "category": category
                      })
              return urls

          def init_db():
              if not os.path.exists(DB_DIR): os.makedirs(DB_DIR)

          def load_memory():
              try:
                  if os.path.exists(MEMORY_FILE):
                      with gzip.open(MEMORY_FILE, 'rt', encoding='utf-8') as f:
                          return set(json.load(f))
              except: pass
              return set()

          def save_memory(data):
              with gzip.open(MEMORY_FILE, 'wt', encoding='utf-8') as f:
                  json.dump(list(data), f)

          async def fetch_feed(session, source):
              try:
                  async with session.get(source['url'], timeout=15) as response:
                      if response.status != 200: return []
                      data = await response.read()
                      parsed = feedparser.parse(data)
                      for entry in parsed.entries: 
                          entry['source_tag'] = source['tag']
                          entry['category'] = source['category']
                      return parsed.entries
              except: return []

          async def main_intelligence():
              print("🚀 Async Multi-Domain Core Running...")
              init_db()
              memory = load_memory()
              sources = generate_sources()
              
              new_items = []
              ua = UserAgent()
              headers = {'User-Agent': ua.random}
              
              async with aiohttp.ClientSession(headers=headers) as session:
                  tasks = [fetch_feed(session, src) for src in sources]
                  results = await asyncio.gather(*tasks)
                  
                  for entries in results:
                      for entry in entries:
                          if entry.link in memory: continue
                          memory.add(entry.link)
                          new_items.append({
                              "title": entry.title,
                              "link": entry.link,
                              "tag": entry.get('source_tag', 'General'),
                              "category": entry.get('category', 'Unknown')
                          })

              if new_items:
                  save_memory(memory)
                  
                  # 화면 출력용 리포트 (카테고리별 정렬)
                  # 우선순위: 농산물 -> 정치 -> IT -> 경제
                  category_order = ["🌾 Agriculture", "🏛️ Politics", "💻 IT & GenAI", "💰 Economy"]
                  
                  briefing = f"### 📰 Multi-Domain Briefing (New: {len(new_items)})\n\n"
                  briefing += "| Category | Tag | Headline |\n|---|---|---|\n"
                  
                  # 우선순위 카테고리 먼저 출력
                  sorted_items = sorted(new_items[:60], key=lambda x: category_order.index(x['category']) if x['category'] in category_order else 99)
                  
                  for item in sorted_items:
                      briefing += f"| `{item['category']}` | `{item['tag']}` | {item['title']} |\n"
                  
                  with open(REPORT_FILE, 'w', encoding='utf-8') as f: f.write(briefing)
                  print(f"✅ Bulk Processed: {len(new_items)} new items.")
              else:
                  with open(REPORT_FILE, 'w', encoding='utf-8') as f: f.write("### 💤 No new data.")

          if __name__ == "__main__":
              asyncio.run(main_intelligence())
          EOF
          
          python ai_neural_core.py

      # ------------------------------------------------------------------
      # 🔀 브랜치 생성 및 커밋
      # ------------------------------------------------------------------
      - name: 🌿 Create Branch & Commit
        id: git_ops
        run: |
          BRANCH_NAME="news-update/$(date +'%Y%m%d-%H%M')"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          git config --global user.name "Copilot AI Bot"
          git config --global user.email "ai-bot@github.actions"
          
          git checkout -b $BRANCH_NAME
          git add DB/
          
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "💤 No changes to commit."
          else
            git commit -m "🧠 Multi-Domain Data Injection: $(date +'%Y-%m-%d %H:%M')"
            git push origin $BRANCH_NAME
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------
      # 🔀 PR 생성 (다분야 라벨 적용)
      # ------------------------------------------------------------------
      - name: 🔀 Create & Merge Pull Request
        if: steps.git_ops.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.git_ops.outputs.branch_name }}"
          
          gh pr create \
            --title "🧠 Intelligence Update [$(date +'%Y-%m-%d %H:%M')]" \
            --body "Updates included: Politics, IT/GenAI, Agriculture, Economy." \
            --head $BRANCH_NAME \
            --base main \
            --label "automated" \
            --label "data-sync" \
            --label "agriculture" \
            --label "politics" \
            --label "gen-ai"
          
          gh pr merge --auto --squash --delete-branch "$BRANCH_NAME"
          
          echo "🎉 Merge Complete!"

      # ------------------------------------------------------------------
      # 🏷️ 버전 태그
      # ------------------------------------------------------------------
      - name: 🏷️ Generate Version Tag
        id: tagger
        run: |
          echo "version=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # 🐳 Dockerfile 생성
      # ------------------------------------------------------------------
      - name: 🐳 Generate Data-Lake Dockerfile
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          RUN apt-get update && apt-get upgrade -y && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          RUN pip install --upgrade pip && \
              pip install feedparser aiohttp asyncio requests beautifulsoup4 lxml duckduckgo-search fake-useragent
          COPY . /app
          RUN echo "📊 Checking Data..." && ls -lh /app/DB/neural_memory.json.gz
          LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          LABEL org.opencontainers.image.description="Multi-Domain Data Lake Container"
          CMD ["python", "ai_neural_core.py"]
          EOF

      # ------------------------------------------------------------------
      # 🐳 GHCR 로그인 및 업로드
      # ------------------------------------------------------------------
      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Build and Push Data Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.tagger.outputs.repo_lower }}:${{ steps.tagger.outputs.version }}
            ghcr.io/${{ steps.tagger.outputs.repo_lower }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Multi-Domain Data

      # ------------------------------------------------------------------
      # 🖥️ 화면 출력
      # ------------------------------------------------------------------
      - name: 🖥️ Display Dashboard
        if: always()
        run: |
          echo "## 🤖 Multi-Domain Dashboard" >> $GITHUB_STEP_SUMMARY
          
          if [ -f DB/neural_memory.json.gz ]; then
            COUNT=$(python -c "import gzip, json; print(len(json.load(gzip.open('DB/neural_memory.json.gz', 'rt'))))")
          else
            COUNT=0
          fi
          
          echo "| Status | Total Data | Docker Image |" >> $GITHUB_STEP_SUMMARY
          echo "| :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌍 **All Domains** | **$COUNT** | \`ghcr.io/...:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f latest_briefing.md ]; then
            cat latest_briefing.md >> $GITHUB_STEP_SUMMARY
          fi

      # ------------------------------------------------------------------
      # 🚀 릴리즈
      # ------------------------------------------------------------------
      - name: 🚀 Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ steps.tagger.outputs.version }}
          name: "🧠 Multi-Domain Batch ${{ steps.tagger.outputs.version }}"
          body_path: latest_briefing.md
          files: |
            latest_briefing.md
            DB/knowledge_base.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
