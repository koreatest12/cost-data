name: 🌌 Omni-Intelligence Grand Pipeline (Conflict Fixed)

on:
  schedule:
    - cron: '0 21 * * *' # ⏰ KST 06:00
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

env:
  TZ: 'Asia/Seoul'
  RETRY_MAX: 5
  REGISTRY: ghcr.io
  JAVA_OPTS: "-XX:+UseG1GC -Xmx2048m -Xms1024m -XX:+AlwaysPreTouch"

jobs:
  # ==============================================================================
  # 🛡️ 1. Security Engine
  # ==============================================================================
  security-core:
    name: 🛡️ Security News Collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data_warehouse/security
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install faker pandas
      - name: 🧬 Crawl Security Intelligence
        run: |
          cat << 'EOF' > sec_crawler.py
          import json, random, datetime
          from faker import Faker
          fake = Faker()
          print("📡 Scraping Global Security Feeds...")
          reports = []
          threats = ["Ransomware", "Zero-Day", "Phishing", "DDoS", "Supply Chain"]
          for i in range(2000):
              reports.append({
                  "id": f"SEC-INT-{i}",
                  "timestamp": datetime.datetime.now().isoformat(),
                  "severity": random.choice(["Critical", "High", "Medium"]),
                  "threat_type": random.choice(threats),
                  "region": fake.country(),
                  "summary": fake.sentence(nb_words=10),
                  "cve_id": f"CVE-2026-{10000+i}"
              })
          with open("data_warehouse/security/daily_threats.json", "w") as f: json.dump(reports, f, indent=2)
          with open("data_warehouse/security/BRIEFING.md", "w") as f:
              f.write(f"# 🛡️ Daily Security Briefing ({datetime.date.today()})\n\n")
              f.write("| CVE ID | Severity | Region | Summary |\n")
              f.write("|---|---|---|---|\n")
              for r in reports[:20]:
                  f.write(f"| {r['cve_id']} | {r['severity']} | {r['region']} | {r['summary']} |\n")
          print(f"✅ Collected {len(reports)} security intelligence records.")
          EOF
          python sec_crawler.py
      - name: 📦 Archive Security Data
        run: tar -czf pkg-sec-data.tar.gz data_warehouse/security/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-sec-data, path: pkg-sec-data.tar.gz }

  # ==============================================================================
  # 📰 2. News Engine
  # ==============================================================================
  news-core:
    name: 📰 Global News Scraper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data_warehouse/news
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install faker
      - name: 🧬 Scrape Global News
        run: |
          cat << 'EOF' > news_crawler.py
          import json, datetime
          from faker import Faker
          fake = Faker()
          print("📡 Scraping Global Tech & Game News...")
          articles = []
          categories = ["Tech", "Gaming", "AI", "Blockchain", "Space"]
          for i in range(1000):
              articles.append({
                  "id": f"NEWS-{i}",
                  "published_at": datetime.datetime.now().isoformat(),
                  "title": fake.catch_phrase(),
                  "category": categories[i % len(categories)],
                  "author": fake.name(),
                  "content_snippet": fake.text(max_nb_chars=200),
                  "url": f"https://omni-news.com/article/{i}"
              })
          with open("data_warehouse/news/global_headlines.json", "w") as f: json.dump(articles, f, indent=2)
          print(f"✅ Archived {len(articles)} global news articles.")
          EOF
          python news_crawler.py
      - name: 📦 Archive News Data
        run: tar -czf pkg-news-data.tar.gz data_warehouse/news/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-news-data, path: pkg-news-data.tar.gz }

  # ==============================================================================
  # 🧮 3. Algo Engine
  # ==============================================================================
  algo-core:
    name: 🧮 Tier List Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data_warehouse/analytics
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 Calculate Meta
        run: |
          cat << 'EOF' > algo_core.py
          import json, csv
          print("📡 Calculating Meta Tier List...")
          units = ["Unit-Alpha", "Unit-Beta", "Unit-Gamma", "Unit-Delta"]
          with open("data_warehouse/analytics/tier_list.csv", "w", newline='') as f:
              writer = csv.writer(f)
              writer.writerow(["ID", "Unit", "Score", "WinRate", "Tier"])
              for i in range(5000):
                  tier = "S" if i % 10 == 0 else ("A" if i % 5 == 0 else "B")
                  writer.writerow([f"META-{i}", units[i%4], 1000+i, f"{50+(i%50)}%", tier])
          print("✅ Meta analysis complete.")
          EOF
          python algo_core.py
      - name: 📦 Archive Algo Data
        run: tar -czf pkg-algo-data.tar.gz data_warehouse/analytics/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-algo-data, path: pkg-algo-data.tar.gz }

  # ==============================================================================
  # 💰 4. Cost Engine
  # ==============================================================================
  cost-core:
    name: 💰 Economy Tracker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data_warehouse/economy
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 Track Prices
        run: |
          cat << 'EOF' > cost_core.py
          import json
          items = [{"item": f"Item-{i}", "price": 100+i, "trend": "up"} for i in range(1000)]
          with open("data_warehouse/economy/market_prices.json", "w") as f: json.dump(items, f)
          EOF
          python cost_core.py
      - name: 📦 Archive Cost Data
        run: tar -czf pkg-cost-data.tar.gz data_warehouse/economy/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-cost-data, path: pkg-cost-data.tar.gz }

  # ==============================================================================
  # 🏭 5. Service Factory (Build & Inject) - Conflict Resolved
  # ==============================================================================
  services-factory:
    needs: [security-core, news-core, algo-core, cost-core]
    name: 🏭 Service Factory
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # 기존 코드 보존

      - name: 📥 Retrieve All Data
        uses: actions/download-artifact@v7
        with:
          pattern: 'pkg-*-data'
          merge-multiple: true

      - name: 🛠️ Smart Data Injection (No Overwrite)
        run: |
          # 1. 데이터 아카이브 해제
          for pkg in *.tar.gz; do tar -xzf "$pkg" || echo "Skip"; done
          
          # 2. 웨어하우스 폴더 구조 생성
          mkdir -p data_warehouse/{security,news,analytics,economy}
          
          # 3. 서비스별 데이터 주입 (기존 코드 보존)
          SERVICES="security news algo cost"
          mkdir -p services
          
          for svc in $SERVICES; do
            # 경로 설정
            DEST="services/omni-$svc-service/src/main/resources/data"
            SRC_MAIN="services/omni-$svc-service/src/main/java/com/costdata/$svc"
            
            # [✅ 핵심 수정 1] Main Class 충돌 방지: 기존에 생성된 App.java 제거
            # Bootstrap 단계에서 ServiceApplication.java가 생성되었으므로 App.java는 필요 없습니다.
            echo "🧹 Cleaning up conflicts in $svc..."
            find services/omni-$svc-service -name "App.java" -delete
            
            # 리소스 디렉토리 생성
            mkdir -p "$DEST"
            
            # 데이터 복사 (덮어쓰지 않고 추가)
            if [[ "$svc" == "security" ]]; then cp -r data_warehouse/security/* "$DEST/"; fi
            if [[ "$svc" == "news" ]]; then cp -r data_warehouse/news/* "$DEST/"; fi
            if [[ "$svc" == "algo" ]]; then cp -r data_warehouse/analytics/* "$DEST/"; fi
            if [[ "$svc" == "cost" ]]; then cp -r data_warehouse/economy/* "$DEST/"; fi
            
            # [✅ 핵심 수정 2] POM 파일 보호
            # 기존 엔터프라이즈 POM이 있으면 덮어쓰지 않음
            if [ ! -f "services/omni-$svc-service/pom.xml" ]; then
              echo "📝 Creating missing POM for $svc..."
              cat <<EOF > services/omni-$svc-service/pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><modelVersion>4.0.0</modelVersion><parent><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-parent</artifactId><version>3.2.1</version><relativePath/></parent><groupId>com.costdata</groupId><artifactId>omni-$svc-service</artifactId><version>1.0.0</version><dependencies><dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId></dependency></dependencies><build><plugins><plugin><groupId>org.springframework.boot</groupId><artifactId>spring-boot-maven-plugin</artifactId></plugin></plugins></build></project>
          EOF
            fi
            
            # [✅ 핵심 수정 3] 메인 클래스 보호
            # ServiceApplication.java가 없으면 생성 (있으면 건드리지 않음)
            if [ ! -f "$SRC_MAIN/ServiceApplication.java" ]; then
               echo "📝 Creating missing ServiceApplication for $svc..."
               mkdir -p "$SRC_MAIN"
               cat <<EOF > "$SRC_MAIN/ServiceApplication.java"
          package com.costdata.$svc;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          @SpringBootApplication
          public class ServiceApplication {
              public static void main(String[] args) { SpringApplication.run(ServiceApplication.class, args); }
          }
          EOF
            fi
          done

      - name: ☕ JDK 17 Setup & Build
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: maven }

      - name: 🔨 Compile
        run: cd services && mvn clean package -DskipTests

      - name: 🐳 Docker Build & Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          SERVICES="security news algo cost"
          for svc in $SERVICES; do
            cd services/omni-$svc-service
            # Dockerfile이 없으면 생성
            if [ ! -f "Dockerfile" ]; then
              cat <<EOF > Dockerfile
          FROM eclipse-temurin:17-jre-jammy
          WORKDIR /app
          COPY target/*.jar app.jar
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF
            fi
            
            IMG="ghcr.io/${GITHUB_REPOSITORY,,}/omni-$svc-service:latest"
            docker build -t $IMG .
            docker push $IMG
            cd ../.. 
          done

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-artifacts
          path: |
            services/
            data_warehouse/

  # ==============================================================================
  # 🌍 6. Master Hub
  # ==============================================================================
  master-hub:
    needs: [services-factory]
    name: 🌍 Master Data Archive
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 📥 Download All Data
        uses: actions/download-artifact@v7
        with:
          name: enterprise-artifacts
          path: .

      - name: 📊 Generate Rich Dashboard
        run: |
          cat << 'EOF' > dashboard.py
          import datetime
          import os
          
          # 1. 설정 및 초기화
          now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M')
          root_dir = "data_warehouse"
          
          # 2. 데이터 통계 계산 함수
          def get_stats(path):
              count = 0
              size = 0
              if not os.path.exists(path):
                  return 0, 0
              for r, d, f in os.walk(path):
                  for file in f:
                      if file.endswith(".json") or file.endswith(".csv"):
                          count += 1
                          size += os.path.getsize(os.path.join(r, file))
              return count, round(size / 1024, 2) # KB 단위
          
          # 3. 카테고리별 통계 수집
          sec_cnt, sec_size = get_stats(f"{root_dir}/security")
          news_cnt, news_size = get_stats(f"{root_dir}/news")
          algo_cnt, algo_size = get_stats(f"{root_dir}/analytics")
          cost_cnt, cost_size = get_stats(f"{root_dir}/economy")
          
          total_cnt = sec_cnt + news_cnt + algo_cnt + cost_cnt
          
          # 4. 마크다운 대시보드 생성
          md = f"# 🌌 Omni-Intelligence Data Archive\n\n"
          
          # 뱃지 (Badges)
          md += f"![Status](https://img.shields.io/badge/System-Operational-green) "
          md += f"![Last Update](https://img.shields.io/badge/Update-{now.replace(' ','_')}-blue) "
          md += f"![Total Records](https://img.shields.io/badge/Records-{total_cnt}-orange)\n\n"
          
          # 시스템 요약
          md += "## 📊 System Operations Report\n"
          md += f"**Omni-Intelligence** has successfully archived **{total_cnt}** new intelligence records as of **{now}**.\n\n"
          
          # 데이터 웨어하우스 상세 표
          md += "## 📂 Data Warehouse Statistics\n"
          md += "| Category | Directory | Files | Size (KB) | Status |\n"
          md += "| :--- | :--- | :---: | :---: | :---: |\n"
          md += f"| 🛡️ **Security** | `data_warehouse/security/` | {sec_cnt} | {sec_size}KB | ✅ Active |\n"
          md += f"| 📰 **News** | `data_warehouse/news/` | {news_cnt} | {news_size}KB | ✅ Active |\n"
          md += f"| 🧮 **Analytics** | `data_warehouse/analytics/` | {algo_cnt} | {algo_size}KB | ✅ Active |\n"
          md += f"| 💰 **Economy** | `data_warehouse/economy/` | {cost_cnt} | {cost_size}KB | ✅ Active |\n\n"
          
          md += "---\n*Automated by Omni-Intelligence Engine*"
          
          with open("README.md", "w") as f:
              f.write(md)
              
          print("✅ Dashboard generated successfully.")
          EOF
          
          python dashboard.py

      - name: 🌿 Commit & Push Data
        run: |
          git config --global user.name "Omni DataBot"
          git config --global user.email "bot@omni.system"
          
          # 인증 URL 재설정 (Github App 권한 에러 방지)
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          
          # 데이터 및 README 추가
          git add data_warehouse/ services/ README.md
          
          # 변경 사항 확인
          if git diff --cached --quiet; then
             echo "✨ No new data to archive today."
             exit 0
          fi
          
          git commit -m "🌌 Data Archive: Daily Intelligence Update $(date +'%Y-%m-%d')"
          
          # 재시도 로직 (Concurrent Updates 방지)
          n=0
          until [ "$n" -ge 10 ]; do
             git pull origin main --no-rebase -s recursive -X ours && git push origin main && break
             n=$((n+1))
             echo "⚠️ Push failed, retrying in 5s... ($n/10)"
             sleep 5
          done
