name: Copilot Agent - Auto Labeling & PR System

on:
  schedule:
    - cron: '0 * * * *' # ⏰ 매 시간 실행
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write      # 💾 코드 및 태그 생성
  issues: write        # 🏷️ 라벨 및 이슈 생성
  packages: write      # 🐳 GHCR 업로드
  pull-requests: write # 🔀 PR 생성 및 병합

jobs:
  # --------------------------------------------------------------------------------
  # 🖥️ Windows Agent
  # --------------------------------------------------------------------------------
  agent-windows:
    name: 🤖 Run Agent on Windows
    runs-on: windows-latest
    steps:
      - name: 📥 작업 설정
        uses: actions/checkout@v4
      - name: 🛡️ 시스템 검증
        shell: powershell
        run: Write-Host "[INIT] Ready for Auto-Labeling Workflow."

  # --------------------------------------------------------------------------------
  # 🐧 Linux Agent: 라벨 대량 생성 -> 데이터 수집 -> PR -> 도커
  # --------------------------------------------------------------------------------
  agent-linux-intelligence:
    name: 🧠 Data Node & Label Ops
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
    
    steps:
      - name: 📥 소스 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: 🐍 Python 3.11 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 모듈 설치
        run: |
          python -m pip install --upgrade pip
          pip install feedparser aiohttp asyncio requests beautifulsoup4 lxml duckduckgo-search fake-useragent deep-translator pandas tabulate

      # ------------------------------------------------------------------
      # 🏷️ [NEW] 대량 라벨 자동 생성 (에러 방지 핵심 단계)
      # ------------------------------------------------------------------
      - name: 🏷️ Initialize Repository Labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🛠️ Checking and Creating Missing Labels..."
          
          # 생성할 라벨 목록 (대량 추가)
          labels=(
            "automated:0E8A16:Automated process"
            "data-sync:1D76DB:Data synchronization"
            "security-alert:B60205:Security critical alert"
            "hourly-briefing:FBCA04:Hourly news update"
            "security-release:0052CC:Official security release"
            "package-launch:006B75:New package deployment"
            "tax-season:D93F0B:Tax season special"
          )
          
          for label_info in "${labels[@]}"; do
            # 문자열 파싱 (이름:색상:설명)
            IFS=':' read -r name color desc <<< "$label_info"
            
            # 라벨 생성 시도 (이미 존재하면 에러 무시하고 넘어감)
            gh label create "$name" --color "$color" --description "$desc" --force || echo "Label '$name' already exists or updated."
          done
          
          echo "✅ All labels are ready."

      # ------------------------------------------------------------------
      # 🔥 AI 뉴럴 코어 (데이터 수집)
      # ------------------------------------------------------------------
      - name: 🧬 Generate Async Neural Core
        run: |
          cat << 'EOF' > ai_neural_core.py
          import asyncio, aiohttp, feedparser, os, json, re, gzip
          from datetime import datetime
          from fake_useragent import UserAgent

          DB_DIR = "DB"
          MEMORY_FILE = os.path.join(DB_DIR, "neural_memory.json.gz")
          LOG_FILE = os.path.join(DB_DIR, "knowledge_base.md")
          REPORT_FILE = "latest_briefing.md"
          
          # 키워드 (정치, 경제, 사회, IT)
          BASE_KEYWORDS = [
              "정치", "총선", "대통령", "경제", "금리", "삼성전자",
              "사회", "IT", "AI", "보안", "해킹", "Docker", "연말정산"
          ]
          
          def generate_sources():
              urls = []
              for kw in BASE_KEYWORDS:
                  urls.append({"url": f"https://news.google.com/rss/search?q={kw}&hl=ko&gl=KR&ceid=KR:ko", "tag": kw})
              return urls

          def init_db():
              if not os.path.exists(DB_DIR): os.makedirs(DB_DIR)

          def load_memory():
              try:
                  if os.path.exists(MEMORY_FILE):
                      with gzip.open(MEMORY_FILE, 'rt', encoding='utf-8') as f:
                          return set(json.load(f))
              except: pass
              return set()

          def save_memory(data):
              with gzip.open(MEMORY_FILE, 'wt', encoding='utf-8') as f:
                  json.dump(list(data), f)

          async def fetch_feed(session, source):
              try:
                  async with session.get(source['url'], timeout=15) as response:
                      if response.status != 200: return []
                      data = await response.read()
                      parsed = feedparser.parse(data)
                      for entry in parsed.entries: entry['source_tag'] = source['tag']
                      return parsed.entries
              except: return []

          async def main_intelligence():
              print("🚀 Async Massive Core Running...")
              init_db()
              memory = load_memory()
              sources = generate_sources()
              
              new_items = []
              ua = UserAgent()
              headers = {'User-Agent': ua.random}
              
              async with aiohttp.ClientSession(headers=headers) as session:
                  tasks = [fetch_feed(session, src) for src in sources]
                  results = await asyncio.gather(*tasks)
                  
                  for entries in results:
                      for entry in entries:
                          if entry.link in memory: continue
                          memory.add(entry.link)
                          new_items.append({
                              "title": entry.title,
                              "link": entry.link,
                              "tag": entry.get('source_tag', 'General')
                          })

              if new_items:
                  save_memory(memory)
                  briefing = f"### 📰 PR Data Briefing (New: {len(new_items)})\n\n| Tag | Headline |\n|---|---|\n"
                  for item in new_items[:50]:
                      briefing += f"| `{item['tag']}` | {item['title']} |\n"
                  
                  with open(REPORT_FILE, 'w', encoding='utf-8') as f: f.write(briefing)
                  print(f"✅ Bulk Processed: {len(new_items)} new items.")
              else:
                  with open(REPORT_FILE, 'w', encoding='utf-8') as f: f.write("### 💤 No new data.")

          if __name__ == "__main__":
              asyncio.run(main_intelligence())
          EOF
          
          python ai_neural_core.py

      # ------------------------------------------------------------------
      # 🔀 브랜치 생성 및 커밋
      # ------------------------------------------------------------------
      - name: 🌿 Create Branch & Commit
        id: git_ops
        run: |
          BRANCH_NAME="news-update/$(date +'%Y%m%d-%H%M')"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          git config --global user.name "Copilot AI Bot"
          git config --global user.email "ai-bot@github.actions"
          
          git checkout -b $BRANCH_NAME
          git add DB/
          
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "💤 No changes to commit."
          else
            git commit -m "🧠 Data Injection: $(date +'%Y-%m-%d %H:%M')"
            git push origin $BRANCH_NAME
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------
      # 🔀 [수정] PR 생성 (라벨 에러 해결됨)
      # ------------------------------------------------------------------
      - name: 🔀 Create & Merge Pull Request
        if: steps.git_ops.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.git_ops.outputs.branch_name }}"
          
          # 이제 라벨이 무조건 존재하므로 에러가 발생하지 않습니다.
          gh pr create \
            --title "🧠 Intelligence Update [$(date +'%Y-%m-%d %H:%M')]" \
            --body "Automated data ingestion from AI Neural Core." \
            --head $BRANCH_NAME \
            --base main \
            --label "automated" \
            --label "data-sync" \
            --label "hourly-briefing"
          
          # 자동 병합
          gh pr merge --auto --squash --delete-branch "$BRANCH_NAME"
          
          echo "✅ PR Created and Merged."

      # ------------------------------------------------------------------
      # 🏷️ 버전 태그
      # ------------------------------------------------------------------
      - name: 🏷️ Generate Version Tag
        id: tagger
        run: |
          echo "version=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # 🐳 Dockerfile 생성
      # ------------------------------------------------------------------
      - name: 🐳 Generate Data-Lake Dockerfile
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          RUN apt-get update && apt-get upgrade -y && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          RUN pip install --upgrade pip && \
              pip install feedparser aiohttp asyncio requests beautifulsoup4 lxml duckduckgo-search fake-useragent
          COPY . /app
          RUN echo "📊 Checking Data..." && ls -lh /app/DB/neural_memory.json.gz
          LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          LABEL org.opencontainers.image.description="Massive Data Lake Container (PR Synced)"
          CMD ["python", "ai_neural_core.py"]
          EOF

      # ------------------------------------------------------------------
      # 🐳 GHCR 로그인 및 업로드
      # ------------------------------------------------------------------
      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Build and Push Data Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.tagger.outputs.repo_lower }}:${{ steps.tagger.outputs.version }}
            ghcr.io/${{ steps.tagger.outputs.repo_lower }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Data Injection via PR

      # ------------------------------------------------------------------
      # 🖥️ 화면 출력
      # ------------------------------------------------------------------
      - name: 🖥️ Display Dashboard
        if: always()
        run: |
          echo "## 🤖 Data & PR Dashboard" >> $GITHUB_STEP_SUMMARY
          
          if [ -f DB/neural_memory.json.gz ]; then
            COUNT=$(python -c "import gzip, json; print(len(json.load(gzip.open('DB/neural_memory.json.gz', 'rt'))))")
          else
            COUNT=0
          fi
          
          echo "| Status | Data Count | Docker |" >> $GITHUB_STEP_SUMMARY
          echo "| :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔀 **Merged** | **$COUNT** | \`ghcr.io/...:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f latest_briefing.md ]; then
            cat latest_briefing.md >> $GITHUB_STEP_SUMMARY
          fi

      # ------------------------------------------------------------------
      # 🚀 릴리즈
      # ------------------------------------------------------------------
      - name: 🚀 Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ steps.tagger.outputs.version }}
          name: "🧠 PR-Synced Batch ${{ steps.tagger.outputs.version }}"
          body_path: latest_briefing.md
          files: |
            latest_briefing.md
            DB/knowledge_base.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
