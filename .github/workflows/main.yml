name: 🌌 Omni-Intelligence Grand Pipeline (Docker Ultimate)

on:
  schedule:
    - cron: '0 21 * * *' # ⏰ KST 06:00
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write

# [✅ 전역 환경 설정]
env:
  TZ: 'Asia/Seoul'
  RETRY_MAX: 5
  REGISTRY: ghcr.io

jobs:
  # ==============================================================================
  # 🛡️ 1. Security Engine
  # ==============================================================================
  security-core:
    name: 🛡️ Security Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🧹 Free Disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - run: mkdir -p DB_SEC/primary DB_SEC/replica DB_SEC/archive
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install faker
      - name: 🧬 Generate Data
        run: |
          cat << 'EOF' > sec_core.py
          import json, os, hashlib
          from faker import Faker
          fake = Faker()
          data = [{"id":f"SEC-{i}", "cve":f"CVE-2026-{10000+i}", "desc":fake.sentence()} for i in range(500000)]
          with open("DB_SEC/primary/security_data.json", "w") as f: json.dump(data, f)
          EOF
          python sec_core.py
      - name: 📦 Compress
        run: |
          sha256sum DB_SEC/primary/security_data.json > DB_SEC/primary/checksum.sha256
          cp DB_SEC/primary/* DB_SEC/replica/
          cp DB_SEC/primary/* DB_SEC/archive/
          tar -czf pkg-sec-primary.tar.gz DB_SEC/primary/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-sec-primary, path: pkg-sec-primary.tar.gz }

  # ==============================================================================
  # 💼 2. Job Engine
  # ==============================================================================
  job-core:
    name: 💼 Job Fortress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_JOB/primary DB_JOB/replica DB_JOB/archive
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install faker
      - name: 🧬 Generate Data
        run: |
          cat << 'EOF' > job_core.py
          import json, os
          from faker import Faker
          fake = Faker()
          data = [{"id":f"JOB-{i}", "title":fake.job(), "loc":"Global"} for i in range(300000)]
          with open("DB_JOB/primary/job_data.json", "w") as f: json.dump(data, f)
          EOF
          python job_core.py
      - name: 📦 Compress
        run: |
          sha256sum DB_JOB/primary/job_data.json > DB_JOB/primary/checksum.sha256
          cp DB_JOB/primary/* DB_JOB/replica/
          tar -czf pkg-job-primary.tar.gz DB_JOB/primary/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-job-primary, path: pkg-job-primary.tar.gz }

  # ==============================================================================
  # 🧮 3. Algo Engine
  # ==============================================================================
  algo-core:
    name: 🧮 Algo Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_ALGO/primary DB_ALGO/replica
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 Generate Data
        run: |
          cat << 'EOF' > algo_core.py
          import json
          data = [{"id":i, "algo":f"Model-{i}"} for i in range(100000)]
          with open("DB_ALGO/primary/algo_data.json", "w") as f: json.dump(data, f)
          EOF
          python algo_core.py
      - name: 📦 Compress
        run: tar -czf pkg-algo-primary.tar.gz DB_ALGO/primary/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-algo-primary, path: pkg-algo-primary.tar.gz }

  # ==============================================================================
  # 💰 4. Cost Engine
  # ==============================================================================
  misc-core:
    name: 💰 Cost Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_COST/primary DB_COST/replica
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 🧬 Generate Data
        run: |
          cat << 'EOF' > misc_core.py
          import json
          data = [{"id":i, "cost":100+i} for i in range(100000)]
          with open("DB_COST/primary/cost_data.json", "w") as f: json.dump(data, f)
          EOF
          python misc_core.py
      - name: 📦 Compress
        run: tar -czf pkg-cost-primary.tar.gz DB_COST/primary/
      - uses: actions/upload-artifact@v4
        with: { name: pkg-cost-primary, path: pkg-cost-primary.tar.gz }

  # ==============================================================================
  # 🏭 5. Service Factory (Docker Ultimate & Buildx)
  # ==============================================================================
  services-factory:
    needs: [security-core, job-core, algo-core, misc-core]
    name: 🏭 Service Factory (Buildx)
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
        continue-on-error: true

      - name: 🐧 Install Utils
        run: sudo apt-get update && sudo apt-get install -y jq curl unzip tree

      - uses: actions/download-artifact@v4
        with:
          pattern: 'pkg-*-primary'
          merge-multiple: true
        continue-on-error: true

      - name: ☕ JDK 17 Setup
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: maven }

      # [✅ New] Docker Buildx & QEMU Setup (Multi-Arch Support)
      - name: 🐳 Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      # [✅ New] Docker Login (More Robust)
      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Organize Data
        run: |
          for pkg in *.tar.gz; do tar -xzf "$pkg" || echo "Skip $pkg"; done
          mkdir -p DB_SEC/live DB_JOB/live DB_ALGO/live DB_COST/live
          [ -d "DB_SEC/primary" ] && mv DB_SEC/primary/* DB_SEC/live/
          [ -d "DB_JOB/primary" ] && mv DB_JOB/primary/* DB_JOB/live/
          [ -d "DB_ALGO/primary" ] && mv DB_ALGO/primary/* DB_ALGO/live/
          [ -d "DB_COST/primary" ] && mv DB_COST/primary/* DB_COST/live/

      - name: 🏗️ Scaffold & Build Services
        run: |
          rm -rf services
          mkdir -p services
          SERVICES="security job algo cost"
          
          for svc in $SERVICES; do
            mkdir -p services/omni-$svc-service/src/main/java/com/costdata/$svc
            mkdir -p services/omni-$svc-service/src/main/resources/data
            mkdir -p services/omni-$svc-service/k8s
            
            # Data Injection
            if [ -d "DB_SEC/live" ] && [ "$svc" == "security" ]; then cp -r DB_SEC/live/* services/omni-$svc-service/src/main/resources/data/; fi
            if [ -d "DB_JOB/live" ] && [ "$svc" == "job" ]; then cp -r DB_JOB/live/* services/omni-$svc-service/src/main/resources/data/; fi
            if [ -d "DB_ALGO/live" ] && [ "$svc" == "algo" ]; then cp -r DB_ALGO/live/* services/omni-$svc-service/src/main/resources/data/; fi
            if [ -d "DB_COST/live" ] && [ "$svc" == "cost" ]; then cp -r DB_COST/live/* services/omni-$svc-service/src/main/resources/data/; fi
            
            # POM
            cat <<EOF > services/omni-$svc-service/pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <parent><groupId>com.costdata</groupId><artifactId>omni-platform</artifactId><version>1.0.0</version></parent>
              <artifactId>omni-$svc-service</artifactId>
              <packaging>jar</packaging>
              <dependencies>
                  <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId></dependency>
                  <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-actuator</artifactId></dependency>
                  <dependency><groupId>jakarta.annotation</groupId><artifactId>jakarta.annotation-api</artifactId></dependency>
              </dependencies>
              <build>
                  <plugins>
                      <plugin><groupId>org.springframework.boot</groupId><artifactId>spring-boot-maven-plugin</artifactId>
                          <configuration><layers><enabled>true</enabled></layers></configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF
            
            # Java
            cat <<EOF > services/omni-$svc-service/src/main/java/com/costdata/$svc/ServiceApplication.java
          package com.costdata.$svc;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;
          import java.util.Map;
          @SpringBootApplication @RestController
          public class ServiceApplication {
              public static void main(String[] args) { SpringApplication.run(ServiceApplication.class, args); }
              @GetMapping("/") public Map<String, String> s() { return Map.of("status", "online"); }
          }
          EOF

            # K8s
            cat <<EOF > services/omni-$svc-service/k8s/omni-$svc.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: omni-$svc
          spec:
            replicas: 3
            selector:
              matchLabels:
                app: omni-$svc
            template:
              metadata:
                labels:
                  app: omni-$svc
              spec:
                containers:
                - name: app
                  image: ghcr.io/${GITHUB_REPOSITORY,,}/omni-$svc-service:latest
                  ports:
                  - containerPort: 8080
                  livenessProbe:
                    httpGet:
                      path: /actuator/health
                      port: 8080
                    initialDelaySeconds: 30
          EOF
          done
          
          # Root POM
          cat <<EOF > services/pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.costdata</groupId><artifactId>omni-platform</artifactId><version>1.0.0</version>
              <packaging>pom</packaging>
              <modules>
                  <module>omni-security-service</module>
                  <module>omni-job-service</module>
                  <module>omni-algo-service</module>
                  <module>omni-cost-service</module>
              </modules>
              <parent><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-parent</artifactId><version>3.2.1</version><relativePath/></parent>
          </project>
          EOF

      - name: 🔨 Compile Services
        run: cd services && mvn clean package -DskipTests

      # [✅ New] Advanced Docker Build with Retry & Layered Jar Support
      - name: 🐳 Build & Push Grid (With Retry)
        run: |
          SERVICES="security job algo cost"
          for svc in $SERVICES; do
            echo "🐳 Processing: omni-$svc-service"
            cd services/omni-$svc-service
            
            # [Optimization] Layered Jar Dockerfile
            cat <<EOF > Dockerfile
          FROM eclipse-temurin:17-jre-jammy as builder
          WORKDIR /app
          COPY target/*.jar app.jar
          RUN java -Djarmode=layertools -jar app.jar extract

          FROM eclipse-temurin:17-jre-jammy
          WORKDIR /app
          COPY --from=builder /app/dependencies/ ./
          COPY --from=builder /app/spring-boot-loader/ ./
          COPY --from=builder /app/snapshot-dependencies/ ./
          COPY --from=builder /app/application/ ./
          
          LABEL org.opencontainers.image.source=https://github.com/${{ github.repository }}
          LABEL org.opencontainers.image.description="Omni Intelligence $svc Service"
          
          HEALTHCHECK --interval=30s --timeout=5s CMD curl -f http://localhost:8080/actuator/health || exit 1
          ENTRYPOINT ["java", "org.springframework.boot.loader.launch.JarLauncher"]
          EOF
            
            IMG="ghcr.io/${GITHUB_REPOSITORY,,}/omni-$svc-service:latest"
            
            # [Retry Logic] for Unknown Blob Error
            n=0
            until [ "$n" -ge 5 ]; do
              echo "🚀 Pushing $IMG (Attempt $((n+1))/5)..."
              docker buildx build \
                --platform linux/amd64,linux/arm64 \
                --tag $IMG \
                --push \
                . && break
              n=$((n+1))
              echo "⚠️ Push failed. Retrying in 10s..."
              sleep 10
            done
            
            cd ../.. 
          done

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-artifacts
          path: services/

  # ==============================================================================
  # 🚀 6. Release
  # ==============================================================================
  grand-release:
    needs: [services-factory]
    name: 🚀 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true

      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: release_assets
        continue-on-error: true

      - name: 🏷️ Version Tag
        id: tagger
        run: echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: 📦 Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tagger.outputs.tag }}
          name: 🌌 Release ${{ steps.tagger.outputs.tag }}
          body: |
            # 🌌 Omni-Intelligence Ultimate Release
            - **Docker:** Multi-Arch (AMD64/ARM64) Supported
            - **Resilience:** Auto-Retry Push Enabled
            - **Healthcheck:** K8s Liveness Probes Ready
          files: |
            release_assets/*.tar.gz
            release_assets/services/**/target/*.jar
            release_assets/services/**/k8s/*.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ==============================================================================
  # 🌍 7. Master Hub
  # ==============================================================================
  master-hub:
    needs: [grand-release]
    name: 🌍 Master Dashboard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 📥 Download
        uses: actions/download-artifact@v4
        with:
          name: enterprise-artifacts
          path: services
        continue-on-error: true

      - name: 📊 Dashboard
        run: |
          cat << 'EOF' > dashboard.py
          import datetime, os
          now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M')
          has_source = os.path.exists("services")
          status = "Online" if has_source else "Partial"
          md = f"# 🌌 Omni-Intelligence Hub\n\n![Status](https://img.shields.io/badge/System-{status}-green) ![Docker](https://img.shields.io/badge/Docker-MultiArch-blue)\n\n## 🚀 {now}\n"
          with open("README.md", "w") as f: f.write(md)
          EOF
          python dashboard.py

      - name: 🌿 Commit
        run: |
          git config --global user.name "Omni Bot"
          git config --global user.email "bot@actions"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          
          if [ -d "services" ]; then git add services/; fi
          git add README.md
          
          if git diff --cached --quiet; then echo "✨ No changes"; exit 0; fi
          
          git commit -m "🌌 Update: $(date +'%Y-%m-%d %H:%M')"
          
          n=0
          until [ "$n" -ge 10 ]; do
             git pull origin main --no-rebase -s recursive -X ours && git push origin main && break
             n=$((n+1))
             sleep 5
          done
