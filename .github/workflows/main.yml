name: Copilot Agent - Massive Data Lake & Visual Report

on:
  schedule:
    - cron: '0 * * * *' # ⏰ 매 시간 실행
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: write  # 💾 DB 저장
  issues: write
  packages: write  # 🐳 GHCR 업로드

jobs:
  # --------------------------------------------------------------------------------
  # 🖥️ Windows Agent: 환경 검증
  # --------------------------------------------------------------------------------
  agent-windows:
    name: 🤖 Run Agent on Windows
    runs-on: windows-latest
    steps:
      - name: 📥 작업 설정
        uses: actions/checkout@v4
      - name: 🛡️ 시스템 검증
        shell: powershell
        run: Write-Host "[INIT] Windows Agent Ready."

  # --------------------------------------------------------------------------------
  # 🐧 Linux Agent: 대량 수집 + 화면 출력 로직 강화
  # --------------------------------------------------------------------------------
  agent-linux-intelligence:
    name: 🧠 Massive Data Node (Async)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      packages: write
    
    steps:
      - name: 📥 소스 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: 🐍 Python 3.11 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 고성능 모듈 설치
        run: |
          python -m pip install --upgrade pip
          pip install feedparser aiohttp asyncio requests beautifulsoup4 lxml duckduckgo-search fake-useragent deep-translator pandas tabulate

      # ------------------------------------------------------------------
      # 🔥 [핵심] AI 뉴럴 코어 (화면 출력용 리포트 생성 로직 추가)
      # ------------------------------------------------------------------
      - name: 🧬 Generate Async Neural Core
        run: |
          cat << 'EOF' > ai_neural_core.py
          import asyncio
          import aiohttp
          import feedparser
          import os
          import json
          import time
          import re
          import gzip
          from datetime import datetime
          from fake_useragent import UserAgent

          # --- [설정] ---
          DB_DIR = "DB"
          MEMORY_FILE = os.path.join(DB_DIR, "neural_memory.json.gz")
          LOG_FILE = os.path.join(DB_DIR, "knowledge_base.md")
          REPORT_FILE = "latest_briefing.md" # 화면 출력용 파일
          
          # 키워드 (정치, 경제, 보안 등)
          BASE_KEYWORDS = [
              "정치", "국회", "대통령", "총선", "법안",
              "금융", "경제", "주식", "증권", "환율", "삼성전자",
              "보안", "해킹", "랜섬웨어", "개인정보", "AI",
              "Politics", "Economy", "Security"
          ]
          
          def generate_sources():
              urls = []
              # 키워드 기반 소스
              for kw in BASE_KEYWORDS:
                  urls.append({"url": f"https://news.google.com/rss/search?q={kw}&hl=ko&gl=KR&ceid=KR:ko", "tag": kw})
              # 메인 RSS
              urls.append({"url": "https://www.yna.co.kr/rss/politics.xml", "tag": "Politics"})
              urls.append({"url": "https://www.mk.co.kr/rss/30100041/", "tag": "Economy"})
              return urls

          def init_db():
              if not os.path.exists(DB_DIR): os.makedirs(DB_DIR)
          
          def load_memory():
              try:
                  if os.path.exists(MEMORY_FILE):
                      with gzip.open(MEMORY_FILE, 'rt', encoding='utf-8') as f:
                          return set(json.load(f))
              except: pass
              return set()

          def save_memory(data):
              with gzip.open(MEMORY_FILE, 'wt', encoding='utf-8') as f:
                  json.dump(list(data), f)

          def clean_html(raw):
              return re.sub(r'<[^>]+>', '', raw).strip()[:100] + "..."

          async def fetch_feed(session, source):
              try:
                  async with session.get(source['url'], timeout=15) as response:
                      if response.status != 200: return []
                      data = await response.read()
                      parsed = feedparser.parse(data)
                      # 소스 태그를 각 항목에 주입
                      for entry in parsed.entries:
                          entry['source_tag'] = source['tag']
                      return parsed.entries
              except:
                  return []

          async def main_intelligence():
              print("🚀 Async Neural Core Running...")
              init_db()
              memory = load_memory()
              sources = generate_sources()
              
              new_items = []
              
              # 화면 출력용 버퍼 (최신순)
              display_buffer = ""
              
              ua = UserAgent()
              headers = {'User-Agent': ua.random}
              
              async with aiohttp.ClientSession(headers=headers) as session:
                  tasks = [fetch_feed(session, src) for src in sources]
                  results = await asyncio.gather(*tasks)
                  
                  for entries in results:
                      for entry in entries:
                          if entry.link in memory: continue
                          
                          memory.add(entry.link)
                          
                          title = entry.title
                          summary = clean_html(getattr(entry, 'summary', ''))
                          tag = entry.get('source_tag', 'General')
                          
                          # 리스트에 저장
                          new_items.append({
                              "title": title,
                              "link": entry.link,
                              "summary": summary,
                              "tag": tag,
                              "time": datetime.now().isoformat()
                          })

              new_count = len(new_items)
              
              if new_count > 0:
                  save_memory(memory)
                  
                  # 1. 전체 로그 저장 (DB용)
                  full_log = ""
                  for item in new_items:
                      full_log += f"- [{item['tag']}] **[{item['title']}]({item['link']})**\n"
                  
                  with open(LOG_FILE, 'a', encoding='utf-8') as f:
                      f.write(f"\n## 📅 Batch: {datetime.now().strftime('%Y-%m-%d %H:%M')}\n" + full_log)

                  # 2. [핵심] 화면 출력용 요약본 생성 (Top 50개만)
                  # GitHub Summary 제한 고려하여 최신 50개만 보여줌
                  display_limit = new_items[:50]
                  
                  briefing_md = f"### 📰 Latest News Briefing (Top {len(display_limit)}/{new_count})\n\n"
                  briefing_md += "| Tag | Headline |\n|---|---|\n"
                  
                  for item in display_limit:
                      # 테이블 형태로 깔끔하게 출력
                      briefing_md += f"| `{item['tag']}` | [{item['title']}]({item['link']}) |\n"
                  
                  if new_count > 50:
                      briefing_md += f"\n> ℹ️ *...and {new_count - 50} more items archived in Database.*\n"

                  with open(REPORT_FILE, 'w', encoding='utf-8') as f:
                      f.write(briefing_md)
                  
                  print(f"✅ Processed {new_count} items. Generated visual report.")
              else:
                  with open(REPORT_FILE, 'w', encoding='utf-8') as f:
                      f.write("### 💤 No new updates in this batch.")
                  print("💤 No new data.")

          if __name__ == "__main__":
              asyncio.run(main_intelligence())
          EOF
          
          python ai_neural_core.py

      # ------------------------------------------------------------------
      # 💾 데이터 영구 저장
      # ------------------------------------------------------------------
      - name: 💾 Commit Massive Data
        run: |
          git config --global user.name "Copilot AI Bot"
          git config --global user.email "ai-bot@github.actions"
          git add DB/
          git commit -m "🧠 Mass Data Ingestion [$(date +'%Y-%m-%d %H:%M')]" || echo "No updates."
          git push

      # ------------------------------------------------------------------
      # 🏷️ 태그 생성
      # ------------------------------------------------------------------
      - name: 🏷️ Generate Tags
        id: tagger
        run: |
          echo "version=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # 🐳 Dockerfile 생성
      # ------------------------------------------------------------------
      - name: 🐳 Generate Optimized Dockerfile
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.11-slim
          RUN apt-get update && apt-get upgrade -y && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          RUN pip install --upgrade pip && \
              pip install feedparser aiohttp asyncio requests beautifulsoup4 lxml duckduckgo-search fake-useragent
          COPY . /app
          LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          LABEL org.opencontainers.image.description="Massive Data Lake Container"
          CMD ["python", "ai_neural_core.py"]
          EOF

      # ------------------------------------------------------------------
      # 🐳 GHCR 배포
      # ------------------------------------------------------------------
      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} #

      - name: 🚀 Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.tagger.outputs.repo_lower }}:${{ steps.tagger.outputs.version }}
            ghcr.io/${{ steps.tagger.outputs.repo_lower }}:latest

      # ------------------------------------------------------------------
      # 🖥️ [수정됨] 화면 출력 대시보드 (뉴스 리스트 포함)
      # ------------------------------------------------------------------
      - name: 🖥️ Display Dashboard & News List
        if: always()
        run: |
          # 1. 대시보드 헤더 출력
          echo "## 🤖 Massive Data Engine Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "| System | Status | Total Records | Docker Image |" >> $GITHUB_STEP_SUMMARY
          echo "| :---: | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          COUNT=$(python -c "import gzip, json, os; print(len(json.load(gzip.open('DB/neural_memory.json.gz', 'rt'))) if os.path.exists('DB/neural_memory.json.gz') else 0)")
          echo "| **Async Core** | 🟢 **RUNNING** | **$COUNT** | \`ghcr.io/...:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          
          # 2. [핵심] 뉴스 리스트(latest_briefing.md) 내용 출력
          if [ -f latest_briefing.md ]; then
            cat latest_briefing.md >> $GITHUB_STEP_SUMMARY
          else
            echo "> ⚠️ No report generated." >> $GITHUB_STEP_SUMMARY
          fi

      # ------------------------------------------------------------------
      # 🚀 릴리즈
      # ------------------------------------------------------------------
      - name: 🚀 Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ steps.tagger.outputs.version }}
          name: "🧠 Massive Data Batch ${{ steps.tagger.outputs.version }}"
          body_path: latest_briefing.md
          files: |
            latest_briefing.md
            DB/knowledge_base.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
