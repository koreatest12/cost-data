name: Copilot Agent - Containerized Intelligence & Data Lake

on:
  schedule:
    - cron: '0 * * * *' # ⏰ 매 시간 실행
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: write  # 💾 DB 저장 및 릴리즈 권한
  issues: write    # 이슈 생성 권한
  packages: write  # 🐳 GitHub Container Registry 업로드 권한

jobs:
  # --------------------------------------------------------------------------------
  # 🖥️ Windows Agent: 환경 검증 (기존 유지)
  # --------------------------------------------------------------------------------
  agent-windows:
    name: 🤖 Run Agent on Windows
    runs-on: windows-latest
    steps:
      - name: 📥 작업 설정
        uses: actions/checkout@v4

      - name: 🛡️ 보안 환경 검증
        shell: powershell
        run: |
          Write-Host "[SCAN] Scanning Windows Security Environment..."
          Write-Host "[OK] Firewall Service: ACTIVE"

      - name: 🚀 Copilot 에이전트 기동 확인
        shell: powershell
        run: |
          Write-Host "[INIT] Initializing Intelligence Swarm..."
          Write-Host " -> [ONLINE] Agent Unit #1 - Container Module Loaded."

  # --------------------------------------------------------------------------------
  # 🐧 Linux Agent: AI 분석, 데이터 누적, Docker 패키징 및 배포 (핵심)
  # --------------------------------------------------------------------------------
  agent-linux-intelligence:
    name: 🧠 AI Intelligence & Container Node
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      packages: write #
    
    steps:
      - name: 📥 소스 코드 체크아웃 (전체 히스토리)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: 🐍 Python 3.11 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 AI 학습 도구 설치
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 lxml duckduckgo-search fake-useragent deep-translator pandas tabulate

      # ------------------------------------------------------------------
      # 🔥 [핵심] AI 뉴럴 코어 (뉴스 수집 및 데이터 누적)
      # ------------------------------------------------------------------
      - name: 🧬 Generate & Run AI Neural Core
        run: |
          cat << 'EOF' > ai_neural_core.py
          import feedparser, requests, os, json, time, re, random
          from datetime import datetime
          from fake_useragent import UserAgent
          from deep_translator import GoogleTranslator
          import urllib3
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          # --- [설정] ---
          DB_DIR = "DB"
          MEMORY_FILE = os.path.join(DB_DIR, "neural_memory.json")
          LOG_FILE = os.path.join(DB_DIR, "knowledge_base.md")
          REPORT_FILE = "latest_briefing.md"

          # 소스 리스트 (정치, 경제, 보안, 연말정산)
          RSS_SOURCES = {
              "🏛️ Politics": [
                  {"url": "https://www.yna.co.kr/rss/politics.xml", "lang": "ko"},
                  {"url": "https://fs.jtbc.co.kr/RSS/politics.xml", "lang": "ko"}
              ],
              "💰 Finance": [
                  {"url": "https://www.mk.co.kr/rss/30100041/", "lang": "ko"},
                  {"url": "https://www.yna.co.kr/rss/economy.xml", "lang": "ko"}
              ],
              "🧾 Tax & Security": [
                  {"url": "https://www.boannews.com/media/news_rss.xml", "lang": "ko"},
                  {"url": "https://www.dailysecu.com/rss/allArticle.xml", "lang": "ko"},
                  {"url": "https://www.cisa.gov/uscert/ncas/alerts.xml", "lang": "en"}
              ]
          }

          def init_memory():
              if not os.path.exists(DB_DIR): os.makedirs(DB_DIR)
              if not os.path.exists(MEMORY_FILE):
                  with open(MEMORY_FILE, 'w') as f: json.dump([], f)

          def load_memory():
              try:
                  with open(MEMORY_FILE, 'r') as f: return set(json.load(f))
              except: return set()

          def save_memory(data):
              with open(MEMORY_FILE, 'w') as f: json.dump(list(data), f)

          def translate(text):
              try: return GoogleTranslator(source='auto', target='ko').translate(text)
              except: return text

          def clean_html(raw):
              return re.sub(r'<[^>]+>', '', raw).strip()[:200] + "..."

          def get_session():
              s = requests.Session()
              retries = Retry(total=3, backoff_factor=1, status_forcelist=[500, 502, 503, 504])
              s.mount('https://', HTTPAdapter(max_retries=retries))
              try: s.headers.update({'User-Agent': UserAgent().random})
              except: s.headers.update({'User-Agent': 'Mozilla/5.0'})
              return s

          def run_intelligence():
              print("🤖 AI Intelligence Core Initialized...")
              init_memory()
              memory = load_memory()
              
              report_buffer = ""
              knowledge_buffer = f"\n## 📅 Data Snapshot: {datetime.now().strftime('%Y-%m-%d %H:%M')}\n"
              total_new_count = 0
              session = get_session()

              for category, feeds in RSS_SOURCES.items():
                  print(f"📡 Scanning Sector: {category}...")
                  cat_content = ""
                  for feed in feeds:
                      try:
                          resp = session.get(feed['url'], timeout=20, verify=False)
                          parsed = feedparser.parse(resp.content)
                          if not parsed.entries: parsed = feedparser.parse(resp.text)
                          
                          for entry in parsed.entries[:5]: 
                              if entry.link in memory: continue 
                              memory.add(entry.link)
                              total_new_count += 1
                              
                              title = entry.title
                              summary = clean_html(getattr(entry, 'summary', ''))
                              if feed['lang'] == 'en':
                                  title = f"[번역] {translate(title)}"
                                  if summary: summary = translate(summary[:100]) + "..."
                              
                              item_md = f"- **[{title}]({entry.link})**\n  - {summary}\n\n"
                              cat_content += item_md
                      except Exception as e: print(f"⚠️ Error: {e}")

                  if cat_content:
                      report_buffer += f"### {category}\n{cat_content}"
                      knowledge_buffer += f"### {category}\n{cat_content}"

              if total_new_count > 0:
                  save_memory(memory)
                  with open(LOG_FILE, 'a', encoding='utf-8') as f: f.write(knowledge_buffer)
                  header = f"# 🤖 Global Intelligence Briefing\n> 🧠 Memory Nodes: {len(memory)} | 🆕 New Items: {total_new_count}\n\n"
                  with open(REPORT_FILE, 'w', encoding='utf-8') as f: f.write(header + report_buffer)
                  print(f"✅ Data Processed. New Items: {total_new_count}")
              else:
                  with open(REPORT_FILE, 'w', encoding='utf-8') as f: f.write("# 🤖 Status: Idle\n\n> No new updates.")
                  print("💤 No new data.")

          if __name__ == "__main__":
              run_intelligence()
          EOF
          
          python ai_neural_core.py

      # ------------------------------------------------------------------
      # 💾 학습 데이터 영구 저장 (Git)
      # ------------------------------------------------------------------
      - name: 💾 Commit AI Memory
        run: |
          git config --global user.name "Copilot AI Bot"
          git config --global user.email "ai-bot@github.actions"
          git add DB/
          git commit -m "🧠 Data Accumulation [$(date +'%Y-%m-%d %H:%M')]" || echo "No updates."
          git push

      # ------------------------------------------------------------------
      # 🏷️ 버전 태그 생성
      # ------------------------------------------------------------------
      - name: 🏷️ Generate Version Tag
        id: tagger
        shell: bash
        run: |
          VERSION_TAG="v$(date +'%Y.%m.%d-%H%M')"
          echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT
          # Docker 이미지 태그용 소문자 변환 (필수)
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=$REPO_LOWER" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # 🐳 [NEW] Dockerfile 동적 생성
      # ------------------------------------------------------------------
      - name: 🐳 Generate Dockerfile
        run: |
          cat <<EOF > Dockerfile
          # 가벼운 Python 이미지 기반
          FROM python:3.11-slim
          
          # 작업 디렉토리 설정
          WORKDIR /app
          
          # 필수 패키지 설치
          RUN pip install feedparser requests beautifulsoup4 lxml duckduckgo-search fake-useragent deep-translator pandas tabulate
          
          # 현재 디렉토리(누적된 DB 포함)를 컨테이너로 복사
          COPY . /app
          
          # 메타데이터 레이블 추가
          LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          LABEL org.opencontainers.image.description="AI Security & Finance Intelligence Data Lake"
          LABEL org.opencontainers.image.licenses="MIT"
          
          # 실행 명령 (컨테이너 실행 시 다시 한번 수집 시도 가능)
          CMD ["python", "ai_neural_core.py"]
          EOF

      # ------------------------------------------------------------------
      # 🐳 [NEW] GitHub Container Registry 로그인
      # ------------------------------------------------------------------
      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} #

      # ------------------------------------------------------------------
      # 🐳 [NEW] Docker 이미지 빌드 및 푸시
      # ------------------------------------------------------------------
      - name: 🚀 Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 태그 지정: 버전별 태그와 latest 태그 동시 생성
          tags: |
            ghcr.io/${{ steps.tagger.outputs.repo_lower }}:${{ steps.tagger.outputs.version }}
            ghcr.io/${{ steps.tagger.outputs.repo_lower }}:latest
          # 레이블 지정 (리포지토리 연결용)
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Daily AI Intelligence Briefing

      # ------------------------------------------------------------------
      # 🖥️ 대시보드 출력
      # ------------------------------------------------------------------
      - name: 🖥️ Display Dashboard
        if: always()
        run: |
          echo "## 🤖 AI & Container Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "| System | Status | Memory | Container Image |" >> $GITHUB_STEP_SUMMARY
          echo "| :---: | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| **Neural Core** | 🟢 **ONLINE** | **$(jq length DB/neural_memory.json 2>/dev/null || echo 0)** | \`ghcr.io/...:${{ steps.tagger.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f latest_briefing.md ]; then cat latest_briefing.md >> $GITHUB_STEP_SUMMARY; fi

      # ------------------------------------------------------------------
      # 🚀 릴리즈 생성
      # ------------------------------------------------------------------
      - name: 🚀 Release Package
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ steps.tagger.outputs.version }}
          name: "🐳 Containerized Intelligence ${{ steps.tagger.outputs.version }}"
          body_path: latest_briefing.md
          files: |
            latest_briefing.md
            DB/knowledge_base.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
