name: Hourly Security Display & Archive

on:
  schedule:
    - cron: '0 * * * *' # 매 시간 실행
  workflow_dispatch: # 수동 실행

permissions:
  contents: write
  issues: write

jobs:
  security-display:
    name: 📊 화면 출력 및 보관 (Display & Archive)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Tools
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 lxml duckduckgo-search fake-useragent deep-translator

      - name: 🤖 Run Security Agent
        run: python security_news.py

      # [핵심 기능] 이 단계가 화면에 뉴스를 보여줍니다
      - name: 🖥️ Show on Summary Screen
        if: always()
        run: |
          if [ -f hourly_security_report.md ]; then
            cat hourly_security_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: 💾 Archive to DB (Commit)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add DB/
          git commit -m "🗄️ News DB Update" || echo "No changes"
          git push

      - name: 🏷️ Release & Issue
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v$(date +'%Y.%m.%d-%H%M')
          body_path: hourly_security_report.md
          files: hourly_security_report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
