name: 🌌 Omni-Intelligence Grand Pipeline (Prod Ready)

on:
  schedule:
    - cron: '0 21 * * *' # ⏰ KST 06:00
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write

# [✅ 전역 환경 설정]
env:
  TZ: 'Asia/Seoul'
  RETRY_MAX: 5
  REGISTRY: ghcr.io
  JAVA_OPTS: "-XX:+UseG1GC -Xmx512m -Xms256m -XX:MaxMetaspaceSize=128m -XX:+AlwaysPreTouch"

jobs:
  # ==============================================================================
  # 🛡️ 1. Security Engine
  # ==============================================================================
  security-core:
    name: 🛡️ Security Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🧹 Disk Cleaner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - run: mkdir -p DB_SEC/primary DB_SEC/replica DB_SEC/archive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install faker
      - name: 🧬 Generate Data
        run: |
          cat << 'EOF' > sec_core.py
          import json, os
          from faker import Faker
          fake = Faker()
          data = [{"id":f"SEC-{i}", "cve":f"CVE-2026-{10000+i}", "desc":fake.sentence()} for i in range(500000)]
          with open("DB_SEC/primary/security_data.json", "w") as f: json.dump(data, f)
          EOF
          python sec_core.py
      - name: 📦 Archive
        run: |
          sha256sum DB_SEC/primary/security_data.json > DB_SEC/primary/checksum.sha256
          cp DB_SEC/primary/* DB_SEC/replica/
          tar -czf pkg-sec-primary.tar.gz DB_SEC/primary/
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-sec-primary
          path: pkg-sec-primary.tar.gz

  # ==============================================================================
  # 💼 2. Job Engine
  # ==============================================================================
  job-core:
    name: 💼 Job Fortress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_JOB/primary DB_JOB/replica DB_JOB/archive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install faker
      - name: 🧬 Generate Data
        run: |
          cat << 'EOF' > job_core.py
          import json
          from faker import Faker
          fake = Faker()
          data = [{"id":f"JOB-{i}", "title":fake.job(), "loc":"Global"} for i in range(300000)]
          with open("DB_JOB/primary/job_data.json", "w") as f: json.dump(data, f)
          EOF
          python job_core.py
      - name: 📦 Archive
        run: |
          sha256sum DB_JOB/primary/job_data.json > DB_JOB/primary/checksum.sha256
          cp DB_JOB/primary/* DB_JOB/replica/
          tar -czf pkg-job-primary.tar.gz DB_JOB/primary/
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-job-primary
          path: pkg-job-primary.tar.gz

  # ==============================================================================
  # 🧮 3. Algo Engine
  # ==============================================================================
  algo-core:
    name: 🧮 Algo Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_ALGO/primary DB_ALGO/replica
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 🧬 Generate Data
        run: |
          cat << 'EOF' > algo_core.py
          import json
          data = [{"id":i, "algo":f"Model-{i}"} for i in range(100000)]
          with open("DB_ALGO/primary/algo_data.json", "w") as f: json.dump(data, f)
          EOF
          python algo_core.py
      - name: 📦 Archive
        run: tar -czf pkg-algo-primary.tar.gz DB_ALGO/primary/
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-algo-primary
          path: pkg-algo-primary.tar.gz

  # ==============================================================================
  # 💰 4. Cost Engine
  # ==============================================================================
  misc-core:
    name: 💰 Cost Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p DB_COST/primary DB_COST/replica
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 🧬 Generate Data
        run: |
          cat << 'EOF' > misc_core.py
          import json
          data = [{"id":i, "cost":100+i} for i in range(100000)]
          with open("DB_COST/primary/cost_data.json", "w") as f: json.dump(data, f)
          EOF
          python misc_core.py
      - name: 📦 Archive
        run: tar -czf pkg-cost-primary.tar.gz DB_COST/primary/
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-cost-primary
          path: pkg-cost-primary.tar.gz

  # ==============================================================================
  # 🏗️ 5. Infra Automation
  # ==============================================================================
  infra-engine:
    name: 🏗️ Infra Automation
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Generate Maintenance Scripts
        run: |
          mkdir -p infra_scripts
          
          # OS Upgrade Script
          cat <<EOF > infra_scripts/server_upgrade.sh
          #!/bin/bash
          echo "🚀 Starting Server Upgrade..."
          sudo apt-get update && sudo apt-get upgrade -y
          sudo apt-get autoremove -y
          docker system prune -af --volumes
          echo "✅ Server Optimized."
          EOF
          
          # Blue/Green Deployment Script
          cat <<EOF > infra_scripts/deploy_blue_green.sh
          #!/bin/bash
          ACTIVE=\$(docker ps --filter "name=omni-app-blue" -q)
          if [ -z "\$ACTIVE" ]; then
            TARGET="blue"
            OLD="green"
          else
            TARGET="green"
            OLD="blue"
          fi
          echo "🚀 Deploying to \$TARGET..."
          docker pull ghcr.io/${{ github.repository_owner }}/omni-security-service:latest
          docker run -d --name omni-app-\$TARGET -p 8080:8080 --restart always ghcr.io/${{ github.repository_owner }}/omni-security-service:latest
          echo "✅ Switched to \$TARGET. Stopping \$OLD..."
          docker stop omni-app-\$OLD || true
          docker rm omni-app-\$OLD || true
          EOF
          
          chmod +x infra_scripts/*.sh
          tar -czf pkg-infra-scripts.tar.gz infra_scripts/
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-infra
          path: pkg-infra-scripts.tar.gz

  # ==============================================================================
  # 🏭 6. Service Factory (Prod)
  # ==============================================================================
  services-factory:
    needs: [security-core, job-core, algo-core, misc-core, infra-engine]
    name: 🏭 Service Factory (Prod)
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
        continue-on-error: true

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: 'pkg-*-primary'
          merge-multiple: true
        continue-on-error: true

      - name: ☕ JDK 17 Setup
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🛠️ Organize Data
        run: |
          for pkg in *.tar.gz; do tar -xzf "$pkg" || echo "Skip"; done
          mkdir -p DB_SEC/live DB_JOB/live DB_ALGO/live DB_COST/live
          [ -d "DB_SEC/primary" ] && mv DB_SEC/primary/* DB_SEC/live/
          [ -d "DB_JOB/primary" ] && mv DB_JOB/primary/* DB_JOB/live/
          [ -d "DB_ALGO/primary" ] && mv DB_ALGO/primary/* DB_ALGO/live/
          [ -d "DB_COST/primary" ] && mv DB_COST/primary/* DB_COST/live/

      - name: 🏗️ Scaffold & Build
        run: |
          rm -rf services
          mkdir -p services
          SERVICES="security job algo cost"
          for svc in $SERVICES; do
            mkdir -p services/omni-$svc-service/src/main/java/com/costdata/$svc
            mkdir -p services/omni-$svc-service/src/main/resources/data
            
            # Data Injection
            if [ -d "DB_SEC/live" ] && [ "$svc" == "security" ]; then cp -r DB_SEC/live/* services/omni-$svc-service/src/main/resources/data/; fi
            if [ -d "DB_JOB/live" ] && [ "$svc" == "job" ]; then cp -r DB_JOB/live/* services/omni-$svc-service/src/main/resources/data/; fi
            if [ -d "DB_ALGO/live" ] && [ "$svc" == "algo" ]; then cp -r DB_ALGO/live/* services/omni-$svc-service/src/main/resources/data/; fi
            if [ -d "DB_COST/live" ] && [ "$svc" == "cost" ]; then cp -r DB_COST/live/* services/omni-$svc-service/src/main/resources/data/; fi
            
            # POM
            cat <<EOF > services/omni-$svc-service/pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <parent><groupId>com.costdata</groupId><artifactId>omni-platform</artifactId><version>1.0.0</version></parent>
              <artifactId>omni-$svc-service</artifactId>
              <packaging>jar</packaging>
              <dependencies>
                  <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId></dependency>
                  <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-actuator</artifactId></dependency>
                  <dependency><groupId>jakarta.annotation</groupId><artifactId>jakarta.annotation-api</artifactId></dependency>
              </dependencies>
              <build><plugins><plugin><groupId>org.springframework.boot</groupId><artifactId>spring-boot-maven-plugin</artifactId><configuration><layers><enabled>true</enabled></layers></configuration></plugin></plugins></build>
          </project>
          EOF
            # Java
            cat <<EOF > services/omni-$svc-service/src/main/java/com/costdata/$svc/ServiceApplication.java
          package com.costdata.$svc;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.RestController;
          import java.util.Map;
          @SpringBootApplication @RestController
          public class ServiceApplication {
              public static void main(String[] args) { SpringApplication.run(ServiceApplication.class, args); }
              @GetMapping("/") public Map<String, String> s() { return Map.of("status", "online", "mode", "production"); }
          }
          EOF
          done
          
          # Root POM
          cat <<EOF > services/pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.costdata</groupId><artifactId>omni-platform</artifactId><version>1.0.0</version>
              <packaging>pom</packaging>
              <modules>
                  <module>omni-security-service</module>
                  <module>omni-job-service</module>
                  <module>omni-algo-service</module>
                  <module>omni-cost-service</module>
              </modules>
              <parent><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-parent</artifactId><version>3.2.1</version><relativePath/></parent>
          </project>
          EOF

      - name: 🔨 Compile
        run: cd services && mvn clean package -DskipTests

      - name: 🐳 Docker Grid Push (Secured)
        run: |
          SERVICES="security job algo cost"
          for svc in $SERVICES; do
            cd services/omni-$svc-service
            
            # Dockerfile
            cat <<EOF > Dockerfile
          FROM eclipse-temurin:17-jre-jammy AS builder
          WORKDIR /app
          COPY target/*.jar app.jar
          RUN java -Djarmode=layertools -jar app.jar extract
          FROM eclipse-temurin:17-jre-jammy
          RUN groupadd -r omni && useradd -r -g omni omni
          USER omni
          WORKDIR /app
          COPY --from=builder /app/dependencies/ ./
          COPY --from=builder /app/spring-boot-loader/ ./
          COPY --from=builder /app/snapshot-dependencies/ ./
          COPY --from=builder /app/application/ ./
          ENV JAVA_OPTS="${{ env.JAVA_OPTS }}"
          STOPSIGNAL SIGTERM
          HEALTHCHECK --interval=30s --timeout=5s CMD curl -f http://localhost:8080/actuator/health || exit 1
          ENTRYPOINT ["sh", "-c", "java \$JAVA_OPTS org.springframework.boot.loader.launch.JarLauncher"]
          EOF
            
            IMG="ghcr.io/${GITHUB_REPOSITORY,,}/omni-$svc-service:latest"
            
            # Build
            n=0
            until [ "$n" -ge 5 ]; do
              docker buildx build \
                --platform linux/amd64,linux/arm64 \
                --tag $IMG \
                --cache-from type=gha \
                --cache-to type=gha,mode=max \
                --push . && break
              n=$((n+1))
              sleep 10
            done
            cd ../.. 
           done

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-artifacts
          path: services/

  # ==============================================================================
  # 🚀 7. ServerOps Release
  # ==============================================================================
  grand-release:
    needs: [services-factory, infra-engine]
    name: 🚀 ServerOps Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: release_assets
        continue-on-error: true
      - name: 🏷️ Tagging
        id: tagger
        run: echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
      - name: 📦 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tagger.outputs.tag }}
          name: 🌌 ServerOps Release ${{ steps.tagger.outputs.tag }}
          body: |
            # 🌌 Omni-Intelligence ServerOps Edition
            **Update Highlights:**
            - 🎮 **Content:** Official Pokemon GO Source Links Added
            - 🛠️ **Fix:** Dockerfile Syntax & Security
            - 🚀 **Performance:** Build Cache Enabled
          files: |
            release_assets/*.tar.gz
            release_assets/services/**/target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ==============================================================================
  # 🌍 8. Master Hub (정보 통합 대시보드)
  # ==============================================================================
  master-hub:
    needs: [grand-release]
    name: 🌍 Master Dashboard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: 📊 Dashboard
        run: |
          cat << 'EOF' > dashboard.py
          import datetime, os
          now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M')
          
          # [1. 공식 출처 데이터 모음]
          official_sources = """
          ### 📌 Pokémon GO 공식 정보 모음 (Official Sources)
          
          #### 🎮 기본 공식 채널
          - **공식 홈페이지 (KR):** [바로가기](https://pokemongo.com/ko/)
          - **뉴스 / 이벤트 공지:** [전체보기](https://pokemongolive.com/news?hl=ko)
          
          #### 🗺️ 시즌: 보물찾기의 길 (Precious Paths)
          - **기간:** 12/2 ~ 3/2
          - **시즌 공식 페이지:** [상세보기](https://pokemongo.com/ko/seasons/precious-paths)
          - **GO 배틀리그 안내:** [GBL 공지](https://pokemongo.com/ko/news/go-battle-league-precious-paths)
          
          #### 📅 레이드 & 이벤트 일정 (공식 분류)
          - **전설/메가 로테이션:** [뉴스 확인](https://pokemongolive.com/news?hl=ko)
          - **레이드/스포트라이트 아워:** [주간 공지 모음](https://pokemongolive.com/post/?hl=ko)
          - **맥스/거다이맥스:** [공식 안내](https://pokemongolive.com/post/dynamax?hl=ko)
          - **대발견 보상 (12월~3월):** [리서치 안내](https://pokemongolive.com/post/research-breakthrough?hl=ko)
          
          #### 🎉 스페셜 이벤트 & 지역
          - **커뮤니티 데이:** [공식 공지](https://pokemongolive.com/post/community-day?hl=ko)
          - **레이드 데이:** [공식 공지](https://pokemongolive.com/post/raid-day?hl=ko)
          - **GO 투어 (칼로스):** [이벤트 페이지](https://pokemongolive.com/events/tour?hl=ko)
          - **한국 지역 이벤트:** [Live Events](https://pokemongolive.com/events/live?hl=ko)
          """

          # [2. 성능 분석 및 티어 (커뮤니티)]
          tier_info = """
          ### 📊 성능 분석 및 티어 리스트 (Unofficial)
          > ⚠️ 아래 정보는 Niantic 공식 자료가 아니며, 커뮤니티 데이터입니다.
          
          - **GamePress (종합 티어):** [Attackers Tier List](https://gamepress.gg/pokemongo/attackers-tier-list)
          - **타입별 레이드 티어 (Google Sheets):** [데이터 시트 보기](https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-a0DcSGf2dITFS2ekiQkX2SJ6AHSY6FIuLJdzJUlkS4rdC6QabZnMcKJeKY7zwLK18XjYwfIl7DX4/pubhtml?gid=392792009&single=true)
          """

          # [3. 다가오는 일정 요약 (1월-2월)]
          upcoming_events = """
          ### 🗓️ Upcoming Events (Jan - Feb)
          
          **🔥 레이드 (Raids)**
          - **1/16~1/25:** ⚡ 볼트로스(화신)✨ / 🦎 메가 나무킹✨
          - **1/25~:** 🌪️ 토네로스(화신)✨ / ⚡ 메가 전룡✨
          - **1/24 (토):** 🐯 그림자 라이코✨ 레이드 데이
          - **2/14 (토):** 🧚 러브로스(영물)✨ 레이드 데이
          
          **🎉 주요 일정**
          - **1/19~1/25:** ❄️ [평창] 겨울 축제 ✨⭐️
          - **1/26 (월):** 맥스 단굴✨
          - **1/27 (화):** 스포트라이트 깜놀버슬✨
          - **2/1 (일):** 🦊 식스테일 커뮤니티데이✨
          - **2/28~3/1:** 🌍 칼로스 투어: 글로벌
          """

          md = f"# 🌌 Omni-Intelligence Hub (ServerOps)\n\n"
          md += f"![Status](https://img.shields.io/badge/System-Operational-green) ![Data](https://img.shields.io/badge/PokemonGO-Official_Sources-blue)\n\n"
          md += f"## 🚀 Operations Report ({now})\n"
          md += "- **System:** Stable\n"
          md += "- **Security:** Secured (Non-Root)\n\n"
          md += "--- \n"
          md += official_sources + "\n"
          md += tier_info + "\n"
          md += upcoming_events
          
          with open("README.md", "w") as f: f.write(md)
          EOF
          python dashboard.py
      - name: 🌿 Commit
        run: |
          git config --global user.name "Omni Bot"
          git config --global user.email "bot@actions"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          
          if [ -d "services" ]; then git add services/; fi
          git add README.md
          
          if git diff --cached --quiet; then echo "✨ No changes"; exit 0; fi
          git commit -m "🌌 Update: Pokemon GO Official Sources & Events $(date +'%Y-%m-%d')"
          
          n=0
          until [ "$n" -ge 10 ]; do 
             git pull origin main --no-rebase -s recursive -X ours && git push origin main && break
             n=$((n+1))
             sleep 5
          done
