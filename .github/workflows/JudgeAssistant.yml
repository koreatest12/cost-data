name: 🚀 AI Judge 20.0 - Enterprise Dashboard & Force Sync

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '*/5 * * * *' # 5분마다 충돌 없이 강제 동기화 및 갱신
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: 📥 소스 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 모든 히스토리를 가져와 충돌 방지

      - name: 📂 시스템 인프라 강제 재구축
        run: |
          mkdir -p public/wiki public/api public/press assets
          touch public/.nojekyll

      - name: 🔨 초중형 판결 엔진 v20.0 (통계 및 CSV 기능 추가)
        run: |
          cat << 'EOF' > scripts/supreme_engine_v20.py
          import json, datetime, random, os

          TARGETS = {
              "김건희": ["주가조작", "명품백 뇌물", "양평 특혜", "공천 개입"],
              "윤석열": ["수사 외압", "여론조사 조작", "직권 남용", "헌법 위반"]
          }
          
          all_verdicts = []
          wiki_links = ""
          csv_data = "사건번호,피고인,혐의,판결,벌금,일시\n"

          for name, crimes in TARGETS.items():
              for crime in crimes:
                  case_id = f"LAW-{random.randint(1000,9999)}"
                  dice = random.randint(1, 10)
                  verdict = "사형 (Death Penalty)" if dice > 7 else "무기징역 (Life Imprisonment)"
                  fine = random.randint(5000, 9999)
                  date = datetime.datetime.now().strftime("%Y-%m-%d %H:%M")
                  
                  res = {"case_id": case_id, "target": name, "crime": crime, "verdict": verdict, "fine": f"{fine}억", "date": date}
                  all_verdicts.append(res)
                  csv_data += f"{case_id},{name},{crime},{verdict},{fine}억,{date}\n"

                  # 상세 위키 페이지 생성
                  wiki_html = f"<html><body style='font-family:sans-serif;padding:40px;'><h1>⚖️ 판결문: {case_id}</h1><hr><h3>피고인: {name}</h3><p>혐의: {crime}</p><h2>결과: {verdict}</h2><p>벌금: {fine}억</p><a href='../index.html'>돌아가기</a></body></html>"
                  with open(f"public/wiki/{case_id}.html", "w", encoding="utf-8") as f:
                      f.write(wiki_html)
                  wiki_links += f"<li><a href='./wiki/{case_id}.html'>[{case_id}] {name} 판결문</a></li>"

          # 메인 인덱스 생성 (404 방지 및 디자인 강화)
          index_html = f"""
          <!DOCTYPE html><html><head><meta charset='utf-8'><title>AI 재판부 v20.0</title>
          <style>
            body{{margin:0;display:flex;background:#0f172a;color:white;font-family:sans-serif;}}
            .side{{width:300px;background:#1e293b;padding:20px;border-right:1px solid #334155;height:100vh;overflow-y:auto;}}
            .content{{flex:1;padding:40px;overflow-y:auto;}}
            .card{{background:#1e293b;padding:20px;border-radius:10px;margin-bottom:15px;border-left:5px solid #ef4444;}}
            .stat-box{{display:flex;gap:20px;margin-bottom:30px;}}
            .stat{{background:#3b82f6;padding:15px;border-radius:8px;flex:1;text-align:center;}}
            a{{color:#60a5fa;text-decoration:none;}}
          </style></head><body>
          <div class='side'><h2>🏛️ 판결 위키</h2><ul>{wiki_links}</ul></div>
          <div class='content'>
            <h1>⚖️ AI 재판부 엔터프라이즈 대시보드 v20.0</h1>
            <div class='stat-box'>
                <div class='stat'>총 판결: {len(all_verdicts)}건</div>
                <div class='stat'>최고 형량: 무기/사형</div>
                <div class='stat'>업데이트: {datetime.datetime.now().strftime('%H:%M')}</div>
            </div>
            <div style='margin-bottom:20px;'><a href='./api/verdict.csv' style='background:#10b981;color:white;padding:10px;border-radius:5px;'>📊 언론사용 CSV 다운로드</a></div>
            {"".join([f"<div class='card'><h3>{v['target']}</h3><p>{v['crime']}</p><p><b>{v['verdict']}</b> | {v['fine']}</p></div>" for v in all_verdicts])}
          </div></body></html>
          """
          with open("public/index.html", "w", encoding="utf-8") as f:
              f.write(index_html)
          with open("public/api/verdict.json", "w", encoding="utf-8") as f:
              json.dump(all_verdicts, f, ensure_ascii=False, indent=2)
          with open("public/api/verdict.csv", "w", encoding="utf-8-sig") as f:
              f.write(csv_data)
          EOF
          python3 scripts/supreme_engine_v20.py

      - name: 🚀 강제 동기화 및 데이터 푸시 (Rejected 에러 해결)
        run: |
          git config --global user.name "Supreme-AI-Judge"
          git config --global user.email "judge@ai-court.gov"
          
          # 원격 변경사항 강제 동기화 및 덮어쓰기
          git add -f public/ README.md
          git commit -m "⚖️ [Enterprise] v20.0 Auto-Update $(date)" || echo "No changes"
          
          # fetch 후 rebase를 통해 충돌 제거 후 강제 푸시
          git pull --rebase origin main
          git push -f origin main

      - name: 📤 GitHub Pages 배포
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
