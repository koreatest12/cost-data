name: 🛠️ Fix & Run - Massive AI Judgment System

on:
  workflow_dispatch: # 버튼 클릭으로 즉시 실행

permissions:
  contents: write

jobs:
  run-massive-system:
    runs-on: ubuntu-latest
    steps:
      # ----------------------------------------------------------------
      # 1. 환경 설정 및 필수 디렉토리 강제 생성 (에러 방지 핵심)
      # ----------------------------------------------------------------
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Force Create Directories
        run: |
          echo "Creating necessary directories..."
          mkdir -p scripts
          mkdir -p data/generated_cases
          mkdir -p reports/cases
          mkdir -p logs
          echo "✅ Directories created successfully."

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: pip install faker numpy pandas scikit-learn

      # ----------------------------------------------------------------
      # 2. 모든 스크립트 재생성 (파일 누락 방지)
      # ----------------------------------------------------------------
      
      # [스크립트 1] 대량 사건 생성기 (고난도/특수 범죄 포함)
      - name: 📝 Restore generate_cases.py
        run: |
          cat << 'EOF' > scripts/generate_cases.py
          import json, os, random
          from faker import Faker
          fake = Faker('ko_KR')
          OUTPUT_DIR = "data/generated_cases"
          
          # 특수 범죄 시나리오
          CRIME_SCENARIOS = {
              "자본시장법 위반": {"detail": "주가 조작 및 시세 조종", "sentence": "징역 5년 이상"},
              "청탁금지법 위반": {"detail": "명품 가방 및 금품 수수", "sentence": "징역 3년 이하"},
              "특경법 위반(횡령)": {"detail": "법인 자금 50억 횡령", "sentence": "징역 5년 이상"},
              "업무방해(채용/입시)": {"detail": "성적 조작 및 위계에 의한 업무방해", "sentence": "징역 2년"}
          }
          
          def generate():
              for i in range(1, 301): # 300건 대량 생성
                  if random.random() < 0.6:
                      cat = random.choice(list(CRIME_SCENARIOS.keys()))
                      info = CRIME_SCENARIOS[cat]
                      c_type = "특수/공안"
                  else:
                      cat = "일반 형법"
                      info = {"detail": "단순 절도/폭행", "sentence": "징역 1년"}
                      c_type = "일반"
                      
                  data = {
                      "case_id": f"CASE-{i:04d}",
                      "type": c_type,
                      "category": cat,
                      "detail": info['detail'],
                      "defendant": fake.name(),
                      "job": fake.job(),
                      "damage": random.randint(1000000, 10000000000)
                  }
                  
                  with open(f"{OUTPUT_DIR}/CASE-{i:04d}.json", "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)

          if __name__ == "__main__":
              generate()
          EOF

      # [스크립트 2] 최종 판결문 작성기 (판사 모드)
      - name: 📝 Restore final_judgment.py
        run: |
          cat << 'EOF' > scripts/final_judgment.py
          import sys, json, random, datetime
          
          if len(sys.argv) < 2: sys.exit(1)
          with open(sys.argv[1], 'r', encoding='utf-8') as f:
              data = json.load(f)
              
          cat = data['category']
          # 랜덤 판결 로직
          if "자본시장법" in cat:
              res = "징역 5년, 벌금 100억 원"
          elif "청탁금지법" in cat:
              res = "무죄 (직무관련성 입증 부족)" if random.random() > 0.5 else "징역 1년, 집행유예 2년"
          elif "횡령" in cat:
              res = "징역 4년 (실형)"
          else:
              res = "징역 8월, 집행유예 2년"
              
          print(f"### ⚖️ AI 재판부 판결 ({datetime.date.today()})")
          print(f"- **피고인**: {data['defendant']} ({data['job']})")
          print(f"- **죄명**: {cat} ({data['detail']})")
          print(f"- **피해 규모**: {data['damage']:,} 원")
          print(f"\n> **주문: 피고인을 {res}에 처한다.**")
          EOF

      # ----------------------------------------------------------------
      # 3. 실행 단계 (대량 생성 -> 분석 -> 판결)
      # ----------------------------------------------------------------
      - name: 🏭 Generate Massive Data
        run: |
          echo "Generating 300 cases..."
          python scripts/generate_cases.py
          echo "✅ Generation Completed."

      - name: ⚖️ Execute Mass Judgment
        run: |
          echo "Processing judgments..."
          
          # 리포트 저장 폴더 재확인 (안전장치)
          mkdir -p reports/cases
          
          count=0
          for file in data/generated_cases/*.json; do
            filename=$(basename "$file" .json)
            
            # 판결문 생성 및 저장
            python scripts/final_judgment.py "$file" > "reports/cases/$filename.md"
            
            count=$((count+1))
          done
          
          echo "✅ All $count judgments completed."

      # ----------------------------------------------------------------
      # 4. 결과 통합 및 업로드
      # ----------------------------------------------------------------
      - name: 📑 Create Summary Report
        run: |
          echo "# 📊 AI 판사 대량 판결 요약" > reports/summary.md
          echo "총 처리 건수: $(ls reports/cases | wc -l)건" >> reports/summary.md
          echo "---" >> reports/summary.md
          echo "## 주요 판결 사례 (Top 10)" >> reports/summary.md
          head -n 50 reports/cases/*.md >> reports/summary.md || true

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Massive-Judgments
          path: reports/
