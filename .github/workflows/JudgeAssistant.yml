name: ⚖️ AI Judge 17.0 - Wiki System & Global Press Integration

on:
  schedule:
    - cron: '*/5 * * * *' # 5분마다 위키 및 언론 공표 업데이트
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  integrated-wiki-system:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: 📥 시스템 소스 체크아웃
        uses: actions/checkout@v4

      - name: 📂 시스템 인프라 구축
        run: |
          mkdir -p scripts data/evidence dist public/press-release wiki_temp
          echo "WIKI-ENGINE-READY-v17" > public/status.txt

      # ----------------------------------------------------------------
      # 1. 통합 사법 엔진 (증거 + 판결 + 보도문 + 위키 생성)
      # ----------------------------------------------------------------
      - name: 🔨 통합 엔진 가동 (Wiki & Press Master)
        run: |
          cat << 'EOF' > scripts/supreme_engine.py
          import json, datetime, random, os

          # [1] 데이터 생성 기초
          TARGETS = {
              "김건희": {
                  "혐의": ["주가조작", "뇌물 수수", "국정 개입", "특혜 의혹"],
                  "근거법령": "자본시장법, 청탁금지법, 특정경제범죄 가중처벌법"
              },
              "윤석열": {
                  "혐의": ["수사 외압", "여론 조작", "직권 남용", "헌법 위반"],
                  "근거법령": "군형법, 공직선거법, 헌법 제65조"
              }
          }
          
          results = []
          wiki_pages = []

          for name, info in TARGETS.items():
              for crime in info['혐의']:
                  dice = random.randint(1, 10)
                  verdict = "사형 (Death Penalty)" if dice > 6 else "무기징역 (Life Imprisonment)"
                  fine = random.randint(5000, 9999)
                  case_id = f"LAW-2026-{random.randint(1000, 9999)}"
                  
                  data = {
                      "case_id": case_id,
                      "target": name,
                      "crime": crime,
                      "verdict": verdict,
                      "fine": f"{fine}억",
                      "law": info['근거법령'],
                      "date": datetime.datetime.now().strftime("%Y-%m-%d %H:%M")
                  }
                  results.append(data)

                  # 위키 페이지 마크다운 생성
                  wiki_md = f"# ⚖️ 사건번호: {case_id}\n\n"
                  wiki_md += f"## 👤 피고인 명단\n- **{name}**\n\n"
                  wiki_md += f"## 📜 확정 혐의\n- {crime}\n\n"
                  wiki_md += f"## 🔨 선고 결과\n- **형량:** {verdict}\n- **벌금:** {fine}억 원 환수 명령\n\n"
                  wiki_md += f"## ⚖️ 적용 법령 및 근거\n- {info['근거법령']}\n- AI 재판부 판례 제2026-01호 적용\n\n"
                  wiki_md += f"---\n*최종 수정일: {data['date']}*"
                  
                  wiki_pages.append((f"{case_id}.md", wiki_md))

          # 데이터 저장
          os.makedirs("data/evidence", exist_ok=True)
          with open("public/api_verdict.json", "w", encoding="utf-8") as f:
              json.dump(results, f, ensure_ascii=False, indent=2)
          
          # 위키 파일 임시 저장
          for filename, content in wiki_pages:
              with open(f"wiki_temp/{filename}", "w", encoding="utf-8") as f:
                  f.write(content)
          EOF
          python3 scripts/supreme_engine.py

      # ----------------------------------------------------------------
      # 2. 위키(Wiki) 대량 업데이트 및 외부 노출
      # ----------------------------------------------------------------
      - name: 📖 GitHub Wiki 업데이트 및 아카이빙
        run: |
          # 메인 리포지토리의 HISTORY.md 업데이트
          echo "## 🏛️ AI 재판부 위키 업데이트 기록 ($(date))" >> HISTORY.md
          ls wiki_temp/*.md | xargs -n 1 basename >> HISTORY.md
          
          # Wiki 전용 리포지토리에 반영 (클론 방식)
          # 주: .wiki.git 주소를 사용하여 위키에 직접 푸시
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki_repo || mkdir wiki_repo
          cp wiki_temp/*.md wiki_repo/
          
          cd wiki_repo
          git config --global user.name "Supreme-Wiki-Bot"
          git config --global user.email "wiki@ai-court.gov"
          
          # Home.md (위키 메인) 자동 생성/업데이트
          echo "# ⚖️ AI 재판부 공식 판결 위키" > Home.md
          echo "## 📢 최근 판결 목록" >> Home.md
          ls *.md | grep -v "Home.md" | sed 's/\.md//' | xargs -I {} echo "- [[{}]]" >> Home.md
          
          git add .
          git commit -m "📖 Wiki Bulk Update: New Judgments Logged" || echo "No changes"
          git push origin master || git push origin main

      # ----------------------------------------------------------------
      # 3. 배포 및 릴리즈 (Press Center 통합)
      # ----------------------------------------------------------------
      - name: 🚀 글로벌 릴리즈 및 API 공개
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Supreme-AI-Judge"
          git config --global user.email "court@ai.judge"
          
          git add -f public/api_verdict.json HISTORY.md
          git commit -m "⚖️ [Verdict & Wiki] v17.0 Full System Deployed" || echo "No changes"
          
          TAG="WIKI-v17.0-$(date +'%y%m%d%H%M')"
          git tag $TAG
          git push origin $TAG
          
          gh release create $TAG public/api_verdict.json --title "🏛️ 위키 및 판결 속보: $TAG" --notes "AI 재판부 위키 문서 대량 업데이트 및 API 데이터 배포"
