name: 🛠️ Initialize Project (Create Scripts)

on:
  workflow_dispatch: # 버튼 클릭으로 수동 실행

permissions:
  contents: write # 리포지토리에 파일을 쓸 수 있는 권한 부여

jobs:
  create-files:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Create Directories
        run: |
          mkdir -p scripts
          mkdir -p data/generated_cases
          mkdir -p reports/cases
          mkdir -p logs

      # ---------------------------------------------------------
      # 1. 의존성 파일 생성 (requirements.txt)
      # ---------------------------------------------------------
      - name: 📝 Create requirements.txt
        run: |
          cat << 'EOF' > requirements.txt
          faker
          numpy
          pandas
          scikit-learn
          shap
          EOF

      # ---------------------------------------------------------
      # 2. 대량 사건 생성 스크립트 (generate_cases.py)
      # ---------------------------------------------------------
      - name: 📝 Create scripts/generate_cases.py
        run: |
          cat << 'EOF' > scripts/generate_cases.py
          import json, os, random
          from faker import Faker

          fake = Faker('ko_KR')
          OUTPUT_DIR = "data/generated_cases"
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          CRIME_TYPES = {
              "사기": ["보이스피싱", "중고나라 사기", "전세 사기", "투자 사기"],
              "절도": ["빈집털이", "차량 털이", "편의점 절도", "특수 절도"],
              "폭행": ["단순 폭행", "특수 폭행", "상해", "쌍방 폭행"],
              "횡령": ["업무상 횡령", "법인카드 유용", "공금 횡령"],
              "음주운전": ["면허 취소 수준", "사고 후 미조치", "단순 음주 적발"]
          }

          def generate_case(case_id):
              crime_category = random.choice(list(CRIME_TYPES.keys()))
              crime_detail = random.choice(CRIME_TYPES[crime_category])
              damage_amount = 0
              if crime_category in ["사기", "횡령", "절도"]:
                  damage_amount = random.randint(100000, 1000000000)

              return {
                  "case_id": case_id,
                  "defendant": {
                      "name": fake.name(),
                      "address": fake.address(),
                      "birth_date": fake.date_of_birth(minimum_age=19, maximum_age=80).strftime("%Y-%m-%d"),
                      "job": fake.job()
                  },
                  "crime_summary": {
                      "category": crime_category,
                      "detail": crime_detail,
                      "description": f"피고인은 {fake.date_this_year()} 경, {fake.city()} 일대에서 {crime_detail} 혐의로 기소됨.",
                      "damage_amount_krw": damage_amount
                  },
                  "legal_history": {
                      "prior_convictions": random.randint(0, 5),
                      "probation_status": random.choice([True, False])
                  },
                  "submitted_evidence": random.sample(["CCTV 영상", "계좌 이체 내역", "목격자 진술", "피해자 탄원서", "합의서"], k=random.randint(1, 3))
              }

          if __name__ == "__main__":
              print("🚀 대량 사건 데이터 생성을 시작합니다...")
              # 50건 생성 (데모용)
              for i in range(1, 51):
                  c_id = f"CASE-2026-{i:04d}"
                  data = generate_case(c_id)
                  file_path = os.path.join(OUTPUT_DIR, f"{c_id}.json")
                  with open(file_path, "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
              print(f"✅ 총 {i}건의 사건 파일 생성 완료.")
          EOF

      # ---------------------------------------------------------
      # 3. 사건 요약 스크립트 (summarize_case.py)
      # ---------------------------------------------------------
      - name: 📝 Create scripts/summarize_case.py
        run: |
          cat << 'EOF' > scripts/summarize_case.py
          import sys, json
          if len(sys.argv) < 2: sys.exit(1)
          with open(sys.argv[1], 'r', encoding='utf-8') as f:
              data = json.load(f)
          print(f"[AI 요약] 피고인 {data['defendant']['name']} ({data['defendant']['job']})")
          print(f"혐의: {data['crime_summary']['category']} - {data['crime_summary']['detail']}")
          print(f"피해규모: {data['crime_summary']['damage_amount_krw']:,}원")
          EOF

      # ---------------------------------------------------------
      # 4. 판례 검색 스크립트 (search_precedent.py)
      # ---------------------------------------------------------
      - name: 📝 Create scripts/search_precedent.py
        run: |
          cat << 'EOF' > scripts/search_precedent.py
          import sys, json, random
          print("- 대법원 2024도1234 (유사도: 89%)")
          print("- 서울중앙지법 2023고단5678 (유사도: 82%)")
          print("- 부산지법 2025고합1122 (유사도: 75%)")
          EOF

      # ---------------------------------------------------------
      # 5. 양형 추천 스크립트 (sentencing_recommend.py)
      # ---------------------------------------------------------
      - name: 📝 Create scripts/sentencing_recommend.py
        run: |
          cat << 'EOF' > scripts/sentencing_recommend.py
          import sys
          print("권고 형량: 징역 1년 ~ 2년 (집행유예 가능)")
          print("양형 인자: 피해 회복 노력 부족, 그러나 초범임.")
          EOF

      # ---------------------------------------------------------
      # 6. 위험도 분석 스크립트 (risk_predict.py)
      # ---------------------------------------------------------
      - name: 📝 Create scripts/risk_predict.py
        run: |
          cat << 'EOF' > scripts/risk_predict.py
          import sys, random
          score = random.randint(10, 90)
          level = "고위험" if score > 70 else "중위험" if score > 40 else "저위험"
          print(f"재범 위험성: {score}/100 ({level})")
          EOF

      # ---------------------------------------------------------
      # 7. 설명 가능성 스크립트 (explainability.py)
      # ---------------------------------------------------------
      - name: 📝 Create scripts/explainability.py
        run: |
          cat << 'EOF' > scripts/explainability.py
          print("AI 판단 근거 (SHAP):")
          print("- 주요 요인: 피해 금액(45%), 전과 여부(30%)")
          EOF

      # ---------------------------------------------------------
      # 8. GitHub 리포지토리에 반영 (Commit & Push)
      # ---------------------------------------------------------
      - name: 📤 Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          # 변경 사항이 있을 때만 커밋 (에러 방지)
          git commit -m "🤖 Auto-generated project scripts by Init Workflow" || echo "No changes to commit"
          
          git push
