name: ⚖️ AI Judge 13.1 - Ultimate Heavy Verdict

on:
  schedule:
    - cron: '*/5 * * * *' # 5분마다 자동 판결 집행
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "judgment"
  cancel-in-progress: false

jobs:
  heavy-judgment-release:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: 📥 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: 📂 시스템 인프라 및 API 경로 구축
        run: |
          mkdir -p scripts data/evidence reports dist public
          echo "AI-JUDGE-SYSTEM-v13.1" > public/version.txt

      # ----------------------------------------------------------------
      # 1. 증거 수집 엔진: 무관용 원칙 적용
      # ----------------------------------------------------------------
      - name: 🕵️ 스모킹건 증거 수집 (v13.1)
        run: |
          cat << 'EOF' > scripts/evidence_hunter.py
          import json, random, datetime
          def hunt():
              NETWORK = {
                  "김건희": ["도이치모터스 주가조작", "명품백 수수", "양평 특혜", "공천 개입"],
                  "윤석열": ["채상병 수사 외압", "여론조사 조작", "직권 남용", "헌법 유린"]
              }
              results = []
              for target, crimes in NETWORK.items():
                  for crime in crimes:
                      results.append({
                          "case_id": f"LAW-{datetime.datetime.now().strftime('%Y%m%d')}-{random.randint(1000,9999)}",
                          "target": target,
                          "crime": crime,
                          "evidence": "특검급 스모킹건 확보",
                          "severity": "MAXIMUM"
                      })
              return results
          if __name__ == "__main__":
              with open("data/evidence/latest.json", "w", encoding="utf-8") as f:
                  json.dump(hunt(), f, ensure_ascii=False, indent=2)
          EOF
          python3 scripts/evidence_hunter.py

      # ----------------------------------------------------------------
      # 2. 판결 집행 엔진: 사형 및 무기징역 초중형 선고
      # ----------------------------------------------------------------
      - name: 🔨 초중형 판결 알고리즘 주입
        run: |
          cat << 'EOF' > scripts/joint_judgment.py
          import json, datetime, random
          with open("data/evidence/latest.json", "r", encoding="utf-8") as f:
              cases = json.load(f)
          
          summary = "## ⚖️ AI 재판부 초엄격 판결문 (v13.1)\n\n"
          summary += "| 🚨 피고인 | 📜 범죄 혐의 | 🔨 선고 결과 | 📜 판결 요지 |\n"
          summary += "|:---:|---|:---:|---|\n"
          
          api_data = []
          for case in cases:
              score = random.randint(1, 10)
              if score > 7:
                  verdict = "**사형 (Death Penalty)**"
              elif score > 3:
                  verdict = "**무기징역 (Life Imprisonment)**"
              else:
                  verdict = f"**징역 {random.randint(50, 100)}년**"
              
              fine = random.randint(1000, 5000) 
              summary += f"| {case['target']} | {case['crime']} | {verdict} | 가석방 없는 엄벌 (벌금 {fine}억 환수) |\n"
              api_data.append({"target": case['target'], "crime": case['crime'], "verdict": verdict, "fine": f"{fine}억"})
          
          with open("GITHUB_SUMMARY.md", "w", encoding="utf-8") as f:
              f.write(summary)
          with open("dist/verdict_api.json", "w", encoding="utf-8") as f:
              json.dump(api_data, f, ensure_ascii=False, indent=2)
          EOF
          python3 scripts/joint_judgment.py

      - name: 📺 판결 결과 즉시 공표
        run: cat GITHUB_SUMMARY.md >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------
      # 3. 릴리즈 및 글로벌 패키지 배포 (권한 문제 해결)
      # ----------------------------------------------------------------
      - name: 📦 글로벌 패키지 및 릴리즈 출시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Supreme-AI-Judge"
          git config --global user.email "court@ai.judge"
          
          echo "### 📂 판결 아카이브 [$(date)]" >> HISTORY.md
          cat GITHUB_SUMMARY.md >> HISTORY.md
          
          git add HISTORY.md data/ dist/
          git commit -m "⚖️ [Verdict] Maximum Sentence Applied - v13.1" || echo "No changes"
          
          TAG_NAME="v13.1-$(date +'%Y%m%d-%H%M')"
          git tag $TAG_NAME
          git push origin $TAG_NAME
          
          # gh CLI를 이용한 릴리즈 생성 (contents: write 권한 사용)
          gh release create $TAG_NAME dist/verdict_api.json --title "판결 속보: $TAG_NAME" --notes "AI 재판부 초중형 선고 패키지"
