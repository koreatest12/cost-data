name: 🚀 AI Judge 18.0 - Integrated Wiki & Global Press

on:
  schedule:
    - cron: '*/5 * * * *' # 5분마다 대량 위키 생성 및 배포
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  integrated-system:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: 📥 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: 📂 시스템 디렉토리 강제 생성
        run: |
          # 위키 에러 방지를 위해 내부 폴더 구조로 변경
          mkdir -p scripts data/evidence public/wiki public/api public/press
          touch public/.nojekyll

      # ----------------------------------------------------------------
      # 1. 통합 사법 엔진 (증거 + 판결 + 보도자료 + 위키 문서 대량 생성)
      # ----------------------------------------------------------------
      - name: 🔨 초중형 판결 및 대량 위키 엔진 가동
        run: |
          cat << 'EOF' > scripts/supreme_engine.py
          import json, datetime, random, os

          # [1] 데이터 및 타겟 정의
          TARGETS = {
              "김건희": ["주가조작", "명품백 뇌물", "양평 특혜", "공천 개입"],
              "윤석열": ["수사 외압", "여론조사 조작", "직권 남용", "헌법 위반"]
          }
          
          all_verdicts = []
          wiki_index = "# 🏛️ AI 재판부 판결 백과사전 (Wiki)\n\n"
          wiki_index += "## 📂 최신 판결 기록 내역\n\n"

          # [2] 대량 데이터 생성 (판결 + 위키 문서)
          for name, crimes in TARGETS.items():
              for crime in crimes:
                  case_id = f"LAW-{datetime.datetime.now().strftime('%Y%m%d')}-{random.randint(1000,9999)}"
                  dice = random.randint(1, 10)
                  verdict = "사형 (Death Penalty)" if dice > 7 else "무기징역 (Life Imprisonment)"
                  fine = random.randint(5000, 9999)
                  
                  data = {
                      "case_id": case_id, "target": name, "crime": crime,
                      "verdict": verdict, "fine": f"{fine}억",
                      "date": datetime.datetime.now().strftime("%Y-%m-%d %H:%M")
                  }
                  all_verdicts.append(data)

                  # 개별 위키 페이지 생성 (public/wiki/사건번호.md)
                  wiki_md = f"# ⚖️ 사건보고서: {case_id}\n\n"
                  wiki_md += f"### 👤 대상자: {name}\n"
                  wiki_md += f"### 📜 확정 혐의: {crime}\n"
                  wiki_md += f"### 🔨 판결: **{verdict}** (벌금 {fine}억)\n\n"
                  wiki_md += "---\n### 📖 법적 근거 및 세부 내역\n"
                  wiki_md += "본 판결은 AI 재판부의 증거 분석 엔진에 의해 확정되었으며, 가석방 없는 엄벌을 원칙으로 함.\n"
                  
                  with open(f"public/wiki/{case_id}.md", "w", encoding="utf-8") as f:
                      f.write(wiki_md)
                  
                  wiki_index += f"- [{case_id} - {name} ({crime})](./wiki/{case_id}.md)\n"

          # [3] 인덱스 및 API 저장
          with open("public/wiki/Home.md", "w", encoding="utf-8") as f:
              f.write(wiki_index)
          with open("public/api/verdict.json", "w", encoding="utf-8") as f:
              json.dump(all_verdicts, f, ensure_ascii=False, indent=2)
          
          # [4] 언론 보도자료 통합본 생성
          with open("public/press/latest.md", "w", encoding="utf-8") as f:
              f.write("# 📢 AI 재판부 공식 보도자료\n\n")
              for v in all_verdicts:
                  f.write(f"### [속보] {v['target']} {v['crime']} 혐의로 {v['verdict']} 선고\n\n")
          EOF
          python3 scripts/supreme_engine.py

      # ----------------------------------------------------------------
      # 2. GitHub Pages 배포 및 데이터 강제 저장
      # ----------------------------------------------------------------
      - name: 🚀 시스템 업데이트 및 대외 공표
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Supreme-AI-Judge"
          git config --global user.email "judge@ai-court.gov"
          
          # 메인 화면 업데이트
          echo "## ⚖️ AI 재판부 실시간 판결 현황" > README.md
          echo "| 사건번호 | 대상 | 혐의 | 결과 |" >> README.md
          echo "|---|---|---|---|" >> README.md
          cat public/api/verdict.json | jq -r '.[] | "| \(.case_id) | \(.target) | \(.crime) | **\(.verdict)** |"' >> README.md
          
          # 에러 해결: 위키 리포지토리가 아닌 메인 리포지토리의 public 폴더에 모두 저장
          git add -f public/ README.md
          git commit -m "⚖️ [System Update] v18.0 Bulk Wiki & Press Data Deployed" || echo "No changes"
          
          # 릴리즈 생성
          TAG="RELEASE-v18.0-$(date +'%Y%m%d%H%M')"
          git tag $TAG
          git push origin $TAG
          
          gh release create $TAG public/api/verdict.json --title "📢 판결 및 위키 패키지: $TAG" --notes "AI 재판부 내장형 위키 및 언론 보도 데이터 배포"

      - name: 📤 GitHub Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: integrated-system
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
