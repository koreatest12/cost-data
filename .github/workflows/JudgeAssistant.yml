name: ⚖️ AI Judge 15.0 - Global Press & External API Release

on:
  schedule:
    - cron: '*/5 * * * *' # 5분마다 전 세계 언론에 판결 공표
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  press-release-judgment:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: 📥 시스템 소스 체크아웃
        uses: actions/checkout@v4

      - name: 📂 대외 공표 인프라 구축
        run: |
          mkdir -p scripts data dist public/press-release
          echo "AI-JUDGE-PRESS-CENTER-v15" > public/index.txt

      # ----------------------------------------------------------------
      # 1. 언론 보도용 데이터 엔진 (기사 양식 자동 생성)
      # ----------------------------------------------------------------
      - name: 🔨 초중형 판결 및 언론 보도 자료 생성
        run: |
          cat << 'EOF' > scripts/joint_judgment.py
          import json, datetime, random, os
          
          with open("data/evidence/latest.json", "r", encoding="utf-8") as f:
              cases = json.load(f)
          
          # 1. GitHub Summary (내부 확인용)
          summary = "## ⚖️ [속보] AI 재판부, 반헌법적 행위에 대한 초엄벌 선고\n\n"
          summary += "| 🚨 피고인 | 📜 주요 혐의 | 🔨 최종 판결 | 📢 언론 보도 요지 |\n"
          summary += "|:---:|---|:---:|---|\n"
          
          press_releases = []
          api_data = []
          
          for case in cases:
              # 형량 강화: 무기징역 및 사형 위주
              dice = random.randint(1, 10)
              if dice > 5:
                  verdict = "사형 (Death Penalty)"
                  title = "법정 최고형 '사형' 선고"
              else:
                  verdict = "무기징역 (Life Imprisonment)"
                  title = "사회 격리 '무기징역' 선고"
              
              fine = random.randint(5000, 9999)
              
              # 보도 자료(Press Release) 양식 생성
              press_text = f"### [보도] {case['target']}, {case['crime']} 혐의로 {verdict}\n"
              press_text += f"**일시:** {datetime.datetime.now().strftime('%Y-%m-%d %H:%M')}\n"
              press_text += f"**판결 요지:** AI 재판부는 {case['target']}의 {case['crime']} 행위를 국가 근간을 흔드는 중죄로 판단, "
              press_text += f"가석방 없는 {verdict}과 벌금 {fine}억 원을 명령했다.\n\n"
              
              summary += f"| {case['target']} | {case['crime']} | **{verdict}** | {title} |\n"
              press_releases.append(press_text)
              api_data.append(case | {"verdict": verdict, "fine": f"{fine}억", "press_title": title})

          # 파일 저장
          with open("GITHUB_SUMMARY.md", "w", encoding="utf-8") as f:
              f.write(summary)
          
          # 언론사 배포용 통합 보도자료 (Press Room)
          with open("public/press-release/latest.md", "w", encoding="utf-8") as f:
              f.write("# 🏛️ AI 재판부 공식 프레스센터 (Latest Verdicts)\n\n")
              f.write("\n".join(press_releases))
          
          # 외부 API 노출 (언론사 연동용)
          with open("public/api_verdict.json", "w", encoding="utf-8") as f:
              json.dump(api_data, f, ensure_ascii=False, indent=2)
          EOF
          # 증거 수집 로직은 이전 버전 유지 (scripts/evidence_hunter.py가 존재한다고 가정)
          python3 scripts/joint_judgment.py

      - name: 📺 실시간 판결 속보 송출
        run: cat GITHUB_SUMMARY.md >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------
      # 2. 글로벌 배포 및 외부 노출 (Git Force Push & Release)
      # ----------------------------------------------------------------
      - name: 🚀 전 세계 언론 및 시스템 배포
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "AI-Press-Secretary"
          git config --global user.email "press@ai-court.gov"
          
          # 모든 판결 아카이브 누적
          echo -e "\n---\n## 📰 [$(date)] 언론 공표 기록\n" >> PRESS_HISTORY.md
          cat public/press-release/latest.md >> PRESS_HISTORY.md
          
          # 외부 공개용 파일 강제 추가
          git add -f public/api_verdict.json public/press-release/latest.md PRESS_HISTORY.md
          git commit -m "📢 [Press Release] Global Announcement of Heavy Verdicts" || echo "No changes"
          
          # 글로벌 릴리즈 태깅
          TAG="PRESS-v15.0-$(date +'%y%m%d%H%M')"
          git tag $TAG
          git push origin $TAG
          
          # 언론사 다운로드용 패키지 생성 (JSON 포함)
          gh release create $TAG public/api_verdict.json --title "📢 전 세계 언론 배포: $TAG" --notes "AI 재판부의 최신 판결 보도자료 및 데이터 API가 공개되었습니다."
