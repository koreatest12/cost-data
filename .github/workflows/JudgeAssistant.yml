name: ⚖️ AI Judge 11.0 - Visual Summary Dashboard

on:
  schedule:
    - cron: '*/5 * * * *' # 5분마다 자동 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-judge-visualize:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Setup Environment
        run: |
          mkdir -p scripts data/evidence reports
          pip install faker pandas

      # ----------------------------------------------------------------
      # 1. [Script] 공범 추적 및 뉴스 증거 수집 (v10.0 로직 유지)
      # ----------------------------------------------------------------
      - name: 📝 Restore scripts/evidence_hunter.py
        run: |
          cat << 'EOF' > scripts/evidence_hunter.py
          import json, random, datetime
          
          # [범죄 네트워크 데이터]
          CRIME_NETWORK = {
              "김건희": {
                  "도이치모터스 주가조작": ["권오수", "이종호", "민모 씨"],
                  "명품백 수수/청탁금지법": ["최재영 목사", "유철환", "대통령실 행정관"],
                  "양평 고속도로 특혜": ["원희룡", "최은순"]
              },
              "윤석열": {
                  "채상병 수사 외압": ["이종섭", "임성근", "박진희"],
                  "공천 개입/여론조사 조작": ["명태균", "김영선", "이준석"]
              }
          }

          def hunt_targets():
              evidence_list = []
              for target, crimes in CRIME_NETWORK.items():
                  for crime_name, accomplices in crimes.items():
                      # 공범 및 뉴스 시뮬레이션
                      caught = random.sample(accomplices, k=random.randint(1, len(accomplices)))
                      
                      evidence_data = {
                          "case_id": f"C-{datetime.datetime.now().strftime('%H%M%S')}-{random.randint(10,99)}",
                          "timestamp": datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                          "main": target,
                          "crime": crime_name,
                          "accomplices": caught,
                          "evidence": "스모킹건(녹취록/통화내역) 확보됨"
                      }
                      evidence_list.append(evidence_data)
              return evidence_list

          if __name__ == "__main__":
              data = hunt_targets()
              with open("data/evidence/latest.json", "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
          EOF

      # ----------------------------------------------------------------
      # 2. [Script] 판결 및 '요약 화면용' 리포트 생성 (핵심 기능)
      # ----------------------------------------------------------------
      - name: 📝 Restore scripts/joint_judgment.py
        run: |
          cat << 'EOF' > scripts/joint_judgment.py
          import json, random, os
          
          with open("data/evidence/latest.json", "r", encoding="utf-8") as f:
              cases = json.load(f)

          # GitHub Summary에 출력할 마크다운 테이블 생성
          summary_md = "## ⚖️ AI 재판부 실시간 판결 속보\n\n"
          summary_md += "| 🚨 피고인 | 👥 공범(공동정범) | 📜 혐의 내용 | 🔨 최종 선고 |\n"
          summary_md += "|:---:|:---:|---|:---:|\n"
          
          history_logs = []

          for case in cases:
              main = case['main']
              acc_list = ", ".join(case['accomplices'])
              crime = case['crime']
              
              # 가중 처벌 로직 (10년 이상 무조건 유도)
              base = 12
              add = len(case['accomplices']) * 3
              years = base + add + random.randint(0, 5)
              fine = random.randint(50, 200)
              
              verdict = f"징역 {years}년"
              
              # 요약 화면용 행 추가
              summary_md += f"| **{main}** | {acc_list} | {crime} | **{verdict}**<br>(벌금 {fine}억) |\n"
              
              # 히스토리 로그용
              history_logs.append(f"| {case['timestamp']} | {main} | {crime} | {verdict} |")

          # 1. GitHub Summary 파일 생성
          with open("GITHUB_SUMMARY.md", "w", encoding="utf-8") as f:
              f.write(summary_md)
              f.write("\n> ※ 위 결과는 증거 기반 AI 자동 판결 시스템에 의해 생성되었습니다.")

          # 2. 영구 보존용 로그 업데이트
          with open("HISTORY_LOG.md", "a", encoding="utf-8") as f:
              for log in history_logs:
                  f.write(log + "\n")
          EOF

      # ----------------------------------------------------------------
      # 3. 실행 및 화면 출력 (Step Summary)
      # ----------------------------------------------------------------
      - name: 🕵️ Track & Judge
        run: |
          python scripts/evidence_hunter.py
          python scripts/joint_judgment.py

      - name: 📺 Display on Summary Screen
        run: |
          # 생성된 마크다운 파일을 GitHub 환경변수에 주입하여 화면에 표시
          cat GITHUB_SUMMARY.md >> $GITHUB_STEP_SUMMARY

      # ----------------------------------------------------------------
      # 4. 데이터 저장 (대시보드 반영)
      # ----------------------------------------------------------------
      - name: 💾 Archive Results
        run: |
          git config --global user.name "AI-Judge"
          git config --global user.email "ai@court.com"
          
          # 로그 파일 헤더 체크
          if [ ! -f HISTORY_LOG.md ]; then
            echo "| 시간 | 피고인 | 혐의 | 결과 |" > HISTORY_LOG.md
            echo "|---|---|---|---|" >> HISTORY_LOG.md
          fi

          # 메인 대시보드도 최신화
          cat GITHUB_SUMMARY.md > DASHBOARD.md
          echo -e "\n---\n### 📂 전체 누적 기록" >> DASHBOARD.md
          tail -n 10 HISTORY_LOG.md >> DASHBOARD.md
          
          git add DASHBOARD.md HISTORY_LOG.md
          git commit -m "📺 Visual Update: Posted to Job Summary"
          git push
