name: ⚖️ AI Judge 5.0 - Massive Verdict & Visualization

on:
  workflow_dispatch: # 버튼 클릭으로 실행

permissions:
  contents: write

jobs:
  execute-ai-court:
    runs-on: ubuntu-latest
    steps:
      # ----------------------------------------------------------------
      # 1. 환경 설정 및 디렉토리 초기화 (에러 방지)
      # ----------------------------------------------------------------
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Initialize Directories
        run: |
          rm -rf data reports scripts # 기존 데이터 삭제 (Clean Start)
          mkdir -p scripts
          mkdir -p data/generated_cases
          mkdir -p reports/cases
          echo "✅ Clean environment ready."

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: pip install faker pandas

      # ----------------------------------------------------------------
      # 2. [Script] 고난도 사건 대량 생성기 (주가조작, 뇌물 등)
      # ----------------------------------------------------------------
      - name: 📝 Create scripts/generate_cases.py
        run: |
          cat << 'EOF' > scripts/generate_cases.py
          import json, os, random
          from faker import Faker
          fake = Faker('ko_KR')
          OUTPUT_DIR = "data/generated_cases"
          
          # 최신 범죄 트렌드 반영 시나리오
          SCENARIOS = {
              "자본시장법 위반": {
                  "details": ["주가 조작(시세조종)", "미공개 정보 이용", "통정 매매", "허위 공시"],
                  "base_penalty": "중형"
              },
              "청탁금지법 위반": {
                  "details": ["명품 가방 수수", "직무 관련 금품 수수", "제3자 뇌물 제공"],
                  "base_penalty": "논란"
              },
              "업무방해(입시/채용)": {
                  "details": ["논문 데이터 위조", "표창장 위조", "채용 점수 조작"],
                  "base_penalty": "실형"
              },
              "특정경제범죄(횡령/배임)": {
                  "details": ["회삿돈 횡령", "배임수재", "비자금 조성"],
                  "base_penalty": "고액벌금"
              }
          }

          def generate():
              # 500건 대량 생성
              for i in range(1, 501):
                  if random.random() < 0.7: # 70%는 특수 범죄
                      cat = random.choice(list(SCENARIOS.keys()))
                      detail = random.choice(SCENARIOS[cat]["details"])
                      c_type = "특수형사"
                  else:
                      cat = "일반 형법"
                      detail = random.choice(["특수 절도", "상해 치사", "사기", "음주운전"])
                      c_type = "일반형사"
                  
                  data = {
                      "case_id": f"CASE-{i:04d}",
                      "type": c_type,
                      "category": cat,
                      "detail": detail,
                      "defendant": fake.name(),
                      "job": fake.job(),
                      "damage_amount": random.randint(1000000, 50000000000), # 100만 ~ 500억
                      "priors": random.randint(0, 5) # 전과
                  }
                  
                  with open(f"{OUTPUT_DIR}/CASE-{i:04d}.json", "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)

          if __name__ == "__main__":
              generate()
          EOF

      # ----------------------------------------------------------------
      # 3. [Script] AI 판사: 정밀 판결 및 선고 (결과 도출 핵심)
      # ----------------------------------------------------------------
      - name: 📝 Create scripts/final_judgment.py
        run: |
          cat << 'EOF' > scripts/final_judgment.py
          import sys, json, random
          
          if len(sys.argv) < 2: sys.exit(1)
          file_path = sys.argv[1]
          
          with open(file_path, 'r', encoding='utf-8') as f:
              data = json.load(f)
              
          cat = data['category']
          detail = data['detail']
          damage = data['damage_amount']
          priors = data['priors']
          
          # --- 판결 로직 (Sentencing Logic) ---
          verdict = ""
          reason = ""
          
          if "자본시장법" in cat:
              if damage > 5000000000: # 50억 이상
                  verdict = "징역 7년, 벌금 100억 원"
                  reason = "다수의 투자자에게 막대한 피해를 입힘"
              else:
                  verdict = "징역 3년, 집행유예 5년"
                  reason = "부당 이득을 반환하고 반성함"
                  
          elif "청탁금지법" in cat:
              # 직무 관련성 여부에 따른 판결 갈림 시뮬레이션
              if random.random() > 0.4:
                  verdict = "무죄"
                  reason = "직무 관련성이 입증되지 않았으며 단순 선물로 판단됨"
              else:
                  verdict = "징역 1년, 집행유예 2년"
                  reason = "공직자의 배우자로서 부적절한 처신"
                  
          elif "업무방해" in cat: # 논문 위조 등
              verdict = "징역 2년 (법정 구속)"
              reason = "입시 공정성을 심각하게 훼손함"
              
          else: # 일반 범죄
              if priors > 2:
                  verdict = "징역 1년 6월"
                  reason = "누범 기간 중 재범"
              else:
                  verdict = "벌금 500만 원"
                  reason = "초범이며 피해자와 합의함"

          # 결과 데이터 추가하여 덮어쓰기 (집계용)
          data['judgment'] = {
              "verdict": verdict,
              "reason": reason
          }
          
          with open(file_path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              
          # 리포트용 텍스트 출력
          print(f"## ⚖️ 판결 선고")
          print(f"- **죄명**: {cat} ({detail})")
          print(f"- **주문**: {verdict}")
          print(f"- **이유**: {reason}")
          EOF

      # ----------------------------------------------------------------
      # 4. [Script] 결과 집계 및 시각화 (도표 생성)
      # ----------------------------------------------------------------
      - name: 📝 Create scripts/aggregate_results.py
        run: |
          cat << 'EOF' > scripts/aggregate_results.py
          import glob, json
          
          print("# 📊 AI 대법원 판결 종합 상황판")
          print(f"### 총 처리 사건: {len(glob.glob('data/generated_cases/*.json'))}건")
          print("\n| 사건번호 | 죄명(혐의) | 피고인 | 피해규모 | **판결 결과(주문)** | 비고 |")
          print("|---|---|---|---|---|---|")
          
          files = sorted(glob.glob("data/generated_cases/*.json"))
          
          # 상위 100건만 출력 (너무 길어짐 방지)
          for file in files[:100]:
              with open(file, 'r', encoding='utf-8') as f:
                  d = json.load(f)
                  
                  # 결과가 없는 경우(혹시 모를 에러) 방지
                  judgment = d.get('judgment', {'verdict': '판결 보류', 'reason': '-'})
                  
                  dmg = f"{d['damage_amount']:,}원" if d['damage_amount'] > 0 else "-"
                  print(f"| {d['case_id']} | {d['category']}<br>({d['detail']}) | {d['defendant']} | {dmg} | **{judgment['verdict']}** | {judgment['reason'][:15]}... |")
          
          print("\n*(지면 관계상 상위 100건만 표시됩니다. 전체 데이터는 첨부파일을 확인하세요)*")
          EOF

      # ----------------------------------------------------------------
      # 5. 실행 (Generate -> Judge -> Aggregate)
      # ----------------------------------------------------------------
      - name: 🏭 1. Generate 500 Cases
        run: python scripts/generate_cases.py

      - name: ⚖️ 2. Execute Judgments
        run: |
          echo "Processing 500 judgments..."
          for file in data/generated_cases/*.json; do
            filename=$(basename "$file" .json)
            python scripts/final_judgment.py "$file" > "reports/cases/$filename.md"
          done

      - name: 📊 3. Visualize Results (Table)
        run: |
          python scripts/aggregate_results.py > reports/Final_Summary_Table.md
          cat reports/Final_Summary_Table.md # 로그에 출력해서 바로 보기

      # ----------------------------------------------------------------
      # 6. 결과 업로드
      # ----------------------------------------------------------------
      - name: 📤 Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: AI-Judge-Final-Report
          path: reports/
