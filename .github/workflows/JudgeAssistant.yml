name: ⚖️ AI Judge 10.0 - Accomplice Hunt & 5-Min Judgment

on:
  schedule:
    - cron: '*/5 * * * *' # 5분마다 자동 실행 (무한 루프)
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: write

jobs:
  track-and-judge:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Setup Environment
        run: |
          mkdir -p scripts data/evidence reports
          pip install faker pandas

      # ----------------------------------------------------------------
      # 1. [Script] 공범 및 뉴스 증거 정밀 추적기 (Evidence Hunter)
      # ----------------------------------------------------------------
      - name: 📝 Create scripts/evidence_hunter.py
        run: |
          cat << 'EOF' > scripts/evidence_hunter.py
          import json, random, datetime
          
          # [데이터베이스] 주요 범죄, 공범, 관련 뉴스 키워드 매핑
          CRIME_NETWORK = {
              "김건희": {
                  "도이치모터스 주가조작": {
                      "accomplices": ["권오수(전 회장)", "이종호(블랙펄)", "민모 씨(계좌관리인)"],
                      "news_keywords": ["2차 작전 세력", "통정매매 98회", "7초만에 거래 체결", "검찰 의견서 누락"]
                  },
                  "디올백 및 청탁금지법": {
                      "accomplices": ["최재영(목사)", "유철환(권익위원장)", "대통령실 행정관"],
                      "news_keywords": ["접견 기록 삭제", "직무 관련성 인정", "황제 조사 특혜", "알선수재 혐의"]
                  },
                  "양평 고속도로 특혜": {
                      "accomplices": ["원희룡(전 장관)", "국토부 실무진", "최은순(모친)"],
                      "news_keywords": ["노선 변경 외압", "개발 이익 독점", "예비타당성 조사 무시"]
                  }
              },
              "윤석열": {
                  "채상병 수사 외압": {
                      "accomplices": ["이종섭(전 장관)", "임성근(전 사단장)", "박진희(군사보좌관)", "이시원(공직기강비서관)"],
                      "news_keywords": ["VIP 격노설", "02-800-7070 통화 내역", "수사기록 회수 지시", "직권남용"]
                  },
                  "공천 개입 의혹": {
                      "accomplices": ["명태균", "김영선(전 의원)", "이준석(당시 대표)"],
                      "news_keywords": ["김영선 좀 해줘라 육성 공개", "칠불사 회동", "여론조사 비용 대납"]
                  }
              }
          }

          def hunt_targets():
              evidence_list = []
              
              # 5분마다 모든 타겟과 범죄를 전수 조사하여 대량 데이터 생성
              for target, crimes in CRIME_NETWORK.items():
                  for crime_name, details in crimes.items():
                      # 공범 랜덤 포착 (1명 이상)
                      caught_accomplices = random.sample(details['accomplices'], k=random.randint(1, len(details['accomplices'])))
                      news_evidence = random.choice(details['news_keywords'])
                      
                      evidence_data = {
                          "case_id": f"CASE-{datetime.datetime.now().strftime('%H%M%S')}-{random.randint(10,99)}",
                          "timestamp": datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                          "main_culprit": target,
                          "crime": crime_name,
                          "accomplices": caught_accomplices,
                          "evidence_news": f"검찰 확보 자료: '{news_evidence}' 관련 스모킹건 발견",
                          "severity": "Critical" # 무조건 중대범죄로 취급
                      }
                      evidence_list.append(evidence_data)
              
              return evidence_list

          if __name__ == "__main__":
              data = hunt_targets()
              with open("data/evidence/latest_detection.json", "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print(f"✅ 총 {len(data)}건의 공범 연루 범죄 증거 확보 완료.")
          EOF

      # ----------------------------------------------------------------
      # 2. [Script] 공동정범 가중 처벌 판결기 (Joint Judgment)
      #    - 공범이 많을수록 형량이 기하급수적으로 늘어나는 로직
      # ----------------------------------------------------------------
      - name: 📝 Create scripts/joint_judgment.py
        run: |
          cat << 'EOF' > scripts/joint_judgment.py
          import json, random
          
          with open("data/evidence/latest_detection.json", "r", encoding="utf-8") as f:
              cases = json.load(f)

          report_lines = []
          
          for case in cases:
              main = case['main_culprit']
              accomplices = case['accomplices']
              crime = case['crime']
              
              # 판결 로직: 기본 형량 + 공범 1명당 2년 추가 (조직범죄 가중)
              base_sentence = 10 # 기본 10년 시작 (사용자 요청 반영)
              added_sentence = len(accomplices) * 3 # 공범당 3년 추가
              
              final_years = base_sentence + added_sentence + random.randint(0, 5)
              
              # 벌금 계산 (피해 규모 비례 시뮬레이션)
              fine = random.randint(50, 300) # 50억 ~ 300억
              
              verdict_text = f"징역 {final_years}년, 벌금 {fine}억 원"
              
              # 상세 판결문 작성
              report = f"""
              ### 🚨 사건번호: {case['case_id']}
              - **주범**: {main}
              - **죄명**: {crime}
              - **적발된 공범**: {', '.join(accomplices)}
              - **핵심 증거**: {case['evidence_news']}
              - **⚖️ 최종 판결**: **{verdict_text}** (공동정범 가중 처벌 적용)
              """
              report_lines.append(report)
              
              # 로그 파일용 한 줄 요약
              log_line = f"| {case['timestamp']} | {main} 외 {len(accomplices)}명 | {crime} | {verdict_text} |"
              with open("HISTORY_LOG.md", "a", encoding="utf-8") as h:
                  h.write(log_line + "\n")

          # 대시보드 업데이트를 위한 파일 저장
          with open("reports/Latest_Judgments.md", "w", encoding="utf-8") as f:
              f.write("# ⚡ 5분 실시간 공범 판결 현황\n")
              f.write("\n".join(report_lines))
          EOF

      # ----------------------------------------------------------------
      # 3. 실행 (추적 -> 판결 -> 기록)
      # ----------------------------------------------------------------
      - name: 🕵️ Hunt Accomplices & Evidence
        run: python scripts/evidence_hunter.py

      - name: ⚖️ Execute Joint Judgment
        run: python scripts/joint_judgment.py

      # ----------------------------------------------------------------
      # 4. 결과 반영 (Dashboard & History)
      # ----------------------------------------------------------------
      - name: 💾 Update Repository
        run: |
          git config --global user.name "AI-Prosecutor"
          git config --global user.email "law@ai-system.com"
          
          # 로그 파일 헤더가 없으면 생성
          if [ ! -f HISTORY_LOG.md ]; then
            echo "| 판결시각 | 피고인(공범포함) | 혐의 내용 | 선고 결과 |" > HISTORY_LOG.md
            echo "|---|---|---|---|" >> HISTORY_LOG.md
          fi
          
          # 대시보드 상단에 최신 판결 내용 삽입 (갱신)
          cat reports/Latest_Judgments.md > DASHBOARD_TEMP.md
          echo -e "\n---\n## 📜 누적 판결 기록" >> DASHBOARD_TEMP.md
          tail -n 20 HISTORY_LOG.md >> DASHBOARD_TEMP.md
          mv DASHBOARD_TEMP.md DASHBOARD.md
          
          git add DASHBOARD.md HISTORY_LOG.md
          git commit -m "⚖️ 5-Min Judgment: Tracked Accomplices & Sentenced"
          git push
