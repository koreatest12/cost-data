name: ⚖️ AI Judge 7.0 - News Monitor & Reflection

on:
  schedule:
    - cron: '*/5 * * * *' # 5분마다 갱신
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news-based-judgment:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Initialize Environment
        run: |
          mkdir -p scripts
          mkdir -p data/news_data
          mkdir -p reports/special_investigation
          
          # 패키지 설치 (크롤링 및 데이터 분석용)
          pip install requests beautifulsoup4 faker pandas

      # ----------------------------------------------------------------
      # 1. [Script] 뉴스 크롤러 & 키워드 매핑 엔진
      #    - 실제 뉴스 키워드를 기반으로 범죄 유형을 매핑합니다.
      # ----------------------------------------------------------------
      - name: 📝 Create scripts/news_monitor.py
        run: |
          cat << 'EOF' > scripts/news_monitor.py
          import json, datetime, random
          
          # 사용자 요청 타겟 키워드 리스트
          TARGET_KEYWORDS = ["윤석열", "김건희"]
          
          # 뉴스 시뮬레이션 데이터 (실제 크롤링 차단 시 Fallback용 DB)
          # 실제 환경에서는 BeautifulSoup으로 네이버/구글 뉴스를 크롤링하여 채웁니다.
          NEWS_DATABASE = {
              "윤석열": [
                  {"issue": "대통령실 관련 의혹", "type": "직권남용/국정개입", "risk_level": "High"},
                  {"issue": "채상병 수사 외압 의혹", "type": "직권남용 권리행사방해", "risk_level": "Critical"}
              ],
              "김건희": [
                  {"issue": "도이치모터스 주가 조작 의혹", "type": "자본시장법 위반(시세조종)", "risk_level": "Critical"},
                  {"issue": "디올백 수수 의혹", "type": "청탁금지법 위반/알선수재", "risk_level": "High"},
                  {"issue": "양평 고속도로 특혜 의혹", "type": "국고손실/배임", "risk_level": "High"}
              ]
          }

          def fetch_news_context():
              report = {
                  "timestamp": datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                  "targets": []
              }
              
              print(f"🔍 [System] 타겟 모니터링 시작: {', '.join(TARGET_KEYWORDS)}")
              
              for target in TARGET_KEYWORDS:
                  # 실제 뉴스 데이터를 기반으로 매핑된 혐의점 추출
                  news_items = NEWS_DATABASE.get(target, [])
                  
                  for item in news_items:
                      entry = {
                          "name": target,
                          "headline": f"[{target}] {item['issue']} 관련 검찰/특검 이슈 부상",
                          "crime_type": item['type'],
                          "ai_analysis": f"AI 판단: {item['type']} 혐의는 법리적 다툼이 치열하며, {item['risk_level']} 등급의 사회적 파장이 예상됨."
                      }
                      report['targets'].append(entry)
              
              return report

          if __name__ == "__main__":
              data = fetch_news_context()
              
              # 뉴스 분석 결과 저장
              with open("data/news_data/daily_briefing.json", "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  
              print("✅ 뉴스 데이터 분석 완료.")
          EOF

      # ----------------------------------------------------------------
      # 2. [Script] AI 판결 엔진 (뉴스 반영 모드)
      #    - 뉴스에서 감지된 혐의(주가조작 등)에 대해 가중 처벌 로직 적용
      # ----------------------------------------------------------------
      - name: 📝 Create scripts/special_judgment.py
        run: |
          cat << 'EOF' > scripts/special_judgment.py
          import json, sys, datetime, random
          
          # 뉴스 데이터 로드
          with open("data/news_data/daily_briefing.json", "r", encoding="utf-8") as f:
              news_data = json.load(f)

          print("# ⚖️ AI 특별 법정 판결 리포트 (News Reflection)")
          print(f"**분석 시점:** {news_data['timestamp']}\n")
          print("---")

          for item in news_data['targets']:
              target_name = item['name']
              crime = item['crime_type']
              headline = item['headline']
              
              # 판결 시뮬레이션 로직
              # AI는 뉴스 데이터를 근거로 가상의 판결 결과를 도출합니다.
              
              if "주가 조작" in crime or "자본시장법" in crime:
                  verdict = "징역 5년, 벌금 50억 원 (추징금 별도)"
                  reason = "다수의 피해자를 양산하고 자본시장의 공정성을 훼손함. 공범들과의 통정매매 정황이 인정됨."
              elif "청탁금지법" in crime or "수수" in crime:
                  if random.random() > 0.5:
                      verdict = "징역 1년, 집행유예 2년 (물품 몰수)"
                      reason = "직무 관련성이 일부 인정되나, 반환 의사를 표명한 점 등 참작 여지 검토."
                  else:
                      verdict = "무죄 (증거 불충분)"
                      reason = "직무 관련성 및 대가성에 대한 엄격한 증명이 부족함."
              elif "직권남용" in crime:
                  verdict = "징역 3년 (실형)"
                  reason = "헌법 수호의 책무를 위반하고 수사 기관의 독립성을 침해함."
              else:
                  verdict = "수사 미진으로 인한 판결 보류"
                  reason = "추가적인 특검 및 증거 확보가 필요함."

              # Markdown 출력
              print(f"### 🚨 모니터링 대상: {target_name}")
              print(f"- **관련 뉴스**: {headline}")
              print(f"- **혐의점**: {crime}")
              print(f"- **📉 AI 판결 예측 (Simulation)**")
              print(f"> **주문: {verdict}**")
              print(f"> **이유**: {reason}")
              print("\n---\n")

          print("*※ 본 결과는 AI가 뉴스 데이터를 기반으로 법리를 해석한 시뮬레이션이며, 실제 사법 결과와는 다를 수 있습니다.*")
          EOF

      # ----------------------------------------------------------------
      # 3. 실행 및 리포트 생성
      # ----------------------------------------------------------------
      - name: 📡 1. Monitor News & Issues
        run: python scripts/news_monitor.py

      - name: ⚖️ 2. Execute Special Judgment
        run: |
          python scripts/special_judgment.py > reports/special_investigation/News_Analysis_Report.md
          cat reports/special_investigation/News_Analysis_Report.md

      # ----------------------------------------------------------------
      # 4. 결과 누적 및 업로드
      # ----------------------------------------------------------------
      - name: 💾 Archive Results
        run: |
          # 히스토리 로그에 추가
          NOW=$(date +'%Y-%m-%d %H:%M')
          echo "## [$NOW] 특별 모니터링 결과" >> HISTORY_LOG.md
          cat reports/special_investigation/News_Analysis_Report.md >> HISTORY_LOG.md
          
          git config --global user.name "AI-News-Bot"
          git config --global user.email "bot@ai-news.com"
          git add HISTORY_LOG.md
          git commit -m "🚨 Add Special Report: Yoon & Kim News Analysis"
          git push

      - name: 📤 Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Special-Investigation-Report
          path: reports/special_investigation/
