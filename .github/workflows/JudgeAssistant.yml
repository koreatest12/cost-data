name: 🚀 AI Judge 6.0 - 2026 Auto Release & Accumulate

# [트리거 설정]
# 1. 5분마다 자동 실행 (Cron)
# 2. 버튼 클릭 시 수동 실행
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write  # 리포지토리 커밋 및 릴리즈 생성 권한

jobs:
  run-and-release:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      # ----------------------------------------------------------------
      # 1. 저장소 체크아웃 (이전 데이터 누적을 위해 필수)
      # ----------------------------------------------------------------
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 히스토리 가져오기

      - name: 📂 Setup Environment
        run: |
          mkdir -p scripts
          mkdir -p data/new_cases
          mkdir -p reports
          # 누적 기록 파일이 없으면 헤더 생성
          if [ ! -f "HISTORY_LOG.md" ]; then
            echo "# 📜 AI 판사 2026년 판결 누적 기록부" > HISTORY_LOG.md
            echo "| 실행시간 | 사건ID | 발생일(2026) | 죄명 | 피고인 | 판결 결과 |" >> HISTORY_LOG.md
            echo "|---|---|---|---|---|---| >> HISTORY_LOG.md"
          fi

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install Dependencies
        run: pip install faker pandas

      # ----------------------------------------------------------------
      # 2. [Script] 2026년 미래 데이터 생성기 (매월 데이터 갱신)
      # ----------------------------------------------------------------
      - name: 📝 Restore scripts/generate_cases_2026.py
        run: |
          cat << 'EOF' > scripts/generate_cases_2026.py
          import json, os, random, datetime
          from faker import Faker
          
          fake = Faker('ko_KR')
          OUTPUT_DIR = "data/new_cases"
          
          # 2026년 매월 데이터 시뮬레이션
          def get_random_date_2026():
              start = datetime.date(2026, 1, 1)
              end = datetime.date(2026, 12, 31)
              days = (end - start).days
              return start + datetime.timedelta(days=random.randint(0, days))

          SCENARIOS = {
              "주가조작(자본시장법)": "징역 5년 이상",
              "디올백 수수(청탁금지법)": "징역 1년 또는 무죄",
              "논문위조(업무방해)": "징역 2년",
              "가상화폐 사기": "징역 10년"
          }

          # 실행 시마다 고유한 Batch ID 생성 (중복 방지)
          batch_id = datetime.datetime.now().strftime("%Y%m%d-%H%M%S")

          def generate():
              # 한 번 실행에 50건씩 생성 (5분마다 누적됨)
              for i in range(1, 51):
                  cat = random.choice(list(SCENARIOS.keys()))
                  case_date = get_random_date_2026()
                  
                  data = {
                      "case_id": f"CASE-2026-{batch_id}-{i:03d}",
                      "date": str(case_date),
                      "category": cat,
                      "defendant": fake.name(),
                      "detail": f"2026년 {case_date.month}월 발생한 {cat} 사건",
                      "verdict_guideline": SCENARIOS[cat]
                  }
                  
                  # 판결 로직 즉시 적용
                  data['judgment'] = {
                      "result": f"{SCENARIOS[cat]} (확정)",
                      "judge_date": str(case_date + datetime.timedelta(days=random.randint(30, 180)))
                  }
                  
                  filename = f"{OUTPUT_DIR}/{data['case_id']}.json"
                  with open(filename, "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)

          if __name__ == "__main__":
              generate()
          EOF

      # ----------------------------------------------------------------
      # 3. [Script] 데이터 누적 처리기 (Log Appender)
      # ----------------------------------------------------------------
      - name: 📝 Restore scripts/append_history.py
        run: |
          cat << 'EOF' > scripts/append_history.py
          import glob, json, datetime
          
          files = glob.glob("data/new_cases/*.json")
          now = datetime.datetime.now().strftime("%Y-%m-%d %H:%M")
          
          with open("HISTORY_LOG.md", "a", encoding="utf-8") as f:
              for file in files:
                  with open(file, 'r', encoding='utf-8') as jf:
                      data = json.load(jf)
                      line = f"| {now} | {data['case_id']} | {data['date']} | {data['category']} | {data['defendant']} | **{data['judgment']['result']}** |\n"
                      f.write(line)
          EOF

      # ----------------------------------------------------------------
      # 4. 실행 및 데이터 누적 (Execute & Accumulate)
      # ----------------------------------------------------------------
      - name: 🏭 Generate 2026 Data
        run: python scripts/generate_cases_2026.py

      - name: 📚 Accumulate to History Log
        run: python scripts/append_history.py

      # ----------------------------------------------------------------
      # 5. 변경 사항 커밋 (GitHub Repo에 영구 저장)
      # ----------------------------------------------------------------
      - name: 💾 Commit History Log
        run: |
          git config --global user.name "AI-Judge-Bot"
          git config --global user.email "bot@ai-judge.com"
          
          # 로그 파일만 커밋 (JSON 파일은 Release에 첨부하여 용량 절약)
          git add HISTORY_LOG.md
          git commit -m "📈 Update Judgment History: $(date +'%Y-%m-%d %H:%M')"
          git push

      # ----------------------------------------------------------------
      # 6. 🚀 자동 릴리즈 & 출시 (Release & Publish)
      # ----------------------------------------------------------------
      - name: 📦 Zip Artifacts
        run: zip -r raw_data_$(date +'%Y%m%d_%H%M').zip data/new_cases

      - name: 🚀 Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v2026.$(date +'%m%d.%H%M')"
          RELEASE_TITLE="⚖️ 판결 데이터 업데이트 (2026-$(date +'%m-%d %H:%M'))"
          
          # GitHub CLI를 사용하여 릴리즈 생성 및 파일 업로드
          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "2026년 시뮬레이션 판결 데이터 50건이 추가되었습니다. 상세 내용은 첨부파일 확인." \
            raw_data_*.zip
