name: "📢 Massive Dependency Notification & Auto-Cleanup"

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      # [데이터 분할 감지] 모든 생태계 파일 감지
      - '**/requirements.txt'   # Python
      - '**/pom.xml'             # Java Maven
      - '**/build.gradle'        # Java Gradle
      - '**/Dockerfile'          # Docker
      - '**/package.json'        # Node.js
      - '**/go.mod'              # Go
      - '**/*.tf'                # Terraform
      - '**/Gemfile'             # Ruby
      - '**/composer.json'       # PHP

permissions:
  pull-requests: write
  contents: read
  actions: write # 정리 기능을 위해 권한 추가

jobs:
  # ------------------------------------------------------------------
  # JOB 1: 데이터 분할 분석 및 알림 생성 (Data Split & Notify)
  # ------------------------------------------------------------------
  notify:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 변경된 파일 데이터 추출
        id: changed-files
        run: |
          echo "files=$(git diff --name-only HEAD^..HEAD | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: 🔍 데이터 분할 분석 및 코멘트 생성
        uses: actions/github-script@v7
        with:
          script: |
            const changedFiles = '${{ steps.changed-files.outputs.files }}'.split(' ').filter(f => f.length > 0);
            
            // [데이터 분할 로직] 변경 사항을 카테고리별로 분리
            const categories = {
              'Backend (Java/Python/Go)': [],
              'Frontend (JS/TS)': [],
              'Infrastructure (Docker/Terraform)': [],
              'Others': []
            };

            const labels = new Set(['dependencies']);

            changedFiles.forEach(file => {
              if (file.match(/(pom\.xml|build\.gradle|requirements\.txt|go\.mod)/)) {
                categories['Backend (Java/Python/Go)'].push(file);
                if (file.includes('java')) labels.add('java');
                if (file.includes('py')) labels.add('python');
                if (file.includes('go')) labels.add('go');
              } else if (file.match(/(package\.json|yarn\.lock)/)) {
                categories['Frontend (JS/TS)'].push(file);
                labels.add('javascript');
                labels.add('frontend');
              } else if (file.match(/(Dockerfile|\.tf)/)) {
                categories['Infrastructure (Docker/Terraform)'].push(file);
                labels.add('infrastructure');
                labels.add('cloud');
              } else {
                categories['Others'].push(file);
              }
            });

            // 코멘트 본문 생성 (분할된 데이터 기반)
            let comment = '## 📦 의존성 대량 업데이트 분석\n\n';
            comment += '**Dependabot**이 감지한 변경 사항을 영역별로 분류했습니다:\n\n';

            for (const [category, files] of Object.entries(categories)) {
              if (files.length > 0) {
                comment += `### 📂 ${category}\n`;
                files.forEach(f => comment += `- \`${f}\`\n`);
                comment += '\n';
              }
            }

            comment += '---\n';
            comment += '### ✅ 자동 검토 체크리스트\n';
            comment += '- [ ] 🛡️ 보안 취약점 점검\n';
            comment += '- [ ] 🏗️ 빌드 및 통합 테스트\n';
            comment += '- [ ] 🧹 불필요한 리소스 정리 확인\n\n';
            comment += '*Auto-generated by Massive Ops Bot*';

            // PR에 코멘트 등록
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

            // 라벨 대량 적용
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: Array.from(labels)
              });
            }

  # ------------------------------------------------------------------
  # JOB 2: 워크플로우 및 데이터 즉시 정리 (Cleanup & Purge)
  # ------------------------------------------------------------------
  cleanup-workflow:
    needs: notify
    runs-on: ubuntu-latest
    if: always() # 알림 성공/실패 여부와 관계없이 무조건 실행
    steps:
      - name: 🧹 현재 워크플로우 기록 삭제 (Self-Cleanup)
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0        # 즉시 삭제
          keep_minimum_runs: 0  # 기록을 남기지 않음
          delete_run_by_conclusion_pattern: "success, skipped" # 성공한 기록은 바로 지움 (실패만 남김)
