name: Dependency Update Notifications

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - 'requirements.txt'
      - 'pom.xml'
      - '**/pom.xml'
      - '**/requirements.txt'
      - '**/Dockerfile'

permissions:
  pull-requests: write
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed-files
        run: |
          echo "files=$(git diff --name-only HEAD^..HEAD | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Create detailed comment
        uses: actions/github-script@v7
        with:
          script: |
            const changedFiles = '${{ steps.changed-files.outputs.files }}';

            let comment = '## 📦 의존성 업데이트 알림\n\n';
            comment += '**Dependabot**이 다음 파일들의 의존성을 업데이트했습니다:\n\n';

            const files = changedFiles.split(' ').filter(f => f.length > 0);
            files.forEach(file => {
              comment += `- \`${file}\`\n`;
            });

            comment += '\n### ✅ 자동 검토 체크리스트\n\n';
            comment += '- [ ] 변경 내역 확인\n';
            comment += '- [ ] 테스트 통과 확인\n';
            comment += '- [ ] 빌드 성공 확인\n';
            comment += '- [ ] 호환성 검토\n\n';

            comment += '### 📝 참고사항\n\n';
            comment += '- **패치/마이너 업데이트**: 자동으로 승인 및 병합됩니다.\n';
            comment += '- **메이저 업데이트**: 수동 검토가 필요합니다.\n\n';
            comment += '---\n';
            comment += '*이 알림은 자동으로 생성되었습니다.*';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      - name: Add labels based on ecosystem
        uses: actions/github-script@v7
        with:
          script: |
            const changedFiles = '${{ steps.changed-files.outputs.files }}';
            const labels = new Set(['dependencies']);

            if (changedFiles.includes('requirements.txt')) {
              labels.add('python');
            }
            if (changedFiles.includes('pom.xml')) {
              labels.add('java');
              labels.add('maven');
            }
            if (changedFiles.includes('Dockerfile')) {
              labels.add('docker');
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: Array.from(labels)
            });
