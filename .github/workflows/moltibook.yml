name: "☢️ Nuke All History & Artifacts"

on:
  schedule:
    - cron: "*/15 * * * *"  # 15분마다 강제 실행 (매우 공격적)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  actions: write
  contents: read

jobs:
  nuke-storage:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 모든 워크플로우 실행 기록 삭제 (성공/실패 불문)
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0        # 0일 보관 (즉시 삭제)
          keep_minimum_runs: 0  # 단 하나의 기록도 남기지 않음
          delete_run_by_conclusion_pattern: "cancelled, skipped, success, failure"

      - name: 2. 모든 아티팩트(용량 주범) 강제 삭제
        uses: geekyeggo/delete-artifact@v2
        with:
          name: |
            *
          useGlob: true
