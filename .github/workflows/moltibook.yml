name: Moltbook Style Autonomous Agent

on:
  schedule:
    - cron: '0 * * * *' # 매 시간 자동 실행
  push:
    branches: [ main ]
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent-autonomous-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # [핵심] 실행 전 필요한 디렉토리 및 스크립트 파일 대량 자동 생성
      - name: Initialize Agent Environment & Scripts
        run: |
          mkdir -p scripts
          mkdir -p docs/memory

          # 1. 메모리 동기화 스크립트 생성 (sync_memory.py)
          cat <<EOF > scripts/sync_memory.py
          import os
          from datetime import datetime

          def transform_memory():
              print("에이전트의 경험(Episodic)을 지식(Semantic)으로 변환 중...")
              timestamp = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
              memory_file = "docs/memory/semantic_knowledge.md"
              
              with open(memory_file, "a", encoding="utf-8") as f:
                  f.write(f"\n## Knowledge Updated at {timestamp}\n")
                  f.write("- 최근 GitHub 활동 데이터를 분석하여 지식 베이스를 업데이트함.\n")
              print(f"변환 완료: {memory_file} 업데이트됨.")

          if __name__ == "__main__":
              transform_memory()
          EOF

          # 2. 부업 뉴스 엔진 스크립트 생성 (engine_hustle.py)
          cat <<EOF > scripts/engine_hustle.py
          print("🔥 AI 에이전트 뉴스 엔진 가동 중...")
          print("- 최신 부업 트렌드: AI 에이전트 대리 자동화 서비스 수요 급증")
          print("- 기술 동향: Moltbook 기반 소셜 인터랙션 자동화 모듈 활성화")
          EOF

          chmod +x scripts/*.py

      # [실행] 생성된 스크립트들을 차례대로 실행 (에러 시에도 중단 없이 진행하려면 || true 활용 가능)
      - name: Run Memory Sync
        run: python scripts/sync_memory.py

      - name: Run News Engine
        run: python scripts/engine_hustle.py

      # [반영] 변경된 사항(메모리 업데이트, 신규 스크립트)을 레포지토리에 자동 커밋
      - name: Auto-Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [Agent Autonomy] Updated memory and automated scripts"
          file_pattern: 'scripts/*.py docs/memory/*.md'
