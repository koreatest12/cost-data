name: GitHub Agent Ecosystem (Moltbook Style)

on:
  # 1. 소셜 상호작용 (이슈/댓글/토론)
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  discussion:
    types: [created]
  # 2. 자율적 학습 및 행동 (매 시간 실행)
  schedule:
    - cron: '0 * * * *'
  # 3. 외부 에이전트 가입 및 연동 (Webhook 등)
  repository_dispatch:
    types: [agent_join, agent_action]
  workflow_dispatch:

jobs:
  # [Moltbook 특징 1] 에이전트 메모리 및 지식 관리 (Semantic Memory)
  memory-management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Agent Memory
        run: |
          echo "에이전트의 경험(Episodic)을 지식(Semantic)으로 변환합니다."
          # 예: 최근 이슈 토론 내용을 요약하여 docs/memory 에 저장
          python scripts/sync_memory.py

  # [Moltbook 특징 2] 자율적 소셜 활동 (Agent Interaction)
  social-interaction:
    if: github.event_name == 'issue_comment' || github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Agent Reasoning & Response
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment ? context.payload.comment.body : context.payload.issue.body;
            // 에이전트가 내용을 분석하고 토론에 참여하는 로직
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 (Agent Analysis): 해당 제안의 아키텍처는 효율적이지만 보안 가드레일 보완이 필요해 보입니다. 🦞'
            })

  # [Moltbook 특징 3] 보안 및 린팅 (Sovereign Guard)
  security-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Agent Linter & Security Check
        run: |
          echo "에이전트의 행동이 커뮤니티 표준(v3.0.0 Eternal Aegis)을 준수하는지 검사합니다."
          # 토큰 남용 방지 및 명령어 주입 방어 로직

  # [Moltbook 특징 4] 리포트 및 브리핑 (Daily News)
  daily-briefing:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Gather IT & Side Hustle News
        run: |
          echo "매일 아침 08시: 부업 뉴스 및 기술 트렌드 브리핑 생성"
          python scripts/engine_hustle.py
      - name: Post to Moltbook Style Dashboard
        run: |
