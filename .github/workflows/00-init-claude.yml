name: ⚡ Bootstrap Claude Integration (Secure Fix)
description: "보안 토큰 노출 없이 Claude Code 워크플로우, 한국어 매뉴얼, 권한 도구를 생성합니다."

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  initialize:
    name: 🚀 Initialize System
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate & Execute Setup Script
        run: |
          echo "🔄 Initializing Secure Setup..."

          # [중요] GitHub Actions의 변수 치환 방지를 위한 변수 조립
          # 이렇게 하면 러너가 토큰 값으로 바꾸지 않고, 문자열 그대로 파일에 기록합니다.
          D="$"
          SAFE_ANTHROPIC="${D}{{ secrets.ANTHROPIC_API_KEY }}"
          SAFE_GITHUB="${D}{{ secrets.GITHUB_TOKEN }}"
          SAFE_RUN_ID="${D}{{ github.run_id }}"
          SAFE_PR_NUM="${D}{{ github.event.pull_request.number }}"
          SAFE_BASE_REF="${D}{{ github.base_ref }}"
          SAFE_ISSUE_NUM="${D}{{ github.event.issue.number }}"
          SAFE_ISSUE_TITLE="${D}{{ github.event.issue.title }}"
          SAFE_ISSUE_BODY="${D}{{ github.event.issue.body }}"
          SAFE_INPUT_REQ="${D}{{ inputs.requirement }}"
          SAFE_INPUT_BRANCH="${D}{{ inputs.branch_name }}"
          SAFE_INPUT_BRANCH_FMT="${D}{{ inputs.branch_name || format('feature/claude-{0}', github.run_id) }}"
          SAFE_STEP_PUSHED="${D}{{ steps.coding.outputs.pushed }}"
          SAFE_STEP_BRANCH="${D}{{ steps.coding.outputs.branch }}"

          # 생성 스크립트 작성 (EOF를 사용하여 변수 확장 허용)
          cat << EOF > generate_workflows.sh
          #!/bin/bash
          
          # 0. 디렉토리 구조 생성
          mkdir -p .github/workflows
          mkdir -p .github/actions/setup-claude
          mkdir -p scripts
          mkdir -p docs

          # ==============================================================================
          # 1. Setup Action 생성
          # ==============================================================================
          echo "⚙️  Generating Setup Action..."
          cat << 'YAML' > .github/actions/setup-claude/action.yml
          name: 'Setup Claude Code'
          description: 'Installs Claude Code CLI and persists authentication globally'
          inputs:
            anthropic-key:
              description: 'API Key for Authentication'
              required: true
          runs:
            using: "composite"
            steps:
              - name: Install Claude Code
                shell: bash
                run: |
                  curl -fsSL https://claude.ai/install.sh | bash
                  echo "\$HOME/.local/bin" >> \$GITHUB_PATH
              - name: Configure Global Authentication
                shell: bash
                run: |
                  echo "ANTHROPIC_API_KEY=\${{ inputs.anthropic-key }}" >> \$GITHUB_ENV
                  echo "CI=true" >> \$GITHUB_ENV
                  echo "CLAUDE_HEADLESS=true" >> \$GITHUB_ENV
                  git config --global user.name "Claude Bot"
                  git config --global user.email "bot@claude.ai"
          YAML

          # ==============================================================================
          # 2. Workflow: Feature Builder
          # ==============================================================================
          echo "🏗️  Generating Feature Builder Workflow..."
          cat << YAML > .github/workflows/03-feature-builder.yml
          name: 🏗️ Feature Builder (Dispatch)
          on:
            workflow_dispatch:
              inputs:
                requirement:
                  description: '구현할 기능 설명 (한국어)'
                  required: true
                branch_name:
                  description: '브랜치 이름 (옵션)'
                  required: false
          jobs:
            build-feature:
              runs-on: ubuntu-latest
              permissions:
                contents: write
                pull-requests: write
              steps:
                - uses: actions/checkout@v3
                - uses: ./.github/actions/setup-claude
                  with:
                    anthropic-key: $SAFE_ANTHROPIC
                - name: Create Branch & Code
                  id: coding
                  env:
                    BRANCH_NAME: $SAFE_INPUT_BRANCH_FMT
                  run: |
                    git checkout -b \$BRANCH_NAME
                    claude -p "TASK: $SAFE_INPUT_REQ \n CONTEXT: CI 환경. \n ACTION: 기능 구현. 사용자 입력 없이 코드 작성."
                    
                    if [[ -n \$(git status --porcelain) ]]; then
                      git add .
                      COMMIT_MSG=\$(git diff --staged | claude -p "Generate commit message in Korean (max 50 chars)")
                      git commit -m "\$COMMIT_MSG"
                      git push origin \$BRANCH_NAME
                      echo "pushed=true" >> \$GITHUB_OUTPUT
                      echo "branch=\$BRANCH_NAME" >> \$GITHUB_OUTPUT
                    else
                      echo "pushed=false" >> \$GITHUB_OUTPUT
                    fi
                - name: Create PR
                  if: steps.coding.outputs.pushed == 'true'
                  env:
                    GITHUB_TOKEN: $SAFE_GITHUB
                    BRANCH_NAME: $SAFE_STEP_BRANCH
                  run: |
                    gh pr create --title "✨ Feature: \$BRANCH_NAME" --body "Claude 구현:\n\n$SAFE_INPUT_REQ" --head \$BRANCH_NAME --base main
          YAML

          # ==============================================================================
          # 3. Workflow: Auto Review
          # ==============================================================================
          echo "🤖 Generating Review Workflow..."
          cat << YAML > .github/workflows/01-pr-auto-review.yml
          name: 🤖 Claude Code Reviewer
          on:
            pull_request:
              types: [opened, synchronize]
              paths-ignore: ['*.md', '.github/**']
          jobs:
            review:
              runs-on: ubuntu-latest
              permissions:
                contents: read
                pull-requests: write
              steps:
                - uses: actions/checkout@v3
                  with: { fetch-depth: 0 }
                - uses: ./.github/actions/setup-claude
                  with:
                    anthropic-key: $SAFE_ANTHROPIC
                - name: Analyze Diff
                  env:
                    PR_NUMBER: $SAFE_PR_NUM
                    GITHUB_TOKEN: $SAFE_GITHUB
                  run: |
                    git diff origin/$SAFE_BASE_REF > diff.txt
                    if [ ! -s diff.txt ]; then exit 0; fi
                    cat diff.txt | claude -p "코드 리뷰해줘. 보안/버그 위주. 한국어로 마크다운 출력. 문제 없으면 'LGTM'만 출력." > review.md
                    if ! grep -q "LGTM" review.md; then gh pr comment \$PR_NUMBER --body-file review.md; fi
          YAML

          # ==============================================================================
          # 4. Workflow: Issue Triage
          # ==============================================================================
          echo "🚑 Generating Issue Triage Workflow..."
          cat << YAML > .github/workflows/02-issue-triage.yml
          name: 🚑 Issue Auto-Triage
          on:
            issues: { types: [opened] }
          jobs:
            triage:
              runs-on: ubuntu-latest
              permissions:
                issues: write
                contents: read
              steps:
                - uses: actions/checkout@v3
                - uses: ./.github/actions/setup-claude
                  with:
                    anthropic-key: $SAFE_ANTHROPIC
                - name: Suggest Solution
                  env:
                    ISSUE_NUMBER: $SAFE_ISSUE_NUM
                    GITHUB_TOKEN: $SAFE_GITHUB
                  run: |
                    echo "제목: $SAFE_ISSUE_TITLE \n 내용: $SAFE_ISSUE_BODY" > issue.txt
                    claude -p "이슈 분석 및 코드 해결책 제안 (한국어). 컨텍스트: \$(cat issue.txt)" > solution.md
                    gh issue comment \$ISSUE_NUMBER --body-file solution.md
          YAML

          # ==============================================================================
          # 5. Workflow: Nightly Refactor
          # ==============================================================================
          echo "🧹 Generating Refactor Workflow..."
          cat << YAML > .github/workflows/99-nightly-refactor.yml
          name: 🧹 Nightly Refactor
          on:
            schedule:
              - cron: '0 18 * * *'
          jobs:
            refactor:
              runs-on: ubuntu-latest
              permissions:
                contents: write
                pull-requests: write
              steps:
                - uses: actions/checkout@v3
                - uses: ./.github/actions/setup-claude
                  with:
                    anthropic-key: $SAFE_ANTHROPIC
                - name: Cleanup
                  run: |
                    BRANCH="refactor/nightly-\$(date +%Y%m%d)"
                    git checkout -b \$BRANCH
                    claude -p "코드베이스 정리: 미사용 변수/임포트 제거, 주석 한글화."
                    if [[ -n \$(git status --porcelain) ]]; then
                      git add .
                      git commit -m "🧹 정기 리팩토링"
                      git push origin \$BRANCH
                      gh pr create --title "🧹 정기 리팩토링" --body "Automated Cleanup" --base main
                    fi
                  env:
                    GITHUB_TOKEN: $SAFE_GITHUB
          YAML

          # ==============================================================================
          # 6. Workflow: Permission Audit (권한 감사 - 신규)
          # ==============================================================================
          echo "🛡️ Generating Audit Workflow..."
          cat << YAML > .github/workflows/00-permission-audit.yml
          name: 🛡️ Security Permission Audit
          on:
            push:
              branches: [ main ]
            workflow_dispatch:
          jobs:
            audit:
              runs-on: ubuntu-latest
              steps:
                - name: Check Token
                  run: |
                    if [[ "$SAFE_GITHUB" == "" ]]; then echo "❌ Token Missing"; exit 1; fi
                    echo "✅ Token Present"
                - name: Check Scripts
                  uses: actions/checkout@v3
                  run: |
                    find . -name "*.sh" -exec ls -l {} \;
                    echo "ℹ️ Use scripts/restore_permissions.sh if needed."
          YAML

          # ==============================================================================
          # 7. Script: Restore Permissions (권한 복구 - 신규)
          # ==============================================================================
          echo "🔧 Generating Restore Script..."
          cat << 'SCRIPT' > scripts/restore_permissions.sh
          #!/bin/bash
          echo "🔧 Restoring execution permissions..."
          find . -type f -name "*.sh" -print0 | while IFS= read -r -d '' file; do
              chmod +x "\$file"
              echo "  - Fixed: \$file"
          done
          echo "✅ Done."
          SCRIPT
          chmod +x scripts/restore_permissions.sh

          # ==============================================================================
          # 8. Documentation: Korean Manual (한국어 매뉴얼 - 신규)
          # ==============================================================================
          echo "📚 Generating Manual..."
          cat << 'DOC' > CLAUDE_MANUAL_KR.md
          # 📘 Claude Code 통합 운영 매뉴얼

          ## 🚀 필수 설정
          1. **Secrets**: \`ANTHROPIC_API_KEY\` 등록 필수.
          2. **Permissions**: Settings > Actions > General > "Read and write permissions" 체크.

          ## 🤖 기능 가이드
          1. **🏗️ Feature Builder**: \`Actions\` 탭에서 수동 실행. 원하는 기능을 한국어로 입력하면 코드 작성 및 PR 생성.
          2. **🤖 Auto Reviewer**: PR 생성 시 자동 실행. 코드 변경사항을 분석해 한국어로 리뷰.
          3. **🚑 Issue Triage**: 이슈 등록 시 자동 실행. 해결책 제안.
          4. **🧹 Nightly Refactor**: 매일 새벽 자동 실행. 코드 정리.

          ## 🔧 문제 해결
          권한 에러 발생 시:
          \`\`\`bash
          ./scripts/restore_permissions.sh
          \`\`\`
          DOC
          
          EOF
          
          # 생성된 스크립트 실행
          chmod +x generate_workflows.sh
          ./generate_workflows.sh
          
          # [핵심] 생성 스크립트 삭제 (보안 및 커밋 방지)
          # 이 파일이 커밋되면 히스토리에 토큰 패턴이 남을 수 있으므로 즉시 삭제합니다.
          rm generate_workflows.sh

      - name: Commit & Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          git add .
          
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "🚀 Bootstrap: Secure Workflows & Manual Added"
            git push
          else
            echo "✅ Already up to date."
          fi
