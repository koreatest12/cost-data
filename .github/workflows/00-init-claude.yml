name: ⚡ Bootstrap Claude Integration (Ultimate Server)
description: "Claude Code 자율 에이전트, 대량 서비스 스캐폴딩, 보안 워크플로우를 일괄 구축합니다."

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  initialize:
    name: 🚀 Initialize Omni-Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate & Execute Setup Script
        run: |
          echo "🔄 Initializing Ultimate System..."

          # [보안] GitHub Actions 변수 치환 방지용 매직 변수 ($D)
          D="$"
          # Secrets 및 Context를 안전한 쉘 변수로 매핑
          SAFE_ANTHROPIC="${D}{{ secrets.ANTHROPIC_API_KEY }}"
          SAFE_GITHUB="${D}{{ secrets.GITHUB_TOKEN }}"
          SAFE_RUN_ID="${D}{{ github.run_id }}"
          SAFE_PR_NUM="${D}{{ github.event.pull_request.number }}"
          SAFE_BASE_REF="${D}{{ github.base_ref }}"
          SAFE_ISSUE_NUM="${D}{{ github.event.issue.number }}"
          SAFE_ISSUE_TITLE="${D}{{ github.event.issue.title }}"
          SAFE_ISSUE_BODY="${D}{{ github.event.issue.body }}"
          SAFE_INPUT_REQ="${D}{{ inputs.requirement }}"
          SAFE_INPUT_BRANCH="${D}{{ inputs.branch_name }}"
          SAFE_INPUT_BRANCH_FMT="${D}{{ inputs.branch_name || format('feature/claude-{0}', github.run_id) }}"
          SAFE_STEP_PUSHED="${D}{{ steps.coding.outputs.pushed }}"
          SAFE_STEP_BRANCH="${D}{{ steps.coding.outputs.branch }}"

          # 생성 스크립트 작성 시작
          cat << EOF > generate_workflows.sh
          #!/bin/bash
          
          # 0. 디렉토리 구조 생성
          mkdir -p .github/workflows
          mkdir -p .github/actions/setup-claude
          mkdir -p scripts
          mkdir -p docs

          # ==============================================================================
          # 1. Setup Action (Claude CLI 설치)
          # ==============================================================================
          echo "⚙️  Generating Setup Action..."
          cat << 'YAML' > .github/actions/setup-claude/action.yml
          name: 'Setup Claude Code'
          description: 'Installs Claude Code CLI and persists authentication globally'
          inputs:
            anthropic-key:
              description: 'API Key for Authentication'
              required: true
          runs:
            using: "composite"
            steps:
              - name: Install Claude Code
                shell: bash
                run: |
                  curl -fsSL https://claude.ai/install.sh | bash
                  echo "\$HOME/.local/bin" >> \$GITHUB_PATH
              - name: Configure Global Authentication
                shell: bash
                run: |
                  echo "ANTHROPIC_API_KEY=\${{ inputs.anthropic-key }}" >> \$GITHUB_ENV
                  echo "CI=true" >> \$GITHUB_ENV
                  echo "CLAUDE_HEADLESS=true" >> \$GITHUB_ENV
                  git config --global user.name "Claude Bot"
                  git config --global user.email "bot@claude.ai"
          YAML

          # ==============================================================================
          # 2. Script: Massive Microservice Scaffolding (대량 파일 생성기)
          # ==============================================================================
          echo "🏗️  Generating Massive Scaffolding Script..."
          cat << 'SCRIPT' > scripts/scaffold_services.sh
          #!/bin/bash
          
          echo "🚀 Starting Massive Microservices Scaffolding..."
          
          SERVICES=("omni-security-service" "omni-job-service" "omni-algo-service" "omni-cost-service")
          PACKAGES=("security" "job" "algo" "cost")
          
          mkdir -p services
          
          for i in "\${!SERVICES[@]}"; do
              SVC_NAME=\${SERVICES[\$i]}
              PKG_NAME=\${PACKAGES[\$i]}
              BASE_DIR="services/\$SVC_NAME/src/main/java/com/costdata/\$PKG_NAME"
              RSRC_DIR="services/\$SVC_NAME/src/main/resources"
              
              echo "📦 Generating \$SVC_NAME structure..."
              
              # 디렉토리 대량 생성
              mkdir -p \$BASE_DIR/controller
              mkdir -p \$BASE_DIR/service
              mkdir -p \$BASE_DIR/repository
              mkdir -p \$BASE_DIR/domain
              mkdir -p \$BASE_DIR/dto
              mkdir -p \$BASE_DIR/config
              mkdir -p \$RSRC_DIR
              
              # 1. Application.java
              cat <<JAVA > \$BASE_DIR/ServiceApplication.java
          package com.costdata.\$PKG_NAME;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          @SpringBootApplication
          public class ServiceApplication {
              public static void main(String[] args) { SpringApplication.run(ServiceApplication.class, args); }
          }
          JAVA
              
              # 2. Controller
              cat <<JAVA > \$BASE_DIR/controller/\${PKG_NAME^}Controller.java
          package com.costdata.\$PKG_NAME.controller;
          import org.springframework.web.bind.annotation.*;
          import java.util.Map;
          @RestController
          @RequestMapping("/api/v1/\$PKG_NAME")
          public class \${PKG_NAME^}Controller {
              @GetMapping("/health")
              public Map<String, String> health() { return Map.of("status", "UP", "service", "\$SVC_NAME"); }
          }
          JAVA
          
              # 3. Config (Security)
              cat <<JAVA > \$BASE_DIR/config/SecurityConfig.java
          package com.costdata.\$PKG_NAME.config;
          import org.springframework.context.annotation.Configuration;
          @Configuration
          public class SecurityConfig {
              // TODO: Claude will implement JWT filter here
          }
          JAVA
          
              # 4. resources/application.yml
              cat <<YML > \$RSRC_DIR/application.yml
          server:
            port: 808\${i}
          spring:
            application:
              name: \$SVC_NAME
          management:
            endpoints:
              web:
                exposure:
                  include: health,info,metrics
          YML
          
          done
          
          echo "✅ Generated 4 Microservices with standard architecture."
          SCRIPT
          chmod +x scripts/scaffold_services.sh

          # ==============================================================================
          # 3. Workflow: Claude Autonomous Server (자율 에이전트)
          # ==============================================================================
          echo "🤖 Generating Autonomous Server Workflow..."
          cat << YAML > .github/workflows/04-claude-autonomous.yml
          name: 🤖 Claude Autonomous Server
          on:
            schedule:
              - cron: '0 */6 * * *' # 6시간마다 실행
            workflow_dispatch:
          jobs:
            agent-run:
              runs-on: ubuntu-latest
              permissions:
                contents: write
                pull-requests: write
                issues: write
              steps:
                - uses: actions/checkout@v3
                - uses: ./.github/actions/setup-claude
                  with:
                    anthropic-key: $SAFE_ANTHROPIC
                
                - name: 🔍 Scan & Execute Tasks
                  env:
                    GITHUB_TOKEN: $SAFE_GITHUB
                  run: |
                    echo "🤖 Claude Agent Started..."
                    
                    # 1. TODO 주석 스캔 및 처리
                    grep -r "TODO: Claude" . > todos.txt || true
                    
                    if [ -s todos.txt ]; then
                        echo "📝 TODOs found. Processing..."
                        BRANCH="agent/todo-fix-\$(date +%s)"
                        git checkout -b \$BRANCH
                        
                        claude -p "다음 파일들의 'TODO: Claude' 주석을 찾아서 실제 코드로 구현해줘. 한국어로 커밋해. 컨텍스트: \$(cat todos.txt)"
                        
                        if [[ -n \$(git status --porcelain) ]]; then
                            git add .
                            git commit -m "🤖 Claude Agent: TODO 구현 완료"
                            git push origin \$BRANCH
                            gh pr create --title "🤖 Agent: TODO Implementation" --body "코드베이스 내 TODO 주석을 자동으로 구현했습니다." --base main
                        fi
                    else
                        echo "✅ 처리할 TODO가 없습니다."
                    fi
          YAML

          # ==============================================================================
          # 4. Workflow: Feature Builder
          # ==============================================================================
          echo "🏗️  Generating Feature Builder..."
          cat << YAML > .github/workflows/03-feature-builder.yml
          name: 🏗️ Feature Builder (Dispatch)
          on:
            workflow_dispatch:
              inputs:
                requirement:
                  description: '구현할 기능 (한국어)'
                  required: true
                branch_name:
                  description: '브랜치명 (옵션)'
                  required: false
          jobs:
            build:
              runs-on: ubuntu-latest
              permissions: contents: write; pull-requests: write
              steps:
                - uses: actions/checkout@v3
                - uses: ./.github/actions/setup-claude
                  with: { anthropic-key: $SAFE_ANTHROPIC }
                - name: Coding
                  id: coding
                  env: { BRANCH_NAME: $SAFE_INPUT_BRANCH_FMT }
                  run: |
                    git checkout -b \$BRANCH_NAME
                    claude -p "TASK: $SAFE_INPUT_REQ \n ACTION: 기능 구현. 사용자 입력 없이 코드 작성. services/ 폴더 구조 준수."
                    if [[ -n \$(git status --porcelain) ]]; then
                      git add .
                      git commit -m "✨ Feature: $SAFE_INPUT_REQ"
                      git push origin \$BRANCH_NAME
                      echo "pushed=true" >> \$GITHUB_OUTPUT
                      echo "branch=\$BRANCH_NAME" >> \$GITHUB_OUTPUT
                    fi
                - name: PR
                  if: steps.coding.outputs.pushed == 'true'
                  env: { GITHUB_TOKEN: $SAFE_GITHUB, BRANCH_NAME: $SAFE_STEP_BRANCH }
                  run: gh pr create --title "✨ Feature: \$BRANCH_NAME" --body "$SAFE_INPUT_REQ" --head \$BRANCH_NAME --base main
          YAML

          # ==============================================================================
          # 5. Workflow: Auto Reviewer
          # ==============================================================================
          echo "👀 Generating Reviewer..."
          cat << YAML > .github/workflows/01-pr-auto-review.yml
          name: 🤖 Claude Code Reviewer
          on:
            pull_request: { types: [opened, synchronize] }
          jobs:
            review:
              runs-on: ubuntu-latest
              permissions: contents: read; pull-requests: write
              steps:
                - uses: actions/checkout@v3
                  with: { fetch-depth: 0 }
                - uses: ./.github/actions/setup-claude
                  with: { anthropic-key: $SAFE_ANTHROPIC }
                - name: Review
                  env: { PR_NUM: $SAFE_PR_NUM, GITHUB_TOKEN: $SAFE_GITHUB }
                  run: |
                    git diff origin/$SAFE_BASE_REF > diff.txt
                    if [ ! -s diff.txt ]; then exit 0; fi
                    cat diff.txt | claude -p "코드 리뷰 (한국어). 보안/성능 위주. 문제 없으면 'LGTM'." > review.md
                    if ! grep -q "LGTM" review.md; then gh pr comment \$PR_NUM --body-file review.md; fi
          YAML

          # ==============================================================================
          # 6. Workflow: Permission Audit & Restore Tool
          # ==============================================================================
          echo "🛡️  Generating Permission Tools..."
          cat << YAML > .github/workflows/00-permission-audit.yml
          name: 🛡️ Security Permission Audit
          on: { push: { branches: [main] } }
          jobs:
            audit:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v3
                - run: |
                    find . -name "*.sh" -exec ls -l {} \;
                    if [[ "$SAFE_GITHUB" == "" ]]; then echo "❌ Token Missing"; exit 1; fi
          YAML

          cat << 'SCRIPT' > scripts/restore_permissions.sh
          #!/bin/bash
          echo "🔧 Restoring permissions..."
          find . -type f -name "*.sh" -exec chmod +x {} \;
          echo "✅ Done."
          SCRIPT
          chmod +x scripts/restore_permissions.sh

          # ==============================================================================
          # 7. Documentation: Korean Manual
          # ==============================================================================
          echo "📚 Generating Manual..."
          cat << 'DOC' > CLAUDE_MANUAL_KR.md
          # 📘 Claude Code & Omni-Server 운영 매뉴얼

          ## 🌟 핵심 기능
          1. **🏗️ 대량 스캐폴딩**: \`./scripts/scaffold_services.sh\` 실행 시 4개 마이크로서비스(Controller, Service, DTO 등) 자동 생성.
          2. **🤖 자율 에이전트**: \`04-claude-autonomous.yml\`이 6시간마다 실행되어 \`TODO: Claude\` 주석을 찾아 자동으로 코드를 구현.
          3. **🏗️ 기능 빌더**: 수동으로 기능을 요청하면 브랜치 생성부터 PR까지 자동화.

          ## 🚀 필수 설정
          - Secrets에 \`ANTHROPIC_API_KEY\` 등록 필수.
          - Settings > Actions > General > "Read and write permissions" 허용.

          ## 📁 디렉토리 구조
          - \`.github/workflows\`: 자동화 파이프라인
          - \`services/\`: 마이크로서비스 소스 코드 (Java/Spring Boot)
          - \`scripts/\`: 유틸리티 스크립트

          ## 🆘 문제 해결
          권한 에러 시: \`./scripts/restore_permissions.sh\`
          DOC

          EOF

          # 스크립트 실행 및 삭제
          chmod +x generate_workflows.sh
          ./generate_workflows.sh
          
          # [중요] 스크립트 실행 후 즉시 파일 삭제 (토큰 유출 방지)
          rm generate_workflows.sh

      - name: Commit & Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "🚀 Bootstrap: Ultimate Server & Scaffolding Tools"
            git push
          else
            echo "✅ Already up to date."
          fi
