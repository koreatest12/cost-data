name: ⚡ Bootstrap Claude Integration (Auto-Update)
description: "Dependabot, 자율 에이전트, 대량 스캐폴딩을 포함한 완전 자동화된 엔터프라이즈 환경을 구축합니다."

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  initialize:
    name: 🚀 Initialize Omni-System
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 충돌 해결을 위한 전체 히스토리

      - name: Generate & Execute Setup Script
        run: |
          echo "🔄 Initializing Auto-Update System..."

          # [보안] GitHub Actions 변수 치환 방지 ($D)
          D="$"
          SAFE_ANTHROPIC="${D}{{ secrets.ANTHROPIC_API_KEY }}"
          SAFE_GITHUB="${D}{{ secrets.GITHUB_TOKEN }}"
          SAFE_RUN_ID="${D}{{ github.run_id }}"
          SAFE_PR_NUM="${D}{{ github.event.pull_request.number }}"
          SAFE_BASE_REF="${D}{{ github.base_ref }}"
          SAFE_INPUT_REQ="${D}{{ inputs.requirement }}"
          SAFE_INPUT_BRANCH_FMT="${D}{{ inputs.branch_name || format('feature/claude-{0}', github.run_id) }}"
          SAFE_STEP_PUSHED="${D}{{ steps.coding.outputs.pushed }}"
          SAFE_STEP_BRANCH="${D}{{ steps.coding.outputs.branch }}"

          # 생성 스크립트 작성 시작
          cat << EOF > generate_workflows.sh
          #!/bin/bash
          
          # 0. 디렉토리 구조 생성
          mkdir -p .github/workflows
          mkdir -p .github/actions/setup-claude
          mkdir -p scripts
          mkdir -p docs
          mkdir -p services

          # ==============================================================================
          # 1. Dependabot Config (신규 추가: 의존성 자동 업데이트)
          # ==============================================================================
          echo "🤖 Generating Dependabot Config..."
          cat << YAML > .github/dependabot.yml
          version: 2
          updates:
            # 1. GitHub Actions (매일 확인)
            - package-ecosystem: "github-actions"
              directory: "/"
              schedule:
                interval: "daily"
              open-pull-requests-limit: 10
            
            # 2. Maven (Java 마이크로서비스 - 매주 확인)
            - package-ecosystem: "maven"
              directory: "/" # Root POM 스캔
              schedule:
                interval: "weekly"
            
            # 3. Pip (Python 데이터 엔진 - 매주 확인)
            - package-ecosystem: "pip"
              directory: "/"
              schedule:
                interval: "weekly"
          YAML

          # ==============================================================================
          # 2. Setup Action (Claude CLI 설치)
          # ==============================================================================
          echo "⚙️  Generating Setup Action..."
          cat << 'YAML' > .github/actions/setup-claude/action.yml
          name: 'Setup Claude Code'
          description: 'Installs Claude Code CLI and persists authentication globally'
          inputs:
            anthropic-key:
              description: 'API Key for Authentication'
              required: true
          runs:
            using: "composite"
            steps:
              - name: Install Claude Code
                shell: bash
                run: |
                  curl -fsSL https://claude.ai/install.sh | bash
                  echo "\$HOME/.local/bin" >> \$GITHUB_PATH
              - name: Configure Global Authentication
                shell: bash
                run: |
                  echo "ANTHROPIC_API_KEY=\${{ inputs.anthropic-key }}" >> \$GITHUB_ENV
                  echo "CI=true" >> \$GITHUB_ENV
                  echo "CLAUDE_HEADLESS=true" >> \$GITHUB_ENV
                  git config --global user.name "Claude Bot"
                  git config --global user.email "bot@claude.ai"
          YAML

          # ==============================================================================
          # 3. Script: Massive Microservice Scaffolding (대량 파일 생성기)
          # ==============================================================================
          echo "🏗️  Generating Massive Scaffolding Script..."
          cat << 'SCRIPT' > scripts/scaffold_services.sh
          #!/bin/bash
          
          echo "🚀 Starting Massive Microservices Scaffolding..."
          
          SERVICES=("omni-security-service" "omni-job-service" "omni-algo-service" "omni-cost-service")
          PACKAGES=("security" "job" "algo" "cost")
          
          mkdir -p services
          
          for i in "\${!SERVICES[@]}"; do
              SVC_NAME=\${SERVICES[\$i]}
              PKG_NAME=\${PACKAGES[\$i]}
              BASE_DIR="services/\$SVC_NAME/src/main/java/com/costdata/\$PKG_NAME"
              RSRC_DIR="services/\$SVC_NAME/src/main/resources"
              
              echo "📦 Generating \$SVC_NAME structure..."
              
              # 디렉토리 대량 생성
              mkdir -p \$BASE_DIR/controller
              mkdir -p \$BASE_DIR/service
              mkdir -p \$BASE_DIR/repository
              mkdir -p \$BASE_DIR/domain
              mkdir -p \$BASE_DIR/dto
              mkdir -p \$BASE_DIR/config
              mkdir -p \$RSRC_DIR
              
              # 1. Application.java
              cat <<JAVA > \$BASE_DIR/ServiceApplication.java
          package com.costdata.\$PKG_NAME;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          @SpringBootApplication
          public class ServiceApplication {
              public static void main(String[] args) { SpringApplication.run(ServiceApplication.class, args); }
          }
          JAVA
              
              # 2. Controller
              cat <<JAVA > \$BASE_DIR/controller/\${PKG_NAME^}Controller.java
          package com.costdata.\$PKG_NAME.controller;
          import org.springframework.web.bind.annotation.*;
          import java.util.Map;
          @RestController
          @RequestMapping("/api/v1/\$PKG_NAME")
          public class \${PKG_NAME^}Controller {
              @GetMapping("/health")
              public Map<String, String> health() { return Map.of("status", "UP", "service", "\$SVC_NAME"); }
          }
          JAVA
              
              # 3. application.yml
              cat <<YML > \$RSRC_DIR/application.yml
          server:
            port: 808\${i}
          spring:
            application:
              name: \$SVC_NAME
          management:
            endpoints:
              web:
                exposure:
                  include: health,info,metrics
          YML
          done
          
          echo "✅ Generated 4 Microservices."
          SCRIPT
          chmod +x scripts/scaffold_services.sh

          # ==============================================================================
          # 4. Workflow: Claude Autonomous Server (자율 에이전트)
          # ==============================================================================
          echo "🤖 Generating Autonomous Server Workflow..."
          cat << YAML > .github/workflows/04-claude-autonomous.yml
          name: 🤖 Claude Autonomous Server
          on:
            schedule:
              - cron: '0 */6 * * *'
            workflow_dispatch:
          jobs:
            agent-run:
              runs-on: ubuntu-latest
              permissions:
                contents: write
                pull-requests: write
                issues: write
              steps:
                - uses: actions/checkout@v3
                - uses: ./.github/actions/setup-claude
                  with:
                    anthropic-key: $SAFE_ANTHROPIC
                
                - name: 🔍 Scan & Execute Tasks
                  env:
                    GITHUB_TOKEN: $SAFE_GITHUB
                  run: |
                    grep -r "TODO: Claude" . > todos.txt || true
                    if [ -s todos.txt ]; then
                        BRANCH="agent/todo-fix-\$(date +%s)"
                        git checkout -b \$BRANCH
                        claude -p "다음 'TODO: Claude' 주석을 코드로 구현하고 한국어로 커밋해. 컨텍스트: \$(cat todos.txt)"
                        if [[ -n \$(git status --porcelain) ]]; then
                            git add .
                            git commit -m "🤖 Claude Agent: TODO 구현 완료"
                            git push origin \$BRANCH
                            gh pr create --title "🤖 Agent Implementation" --body "Automated Code" --base main
                        fi
                    fi
          YAML

          # ==============================================================================
          # 5. Workflow: Feature Builder
          # ==============================================================================
          echo "🏗️  Generating Feature Builder..."
          cat << YAML > .github/workflows/03-feature-builder.yml
          name: 🏗️ Feature Builder (Dispatch)
          on:
            workflow_dispatch:
              inputs:
                requirement:
                  description: '구현할 기능 (한국어)'
                  required: true
                branch_name:
                  description: '브랜치명'
                  required: false
          jobs:
            build:
              runs-on: ubuntu-latest
              permissions: contents: write; pull-requests: write
              steps:
                - uses: actions/checkout@v3
                - uses: ./.github/actions/setup-claude
                  with: { anthropic-key: $SAFE_ANTHROPIC }
                - name: Coding
                  id: coding
                  env: { BRANCH_NAME: $SAFE_INPUT_BRANCH_FMT }
                  run: |
                    git checkout -b \$BRANCH_NAME
                    claude -p "TASK: $SAFE_INPUT_REQ \n ACTION: 기능 구현. 사용자 입력 없이 코드 작성."
                    if [[ -n \$(git status --porcelain) ]]; then
                      git add .
                      git commit -m "✨ Feature: $SAFE_INPUT_REQ"
                      git push origin \$BRANCH_NAME
                      echo "pushed=true" >> \$GITHUB_OUTPUT
                      echo "branch=\$BRANCH_NAME" >> \$GITHUB_OUTPUT
                    fi
                - name: PR
                  if: steps.coding.outputs.pushed == 'true'
                  env: { GITHUB_TOKEN: $SAFE_GITHUB, BRANCH_NAME: $SAFE_STEP_BRANCH }
                  run: gh pr create --title "✨ Feature: \$BRANCH_NAME" --body "$SAFE_INPUT_REQ" --head \$BRANCH_NAME --base main
          YAML

          # ==============================================================================
          # 6. Documentation
          # ==============================================================================
          echo "📚 Generating Manual..."
          cat << 'DOC' > CLAUDE_MANUAL_KR.md
          # 📘 Omni-Server 운영 매뉴얼

          ## 🤖 Dependabot (신규)
          - \`.github/dependabot.yml\` 파일이 생성되었습니다.
          - GitHub Actions, Maven, Pip 패키지를 매일/매주 자동으로 최신 버전으로 업데이트합니다.

          ## 🌟 핵심 기능
          1. **🏗️ 대량 스캐폴딩**: \`./scripts/scaffold_services.sh\`로 4개 마이크로서비스 구조 생성.
          2. **🤖 자율 에이전트**: 6시간마다 \`TODO\` 주석을 스스로 구현.

          ## 🆘 문제 해결
          Git 충돌 시 이 워크플로우를 재실행하면 자동 복구됩니다.
          DOC

          EOF

          chmod +x generate_workflows.sh
          ./generate_workflows.sh
          rm generate_workflows.sh

      # [충돌 방지 로직]
      - name: Commit & Push with Retry
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          git add .
          
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "🚀 Bootstrap: Dependabot & Ultimate Server Added"
            
            MAX_RETRIES=10
            count=0
            until [ $count -ge $MAX_RETRIES ]; do
              git pull origin main --no-rebase && git push origin main && break
              count=$((count+1))
              echo "⚠️ Push failed. Retrying ($count/$MAX_RETRIES)..."
              sleep 5
            done
          fi
