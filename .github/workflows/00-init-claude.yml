name: ⚡ Bootstrap Omni-System (Total Construction)
description: "4개 마이크로서비스의 전체 소스코드(Java, Docker, Config)를 대량으로 생성하고 반영합니다."

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  construct-universe:
    name: 🏗️ Construct Massive Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 히스토리 충돌 방지

      - name: Generate & Execute Construction Script
        run: |
          echo "🚀 Starting Massive File Construction..."

          # [보안] 변수 치환 방지 ($D)
          D="$"
          SAFE_ANTHROPIC="${D}{{ secrets.ANTHROPIC_API_KEY }}"
          SAFE_GITHUB="${D}{{ secrets.GITHUB_TOKEN }}"
          SAFE_RUN_ID="${D}{{ github.run_id }}"
          SAFE_INPUT_REQ="${D}{{ inputs.requirement }}"
          SAFE_INPUT_BRANCH_FMT="${D}{{ inputs.branch_name || format('feature/claude-{0}', github.run_id) }}"

          # ==============================================================================
          # 1. 스캐폴딩 스크립트 작성 (대량 파일 생성 로직)
          # ==============================================================================
          mkdir -p scripts
          cat << 'EOF' > scripts/scaffold_services.sh
          #!/bin/bash
          
          # 정의: 서비스명 및 패키지명
          SERVICES=("omni-security-service" "omni-job-service" "omni-algo-service" "omni-cost-service")
          PACKAGES=("security" "job" "algo" "cost")
          PORTS=(8081 8082 8083 8084)
          
          mkdir -p services
          
          echo "🏗️  Constructing 4 Microservices..."
          
          for i in "${!SERVICES[@]}"; do
              SVC_NAME=${SERVICES[$i]}
              PKG_NAME=${PACKAGES[$i]}
              PORT=${PORTS[$i]}
              
              # 경로 설정
              BASE_PATH="services/$SVC_NAME/src/main/java/com/costdata/$PKG_NAME"
              RSRC_PATH="services/$SVC_NAME/src/main/resources"
              TEST_PATH="services/$SVC_NAME/src/test/java/com/costdata/$PKG_NAME"
              K8S_PATH="services/$SVC_NAME/k8s"
              
              echo "  📦 Building $SVC_NAME (Port: $PORT)..."
              
              # 1. 디렉토리 구조 생성
              mkdir -p $BASE_PATH/controller
              mkdir -p $BASE_PATH/service
              mkdir -p $BASE_PATH/dto
              mkdir -p $BASE_PATH/repository
              mkdir -p $BASE_PATH/config
              mkdir -p $BASE_PATH/domain
              mkdir -p $RSRC_PATH
              mkdir -p $TEST_PATH
              mkdir -p $K8S_PATH
              
              # 2. pom.xml (Maven 빌드 설정)
              cat <<XML > services/$SVC_NAME/pom.xml
          <project xmlns="http://maven.apache.org/POM/4.0.0" 
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" 
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <parent>
                  <groupId>org.springframework.boot</groupId>
                  <artifactId>spring-boot-starter-parent</artifactId>
                  <version>3.2.1</version>
                  <relativePath/>
              </parent>
              <groupId>com.costdata</groupId>
              <artifactId>$SVC_NAME</artifactId>
              <version>1.0.0</version>
              <dependencies>
                  <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId></dependency>
                  <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-actuator</artifactId></dependency>
                  <dependency><groupId>org.projectlombok</groupId><artifactId>lombok</artifactId><optional>true</optional></dependency>
                  <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-test</artifactId><scope>test</scope></dependency>
              </dependencies>
              <build><plugins><plugin><groupId>org.springframework.boot</groupId><artifactId>spring-boot-maven-plugin</artifactId></plugin></plugins></build>
          </project>
          XML

              # 3. Application.java (메인 클래스)
              cat <<JAVA > $BASE_PATH/ServiceApplication.java
          package com.costdata.$PKG_NAME;
          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;
          @SpringBootApplication
          public class ServiceApplication {
              public static void main(String[] args) { SpringApplication.run(ServiceApplication.class, args); }
          }
          JAVA

              # 4. Controller (API 엔드포인트)
              cat <<JAVA > $BASE_PATH/controller/${PKG_NAME^}Controller.java
          package com.costdata.$PKG_NAME.controller;
          import com.costdata.$PKG_NAME.service.${PKG_NAME^}Service;
          import com.costdata.$PKG_NAME.dto.${PKG_NAME^}Response;
          import org.springframework.web.bind.annotation.*;
          import lombok.RequiredArgsConstructor;
          import java.util.Map;

          @RestController
          @RequestMapping("/api/v1/$PKG_NAME")
          @RequiredArgsConstructor
          public class ${PKG_NAME^}Controller {
              private final ${PKG_NAME^}Service service;

              @GetMapping("/status")
              public Map<String, String> status() { return Map.of("status", "UP", "module", "$SVC_NAME"); }
              
              @GetMapping("/{id}")
              public ${PKG_NAME^}Response getInfo(@PathVariable String id) {
                  return service.process(id);
              }
          }
          JAVA

              # 5. Service (비즈니스 로직)
              cat <<JAVA > $BASE_PATH/service/${PKG_NAME^}Service.java
          package com.costdata.$PKG_NAME.service;
          import com.costdata.$PKG_NAME.dto.${PKG_NAME^}Response;
          import org.springframework.stereotype.Service;
          import lombok.extern.slf4j.Slf4j;

          @Service
          @Slf4j
          public class ${PKG_NAME^}Service {
              public ${PKG_NAME^}Response process(String id) {
                  log.info("Processing request for ID: {}", id);
                  return new ${PKG_NAME^}Response(id, "Processed by $SVC_NAME", System.currentTimeMillis());
              }
          }
          JAVA

              # 6. DTO (데이터 전송 객체)
              cat <<JAVA > $BASE_PATH/dto/${PKG_NAME^}Response.java
          package com.costdata.$PKG_NAME.dto;
          import lombok.AllArgsConstructor;
          import lombok.Data;
          @Data @AllArgsConstructor
          public class ${PKG_NAME^}Response {
              private String id;
              private String message;
              private long timestamp;
          }
          JAVA

              # 7. Config (설정 파일)
              cat <<JAVA > $BASE_PATH/config/AppConfig.java
          package com.costdata.$PKG_NAME.config;
          import org.springframework.context.annotation.Configuration;
          @Configuration
          public class AppConfig {
              // TODO: Claude - Add global configurations here
          }
          JAVA

              # 8. application.yml (서버 설정)
              cat <<YML > $RSRC_PATH/application.yml
          server:
            port: $PORT
          spring:
            application:
              name: $SVC_NAME
          management:
            endpoints:
              web:
                exposure:
                  include: health,info,metrics,prometheus
          logging:
            level:
              com.costdata: INFO
          YML

              # 9. Dockerfile (배포용)
              cat <<DOCKER > services/$SVC_NAME/Dockerfile
          FROM eclipse-temurin:17-jre-jammy
          WORKDIR /app
          COPY target/*.jar app.jar
          # Non-root user for security
          RUN groupadd -r omni && useradd -r -g omni omni
          USER omni
          ENTRYPOINT ["java", "-jar", "app.jar"]
          DOCKER

              # 10. K8s Deployment (인프라 설정)
              cat <<YAML > $K8S_PATH/deployment.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: $SVC_NAME
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: $SVC_NAME
            template:
              metadata:
                labels:
                  app: $SVC_NAME
              spec:
                containers:
                - name: app
                  image: ghcr.io/koreatest12/$SVC_NAME:latest
                  ports:
                  - containerPort: $PORT
          YAML

          done
          
          echo "✅ All 4 Services Constructed Successfully."
          EOF
          
          # ==============================================================================
          # 2. 실행 및 반영
          # ==============================================================================
          chmod +x scripts/scaffold_services.sh
          ./scripts/scaffold_services.sh
          
          # [보안] 생성된 스크립트는 유지 (유틸리티로 사용)

      # ==============================================================================
      # 3. Claude 워크플로우 생성 (기존 유지)
      # ==============================================================================
      - name: Generate Workflows
        run: |
          D="$"
          SAFE_ANTHROPIC="${D}{{ secrets.ANTHROPIC_API_KEY }}"
          SAFE_GITHUB="${D}{{ secrets.GITHUB_TOKEN }}"
          
          # Setup Action
          mkdir -p .github/actions/setup-claude
          cat << YAML > .github/actions/setup-claude/action.yml
          name: 'Setup Claude Code'
          description: 'Installs Claude Code CLI'
          inputs:
            anthropic-key: {required: true}
          runs:
            using: "composite"
            steps:
              - run: curl -fsSL https://claude.ai/install.sh | bash
                shell: bash
              - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
                shell: bash
              - run: |
                  echo "ANTHROPIC_API_KEY=${{ inputs.anthropic-key }}" >> $GITHUB_ENV
                  git config --global user.name "Claude Bot"
                  git config --global user.email "bot@claude.ai"
                shell: bash
          YAML
          
          # Feature Builder Workflow
          cat << YAML > .github/workflows/03-feature-builder.yml
          name: 🏗️ Feature Builder
          on:
            workflow_dispatch:
              inputs:
                requirement: {required: true}
          jobs:
            build:
              runs-on: ubuntu-latest
              permissions: {contents: write, pull-requests: write}
              steps:
                - uses: actions/checkout@v3
                - uses: ./.github/actions/setup-claude
                  with: {anthropic-key: $SAFE_ANTHROPIC}
                - run: |
                    git checkout -b feature/claude-${D}{{ github.run_id }}
                    claude -p "TASK: ${D}{{ inputs.requirement }}"
                    git add .
                    git commit -m "✨ Feature: ${D}{{ inputs.requirement }}"
                    git push origin feature/claude-${D}{{ github.run_id }}
                    gh pr create --title "✨ Feature" --body "${D}{{ inputs.requirement }}" --base main
                  env: {GITHUB_TOKEN: $SAFE_GITHUB}
          YAML

      # ==============================================================================
      # 4. Git Push with Retry (충돌 방지)
      # ==============================================================================
      - name: Commit & Push Massive Changes
        run: |
          git config --global user.name "Omni Architect"
          git config --global user.email "architect@omni.system"
          
          git add .
          
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "🏗️ Omni-System: Massive Service Construction (4 Services)"
            
            MAX_RETRIES=10
            count=0
            until [ $count -ge $MAX_RETRIES ]; do
              git pull origin main --no-rebase && git push origin main && break
              count=$((count+1))
              echo "⚠️ Push failed. Retrying ($count/$MAX_RETRIES)..."
              sleep 5
            done
          else
            echo "✅ System already constructed."
          fi
