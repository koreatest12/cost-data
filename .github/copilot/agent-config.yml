name: cost-data-agent
version: 2.0.0
description: Advanced GitHub Copilot agent with enhanced security, monitoring, and automation

# Agent configuration - no skipping with advanced features
settings:
  skip_firewall: false
  skip_windows: false
  run_all_checks: true
  enable_monitoring: true
  enable_logging: true
  enable_notifications: true
  enable_auto_remediation: true
  
# Environment configurations
environments:
  - name: windows
    enabled: true
    skip: false
    firewall:
      enabled: true
      skip: false
      advanced_mode: true
      intrusion_detection: true
      rules:
        - name: Allow HTTP
          protocol: TCP
          port: 80
          direction: inbound
          action: allow
          logging: true
        - name: Allow HTTPS
          protocol: TCP
          port: 443
          direction: inbound
          action: allow
          logging: true
        - name: Allow SSH
          protocol: TCP
          port: 22
          direction: inbound
          action: allow
          rate_limit: true
          max_connections: 10
          logging: true
        - name: Block Suspicious Traffic
          protocol: TCP
          port_range: "1-1023"
          direction: inbound
          action: block
          exceptions: [80, 443, 22]
          logging: true
    monitoring:
      enabled: true
      metrics:
        - cpu_usage
        - memory_usage
        - disk_usage
        - network_traffic
      thresholds:
        cpu_warning: 80
        cpu_critical: 95
        memory_warning: 85
        memory_critical: 95
    settings:
      enforce_all: true
      auto_update: true
      backup_enabled: true
      
  - name: linux
    enabled: true
    skip: false
    firewall:
      enabled: true
      skip: false
      advanced_mode: true
      intrusion_detection: true
      rules:
        - name: Allow HTTP
          protocol: TCP
          port: 80
          direction: inbound
          action: allow
          logging: true
        - name: Allow HTTPS
          protocol: TCP
          port: 443
          direction: inbound
          action: allow
          logging: true
        - name: Allow SSH
          protocol: TCP
          port: 22
          direction: inbound
          action: allow
          rate_limit: true
          max_connections: 10
          logging: true
        - name: Block Suspicious Traffic
          protocol: TCP
          port_range: "1-1023"
          direction: inbound
          action: block
          exceptions: [80, 443, 22]
          logging: true
    monitoring:
      enabled: true
      metrics:
        - cpu_usage
        - memory_usage
        - disk_usage
        - network_traffic
      thresholds:
        cpu_warning: 80
        cpu_critical: 95
        memory_warning: 85
        memory_critical: 95
    settings:
      enforce_all: true
      auto_update: true
      backup_enabled: true

# Execution settings
execution:
  skip_on_error: false
  fail_fast: false
  retry_on_failure: true
  max_retries: 3
  
# Security settings
security:
  firewall_check: true
  windows_defender_check: true
  skip_security_scans: false
  vulnerability_scanning: true
  malware_protection: true
  intrusion_detection: true
  automated_patching: true
  security_audit_logging: true
  compliance_checks:
    - CIS_Benchmark
    - NIST_800-53
    - ISO_27001
  
# Agent capabilities
capabilities:
  - firewall_management
  - windows_configuration
  - linux_configuration
  - network_security
  - system_monitoring
  - performance_optimization
  - automated_backup
  - log_aggregation
  - threat_detection
  - incident_response
  - compliance_reporting
  - automated_remediation

# Monitoring and Logging
monitoring:
  enabled: true
  interval_seconds: 60
  retention_days: 30
  log_level: INFO
  metrics:
    - system_health
    - security_events
    - performance_metrics
    - audit_logs
  alerting:
    enabled: true
    channels:
      - type: log
        level: WARNING
      - type: metrics
        threshold_based: true

# Backup and Recovery
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention_days: 7
  targets:
    - firewall_config
    - system_config
    - security_policies
  compression: true
  encryption: true

# Auto-remediation
auto_remediation:
  enabled: true
  actions:
    - name: restart_failed_services
      trigger: service_failure
      max_attempts: 3
    - name: clear_disk_space
      trigger: disk_usage_high
      threshold: 90
    - name: block_suspicious_ip
      trigger: security_alert
      severity: high

# Performance Optimization
performance:
  enabled: true
  auto_tune: true
  optimizations:
    - disk_cleanup
    - memory_optimization
    - network_tuning
    - service_optimization
