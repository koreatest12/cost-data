version: 2
updates:
  # =================================================================
  # [JAVA / MAVEN] API, Batch, Common Modules
  # =================================================================
  
  # 1. 루트 프로젝트 (Parent POM이 있는 경우)
  - package-ecosystem: "maven"
    directory: "/" 
    schedule:
      interval: "weekly"
    groups:
      spring-boot:
        patterns: ["org.springframework*", "io.micrometer*"]
    open-pull-requests-limit: 10

  # 2. 비용 데이터 API 서버
  - package-ecosystem: "maven"
    directory: "/api-server"  # <-- 실제 폴더명으로 수정
    schedule:
      interval: "daily"       # 중요도가 높으므로 매일 체크
    groups:
      spring-boot:
        patterns: ["org.springframework*", "io.micrometer*"]
  
  # 3. 비용 정산 배치(Batch) 모듈
  - package-ecosystem: "maven"
    directory: "/batch-processor" # <-- 실제 폴더명으로 수정
    schedule:
      interval: "weekly"

  # 4. 공통 라이브러리 (Common/Core)
  - package-ecosystem: "maven"
    directory: "/core-module" # <-- 실제 폴더명으로 수정
    schedule:
      interval: "weekly"

  # =================================================================
  # [PYTHON] Data Analysis & AI
  # =================================================================

  # 5. 비용 분석/통계 모듈
  - package-ecosystem: "pip"
    directory: "/data-analysis" # <-- 실제 폴더명으로 수정 (requirements.txt 위치)
    schedule:
      interval: "weekly"
    groups:
      data-science:
        patterns: ["pandas", "numpy", "scikit-learn"]

  # 6. AWS/Azure 클라우드 연동 스크립트
  - package-ecosystem: "pip"
    directory: "/cloud-scripts" # <-- 실제 폴더명으로 수정
    schedule:
      interval: "weekly"

  # =================================================================
  # [DOCKER] Infrastructure & Deployment
  # =================================================================

  # 7. 루트 레벨 Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # 8. 인프라 배포 설정 (Docker Compose 등)
  - package-ecosystem: "docker"
    directory: "/infra"       # <-- 실제 폴더명으로 수정
    schedule:
      interval: "weekly"

  # =================================================================
  # [GITHUB ACTIONS] CI/CD Workflows
  # =================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
