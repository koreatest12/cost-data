version: 2
updates:
  # 1. GitHub Actions (매일 확인)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  
  # 2. Maven (Java 마이크로서비스 - 매주 확인)
  - package-ecosystem: "maven"
    directory: "/" # Root POM 스캔
    schedule:
      interval: "weekly"
  
  # 3. Pip (Python 데이터 엔진 - 매주 확인)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
