def write_file(path, content):
    os.makedirs(os.path.dirname(path), exist_ok=True)
    if not os.path.exists(path): # 덮어쓰기 방지 (기존 코드 보호)
        with open(path, "w", encoding="utf-8") as f:
            f.write(content.strip())
        print(f"✅ [Created] {path}")
    else:
        print(f"⏩ [Exists] {path}")

def force_write_file(path, content):
    os.makedirs(os.path.dirname(path), exist_ok=True)
    with open(path, "w", encoding="utf-8") as f:
        f.write(content.strip())
    print(f"🔥 [Updated] {path}")

# ==============================================================================
# 1. Dependabot YAML 생성
# ==============================================================================
def generate_dependabot_config():
    force_write_file(os.path.join(GITHUB_DIR, "dependabot.yml"), DEPENDABOT_CONTENT)

# ==============================================================================
# 2. 구조 동기화 (Structure Sync)
# ==============================================================================
def sync_structure():
    print("\n🔄 Dependabot 설정에 따라 디렉토리 구조 및 필수 파일을 생성합니다...")

    # 정의된 경로와 생태계 매핑 (YAML 파싱 대신 하드코딩된 로직으로 안정성 확보)
    tasks = [
        # Root Level
        ("/", "npm"), ("/", "docker"), ("/", "devcontainers"),
        
        # Scripts
        ("/.github/scripts", "pip"),
        
        # Java Services (Maven & Docker)
        ("/services/omni-gateway", "maven"), ("/services/omni-gateway", "docker"),
        ("/services/omni-auth-service", "maven"), ("/services/omni-auth-service", "docker"),
        ("/services/omni-cost-service", "maven"), ("/services/omni-cost-service", "docker"),
        ("/services/omni-batch-service", "maven"), ("/services/omni-batch-service", "docker"),
        ("/services/omni-log-service", "maven"), ("/services/omni-log-service", "docker"),
        ("/services/omni-payment-service", "maven"), ("/services/omni-payment-service", "docker"),
        ("/services/omni-pokemon-web", "maven"), ("/services/omni-pokemon-web", "docker"),
        ("/services/omni-notification-service", "maven"), ("/services/omni-notification-service", "docker"),
        ("/services/omni-inventory-service", "maven"), ("/services/omni-inventory-service", "docker"),
        ("/services/omni-chat-service", "maven"), ("/services/omni-chat-service", "docker"),
        ("/services/omni-config-server", "maven"), ("/services/omni-config-server", "docker"),
        ("/services/omni-discovery-server", "maven"), ("/services/omni-discovery-server", "docker"),
        
        # AI & Data (Pip & Docker)
        ("/ai-model", "pip"), ("/ai-model", "docker"),
        ("/data-pipeline", "pip"), ("/data-pipeline", "docker"),
        
        # Frontend
        ("/frontend/dashboard", "npm"),
        
        # Infra
        ("/infra/terraform", "terraform"),
        ("/infra/docker/claude-agent", "docker")
    ]

    for directory, eco in tasks:
        # 절대 경로 계산 ('.' 제거)
        clean_dir = directory.lstrip("/")
        if clean_dir == "": clean_dir = "."
        full_path = os.path.join(BASE_DIR, clean_dir)
        
        # 디렉토리 생성
        os.makedirs(full_path, exist_ok=True)

        # 생태계별 필수 파일 생성 (없으면 Dependabot 에러 발생)
        if eco == "maven":
            write_file(os.path.join(full_path, "pom.xml"), f"""
<project xmlns="http://maven.apache.org/POM/4.0.0" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
    <modelVersion>4.0.0</modelVersion>
    <groupId>com.omni</groupId>
    <artifactId>{os.path.basename(clean_dir)}</artifactId>
    <version>0.0.1-SNAPSHOT</version>
    <parent>
        <groupId>org.springframework.boot</groupId>
        <artifactId>spring-boot-starter-parent</artifactId>
        <version>3.2.1</version>
        <relativePath/>
    </parent>
</project>
""")
        elif eco == "npm":
            write_file(os.path.join(full_path, "package.json"), f"""
{{
  "name": "{os.path.basename(clean_dir) or 'root'}",
  "version": "1.0.0",
  "dependencies": {{ "axios": "^1.6.0" }}
}}
""")
        elif eco == "pip":
            write_file(os.path.join(full_path, "requirements.txt"), "requests==2.31.0\npandas==2.1.0")
        
        elif eco == "docker":
            write_file(os.path.join(full_path, "Dockerfile"), "FROM eclipse-temurin:17-jdk-alpine\nENTRYPOINT [\"java\", \"-jar\", \"app.jar\"]")
            # Root에는 docker-compose.yml 생성
            if directory == "/":
                write_file(os.path.join(full_path, "docker-compose.yml"), "version: '3.8'\nservices:\n  app:\n    image: busybox")

        elif eco == "terraform":
            write_file(os.path.join(full_path, "main.tf"), """
terraform {
  required_providers {
    aws = { source = "hashicorp/aws", version = "~> 5.0" }
  }
}
""")
        elif eco == "devcontainers":
            write_file(os.path.join(full_path, ".devcontainer/devcontainer.json"), """
{
  "name": "Java & Python",
  "image": "mcr.microsoft.com/devcontainers/universal:2"
}
""")

# ==============================================================================
# 3. 🚀 Push Script
# ==============================================================================
def generate_push_script():
    script_path = os.path.join(BASE_DIR, "push_dependabot.sh")
    force_write_file(script_path, """
#!/bin/bash
echo "🚀 Syncing Dependabot Configuration & Project Structure..."
git config --global user.email "bot@omni.com"
git config --global user.name "Omni Bot"

git add .github/dependabot.yml
git add .
git commit -m "Chore: Apply Massive Dependabot Config & Create Missing Directories"
git push
echo "✅ Dependabot Sync Complete."
""")
    if os.name != 'nt': os.chmod(script_path, 0o755)

# ==============================================================================
# Main
# ==============================================================================
if __name__ == "__main__":
    print("🤖 Processing Dependabot Integration...")
    generate_dependabot_config()
    sync_structure()
    generate_push_script()
    
    print("\n✅ 모든 설정 및 폴더 구조 동기화 완료.")
    print("👉 './push_dependabot.sh' 를 실행하여 GitHub에 반영하세요.")
