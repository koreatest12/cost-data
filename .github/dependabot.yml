version: 2
updates:
  # GitHub Actions 업데이트
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python 메인 프로젝트 의존성
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # KCA Monitor 스크립트 의존성
  - package-ecosystem: "pip"
    directory: "/scripts/kca-monitor"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "kca-monitor"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Maven 의존성 (Spring Boot)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
      - "maven"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Omni Algo Service
  - package-ecosystem: "maven"
    directory: "/services/omni-algo-service"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
      - "algo-service"
    commit-message:
      prefix: "chore(deps-algo)"
      include: "scope"

  # Omni Cost Service
  - package-ecosystem: "maven"
    directory: "/services/omni-cost-service"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
      - "cost-service"
    commit-message:
      prefix: "chore(deps-cost)"
      include: "scope"

  # Omni Job Service
  - package-ecosystem: "maven"
    directory: "/services/omni-job-service"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
      - "job-service"
    commit-message:
      prefix: "chore(deps-job)"
      include: "scope"

  # Omni Security Service
  - package-ecosystem: "maven"
    directory: "/services/omni-security-service"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
      - "security-service"
    commit-message:
      prefix: "chore(deps-security)"
      include: "scope"

  # Docker 베이스 이미지 업데이트
  - package-ecosystem: "docker"
    directory: "/services/omni-algo-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
      - "algo-service"
    commit-message:
      prefix: "chore(docker-algo)"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/services/omni-cost-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
      - "cost-service"
    commit-message:
      prefix: "chore(docker-cost)"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/services/omni-job-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
      - "job-service"
    commit-message:
      prefix: "chore(docker-job)"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/services/omni-security-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
      - "security-service"
    commit-message:
      prefix: "chore(docker-security)"
      include: "scope"
