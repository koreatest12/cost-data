version: 2

updates:
  # -------------------------------------------------------------
  # 1. 인프라 및 CI/CD (가장 중요 & 긴급)
  # -------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 99
    labels:
      - "actions"
      - "urgent"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    labels:
      - "docker"
      - "infrastructure"

  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    labels:
      - "terraform"

  # -------------------------------------------------------------
  # 2. 백엔드 (Java, Python, Go - 병렬 처리)
  # -------------------------------------------------------------
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    labels:
      - "java"
      - "maven"
      - "backend"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    labels:
      - "java"
      - "gradle"
      - "backend"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    labels:
      - "python"
      - "backend"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    labels:
      - "go"
      - "backend"

  # -------------------------------------------------------------
  # 3. 프론트엔드 (Node.js)
  # -------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    labels:
      - "javascript"
      - "frontend"
