version: 2

updates:
  # -------------------------------------------------------------
  # 1. GitHub Actions (CI/CD 파이프라인 대량 업데이트)
  # -------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 99
    labels:
      - "actions"
      - "massive-update"

  # -------------------------------------------------------------
  # 2. Python (AI, 데이터 분석)
  # -------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 99
    labels:
      - "python"
      - "dependencies"

  # -------------------------------------------------------------
  # 3. Docker (컨테이너 인프라)
  # -------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    labels:
      - "docker"
      - "infrastructure"

  # -------------------------------------------------------------
  # 4. Java / Maven / Gradle (백엔드)
  # -------------------------------------------------------------
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    labels:
      - "java"
      - "backend"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    labels:
      - "java"
      - "gradle"

  # -------------------------------------------------------------
  # 5. Terraform (IaC)
  # -------------------------------------------------------------
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    labels:
      - "terraform"
      - "cloud"
