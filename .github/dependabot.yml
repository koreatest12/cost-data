version: 2
updates:
  # ======================================================
  # [Group 1] Java & Maven 서비스 (API, Batch, Admin)
  # ======================================================
  
  # 1. 메인 API 서버 (api-server 폴더)
  - package-ecosystem: "maven"
    directory: "/api-server"
    schedule:
      interval: "daily"
    groups: # 스프링 부트 관련 패키지는 1개의 PR로 묶음
      spring-boot:
        patterns:
          - "org.springframework*"
          - "io.micrometer*"
    open-pull-requests-limit: 10

  # 2. 어드민 웹 (admin-web 폴더)
  - package-ecosystem: "maven"
    directory: "/admin-web"
    schedule:
      interval: "weekly"
    groups:
      spring-dependencies:
        patterns:
          - "org.springframework*"
    open-pull-requests-limit: 5

  # 3. 배치 작업 (batch 폴더)
  - package-ecosystem: "maven"
    directory: "/batch"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # ======================================================
  # [Group 2] Python 서비스 (AI, Data)
  # ======================================================

  # 4. 데이터 프로세서 (data-processor 폴더)
  - package-ecosystem: "pip"
    directory: "/data-processor"
    schedule:
      interval: "weekly"
    groups:
      data-science: # numpy, pandas 등 데이터 관련 패키지 그룹화
        patterns:
          - "numpy"
          - "pandas"
    open-pull-requests-limit: 5

  # 5. AI 모델 서빙 (ai-model 폴더)
  - package-ecosystem: "pip"
    directory: "/ai-model"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # ======================================================
  # [Group 3] Docker 인프라 및 컨테이너
  # ======================================================

  # 6. 인프라 공통 도커파일 (infra 폴더)
  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "weekly"
  
  # 7. API 서버 내의 도커파일 (api-server 폴더 내)
  - package-ecosystem: "docker"
    directory: "/api-server"
    schedule:
      interval: "weekly"

  # ======================================================
  # [Group 4] CI/CD 워크플로우 (GitHub Actions)
  # ======================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
