version: 2
updates:
  # =================================================================
  # [GLOBAL] GitHub Actions (CI/CD Workflows)
  # Claude Code 워크플로우(.github/workflows/*.yml)에서 사용하는
  # actions/checkout, gh-cli 등의 버전을 자동으로 관리합니다.
  # =================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily" # CI 도구는 보안이 중요하므로 매일 체크
      time: "09:00"
      timezone: "Asia/Seoul"
    labels:
      - "ci"
      - "actions"
      - "claude-automation"
    commit-message:
      prefix: "ci(actions)"
      include: "scope"

  # =================================================================
  # [ROOT] Dev Tools & Claude Code CLI (NPM)
  # 루트 레벨의 package.json에서 Claude Code나 Husky 등을 관리할 경우 대비
  # =================================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    groups:
      claude-tools:
        patterns: ["@anthropic-ai/*", "claude-code*"]
      dev-tools:
        patterns: ["husky", "lint-staged", "prettier", "eslint"]
    labels: ["devtools", "javascript"]
    commit-message:
      prefix: "chore(deps)"

  # =================================================================
  # [JAVA / MAVEN] MSA Core Microservices
  # 공통 적용: 그룹화 강화, 커밋 메시지 통일, PR 제한 설정
  # =================================================================
  
  # 1. API Gateway
  - package-ecosystem: "maven"
    directory: "/services/omni-gateway"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*", "org.springframework.cloud*"]
      testing:
        patterns: ["org.junit*", "org.mockito*", "org.assertj*"]
      utils:
        patterns: ["org.projectlombok*", "org.slf4j*", "ch.qos.logback*"]
    labels: ["backend", "gateway"]
    commit-message:
      prefix: "build(deps)"

  # 2. 인증 서비스 (Auth)
  - package-ecosystem: "maven"
    directory: "/services/omni-auth-service"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*", "io.jsonwebtoken*"]
      testing:
        patterns: ["org.junit*", "org.mockito*"]
    labels: ["backend", "auth"]
    commit-message:
      prefix: "build(deps)"

  # 3. 비용 핵심 서비스 (Cost Core - Critical)
  - package-ecosystem: "maven"
    directory: "/services/omni-cost-service"
    schedule:
      interval: "daily" # 핵심 서비스는 매일 확인
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10 # 중요하므로 제한을 넉넉하게
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*", "io.micrometer*"]
      testing:
        patterns: ["org.junit*", "org.mockito*"]
    labels: ["backend", "core", "urgent"]
    reviewers: # [예시] 핵심 서비스는 리뷰어 강제 지정 권장
      - "backend-lead" 
    commit-message:
      prefix: "build(deps)"

  # 4. 배치 서비스 (Batch)
  - package-ecosystem: "maven"
    directory: "/services/omni-batch-service"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*", "org.springframework.batch*"]
      testing:
        patterns: ["org.junit*", "org.mockito*"]
    labels: ["backend", "batch"]
    commit-message:
      prefix: "build(deps)"

  # 5. 로그 수집 서비스 (Log)
  - package-ecosystem: "maven"
    directory: "/services/omni-log-service"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]
      testing:
        patterns: ["org.junit*", "org.mockito*"]
    labels: ["backend", "logging"]
    commit-message:
      prefix: "build(deps)"

  # 6. 결제 서비스 (Payment)
  - package-ecosystem: "maven"
    directory: "/services/omni-payment-service"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]
      testing:
        patterns: ["org.junit*", "org.mockito*"]
    labels: ["backend", "payment"]
    commit-message:
      prefix: "build(deps)"

  # 7. 포켓몬 IV 매니저 웹
  - package-ecosystem: "maven"
    directory: "/services/omni-pokemon-web"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*", "jakarta.*"]
      testing:
        patterns: ["org.junit*", "org.mockito*"]
    labels: ["backend", "pokemon"]
    commit-message:
      prefix: "build(deps)"

  # 8. 알림 서비스 (Notification)
  - package-ecosystem: "maven"
    directory: "/services/omni-notification-service"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]
    labels: ["backend", "notification"]
    commit-message:
      prefix: "build(deps)"

  # 9. 재고 관리 서비스 (Inventory)
  - package-ecosystem: "maven"
    directory: "/services/omni-inventory-service"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]
    labels: ["backend", "inventory"]
    commit-message:
      prefix: "build(deps)"

  # 10. 채팅 서비스 (Chat)
  - package-ecosystem: "maven"
    directory: "/services/omni-chat-service"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]
    labels: ["backend", "chat"]
    commit-message:
      prefix: "build(deps)"

  # 11. 설정 서버 (Config)
  - package-ecosystem: "maven"
    directory: "/services/omni-config-server"
    schedule:
      interval: "monthly"
      timezone: "Asia/Seoul"
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]
    labels: ["backend", "infra"]
    commit-message:
      prefix: "build(deps)"

  # 12. 디스커버리 서버 (Discovery)
  - package-ecosystem: "maven"
    directory: "/services/omni-discovery-server"
    schedule:
      interval: "monthly"
      timezone: "Asia/Seoul"
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]
    labels: ["backend", "infra"]
    commit-message:
      prefix: "build(deps)"

  # =================================================================
  # [PYTHON / PIP] AI & Data Science & Claude Automation
  # Claude SDK 및 AI 관련 라이브러리 집중 관리
  # =================================================================

  # 13. AI 모델 서비스 (Claude SDK 포함)
  - package-ecosystem: "pip"
    directory: "/ai-model"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    groups:
      claude-sdk: # [New] Claude 및 LLM SDK 그룹
        patterns: ["anthropic*", "langchain*", "openai*"]
      ai-core:
        patterns: ["pandas", "numpy", "scikit-learn", "torch", "tensorflow"]
      api-framework:
        patterns: ["fastapi", "uvicorn", "pydantic"]
      testing:
        patterns: ["pytest*", "mock*"]
    labels: ["ai", "python", "claude"]
    commit-message:
      prefix: "chore(python)"

  # 14. 데이터 파이프라인
  - package-ecosystem: "pip"
    directory: "/data-pipeline"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    labels: ["data", "etl"]
    commit-message:
      prefix: "chore(python)"

  # =================================================================
  # [NPM / JS] Frontend
  # =================================================================

  # 15. 통합 대시보드
  - package-ecosystem: "npm"
    directory: "/frontend/dashboard"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      react-core:
        patterns: ["react", "react-dom", "next"]
      ui-libs:
        patterns: ["@mui/*", "tailwindcss", "framer-motion"]
      testing:
        patterns: ["jest*", "@testing-library/*"]
    labels: ["frontend", "javascript"]
    commit-message:
      prefix: "chore(frontend)"

  # =================================================================
  # [TERRAFORM] Infra
  # AWS Bedrock(Claude) 관련 리소스 관리를 위해 중요
  # =================================================================

  # 16. AWS 인프라
  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    groups: # [New] AWS Provider 그룹화
      aws-provider:
        patterns: ["hashicorp/aws"]
    labels: ["infra", "terraform"]
    commit-message:
      prefix: "chore(infra)"

  # =================================================================
  # [DOCKER] Container Images
  # Claude Automation Agent용 컨테이너 이미지 관리 추가
  # =================================================================
  
  # [New] Claude Automation Agent (CI/CD용 컨테이너)
  # 만약 .github/actions/setup-claude 에서 커스텀 이미지를 쓴다면 유용함
  - package-ecosystem: "docker"
    directory: "/infra/docker/claude-agent" # (가정된 경로)
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    labels: ["docker", "ci-agent"]
    commit-message:
      prefix: "chore(docker-agent)"

  # Core Services Docker
  - package-ecosystem: "docker"
    directory: "/services/omni-gateway"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/services/omni-auth-service"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/services/omni-cost-service"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/services/omni-batch-service"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/services/omni-log-service"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/services/omni-payment-service"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/services/omni-pokemon-web"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(docker)"

  # Extension Services Docker
  - package-ecosystem: "docker"
    directory: "/services/omni-notification-service"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/services/omni-inventory-service"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/services/omni-chat-service"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(docker)"

  # Infra Services Docker (Monthly)
  - package-ecosystem: "docker"
    directory: "/services/omni-config-server"
    schedule:
      interval: "monthly"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/services/omni-discovery-server"
    schedule:
      interval: "monthly"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(docker)"

  # AI & Data Docker
  - package-ecosystem: "docker"
    directory: "/ai-model"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/data-pipeline"
    schedule:
      interval: "weekly"
      timezone: "Asia/Seoul"
    commit-message:
      prefix: "chore(docker)"
