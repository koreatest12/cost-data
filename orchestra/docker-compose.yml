---
# Ansible AWX (Orchestra Server) - Docker Compose Configuration
# AWX는 Ansible의 오픈소스 웹 기반 오케스트레이션 도구입니다.

version: '3.8'

services:
  # PostgreSQL Database for AWX
  postgres:
    image: postgres:13
    container_name: awx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: awx
      POSTGRES_USER: awx
      POSTGRES_PASSWORD: ${AWX_DB_PASSWORD:-awxpass}  # CHANGE THIS in production!
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    networks:
      - awx_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awx"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for AWX caching and message broker
  redis:
    image: redis:7
    container_name: awx_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - awx_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AWX Web Application
  awx_web:
    image: ansible/awx:24.6.1  # Pinned version for stability
    container_name: awx_web
    restart: unless-stopped
    hostname: awx
    user: "0"  # Note: AWX requires root, but consider security implications in production
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: awx
      DATABASE_USER: awx
      DATABASE_PASSWORD: ${AWX_DB_PASSWORD:-awxpass}  # Use env var in production
      SECRET_KEY: ${AWX_SECRET_KEY:-awxsecret123456789}  # CHANGE THIS in production!
      AWX_ADMIN_USER: ${AWX_ADMIN_USER:-admin}
      AWX_ADMIN_PASSWORD: ${AWX_ADMIN_PASSWORD:-admin}  # CHANGE THIS in production!
    ports:
      - "8080:8052"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - awx_projects:/var/lib/awx/projects
      - awx_data:/var/lib/awx
    networks:
      - awx_network

  # AWX Task Executor
  awx_task:
    image: ansible/awx:24.6.1  # Pinned version for stability
    container_name: awx_task
    restart: unless-stopped
    hostname: awx
    user: "0"  # Note: AWX requires root, but consider security implications in production
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: awx
      DATABASE_USER: awx
      DATABASE_PASSWORD: ${AWX_DB_PASSWORD:-awxpass}  # Use env var in production
      SECRET_KEY: ${AWX_SECRET_KEY:-awxsecret123456789}  # CHANGE THIS in production!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - awx_projects:/var/lib/awx/projects
      - awx_data:/var/lib/awx
    networks:
      - awx_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  awx_projects:
    driver: local
  awx_data:
    driver: local

networks:
  awx_network:
    driver: bridge
