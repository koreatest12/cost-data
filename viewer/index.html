<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Intelligence SOC Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        async function loadData() {
            try {
                const idxRes = await fetch('../data/news/news_index.json');
                const idxData = await idxRes.json();
                const today = idxData.dates[0];
                
                document.getElementById('last-update').innerText = idxData.last_updated;
                document.getElementById('total-threats').innerText = today.total;
                
                const newsRes = await fetch(`../data/news/news_${today.date}.json`);
                const newsData = await newsRes.json();
                
                const list = document.getElementById('news-list');
                list.innerHTML = newsData.articles.map(n => `
                    <div class="bg-gray-800 p-4 rounded-lg border-l-4 ${n.category==='global'?'border-blue-500':'border-red-500'} hover:bg-gray-750 transition">
                        <div class="flex justify-between text-xs text-gray-400 mb-1">
                            <span class="font-bold text-white uppercase">${n.source}</span>
                            <span>${n.date}</span>
                        </div>
                        <a href="${n.link}" target="_blank" class="text-lg font-semibold text-blue-300 hover:text-blue-100">${n.title}</a>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }
        window.onload = loadData;
    </script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                    <i class="fas fa-shield-alt mr-2"></i>Omni-Intelligence SOC
                </h1>
                <p class="text-gray-400 mt-1">Real-time Global Threat Intelligence</p>
            </div>
            <div class="text-right">
                <div class="text-sm text-gray-500">Last Updated</div>
                <div id="last-update" class="font-mono text-green-400">Syncing...</div>
            </div>
        </header>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
                <div class="text-gray-400 mb-2">Total Threats Collected</div>
                <div id="total-threats" class="text-4xl font-bold text-white">0</div>
            </div>
            </div>
        <div id="news-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>
</body>
</html>
