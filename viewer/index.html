<!DOCTYPE html>
<html>
<head>
    <title>Omni-SOC Hyper Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        async function load() {
            const res = await fetch('../data/news/news_index.json');
            const idx = await res.json();
            const today = idx.dates[0];
            
            document.getElementById('total').innerText = today.total;
            document.getElementById('portal').innerText = today.details['PORTAL_KEYWORD'] || 0;
            document.getElementById('cloud').innerText = today.details['CLOUD_&_VENDOR'] || 0;
            
            const nRes = await fetch(`../data/news/news_${today.date}.json`);
            const data = await nRes.json();
            
            document.getElementById('list').innerHTML = data.articles.map(n => `
                <div class="bg-gray-800 p-3 rounded border-l-4 ${n.category.includes('PORTAL') ? 'border-green-500' : 'border-blue-500'} mb-2">
                    <span class="text-xs text-gray-400">[${n.source}]</span>
                    <a href="${n.link}" target="_blank" class="block font-bold text-white hover:text-blue-300">${n.title}</a>
                </div>
            `).join('');
        }
        window.onload = load;
    </script>
</head>
<body class="bg-black text-white p-6">
    <h1 class="text-3xl font-bold mb-6 text-blue-500"><i class="fas fa-satellite-dish"></i> Hyper-Scale SOC</h1>
    <div class="grid grid-cols-3 gap-4 mb-6 text-center">
        <div class="bg-gray-900 p-4 rounded border border-gray-700">
            <div class="text-gray-500">Total Intel</div>
            <div id="total" class="text-3xl font-bold">0</div>
        </div>
        <div class="bg-gray-900 p-4 rounded border border-gray-700">
            <div class="text-green-500">Naver/Portal</div>
            <div id="portal" class="text-3xl font-bold">0</div>
        </div>
        <div class="bg-gray-900 p-4 rounded border border-gray-700">
            <div class="text-purple-500">Cloud/Vendor</div>
            <div id="cloud" class="text-3xl font-bold">0</div>
        </div>
    </div>
    <div id="list"></div>
</body>
</html>
