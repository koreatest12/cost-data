<!DOCTYPE html>
<html>
<head>
    <title>Gemini Hyper-Scale SOC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        async function load() {
            const res = await fetch('../data/news/news_index.json');
            const idx = await res.json();
            const today = idx.dates[0];
            
            document.getElementById('total').innerText = today.total;
            document.getElementById('portal').innerText = today.details['PORTAL_KEYWORD'] || 0;
            document.getElementById('global').innerText = today.details['GLOBAL_TIER_1'] || 0;
            document.getElementById('cloud').innerText = today.details['CLOUD_&_VENDOR'] || 0;
            
            const nRes = await fetch(`../data/news/news_${today.date}.json`);
            const data = await nRes.json();
            
            document.getElementById('list').innerHTML = data.articles.map(n => `
                <div class="bg-gray-800 p-4 rounded-lg border-l-4 ${
                    n.category.includes('PORTAL') ? 'border-green-500' : 
                    n.category.includes('GLOBAL') ? 'border-blue-500' :
                    n.category.includes('CLOUD') ? 'border-purple-500' : 'border-red-500'
                } mb-3 shadow-md hover:bg-gray-700 transition">
                    <div class="flex justify-between text-xs text-gray-400 mb-1">
                        <span class="font-bold uppercase tracking-wide text-white">${n.source}</span>
                        <span>${n.date}</span>
                    </div>
                    <a href="${n.link}" target="_blank" class="block text-lg font-bold text-blue-300 hover:text-blue-100">${n.title}</a>
                </div>
            `).join('');
        }
        window.onload = load;
    </script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6 font-sans">
    <header class="flex items-center justify-between mb-8 border-b border-slate-700 pb-4">
        <h1 class="text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
            <i class="fas fa-globe-asia mr-3"></i>Gemini Hyper-Scale SOC
        </h1>
        <span class="bg-blue-600 text-xs font-bold px-3 py-1 rounded-full">SYSTEM ACTIVE</span>
    </header>
    
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 text-center">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
            <div class="text-slate-400 text-sm uppercase">Total Intelligence</div>
            <div id="total" class="text-5xl font-bold text-white mt-2">0</div>
        </div>
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
            <div class="text-green-400 text-sm uppercase">Portal/Search</div>
            <div id="portal" class="text-4xl font-bold text-green-400 mt-2">0</div>
        </div>
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
            <div class="text-blue-400 text-sm uppercase">Global Tier-1</div>
            <div id="global" class="text-4xl font-bold text-blue-400 mt-2">0</div>
        </div>
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
            <div class="text-purple-400 text-sm uppercase">Cloud & Vendor</div>
            <div id="cloud" class="text-4xl font-bold text-purple-400 mt-2">0</div>
        </div>
    </div>
    
    <div id="list" class="grid grid-cols-1 xl:grid-cols-2 gap-4"></div>
</body>
</html>
