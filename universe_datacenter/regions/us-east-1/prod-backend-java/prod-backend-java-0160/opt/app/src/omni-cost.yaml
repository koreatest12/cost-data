apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-cost
spec:
  replicas: 3
  selector:
    matchLabels:
      app: omni-cost
  template:
    metadata:
      labels:
        app: omni-cost
    spec:
      containers:
      - name: app
        image: ghcr.io/koreatest12/cost-data/omni-cost-service:latest
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
